# INERT FIXTURE — NOT a Phil Actions workflow. For a separate approved disposable repo only.
name: W3 probe MAIN_ONLY DEFAULT_V1
on:
  push:
    branches: [main]
permissions: {}
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Emit strictly typed event metadata (no checkout or secrets)
        shell: bash
        env:
          WITNESS_KIND: MAIN_ONLY
          SOURCE_MARKER: DEFAULT_V1
          EVENT_NAME: "${{ github.event_name }}"
          EVENT_REF: "${{ github.event.ref }}"
          EVENT_REF_TYPE_JSON: "${{ toJSON(github.event.ref_type) }}"
          EVENT_CREATED_JSON: "${{ toJSON(github.event.created) }}"
          EVENT_DELETED_JSON: "${{ toJSON(github.event.deleted) }}"
          GITHUB_EVENT_REF: "${{ github.ref }}"
          GITHUB_EVENT_SHA: "${{ github.sha }}"
          GITHUB_RUN_IDENTIFIER: "${{ github.run_id }}"
          GITHUB_EVENT_ACTOR: "${{ github.actor }}"
          WORKFLOW_SOURCE_REF: "${{ github.workflow_ref }}"
        run: |
          python3 - <<'PY'
          import json, os
          def event_boolean(key):
              raw = os.environ[key]
              if raw not in ("true", "false", "null"):
                  raise ValueError("noncanonical event flag")
              return json.loads(raw)
          ref_type = json.loads(os.environ["EVENT_REF_TYPE_JSON"])
          if ref_type not in ("branch", "tag", None):
              raise ValueError("noncanonical event ref type")
          witness = {
              "schema": "PHIL-W3-SELECTOR-WITNESS-V2",
              "variant": os.environ["WITNESS_KIND"],
              "source_marker": os.environ["SOURCE_MARKER"],
              "event_name": os.environ["EVENT_NAME"],
              "event_ref": os.environ["EVENT_REF"],
              "event_ref_type": ref_type,
              "event_created": event_boolean("EVENT_CREATED_JSON"),
              "event_deleted": event_boolean("EVENT_DELETED_JSON"),
              "github_ref": os.environ["GITHUB_EVENT_REF"],
              "github_sha": os.environ["GITHUB_EVENT_SHA"],
              "run_id": os.environ["GITHUB_RUN_IDENTIFIER"],
              "actor": os.environ["GITHUB_EVENT_ACTOR"],
              "workflow_ref": os.environ["WORKFLOW_SOURCE_REF"],
          }
          print("W3_WITNESS_JSON:" + json.dumps(witness, sort_keys=True, separators=(",", ":")))
          PY
