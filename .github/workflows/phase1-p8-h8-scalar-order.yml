name: Phase 1 P8-H8 pure scalar and stream order

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/P8UnicodeUtf8Model.v'
      - 'proof/Phil/Verification/P8D1UnicodeStreamModel.v'
      - 'proof/Phil/Verification/P8D2StructuralOrderModel.v'
      - 'proof/Phil/Verification/P8H8UnicodeScalarOrder.v'
      - 'docs/phase-1/p8-h8-scalar-order-v1.md'
      - '.github/workflows/phase1-p8-h8-scalar-order.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Verification/P8UnicodeUtf8Model.v'
      - 'proof/Phil/Verification/P8D1UnicodeStreamModel.v'
      - 'proof/Phil/Verification/P8D2StructuralOrderModel.v'
      - 'proof/Phil/Verification/P8H8UnicodeScalarOrder.v'
      - 'docs/phase-1/p8-h8-scalar-order-v1.md'
      - '.github/workflows/phase1-p8-h8-scalar-order.yml'

permissions:
  contents: read

jobs:
  rocq-scalar-and-stream-order:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject new axioms and incomplete proof declarations
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Admitted|admit|Abort)[[:space:].]' proof/Phil/Verification/P8H8UnicodeScalarOrder.v; then
            echo 'H8 may not add axioms, parameters or admitted proofs' >&2
            exit 1
          fi
      - name: Compile full unchanged C1 D1 D2 plus H8, check every object and hash
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq -v
          : > /tmp/p8-h8-assumptions.log
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8H8UnicodeScalarOrder; do
            rocq c -Q proof/Phil Phil "proof/Phil/Verification/$name.v" | tee -a /tmp/p8-h8-assumptions.log
          done
          count="$(grep -c 'Closed under the global context' /tmp/p8-h8-assumptions.log || true)"
          test "$count" -ge 16 || { echo "Only $count/16 closed assumption reports" >&2; exit 1; }
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8H8UnicodeScalarOrder; do
            rocq check -Q proof/Phil Phil "Phil.Verification.$name"
          done
          git -c safe.directory="$PWD" rev-parse HEAD
          sha256sum \
            proof/Phil/Verification/P8UnicodeUtf8Model.v \
            proof/Phil/Verification/P8D1UnicodeStreamModel.v \
            proof/Phil/Verification/P8D2StructuralOrderModel.v \
            proof/Phil/Verification/P8H8UnicodeScalarOrder.v \
            proof/Phil/Verification/P8UnicodeUtf8Model.vo \
            proof/Phil/Verification/P8D1UnicodeStreamModel.vo \
            proof/Phil/Verification/P8D2StructuralOrderModel.vo \
            proof/Phil/Verification/P8H8UnicodeScalarOrder.vo \
            /tmp/p8-h8-assumptions.log
