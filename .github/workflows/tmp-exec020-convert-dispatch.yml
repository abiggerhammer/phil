name: Temporary EXEC-020 convert dispatch fix

on:
  push:
    branches: [phase1-exec-020-explicit-numeric-conversions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-exec-020-explicit-numeric-conversions
      - name: Add convert to command-start dispatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Phil/Surface/GrammarV1/Parser.hs')
          text = path.read_text()
          old = '      , "commit_receive", "reject", "fail", "close", "release", "transport"\n      , "accept", "prove"\n'
          new = '      , "commit_receive", "reject", "fail", "close", "release", "convert", "transport"\n      , "accept", "prove"\n'
          count = text.count(old)
          if count == 0 and '"release", "convert", "transport"' in text:
              print('convert dispatch already present; no patch needed')
          elif count != 1:
              raise SystemExit(f'expected exactly one command-start anchor, found {count}')
          else:
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit parser routing fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add src/Phil/Surface/GrammarV1/Parser.hs
          git commit -m "phase1: route convert through command parser"
          git push origin HEAD:phase1-exec-020-explicit-numeric-conversions
