name: Phase 1 Boundary Subject Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/DataSubject.v'
      - 'proof/Phil/Core/BoundarySubject.v'
      - 'docs/phase-1/boundary-subject-proof-v1.md'
      - '.github/workflows/phase1-boundary-subject-proofs.yml'
      - 'src/Phil/Systems/EvidenceSubjectTransfer.hs'
      - 'src/Phil/Systems/BoundaryTargetRelation.hs'
      - 'test/Phase1EvidenceSubjectTransferMain.hs'
      - 'test/Phase1BoundaryTargetRelationMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/DataSubject.v'
      - 'proof/Phil/Core/BoundarySubject.v'
      - 'docs/phase-1/boundary-subject-proof-v1.md'
      - '.github/workflows/phase1-boundary-subject-proofs.yml'
      - 'src/Phil/Systems/EvidenceSubjectTransfer.hs'
      - 'src/Phil/Systems/BoundaryTargetRelation.hs'
      - 'test/Phase1EvidenceSubjectTransferMain.hs'
      - 'test/Phase1BoundaryTargetRelationMain.hs'

permissions:
  contents: read

jobs:
  rocq-boundary-subject-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile certified DATA-SUBJECT predecessor and PHIL-BND-SUBJECT-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataSubject.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundarySubject.v
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boundary-subject-proof
          cp \
            proof/Phil/Core/DataSubject.v \
            proof/Phil/Core/BoundarySubject.v \
            proof/Phil/Core/BoundarySubject.vo \
            boundary-subject-proof/
          sha256sum \
            proof/Phil/Core/DataSubject.v \
            proof/Phil/Core/BoundarySubject.v \
            proof/Phil/Core/BoundarySubject.vo \
            > boundary-subject-proof/PHIL-BND-SUBJECT-001.proof.sha256
          {
            echo 'obligation=PHIL-BND-SUBJECT-001'
            echo 'evidence=Rocq-9.2.0'
            cat boundary-subject-proof/PHIL-BND-SUBJECT-001.proof.sha256
          } > boundary-subject-proof/PHIL-BND-SUBJECT-001.proof-certificate.txt
          cat boundary-subject-proof/PHIL-BND-SUBJECT-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-boundary-subject-proof
          path: boundary-subject-proof
          if-no-files-found: error

  verify-boundary-subject-correspondence:
    needs: rocq-boundary-subject-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck BND-012 and BND-013 production relations
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/EvidenceSubjectTransfer.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/BoundaryTargetRelation.hs
      - name: Strict typecheck unchanged 15-case correspondence corpus
        run: |
          set -euo pipefail
          # Phase1EvidenceSubjectTransferMain transitively compiles the existing
          # SYS-009/010 correspondence modules, whose pre-existing warning debt
          # is tracked separately: ProtocolStateCorrespondence name shadowing
          # and BoundaryCommitCorrespondence's redundant Set type import.
          cabal exec -- ghc -isrc -Wall -Werror -Wno-name-shadowing -Wno-unused-imports -fno-code test/Phase1EvidenceSubjectTransferMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1BoundaryTargetRelationMain.hs
      - name: Re-run unchanged BND-012 and BND-013 correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -Wno-name-shadowing -Wno-unused-imports -isrc test/Phase1EvidenceSubjectTransferMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1BoundaryTargetRelationMain.hs
