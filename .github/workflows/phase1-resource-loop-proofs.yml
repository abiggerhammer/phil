name: Phase 1 Resource Loop Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ResourceLoop.v'
      - 'proof/Phil/Core/ResourceLoopImplementation.v'
      - 'proof/Phil/Core/ResourceLoopImplementationExtraction.v'
      - 'app/ResourceLoopDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-loop-proof-v1.md'
      - 'docs/phase-1/resource-loop-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-loop-proofs.yml'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'src/Phil/Core/Value.hs'
      - 'test/Phase1LoopStateProjectionMain.hs'
      - 'test/Phase1PropositionalStateTransportMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ResourceLoop.v'
      - 'proof/Phil/Core/ResourceLoopImplementation.v'
      - 'proof/Phil/Core/ResourceLoopImplementationExtraction.v'
      - 'app/ResourceLoopDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-loop-proof-v1.md'
      - 'docs/phase-1/resource-loop-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-loop-proofs.yml'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'src/Phil/Core/Value.hs'
      - 'test/Phase1LoopStateProjectionMain.hs'
      - 'test/Phase1PropositionalStateTransportMain.hs'

permissions:
  contents: read

jobs:
  rocq-resource-loop-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-RES-LOOP-001 proof and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceLoop.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceLoopImplementation.v
          rm -f ResourceLoopKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceLoopImplementationExtraction.v
          test -s ResourceLoopKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resource-loop-proof
          cp \
            proof/Phil/Core/ResourceLoop.v \
            proof/Phil/Core/ResourceLoop.vo \
            proof/Phil/Core/ResourceLoopImplementation.v \
            proof/Phil/Core/ResourceLoopImplementation.vo \
            ResourceLoopKernel.hs \
            resource-loop-proof/
          sha256sum \
            proof/Phil/Core/ResourceLoop.v \
            proof/Phil/Core/ResourceLoop.vo \
            proof/Phil/Core/ResourceLoopImplementation.v \
            proof/Phil/Core/ResourceLoopImplementation.vo \
            ResourceLoopKernel.hs \
            > resource-loop-proof/PHIL-RES-LOOP-001.proof.sha256
          {
            echo 'obligation=PHIL-RES-LOOP-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat resource-loop-proof/PHIL-RES-LOOP-001.proof.sha256
          } > resource-loop-proof/PHIL-RES-LOOP-001.proof-certificate.txt
          cat resource-loop-proof/PHIL-RES-LOOP-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-resource-loop-proof
          path: resource-loop-proof
          if-no-files-found: error

  verify-resource-loop-correspondence:
    needs: rocq-resource-loop-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - uses: actions/download-artifact@v4
        with:
          name: rocq-resource-loop-proof
          path: resource-loop-proof
      - name: Check and execute extracted Resource Loop controls
        shell: bash
        run: |
          set -euo pipefail
          cp resource-loop-proof/ResourceLoopKernel.hs ResourceLoopKernel.hs
          ghc -Wall -Werror -fno-code ResourceLoopKernel.hs
          ghc -i. -Wall -Werror -fno-code app/ResourceLoopDecisionCorrespondenceMain.hs
          runghc -i. app/ResourceLoopDecisionCorrespondenceMain.hs
          sha256sum ResourceLoopKernel.hs
      - name: Typecheck unchanged RES-009/010 implementation paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/ControlStateProjection.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Value.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1LoopStateProjectionMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1PropositionalStateTransportMain.hs
      - name: Re-run unchanged RES-009/010 correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1LoopStateProjectionMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1PropositionalStateTransportMain.hs
