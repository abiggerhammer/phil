name: Phase 1 Protocol Progression Guard Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ProtocolProgressionGuard.v'
      - 'proof/Phil/Core/ProtocolProgressionGuardImplementation.v'
      - 'proof/Phil/Core/ProtocolProgressionGuardImplementationExtraction.v'
      - 'proof/Phil/Core/ProtocolIdentity.v'
      - 'src/ProtocolProgressionGuardKernel.hs'
      - 'src/Phil/Core/Protocol.hs'
      - 'src/Phil/Assurance/ProtocolGuard.hs'
      - 'test/Phase1ProtocolStaleEndpointMain.hs'
      - 'test/Phase1ProtocolGuardedTransitionMain.hs'
      - 'app/ProtocolProgressionGuardDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/protocol-stale-endpoint-v1.md'
      - 'docs/phase-1/protocol-guarded-transition-v1.md'
      - 'docs/phase-1/protocol-progression-guard-proof-v1.md'
      - 'docs/phase-1/protocol-progression-guard-implementation-refinement-v1.md'
      - 'docs/phase-1/protocol-progression-guard-production-binding-v1.md'
      - '.github/workflows/phase1-protocol-progression-guard-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ProtocolProgressionGuard.v'
      - 'proof/Phil/Core/ProtocolProgressionGuardImplementation.v'
      - 'proof/Phil/Core/ProtocolProgressionGuardImplementationExtraction.v'
      - 'proof/Phil/Core/ProtocolIdentity.v'
      - 'src/ProtocolProgressionGuardKernel.hs'
      - 'src/Phil/Core/Protocol.hs'
      - 'src/Phil/Assurance/ProtocolGuard.hs'
      - 'test/Phase1ProtocolStaleEndpointMain.hs'
      - 'test/Phase1ProtocolGuardedTransitionMain.hs'
      - 'app/ProtocolProgressionGuardDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/protocol-stale-endpoint-v1.md'
      - 'docs/phase-1/protocol-guarded-transition-v1.md'
      - 'docs/phase-1/protocol-progression-guard-proof-v1.md'
      - 'docs/phase-1/protocol-progression-guard-implementation-refinement-v1.md'
      - 'docs/phase-1/protocol-progression-guard-production-binding-v1.md'
      - '.github/workflows/phase1-protocol-progression-guard-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-protocol-progression-guard-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-PROT-STEP-001 proof and exact production kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolProgressionGuard.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolProgressionGuardImplementation.v
          rm -f ProtocolProgressionGuardKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolProgressionGuardImplementationExtraction.v
          test -s ProtocolProgressionGuardKernel.hs
          grep -q 'decideProtocolContinuationByFacts' ProtocolProgressionGuardKernel.hs
          grep -q 'decideProtocolCloseByFact' ProtocolProgressionGuardKernel.hs
          grep -q 'planProtocolSuccessorContract' ProtocolProgressionGuardKernel.hs
          grep -q 'decideProtocolGuardListByFact' ProtocolProgressionGuardKernel.hs
          grep -q 'decideProtocolGuardRequirementByFacts' ProtocolProgressionGuardKernel.hs
          cmp ProtocolProgressionGuardKernel.hs src/ProtocolProgressionGuardKernel.hs
          kernel_sha256="$(sha256sum ProtocolProgressionGuardKernel.hs | cut -d' ' -f1)"
          printf 'kernel_sha256=%s\n' "$kernel_sha256"
          test "$kernel_sha256" = '4378dfae72309f262db9188f8e12c9f4efb568f796f8677324d646c94fd63e63'

      - name: Record proof and production-kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p protocol-progression-guard-proof
          cp \
            proof/Phil/Core/ProtocolProgressionGuard.v \
            proof/Phil/Core/ProtocolProgressionGuard.vo \
            proof/Phil/Core/ProtocolProgressionGuardImplementation.v \
            proof/Phil/Core/ProtocolProgressionGuardImplementation.vo \
            proof/Phil/Core/ProtocolProgressionGuardImplementationExtraction.v \
            proof/Phil/Core/ProtocolProgressionGuardImplementationExtraction.vo \
            ProtocolProgressionGuardKernel.hs \
            protocol-progression-guard-proof/
          sha256sum \
            protocol-progression-guard-proof/ProtocolProgressionGuard.v \
            protocol-progression-guard-proof/ProtocolProgressionGuard.vo \
            protocol-progression-guard-proof/ProtocolProgressionGuardImplementation.v \
            protocol-progression-guard-proof/ProtocolProgressionGuardImplementation.vo \
            protocol-progression-guard-proof/ProtocolProgressionGuardKernel.hs \
            > protocol-progression-guard-proof/PHIL-PROT-STEP-001.proof.sha256
          {
            printf '%s\n' 'obligation=PHIL-PROT-STEP-001'
            printf '%s\n' 'evidence=Rocq-9.2.0'
            cat protocol-progression-guard-proof/PHIL-PROT-STEP-001.proof.sha256
          } > protocol-progression-guard-proof/PHIL-PROT-STEP-001.proof-certificate.txt
          cat protocol-progression-guard-proof/PHIL-PROT-STEP-001.proof.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-protocol-progression-guard-production-binding
          path: protocol-progression-guard-proof
          if-no-files-found: error

  verify-protocol-progression-guard-correspondence:
    needs: rocq-protocol-progression-guard-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary protocol progression regression substrate
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - uses: actions/download-artifact@v4
        with:
          name: rocq-protocol-progression-guard-production-binding
          path: protocol-progression-guard-proof

      - name: Verify exact extracted production kernel and direct controls
        run: |
          set -euo pipefail
          cmp protocol-progression-guard-proof/ProtocolProgressionGuardKernel.hs src/ProtocolProgressionGuardKernel.hs
          test "$(sha256sum src/ProtocolProgressionGuardKernel.hs | cut -d' ' -f1)" = \
            '4378dfae72309f262db9188f8e12c9f4efb568f796f8677324d646c94fd63e63'
          ghc -Wall -Werror -fno-code protocol-progression-guard-proof/ProtocolProgressionGuardKernel.hs
          ghc -Wall -Werror -fno-code src/ProtocolProgressionGuardKernel.hs
          ghc -Wall -Werror \
            -isrc \
            app/ProtocolProgressionGuardDecisionCorrespondenceMain.hs \
            -o protocol-progression-guard-kernel-controls
          ./protocol-progression-guard-kernel-controls

      - name: Typecheck bound protocol progression and guard implementation paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Protocol.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Assurance/ProtocolGuard.hs
          for test_main in \
            test/Phase1ProtocolStaleEndpointMain.hs \
            test/Phase1ProtocolGuardedTransitionMain.hs
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$test_main"
          done

      - name: Re-run unchanged PROT-005 and PROT-006 pressure corpora
        run: |
          set -euo pipefail
          for test_main in \
            test/Phase1ProtocolStaleEndpointMain.hs \
            test/Phase1ProtocolGuardedTransitionMain.hs
          do
            cabal exec -- runghc -Wall -Werror -isrc "$test_main"
          done

      - name: Record implementation-refinement production-binding identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p protocol-progression-guard-production-binding
          sha256sum \
            src/ProtocolProgressionGuardKernel.hs \
            src/Phil/Core/Protocol.hs \
            src/Phil/Assurance/ProtocolGuard.hs \
            test/Phase1ProtocolStaleEndpointMain.hs \
            test/Phase1ProtocolGuardedTransitionMain.hs \
            app/ProtocolProgressionGuardDecisionCorrespondenceMain.hs \
            proof/Phil/Core/ProtocolProgressionGuardImplementation.v \
            docs/phase-1/protocol-progression-guard-implementation-refinement-v1.md \
            docs/phase-1/protocol-progression-guard-production-binding-v1.md \
            > protocol-progression-guard-production-binding/PHIL-PROT-STEP-001.closeout.sha256
          cat protocol-progression-guard-production-binding/PHIL-PROT-STEP-001.closeout.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-progression-guard-production-binding
          path: protocol-progression-guard-production-binding
          if-no-files-found: error
