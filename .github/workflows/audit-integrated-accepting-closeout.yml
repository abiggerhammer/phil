name: Audit Integrated Accepting Closeout

on:
  push:
    branches: [audit-evidence-occurrence-inventory-20260924]
    paths: ['.github/workflows/audit-integrated-accepting-closeout.yml']
permissions:
  contents: read
concurrency:
  group: audit-integrated-accepting-closeout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-integrated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91c054904ab8f0076c39f9532dd3d6672b2facff
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ff546021324900f281fe1291b4f4415696063cc8
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1f32aa4ae1aeeaee6db39975b3a86e35adf76890
          path: historical
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 55ee6dc454133f1a24bd6df911fbb439209118fc
          path: prior
          persist-credentials: false
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.18.1.0'
      - name: Preserve and verify independent immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/drivers evidence/source evidence/permanent
          for tree in subject driver historical prior; do
            git -C "$tree" rev-parse HEAD > "evidence/$tree-commit.txt"
          done
          test "$(cat evidence/subject-commit.txt)" = 91c054904ab8f0076c39f9532dd3d6672b2facff
          test "$(cat evidence/driver-commit.txt)" = ff546021324900f281fe1291b4f4415696063cc8
          test "$(cat evidence/historical-commit.txt)" = 1f32aa4ae1aeeaee6db39975b3a86e35adf76890
          test "$(cat evidence/prior-commit.txt)" = 55ee6dc454133f1a24bd6df911fbb439209118fc
          printf '%s\n' '${{ github.sha }}' > evidence/workflow-commit.txt
          printf '%s %s\n' '${{ github.run_id }}' '${{ github.run_attempt }}' > evidence/run-attempt.txt
          git -C subject status --porcelain --untracked-files=all > evidence/subject-status-before.txt
          test ! -s evidence/subject-status-before.txt
          cp driver/audit/durable-subject-review/DurableSubjectReview.hs evidence/drivers/
          cp driver/audit/durable-subject-review/LiveSubjectPreservation.hs evidence/drivers/
          cp driver/audit/landed-event-chain/EventAdapterPreservation.hs evidence/drivers/
          cp driver/audit/refined-consumed-event/RefinedConsumedEvent.hs evidence/drivers/
          cp driver/audit/residual-free-event-identity/ResidualFreeEventIdentity.hs evidence/drivers/
          cp driver/audit/original-entry-boundary/OriginalEntryBoundary.hs evidence/drivers/EntryFixture.original.hs
          cp driver/audit/evidence-occurrence-inventory/ActualUseInventoryReview.hs evidence/drivers/
          cp driver/audit/evidence-occurrence-inventory/EndpointBoundaryReview.hs evidence/drivers/
          cp driver/audit/accepting-closeout/IntegratedFinalEntryReview.hs evidence/drivers/
          cp historical/audit/definedness-final-closure/DefinednessClosureControls.hs evidence/drivers/ClosureFixture.original.hs
          cp prior/test/AssuranceDirectNamedEvidenceAuthorityMain.hs evidence/drivers/DirectFixture.original.hs
          python3 - <<'PY'
          import hashlib, difflib, json
          from pathlib import Path
          root=Path('evidence/drivers')
          expected={
            'DurableSubjectReview.hs':'14ae49123712fc8f403ab9e4d4e4f753589e5d34',
            'LiveSubjectPreservation.hs':'c7956072f0ba95ee905f46b3df8ca3f618e7313a',
            'EventAdapterPreservation.hs':'c47f212d786765a869616461cfd0f924ee9ebaf8',
            'RefinedConsumedEvent.hs':'9bdb0784d0420b88f3a43ea68b9a27104d29b370',
            'ResidualFreeEventIdentity.hs':'0610343e7902cd2eebf4fa5ff1d91acb4c9f0804',
            'EntryFixture.original.hs':'80fcc9f1b480fbe3a132b1ae998d0f8dddbdb2eb',
            'ActualUseInventoryReview.hs':'89c2f35486d220c2ff5eacf6490e8c338b8a0252',
            'IntegratedFinalEntryReview.hs':'04996ca4f3cc3a918337d9b4bae6c7b6e589b92a',
            'ClosureFixture.original.hs':'c80410a33dfc35c77c6fd358cc00232763405330',
            'DirectFixture.original.hs':'93f2c3a39c4af4e52180c6c14413e048dd6648dd'}
          for name,wanted in expected.items():
              data=(root/name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==wanted,(name,actual,wanted)
          for name,source in [('ClosureFixture','ClosureFixture.original.hs'),('DirectFixture','DirectFixture.original.hs'),('EntryFixture','EntryFixture.original.hs'),('PreservationFixture','EventAdapterPreservation.hs')]:
              original=(root/source).read_text()
              assert original.count('module Main (main) where')==1
              adapted=original.replace('module Main (main) where',f'module {name} where')
              if name=='ClosureFixture':
                  old='(Map.fromList [(rev h,parentId) | h <- certificateEntries])'
                  assert adapted.count(old)==1
                  adapted=adapted.replace(old,old+'\n        Map.empty')
              (root/f'{name}.hs').write_text(adapted)
              Path(f'evidence/{name}.diff').write_text(''.join(difflib.unified_diff(original.splitlines(True),adapted.splitlines(True),fromfile=source,tofile=name+'.hs')))
          Path('evidence/expected-original-blobs.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
          sha256sum evidence/drivers/*.hs > evidence/drivers.sha256
          ghc --numeric-version > evidence/ghc-version.txt
          cabal --numeric-version > evidence/cabal-version.txt
          for path in src/Phil/Assurance.hs src/Phil/Assurance/Handoff.hs src/Phil/Assurance/EvidenceFactAuthority.hs src/Phil/Assurance/Verify.hs src/Phil/Verification/ManifestClosure.hs src/Phil/Core/Checker.hs src/Phil/Core/Context.hs src/Phil/Core/Value.hs src/Phil/Core/Discharge.hs src/Phil/Core/Refinement.hs proof/Phil/Assurance/EvidenceConsumerOccurrenceFinalAuthority.v; do
            mkdir -p "evidence/source/$(dirname "$path")"
            cp "subject/$path" "evidence/source/$path"
            printf '%s %s\n' "$(git -C subject rev-parse "HEAD:$path")" "$path" >> evidence/source-git-blobs.txt
          done
      - name: Build exact production substrate
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cabal update 2>&1 | tee ../evidence/dependency-index.log
          cabal build all --enable-tests 2>&1 | tee ../evidence/build.log
      - name: Strictly compile and replay every applicable independent corpus
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          for suite in DurableSubjectReview LiveSubjectPreservation EventAdapterPreservation RefinedConsumedEvent ActualUseInventoryReview EndpointBoundaryReview IntegratedFinalEntryReview ResidualFreeEventIdentity; do
            mkdir -p "../evidence/build-$suite"
            cabal exec -- ghc -O0 -Wall -Werror -isrc -i../evidence/drivers -outputdir "../evidence/build-$suite" "../evidence/drivers/$suite.hs" -o "../evidence/$suite" > "../evidence/$suite-compile.log" 2>&1
            set +e
            "../evidence/$suite" > "../evidence/$suite.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "../evidence/$suite.exit"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('../evidence')
          expected={
            'DurableSubjectReview':[f'C{i:02d}' for i in range(1,15)]+['R01','R02'],
            'LiveSubjectPreservation':['C01','C02','C03','C04','R01'],
            'EventAdapterPreservation':[f'C{i:02d}' for i in range(1,9)]+['R01','R02'],
            'RefinedConsumedEvent':['C01','C02','C03','C04','R01','R02'],
            'ActualUseInventoryReview':[f'C{i:02d}' for i in range(1,13)],
            'EndpointBoundaryReview':[f'P{i:02d}' for i in range(1,5)],
            'IntegratedFinalEntryReview':[f'K{i:02d}' for i in range(1,17)],
            'ResidualFreeEventIdentity':[f'C{i:02d}' for i in range(1,7)]}
          result={'production_pin':'91c054904ab8f0076c39f9532dd3d6672b2facff','release_certified':False,'native_formal_reflection_established':False,'runtime_validator_executed':False,'observation_correctness_credit':0,'suites':{}}
          for suite,ids in expected.items():
              lines=(root/f'{suite}.log').read_text().splitlines()
              rows=[s.split(' ',2) for s in lines if s.startswith(('PASS ','FAIL '))]
              assert [r[1] for r in rows]==ids,(suite,rows)
              assert not any(s.startswith('OBS_SETUP_ERROR ') for s in lines),suite
              code=int((root/f'{suite}.exit').read_text())
              assert code in (0,1)
              assert (code==0)==all(r[0]=='PASS' for r in rows)
              result['suites'][suite]={'exit':code,'cases':rows,'observations':[s for s in lines if s.startswith('OBS ')]}
          result['all_required_assertions_passed']=all(s['exit']==0 for s in result['suites'].values())
          result['main_required_groups']=69
          result['diagnostic_required_groups']=6
          (root/'protocol.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          assert result['all_required_assertions_passed'],'required semantic assertion failed'
          PY
      - name: Replay the implementation's integrated permanent boundaries
        if: success() || failure()
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for suite in Phase1AuditOriginalEventForestMain Phase1AuditOriginalEventPreservationMain Phase1AuditEvidenceUseInventoryMain Phase1AuditEvidenceSubjectEndpointsMain AssuranceDirectNamedEvidenceAuthorityMain Phase1AuditFinalOperationSupportMain AssuranceHandoffManifestClosureMain; do
            cp "test/$suite.hs" "../evidence/permanent/$suite.hs"
            set +e
            cabal exec -- runghc -isrc -Wall -Werror "test/$suite.hs" > "../evidence/permanent/$suite.log" 2>&1
            code=$?
            set -e
            printf '%s %s\n' "$suite" "$code" >> ../evidence/permanent-exits.txt
            if test "$code" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Verify production remains exact and untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C subject status --porcelain --untracked-files=all > evidence/subject-status-after.txt
          test ! -s evidence/subject-status-after.txt
          test "$(git -C subject rev-parse HEAD)" = 91c054904ab8f0076c39f9532dd3d6672b2facff
      - name: Preserve original sources and all results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-accepting-closeout-91c05490
          path: |
            evidence/*.txt
            evidence/*.sha256
            evidence/*.diff
            evidence/*.log
            evidence/*.exit
            evidence/*.json
            evidence/drivers/
            evidence/source/
            evidence/permanent/
          if-no-files-found: error
