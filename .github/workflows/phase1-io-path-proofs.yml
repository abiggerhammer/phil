name: Phase 1 IO Path Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ProviderRelativePath.v'
      - 'proof/Phil/Core/ProviderRelativePathImplementation.v'
      - 'proof/Phil/Core/ProviderRelativePathImplementationExtraction.v'
      - 'src/ProviderRelativePathKernel.hs'
      - 'src/Phil/Systems.hs'
      - 'test/Phase1IOPathProviderRelativeMain.hs'
      - '.github/workflows/phase1-io-path-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ProviderRelativePath.v'
      - 'proof/Phil/Core/ProviderRelativePathImplementation.v'
      - 'proof/Phil/Core/ProviderRelativePathImplementationExtraction.v'
      - 'src/ProviderRelativePathKernel.hs'
      - 'src/Phil/Systems.hs'
      - 'test/Phase1IOPathProviderRelativeMain.hs'
      - '.github/workflows/phase1-io-path-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-provider-relative-path-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-P1-IO-PATH-001 proof and fresh extracted kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderRelativePath.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderRelativePathImplementation.v
          rm -f ProviderRelativePathKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderRelativePathImplementationExtraction.v
          test -s ProviderRelativePathKernel.hs
          grep -q 'decideFileSystemOccurrenceByFacts' ProviderRelativePathKernel.hs
          grep -q 'decideProviderRelativePathByFacts' ProviderRelativePathKernel.hs

      - name: Record checked proof and extraction identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provider-relative-path-proof
          cp \
            proof/Phil/Core/ProviderRelativePath.v \
            proof/Phil/Core/ProviderRelativePath.vo \
            proof/Phil/Core/ProviderRelativePathImplementation.v \
            proof/Phil/Core/ProviderRelativePathImplementation.vo \
            proof/Phil/Core/ProviderRelativePathImplementationExtraction.v \
            proof/Phil/Core/ProviderRelativePathImplementationExtraction.vo \
            ProviderRelativePathKernel.hs \
            provider-relative-path-proof/
          sha256sum \
            provider-relative-path-proof/ProviderRelativePath.v \
            provider-relative-path-proof/ProviderRelativePath.vo \
            provider-relative-path-proof/ProviderRelativePathImplementation.v \
            provider-relative-path-proof/ProviderRelativePathImplementation.vo \
            provider-relative-path-proof/ProviderRelativePathKernel.hs \
            > provider-relative-path-proof/PHIL-P1-IO-PATH-001.proof.sha256
          cat provider-relative-path-proof/PHIL-P1-IO-PATH-001.proof.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-provider-relative-path-production-binding
          path: provider-relative-path-proof
          if-no-files-found: error

  verify-provider-relative-path-correspondence:
    needs: rocq-provider-relative-path-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Strict-typecheck provider-relative Path implementation authority
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1IOPathProviderRelativeMain.hs

      - name: Re-run unchanged IO-PATH pressure corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1IOPathProviderRelativeMain.hs
