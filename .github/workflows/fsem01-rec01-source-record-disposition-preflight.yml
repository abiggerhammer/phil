name: FSEM-01 REC-01 Source Record Disposition Preflight

on:
  push:
    branches:
      - formal-semantics/fsem01-rec01-source-record-disposition
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceRecordFieldDisposition.hs'
      - 'test/Phase1FSEM01Rec01SourceRecordDispositionMain.hs'
      - 'test/fixtures/fsem01-rec01-source-record-v1/**'
      - 'proof/Phil/Surface/SourceRecordFieldDispositionREC01.v'
      - 'docs/phase-1/formal-semantics-source-record-rec01-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-rec01-source-record-disposition-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceRecordFieldDisposition.hs'
      - 'test/Phase1FSEM01Rec01SourceRecordDispositionMain.hs'
      - 'test/fixtures/fsem01-rec01-source-record-v1/**'
      - 'proof/Phil/Surface/SourceRecordFieldDispositionREC01.v'
      - 'docs/phase-1/formal-semantics-source-record-rec01-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-rec01-source-record-disposition-preflight.yml'

concurrency:
  group: rec01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-source-record:
    name: Strict GHC original source record and native Core destruction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Warning-clean production, original record and Core regressions
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
          for test in \
            Phase1GrammarV1CheckedRecordFieldsMain \
            Phase1ConsumingRecordDestructionMain \
            Phase1MissingLinearFieldDispositionMain \
            Phase1GrammarV1LetPatternScopeMain \
            Phase1FSEM01Rec01SourceRecordDispositionMain
          do
            cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -itest -Wall -Werror "test/$test.hs"
          done
          sha256sum \
            src/Phil/Surface/GrammarV1/SourceRecordFieldDisposition.hs \
            test/Phase1FSEM01Rec01SourceRecordDispositionMain.hs \
            src/Phil/Core/DataDestruction.hs \
            src/Phil/Surface/Check/Engine.hs

  rocq-record-disposition:
    name: Rocq conditional record Linear dispositions and owner freshness
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile previous data elimination theorems and source-owned bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/DataElimination.v \
            proof/Phil/Surface/SourceRecordFieldDispositionREC01.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq check -Q proof/Phil Phil Phil.Surface.SourceRecordFieldDispositionREC01
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SourceRecordFieldDispositionREC01.v; then
            echo "Unproved REC-01 bridge admission" >&2
            exit 1
          fi
          sha256sum \
            proof/Phil/Surface/SourceRecordFieldDispositionREC01.v \
            proof/Phil/Surface/SourceRecordFieldDispositionREC01.vo
