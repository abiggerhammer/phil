name: Phase 1 Architecture Identity Implementation Refinement

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureIdentityImplementation.v'
      - 'proof/Phil/Core/ArchitectureIdentityImplementationExtraction.v'
      - 'docs/phase-1/architecture-identity-implementation-refinement-v1.md'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Assurance/ArchitectureIdentity.hs'
      - 'test/Phase1ArchitectureRenameIdentityMain.hs'
      - 'test/Phase1ArchitectureInterfaceValidityMain.hs'
      - 'test/Phase1ArchitectureDefinitionReplacementMain.hs'
      - 'test/Phase1ArchitectureSiblingNoninterferenceMain.hs'
      - '.github/workflows/phase1-architecture-identity-implementation-refinement.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureIdentityImplementation.v'
      - 'proof/Phil/Core/ArchitectureIdentityImplementationExtraction.v'
      - 'docs/phase-1/architecture-identity-implementation-refinement-v1.md'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Assurance/ArchitectureIdentity.hs'
      - 'test/Phase1ArchitectureRenameIdentityMain.hs'
      - 'test/Phase1ArchitectureInterfaceValidityMain.hs'
      - 'test/Phase1ArchitectureDefinitionReplacementMain.hs'
      - 'test/Phase1ArchitectureSiblingNoninterferenceMain.hs'
      - '.github/workflows/phase1-architecture-identity-implementation-refinement.yml'

permissions:
  contents: read

jobs:
  rocq-architecture-identity-implementation-refinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile certified ARCH-ID model and equality correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentityImplementation.v

      - name: Extract architecture identity kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f ArchitectureIdentityKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentityImplementationExtraction.v
          test -s ArchitectureIdentityKernel.hs
          grep -q 'decideDeclarationIdentityEquality' ArchitectureIdentityKernel.hs
          grep -q 'decideInterfaceValidityScopeEquality' ArchitectureIdentityKernel.hs
          grep -q 'decideArchitectureInstanceIdentityEquality' ArchitectureIdentityKernel.hs
          sha256sum ArchitectureIdentityKernel.hs
          mkdir -p architecture-identity-implementation-refinement-proof
          cp \
            proof/Phil/Core/ArchitectureIdentity.v \
            proof/Phil/Core/ArchitectureIdentityImplementation.v \
            proof/Phil/Core/ArchitectureIdentityImplementation.vo \
            ArchitectureIdentityKernel.hs \
            architecture-identity-implementation-refinement-proof/

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-architecture-identity-implementation-refinement
          path: architecture-identity-implementation-refinement-proof
          if-no-files-found: error

  verify-architecture-identity-implementation-correspondence:
    needs: rocq-architecture-identity-implementation-refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rocq-architecture-identity-implementation-refinement
          path: extracted-architecture-identity

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Typecheck extracted kernel and unchanged architecture identity paths
        run: |
          set -euo pipefail
          ghc -Wall -Werror -fno-code extracted-architecture-identity/ArchitectureIdentityKernel.hs
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Static.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Assurance/ArchitectureIdentity.hs
          for test_main in \
            test/Phase1ArchitectureRenameIdentityMain.hs \
            test/Phase1ArchitectureInterfaceValidityMain.hs \
            test/Phase1ArchitectureDefinitionReplacementMain.hs \
            test/Phase1ArchitectureSiblingNoninterferenceMain.hs
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$test_main"
          done

      - name: Re-run ARCH-002, ARCH-003, ARCH-004, and ARCH-007 corpora
        run: |
          set -euo pipefail
          for test_main in \
            test/Phase1ArchitectureRenameIdentityMain.hs \
            test/Phase1ArchitectureInterfaceValidityMain.hs \
            test/Phase1ArchitectureDefinitionReplacementMain.hs \
            test/Phase1ArchitectureSiblingNoninterferenceMain.hs
          do
            cabal exec -- runghc -isrc "$test_main"
          done
