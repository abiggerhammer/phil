name: FSEM-02 Two Step Native Core Trace Preflight

on:
  push:
    branches:
      - formal-semantics/fsem02-two-step-native-core-trace
    paths:
      - 'test/Phase1FSEM02TwoStepCoreTraceMain.hs'
      - 'proof/Phil/Core/FSEM02TwoStepNativeCoreFrame.v'
      - 'docs/phase-1/formal-semantics-two-step-native-core-trace-fsem02-v1.md'
      - 'docs/phase-1/typing-and-semantics-reader-guide-v1.md'
      - '.github/workflows/fsem02-two-step-native-core-trace-preflight.yml'
  pull_request:
    paths:
      - 'test/Phase1FSEM02TwoStepCoreTraceMain.hs'
      - 'proof/Phil/Core/FSEM02TwoStepNativeCoreFrame.v'
      - 'docs/phase-1/formal-semantics-two-step-native-core-trace-fsem02-v1.md'
      - 'docs/phase-1/typing-and-semantics-reader-guide-v1.md'
      - '.github/workflows/fsem02-two-step-native-core-trace-preflight.yml'

permissions:
  contents: read

jobs:
  strict-native:
    name: Strict GHC native two-step Core and separate accepted/rejected source witnesses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - run: bash scripts/ci/cabal-update-retry.sh
      - run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Executable Core trace and independently source-admitted controls
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            test/Phase1FSEM02TwoStepCoreTraceMain.hs \
            test/Phase1FSEM02ProtocolProgressionMain.hs \
            test/Phase1FSEM02SourceJointChoiceMain.hs
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$file"
            cabal exec -- runghc -isrc -Wall -Werror "$file"
            sha256sum "$file"
          done
          sha256sum test/fixtures/fsem02-protocol-progression-v1/*.phil
          sha256sum test/fixtures/fsem02-source-choice-v1/*.phil
          sha256sum test/fixtures/fsem02-source-joint-choice-v1/*.phil
          sha256sum test/fixtures/fsem02-source-offer-replay-v1/*.phil

  rocq:
    name: Rocq 9.2 two-generation consumption, shared-loan and disjoint frame proof
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact dependency closure and new conditional model composition
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ProcessTerminal.v \
            proof/Phil/Core/ArchitectureIdentity.v \
            proof/Phil/Core/ArchitectureInstantiation.v \
            proof/Phil/Core/ProviderReplacementQualification.v \
            proof/Phil/Core/ArchitectureRealization.v \
            proof/Phil/Systems/FactDisposition.v \
            proof/Phil/Assurance/ValidityScope.v \
            proof/Phil/Core/SystemsStageClosure.v \
            proof/Phil/Core/SystemsGenericLowering.v \
            proof/Phil/Core/ConcurrencySemantics.v \
            proof/Phil/Core/SessionStep.v \
            proof/Phil/Core/FSEM02ProtocolHeadProgression.v \
            proof/Phil/Core/FSEM02JointSourceChoice.v \
            proof/Phil/Core/FSEM02PairedLocalJointBridge.v \
            proof/Phil/Core/FSEM02PairedChoiceJointBridge.v \
            proof/Phil/Core/FSEM02PairedSourceFamilyEnvelope.v \
            proof/Phil/Core/FSEM02PairedTwoStepOutcomes.v \
            proof/Phil/Core/FSEM02TwoStepStalePrefix.v \
            proof/Phil/Core/FSEM02TwoStepSuccessorChain.v \
            proof/Phil/Core/FSEM02TwoStepNativeCoreFrame.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Core/FSEM02TwoStepNativeCoreFrame.v
          then
            echo "New unproved FSEM-02 assumption" >&2
            exit 1
          fi
          sha256sum proof/Phil/Core/FSEM02TwoStepNativeCoreFrame.v \
            proof/Phil/Core/FSEM02TwoStepNativeCoreFrame.vo
