name: Phase 1 Boundary Complete Recognition Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/BoundaryCompleteRecognition.v'
      - 'proof/Phil/Core/BoundaryCompleteRecognitionImplementation.v'
      - 'proof/Phil/Core/BoundaryCompleteRecognitionImplementationExtraction.v'
      - 'docs/phase-1/boundary-complete-recognition-proof-v1.md'
      - 'docs/phase-1/boundary-complete-recognition-implementation-refinement-v1.md'
      - 'docs/phase-1/boundary-complete-recognition-production-binding-v1.md'
      - 'app/BoundaryCompleteRecognitionDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-boundary-complete-recognition-proofs.yml'
      - 'src/BoundaryCompleteRecognitionKernel.hs'
      - 'src/Phil/Core/Recognition.hs'
      - 'src/Phil/Core/BoundaryRecognition.hs'
      - 'test/Phase1CompleteRecognitionMain.hs'
      - 'test/Phase1TrailingBytesMain.hs'
      - 'test/Phase1MalformedRecognitionMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/BoundaryCompleteRecognition.v'
      - 'proof/Phil/Core/BoundaryCompleteRecognitionImplementation.v'
      - 'proof/Phil/Core/BoundaryCompleteRecognitionImplementationExtraction.v'
      - 'docs/phase-1/boundary-complete-recognition-proof-v1.md'
      - 'docs/phase-1/boundary-complete-recognition-implementation-refinement-v1.md'
      - 'docs/phase-1/boundary-complete-recognition-production-binding-v1.md'
      - 'app/BoundaryCompleteRecognitionDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-boundary-complete-recognition-proofs.yml'
      - 'src/BoundaryCompleteRecognitionKernel.hs'
      - 'src/Phil/Core/Recognition.hs'
      - 'src/Phil/Core/BoundaryRecognition.hs'
      - 'test/Phase1CompleteRecognitionMain.hs'
      - 'test/Phase1TrailingBytesMain.hs'
      - 'test/Phase1MalformedRecognitionMain.hs'

permissions:
  contents: read

jobs:
  rocq-boundary-complete-recognition-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-BND-COMPLETE-001 proof and exact production kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryCompleteRecognition.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryCompleteRecognitionImplementation.v
          rm -f BoundaryCompleteRecognitionKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryCompleteRecognitionImplementationExtraction.v
          test -s BoundaryCompleteRecognitionKernel.hs
          grep -q 'decideCompleteExtentByFacts' BoundaryCompleteRecognitionKernel.hs
          cmp BoundaryCompleteRecognitionKernel.hs src/BoundaryCompleteRecognitionKernel.hs
          test "$(sha256sum BoundaryCompleteRecognitionKernel.hs | awk '{print $1}')" = \
            'e97fd09b8067c47783f2e8dbfcae84adec816185d36b1131460888a5eff332fe'

      - name: Record proof and production-kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boundary-complete-recognition-proof
          cp \
            proof/Phil/Core/BoundaryCompleteRecognition.v \
            proof/Phil/Core/BoundaryCompleteRecognition.vo \
            proof/Phil/Core/BoundaryCompleteRecognitionImplementation.v \
            proof/Phil/Core/BoundaryCompleteRecognitionImplementation.vo \
            proof/Phil/Core/BoundaryCompleteRecognitionImplementationExtraction.v \
            proof/Phil/Core/BoundaryCompleteRecognitionImplementationExtraction.vo \
            BoundaryCompleteRecognitionKernel.hs \
            boundary-complete-recognition-proof/
          sha256sum \
            boundary-complete-recognition-proof/BoundaryCompleteRecognition.v \
            boundary-complete-recognition-proof/BoundaryCompleteRecognition.vo \
            boundary-complete-recognition-proof/BoundaryCompleteRecognitionImplementation.v \
            boundary-complete-recognition-proof/BoundaryCompleteRecognitionImplementation.vo \
            boundary-complete-recognition-proof/BoundaryCompleteRecognitionKernel.hs \
            > boundary-complete-recognition-proof/PHIL-BND-COMPLETE-001.proof.sha256
          {
            echo 'obligation=PHIL-BND-COMPLETE-001'
            echo 'evidence=Rocq-9.2.0-production-binding'
            cat boundary-complete-recognition-proof/PHIL-BND-COMPLETE-001.proof.sha256
          } > boundary-complete-recognition-proof/PHIL-BND-COMPLETE-001.proof-certificate.txt
          cat boundary-complete-recognition-proof/PHIL-BND-COMPLETE-001.proof-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-boundary-complete-recognition-production-binding
          path: boundary-complete-recognition-proof
          if-no-files-found: error

  verify-boundary-complete-recognition-correspondence:
    needs: rocq-boundary-complete-recognition-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - uses: actions/download-artifact@v4
        with:
          name: rocq-boundary-complete-recognition-production-binding
          path: boundary-complete-recognition-proof

      - name: Verify exact extracted production kernel and direct controls
        run: |
          set -euo pipefail
          cmp \
            boundary-complete-recognition-proof/BoundaryCompleteRecognitionKernel.hs \
            src/BoundaryCompleteRecognitionKernel.hs
          test "$(sha256sum src/BoundaryCompleteRecognitionKernel.hs | awk '{print $1}')" = \
            'e97fd09b8067c47783f2e8dbfcae84adec816185d36b1131460888a5eff332fe'
          ghc -Wall -Werror -fno-code \
            boundary-complete-recognition-proof/BoundaryCompleteRecognitionKernel.hs
          ghc -Wall -Werror -fno-code src/BoundaryCompleteRecognitionKernel.hs
          ghc -Wall -Werror \
            -isrc \
            app/BoundaryCompleteRecognitionDecisionCorrespondenceMain.hs \
            -o boundary-complete-recognition-kernel-controls
          ./boundary-complete-recognition-kernel-controls

      - name: Typecheck bound BND-001–003 implementation paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Recognition.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/BoundaryRecognition.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1CompleteRecognitionMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1TrailingBytesMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1MalformedRecognitionMain.hs

      - name: Re-run unchanged BND-001–003 correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1CompleteRecognitionMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1TrailingBytesMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1MalformedRecognitionMain.hs

      - name: Record implementation-refinement production-binding identities
        run: |
          set -euo pipefail
          mkdir -p boundary-complete-recognition-production-binding
          sha256sum \
            src/BoundaryCompleteRecognitionKernel.hs \
            src/Phil/Core/Recognition.hs \
            src/Phil/Core/BoundaryRecognition.hs \
            test/Phase1CompleteRecognitionMain.hs \
            test/Phase1TrailingBytesMain.hs \
            test/Phase1MalformedRecognitionMain.hs \
            app/BoundaryCompleteRecognitionDecisionCorrespondenceMain.hs \
            proof/Phil/Core/BoundaryCompleteRecognitionImplementation.v \
            docs/phase-1/boundary-complete-recognition-implementation-refinement-v1.md \
            docs/phase-1/boundary-complete-recognition-production-binding-v1.md \
            > boundary-complete-recognition-production-binding/PHIL-BND-COMPLETE-001.closeout.sha256
          cat boundary-complete-recognition-production-binding/PHIL-BND-COMPLETE-001.closeout.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: boundary-complete-recognition-production-binding
          path: boundary-complete-recognition-production-binding
          if-no-files-found: error
