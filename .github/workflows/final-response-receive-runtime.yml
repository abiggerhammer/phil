# CI normalization equivalence witness; execution semantics unchanged.
name: Final Response Receive Runtime

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/SessionChoice.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/SessionOffer.hs'
      - 'src/Phil/LLVM/SessionOfferCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMFinalResponseReceiveMain.hs'
      - 'runtime/phase0/final_response_receive_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/FinalResponseReceiveMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/final-response-receive-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/Systems/SessionChoice.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/SessionOffer.hs'
      - 'src/Phil/LLVM/SessionOfferCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMFinalResponseReceiveMain.hs'
      - 'runtime/phase0/final_response_receive_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/FinalResponseReceiveMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/final-response-receive-runtime.yml'

permissions:
  contents: read

jobs:
  final-response-receive-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build emitter and focused tests
        run: cabal build phil-llvm-phase0-final-response-receive phil-final-response-receive-tests
      - name: Verify ABI and execute accepted/rejected/malformed paths
        shell: bash
        run: |
          set -euo pipefail
          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-final-response-receive)"
          "$EMITTER" > phase0-final-response-receive.ll
          "$LLVM_AS" phase0-final-response-receive.ll -o phase0-final-response-receive.bc
          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/final_response_receive_v1_smoke.c \
            -o final-response-runtime.ll
          python3 scripts/check_runtime_abi.py phase0-final-response-receive.ll final-response-runtime.ll
          "$LLVM_AS" final-response-runtime.ll -o final-response-runtime.bc
          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -emit-llvm -c runtime/phase0/final_response_receive_v1_smoke_main.c \
            -o final-response-smoke-main.bc
          "$LLVM_LINK" phase0-final-response-receive.bc final-response-runtime.bc final-response-smoke-main.bc \
            -o phase0-final-response-linked.bc
          "$CLANG" --target=x86_64-unknown-linux-gnu phase0-final-response-linked.bc \
            -o phase0-final-response-smoke
          ./phase0-final-response-smoke
          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm runtime/phase0/final_response_receive_v1_bad_ambient.c \
            -o final-response-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-final-response-receive.ll final-response-bad-ambient.ll; then
            echo "expected ABI checker to reject ambient/nullary final-response decoder" >&2
            exit 1
          fi
          cabal test phil-final-response-receive-tests
