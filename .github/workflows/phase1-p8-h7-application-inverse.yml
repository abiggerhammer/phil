name: Phase 1 P8-H7 pure typed application inverse

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/P8H7ApplicationInverse.v'
      - 'docs/phase-1/p8-h7-typed-application-inverse-v1.md'
      - '.github/workflows/phase1-p8-h7-application-inverse.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Verification/P8H7ApplicationInverse.v'
      - 'docs/phase-1/p8-h7-typed-application-inverse-v1.md'
      - '.github/workflows/phase1-p8-h7-application-inverse.yml'

permissions:
  contents: read

jobs:
  rocq-full-typed-application-inverse:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile immutable C1 D1 D2 E1 E2 F1 and new H7, then check every object
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq -v
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8E1CanonicalWireModel P8E2CanonicalApplicationModel P8F1RecursiveInverseModel P8H7ApplicationInverse; do
            rocq c -Q proof/Phil Phil "proof/Phil/Verification/$name.v" | tee -a /tmp/p8-h7-assumptions.log
          done
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8E1CanonicalWireModel P8E2CanonicalApplicationModel P8F1RecursiveInverseModel P8H7ApplicationInverse; do
            rocq check -Q proof/Phil Phil "Phil.Verification.$name"
          done
          sha256sum proof/Phil/Verification/P8*.vo /tmp/p8-h7-assumptions.log
      - name: Assert no new proof placeholders or axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(Axiom|Admitted|Parameter|Axioms)[[:space:].]' proof/Phil/Verification/P8H7ApplicationInverse.v; then
            echo "H7 may not add axioms, parameters or admissions" >&2
            exit 1
          fi

  native-regression-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Recheck existing native diagnostic and actual source controls unchanged
        shell: bash
        run: |
          set -euo pipefail
          cabal build all --enable-tests --ghc-options=-Werror
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/P8F1RecursiveInverseMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/P8F1RecursiveInverseMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/P8E2CanonicalApplicationMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001WitnessE2EMain.hs
