name: Materialize Simple Resolver Prefix Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize equality-orientation fix
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('proof/Phil/Surface/GrammarDeterminacySimpleResolverSoundness.v')
          source = path.read_text()
          old = '''  exists lexeme, suffix.
          rewrite Hinput.
          rewrite Hmiddle.
          rewrite Hidentifier_input.
          reflexivity.
'''
          new = '''  exists lexeme, suffix.
          rewrite Hinput.
          rewrite <- Hmiddle.
          rewrite Hidentifier_input.
          reflexivity.
'''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one prefix proof block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/Phil/Surface/GrammarDeterminacySimpleResolverSoundness.v
          git rm .github/workflows/materialize-simple-resolver-prefix-fix.yml
          git commit -m "Fix simple resolver prefix equality orientation"
          git push origin "HEAD:${HEAD_REF}"
