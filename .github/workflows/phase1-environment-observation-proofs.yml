name: Phase 1 Environment Observation Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/EnvironmentObservation.v'
      - 'proof/Phil/Core/EnvironmentObservationImplementation.v'
      - 'proof/Phil/Core/ProviderQualification.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'src/Phil/Core/EnvironmentObservation.hs'
      - 'src/Phil/Core/ProviderQualification.hs'
      - 'src/Phil/Core/Authority.hs'
      - 'test/Phase1EnvironmentObservationMain.hs'
      - 'test/Phase1ProviderQualificationMain.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - 'docs/phase-1/environment-observation-proof-boundary-v1.md'
      - '.github/workflows/phase1-environment-observation-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/EnvironmentObservation.v'
      - 'proof/Phil/Core/EnvironmentObservationImplementation.v'
      - 'proof/Phil/Core/ProviderQualification.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'src/Phil/Core/EnvironmentObservation.hs'
      - 'src/Phil/Core/ProviderQualification.hs'
      - 'src/Phil/Core/Authority.hs'
      - 'test/Phase1EnvironmentObservationMain.hs'
      - 'test/Phase1ProviderQualificationMain.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - 'docs/phase-1/environment-observation-proof-boundary-v1.md'
      - '.github/workflows/phase1-environment-observation-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-environment-observation-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile certified predecessors and PHIL-EXEC-AMBIENT-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLifecycle.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRefinement.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityPossession.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/EnvironmentObservation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/EnvironmentObservationImplementation.v
      - name: Record checked proof identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            proof/Phil/Core/ProviderQualification.v \
            proof/Phil/Core/ProviderQualification.vo \
            proof/Phil/Core/AuthorityPossession.v \
            proof/Phil/Core/AuthorityPossession.vo \
            proof/Phil/Core/EnvironmentObservation.v \
            proof/Phil/Core/EnvironmentObservation.vo \
            proof/Phil/Core/EnvironmentObservationImplementation.v \
            proof/Phil/Core/EnvironmentObservationImplementation.vo \
            > environment-observation-proof.sha256
          cat environment-observation-proof.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: environment-observation-proof
          path: environment-observation-proof.sha256

  verify-environment-observation-correspondence:
    needs: rocq-environment-observation-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck production authorities
        run: |
          set -euo pipefail
          for module in \
            src/Phil/Core/EnvironmentObservation.hs \
            src/Phil/Core/ProviderQualification.hs \
            src/Phil/Core/Authority.hs
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$module"
          done
      - name: Strict typecheck standalone regression Mains separately
        run: |
          set -euo pipefail
          for test_main in \
            test/Phase1EnvironmentObservationMain.hs \
            test/Phase1ProviderQualificationMain.hs \
            test/Phase1AuthorityPossessionMain.hs
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$test_main"
          done
      - name: Replay EXEC-011 environmental observation boundary
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1EnvironmentObservationMain.hs
      - name: Replay provider semantic qualification predecessor
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProviderQualificationMain.hs
      - name: Replay authority possession predecessor
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1AuthorityPossessionMain.hs
      - name: Run decision and assurance controls
        run: cabal test phil-decision-tests phil-assurance-tests
