name: Phase 1 Architecture Import Production Binding

on:
  pull_request:
    paths:
      - 'src/ArchitectureImportKernel.hs'
      - 'src/Phil/Surface/Check.hs'
      - 'src/Phil/Core/Static.hs'
      - 'phil-core.cabal'
      - 'test/Phase1ImportNoninterferenceMain.hs'
      - 'docs/phase-1/import-noninterference-v1.md'
      - 'docs/phase-1/architecture-import-implementation-refinement-v1.md'
      - 'docs/phase-1/architecture-import-production-binding-v1.md'
      - 'proof/Phil/Surface/ImportNoninterference.v'
      - 'proof/Phil/Surface/ImportNoninterferenceImplementation.v'
      - 'proof/Phil/Surface/ImportNoninterferenceImplementationExtraction.v'
      - 'app/ArchitectureImportDecisionCorrespondenceMain.hs'
      - 'app/RocqScalarCertificationMain.hs'
      - '.github/workflows/phase1-architecture-import-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/ArchitectureImportKernel.hs'
      - 'src/Phil/Surface/Check.hs'
      - 'src/Phil/Core/Static.hs'
      - 'phil-core.cabal'
      - 'test/Phase1ImportNoninterferenceMain.hs'
      - 'docs/phase-1/import-noninterference-v1.md'
      - 'docs/phase-1/architecture-import-implementation-refinement-v1.md'
      - 'docs/phase-1/architecture-import-production-binding-v1.md'
      - 'proof/Phil/Surface/ImportNoninterference.v'
      - 'proof/Phil/Surface/ImportNoninterferenceImplementation.v'
      - 'proof/Phil/Surface/ImportNoninterferenceImplementationExtraction.v'
      - 'app/ArchitectureImportDecisionCorrespondenceMain.hs'
      - 'app/RocqScalarCertificationMain.hs'
      - '.github/workflows/phase1-architecture-import-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-architecture-import:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check PHIL-ARCH-IMPORT-001 production kernel in Rocq
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/ImportNoninterference.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/ImportNoninterferenceImplementation.v
          rm -f ArchitectureImportKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Surface/ImportNoninterferenceImplementationExtraction.v
          test -f proof/Phil/Surface/ImportNoninterference.vo
          test -s ArchitectureImportKernel.hs
          grep -q 'decideImportResolutionByFacts' ArchitectureImportKernel.hs
          grep -q 'planImportedBinding' ArchitectureImportKernel.hs
          cmp ArchitectureImportKernel.hs src/ArchitectureImportKernel.hs
          KERNEL_SHA="$(sha256sum ArchitectureImportKernel.hs | cut -d' ' -f1)"
          echo "kernel_sha256=${KERNEL_SHA}"
          test "${KERNEL_SHA}" = "91f52bfe9c8990674bbae9324a81a93152cee6ab0907c23d3f9e2a3318b40085"
          mkdir -p phase1-arch-import-proof
          cp \
            proof/Phil/Surface/ImportNoninterference.v \
            proof/Phil/Surface/ImportNoninterference.vo \
            proof/Phil/Surface/ImportNoninterferenceImplementation.v \
            proof/Phil/Surface/ImportNoninterferenceImplementation.vo \
            proof/Phil/Surface/ImportNoninterferenceImplementationExtraction.v \
            proof/Phil/Surface/ImportNoninterferenceImplementationExtraction.vo \
            ArchitectureImportKernel.hs \
            phase1-arch-import-proof/
          sha256sum \
            phase1-arch-import-proof/ImportNoninterference.v \
            phase1-arch-import-proof/ImportNoninterference.vo \
            phase1-arch-import-proof/ImportNoninterferenceImplementation.v \
            phase1-arch-import-proof/ImportNoninterferenceImplementation.vo \
            phase1-arch-import-proof/ArchitectureImportKernel.hs

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-architecture-import-production-binding
          path: phase1-arch-import-proof
          if-no-files-found: error

  certify-phase1-architecture-import:
    needs: rocq-phase1-architecture-import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Build proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-architecture-import-production-binding
          path: phase1-arch-import-proof

      - name: Verify exact extracted production kernel
        run: |
          set -euo pipefail
          cmp phase1-arch-import-proof/ArchitectureImportKernel.hs src/ArchitectureImportKernel.hs
          ghc -Wall -Werror -fno-code src/ArchitectureImportKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/Check.hs

      - name: Execute extracted architecture-import controls against production kernel
        run: |
          set -euo pipefail
          ghc -Wall -Werror \
            -isrc \
            app/ArchitectureImportDecisionCorrespondenceMain.hs \
            -o architecture-import-kernel-controls
          ./architecture-import-kernel-controls

      - name: Re-run unchanged ARCH-001 implementation correspondence cases
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ImportNoninterferenceMain.hs

      - name: Emit PHIL-ARCH-IMPORT-001 proof certificate and production-binding identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-architecture-import-certification
          mkdir -p architecture-import-production-binding
          CERTIFIER="$(cabal list-bin exe:phil-certify-core-scalar)"
          "$CERTIFIER" \
            phase1-arch-import \
            phase1-arch-import-proof/ImportNoninterference.v \
            phase1-arch-import-proof/ImportNoninterference.vo \
            phase1-architecture-import-certification/PHIL-ARCH-IMPORT-001.rocq.cert

          sha256sum \
            src/Phil/Surface/Check.hs \
            src/Phil/Core/Static.hs \
            test/Phase1ImportNoninterferenceMain.hs \
            docs/phase-1/import-noninterference-v1.md \
            proof/Phil/Surface/ImportNoninterference.v \
            app/RocqScalarCertificationMain.hs \
            > phase1-architecture-import-certification/PHIL-ARCH-IMPORT-001.correspondence.sha256

          sha256sum \
            src/ArchitectureImportKernel.hs \
            src/Phil/Surface/Check.hs \
            phil-core.cabal \
            test/Phase1ImportNoninterferenceMain.hs \
            app/ArchitectureImportDecisionCorrespondenceMain.hs \
            proof/Phil/Surface/ImportNoninterferenceImplementation.v \
            docs/phase-1/architecture-import-implementation-refinement-v1.md \
            docs/phase-1/architecture-import-production-binding-v1.md \
            > architecture-import-production-binding/PHIL-ARCH-IMPORT-001.production-binding.sha256

          cat phase1-architecture-import-certification/PHIL-ARCH-IMPORT-001.rocq.cert
          cat architecture-import-production-binding/PHIL-ARCH-IMPORT-001.production-binding.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-architecture-import-proof-certification
          path: phase1-architecture-import-certification
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-import-production-binding
          path: architecture-import-production-binding
          if-no-files-found: error
