name: Phase 1 Boundary Encoding Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/BoundaryEncoding.v'
      - 'proof/Phil/Core/BoundaryEncodingImplementation.v'
      - 'proof/Phil/Core/BoundaryEncodingImplementationExtraction.v'
      - 'docs/phase-1/boundary-encoding-proof-v1.md'
      - 'docs/phase-1/boundary-encoding-implementation-refinement-v1.md'
      - 'app/BoundaryEncodingDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-boundary-encoding-proofs.yml'
      - 'src/Phil/Core/QualifiedEncoding.hs'
      - 'src/Phil/Core/EncodingCanonicality.hs'
      - 'src/Phil/Core/BoundarySerialization.hs'
      - 'test/Phase1QualifiedEncodingMain.hs'
      - 'test/Phase1EncodingCanonicalityMain.hs'
      - 'test/Phase1BoundarySerializationMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/BoundaryEncoding.v'
      - 'proof/Phil/Core/BoundaryEncodingImplementation.v'
      - 'proof/Phil/Core/BoundaryEncodingImplementationExtraction.v'
      - 'docs/phase-1/boundary-encoding-proof-v1.md'
      - 'docs/phase-1/boundary-encoding-implementation-refinement-v1.md'
      - 'app/BoundaryEncodingDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-boundary-encoding-proofs.yml'
      - 'src/Phil/Core/QualifiedEncoding.hs'
      - 'src/Phil/Core/EncodingCanonicality.hs'
      - 'src/Phil/Core/BoundarySerialization.hs'
      - 'test/Phase1QualifiedEncodingMain.hs'
      - 'test/Phase1EncodingCanonicalityMain.hs'
      - 'test/Phase1BoundarySerializationMain.hs'

permissions:
  contents: read

jobs:
  rocq-boundary-encoding-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-BND-ENCODE-001 proof and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryEncoding.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryEncodingImplementation.v
          rm -f BoundaryEncodingKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryEncodingImplementationExtraction.v
          test -s BoundaryEncodingKernel.hs
          grep -q 'decideQualifiedEncodingByFacts' BoundaryEncodingKernel.hs
          grep -q 'planGeneratedEncoding' BoundaryEncodingKernel.hs
          grep -q 'decideEncodingCanonicality' BoundaryEncodingKernel.hs
          grep -q 'decideBoundarySerializationByFacts' BoundaryEncodingKernel.hs
          sha256sum BoundaryEncodingKernel.hs
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boundary-encoding-proof
          cp \
            proof/Phil/Core/BoundaryEncoding.v \
            proof/Phil/Core/BoundaryEncoding.vo \
            proof/Phil/Core/BoundaryEncodingImplementation.v \
            proof/Phil/Core/BoundaryEncodingImplementation.vo \
            proof/Phil/Core/BoundaryEncodingImplementationExtraction.v \
            proof/Phil/Core/BoundaryEncodingImplementationExtraction.vo \
            BoundaryEncodingKernel.hs \
            boundary-encoding-proof/
          sha256sum \
            proof/Phil/Core/BoundaryEncoding.v \
            proof/Phil/Core/BoundaryEncoding.vo \
            proof/Phil/Core/BoundaryEncodingImplementation.v \
            proof/Phil/Core/BoundaryEncodingImplementation.vo \
            BoundaryEncodingKernel.hs \
            > boundary-encoding-proof/PHIL-BND-ENCODE-001.proof.sha256
          {
            echo 'obligation=PHIL-BND-ENCODE-001'
            echo 'evidence=Rocq-9.2.0'
            cat boundary-encoding-proof/PHIL-BND-ENCODE-001.proof.sha256
          } > boundary-encoding-proof/PHIL-BND-ENCODE-001.proof-certificate.txt
          cat boundary-encoding-proof/PHIL-BND-ENCODE-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-boundary-encoding-proof
          path: boundary-encoding-proof
          if-no-files-found: error

  verify-boundary-encoding-correspondence:
    needs: rocq-boundary-encoding-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-boundary-encoding-proof
          path: boundary-encoding-proof
      - name: Typecheck and execute extracted boundary-encoding controls
        run: |
          set -euo pipefail
          ghc -Wall -Werror -fno-code \
            boundary-encoding-proof/BoundaryEncodingKernel.hs
          ghc -Wall -Werror \
            -iboundary-encoding-proof \
            app/BoundaryEncodingDecisionCorrespondenceMain.hs \
            -o boundary-encoding-kernel-controls
          ./boundary-encoding-kernel-controls
      - name: Typecheck unchanged BND-008–010 production paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/QualifiedEncoding.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/EncodingCanonicality.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/BoundarySerialization.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1QualifiedEncodingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1EncodingCanonicalityMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1BoundarySerializationMain.hs
      - name: Re-run BND-008–010 correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1QualifiedEncodingMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1EncodingCanonicalityMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1BoundarySerializationMain.hs
      - name: Record implementation-refinement staging identities
        run: |
          set -euo pipefail
          mkdir -p boundary-encoding-implementation-correspondence
          sha256sum \
            boundary-encoding-proof/BoundaryEncodingKernel.hs \
            src/Phil/Core/QualifiedEncoding.hs \
            src/Phil/Core/EncodingCanonicality.hs \
            src/Phil/Core/BoundarySerialization.hs \
            test/Phase1QualifiedEncodingMain.hs \
            test/Phase1EncodingCanonicalityMain.hs \
            test/Phase1BoundarySerializationMain.hs \
            app/BoundaryEncodingDecisionCorrespondenceMain.hs \
            proof/Phil/Core/BoundaryEncodingImplementation.v \
            docs/phase-1/boundary-encoding-implementation-refinement-v1.md \
            > boundary-encoding-implementation-correspondence/PHIL-BND-ENCODE-001.staging.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-encoding-implementation-correspondence
          path: boundary-encoding-implementation-correspondence
          if-no-files-found: error
