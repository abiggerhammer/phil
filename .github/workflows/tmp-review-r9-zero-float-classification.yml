name: Temporary R9 zero-float classification remediation

on:
  push:
    branches: [phase1-review-r9-zero-float-classification]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-review-r9-zero-float-classification
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply R9 precision-classification repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Phil/Core/NumericConversion.hs')
          text = p.read_text()
          old = '''    FloatPositiveZero -> Right NumericConversionRounded\n    FloatNegativeZero -> Right NumericConversionRounded\n'''
          new = '''    FloatPositiveZero -> Right\n      (if exactValue == 0 then NumericConversionExact else NumericConversionRounded)\n    FloatNegativeZero -> Right\n      (if exactValue == 0 then NumericConversionExact else NumericConversionRounded)\n'''
          if old not in text:
              raise SystemExit('R9 zero-classification anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Run R9 regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ReviewR9ZeroFloatPrecisionMain.hs

      - name: Run existing numeric conversion control
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1NumericConversionMain.hs

      - name: Commit R9 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Phil/Core/NumericConversion.hs
          git commit -m 'review: classify exact zero float conversions correctly'
          git push origin HEAD:phase1-review-r9-zero-float-classification
