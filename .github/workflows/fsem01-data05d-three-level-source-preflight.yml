name: FSEM-01 DATA-05D Three-level Source Product Preflight

on:
  push:
    branches:
      - formal-semantics/fsem01-data05d-three-level-source
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceNestedProductElimination.hs'
      - 'test/Phase1FSEM01Data05DSourceAdmissionMain.hs'
      - 'test/fixtures/fsem01-data05d-three-level-v1/**'
      - 'proof/Phil/Surface/SurfaceNestedProductSourceD05D.v'
      - 'docs/phase-1/formal-semantics-nested-product-data05d-fsem01-v1.md'
      - '.github/workflows/fsem01-data05d-three-level-source-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceNestedProductElimination.hs'
      - 'test/Phase1FSEM01Data05DSourceAdmissionMain.hs'
      - 'test/fixtures/fsem01-data05d-three-level-v1/**'
      - 'proof/Phil/Surface/SurfaceNestedProductSourceD05D.v'
      - 'docs/phase-1/formal-semantics-nested-product-data05d-fsem01-v1.md'
      - '.github/workflows/fsem01-data05d-three-level-source-preflight.yml'

concurrency:
  group: data05d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-source-product:
    name: Strict GHC three-stage original source and Core Surface replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Warning-clean production library, original source and Core regressions
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
          for test in \
            Phase1FSEM01FlatProductMain \
            Phase1FSEM01SourceProductEliminationMain \
            Phase1FSEM01Data05ANestedProductMain \
            Phase1FSEM01Data05BSourceSurfaceMain \
            Phase1FSEM01Data05CSourceAdmissionMain \
            Phase1FSEM01Data05DSourceAdmissionMain
          do
            cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -itest -Wall -Werror "test/$test.hs"
          done
          sha256sum \
            src/Phil/Surface/GrammarV1/SourceNestedProductElimination.hs \
            test/Phase1FSEM01Data05DSourceAdmissionMain.hs \
            src/Phil/Core/DataMode.hs \
            src/Phil/Surface/Check/Engine.hs

  three-stage-rocq:
    name: Rocq three-stage conditional restoration and no-fabrication
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile source contract models and check DATA-05D kernel proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/DataMode.v \
            proof/Phil/Core/DataProduct.v \
            proof/Phil/Surface/SurfaceNestedProductFoundationD05A.v \
            proof/Phil/Surface/SurfaceNestedProductSurfaceD05B.v \
            proof/Phil/Surface/SurfaceNestedProductSourceD05C.v \
            proof/Phil/Surface/SurfaceNestedProductSourceD05D.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceNestedProductSourceD05D
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceNestedProductSourceD05D.v; then
            echo "DATA-05D introduced an unproved admission" >&2
            exit 1
          fi
          sha256sum \
            proof/Phil/Surface/SurfaceNestedProductSourceD05D.v \
            proof/Phil/Surface/SurfaceNestedProductSourceD05D.vo
