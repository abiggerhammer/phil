name: Phase 1 Surface Determinacy Derivation Lookahead

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDerivation.v'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificate.v'
      - 'proof/Phil/Surface/GrammarDerivationLookahead.v'
      - 'docs/phase-1/surface-determinacy-derivation-lookahead-v1.md'
      - '.github/workflows/phase1-surface-determinacy-derivation-lookahead.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDerivation.v'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificate.v'
      - 'proof/Phil/Surface/GrammarDerivationLookahead.v'
      - 'docs/phase-1/surface-determinacy-derivation-lookahead-v1.md'
      - '.github/workflows/phase1-surface-determinacy-derivation-lookahead.yml'

permissions:
  contents: read

jobs:
  rocq-derivation-lookahead:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check
      - name: Compile ordinary derivation lookahead bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationLookahead.v
      - name: Record derivation-lookahead proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-determinacy-derivation-lookahead
          cp \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDerivation.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDerivationLookahead.v \
            proof/Phil/Surface/GrammarDerivationLookahead.vo \
            surface-determinacy-derivation-lookahead/
          sha256sum \
            grammar/phase1-surface.ebnf \
            scripts/derive_phase1_surface_grammar.py \
            scripts/derive_phase1_surface_determinacy_certificate.py \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDerivation.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDerivationLookahead.v \
            proof/Phil/Surface/GrammarDerivationLookahead.vo \
            > surface-determinacy-derivation-lookahead/identities.sha256
          cat surface-determinacy-derivation-lookahead/identities.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-determinacy-derivation-lookahead
          path: surface-determinacy-derivation-lookahead
          if-no-files-found: error
