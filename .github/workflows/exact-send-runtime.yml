# CI normalization equivalence witness; execution semantics unchanged.
name: Exact Send Runtime

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/**'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/HelloPolicyValidation.hs'
      - 'src/Phil/LLVM/ExactSend.hs'
      - 'src/Phil/LLVM/ExactSendCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMExactSendMain.hs'
      - 'runtime/phase0/exact_send_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ExactSendABIMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/exact-send-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Systems/**'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/HelloPolicyValidation.hs'
      - 'src/Phil/LLVM/ExactSend.hs'
      - 'src/Phil/LLVM/ExactSendCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMExactSendMain.hs'
      - 'runtime/phase0/exact_send_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ExactSendABIMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/exact-send-runtime.yml'

permissions:
  contents: read

jobs:
  exact-send-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build emitter and focused tests
        run: cabal build phil-llvm-phase0-exact-send phil-exact-send-abi-tests
      - name: Verify ABI and execute exact-send runtime primitive
        shell: bash
        run: |
          set -euo pipefail
          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-exact-send)"
          "$EMITTER" > phase0-exact-send.ll
          "$LLVM_AS" phase0-exact-send.ll -o phase0-exact-send.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/exact_send_v1_smoke.c \
            -o exact-send-runtime.ll
          python3 scripts/check_runtime_abi.py --partial \
            phase0-exact-send.ll exact-send-runtime.ll
          "$LLVM_AS" exact-send-runtime.ll -o exact-send-runtime.bc
          "$LLVM_LINK" phase0-exact-send.bc exact-send-runtime.bc \
            -o phase0-exact-send-partially-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 \
            runtime/phase0/exact_send_v1_smoke.c \
            runtime/phase0/exact_send_v1_smoke_main.c \
            -o exact-send-smoke
          ./exact-send-smoke

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm runtime/phase0/exact_send_v1_bad_ambient.c \
            -o exact-send-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-exact-send.ll exact-send-bad-ambient.ll; then
            echo "expected ABI checker to reject ambient/nullary exact-send provider" >&2
            exit 1
          fi

          cabal test phil-exact-send-abi-tests --test-show-details=direct
