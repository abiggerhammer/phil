name: Server Framed Ingress Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/LLVM/ServerFramedIngress.v'
      - 'src/Phil/LLVM/ServerFramedIngress.hs'
      - 'src/Phil/LLVM/ServerFramedIngressProofCertification.hs'
      - 'src/Phil/LLVM/ClientControlSend.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/Systems/RecognitionFailure.hs'
      - 'app/ServerFramedIngressProofCorrespondenceMain.hs'
      - 'app/ServerFramedIngressProofCertificationMain.hs'
      - 'app/LLVMServerFramedIngressMain.hs'
      - 'runtime/phase0/server_framed_ingress_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ServerFramedIngressABIMain.hs'
      - 'docs/phase-0/server-framed-ingress-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/server-framed-ingress-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/LLVM/ServerFramedIngress.v'
      - 'src/Phil/LLVM/ServerFramedIngress.hs'
      - 'src/Phil/LLVM/ServerFramedIngressProofCertification.hs'
      - 'src/Phil/LLVM/ClientControlSend.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/Systems/RecognitionFailure.hs'
      - 'app/ServerFramedIngressProofCorrespondenceMain.hs'
      - 'app/ServerFramedIngressProofCertificationMain.hs'
      - 'app/LLVMServerFramedIngressMain.hs'
      - 'runtime/phase0/server_framed_ingress_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ServerFramedIngressABIMain.hs'
      - 'docs/phase-0/server-framed-ingress-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/server-framed-ingress-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-server-framed-ingress:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check Server Framed Ingress proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ServerFramedIngress.v
      - name: Stage checked Server Framed Ingress proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rocq-server-framed-ingress/proof/Phil/LLVM
          cp proof/Phil/LLVM/ServerFramedIngress.v \
             proof/Phil/LLVM/ServerFramedIngress.vo \
             rocq-server-framed-ingress/proof/Phil/LLVM/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-server-framed-ingress-checked-proof-objects
          path: rocq-server-framed-ingress/
          if-no-files-found: error
          retention-days: 14

  certify-server-framed-ingress:
    needs: rocq-server-framed-ingress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-server-framed-ingress-checked-proof-objects
          path: rocq-server-framed-ingress

      - name: Build target and focused regression
        run: |
          cabal build lib:phil-core \
            phil-llvm-phase0-server-framed-ingress \
            phil-server-framed-ingress-abi-tests

      - name: Run focused server-framed-ingress regression
        run: cabal test phil-server-framed-ingress-abi-tests --test-show-details=direct

      - name: Typecheck proof support with warnings as errors
        run: |
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/LLVM/ServerFramedIngressProofCertification.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/ServerFramedIngressProofCorrespondenceMain.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/ServerFramedIngressProofCertificationMain.hs

      - name: Run exact correspondence and drift checks
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/ServerFramedIngressProofCorrespondenceMain.hs \
            -o phil-check-server-framed-ingress-proof-correspondence
          ./phil-check-server-framed-ingress-proof-correspondence

      - name: Re-run LLVM, ABI, provider, and native gates
        shell: bash
        run: |
          set -euo pipefail
          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-server-framed-ingress)"
          "$EMITTER" > phase0-server-framed-ingress.ll
          "$LLVM_AS" phase0-server-framed-ingress.ll -o phase0-server-framed-ingress.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/server_framed_ingress_v1_smoke.c \
            -o server-framed-ingress-runtime.ll
          python3 scripts/check_runtime_abi.py --partial \
            phase0-server-framed-ingress.ll server-framed-ingress-runtime.ll
          "$LLVM_AS" server-framed-ingress-runtime.ll -o server-framed-ingress-runtime.bc
          "$LLVM_LINK" phase0-server-framed-ingress.bc server-framed-ingress-runtime.bc \
            -o phase0-server-framed-ingress-partially-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 \
            runtime/phase0/server_framed_ingress_v1_smoke.c \
            runtime/phase0/server_framed_ingress_v1_smoke_main.c \
            -o server-framed-ingress-smoke
          ./server-framed-ingress-smoke

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm runtime/phase0/server_framed_ingress_v1_bad_ambient.c \
            -o server-framed-ingress-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-server-framed-ingress.ll server-framed-ingress-bad-ambient.ll; then
            echo "expected ABI checker to reject ambient/nullary server ingress provider" >&2
            exit 1
          fi

      - name: Build proof-bound CERT-015 certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/ServerFramedIngressProofCertificationMain.hs \
            -o phil-certify-server-framed-ingress

      - name: Produce proof certificate and proof-bound CERT-015
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server-framed-ingress-certificates
          ./phil-certify-server-framed-ingress
          for certificate in server-framed-ingress-certificates/*; do
            echo "===== ${certificate} ====="
            cat "${certificate}"
            sha256sum "${certificate}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: phil-server-framed-ingress-proof-certification
          path: server-framed-ingress-certificates/*
          if-no-files-found: error
          retention-days: 30
