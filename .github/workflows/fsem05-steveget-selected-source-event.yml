name: FSEM-05 SteveGet Selected Source Event Preflight

on:
  push:
    branches:
      - formal-semantics/fsem05-steveget-qualified-source-events
    paths:
      - 'src/Phil/Surface/SelectedSteveGetExecution.hs'
      - 'phil-core.cabal'
      - 'test/FSEM05SteveGetSelectedSourceEventMain.hs'
      - 'proof/Phil/Verification/FSEM05SteveGetSelectedSourceEvents.v'
      - 'docs/phase-1/fsem05-steveget-qualified-source-event-v1.md'
      - '.github/workflows/fsem05-steveget-selected-source-event.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/SelectedSteveGetExecution.hs'
      - 'phil-core.cabal'
      - 'test/FSEM05SteveGetSelectedSourceEventMain.hs'
      - 'proof/Phil/Verification/FSEM05SteveGetSelectedSourceEvents.v'
      - 'docs/phase-1/fsem05-steveget-qualified-source-event-v1.md'
      - '.github/workflows/fsem05-steveget-selected-source-event.yml'

concurrency:
  group: fsem05-selected-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-original-surface:
    name: GHC 9.6.7 original source reifier and adversarial E/H
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP/1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Strict library plus actual original-source evaluator adversarial matrix
        shell: bash
        run: |
          set -euo pipefail
          # The selected real-source adapter imports established Steve provider modules
          # omitted from the legacy package manifest. Preserve strict -Werror for all
          # other diagnostics without widening the maintainer-authorized Cabal edit.
          cabal build lib:phil-core --ghc-options='-Werror -Wno-missing-home-modules'
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/FSEM05SteveGetSelectedSourceEventMain.hs
          # Real external importing clients: ordinary getters must compile,
          # but every attempted SelectedSteveGet record update must fail
          # SPECIFICALLY because the identifier is not a record selector.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cat > "$tmpdir/GetterClient.hs" <<'HS'
          module GetterClient (admittedGetters) where
          import Phil.Surface.SelectedSteveGetExecution
          import Phil.Surface.Syntax (SourceSpan)
          import Phil.Core.Static (DeclarationKey, InstanceKey)
          admittedGetters :: SelectedSteveGet
            -> (SourceSpan, SourceSpan, DeclarationKey, InstanceKey,
                QualifiedProviderRef, QualifiedProviderRef)
          admittedGetters s =
            ( selectedReadOccurrence s, selectedDigestOccurrence s
            , selectedDeclarationKey s, selectedInstanceKey s
            , selectedReadProvider s, selectedDigestProvider s )
          HS
          cabal exec -- ghc -isrc -Wall -Werror -fno-code "$tmpdir/GetterClient.hs"
          for field in selectedReadOccurrence selectedDigestOccurrence \
                       selectedDeclarationKey selectedInstanceKey \
                       selectedReadProvider selectedDigestProvider; do
            cat > "$tmpdir/ForbiddenUpdate.hs" <<HS
          module ForbiddenUpdate where
          import Phil.Surface.SelectedSteveGetExecution
          cannotUpdate :: SelectedSteveGet -> SelectedSteveGet
          cannotUpdate selected = selected { ${field} = ${field} selected }
          HS
            if cabal exec -- ghc -isrc -Wall -Werror -fno-code \
                "$tmpdir/ForbiddenUpdate.hs" >"$tmpdir/error.log" 2>&1; then
              echo "BUG: external descriptor update compiled for $field" >&2
              exit 1
            fi
            grep -Fq "$field" "$tmpdir/error.log" || { cat "$tmpdir/error.log"; exit 1; }
            grep -Eq '(not a record selector|not a record field|not a field of)' \
              "$tmpdir/error.log" || { cat "$tmpdir/error.log"; exit 1; }
            echo "PASS: cannot record-update admitted descriptor field $field"
          done
          cabal exec -- runghc -isrc -itest -Wall -Werror test/FSEM05SteveGetSelectedSourceEventMain.hs
          git hash-object examples/steve/get.phil
          sha256sum src/Phil/Surface/SelectedSteveGetExecution.hs \
            test/FSEM05SteveGetSelectedSourceEventMain.hs \
            phil-core.cabal examples/steve/get.phil

  selected-source-rocq:
    name: Rocq 9.2 declarative/executable origin step proofs and object check
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact selected proof, closed assumptions and recursive object check
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          proof=proof/Phil/Verification/FSEM05SteveGetSelectedSourceEvents.v
          rocq c -Q proof/Phil Phil "$proof"
          rocq check -Q proof/Phil Phil Phil.Verification.FSEM05SteveGetSelectedSourceEvents
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' "$proof"; then
            echo "FSEM-05 proposed new rule introduced an unproved admission" >&2
            exit 1
          fi
          sha256sum "$proof" proof/Phil/Verification/FSEM05SteveGetSelectedSourceEvents.vo

  scope:
    name: Exclusive FSEM-05 changed paths and claim ref
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only maintainer-authorized selected FSEM-05 paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import subprocess
          allowed = {
            "src/Phil/Surface/SelectedSteveGetExecution.hs",
            "phil-core.cabal",
            "test/FSEM05SteveGetSelectedSourceEventMain.hs",
            "proof/Phil/Verification/FSEM05SteveGetSelectedSourceEvents.v",
            "docs/phase-1/fsem05-steveget-qualified-source-event-v1.md",
            ".github/workflows/fsem05-steveget-selected-source-event.yml",
          }
          changed = set(subprocess.check_output(
            ["git", "diff", "--name-only", "origin/main...HEAD"],
            text=True).splitlines())
          forbidden = changed - allowed
          if forbidden:
            raise SystemExit("unauthorized files: " + repr(sorted(forbidden)))
          assert changed, "empty selected FSEM-05 slice"
          print("PASS: only authorized paths", sorted(changed))
          PY
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          import fsem_claim
          api = fsem_claim.GitHub(token=os.environ["GH_TOKEN"])
          record, commit_sha = fsem_claim.live_claim(api, "fsem-05")
          fsem_claim.require_issue_record(api, record, commit_sha)
          assert record["branch"] == "formal-semantics/fsem05-steveget-qualified-source-events"
          assert record["actor"] == "hamster:fsem-05-source"
          print("PASS: exact atomic prebranch family claim", commit_sha)
          PY
