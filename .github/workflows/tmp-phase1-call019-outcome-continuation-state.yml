name: Temporary CALL-019 Outcome Continuation State

on:
  push:
    branches:
      - phase1-call019-outcome-continuation-state

permissions:
  contents: read

jobs:
  outcome-continuation-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build Haskell substrate
        run: cabal build all --enable-tests

      - name: Check CALL-019 outcome continuation state
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019OutcomeContinuationStateMain.hs

      - name: Replay CALL-019 branch-aware invocation context
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019BranchAwareInvocationContextMain.hs

      - name: Replay CALL-019 branch semantic witness
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019OutcomeBranchSemanticWitnessMain.hs

      - name: Replay CALL-019 declared-terminal control
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019OutcomeControlBoundaryMain.hs

      - name: Replay CALL-019 authority possession
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019AuthorityPossessionMain.hs

      - name: Replay Steve invoke integration
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1INT006SteveApplicationShellMain.hs
