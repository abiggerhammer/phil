name: Phase 1 Surface Determinacy Witness Soundness Debug 16

on:
  pull_request:

permissions:
  contents: read

jobs:
  rocq-witness-soundness-debug16:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write

      - name: Apply nullable packaging and FIRST bridge diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase1-surface-determinacy-witness-soundness-debug15.yml').read_text()
          marker = workflow.index('- name: Apply opaque-case nullable witness diagnostic')
          start = workflow.index('          from pathlib import Path', marker)
          end = workflow.index('\n          PY', start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<existing-debug15-diagnostics>', 'exec'), {})

          path = Path('proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v')
          source = path.read_text()
          old = '''    pose proof
              (proj1 phase1_surface_nullable_witness_fuel_sound
                item Hnullable fuel Hfuel_item Hitem_safe)
              as Hitem_nullable.
          '''
          new = '''    pose proof
              (choice_safe_implies_nullable_depth_safe
                fuel item Hitem_safe)
              as Hitem_depth_safe.
            pose proof
              (nullable_witness_depth_sound
                item Hnullable fuel Hitem_depth_safe)
              as Hitem_nullable.
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one stale nullable FIRST bridge, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source)
          print(f'generated witness proof characters: {len(source)}')
          PY

      - name: Compile witness soundness with forced timeout
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationLookahead.v
          timeout -k 5s 180s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
