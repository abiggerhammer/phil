name: FSEM-01 Nominal Affine Product Early Preflight

concurrency:
  # PR supersession is limited to this workflow and this exact PR.
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Run a bounded branch-push gate before opening the broad CI PR.
  push:
    branches:
      - formal-semantics/fsem01-nominal-affine-product
    paths:
      - 'src/Phil/Surface/GrammarV1/CheckedType.hs'
      - 'src/Phil/Surface/GrammarV1/SourceAffineProduct.hs'
      - 'test/Phase1FSEM01NominalAffineProductMain.hs'
      - 'test/fixtures/fsem01-nominal-affine-product-v1/**'
      - 'proof/Phil/Surface/SurfaceNominalAffineProductBridge.v'
      - 'docs/phase-1/formal-semantics-nominal-affine-product-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-nominal-affine-product-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/CheckedType.hs'
      - 'src/Phil/Surface/GrammarV1/SourceAffineProduct.hs'
      - 'test/Phase1FSEM01NominalAffineProductMain.hs'
      - 'test/fixtures/fsem01-nominal-affine-product-v1/**'
      - 'proof/Phil/Surface/SurfaceNominalAffineProductBridge.v'
      - 'docs/phase-1/formal-semantics-nominal-affine-product-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-nominal-affine-product-preflight.yml'

permissions:
  contents: read

jobs:
  strict-haskell-source-product:
    name: Strict SURF-008 and source nominal affine product
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Update Hackage with bounded HTTP/1.1 retry
        shell: bash
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Strict production library compilation
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
      - name: Run SURF-008 and existing FSEM-01 checks
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            Phase1GrammarV1IntrinsicTypeCompositionMain \
            Phase1GrammarV1CallableContractMain \
            Phase1GrammarV1CheckedBoundaryValueTypeMain \
            Phase1GrammarV1CheckedTypeAliasMain \
            Phase1GrammarV1CheckedRecordFieldsMain \
            Phase1GrammarV1CheckedDataVariantsMain \
            Phase1GrammarV1CheckedDataModeCompositionMain \
            Phase1GrammarV1NamedTypeModeMain \
            Phase1FSEM01TwoOwnerSourceMain \
            Phase1FSEM01FlatProductMain \
            Phase1FSEM01FiniteContextMain \
            Phase1FSEM01SourceAffineMain \
            Phase1FSEM01MixedAffineLinearMain
          do
            echo "== SURF-008/FSEM-01: $test =="
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
      - name: Typecheck and run nominal product success/rejection corpus
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1FSEM01NominalAffineProductMain.hs
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1FSEM01NominalAffineProductMain.hs
          sha256sum src/Phil/Surface/GrammarV1/CheckedType.hs \
            src/Phil/Surface/GrammarV1/SourceAffineProduct.hs \
            test/Phase1FSEM01NominalAffineProductMain.hs

  rocq-product-ownership:
    name: Rocq nominal product ordered contract and ownership lemmas
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile flat product, affine admission and mixed owner proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/DataMode.v \
            proof/Phil/Core/DataProduct.v \
            proof/Phil/Surface/SurfaceFlatProductCorrespondence.v \
            proof/Phil/Surface/SurfaceFiniteContextFrame.v \
            proof/Phil/Surface/SurfaceSourceAffineBridge.v \
            proof/Phil/Surface/SurfaceNominalAffineProductBridge.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceNominalAffineProductBridge.v; then
            echo "Unproved nominal-product statement added" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceNominalAffineProductBridge.v \
            proof/Phil/Surface/SurfaceNominalAffineProductBridge.vo
