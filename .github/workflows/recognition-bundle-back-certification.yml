# CI normalization equivalence witness; execution semantics unchanged.
name: Recognition Bundle Back-Certification

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/SessionStep.v'
      - 'proof/Phil/Core/Recognition.v'
      - 'proof/Phil/Core/RecognitionLoan.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqBundle.hs'
      - 'src/Phil/Assurance/RocqRecognitionBundles.hs'
      - 'app/RecognitionBundlesBackCertificationMain.hs'
      - 'app/RecognitionBundleCorrespondenceMain.hs'
      - '.github/workflows/recognition-bundle-back-certification.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/SessionStep.v'
      - 'proof/Phil/Core/Recognition.v'
      - 'proof/Phil/Core/RecognitionLoan.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqBundle.hs'
      - 'src/Phil/Assurance/RocqRecognitionBundles.hs'
      - 'app/RecognitionBundlesBackCertificationMain.hs'
      - 'app/RecognitionBundleCorrespondenceMain.hs'
      - '.github/workflows/recognition-bundle-back-certification.yml'

permissions:
  contents: read

jobs:
  check-recognition-bundles:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check Recognition proof corpus
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionStep.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Recognition.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RecognitionLoan.v
      - name: Stage checked Recognition proof parts
        run: |
          mkdir -p checked/proof/Phil/Core
          for proof in Recognition RecognitionLoan; do
            cp "proof/Phil/Core/${proof}.v" checked/proof/Phil/Core/
            cp "proof/Phil/Core/${proof}.vo" checked/proof/Phil/Core/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: recognition-bundle-checked-proofs
          path: checked/
          if-no-files-found: error
          retention-days: 14

  certify-recognition-bundles:
    needs: check-recognition-bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: recognition-bundle-checked-proofs
          path: checked
      - name: Build Phil assurance library
        run: cabal build lib:phil-core
      - name: Typecheck bundle framework, specs, regressions, and certifier
        run: |
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/Assurance/RocqBundle.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/Assurance/RocqRecognitionBundles.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/RecognitionBundleCorrespondenceMain.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/RecognitionBundlesBackCertificationMain.hs
      - name: Run proof-bundle acceptance regressions
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/RecognitionBundleCorrespondenceMain.hs \
            -o phil-check-recognition-bundles
          ./phil-check-recognition-bundles checked
      - name: Build Recognition bundle back-certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/RecognitionBundlesBackCertificationMain.hs \
            -o phil-certify-recognition-bundles
      - name: Produce four proof-part certificates
        run: |
          mkdir -p recognition-bundle-certificates
          ./phil-certify-recognition-bundles checked recognition-bundle-certificates
          test "$(find recognition-bundle-certificates -type f -name '*.rocq.cert' | wc -l)" -eq 4
          sha256sum recognition-bundle-certificates/*.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-recognition-bundle-proof-certificates
          path: recognition-bundle-certificates/
          if-no-files-found: error
          retention-days: 30
