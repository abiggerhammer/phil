name: Audit Independent Durable Subject Review

on:
  push:
    branches: [audit-durable-subject-independent-20260924]
    paths: ['.github/workflows/audit-durable-subject-independent.yml']

permissions:
  contents: read

concurrency:
  group: audit-durable-subject-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-subject-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact proposed implementation
        uses: actions/checkout@v4
        with:
          ref: f1e0d3197b0079c9c6eaee8ab2e601fd4a286a1f
          path: subject
          persist-credentials: false
      - name: Check out exact independent driver
        uses: actions/checkout@v4
        with:
          ref: 88219a267526a32d33179a3b7236e34f738729b1
          path: driver
          persist-credentials: false
      - name: Check out unchanged original-event producer driver
        uses: actions/checkout@v4
        with:
          ref: f74885816c09bc114afbdfca8c666a8fab67083c
          path: producer
          persist-credentials: false
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.18.1.0'
      - name: Record exact independent inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/build
          git -C subject rev-parse HEAD > evidence/subject-commit.txt
          git -C driver rev-parse HEAD > evidence/driver-commit.txt
          git -C producer rev-parse HEAD > evidence/producer-driver-commit.txt
          printf '%s\n' '${{ github.sha }}' > evidence/workflow-commit.txt
          test "$(cat evidence/subject-commit.txt)" = f1e0d3197b0079c9c6eaee8ab2e601fd4a286a1f
          test "$(cat evidence/driver-commit.txt)" = 88219a267526a32d33179a3b7236e34f738729b1
          test "$(cat evidence/producer-driver-commit.txt)" = f74885816c09bc114afbdfca8c666a8fab67083c
          git -C subject status --porcelain --untracked-files=all > evidence/subject-status-before.txt
          test ! -s evidence/subject-status-before.txt
          cp driver/audit/durable-subject-review/DurableSubjectReview.hs evidence/
          cp producer/audit/independent-support-producer/SupportProducerReview.hs evidence/
          test "$(git hash-object evidence/DurableSubjectReview.hs)" = 14ae49123712fc8f403ab9e4d4e4f753589e5d34
          test "$(git hash-object evidence/SupportProducerReview.hs)" = 9ebe2c3c3a1f9f368752d2c9987b174e67e51314
          sha256sum evidence/*.hs > evidence/driver.sha256
          ghc --numeric-version > evidence/ghc-version.txt
          cabal --numeric-version > evidence/cabal-version.txt
          for path in src/Phil/Core/Checker.hs src/Phil/Core/SortCheck.hs src/Phil/Core/Discharge.hs src/Phil/Core/Value.hs src/Phil/Core/Refinement.hs src/Phil/Core/Focusing.hs src/Phil/Core/Decision.hs src/Phil/Assurance/Handoff.hs src/Phil/Assurance/EvidenceFactAuthority.hs; do
            printf '%s %s\n' "$(git -C subject rev-parse "HEAD:$path")" "$path" >> evidence/source-git-blobs.txt
          done
      - name: Build pinned production substrate
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cabal update 2>&1 | tee ../evidence/dependency-index.log
          cabal build all --enable-tests 2>&1 | tee ../evidence/build.log
      - name: Strictly compile independent review driver
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -O0 -Wall -Werror -isrc -outputdir ../evidence/build ../evidence/DurableSubjectReview.hs -o ../evidence/durable-review 2>&1 | tee ../evidence/compile.log
      - name: Measure required assertions and separate observations
        shell: bash
        run: |
          set -euo pipefail
          set +e
          evidence/durable-review > evidence/results.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > evidence/results.exit
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path('evidence/results.log').read_text().splitlines()
          rows = [line.split(' ', 2) for line in lines if line.startswith(('PASS ', 'FAIL '))]
          expected = [f'C{i:02d}' for i in range(1,15)] + ['R01', 'R02']
          assert [r[1] for r in rows] == expected, rows
          assert not any(line.startswith('OBS_SETUP_ERROR ') for line in lines), lines
          observations = [line for line in lines if line.startswith('OBS ')]
          assert [line.split(' ',2)[1] for line in observations] == ['O01','O02'], observations
          assert lines.count('COMPLETE correctness_groups=16 observations=2') == 1
          code = int(Path('evidence/results.exit').read_text())
          assert code in (0,1), code
          all_pass = all(r[0] == 'PASS' for r in rows)
          assert (code == 0) == all_pass, (code, rows)
          result = {'measurement_complete': True, 'all_required_assertions_passed': all_pass,
                    'repair_certified': False, 'source_adapter_established': False,
                    'observations_correctness_credit': 0, 'exit_code': code,
                    'cases': rows, 'observations': observations}
          Path('evidence/protocol.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k not in ('cases','observations')},indent=2))
          for r in rows:
              print(r[0],r[1])
          # A green measurement records regression failures, not repair success.
          # Setup and unexpected preservation failures still fail this job.
          assert all(r[0] == 'PASS' for r in rows if r[1].startswith('C')), rows
          PY
      - name: Strict replay unchanged original-event producer
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -Wall -Werror ../evidence/SupportProducerReview.hs 2>&1 | tee ../evidence/producer-results.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('../evidence/producer-results.log').read_text().splitlines()
          assert [s.split()[1] for s in lines if s.startswith('PASS ')] == [f'C{i:02d}' for i in range(1,8)]
          assert [s.split()[1] for s in lines if s.startswith('OBS ')] == ['O01','O02','O03']
          assert not any(s.startswith(('FAIL ', 'OBS_SETUP_ERROR ')) for s in lines)
          assert lines.count('COMPLETE correctness_groups=7 observation_records=3') == 1
          PY
      - name: Replay permanent related suites at exact subject
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for suite in Phase1AuditDurableLogicalSubjectMain Phase1AuditRefinementConsumedSubjectMain DischargeMain RefinementEvidenceMain; do
            cp "test/$suite.hs" "../evidence/$suite.hs"
            set +e
            cabal exec -- runghc -isrc -Wall -Werror "test/$suite.hs" > "../evidence/$suite.log" 2>&1
            status=$?
            set -e
            printf '%s %s\n' "$suite" "$status" >> ../evidence/permanent-exits.txt
            if test "$status" -ne 0; then failed=1; fi
          done
          git status --porcelain --untracked-files=all > ../evidence/subject-status-after.txt
          test ! -s ../evidence/subject-status-after.txt
          test "$(git rev-parse HEAD)" = f1e0d3197b0079c9c6eaee8ab2e601fd4a286a1f
          exit "$failed"
      - name: Preserve all raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-subject-independent-f1e0d319
          path: |
            evidence/*.txt
            evidence/*.sha256
            evidence/*.hs
            evidence/*.json
            evidence/*.exit
            evidence/*.log
          if-no-files-found: error
