name: Version Refinement Fix V2

on:
  pull_request:
    paths:
      - '.github/workflows/version-refinement-fix-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lower-version-session-choice
          fetch-depth: 0
      - name: Make client version refinement explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern!r}")
              p.write_text(new)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          ir = 'src/Phil/LLVM/IR.hs'
          sub_once(ir,
              r'(  \| LLVMVersionChoiceOffer\n\s+Text\n\s+Text\n\s+LLVMBlockId\n\s+LLVMBlockId\n)(  \| LLVMReturnScalar Text ScalarType)',
              r'\1  | LLVMVersionRefinement\n      RuntimeSiteRef\n      Text\n      Text\n      LLVMBlockId\n      LLVMBlockId\n\2')
          replace_once(ir,
              '  LLVMVersionChoiceOffer _ _ versionTarget unsupportedTarget -> [versionTarget, unsupportedTarget]\n  LLVMReturnScalar _ _ -> []\n',
              '  LLVMVersionChoiceOffer _ _ versionTarget unsupportedTarget -> [versionTarget, unsupportedTarget]\n  LLVMVersionRefinement _ _ _ yes no -> [yes, no]\n  LLVMReturnScalar _ _ -> []\n')
          replace_once(ir,
              '        LLVMStore site _ _ _ _ -> [site]\n        _ -> []\n',
              '        LLVMStore site _ _ _ _ -> [site]\n        LLVMVersionRefinement site _ _ _ _ -> [site]\n        _ -> []\n')
          replace_once(ir,
              '      <> versionChoiceReceiveDeclaration\n      <> map renderCallDeclaration',
              '      <> versionChoiceReceiveDeclaration\n      <> versionRefinementDeclaration\n      <> map renderCallDeclaration')
          sub_once(ir,
              r'(    versionChoiceReceiveDeclaration =\n      if any hasVersionChoiceOffer allBlocks\n        then \["declare i1 @phil_runtime_receive_version_choice\(ptr, ptr\)"\]\n        else \[\]\n)',
              r'\1\n    versionRefinementDeclaration =\n      if any hasVersionRefinement allBlocks\n        then ["declare i1 @phil_runtime_refine_selected_version(ptr, i16)"]\n        else []\n')
          sub_once(ir,
              r'(    hasVersionChoiceOffer blockValue = case llvmBlockTerminator blockValue of\n      LLVMVersionChoiceOffer \{\} -> True\n      _ -> False\n)',
              r'\1\n    hasVersionRefinement blockValue = case llvmBlockTerminator blockValue of\n      LLVMVersionRefinement {} -> True\n      _ -> False\n')
          replace_once(ir,
              '      LLVMReturnScalar name scalarType ->\n        ["ret " <> renderScalarType scalarType <> " %" <> symbol name]\n',
              '''      LLVMVersionRefinement _ transport selected yes no ->
        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))
            validName = "%phil_version_refinement_ok_" <> blockSymbol
        in
          [ validName <> " = call i1 @phil_runtime_refine_selected_version(ptr %"
              <> symbol transport <> ", i16 %" <> symbol selected <> ")"
          , "br i1 " <> validName
              <> ", label %" <> symbol (unLLVMBlockId yes)
              <> ", label %" <> symbol (unLLVMBlockId no)
          ]
      LLVMReturnScalar name scalarType ->
        ["ret " <> renderScalarType scalarType <> " %" <> symbol name]
''')

          target = 'src/Phil/LLVM/VersionSessionChoice.hs'
          replace_once(target,
              '  | VersionChoiceLLVMClientBindingMismatch Text LLVMBlockId [LLVMOp]\n  | VersionChoiceLLVMPayloadCancelRegression Text\n',
              '  | VersionChoiceLLVMClientBindingMismatch Text LLVMBlockId [LLVMOp]\n  | VersionChoiceLLVMClientRefinementMismatch Text LLVMBlockId LLVMTerminator\n  | VersionChoiceLLVMPayloadCancelRegression Text\n')
          replace_once(target,
              '  , "receive-out=pointer-to-i16-selected-version-slot"\n  , "wire-unsupported=0x00"\n',
              '  , "receive-out=pointer-to-i16-selected-version-slot"\n  , "client-refine=phil_runtime_refine_selected_version(ptr,i16)->i1"\n  , "client-refine-arg0=exact-client-transport-handle"\n  , "client-refine-arg1=decoded-selected-version"\n  , "client-refine-provider-obligation=transport-local-offered-set-is-exact-set-sent-in-prior-Hello"\n  , "wire-unsupported=0x00"\n')
          sub_once(target,
              r'(    rewriteClientVersionTarget blockValue = blockValue\n      \{ llvmBlockOps = LLVMVersionChoicePayloadBinding\n          \(unValueId \(versionChoiceClientSelectedVersion versionWitness\)\)\n          : llvmBlockOps blockValue\n)(      \})',
              r'\1      , llvmBlockTerminator = case llvmBlockTerminator blockValue of\n          LLVMRuntimeBranch site _ yes no -> LLVMVersionRefinement\n            site\n            (unValueId (versionChoiceClientTransport versionWitness))\n            (unValueId (versionChoiceClientSelectedVersion versionWitness))\n            yes\n            no\n          other -> other\n\2')
          replace_once(target,
              '  unless (LLVMVersionChoicePayloadBinding clientSelected `elem` llvmBlockOps clientVersion) $\n    Left (VersionChoiceLLVMClientBindingMismatch\n      clientName clientVersionTargetId (llvmBlockOps clientVersion))\n',
              '''  unless (LLVMVersionChoicePayloadBinding clientSelected `elem` llvmBlockOps clientVersion) $
    Left (VersionChoiceLLVMClientBindingMismatch
      clientName clientVersionTargetId (llvmBlockOps clientVersion))
  case llvmBlockTerminator clientVersion of
    LLVMVersionRefinement _ transport selected yes no
      | transport == clientTransport
          && selected == clientSelected
          && yes == LLVMBlockId (unBlockId (versionChoiceClientVersionSuccess versionWitness))
          && no == LLVMBlockId (unBlockId (versionChoiceClientVersionFailure versionWitness)) -> pure ()
    other -> Left (VersionChoiceLLVMClientRefinementMismatch
      clientName clientVersionTargetId other)
''')
          replace_once(target,
              '    && Text.isInfixOf "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)" rendered\n    ) $\n',
              '    && Text.isInfixOf "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)" rendered\n    && Text.isInfixOf "declare i1 @phil_runtime_refine_selected_version(ptr, i16)" rendered\n    ) $\n')
          replace_once(target,
              '    && not (Text.isInfixOf "@phil_call_receive_version_unsupported_label" rendered)\n    ) $\n',
              '    && not (Text.isInfixOf "@phil_call_receive_version_unsupported_label" rendered)\n    && not (Text.isInfixOf "@phil_runtime_refine_selected_version()" rendered)\n    ) $\n')

          cert = 'src/Phil/LLVM/VersionSessionChoiceCertification.hs'
          replace_once(cert,
              '-- choose_supported set semantics, opaque version-set representation, concrete\n-- byte I/O, malformed-input non-return, physical write success, LLVM 18,\n-- linking, and native execution remain independent gates.\n',
              '-- choose_supported set semantics, transport-local client offered-version\n-- association, opaque version-set representation, concrete byte I/O,\n-- malformed-input non-return, physical write success, LLVM 18, linking,\n-- and native execution remain independent gates.\n')
          replace_once(cert,
              '        , ("receiver", "phil_runtime_receive_version_choice(ptr,ptr)->i1")\n        , ("wire_unsupported", "0x00")\n',
              '        , ("receiver", "phil_runtime_receive_version_choice(ptr,ptr)->i1")\n        , ("client_refinement", "phil_runtime_refine_selected_version(ptr,i16)->i1")\n        , ("client_refinement_transport_state", "external provider must bind transport-local offered set to exact prior Hello")\n        , ("wire_unsupported", "0x00")\n')
          replace_once(cert,
              'exact server selectors, exact client receiver and branch-local UInt16 binding, preservation of payload/cancel physical lowering, and absence of ambient choice/version/transport state, while provider set-selection semantics, opaque version-set representation, concrete byte I/O, malformed-input non-return, physical write success, provider conformance, LLVM 18, linking, and native execution remain external gates."\n',
              'exact server selectors, exact client receiver and branch-local UInt16 binding, explicit transport-scoped client refinement of the decoded UInt16, preservation of payload/cancel physical lowering, and absence of global ambient choice/version/transport state, while provider set-selection semantics, exact transport-local association with the versions sent in the prior Hello, opaque version-set representation, concrete byte I/O, malformed-input non-return, physical write success, provider conformance, LLVM 18, linking, and native execution remain external gates."\n')
          replace_once(cert,
              '            , "client receiver maps false->unsupported true->version and binds selected UInt16 only on version"\n            , "payload/cancel and final-response physical lowerings remain intact"\n',
              '            , "client receiver maps false->unsupported true->version and binds selected UInt16 only on version"\n            , "client refinement consumes exact transport plus decoded selected UInt16"\n            , "payload/cancel and final-response physical lowerings remain intact"\n')

          replace_once('runtime/phase0/version_session_choice_v1.h',
              'bool phil_runtime_receive_version_choice(\n    void *transport,\n    uint16_t *selected_version_out);\n',
              'bool phil_runtime_receive_version_choice(\n    void *transport,\n    uint16_t *selected_version_out);\nbool phil_runtime_refine_selected_version(\n    void *transport,\n    uint16_t selected_version);\n')
          replace_once('runtime/phase0/version_session_choice_v1_smoke_fixture.h',
              'struct phil_test_choice_transport {\n    uint8_t input[PHIL_TEST_WIRE_CAPACITY];\n',
              'struct phil_test_choice_transport {\n    const struct phil_test_version_set *offered_versions;\n    uint8_t input[PHIL_TEST_WIRE_CAPACITY];\n')
          replace_once('runtime/phase0/version_session_choice_v1_smoke.c',
              'bool phil_runtime_receive_version_choice(\n    void *transport_value,\n    uint16_t *selected_version_out) {\n',
              '''bool phil_runtime_refine_selected_version(
    void *transport_value,
    uint16_t selected_version) {
    struct phil_test_choice_transport *transport = as_transport(transport_value);
    size_t i;
    if (transport->offered_versions == NULL
        || transport->offered_versions->length > PHIL_TEST_VERSION_CAPACITY) {
        abort();
    }
    for (i = 0; i < transport->offered_versions->length; ++i) {
        if (transport->offered_versions->values[i] == selected_version) {
            return true;
        }
    }
    return false;
}

bool phil_runtime_receive_version_choice(
    void *transport_value,
    uint16_t *selected_version_out) {
''')
          replace_once('runtime/phase0/version_session_choice_v1_smoke_main.c',
              '    reset_transport(&transport);\n    transport.input[0] = 0x00u;\n',
              '''    reset_transport(&transport);
    transport.offered_versions = &hello.versions;
    if (!phil_runtime_refine_selected_version(&transport, 2u)
        || phil_runtime_refine_selected_version(&transport, 9u)) {
        fputs("selected-version refinement mismatch\\n", stderr);
        return 1;
    }

    reset_transport(&transport);
    transport.input[0] = 0x00u;
''')
          replace_once('runtime/phase0/version_session_choice_v1_bad_ambient.c',
              'bool phil_runtime_receive_version_choice(uint16_t *selected_version_out) {\n    (void) selected_version_out;\n    return false;\n}\n',
              'bool phil_runtime_receive_version_choice(uint16_t *selected_version_out) {\n    (void) selected_version_out;\n    return false;\n}\nbool phil_runtime_refine_selected_version(uint16_t selected_version) {\n    (void) selected_version;\n    return false;\n}\n')

          test = 'test/VersionSessionChoiceABIMain.hs'
          replace_once(test,
              '        expectedBinding = LLVMVersionChoicePayloadBinding\n          (unValueId (versionChoiceClientSelectedVersion witness))\n    pure (llvmBlockTerminator offer == expectedTerm\n      && expectedBinding `elem` llvmBlockOps target)\n',
              '''        expectedBinding = LLVMVersionChoicePayloadBinding
          (unValueId (versionChoiceClientSelectedVersion witness))
        refinementOkay = case llvmBlockTerminator target of
          LLVMVersionRefinement _ transport selected yes no ->
            transport == unValueId (versionChoiceClientTransport witness)
              && selected == unValueId (versionChoiceClientSelectedVersion witness)
              && yes == LLVMBlockId (unBlockId (versionChoiceClientVersionSuccess witness))
              && no == LLVMBlockId (unBlockId (versionChoiceClientVersionFailure witness))
          _ -> False
    pure (llvmBlockTerminator offer == expectedTerm
      && expectedBinding `elem` llvmBlockOps target
      && refinementOkay)
''')
          replace_once(test,
              '      , "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)"\n      ]\n',
              '      , "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)"\n      , "declare i1 @phil_runtime_refine_selected_version(ptr, i16)"\n      ]\n')

          doc = Path('docs/phase-0/version-session-choice-abi-v1.md')
          text = doc.read_text()
          marker = '## Malformed input and failure behavior\n'
          insert = '''## Client selected-version refinement

After decoding `version(selected)`, the client refinement is a physical runtime boundary:

```llvm
declare i1 @phil_runtime_refine_selected_version(ptr %transport, i16 %selected)
```

The transport operand is explicit and identifies the session-local state. The runtime provider must associate that transport with the exact versions placed in the client's prior `Hello`; this association is an external provider obligation in the translation-only `PHIL-LLVM-CERT-010` tranche. No global/current selected-version or offered-version slot is permitted.

'''
          if text.count(marker) != 1:
              raise SystemExit('ABI note malformed-input heading anchor mismatch')
          doc.write_text(text.replace(marker, insert + marker, 1))
          PY

          git diff --check
          git rm .github/workflows/version-refinement-fix.yml .github/workflows/version-refinement-fix-v2.yml
          git config user.name "phil-version-lowering-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/Phil/LLVM/IR.hs \
            src/Phil/LLVM/VersionSessionChoice.hs \
            src/Phil/LLVM/VersionSessionChoiceCertification.hs \
            runtime/phase0/version_session_choice_v1.h \
            runtime/phase0/version_session_choice_v1_smoke_fixture.h \
            runtime/phase0/version_session_choice_v1_smoke.c \
            runtime/phase0/version_session_choice_v1_smoke_main.c \
            runtime/phase0/version_session_choice_v1_bad_ambient.c \
            test/VersionSessionChoiceABIMain.hs \
            docs/phase-0/version-session-choice-abi-v1.md
          git commit -m "Make client version refinement explicit"
          git push origin HEAD:lower-version-session-choice
