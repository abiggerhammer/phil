name: Temporary CALL-019 Invocation Context Enforcement

on:
  push:
    branches:
      - phase1-call019-enforce-invocation-context

permissions:
  contents: read

jobs:
  call019-invocation-context:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        shell: bash
        run: |
          set -euo pipefail
          cabal build all --enable-tests

      - name: Exercise CALL-019 caller-context enforcement
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019InvocationContextMain.hs

      - name: Replay CALL-019 invocation semantic account
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019InvocationSemanticAccountMain.hs

      - name: Replay CALL-019 exact invoke semantics
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019InvokeSurfaceMain.hs

      - name: Replay Steve invoke integration
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006SteveApplicationShellMain.hs
