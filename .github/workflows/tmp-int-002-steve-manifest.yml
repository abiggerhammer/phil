name: Temporary INT-002 Steve witness manifest staging

on:
  push:
    branches: [phase1-int-002-steve-manifest]
    paths:
      - 'test/Phase1INT002SteveManifestMain.hs'
      - 'test/Phase1INT002UploadManifestMain.hs'
      - 'test/Phase1INT002ManifestClosureMain.hs'
      - 'src/Phil/Examples/Steve/ProviderQualifications.hs'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - 'src/Phil/Verification.hs'
      - 'src/Phil/Verification/Bundle.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - '.github/workflows/tmp-int-002-steve-manifest.yml'

permissions:
  contents: write

jobs:
  steve-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-int-002-steve-manifest
          fetch-depth: 0
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply canonical OwnedBytes release fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/Phase1INT002SteveManifestMain.hs')
          text = path.read_text()
          old = '''ownedBytesRelease :: ReleaseTransitionContract
          ownedBytesRelease = ReleaseTransitionContract
            { releaseTransitionKey = "provider.owned-bytes.release"
            , releaseTransitionOwnerType = ownedBytesType
            , releaseTransitionRequirements = Set.empty
            , releaseTransitionSemanticAccount = ReleaseSemanticAccount
                { releaseAccountAuthorityRefs = Set.empty
                , releaseAccountEvidenceRefs = Set.empty
                , releaseAccountEffectRefs = Set.empty
                , releaseAccountAssumptionRefs = Set.empty
                }
            }
          '''
          new = '''ownedBytesRelease :: ReleaseTransitionContract
          ownedBytesRelease = ReleaseTransitionContract
            { releaseTransitionKey = "provider.owned-bytes.release"
            , releaseTransitionOwnerType = ownedBytesType
            , releaseTransitionRequirements = Set.empty
            , releaseTransitionSemanticAccount = ReleaseSemanticAccount
                { releaseAccountAuthorityRefs = Set.empty
                , releaseAccountEvidenceRefs = Set.empty
                , releaseAccountEffectRefs = Set.empty
                , releaseAccountAssumptionRefs = Set.empty
                , releaseAccountCostRefs = Set.empty
                , releaseAccountSubjectRef = "owned-bytes"
                }
            , releaseTransitionOutcome = ReleaseContinuesUnit
            , releaseTransitionResidue = ReleaseConsumesOwner
            }
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit('Steve OwnedBytes release fixture does not match expected staged form')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Bind qualified provider evidence to explicit assumptions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/Phase1INT002SteveManifestMain.hs')
          text = path.read_text()

          old_revision = '''providerObligationRevision artifact key disposition = revision
            where
              kind = evidenceKindFor disposition
              role = providerEvidenceRole artifact
          '''
          new_revision = '''providerObligationRevision artifact key disposition = revision
            where
              kind = KernelChecked
              role = providerEvidenceRole artifact
          '''
          if new_revision not in text:
              if old_revision not in text:
                  raise SystemExit('Steve provider obligation adapter does not match expected staged form')
              text = text.replace(old_revision, new_revision, 1)

          old_evidence = '''providerEvidenceEntry validity artifact key disposition revision = entry
            where
              kind = evidenceKindFor disposition
              assumptions
                | kind == Assumed = map AssumptionId
                    (Set.toAscList (providerAssumptionRefs artifact))
                | otherwise = []
              evidenceId = EvidenceEntryId (Text.intercalate ":"
          '''
          new_evidence = '''providerEvidenceEntry validity artifact key disposition revision = entry
            where
              kind = KernelChecked
              assumptions = map AssumptionId
                (Set.toAscList (providerAssumptionRefs artifact))
              evidenceId = EvidenceEntryId (Text.intercalate ":"
          '''
          if new_evidence not in text:
              if old_evidence not in text:
                  raise SystemExit('Steve provider evidence adapter does not match expected staged form')
              text = text.replace(old_evidence, new_evidence, 1)

          old_classifier = '''evidenceKindFor :: SemanticForm -> AssuranceKind
          evidenceKindFor disposition
            | "assumption" `Text.isInfixOf` canonicalSemanticForm disposition = Assumed
            | otherwise = KernelChecked

          '''
          if old_classifier in text:
              text = text.replace(old_classifier, '', 1)

          path.write_text(text)
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck INT-002 Steve manifest boundary
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Verification.hs \
            src/Phil/Verification/Bundle.hs \
            src/Phil/Verification/ManifestClosure.hs \
            test/Phase1INT002SteveManifestMain.hs

      - name: Execute real ordinary-source Steve manifest closure
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT002SteveManifestMain.hs

      - name: Replay ordinary-source Upload manifest closure
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT002UploadManifestMain.hs

      - name: Replay generic INT-002 manifest closure corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT002ManifestClosureMain.hs

      - name: Replay INT-001 ordinary witness source path
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001WitnessE2EMain.hs

      - name: Replay Steve provider qualification corpus
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1SteveProviderQualificationMain.hs
          cabal exec -- runghc -isrc -Wall -Werror app/SteveProviderQualificationWitnessProductionBindingMain.hs

      - name: Replay assurance and ADR-025 regressions
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/AssuranceMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationNoSilentAssumptionExportMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationIndependentTargetMain.hs

      - name: Transport validated Steve manifest repair
        shell: bash
        run: |
          set -euo pipefail
          git add test/Phase1INT002SteveManifestMain.hs
          if git diff --cached --quiet; then
            echo 'Steve manifest adapter already committed; replay head needs no transport'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: bind Steve qualified evidence assumptions explicitly'
          git push origin HEAD:phase1-int-002-steve-manifest
