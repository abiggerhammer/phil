name: INT-007 Assurance Closure Discovery

concurrency:
  group: int007-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

on:
  pull_request:
    paths:
      - 'src/Phil/Handoff/Phase1AssuranceClosure.hs'
      - 'test/Phase1INT007AssuranceClosureMain.hs'
      - 'test/Phil/Test/Phase1/ManifestWitnesses.hs'
      - 'test/Phil/Test/Phase1/CertifiedReleaseWitnesses.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'src/Phil/Verification/CertifiedRelease.hs'
      - 'src/Phil/Assurance/Types.hs'
      - 'handoff/phase1/witnesses/*-assurance-manifest-v1.tsv'
      - 'handoff/phase1/witnesses/*-residual-tcb-v1.tsv'
      - 'examples/upload/*.phil'
      - 'examples/steve/*.phil'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int007-assurance-closure-discovery.yml'

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Cancel superseded runs of this workflow
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const currentRunNumber = Number(process.env.GITHUB_RUN_NUMBER);
            const prNumber = context.payload.pull_request.number;
            const workflowName = context.workflow;
            const headRef = context.payload.pull_request.head.ref;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                event: 'pull_request',
                branch: headRef,
                per_page: 100
              }
            );
            const active = new Set([
              'queued',
              'in_progress',
              'pending',
              'waiting',
              'requested'
            ]);
            const stale = runs.filter(run => {
              const samePullRequest =
                (run.pull_requests || []).some(pr => pr.number === prNumber)
                  || run.head_branch === headRef;
              return run.id !== currentRunId
                && run.name === workflowName
                && run.run_number < currentRunNumber
                && active.has(run.status)
                && samePullRequest;
            });
            for (const run of stale) {
              core.info(
                `Cancelling superseded ${workflowName} run ${run.id} (${run.status})`
              );
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              } catch (error) {
                if (error.status === 409) {
                  core.info(`Run ${run.id} already left a cancellable state`);
                } else {
                  throw error;
                }
              }
            }
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build assurance-closure handoff format strictly
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Typecheck assurance-closure replay strictly
        run: cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007AssuranceClosureMain.hs
      - name: Emit exact assurance closure handoff summaries
        id: discovery
        continue-on-error: true
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007AssuranceClosureMain.hs
      - name: Upload exact assurance closure discovery artifacts
        if: steps.discovery.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: int007-assurance-closure-discovery-${{ github.run_id }}
          path: dist/int007-assurance-closure-discovery/*.tsv
          if-no-files-found: error
          retention-days: 7
      - name: Preserve discovery failure until exact bytes are frozen
        if: steps.discovery.outcome == 'failure'
        run: exit 1
