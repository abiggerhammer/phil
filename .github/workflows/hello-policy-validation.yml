name: Hello Policy Validation

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Verify.hs'
      - 'src/Phil/Systems/Dataflow.hs'
      - 'src/Phil/Systems/VersionChoiceOperands.hs'
      - 'src/Phil/Systems/BeginPolicySessionChoice.hs'
      - 'src/Phil/Systems/HelloPolicyValidation.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/BeginPolicyChoice.hs'
      - 'test/HelloPolicyValidationMain.hs'
      - 'docs/phase-0/hello-policy-validation-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/hello-policy-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Verify.hs'
      - 'src/Phil/Systems/Dataflow.hs'
      - 'src/Phil/Systems/VersionChoiceOperands.hs'
      - 'src/Phil/Systems/BeginPolicySessionChoice.hs'
      - 'src/Phil/Systems/HelloPolicyValidation.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/BeginPolicyChoice.hs'
      - 'test/HelloPolicyValidationMain.hs'
      - 'docs/phase-0/hello-policy-validation-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/hello-policy-validation.yml'

permissions:
  contents: read

jobs:
  hello-policy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build focused semantic tests
        run: cabal build phil-hello-policy-validation-tests
      - name: Verify HelloPolicy semantic normalization
        run: cabal test phil-hello-policy-validation-tests --test-show-details=direct
