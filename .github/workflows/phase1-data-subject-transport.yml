name: Phase 1 Data Subject Transport

on:
  pull_request:
    paths:
      - 'src/Phil/Core/DataSubjectTransport.hs'
      - 'test/Phase1DataSubjectTransportMain.hs'
      - 'docs/phase-1/data-subject-transport-v1.md'
      - '.github/workflows/phase1-data-subject-transport.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/DataSubjectTransport.hs'
      - 'test/Phase1DataSubjectTransportMain.hs'
      - 'docs/phase-1/data-subject-transport-v1.md'
      - '.github/workflows/phase1-data-subject-transport.yml'

permissions:
  contents: read

jobs:
  data-subject-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate with warnings as errors
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Typecheck DATA-012 checker and conformance corpus
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1DataSubjectTransportMain.hs
      - name: Run DATA-012 conformance corpus
        run: cabal exec -- runghc -isrc test/Phase1DataSubjectTransportMain.hs
