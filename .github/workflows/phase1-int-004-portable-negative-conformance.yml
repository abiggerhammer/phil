name: Phase 1 INT-004 Portable Negative Conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable-negative-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck portable INT-004 replay harnesses
        shell: bash
        run: |
          set -euo pipefail
          harnesses=(
            test/Phase1INT004PortableNegativeManifestMain.hs
            test/Phase1INT004PortableGenericNegativeMain.hs
            test/Phase1INT004PortableGenericInstantiationNegativeMain.hs
            test/Phase1INT004PortableCallableLifecycleNegativeMain.hs
            test/Phase1INT004PortableCallableStructuralModeNegativeMain.hs
            test/Phase1INT004PortableCallableScopeNegativeMain.hs
            test/Phase1INT004PortableCallableRefinementNegativeMain.hs
            test/Phase1INT004PortableForeignCallableNegativeMain.hs
            test/Phase1INT004PortableCallableLoweringNegativeMain.hs
          )
          for harness in "${harnesses[@]}"; do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$harness"
          done

      - name: Replay complete portable INT-004 negative corpus
        shell: bash
        run: |
          set -euo pipefail
          harnesses=(
            test/Phase1INT004PortableNegativeManifestMain.hs
            test/Phase1INT004PortableGenericNegativeMain.hs
            test/Phase1INT004PortableGenericInstantiationNegativeMain.hs
            test/Phase1INT004PortableCallableLifecycleNegativeMain.hs
            test/Phase1INT004PortableCallableStructuralModeNegativeMain.hs
            test/Phase1INT004PortableCallableScopeNegativeMain.hs
            test/Phase1INT004PortableCallableRefinementNegativeMain.hs
            test/Phase1INT004PortableForeignCallableNegativeMain.hs
            test/Phase1INT004PortableCallableLoweringNegativeMain.hs
          )
          for harness in "${harnesses[@]}"; do
            cabal exec -- runghc -isrc -Wall -Werror "$harness"
          done
