name: Temporary INT-006 Steve Distributable Package

on:
  workflow_dispatch:
  push:
    branches: [phase1-int-006-steve-distributable-package]

permissions:
  contents: read

jobs:
  steve-distributable-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Replay canonical Steve application shell
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006SteveApplicationShellMain.hs

      - name: Replay Steve provider manifest lineage
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006SteveProviderManifestLineageMain.hs

      - name: Build distributable Steve package
        run: |
          out="$RUNNER_TEMP/phil-int006-steve-distributable"
          mkdir -p "$out"
          scripts/release/build-steve-phase1-package.sh "$out"

          archive="$out/phil-steve-0.1.0-phase1-x86_64-linux.tar.gz"
          test -s "$archive"
          test -s "$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -tzf "$archive" | grep -q '/bin/steve$'
          tar -tzf "$archive" | grep -q '/bin/philc$'
          tar -tzf "$archive" | grep -q '/share/phil-steve/steve.release-package$'
          tar -tzf "$archive" | grep -q '/TCB.txt$'
          tar -tzf "$archive" | grep -q '/README.md$'

      - name: Smoke only the unpacked package
        run: |
          out="$RUNNER_TEMP/phil-int006-steve-distributable"
          archive="$out/phil-steve-0.1.0-phase1-x86_64-linux.tar.gz"
          clean="$RUNNER_TEMP/phil-int006-steve-package-consumer"
          rm -rf "$clean"
          mkdir -p "$clean"
          tar -xzf "$archive" -C "$clean"

          package="$clean/phil-steve-0.1.0-phase1-x86_64-linux"
          test -x "$package/bin/steve"
          test -x "$package/bin/philc"
          test -s "$package/share/phil-steve/steve.release-package"
          grep -q 'name=Phil Haskell compiler/checker' "$package/TCB.txt"
          grep -q 'basis=first implementation remains trusted until Phase 2' "$package/TCB.txt"
          test "$(grep -c '^tcb[[:space:]]' "$package/TCB.txt")" -eq 6

          # Prove the shipped ordinary tool starts without any repo path.
          if "$package/bin/philc" >"$clean/philc.stdout" 2>"$clean/philc.stderr"; then
            echo 'philc unexpectedly accepted an empty invocation' >&2
            exit 1
          fi
          grep -q 'usage: philc emit-llvm FILE' "$clean/philc.stderr"

          user_root="$clean/user-files"
          store_root="$clean/store"
          mkdir -p "$user_root" "$store_root"
          printf 'Steve package-only artifact\n' > "$user_root/input.bin"

          content_id="$(printf 'input.bin\n' | \
            "$package/bin/steve" put "$store_root" "$user_root")"
          test "${#content_id}" -eq 64
          printf '%s' "$content_id" | grep -Eq '^[0-9a-f]{64}$'
          test -f "$store_root/$content_id"
          cmp "$user_root/input.bin" "$store_root/$content_id"

          printf '%s\noutput.bin\n' "$content_id" | \
            "$package/bin/steve" get "$store_root" "$user_root"
          cmp "$user_root/input.bin" "$user_root/output.bin"

          printf 'must survive corrupt package GET\n' > "$user_root/guard.bin"
          printf 'tampered bytes\n' > "$store_root/$content_id"
          printf '%s\nguard.bin\n' "$content_id" | \
            "$package/bin/steve" get "$store_root" "$user_root"
          grep -qx 'must survive corrupt package GET' "$user_root/guard.bin"

      - name: Verify packaged release and TCB records
        run: |
          package="$RUNNER_TEMP/phil-int006-steve-package-consumer/phil-steve-0.1.0-phase1-x86_64-linux"
          release="$package/share/phil-steve/steve.release-package"

          test -s "$release"
          grep -q '^package[[:space:]]id=' "$release"
          grep -q '^manifest[[:space:]]' "$release"
          grep -q '^llvm[[:space:]]' "$release"
          test "$(grep -c '^tcb[[:space:]]' "$release")" -eq 6
          grep -q 'name=Phil Haskell compiler/checker' "$release"
          grep -q 'basis=first implementation remains trusted until Phase 2' "$release"
          diff \
            <(grep '^tcb[[:space:]]' "$release") \
            <(grep '^tcb[[:space:]]' "$package/TCB.txt")

      - name: Replay real Steve manifest closure
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT005RealWitnessManifestMain.hs

      - name: Upload staged distributable
        uses: actions/upload-artifact@v4
        with:
          name: phil-steve-0.1.0-phase1-x86_64-linux
          path: |
            ${{ runner.temp }}/phil-int006-steve-distributable/phil-steve-0.1.0-phase1-x86_64-linux.tar.gz
            ${{ runner.temp }}/phil-int006-steve-distributable/phil-steve-0.1.0-phase1-x86_64-linux.tar.gz.sha256
          if-no-files-found: error
