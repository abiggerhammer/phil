name: Phase 1 Surface Determinacy Witness Soundness Debug 17

on:
  pull_request:

permissions:
  contents: read

jobs:
  rocq-witness-soundness-debug17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write

      - name: Apply factored nullable and per-token FIRST diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          history = Path('.github/debug-workflow-history')
          workflows = Path('.github/workflows')
          for archived in history.glob('phase1-surface-determinacy-witness-soundness-debug*.yml'):
              (workflows / archived.name).write_text(archived.read_text())

          workflow = Path('.github/workflows/phase1-surface-determinacy-witness-soundness-debug16.yml').read_text()
          marker = workflow.index('- name: Apply semantic nullable witness diagnostic')
          start = workflow.index('          from pathlib import Path', marker)
          end = workflow.index('\n          PY', start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<existing-debug16-diagnostics>', 'exec'), {})

          path = Path('proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v')
          source = path.read_text()
          old_start = source.index('Lemma nullable_witness_nonterminal_sem_case')
          old_end = source.index('\nTheorem nullable_witness_implies_computed_sem', old_start)
          replacement = r'''Lemma computed_nullable_sem_sound_at_expression_fuel :
            forall body,
              ComputedNullableSem body ->
              nullable_depth_safe_fuel expression_fuel body = true ->
              nullable_expression_fuel
                expression_fuel phase1_surface_nullable_facts body = Some true.
          Proof.
            intros body Hsem Hsafe.
            exact
              (computed_nullable_sem_sound
                expression_fuel body Hsem Hsafe).
          Qed.

          Lemma nullable_expression_true_from_expression_fuel :
            forall body,
              nullable_expression_fuel
                expression_fuel phase1_surface_nullable_facts body = Some true ->
              nullable_expression phase1_surface_nullable_facts body = true.
          Proof.
            intros body Heval.
            unfold nullable_expression.
            rewrite Heval.
            reflexivity.
          Qed.

          Lemma phase1_surface_nullable_lookup_true :
            forall name body,
              lookupRule name phase1_surface_rules = Some body ->
              nullable_expression phase1_surface_nullable_facts body = true ->
              lookup_bool name phase1_surface_nullable_facts = true.
          Proof.
            intros name body Hlookup Hbody.
            rewrite
              (phase1_surface_nullable_lookup_rule name body Hlookup).
            exact Hbody.
          Qed.

          Lemma nullable_witness_nonterminal_sem_case :
            forall name body,
              lookupRule name phase1_surface_rules = Some body ->
              ComputedNullableSem body ->
              ComputedNullableSem (ENonterminal name).
          Proof.
            intros name body Hlookup Hbody_sem.
            assert (Hbody_safe :
              nullable_depth_safe_fuel expression_fuel body = true).
            {
              apply phase1_surface_rule_body_nullable_depth_safe with name.
              exact Hlookup.
            }
            assert (Hlookup_true :
              lookup_bool name phase1_surface_nullable_facts = true).
            {
              apply phase1_surface_nullable_lookup_true with body.
              - exact Hlookup.
              - apply nullable_expression_true_from_expression_fuel.
                apply computed_nullable_sem_sound_at_expression_fuel.
                + exact Hbody_sem.
                + exact Hbody_safe.
            }
            exact (computed_nullable_nonterminal_sem name Hlookup_true).
          Qed.
          '''
          source = source[:old_start] + replacement + source[old_end:]

          first_start = source.index('Theorem phase1_surface_first_witness_fuel_sound :')
          first_end = source.index('\nCorollary phase1_surface_first_witness_matches_computed_facts', first_start)
          first = source[first_start:first_end]

          old_statement = '''Theorem phase1_surface_first_witness_fuel_sound :
            (forall token expression,
              FirstWitness phase1_surface_rules token expression ->
              FirstWitnessFuelProperty token expression) /\\
            (forall token items,
              FirstSequenceWitness phase1_surface_rules token items ->
              FirstSequenceFuelProperty token items) /\\
            (forall token items,
              FirstAlternativeWitness phase1_surface_rules token items ->
              FirstAlternativeFuelProperty token items).
          Proof.
            apply FirstWitness_mutind.
          '''
          new_statement = '''Theorem phase1_surface_first_witness_fuel_sound_for_token :
            forall token,
            (forall expression,
              FirstWitness phase1_surface_rules token expression ->
              FirstWitnessFuelProperty token expression) /\\
            (forall items,
              FirstSequenceWitness phase1_surface_rules token items ->
              FirstSequenceFuelProperty token items) /\\
            (forall items,
              FirstAlternativeWitness phase1_surface_rules token items ->
              FirstAlternativeFuelProperty token items).
          Proof.
            intros token.
            apply FirstWitness_mutind.
          '''
          if first.count(old_statement) != 1:
              raise SystemExit(f'expected FIRST theorem statement once, found {first.count(old_statement)}')
          first = first.replace(old_statement, new_statement, 1)

          intros_rewrites = {
              '- intros token literal Htoken.': '- intros literal Htoken.',
              '- intros token class_name Htoken.': '- intros class_name Htoken.',
              '- intros token name body Hlookup Hbody IHbody.': '- intros name body Hlookup Hbody IHbody.',
              '- intros token items Hitems IHitems.': '- intros items Hitems IHitems.',
              '- intros token body Hbody IHbody.': '- intros body Hbody IHbody.',
              '- intros token item rest Hitem IHitem.': '- intros item rest Hitem IHitem.',
              '- intros token item rest Hnullable Hrest IHrest.': '- intros item rest Hnullable Hrest IHrest.',
              '- intros token item rest Hrest IHrest.': '- intros item rest Hrest IHrest.',
          }
          for old, new in intros_rewrites.items():
              count = first.count(old)
              if count == 0:
                  raise SystemExit(f'missing FIRST branch binder: {old}')
              first = first.replace(old, new)

          redundant = '* rewrite String.eqb_refl. reflexivity.'
          if first.count(redundant) != 2:
              raise SystemExit(f'expected two redundant token rewrites, found {first.count(redundant)}')
          first = first.replace(redundant, '* reflexivity.')

          wrapper = r'''

          Theorem phase1_surface_first_witness_fuel_sound :
            (forall token expression,
              FirstWitness phase1_surface_rules token expression ->
              FirstWitnessFuelProperty token expression) /\
            (forall token items,
              FirstSequenceWitness phase1_surface_rules token items ->
              FirstSequenceFuelProperty token items) /\
            (forall token items,
              FirstAlternativeWitness phase1_surface_rules token items ->
              FirstAlternativeFuelProperty token items).
          Proof.
            split.
            - intros token.
              exact
                (proj1
                  (phase1_surface_first_witness_fuel_sound_for_token token)).
            - split.
              + intros token.
                exact
                  (proj1 (proj2
                    (phase1_surface_first_witness_fuel_sound_for_token token))).
              + intros token.
                exact
                  (proj2 (proj2
                    (phase1_surface_first_witness_fuel_sound_for_token token))).
          Qed.
          '''
          source = source[:first_start] + first + wrapper + source[first_end:]
          path.write_text(source)
          print(f'generated witness proof characters: {len(source)}')
          PY

      - name: Compile witness soundness with forced timeout
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationLookahead.v
          timeout -k 5s 90s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
