name: Phase 1 Architecture Realization Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'proof/Phil/Core/ArchitectureRealization.v'
      - 'proof/Phil/Core/ArchitectureRealizationImplementation.v'
      - 'proof/Phil/Core/ArchitectureRealizationImplementationExtraction.v'
      - 'generated/ArchitectureRealizationKernel.hs'
      - 'src/ArchitectureRealizationKernel.hs'
      - 'src/ProviderReplacementQualificationKernel.hs'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Core/ProviderReplacementQualification.hs'
      - 'phil-core.cabal'
      - 'app/ArchitectureRealizationPlanCorrespondenceMain.hs'
      - 'test/Phase1ArchitectureProviderReplacementMain.hs'
      - 'docs/phase-1/architecture-realization-production-binding-v1.md'
      - '.github/workflows/phase1-architecture-realization-implementation-refinement.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'proof/Phil/Core/ArchitectureRealization.v'
      - 'proof/Phil/Core/ArchitectureRealizationImplementation.v'
      - 'proof/Phil/Core/ArchitectureRealizationImplementationExtraction.v'
      - 'generated/ArchitectureRealizationKernel.hs'
      - 'src/ArchitectureRealizationKernel.hs'
      - 'src/ProviderReplacementQualificationKernel.hs'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Core/ProviderReplacementQualification.hs'
      - 'phil-core.cabal'
      - 'app/ArchitectureRealizationPlanCorrespondenceMain.hs'
      - 'test/Phase1ArchitectureProviderReplacementMain.hs'
      - 'docs/phase-1/architecture-realization-production-binding-v1.md'
      - '.github/workflows/phase1-architecture-realization-implementation-refinement.yml'

permissions:
  contents: read

jobs:
  rocq-architecture-realization-production-binding:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Certified realization chain and construction correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureInstantiation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderReplacementQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureRealization.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureRealizationImplementation.v

      - name: Fresh-extract exact realization kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f ArchitectureRealizationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureRealizationImplementationExtraction.v
          test -s ArchitectureRealizationKernel.hs
          cmp ArchitectureRealizationKernel.hs generated/ArchitectureRealizationKernel.hs
          test "$(sha256sum ArchitectureRealizationKernel.hs | cut -d' ' -f1)" = \
            d619e0155565e2337a49d47c10e54653a3d171f79e9ef7773163065f75dee6ae
          mkdir -p architecture-realization-production-proof
          cp \
            proof/Phil/Core/ArchitectureRealization.v \
            proof/Phil/Core/ArchitectureRealizationImplementation.v \
            proof/Phil/Core/ArchitectureRealizationImplementation.vo \
            ArchitectureRealizationKernel.hs \
            architecture-realization-production-proof/

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-architecture-realization-production-binding
          path: architecture-realization-production-proof
          if-no-files-found: error

  verify-architecture-realization-production-binding:
    needs: rocq-architecture-realization-production-binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rocq-architecture-realization-production-binding
          path: fresh-architecture-realization

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Verify raw kernel and production mirror
        run: |
          set -euo pipefail
          cmp \
            fresh-architecture-realization/ArchitectureRealizationKernel.hs \
            generated/ArchitectureRealizationKernel.hs
          test "$(sha256sum generated/ArchitectureRealizationKernel.hs | cut -d' ' -f1)" = \
            d619e0155565e2337a49d47c10e54653a3d171f79e9ef7773163065f75dee6ae
          {
            printf '%s\n' '{-# OPTIONS_GHC -Wno-unused-imports #-}'
            cat generated/ArchitectureRealizationKernel.hs
          } > expected-architecture-realization-production.hs
          cmp expected-architecture-realization-production.hs src/ArchitectureRealizationKernel.hs
          ghc -Wall -Werror -Wno-unused-imports -fno-code \
            generated/ArchitectureRealizationKernel.hs
          ghc -Wall -Werror -fno-code src/ArchitectureRealizationKernel.hs

      - name: Strict-build composed production binding
        run: |
          set -euo pipefail
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Static.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Core/ProviderReplacementQualification.hs

      - name: Execute unchanged realization-plan controls
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror \
            app/ArchitectureRealizationPlanCorrespondenceMain.hs \
            -o architecture-realization-plan-controls
          ./architecture-realization-plan-controls

      - name: Re-run unchanged ARCH-010 provider replacement corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1ArchitectureProviderReplacementMain.hs
          cabal exec -- runghc -isrc test/Phase1ArchitectureProviderReplacementMain.hs

      - name: Record production binding identities
        run: |
          set -euo pipefail
          mkdir -p architecture-realization-production-binding
          sha256sum \
            generated/ArchitectureRealizationKernel.hs \
            src/ArchitectureRealizationKernel.hs \
            src/ProviderReplacementQualificationKernel.hs \
            src/Phil/Core/Static.hs \
            src/Phil/Core/ProviderReplacementQualification.hs \
            phil-core.cabal \
            app/ArchitectureRealizationPlanCorrespondenceMain.hs \
            test/Phase1ArchitectureProviderReplacementMain.hs \
            docs/phase-1/architecture-realization-production-binding-v1.md \
            > architecture-realization-production-binding/PHIL-ARCH-REALIZE-001.production.sha256
          cp \
            generated/ArchitectureRealizationKernel.hs \
            architecture-realization-production-binding/ArchitectureRealizationKernel.raw.hs
          cp \
            src/ArchitectureRealizationKernel.hs \
            architecture-realization-production-binding/ArchitectureRealizationKernel.production.hs
          cp \
            src/ProviderReplacementQualificationKernel.hs \
            src/Phil/Core/Static.hs \
            src/Phil/Core/ProviderReplacementQualification.hs \
            phil-core.cabal \
            app/ArchitectureRealizationPlanCorrespondenceMain.hs \
            test/Phase1ArchitectureProviderReplacementMain.hs \
            docs/phase-1/architecture-realization-production-binding-v1.md \
            architecture-realization-production-binding/

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-realization-production-binding
          path: architecture-realization-production-binding
          if-no-files-found: error
