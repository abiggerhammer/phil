name: SURF callable effects cleanup

on:
  push:
    branches:
      - phase1-surf-002-callable-effects-parser
    paths:
      - '.github/workflows/surf-callable-effects-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update affected warning-clean harnesses
        run: |
          python3 - <<'PY'
          from pathlib import Path

          structural = Path('test/Phase1GrammarV1StructuralParserMain.hs')
          text = structural.read_text()
          old = '  GrammarV1ArchitectureRequirement _ _ -> "architecture"\n  GrammarV1AuthorityRequirement _ -> "authority"\n'
          new = '  GrammarV1ArchitectureRequirement _ _ -> "architecture"\n  GrammarV1EffectsRequirement _ _ -> "effects"\n  GrammarV1AuthorityRequirement _ -> "authority"\n'
          if text.count(old) != 1:
              raise SystemExit('structural requirementTag match count mismatch')
          structural.write_text(text.replace(old, new, 1))

          callable = Path('test/Phase1GrammarV1CallableContractMain.hs')
          text = callable.read_text()
          old_item = '    , test "SURF-002 unsupported valid callable clause fails closed"\n        unsupportedCallableClauseFailsClosed\n'
          if text.count(old_item) != 1:
              raise SystemExit('obsolete callable test list match count mismatch')
          text = text.replace(old_item, '', 1)
          old_helper = '''unsupportedCallableClauseFailsClosed :: Either String ()
          unsupportedCallableClauseFailsClosed =
            case parseGrammarV1StructuralSource "unsupported-callable-clause" source of
              Left _ -> Right ()
              Right value -> Left ("expected unsupported callable clause to fail closed, got " <> show value)
            where
              source = "callable C(x : U32) -> U32 { consumes { x }; }"

          '''
          old_helper = old_helper.replace('          ', '')
          if text.count(old_helper) != 1:
              raise SystemExit('obsolete callable helper match count mismatch')
          callable.write_text(text.replace(old_helper, '', 1))
          PY

      - name: Commit cleanup and remove bootstrap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/surf-callable-effects-cleanup.yml
          git add test/Phase1GrammarV1StructuralParserMain.hs test/Phase1GrammarV1CallableContractMain.hs
          git commit -m "Keep callable effects harnesses warning-clean"
          git push origin HEAD:${GITHUB_REF_NAME}
