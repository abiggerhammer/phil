name: Temporary Phase 1 AArch64 Apple Darwin Target

on:
  push:
    branches:
      - phase1-target-aarch64-apple-darwin-profile
  workflow_dispatch:

jobs:
  target-profile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          uname -a
          sw_vers

      - name: Resolve LLVM 18
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list llvm@18 >/dev/null 2>&1; then
            brew install llvm@18
          fi
          llvm_prefix="$(brew --prefix llvm@18)"
          echo "LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          "$llvm_prefix/bin/clang" --version
          "$llvm_prefix/bin/llvm-as" --version

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        shell: bash
        run: |
          set -euo pipefail
          cabal build all --enable-tests

      - name: Check Darwin target profile
        shell: bash
        run: |
          set -euo pipefail
          cabal -v0 exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1TargetAArch64AppleDarwinMain.hs

      - name: Lower canonical Steve for Darwin
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phil-aarch64-apple-darwin"
          mkdir -p "$out"
          cabal -v0 exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1TargetAArch64AppleDarwinMain.hs emit > "$out/steve.ll"

          grep -Fx 'target datalayout = "e-m:o-i64:64-i128:128-n32:64-S128"' "$out/steve.ll"
          grep -Fx 'target triple = "aarch64-apple-darwin"' "$out/steve.ll"
          grep -q '@phil_runtime_choice_StevePut_put_entry_DigestProvider_compute' "$out/steve.ll"
          grep -q '@phil_runtime_choice_SteveGet_get_check_DigestProvider_check' "$out/steve.ll"

          "$LLVM_PREFIX/bin/llvm-as" \
            "$out/steve.ll" \
            -o "$out/steve.bc"
          "$LLVM_PREFIX/bin/clang" \
            --target=aarch64-apple-darwin \
            -c "$out/steve.ll" \
            -o "$out/steve.o"
          file "$out/steve.o" | tee "$out/object-file.txt"
          grep -q 'Mach-O 64-bit object arm64' "$out/object-file.txt"

          "$LLVM_PREFIX/bin/clang" --version > "$out/clang-version.txt"
          printf '%s\n' 'e-m:o-i64:64-i128:128-n32:64-S128' > "$out/data-layout.txt"
          printf '%s\n' 'aarch64-apple-darwin' > "$out/phil-target-triple.txt"
          sw_vers > "$out/macos-version.txt"
          uname -a > "$out/uname.txt"

      - name: Upload Darwin target evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-aarch64-apple-darwin-target
          path: ${{ runner.temp }}/phil-aarch64-apple-darwin
