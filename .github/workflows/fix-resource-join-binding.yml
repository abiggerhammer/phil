name: Fix Resource Join Binding Scope

on:
  push:
    branches: [bind-resource-join-decisions]
    paths:
      - '.github/workflows/fix-resource-join-binding.yml'

permissions:
  contents: write

# One-shot guarded branch repair.
jobs:
  fix-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bind-resource-join-decisions
      - name: Move helper into checkStateProjection scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Phil/Systems/ControlStateProjection.hs')
          text = path.read_text()
          start = text.index('\n\ncheckResourceJoinKernel =\n') + 2
          end = text.index('checkClosureCaptureProjection\n', start)
          block = text[start:end]
          lines = block.rstrip('\n').splitlines()
          indented = '\n'.join(('    ' + line) if line else '' for line in lines) + '\n\n'
          text = text[:start] + indented + text[end:]
          path.write_text(text)
          PY
          rm .github/workflows/fix-resource-join-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Systems/ControlStateProjection.hs .github/workflows/fix-resource-join-binding.yml
          git commit -m 'Scope Resource Join binding helper correctly'
          git push origin HEAD:bind-resource-join-decisions
