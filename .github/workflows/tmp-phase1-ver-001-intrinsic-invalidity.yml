name: Temporary VER-001 intrinsic invalidity staging

on:
  push:
    branches: [phase1-ver-001-intrinsic-invalidity]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-ver-001-intrinsic-invalidity
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Register VER-001 application-verification module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('phil-core.cabal')
          text = path.read_text()
          old = "      Phil.Compiler\n  other-modules:\n"
          new = "      Phil.Compiler\n      Phil.Verification\n  other-modules:\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one phil-core exposed-module anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Run VER-001 intrinsic-invalidity regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationIntrinsicInvalidityMain.hs

      - name: Run existing surface conformance controls
        run: cabal test phil-surface-conformance-tests

      - name: Commit staged module registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phil-core.cabal
          git commit -m 'ver: register application verification boundary'
          git push origin HEAD:phase1-ver-001-intrinsic-invalidity
