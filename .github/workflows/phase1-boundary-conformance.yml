name: Phase 1 Boundary Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: BND-001 complete recognition success conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CompleteRecognitionMain.hs
      - name: BND-002 trailing bytes inside frame rejection conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1TrailingBytesMain.hs
      - name: BND-003 malformed input creates no success artifacts
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1MalformedRecognitionMain.hs
      - name: BND-004 exact boundary mapping conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1BoundaryMappingMain.hs
