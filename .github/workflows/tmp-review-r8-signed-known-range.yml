name: Temporary R8 signed known-range remediation

on:
  push:
    branches: [phase1-review-r8-signed-known-range]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-review-r8-signed-known-range
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply R8 range-boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          edit(
              'src/Phil/Core/SIntArithmetic.hs',
              '  | SIntArithmeticEmptySymbolicIdentity SIntTerm\n  | SIntArithmeticKnownResultOutOfRange\n',
              '  | SIntArithmeticEmptySymbolicIdentity SIntTerm\n  | SIntArithmeticKnownTermOutOfRange SIntLiteral\n  | SIntArithmeticKnownResultOutOfRange\n')
          edit(
              'src/Phil/Core/SIntArithmetic.hs',
              '''  case term of\n    SIntSymbolic _ identity\n      | Text.null (Text.strip identity) -> Left (SIntArithmeticEmptySymbolicIdentity term)\n    _ -> Right ()\n''',
              '''  case term of\n    SIntKnown literal\n      | not (sIntLiteralInRange literal) ->\n          Left (SIntArithmeticKnownTermOutOfRange literal)\n    SIntSymbolic _ identity\n      | Text.null (Text.strip identity) -> Left (SIntArithmeticEmptySymbolicIdentity term)\n    _ -> Right ()\n''')

          edit(
              'src/Phil/Core/IntegerDivision.hs',
              '  | SIntDivisionEmptySymbolicIdentity SIntTerm\n  | SIntDivisionKnownZeroDivisor Int Integer\n',
              '  | SIntDivisionEmptySymbolicIdentity SIntTerm\n  | SIntDivisionKnownTermOutOfRange SIntLiteral\n  | SIntDivisionKnownZeroDivisor Int Integer\n')
          edit(
              'src/Phil/Core/IntegerDivision.hs',
              '''  case term of\n    SIntSymbolic _ identity\n      | Text.null (Text.strip identity) -> Left (SIntDivisionEmptySymbolicIdentity term)\n    _ -> Right ()\n''',
              '''  case term of\n    SIntKnown literal\n      | not (sIntLiteralInRange literal) ->\n          Left (SIntDivisionKnownTermOutOfRange literal)\n    SIntSymbolic _ identity\n      | Text.null (Text.strip identity) -> Left (SIntDivisionEmptySymbolicIdentity term)\n    _ -> Right ()\n''')

          edit(
              'test/Phase1ReviewR8SignedKnownRangeMain.hs',
              'module Main (main) where\n\nimport Phil.Core.Checker',
              'module Main (main) where\n\nimport Data.Text (Text)\nimport qualified Data.Text as Text\nimport Phil.Core.Checker')
          p = Path('test/Phase1ReviewR8SignedKnownRangeMain.hs')
          text = p.read_text().replace('Data.Text.Text', 'Text').replace('Data.Text.pack', 'Text.pack')
          p.write_text(text)
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Run R8 regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ReviewR8SignedKnownRangeMain.hs

      - name: Run affected signed numeric controls
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExecutionSIntArithmeticMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1IntegerDivisionCoreMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1NumericConversionMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1IntegerShiftMain.hs

      - name: Commit R8 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/Phil/Core/SIntArithmetic.hs \
            src/Phil/Core/IntegerDivision.hs \
            test/Phase1ReviewR8SignedKnownRangeMain.hs
          git commit -m 'review: validate raw known signed terms'
          git push origin HEAD:phase1-review-r8-signed-known-range
