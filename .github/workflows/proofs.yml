name: Proofs

on:
  pull_request:
    paths:
      - 'proof/**'
      - '_CoqProject'
      - '.github/workflows/proofs.yml'
  push:
    branches:
      - main
    paths:
      - 'proof/**'
      - '_CoqProject'
      - '.github/workflows/proofs.yml'

permissions:
  contents: read

jobs:
  rocq:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check session proofs
        run: |
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Session.v
