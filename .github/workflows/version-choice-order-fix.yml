name: Version Choice Order Fix

on:
  pull_request:
    paths:
      - '.github/workflows/version-choice-order-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lower-version-session-choice
          fetch-depth: 0
      - name: Order Hello materialization after ingress commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Phil/Systems/VersionChoiceOperands.hs')
          text = p.read_text()

          old = '''  case systemsBlockOps helloBlock of
    OpRuntimeCall materializeName [] [helloRecord] Nothing materializeDecision
      : OpRuntimeCall projectionName [projectionInput] [helloVersions] Nothing projectionDecision
      : _
'''
          new = '''  case systemsBlockOps helloBlock of
    OpCommitIngress {} :
      OpRuntimeCall materializeName [] [helloRecord] Nothing materializeDecision
      : OpRuntimeCall projectionName [projectionInput] [helloVersions] Nothing projectionDecision
      : _
'''
          if text.count(old) != 1:
              raise SystemExit('expected exact verifier ordering anchor once')
          text = text.replace(old, new, 1)

          old = '''      helloBlock' = helloBlock { systemsBlockOps = prefix <> systemsBlockOps helloBlock }
      choiceBlock' = choiceBlock
'''
          new = '''      helloBlock' = helloBlock { systemsBlockOps = insertAfterCommit prefix (systemsBlockOps helloBlock) }
      choiceBlock' = choiceBlock
'''
          if text.count(old) != 1:
              raise SystemExit('expected exact materialization insertion anchor once')
          text = text.replace(old, new, 1)

          old = '''requireAbsent :: SystemsFunction -> ValueId -> Either VersionChoiceOperandsError ()
'''
          new = '''insertAfterCommit :: [SystemsOp] -> [SystemsOp] -> [SystemsOp]
insertAfterCommit inserted operations = case operations of
  commit@OpCommitIngress {} : rest -> commit : inserted <> rest
  _ -> operations

requireAbsent :: SystemsFunction -> ValueId -> Either VersionChoiceOperandsError ()
'''
          if text.count(old) != 1:
              raise SystemExit('expected helper insertion anchor once')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
          git diff --check
          git rm .github/workflows/version-choice-order-fix.yml
          git config user.name "phil-version-lowering-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Phil/Systems/VersionChoiceOperands.hs
          git commit -m "Order Hello projection after ingress commit"
          git push origin HEAD:lower-version-session-choice
