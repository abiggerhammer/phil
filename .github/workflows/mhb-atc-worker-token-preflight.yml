name: MHB ATC Worker Token Preflight (Manual, No Repository Writes)

# W1: trusted-main credential check only. No worker token is ever supplied
# to a hamster. The staging broker (not this preflight) will own all writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mhb-atc-worker-token-preflight
  cancel-in-progress: false

jobs:
  worker-token-readonly-check:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'abiggerhammer'
    runs-on: ubuntu-24.04
    environment: atc-worker-broker
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify broker-only policy and inactive ATC switches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKER_APP_ID: ${{ vars.MHB_ATC_WORKER_APP_ID }}
          WORKER_APP_SLUG: ${{ vars.MHB_ATC_WORKER_APP_SLUG }}
          WORKER_APP_CLIENT_ID: ${{ vars.MHB_ATC_WORKER_APP_CLIENT_ID }}
          AUTO_ADMIT_ENABLED: ${{ vars.MHB_ATC_AUTO_ADMIT_ENABLED }}
          IMMUTABLE_ENABLED: ${{ vars.MHB_ATC_IMMUTABLE_HEADS_ENABLED }}
          STAGE_BRIDGE_ENABLED: ${{ vars.MHB_ATC_PHASE2_STAGE_BRIDGE_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          # Match GitHub Actions' case-insensitive string equality semantics.
          for enabled in "$AUTO_ADMIT_ENABLED" "$IMMUTABLE_ENABLED" "$STAGE_BRIDGE_ENABLED"; do
            test "${enabled,,}" != "true" || {
              echo "Refusing W1 preflight while any ATC activation switch is ON" >&2
              exit 1
            }
          done

          [[ "$WORKER_APP_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid or missing worker App ID" >&2; exit 1;
          }
          [[ "$WORKER_APP_SLUG" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]*$ ]] || {
            echo "Invalid or missing worker App slug" >&2; exit 1;
          }
          test -n "$WORKER_APP_CLIENT_ID" || {
            echo "Worker App client ID variable is missing" >&2; exit 1;
          }

          # Compare the three public identifiers to source-reviewed, trusted
          # main policy. The policy states intended permissions, not a claim
          # that GitHub has independently verified the live App settings.
          jq -e --arg repo "$GH_REPO" --arg slug "$WORKER_APP_SLUG" \
            --argjson app_id "$WORKER_APP_ID" '
              .schema == "MHB-ATC-WORKER-POLICY-V1" and
              .repository == $repo and
              .worker_app_id == $app_id and
              .worker_app_slug == $slug and
              .environment == "atc-worker-broker" and
              .intended_permissions.contents == "write" and
              .intended_permissions.metadata == "read" and
              .intended_permissions.pull_requests == "none" and
              .credential_holder == "trusted-main-broker-only" and
              .direct_worker_installation_tokens == false and
              .broker_activation == "disabled"
            ' .github/atc-worker-policy.json > /dev/null || {
            echo "Configured worker App differs from trusted-main policy" >&2
            exit 1
          }

          # Public bot-user metadata under ordinary GITHUB_TOKEN only;
          # don't access the private /apps/{slug} endpoint.
          encoded_bot="$(BOT="${WORKER_APP_SLUG}[bot]" python3 -c \
            'import os, urllib.parse; print(urllib.parse.quote(os.environ["BOT"], safe=""))')"
          gh api "users/$encoded_bot" > /tmp/atc-worker-bot.json
          jq -e --arg login "${WORKER_APP_SLUG}[bot]" '
            (.login == $login) and (.type == "Bot") and
            (.id | type == "number") and (.id > 0)
          ' /tmp/atc-worker-bot.json > /dev/null || {
            echo "Worker App bot login/type/ID did not match GitHub identity" >&2
            exit 1
          }

      - name: Authenticate worker App numeric ID and full installed grants (JWT GET only)
        env:
          APP_PRIVATE_KEY: ${{ secrets.MHB_ATC_WORKER_APP_PRIVATE_KEY }}
          APP_CLIENT_ID: ${{ vars.MHB_ATC_WORKER_APP_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$APP_PRIVATE_KEY" && test -n "$APP_CLIENT_ID"
          key="$RUNNER_TEMP/atc-w1id-key.pem"
          app="$RUNNER_TEMP/atc-w1id-app.json"
          installed="$RUNNER_TEMP/atc-w1id-installations.json"
          receipt="$RUNNER_TEMP/atc-w1id-receipt.json"
          cleanup() {
            rm -f "$key" "$app" "$installed"
            unset APP_JWT APP_PRIVATE_KEY
          }
          trap cleanup EXIT

          # Private key and JWT never enter arguments, URLs, artifact uploads,
          # action outputs, step summaries or logs. Only trusted main runs.
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key"
          unset APP_PRIVATE_KEY
          now="$(date -u +%s)"
          iat="$((now - 60))"
          exp="$((now + 300))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' |
            openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          payload="$(jq -nc --argjson iat "$iat" --argjson exp "$exp" \
            --arg iss "$APP_CLIENT_ID" '{iat:$iat,exp:$exp,iss:$iss}' |
            openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          signature="$(printf '%s' "$header.$payload" |
            openssl dgst -sha256 -sign "$key" -binary |
            openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          APP_JWT="$header.$payload.$signature"
          unset signature

          # JWT-authenticated GET /app binds actual numeric App ID and grants
          # to the protected key, not merely a configured numeric variable.
          curl --fail --silent --show-error --proto '=https' \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $APP_JWT" \
            "https://api.github.com/app" > "$app"
          curl --fail --silent --show-error --proto '=https' \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $APP_JWT" \
            "https://api.github.com/app/installations?per_page=100&page=1" > "$installed"
          unset APP_JWT
          python3 scripts/mhb_atc_worker_app_identity.py \
            --app-json "$app" --installations-json "$installed" \
            --worker-policy .github/atc-worker-policy.json \
            --configured-client-id "$APP_CLIENT_ID" > "$receipt"
          test "$(jq -r '.decision' "$receipt")" = \
            "authenticated-worker-app-and-installation"
          {
            echo "### MHB-ATC W1-ID authenticated JWT metadata"
            echo "- trusted source: main, manual owner only"
            echo "- App ID/slug and minimal grants: checked against JWT GET /app"
            echo "- installed App ID/slug and selected policy: checked against JWT installations"
            echo "- installation-to-token identity: checked at the next step"
            echo "- key and JWT: not printed or delegated"
            echo "- repository writes: NONE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint repository-scoped worker App token for read-only verification
        id: worker_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          # No owner/repositories inputs: the action scopes this token to Phil.
          client-id: ${{ vars.MHB_ATC_WORKER_APP_CLIENT_ID }}
          private-key: ${{ secrets.MHB_ATC_WORKER_APP_PRIVATE_KEY }}
          permission-contents: write
          # Deliberately NO permission-pull-requests, issues, actions or admin.

      - name: Verify authenticated worker identity and Phil-only token scope
        env:
          GH_TOKEN: ${{ steps.worker_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ACTION_APP_SLUG: ${{ steps.worker_token.outputs.app-slug }}
          EXPECTED_APP_SLUG: ${{ vars.MHB_ATC_WORKER_APP_SLUG }}
          INSTALLATION_ID: ${{ steps.worker_token.outputs.installation-id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "Minted worker installation token is missing" >&2; exit 1;
          }
          test -n "$ACTION_APP_SLUG" && test "$ACTION_APP_SLUG" = "$EXPECTED_APP_SLUG" || {
            echo "Minted token is not from the expected worker App" >&2; exit 1;
          }
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "Worker installation ID not authenticated" >&2; exit 1;
          }
          # The minted token and independently JWT-authenticated installation
          # must be EXACTLY the same principal, before any token API read.
          test "$(jq -r '.installation_id'             "$RUNNER_TEMP/atc-w1id-receipt.json")" = "$INSTALLATION_ID" || {
            echo "Minted worker token installation differs from JWT-authenticated App" >&2
            exit 1
          }

          # This is the ONLY API use of the actual Contents-write token.
          # It is a GET and must show precisely Phil in the token's scope.
          gh api "installation/repositories" > /tmp/atc-worker-token-repos.json
          jq -e --arg repo "$GH_REPO" '
            (.total_count == 1) and
            (.repositories | type == "array" and length == 1) and
            (.repositories[0].full_name == $repo)
          ' /tmp/atc-worker-token-repos.json > /dev/null || {
            echo "Worker token is not restricted to the Phil repository" >&2
            exit 1
          }

          {
            echo "### MHB-ATC worker App W1 credential preflight"
            echo "- trusted source: main"
            echo "- authenticated worker App slug: $ACTION_APP_SLUG"
            echo "- installation ID: $INSTALLATION_ID"
            echo "- token-visible repositories: exactly $GH_REPO"
            echo "- worker token requested: Contents write, Metadata read implicit"
            echo "- protected refs/PRs/issues modified: none"
            echo "- token revocation: enabled; inspect post-action cleanup logs for actual result"
            echo "- ATC activation switches: OFF"
            echo "- boundary: NO token or key delegated to hamsters"
            echo "- next gate: separate actual worker permission-denial commissioning"
          } >> "$GITHUB_STEP_SUMMARY"
