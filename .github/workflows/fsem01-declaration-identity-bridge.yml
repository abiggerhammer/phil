name: FSEM-01 Declaration Identity Representation

on:
  pull_request:
    paths:
      - 'proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v'
      - 'proof/Phil/Surface/SurfaceBinderNameEncoding.v'
      - 'test/Phase1FSEM01DeclarationBridgeMain.hs'
      - 'docs/phase-1/formal-semantics-declaration-identity-bridge-fsem01-v1.md'
      - '.github/workflows/fsem01-declaration-identity-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v'
      - 'proof/Phil/Surface/SurfaceBinderNameEncoding.v'
      - 'test/Phase1FSEM01DeclarationBridgeMain.hs'
      - 'docs/phase-1/formal-semantics-declaration-identity-bridge-fsem01-v1.md'
      - '.github/workflows/fsem01-declaration-identity-bridge.yml'

permissions:
  contents: read

jobs:
  rocq-declaration-root-representation:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Prove bounded catalog and binder identity relation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/BindingSemantics.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SurfaceBinderNameEncoding.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v
      - name: Reject admissions and record exact-head proof hash
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v; then
            echo "Found an admission or global axiom in bridge proof"
            exit 1
          fi
          sha256sum \
            proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v \
            proof/Phil/Surface/SurfaceDeclarationIdentityBridge.vo

  haskell-declaration-root-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build actual Haskell substrate
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Strict check source-derived declaration identity and catalog test
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1FSEM01DeclarationBridgeMain.hs
      - name: Replay bounded declaration-root representation test
        run: cabal exec -- runghc -isrc -Wall -Werror \
          test/Phase1FSEM01DeclarationBridgeMain.hs
