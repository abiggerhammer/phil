name: Hamster Merge Intent

on:
  push:
    branches:
      - 'hamster/merge/**'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  # The merge operation mutates shared main, so every lane must use one queue.
  # GitHub's default single pending slot replaces earlier requests: preserve
  # distinct merge intents instead of silently cancelling pending work.
  group: hamster-merge-intent-global
  queue: max
  cancel-in-progress: false

jobs:
  merge-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Parse merge intent
        id: intent
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$REF_NAME" =~ ^hamster/merge/([^/]+)/pr-([0-9]+)/([0-9a-f]{40})$ ]]; then
            lane="${BASH_REMATCH[1]}"
            pr="${BASH_REMATCH[2]}"
            expected="${BASH_REMATCH[3]}"
          else
            echo "Malformed merge-intent branch: $REF_NAME" >&2
            exit 1
          fi

          case "$lane" in
            proof-audit|rocq-refinement|impl-audit|p8-representation|p9-evidence) ;;
            *)
              echo "Unsupported hamster lane: $lane" >&2
              exit 1
              ;;
          esac

          {
            echo "lane=$lane"
            echo "pr=$pr"
            echo "expected=$expected"
          } >> "$GITHUB_OUTPUT"

      - name: Check out current MHB lint implementation
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: main
          path: mhb-lint-shadow
          persist-credentials: false

      - name: Run MHB lint in shadow mode
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANE: ${{ steps.intent.outputs.lane }}
          PR_NUMBER: ${{ steps.intent.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.intent.outputs.expected }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          labels_json="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq '[.labels[].name]')"
          checks_json="$(
            gh api --paginate -H 'Accept: application/vnd.github+json' "repos/$GH_REPO/commits/$EXPECTED_HEAD/check-runs?per_page=100" \
              | jq -s '{total_count: (.[0].total_count // 0), check_runs: [.[].check_runs[]]}'
          )"
          main_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"

          pr_files_json="$(
            gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'               | jq -R -s 'split("\n") | map(select(length > 0))'
          )"

          if [ "$base_sha" != "$main_sha" ]; then
            intervening_json="$(
              gh api "repos/$GH_REPO/compare/$base_sha...$main_sha" --jq '.files[].filename'                 | jq -R -s 'split("\n") | map(select(length > 0))'
            )"
          else
            intervening_json='[]'
          fi

          jq -n             --arg operation "merge"             --arg lane "$LANE"             --arg expected_head "$EXPECTED_HEAD"             --arg main_sha "$main_sha"             --arg head_ref "$(jq -r '.head.ref' <<<"$pr_json")"             --arg head_sha "$(jq -r '.head.sha' <<<"$pr_json")"             --arg base_sha "$base_sha"             --argjson labels "$labels_json"             --argjson changed_files "$pr_files_json"             --argjson intervening_main_files "$intervening_json"             --argjson total_count "$(jq '.total_count' <<<"$checks_json")"             --argjson runs "$(jq '[.check_runs[] | {name, status, conclusion}]' <<<"$checks_json")"             '{
              operation: $operation,
              lane: $lane,
              expected_head: $expected_head,
              main_sha: $main_sha,
              pr: {
                labels: $labels,
                head_ref: $head_ref,
                head_sha: $head_sha,
                base_sha: $base_sha,
                changed_files: $changed_files
              },
              checks: {
                total_count: $total_count,
                runs: $runs
              },
              intervening_main_files: $intervening_main_files
            }' > /tmp/mhb-merge-snapshot.json

          set +e
          python3 mhb-lint-shadow/scripts/mhb_lint.py             --format json /tmp/mhb-merge-snapshot.json             > /tmp/mhb-lint.json
          lint_status=$?
          set -e

          {
            echo "### MHB lint shadow"
            echo
            echo "- operation: merge"
            echo "- lane: $LANE"
            echo "- PR: #$PR_NUMBER"
            echo "- exact authorized head: $EXPECTED_HEAD"
            if [ "$lint_status" -eq 0 ]; then
              echo "- shadow result: clean"
            else
              echo "- shadow result: diagnostics observed (non-authoritative)"
              sed 's/^/    /' /tmp/mhb-lint.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Shadow mode deliberately does not affect merge authority.
          exit 0

      - name: Verify exact PR state and merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANE: ${{ steps.intent.outputs.lane }}
          PR_NUMBER: ${{ steps.intent.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.intent.outputs.expected }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"

          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"

          test "$state" = "open"
          test "$draft" = "false"
          test "$head_sha" = "$EXPECTED_HEAD"

          case "$head_ref" in
            "hamster/$LANE/"*) ;;
            *)
              echo "PR head $head_ref is not owned by lane $LANE" >&2
              exit 1
              ;;
          esac

          labels="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq '.labels[].name')"
          if ! grep -Fxq "lane: $LANE" <<<"$labels"; then
            echo "PR #$PR_NUMBER lacks native lane label lane: $LANE" >&2
            exit 1
          fi

          checks_json="$(
            gh api --paginate -H 'Accept: application/vnd.github+json' "repos/$GH_REPO/commits/$EXPECTED_HEAD/check-runs?per_page=100" \
              | jq -s '{total_count: (.[0].total_count // 0), check_runs: [.[].check_runs[]]}'
          )"
          total="$(jq -r '.total_count' <<<"$checks_json")"
          returned="$(jq -r '.check_runs | length' <<<"$checks_json")"

          if [ "$total" -eq 0 ] || [ "$returned" -ne "$total" ]; then
            echo "Check-run census incomplete: total=$total returned=$returned" >&2
            exit 1
          fi

          # Fail closed for all incomplete, failed, cancelled, neutral, or
          # otherwise non-successful checks. A single PR-only release publish
          # skip is handled separately after verifying GitHub provenance.
          bad="$(jq -r '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped"))] | length' <<<"$checks_json")"
          if [ "$bad" -ne 0 ]; then
            echo "Not all exact-head checks are successful:" >&2
            jq -r '.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped")) | "  \(.name): status=\(.status) conclusion=\(.conclusion)"' <<<"$checks_json" >&2
            exit 1
          fi

          skipped_count="$(jq -r '[.check_runs[] | select(.conclusion == "skipped")] | length' <<<"$checks_json")"
          if [ "$skipped_count" -gt 1 ]; then
            echo "Multiple skipped checks; refusing merge." >&2
            exit 1
          fi
          if [ "$skipped_count" -eq 1 ]; then
            skipped="$(jq -c '.check_runs[] | select(.conclusion == "skipped")' <<<"$checks_json")"
            if ! jq -e --arg expected_head "$EXPECTED_HEAD" \
              '(.name == "publish") and (.status == "completed") and (.app.slug == "github-actions") and (.head_sha == $expected_head)' \
              <<<"$skipped" >/dev/null; then
              echo "Skipped check is not the expected GitHub Actions publish job." >&2
              exit 1
            fi

            # The job must come from the trusted INT-011 release workflow
            # on this exact PR head, not merely have the name "publish".
            url_prefix="https://github.com/$GH_REPO/actions/runs/"
            run_id="$(jq -r --arg prefix "$url_prefix" \
              '.details_url | select(startswith($prefix)) | ltrimstr($prefix) | capture("^(?<run>[0-9]+)/job/(?<job>[0-9]+)$").run' \
              <<<"$skipped")"
            job_id="$(jq -r --arg prefix "$url_prefix" \
              '.details_url | select(startswith($prefix)) | ltrimstr($prefix) | capture("^(?<run>[0-9]+)/job/(?<job>[0-9]+)$").job' \
              <<<"$skipped")"
            if ! [[ "$run_id" =~ ^[0-9]+$ && "$job_id" =~ ^[0-9]+$ ]]; then
              echo "Skipped publish check has no valid Actions run/job URL." >&2
              exit 1
            fi

            release_run="$(gh api "repos/$GH_REPO/actions/runs/$run_id")"
            if ! jq -e \
              --arg expected_head "$EXPECTED_HEAD" \
              --arg expected_branch "$head_ref" \
              '(.name == "Phase 1 INT-011 GitHub Release")
                and (.path == ".github/workflows/phase1-int011-github-release.yml")
                and (.event == "pull_request")
                and (.head_sha == $expected_head)
                and (.head_branch == $expected_branch)
                and (.status == "completed")
                and (.conclusion == "success")' \
              <<<"$release_run" >/dev/null; then
              echo "Skipped publish check is not from a successful exact-head INT-011 PR run." >&2
              exit 1
            fi

            publish_job="$(gh api "repos/$GH_REPO/actions/jobs/$job_id")"
            if ! jq -e \
              --argjson expected_run "$run_id" \
              --argjson expected_job "$job_id" \
              '(.id == $expected_job) and (.run_id == $expected_run)
                and (.name == "publish") and (.status == "completed")
                and (.conclusion == "skipped")' \
              <<<"$publish_job" >/dev/null; then
              echo "Skipped check does not correspond to the trusted publish job." >&2
              exit 1
            fi
            echo "Allowed: only INT-011 publish skipped on this exact PR head."
          fi

          main_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"

          if [ "$base_sha" != "$main_sha" ]; then
            pr_files="$(mktemp)"
            main_files="$(mktemp)"

            gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' | sort -u > "$pr_files"
            gh api "repos/$GH_REPO/compare/$base_sha...$main_sha" --jq '.files[].filename' | sort -u > "$main_files"

            overlap="$(comm -12 "$pr_files" "$main_files")"
            if [ -n "$overlap" ]; then
              echo "Intervening main overlaps PR files; refusing merge:" >&2
              printf '%s\n' "$overlap" >&2
              exit 1
            fi
          fi

          result="$(gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$EXPECTED_HEAD" \
            -f merge_method=merge)"

          merged="$(jq -r '.merged' <<<"$result")"
          message="$(jq -r '.message' <<<"$result")"

          echo "merged=$merged"
          echo "message=$message"

          test "$merged" = "true"

      - name: Summary
        shell: bash
        env:
          LANE: ${{ steps.intent.outputs.lane }}
          PR_NUMBER: ${{ steps.intent.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.intent.outputs.expected }}
        run: |
          {
            echo "### Hamster merge intent"
            echo
            echo "- lane: $LANE"
            echo "- PR: #$PR_NUMBER"
            echo "- exact authorized head: $EXPECTED_HEAD"
            echo "- result: merged"
          } >> "$GITHUB_STEP_SUMMARY"
