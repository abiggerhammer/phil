name: Phase 1 Surface Grammar Revision Production Binding

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'proof/Phil/Surface/Grammar.v'
      - 'proof/Phil/Surface/GrammarRevision.v'
      - 'proof/Phil/Surface/GrammarRevisionImplementation.v'
      - 'proof/Phil/Surface/GrammarRevisionImplementationExtraction.v'
      - 'generated/GrammarRevisionKernel.hs'
      - 'src/GrammarRevisionKernel.hs'
      - 'src/Phil/Surface/Lineage.hs'
      - 'src/Phil/Surface/GrammarRevisionCertification.hs'
      - 'app/GrammarRevisionDecisionCorrespondenceMain.hs'
      - 'app/GrammarRevisionProductionBindingMain.hs'
      - 'test/Phase1GrammarRevisionBindingMain.hs'
      - 'test/Phase1PortableSourceLineageMain.hs'
      - 'docs/phase-1/surface-grammar-revision-production-binding-v1.md'
      - '.github/workflows/phase1-surface-grammar-revision-production-binding.yml'

permissions:
  contents: read

jobs:
  derive-exact-grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive exact typed Grammar-v1 artifact
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/derive_phase1_surface_grammar.py
          python3 scripts/derive_phase1_surface_grammar.py --write
          cp proof/Phil/Surface/Grammar.v /tmp/Grammar.first.v
          python3 scripts/derive_phase1_surface_grammar.py --write
          cmp /tmp/Grammar.first.v proof/Phil/Surface/Grammar.v
          python3 scripts/derive_phase1_surface_grammar.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: exact-phase1-surface-grammar-production
          path: proof/Phil/Surface/Grammar.v
          if-no-files-found: error

  exact-grammar-revision-kernel:
    needs: derive-exact-grammar
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exact-phase1-surface-grammar-production
          path: proof/Phil/Surface
      - name: Fresh-extract exact Grammar Revision kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarRevision.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarRevisionImplementation.v
          rm -f GrammarRevisionKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarRevisionImplementationExtraction.v
          test -s GrammarRevisionKernel.hs
          test "$(wc -c < GrammarRevisionKernel.hs)" -eq 510
          echo 'fdf35b8405e79f71763ea2fe342d030e0c5eac8181d9176f3c4815038f049313  GrammarRevisionKernel.hs' | sha256sum -c -
          cmp GrammarRevisionKernel.hs generated/GrammarRevisionKernel.hs
          cmp GrammarRevisionKernel.hs src/GrammarRevisionKernel.hs
      - name: Record exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-grammar-revision-exact-kernel
          cp GrammarRevisionKernel.hs surface-grammar-revision-exact-kernel/
          sha256sum \
            GrammarRevisionKernel.hs \
            generated/GrammarRevisionKernel.hs \
            src/GrammarRevisionKernel.hs \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarRevision.v \
            proof/Phil/Surface/GrammarRevisionImplementation.v \
            proof/Phil/Surface/GrammarRevisionImplementationExtraction.v \
            > surface-grammar-revision-exact-kernel/PHIL-SURFACE-REV-001.exact-kernel.sha256
          cat surface-grammar-revision-exact-kernel/PHIL-SURFACE-REV-001.exact-kernel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: surface-grammar-revision-exact-kernel
          path: surface-grammar-revision-exact-kernel
          if-no-files-found: error

  verify-grammar-revision-production-binding:
    needs: exact-grammar-revision-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck kernel and production correspondence surface
        run: |
          set -euo pipefail
          ghc -Wall -Werror -fno-code src/GrammarRevisionKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/Lineage.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/GrammarRevisionCertification.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/GrammarRevisionDecisionCorrespondenceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/GrammarRevisionProductionBindingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1GrammarRevisionBindingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1PortableSourceLineageMain.hs
      - name: Re-run exact extracted-kernel controls
        run: cabal exec -- runghc -Wall -Werror -isrc app/GrammarRevisionDecisionCorrespondenceMain.hs
      - name: Execute production-binding controls
        run: cabal exec -- runghc -Wall -Werror -isrc app/GrammarRevisionProductionBindingMain.hs
      - name: Re-run unchanged SURF-006 revision corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarRevisionBindingMain.hs
      - name: Re-run unchanged portable lineage corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1PortableSourceLineageMain.hs
      - name: Record production-binding identities
        run: |
          set -euo pipefail
          mkdir -p surface-grammar-revision-production-binding
          sha256sum \
            generated/GrammarRevisionKernel.hs \
            src/GrammarRevisionKernel.hs \
            src/Phil/Surface/Lineage.hs \
            src/Phil/Surface/GrammarRevisionCertification.hs \
            app/GrammarRevisionDecisionCorrespondenceMain.hs \
            app/GrammarRevisionProductionBindingMain.hs \
            test/Phase1GrammarRevisionBindingMain.hs \
            test/Phase1PortableSourceLineageMain.hs \
            proof/Phil/Surface/GrammarRevision.v \
            proof/Phil/Surface/GrammarRevisionImplementation.v \
            docs/phase-1/surface-grammar-revision-production-binding-v1.md \
            > surface-grammar-revision-production-binding/PHIL-SURFACE-REV-001.production-binding.sha256
          cat surface-grammar-revision-production-binding/PHIL-SURFACE-REV-001.production-binding.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: surface-grammar-revision-production-binding
          path: surface-grammar-revision-production-binding
          if-no-files-found: error
