name: Phase 1 Storage Realization Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'proof/Phil/Core/ArchitectureRealization.v'
      - 'proof/Phil/Systems/FactDisposition.v'
      - 'proof/Phil/Assurance/ValidityScope.v'
      - 'proof/Phil/Core/SystemsStageClosure.v'
      - 'proof/Phil/Core/SystemsRealizationEffects.v'
      - 'proof/Phil/Core/SystemsSubjectAuthority.v'
      - 'proof/Phil/Core/StorageRealization.v'
      - 'proof/Phil/Core/StorageRealizationImplementation.v'
      - 'proof/Phil/Core/StorageRealizationImplementationExtraction.v'
      - 'generated/StorageRealizationKernel.hs'
      - 'src/StorageRealizationKernel.hs'
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/Systems/StorageRealizationCertification.hs'
      - 'app/StorageRealizationDecisionCorrespondenceMain.hs'
      - 'app/StorageRealizationProductionBindingMain.hs'
      - 'test/Phase1StorageRealizationMain.hs'
      - 'docs/phase-1/storage-realization-production-binding-v1.md'
      - '.github/workflows/phase1-storage-realization-production-binding.yml'
  push:
    branches: [main]
    paths:
      - 'generated/StorageRealizationKernel.hs'
      - 'src/StorageRealizationKernel.hs'
      - 'src/Phil/Systems/StorageRealizationCertification.hs'
      - 'app/StorageRealizationProductionBindingMain.hs'
      - 'docs/phase-1/storage-realization-production-binding-v1.md'
      - '.github/workflows/phase1-storage-realization-production-binding.yml'

permissions:
  contents: read

jobs:
  exact-storage-realization-kernel:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Freshly extract exact Storage Realization kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureInstantiation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderReplacementQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureRealization.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsRealizationEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsSubjectAuthority.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageRealization.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageRealizationImplementation.v
          rm -f StorageRealizationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageRealizationImplementationExtraction.v
          test -s StorageRealizationKernel.hs
          echo 'e81d916f195f809a248fda883326328110ba8ae7bf0269f708b8aad5f85b27ac  StorageRealizationKernel.hs' | sha256sum -c -
          cmp StorageRealizationKernel.hs generated/StorageRealizationKernel.hs
          cmp StorageRealizationKernel.hs src/StorageRealizationKernel.hs
      - name: Record exact kernel identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage-realization-exact-kernel
          cp StorageRealizationKernel.hs storage-realization-exact-kernel/
          sha256sum \
            StorageRealizationKernel.hs \
            generated/StorageRealizationKernel.hs \
            src/StorageRealizationKernel.hs \
            > storage-realization-exact-kernel/PHIL-MEM-REALIZE-001.kernel.sha256
          cat storage-realization-exact-kernel/PHIL-MEM-REALIZE-001.kernel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: storage-realization-exact-kernel
          path: storage-realization-exact-kernel
          if-no-files-found: error

  verify-storage-realization-production-binding:
    needs: exact-storage-realization-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build broad regression surface
        run: cabal build all --enable-tests
      - name: Strictly typecheck bound Storage Realization surface
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -Wno-unused-imports -fno-code src/StorageRealizationKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/Storage.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/StorageRealizationCertification.hs
          cabal exec -- ghc -isrc -Wall -Werror -Wno-unused-imports -fno-code app/StorageRealizationDecisionCorrespondenceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/StorageRealizationProductionBindingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1StorageRealizationMain.hs
      - name: Execute exact extracted-kernel controls
        run: cabal exec -- runghc -Wall -Werror -Wno-unused-imports -isrc app/StorageRealizationDecisionCorrespondenceMain.hs
      - name: Execute production-binding controls
        run: cabal exec -- runghc -Wall -Werror -isrc app/StorageRealizationProductionBindingMain.hs
      - name: Re-run unchanged MEM-001 through MEM-006 corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1StorageRealizationMain.hs
      - name: Record production binding identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage-realization-production-binding
          sha256sum \
            src/StorageRealizationKernel.hs \
            src/Phil/Systems/Storage.hs \
            src/Phil/Systems/StorageRealizationCertification.hs \
            app/StorageRealizationDecisionCorrespondenceMain.hs \
            app/StorageRealizationProductionBindingMain.hs \
            test/Phase1StorageRealizationMain.hs \
            > storage-realization-production-binding/PHIL-MEM-REALIZE-001.production.sha256
          cat storage-realization-production-binding/PHIL-MEM-REALIZE-001.production.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: storage-realization-production-binding
          path: storage-realization-production-binding
          if-no-files-found: error
