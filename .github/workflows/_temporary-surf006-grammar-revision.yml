name: Temporary SURF-006 grammar revision binding

on:
  push:
    branches:
      - phase1-surf-006-grammar-revision-binding

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-006-grammar-revision-binding
          fetch-depth: 0
      - name: Apply SURF-006 slice
        shell: bash
        run: |
          python3 scripts/_temporary_surf006_migrate.py
          rm scripts/_temporary_surf006_migrate.py
          rm .github/workflows/_temporary-surf006-grammar-revision.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Surface/Lineage.hs test/Phase1PortableSourceLineageMain.hs test/Phase1GrammarRevisionBindingMain.hs test/fixtures/phase1/surf010-inline.bundle test/fixtures/phase1/surf010-metadata.bundle .github/workflows/phase1-surface-grammar.yml docs/phase-1/surface-grammar-v1.md scripts/_temporary_surf006_migrate.py .github/workflows/_temporary-surf006-grammar-revision.yml
          git commit -m 'Bind source bundles to exact Grammar-v1 revision'
          git push origin HEAD:phase1-surf-006-grammar-revision-binding
