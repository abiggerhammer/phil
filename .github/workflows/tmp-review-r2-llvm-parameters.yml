name: Temporary R2 LLVM parameter remediation

on:
  push:
    branches: [phase1-review-r2-llvm-parameter-preservation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-review-r2-llvm-parameter-preservation
      - name: Apply guarded verifier patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one anchor in {path}, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          verify = Path('src/Phil/LLVM/Verify.hs')
          replace_once(
              verify,
              '  | LLVMFunctionEntryMismatch Text LLVMBlockId LLVMBlockId\n  | LLVMMissingEntryBlock Text LLVMBlockId\n',
              '  | LLVMFunctionEntryMismatch Text LLVMBlockId LLVMBlockId\n'
              '  | LLVMFunctionParametersMismatch Text [LLVMParameter] [LLVMParameter]\n'
              '  | LLVMMissingEntryBlock Text LLVMBlockId\n')

          replace_once(
              verify,
              '      Just actualFunction ->\n'
              '        forM_ (Map.toAscList (llvmFunctionBlocks expectedFunction)) $ \\(blockId, expectedBlock) ->\n',
              '      Just actualFunction -> do\n'
              '        let expectedParameters = llvmFunctionParameters expectedFunction\n'
              '            actualParameters = llvmFunctionParameters actualFunction\n'
              '        unless (actualParameters == expectedParameters) $\n'
              '          Left (LLVMFunctionParametersMismatch\n'
              '            functionName expectedParameters actualParameters)\n'
              '        forM_ (Map.toAscList (llvmFunctionBlocks expectedFunction)) $ \\(blockId, expectedBlock) ->\n')
          PY
          git diff --check
          git diff -- src/Phil/LLVM/Verify.hs
      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add src/Phil/LLVM/Verify.hs
          git commit -m "review: preserve LLVM function parameters in translation validation"
          git push origin HEAD:phase1-review-r2-llvm-parameter-preservation
