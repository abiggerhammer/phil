name: Phase 1 Steve Provider Witness Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Examples/Steve/ProviderQualifications.hs'
      - 'test/Phase1SteveProviderQualificationMain.hs'
      - 'docs/phase-1/steve-provider-qualifications-v1.md'
      - 'docs/phase-1/steve-provider-witness-implementation-refinement-v1.md'
      - 'proof/Phil/Core/SteveProviderQualificationWitness.v'
      - 'proof/Phil/Core/SteveProviderQualificationWitnessImplementation.v'
      - 'proof/Phil/Core/SteveProviderQualificationWitnessImplementationExtraction.v'
      - 'app/Phase1SteveProviderWitnessCertificationMain.hs'
      - 'app/SteveProviderQualificationWitnessDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-steve-provider-witness-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Examples/Steve/ProviderQualifications.hs'
      - 'test/Phase1SteveProviderQualificationMain.hs'
      - 'docs/phase-1/steve-provider-qualifications-v1.md'
      - 'docs/phase-1/steve-provider-witness-implementation-refinement-v1.md'
      - 'proof/Phil/Core/SteveProviderQualificationWitness.v'
      - 'proof/Phil/Core/SteveProviderQualificationWitnessImplementation.v'
      - 'proof/Phil/Core/SteveProviderQualificationWitnessImplementationExtraction.v'
      - 'app/Phase1SteveProviderWitnessCertificationMain.hs'
      - 'app/SteveProviderQualificationWitnessDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-steve-provider-witness-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-steve-provider-witness:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-PROV-STEVE-WITNESS-001 and implementation refinement
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/SteveProviderQualificationWitness.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SteveProviderQualificationWitnessImplementation.v
          rm -f SteveProviderQualificationWitnessKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/SteveProviderQualificationWitnessImplementationExtraction.v
          test -s SteveProviderQualificationWitnessKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-steve-provider-witness-proof
          cp \
            proof/Phil/Core/SteveProviderQualificationWitness.v \
            proof/Phil/Core/SteveProviderQualificationWitness.vo \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementation.v \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementation.vo \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementationExtraction.v \
            SteveProviderQualificationWitnessKernel.hs \
            phase1-steve-provider-witness-proof/
          sha256sum \
            proof/Phil/Core/SteveProviderQualificationWitness.v \
            proof/Phil/Core/SteveProviderQualificationWitness.vo \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementation.v \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementation.vo \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementationExtraction.v \
            SteveProviderQualificationWitnessKernel.hs \
            src/Phil/Examples/Steve/ProviderQualifications.hs \
            test/Phase1SteveProviderQualificationMain.hs \
            app/SteveProviderQualificationWitnessDecisionCorrespondenceMain.hs \
            docs/phase-1/steve-provider-witness-implementation-refinement-v1.md \
            > phase1-steve-provider-witness-proof/PHIL-PROV-STEVE-WITNESS-001.proof.sha256
          cat phase1-steve-provider-witness-proof/PHIL-PROV-STEVE-WITNESS-001.proof.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-steve-provider-witness-proof
          path: phase1-steve-provider-witness-proof
          if-no-files-found: error

  certify-phase1-steve-provider-witness:
    needs: rocq-phase1-steve-provider-witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier substrate with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-steve-provider-witness-proof
          path: phase1-steve-provider-witness-proof
      - name: Strict typecheck exact kernel, staging harness, and native witness
        run: |
          set -euo pipefail
          ghc -Wall -Werror -fno-code \
            phase1-steve-provider-witness-proof/SteveProviderQualificationWitnessKernel.hs
          cabal exec -- ghc \
            -isrc -iphase1-steve-provider-witness-proof \
            -Wall -Werror -fno-code \
            app/SteveProviderQualificationWitnessDecisionCorrespondenceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Examples/Steve/ProviderQualifications.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1SteveProviderQualificationMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            app/Phase1SteveProviderWitnessCertificationMain.hs
      - name: Execute exact extracted-kernel controls
        run: |
          cabal exec -- runghc \
            -iphase1-steve-provider-witness-proof \
            -Wall -Werror \
            app/SteveProviderQualificationWitnessDecisionCorrespondenceMain.hs
      - name: Re-run unchanged PROV-016 correspondence
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1SteveProviderQualificationMain.hs
      - name: Emit PHIL-PROV-STEVE-WITNESS-001 certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-steve-provider-witness-certification
          cabal exec -- runghc -isrc app/Phase1SteveProviderWitnessCertificationMain.hs \
            phase1-steve-provider-witness-proof/SteveProviderQualificationWitness.v \
            phase1-steve-provider-witness-proof/SteveProviderQualificationWitness.vo \
            phase1-steve-provider-witness-certification/PHIL-PROV-STEVE-WITNESS-001.rocq.cert
          sha256sum \
            src/Phil/Examples/Steve/ProviderQualifications.hs \
            test/Phase1SteveProviderQualificationMain.hs \
            docs/phase-1/steve-provider-qualifications-v1.md \
            proof/Phil/Core/SteveProviderQualificationWitness.v \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementation.v \
            proof/Phil/Core/SteveProviderQualificationWitnessImplementationExtraction.v \
            phase1-steve-provider-witness-proof/SteveProviderQualificationWitnessKernel.hs \
            app/Phase1SteveProviderWitnessCertificationMain.hs \
            app/SteveProviderQualificationWitnessDecisionCorrespondenceMain.hs \
            docs/phase-1/steve-provider-witness-implementation-refinement-v1.md \
            > phase1-steve-provider-witness-certification/PHIL-PROV-STEVE-WITNESS-001.correspondence.sha256
          cat phase1-steve-provider-witness-certification/PHIL-PROV-STEVE-WITNESS-001.rocq.cert
          sha256sum phase1-steve-provider-witness-certification/PHIL-PROV-STEVE-WITNESS-001.rocq.cert
          cat phase1-steve-provider-witness-certification/PHIL-PROV-STEVE-WITNESS-001.correspondence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-steve-provider-witness-proof-certification
          path: phase1-steve-provider-witness-certification
          if-no-files-found: error
