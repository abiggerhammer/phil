name: Phase 1 Deployment Authority Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Assurance/DeploymentQualification.v'
      - 'proof/Phil/Assurance/DeploymentAuthority.v'
      - 'src/Phil/Assurance/DeploymentQualification.hs'
      - 'src/Phil/Assurance/DeploymentAuthority.hs'
      - 'test/Phase1DeploymentQualificationMain.hs'
      - 'test/Phase1DeploymentAuthorityMain.hs'
      - 'docs/phase-1/deployment-authority-proof-v1.md'
      - '.github/workflows/phase1-deployment-authority-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Assurance/DeploymentQualification.v'
      - 'proof/Phil/Assurance/DeploymentAuthority.v'
      - 'src/Phil/Assurance/DeploymentQualification.hs'
      - 'src/Phil/Assurance/DeploymentAuthority.hs'
      - 'test/Phase1DeploymentQualificationMain.hs'
      - 'test/Phase1DeploymentAuthorityMain.hs'
      - 'docs/phase-1/deployment-authority-proof-v1.md'
      - '.github/workflows/phase1-deployment-authority-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-deployment-authority-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile Certified deployment qualification and PHIL-DEPLOY-AUTH-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/DeploymentQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/DeploymentAuthority.v
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-authority-proof
          cp \
            proof/Phil/Assurance/DeploymentAuthority.v \
            proof/Phil/Assurance/DeploymentAuthority.vo \
            deployment-authority-proof/
          sha256sum \
            proof/Phil/Assurance/DeploymentQualification.v \
            proof/Phil/Assurance/DeploymentAuthority.v \
            proof/Phil/Assurance/DeploymentAuthority.vo \
            src/Phil/Assurance/DeploymentQualification.hs \
            src/Phil/Assurance/DeploymentAuthority.hs \
            test/Phase1DeploymentQualificationMain.hs \
            test/Phase1DeploymentAuthorityMain.hs \
            > deployment-authority-proof/PHIL-DEPLOY-AUTH-001.proof.sha256
          {
            echo 'obligation=PHIL-DEPLOY-AUTH-001'
            echo 'predecessor=PHIL-DEPLOY-QUAL-001'
            echo 'evidence=Rocq-9.2.0'
            cat deployment-authority-proof/PHIL-DEPLOY-AUTH-001.proof.sha256
          } > deployment-authority-proof/PHIL-DEPLOY-AUTH-001.proof-certificate.txt
          cat deployment-authority-proof/PHIL-DEPLOY-AUTH-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-deployment-authority-proof
          path: deployment-authority-proof
          if-no-files-found: error

  verify-deployment-authority-correspondence:
    needs: rocq-deployment-authority-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck deployment qualification and authority implementation/corpora
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Assurance/DeploymentQualification.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Assurance/DeploymentAuthority.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1DeploymentQualificationMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1DeploymentAuthorityMain.hs
      - name: Re-run Certified DEP-003 through DEP-005 predecessor corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DeploymentQualificationMain.hs
      - name: Re-run unchanged DEP-006 authority corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DeploymentAuthorityMain.hs
