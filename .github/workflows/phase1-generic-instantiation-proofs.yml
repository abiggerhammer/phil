name: Phase 1 Generic Instantiation Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1GenericInstantiationMain.hs'
      - 'docs/phase-1/generic-instantiation-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/GenericRequirements.v'
      - 'proof/Phil/Core/GenericInstantiation.v'
      - 'app/Phase1GenericInstantiationCertificationMain.hs'
      - '.github/workflows/phase1-generic-instantiation-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1GenericInstantiationMain.hs'
      - 'docs/phase-1/generic-instantiation-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/GenericRequirements.v'
      - 'proof/Phil/Core/GenericInstantiation.v'
      - 'app/Phase1GenericInstantiationCertificationMain.hs'
      - '.github/workflows/phase1-generic-instantiation-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-generic-instantiation:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check generic proof dependency chain through PHIL-GEN-INST-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericRequirements.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericInstantiation.v
          test -f proof/Phil/Core/GenericInstantiation.vo
          mkdir -p phase1-generic-instantiation-proof
          cp proof/Phil/Core/GenericInstantiation.v phase1-generic-instantiation-proof/
          cp proof/Phil/Core/GenericInstantiation.vo phase1-generic-instantiation-proof/
          sha256sum \
            proof/Phil/Core/GenericStructural.v \
            proof/Phil/Core/GenericStructural.vo \
            proof/Phil/Core/GenericRequirements.v \
            proof/Phil/Core/GenericRequirements.vo \
            phase1-generic-instantiation-proof/GenericInstantiation.v \
            phase1-generic-instantiation-proof/GenericInstantiation.vo

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-generic-instantiation-proof
          path: phase1-generic-instantiation-proof
          if-no-files-found: error

  certify-phase1-generic-instantiation:
    needs: rocq-phase1-generic-instantiation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - name: Typecheck dedicated GEN-INST certifier with warnings as errors
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code app/Phase1GenericInstantiationCertificationMain.hs

      - name: Re-run exact GEN-007, GEN-008, and GEN-012 correspondence cases
        run: cabal exec -- runghc -isrc test/Phase1GenericInstantiationMain.hs

      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-generic-instantiation-proof
          path: phase1-generic-instantiation-proof

      - name: Emit PHIL-GEN-INST-001 proof certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-generic-instantiation-certification
          cabal exec -- runghc -isrc app/Phase1GenericInstantiationCertificationMain.hs \
            phase1-generic-instantiation-proof/GenericInstantiation.v \
            phase1-generic-instantiation-proof/GenericInstantiation.vo \
            phase1-generic-instantiation-certification/PHIL-GEN-INST-001.rocq.cert

          sha256sum \
            src/Phil/Core/Generic.hs \
            test/Phase1GenericInstantiationMain.hs \
            docs/phase-1/generic-instantiation-v1.md \
            proof/Phil/Core/GenericStructural.v \
            proof/Phil/Core/GenericRequirements.v \
            proof/Phil/Core/GenericInstantiation.v \
            app/Phase1GenericInstantiationCertificationMain.hs \
            > phase1-generic-instantiation-certification/PHIL-GEN-INST-001.correspondence.sha256

          cat phase1-generic-instantiation-certification/PHIL-GEN-INST-001.rocq.cert
          sha256sum phase1-generic-instantiation-certification/PHIL-GEN-INST-001.rocq.cert

      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-generic-instantiation-proof-certification
          path: phase1-generic-instantiation-certification
          if-no-files-found: error
