name: Hamster Auto PR

on:
  push:
    branches:
      - 'hamster/proof-audit/**'
      - 'hamster/rocq-refinement/**'
      - 'hamster/impl-audit/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: hamster-auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Derive lane metadata
        id: meta
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$BRANCH" in
            hamster/proof-audit/*)
              lane="proof-audit"
              ;;
            hamster/rocq-refinement/*)
              lane="rocq-refinement"
              ;;
            hamster/impl-audit/*)
              lane="impl-audit"
              ;;
            *)
              echo "Unexpected hamster branch: $BRANCH" >&2
              exit 1
              ;;
          esac

          title="$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n '1p')"
          if [ -z "$title" ]; then
            slug="${BRANCH##*/}"
            title="${slug//-/ }"
          fi

          {
            echo "lane=$lane"
            echo "title=$title"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Find or create pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          LANE: ${{ steps.meta.outputs.lane }}
          TITLE: ${{ steps.meta.outputs.title }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          number="$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            body_file="$(mktemp)"
            details="$(printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2)"

            printf 'Lane: %s\n\n' "$LANE" > "$body_file"

            if [ -n "$(printf '%s' "$details" | tr -d '[:space:]')" ]; then
              printf '%s\n\n' "$details" >> "$body_file"
            else
              printf 'Focused successor slice prepared by the %s hamster.\n\n' "$LANE" >> "$body_file"
            fi

            printf 'Prepared branch: %s\n' "$BRANCH" >> "$body_file"
            printf 'Exact head at creation: %s\n\n' "$HEAD_SHA" >> "$body_file"
            printf 'Published mechanically by the Mecha Hamster Ball branch-to-PR bridge.\n' >> "$body_file"

            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$body_file"

            number="$(gh pr list \
              --repo "$GH_REPO" \
              --state open \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number // empty')"
          fi

          if [ -z "$number" ]; then
            echo "PR creation returned without an open PR for $BRANCH" >&2
            exit 1
          fi

          gh pr edit "$number" --repo "$GH_REPO" --add-label "lane: $LANE"

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Using PR #$number for $BRANCH"

      - name: Summary
        shell: bash
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          LANE: ${{ steps.meta.outputs.lane }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          {
            echo "### Hamster branch-to-PR bridge"
            echo
            echo "- lane: $LANE"
            echo "- PR: #$NUMBER"
            echo "- exact pushed head: $HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
