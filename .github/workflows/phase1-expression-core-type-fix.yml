name: One-shot expression-core alternative-index type fix

on:
  push:
    branches: [phase1-surface-grammar-corr-expression-core]
    paths:
      - '.github/workflows/phase1-expression-core-type-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surface-grammar-corr-expression-core

      - name: Change command alternative index to Integer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Phil/Surface/GrammarV1/ReferenceAstExpressionCore.hs')
          text = path.read_text()
          old = 'commandAlternativeName\n  :: Int\n'
          new = 'commandAlternativeName\n  :: Integer\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one commandAlternativeName Int signature, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- src/Phil/Surface/GrammarV1/ReferenceAstExpressionCore.hs

      - name: Commit exact type fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Surface/GrammarV1/ReferenceAstExpressionCore.hs
          git commit -m 'Use extracted Integer alternative indices'
          git push origin HEAD:phase1-surface-grammar-corr-expression-core
