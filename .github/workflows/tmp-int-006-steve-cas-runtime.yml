name: Temporary INT-006 Steve CAS Runtime

on:
  workflow_dispatch:
  push:
    branches: [phase1-int-006-steve-cas-runtime]
    paths:
      - 'src/Phil/Compiler/SteveCAS.hs'
      - 'test/Phase1INT006SteveCASMain.hs'
      - 'src/Phil/Compiler/RuntimeChoiceLLVM.hs'
      - 'test/Phase1INT006RuntimeChoiceLLVMMain.hs'
      - 'test/Phase1INT005RealWitnessManifestMain.hs'
      - '.github/workflows/tmp-int-006-steve-cas-runtime.yml'

permissions:
  contents: read

jobs:
  steve-cas-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck real Steve CAS runtime
        run: |
          cabal exec -- ghc -isrc -itest -package directory -package unix \
            -Wall -Werror -fno-code test/Phase1INT006SteveCASMain.hs

      - name: Exercise real content-addressed artifacts
        run: |
          cabal exec -- runghc \
            --ghc-arg=-package --ghc-arg=directory \
            --ghc-arg=-package --ghc-arg=unix \
            -isrc -itest -Wall -Werror test/Phase1INT006SteveCASMain.hs

      - name: Replay certified runtime-choice LLVM lowering
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT006RuntimeChoiceLLVMMain.hs

      - name: Replay real Steve manifest closure
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT005RealWitnessManifestMain.hs
