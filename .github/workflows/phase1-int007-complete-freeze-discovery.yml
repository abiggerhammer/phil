name: INT-007 Complete Freeze Discovery

concurrency:
  group: int007-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

on:
  pull_request:
    paths:
      - 'scripts/build_phase1_conformance_freeze.py'
      - 'scripts/build_phase1_int007_complete_manifest.py'
      - 'handoff/phase1/conformance-freeze-v1.tsv'
      - 'handoff/phase1/manifest-v1.tsv'
      - 'handoff/phase1/runtime/**'
      - 'handoff/phase1/witnesses/*-assurance-manifest-v1.tsv'
      - 'handoff/phase1/witnesses/*-residual-tcb-v1.tsv'
      - 'test/fixtures/phase1-surface/**'
      - 'test/fixtures/phase1-negative/**'
      - '.github/workflows/phase1-int007-complete-freeze-discovery.yml'

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build exact complete conformance freeze
        run: |
          python3 scripts/build_phase1_conformance_freeze.py \
            --output dist/int007-complete-freeze/conformance-freeze-v1.tsv
      - name: Build exact completed top-level handoff manifest
        run: |
          python3 scripts/build_phase1_int007_complete_manifest.py \
            --conformance-path dist/int007-complete-freeze/conformance-freeze-v1.tsv \
            --output dist/int007-complete-freeze/manifest-v1.tsv
      - name: Compare checked-in freeze against exact generated bytes
        id: compare
        continue-on-error: true
        run: |
          cmp handoff/phase1/conformance-freeze-v1.tsv \
            dist/int007-complete-freeze/conformance-freeze-v1.tsv
          cmp handoff/phase1/manifest-v1.tsv \
            dist/int007-complete-freeze/manifest-v1.tsv
      - name: Upload exact complete-freeze discovery artifacts
        if: steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: int007-complete-freeze-discovery-${{ github.run_id }}
          path: dist/int007-complete-freeze/*.tsv
          if-no-files-found: error
          retention-days: 7
      - name: Preserve discovery failure until exact bytes are frozen
        if: steps.compare.outcome == 'failure'
        run: exit 1
