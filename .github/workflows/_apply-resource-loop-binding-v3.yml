name: Apply Resource Loop binding patch v3

on:
  push:
    branches:
      - bind-resource-loop-kernel
    paths:
      - '.github/workflows/_apply-resource-loop-binding-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bind-resource-loop-kernel
      - name: Apply production patch
        run: python3 scripts/apply_resource_loop_binding.py
      - name: Validate patch
        run: git diff --check
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Phil/Systems/ControlStateProjection.hs src/Phil/Core/Value.hs phil-core.cabal
          git commit -m 'Bind Resource Loop kernel to production checks'
          git push origin HEAD:bind-resource-loop-kernel
