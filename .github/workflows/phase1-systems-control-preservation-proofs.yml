name: Phase 1 Systems Control Preservation Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/SystemsControlPreservation.v'
      - 'proof/Phil/Core/SystemsControlPreservationImplementation.v'
      - 'proof/Phil/Core/SystemsControlPreservationImplementationExtraction.v'
      - 'docs/phase-1/systems-control-preservation-proof-v1.md'
      - 'docs/phase-1/systems-control-preservation-implementation-refinement-v1.md'
      - 'app/SystemsControlPreservationDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-systems-control-preservation-proofs.yml'
      - 'src/Phil/Systems/BranchResourceFailure.hs'
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'src/Phil/Systems/ProtocolStateCorrespondence.hs'
      - 'src/Phil/Systems/BoundaryCommitCorrespondence.hs'
      - 'test/Phase1BranchResourceFailureMain.hs'
      - 'test/Phase1ControlStateProjectionMain.hs'
      - 'test/Phase1ProtocolStateCorrespondenceMain.hs'
      - 'test/Phase1BoundaryCommitCorrespondenceMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/SystemsControlPreservation.v'
      - 'proof/Phil/Core/SystemsControlPreservationImplementation.v'
      - 'proof/Phil/Core/SystemsControlPreservationImplementationExtraction.v'
      - 'docs/phase-1/systems-control-preservation-proof-v1.md'
      - 'docs/phase-1/systems-control-preservation-implementation-refinement-v1.md'
      - 'app/SystemsControlPreservationDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-systems-control-preservation-proofs.yml'
      - 'src/Phil/Systems/BranchResourceFailure.hs'
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'src/Phil/Systems/ProtocolStateCorrespondence.hs'
      - 'src/Phil/Systems/BoundaryCommitCorrespondence.hs'
      - 'test/Phase1BranchResourceFailureMain.hs'
      - 'test/Phase1ControlStateProjectionMain.hs'
      - 'test/Phase1ProtocolStateCorrespondenceMain.hs'
      - 'test/Phase1BoundaryCommitCorrespondenceMain.hs'

permissions:
  contents: read

jobs:
  rocq-systems-control-preservation-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-SYS-CONTROL-001 proof and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsControlPreservation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsControlPreservationImplementation.v
          rm -f SystemsControlPreservationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsControlPreservationImplementationExtraction.v
          test -s SystemsControlPreservationKernel.hs
          grep -q 'decideBranchPreservationByFacts' SystemsControlPreservationKernel.hs
          grep -q 'decideStateProjectionByFacts' SystemsControlPreservationKernel.hs
          grep -q 'decideProtocolPreservationByFacts' SystemsControlPreservationKernel.hs
          grep -q 'decideBoundaryCommitByFacts' SystemsControlPreservationKernel.hs
          grep -q 'decideSystemsControlByFacts' SystemsControlPreservationKernel.hs
      - name: Record proof and extraction identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p systems-control-preservation-proof
          cp \
            proof/Phil/Core/SystemsControlPreservation.v \
            proof/Phil/Core/SystemsControlPreservation.vo \
            proof/Phil/Core/SystemsControlPreservationImplementation.v \
            proof/Phil/Core/SystemsControlPreservationImplementation.vo \
            proof/Phil/Core/SystemsControlPreservationImplementationExtraction.v \
            proof/Phil/Core/SystemsControlPreservationImplementationExtraction.vo \
            SystemsControlPreservationKernel.hs \
            systems-control-preservation-proof/
          sha256sum \
            systems-control-preservation-proof/SystemsControlPreservation.v \
            systems-control-preservation-proof/SystemsControlPreservation.vo \
            systems-control-preservation-proof/SystemsControlPreservationImplementation.v \
            systems-control-preservation-proof/SystemsControlPreservationImplementation.vo \
            systems-control-preservation-proof/SystemsControlPreservationKernel.hs \
            > systems-control-preservation-proof/PHIL-SYS-CONTROL-001.proof.sha256
          {
            echo 'obligation=PHIL-SYS-CONTROL-001'
            echo 'evidence=Rocq-9.2.0'
            cat systems-control-preservation-proof/PHIL-SYS-CONTROL-001.proof.sha256
          } > systems-control-preservation-proof/PHIL-SYS-CONTROL-001.proof-certificate.txt
          cat systems-control-preservation-proof/PHIL-SYS-CONTROL-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-systems-control-preservation-proof
          path: systems-control-preservation-proof
          if-no-files-found: error

  verify-systems-control-preservation-correspondence:
    needs: rocq-systems-control-preservation-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-systems-control-preservation-proof
          path: systems-control-preservation-proof
      - name: Typecheck and execute extracted SYS-007--010 decision controls
        run: |
          set -euo pipefail
          ghc -Wall -Werror -fno-code systems-control-preservation-proof/SystemsControlPreservationKernel.hs
          ghc -Wall -Werror \
            -isystems-control-preservation-proof \
            app/SystemsControlPreservationDecisionCorrespondenceMain.hs \
            -o systems-control-preservation-kernel-controls
          ./systems-control-preservation-kernel-controls
      - name: Typecheck unchanged SYS-007--010 production chain
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/BranchResourceFailure.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/ControlStateProjection.hs
          # main currently carries one pre-existing local name-shadowing warning in
          # ProtocolStateCorrespondence; keep every other warning fatal here.
          cabal exec -- ghc -isrc -Wall -Werror -Wno-name-shadowing -fno-code src/Phil/Systems/ProtocolStateCorrespondence.hs
          # BoundaryCommitCorrespondence additionally carries one pre-existing
          # redundant Data.Set import. Exempt only those two known warnings.
          cabal exec -- ghc -isrc -Wall -Werror -Wno-name-shadowing -Wno-unused-imports -fno-code src/Phil/Systems/BoundaryCommitCorrespondence.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1BranchResourceFailureMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1ControlStateProjectionMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -Wno-name-shadowing -fno-code test/Phase1ProtocolStateCorrespondenceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -Wno-name-shadowing -Wno-unused-imports -fno-code test/Phase1BoundaryCommitCorrespondenceMain.hs
      - name: Re-run unchanged 46-case SYS-007--010 corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1BranchResourceFailureMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1ControlStateProjectionMain.hs
          cabal exec -- runghc -Wall -Werror -Wno-name-shadowing -isrc test/Phase1ProtocolStateCorrespondenceMain.hs
          cabal exec -- runghc -Wall -Werror -Wno-name-shadowing -Wno-unused-imports -isrc test/Phase1BoundaryCommitCorrespondenceMain.hs
      - name: Record implementation-refinement staging identities
        run: |
          set -euo pipefail
          mkdir -p systems-control-preservation-implementation-correspondence
          sha256sum \
            systems-control-preservation-proof/SystemsControlPreservationKernel.hs \
            src/Phil/Systems/BranchResourceFailure.hs \
            src/Phil/Systems/ControlStateProjection.hs \
            src/Phil/Systems/ProtocolStateCorrespondence.hs \
            src/Phil/Systems/BoundaryCommitCorrespondence.hs \
            test/Phase1BranchResourceFailureMain.hs \
            test/Phase1ControlStateProjectionMain.hs \
            test/Phase1ProtocolStateCorrespondenceMain.hs \
            test/Phase1BoundaryCommitCorrespondenceMain.hs \
            app/SystemsControlPreservationDecisionCorrespondenceMain.hs \
            proof/Phil/Core/SystemsControlPreservationImplementation.v \
            docs/phase-1/systems-control-preservation-implementation-refinement-v1.md \
            > systems-control-preservation-implementation-correspondence/PHIL-SYS-CONTROL-001.staging.sha256
          cat systems-control-preservation-implementation-correspondence/PHIL-SYS-CONTROL-001.staging.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: systems-control-preservation-implementation-correspondence
          path: systems-control-preservation-implementation-correspondence
          if-no-files-found: error
