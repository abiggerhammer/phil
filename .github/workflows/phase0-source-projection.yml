name: Phase 0 Source Projection

on:
  pull_request:
    paths:
      - 'examples/upload/client.phil'
      - 'examples/upload/server.phil'
      - 'phase0-projection/**'
      - 'src/Phil/Surface/**'
      - 'src/Phil/Systems/**'
      - 'src/Phil/LLVM/ControlCodec.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'docs/phase-0/source-to-systems-projection-v1.md'
      - 'cabal.project'
      - '.github/workflows/phase0-source-projection.yml'
  push:
    branches: [main]
    paths:
      - 'examples/upload/client.phil'
      - 'examples/upload/server.phil'
      - 'phase0-projection/**'
      - 'src/Phil/Surface/**'
      - 'src/Phil/Systems/**'
      - 'src/Phil/LLVM/ControlCodec.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'docs/phase-0/source-to-systems-projection-v1.md'
      - 'cabal.project'
      - '.github/workflows/phase0-source-projection.yml'

permissions:
  contents: read

jobs:
  phase0-source-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build projection package with warnings as errors
        run: |
          cabal build \
            lib:phil-phase0-projection \
            exe:phil-phase0-upload-projection \
            test:projection-tests \
            --ghc-options=-Werror

      - name: Run source-to-Systems projection tests
        run: cabal test projection-tests --test-show-details=direct

      - name: Project canonical Phase 0 sources
        run: cabal run phil-phase0-upload-projection
