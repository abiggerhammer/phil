name: Phase 1 INT-008 Architecture Component Activation

concurrency:
  # Supersede obsolete same-PR checks only; never cancel non-PR runs.
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches:
      - phase1-int008-activation-protocol-context
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/ArchitectureComponentActivation.hs'
      - 'src/Phil/Surface/GrammarV1/ArchitectureComponentProvisioning.hs'
      - 'src/Phil/Core/ProcessActivation.hs'
      - 'src/Phil/Core/Protocol.hs'
      - 'test/Phase1INT008ArchitectureComponentActivationMain.hs'
      - '.github/workflows/phase1-int008-architecture-component-activation.yml'

jobs:
  architecture-component-activation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: true
      - name: Build ordinary regression substrate under canonical strict warnings
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Strictly typecheck INT-008 activation/protocol-context bridge
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/GrammarV1/ArchitectureComponentActivation.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1INT008ArchitectureComponentActivationMain.hs
      - name: Execute INT-008 activation/protocol-context controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT008ArchitectureComponentActivationMain.hs
