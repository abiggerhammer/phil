name: SURF session parser bootstrap

on:
  push:
    branches:
      - phase1-surf-002-session-parser-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-002-session-parser
          path: target
          fetch-depth: 0
      - name: Apply parser patch
        run: python3 scripts/surf_session_parser_bootstrap.py target/src/Phil/Surface/GrammarV1/Parser.hs
      - name: Commit parser patch
        run: |
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Surface/GrammarV1/Parser.hs
          git commit -m 'Complete SURF-002 session expression parser'
          git push origin HEAD:phase1-surf-002-session-parser
