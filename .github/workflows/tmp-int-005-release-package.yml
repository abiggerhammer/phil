name: Temporary INT-005 Release Package

on:
  workflow_dispatch:
  push:
    branches: [phase1-int-005-release-package]
    paths:
      - 'src/Phil/Verification/ReleasePackage.hs'
      - 'test/Phase1INT005ReleasePackageMain.hs'
      - 'test/Phase1INT005EmitCertifiedReleaseMain.hs'
      - 'test/Phil/Test/Phase1/CertifiedReleaseWitnesses.hs'
      - 'test/Phil/Test/Phase1/ManifestWitnesses.hs'
      - 'scripts/ci/phase1-int-005-release-package.sh'
      - 'scripts/ci/phase1-int-005-native-release-smoke.sh'
      - '.github/workflows/tmp-int-005-release-package.yml'

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck release package path
        run: |
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1INT005ReleasePackageMain.hs

      - name: Exercise release package controls
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT005ReleasePackageMain.hs

      - name: Emit persistent certified release bundles and replay native execution
        run: bash scripts/ci/phase1-int-005-release-package.sh

      - name: Upload inspectable certified release bundles
        uses: actions/upload-artifact@v4
        with:
          name: int005-certified-release-bundles
          path: dist/int005-certified-release/
          if-no-files-found: error
