name: Phase 1 Callable Recursion Implementation Refinement

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/CallableRecursionImplementation.v'
      - 'proof/Phil/Core/CallableRecursionImplementationExtraction.v'
      - 'docs/phase-1/callable-recursion-implementation-refinement-v1.md'
      - '.github/workflows/phase1-callable-recursion-implementation-refinement.yml'
      - 'src/CallableRecursionKernel.hs'
      - 'src/Phil/Core/CallableRecursion.hs'
      - 'src/Phil/Core/CallableRecursion/Bound.hs'
      - 'test/Phase1CallableRecursionMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/CallableRecursionImplementation.v'
      - 'proof/Phil/Core/CallableRecursionImplementationExtraction.v'
      - 'docs/phase-1/callable-recursion-implementation-refinement-v1.md'
      - '.github/workflows/phase1-callable-recursion-implementation-refinement.yml'
      - 'src/CallableRecursionKernel.hs'
      - 'src/Phil/Core/CallableRecursion.hs'
      - 'src/Phil/Core/CallableRecursion/Bound.hs'
      - 'test/Phase1CallableRecursionMain.hs'

permissions:
  contents: read

jobs:
  rocq-callable-recursion-implementation-refinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile CALL-013 implementation-refinement proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLifecycle.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRefinement.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRecursion.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRecursionImplementation.v
      - name: Regenerate and bind proved CALL-013 kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f CallableRecursionKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRecursionImplementationExtraction.v
          test -s CallableRecursionKernel.hs
          grep -q '^module CallableRecursionKernel where' CallableRecursionKernel.hs
          grep -q '^stabilizePublic ::' CallableRecursionKernel.hs
          grep -q '^decideRecursiveLookup ::' CallableRecursionKernel.hs
          if ! cmp -s CallableRecursionKernel.hs src/CallableRecursionKernel.hs; then
            echo 'checked-in CALL-013 kernel differs from fresh Rocq extraction' >&2
            diff -u src/CallableRecursionKernel.hs CallableRecursionKernel.hs || true
            exit 1
          fi
          sha256sum CallableRecursionKernel.hs src/CallableRecursionKernel.hs
          mkdir -p callable-recursion-implementation-refinement-proof
          cp \
            proof/Phil/Core/CallableRecursionImplementation.v \
            proof/Phil/Core/CallableRecursionImplementation.vo \
            proof/Phil/Core/CallableRecursionImplementationExtraction.v \
            CallableRecursionKernel.hs \
            callable-recursion-implementation-refinement-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-callable-recursion-implementation-refinement
          path: callable-recursion-implementation-refinement-proof
          if-no-files-found: error

  verify-production-callable-recursion:
    needs: rocq-callable-recursion-implementation-refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-callable-recursion-implementation-refinement
          path: callable-recursion-implementation-refinement-proof
      - name: Typecheck extracted and checked-in kernel
        run: |
          set -euo pipefail
          cmp -s \
            callable-recursion-implementation-refinement-proof/CallableRecursionKernel.hs \
            src/CallableRecursionKernel.hs
          ghc -Wall -Werror -fno-code src/CallableRecursionKernel.hs
          ghc -isrc -Wall -Werror -fno-code src/Phil/Core/CallableRecursion.hs
      - name: Exercise production CALL-013 path through extracted kernel
        run: |
          set -euo pipefail
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- runghc -isrc test/Phase1CallableRecursionMain.hs
