name: Apply architecture instantiation closeout v2

on:
  push:
    branches: [bind-architecture-instantiation-decisions-closeout]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply corrected production-binding patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-architecture-instantiation-closeout.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          body = source.split(start, 1)[1].split(end, 1)[0]
          body = textwrap.dedent(body)
          old = "   Prelude.False -> ArchitectureReferenceUnknownTarget}\n''')"
          new = "   Prelude.False -> ArchitectureReferenceUnknownTarget}\n\n''')"
          assert old in body
          body = body.replace(old, new, 1)
          exec(compile(body, 'architecture-instantiation-closeout-patcher', 'exec'))
          PY

      - name: Commit production-binding patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Core/Static.hs src/ArchitectureInstantiationKernel.hs phil-core.cabal
          git commit -m 'Bind architecture instantiation decisions'
          git push origin HEAD:bind-architecture-instantiation-decisions-closeout
