name: Storage Failure Detail Lowering Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/LLVM/StorageFailureDetail.v'
      - 'src/Phil/LLVM/StorageFailureDetail.hs'
      - 'src/Phil/LLVM/StorageFailureDetailProofCertification.hs'
      - 'src/Phil/LLVM/ServerFramedIngress.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/Systems/StorageFailure.hs'
      - 'app/StorageFailureDetailProofCorrespondenceMain.hs'
      - 'app/StorageFailureDetailProofCertificationMain.hs'
      - 'app/LLVMStorageFailureDetailMain.hs'
      - 'runtime/phase0/storage_failure_detail_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/StorageFailureDetailABIMain.hs'
      - 'test/ServerFramedIngressABIMain.hs'
      - 'docs/phase-0/storage-failure-detail-abi-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/storage-failure-detail-lowering-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/LLVM/StorageFailureDetail.v'
      - 'src/Phil/LLVM/StorageFailureDetail.hs'
      - 'src/Phil/LLVM/StorageFailureDetailProofCertification.hs'
      - 'src/Phil/LLVM/ServerFramedIngress.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/Systems/StorageFailure.hs'
      - 'app/StorageFailureDetailProofCorrespondenceMain.hs'
      - 'app/StorageFailureDetailProofCertificationMain.hs'
      - 'app/LLVMStorageFailureDetailMain.hs'
      - 'runtime/phase0/storage_failure_detail_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/StorageFailureDetailABIMain.hs'
      - 'test/ServerFramedIngressABIMain.hs'
      - 'docs/phase-0/storage-failure-detail-abi-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/storage-failure-detail-lowering-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-storage-failure-detail-lowering:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check Storage Failure Detail lowering proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/StorageFailureDetail.v
      - name: Stage checked Storage Failure Detail lowering proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rocq-storage-failure-detail-lowering/proof/Phil/LLVM
          cp proof/Phil/LLVM/StorageFailureDetail.v \
             proof/Phil/LLVM/StorageFailureDetail.vo \
             rocq-storage-failure-detail-lowering/proof/Phil/LLVM/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-storage-failure-detail-lowering-checked-proof-objects
          path: rocq-storage-failure-detail-lowering/
          if-no-files-found: error
          retention-days: 14

  certify-storage-failure-detail-lowering:
    needs: rocq-storage-failure-detail-lowering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-storage-failure-detail-lowering-checked-proof-objects
          path: rocq-storage-failure-detail-lowering

      - name: Build target and focused regressions
        run: |
          cabal build lib:phil-core \
            phil-llvm-phase0-storage-failure-detail \
            phil-storage-failure-detail-abi-tests

      - name: Run focused storage-failure regressions
        run: |
          cabal test phil-storage-failure-detail-abi-tests --test-show-details=direct
          cabal test phil-server-framed-ingress-abi-tests --test-show-details=direct
          cabal test phil-storage-failure-detail-tests --test-show-details=direct

      - name: Typecheck proof support with warnings as errors
        run: |
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/LLVM/StorageFailureDetailProofCertification.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/StorageFailureDetailProofCorrespondenceMain.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/StorageFailureDetailProofCertificationMain.hs

      - name: Run exact correspondence and drift checks
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/StorageFailureDetailProofCorrespondenceMain.hs \
            -o phil-check-storage-failure-detail-proof-correspondence
          ./phil-check-storage-failure-detail-proof-correspondence

      - name: Re-run LLVM, ABI, provider, and native gates
        shell: bash
        run: |
          set -euo pipefail
          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-storage-failure-detail)"
          "$EMITTER" > phase0-storage-failure-detail.ll
          "$LLVM_AS" phase0-storage-failure-detail.ll -o phase0-storage-failure-detail.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/storage_failure_detail_v1_smoke.c \
            -o storage-failure-detail-runtime.ll
          python3 scripts/check_runtime_abi.py --partial \
            phase0-storage-failure-detail.ll storage-failure-detail-runtime.ll
          "$LLVM_AS" storage-failure-detail-runtime.ll -o storage-failure-detail-runtime.bc
          "$LLVM_LINK" phase0-storage-failure-detail.bc storage-failure-detail-runtime.bc \
            -o phase0-storage-failure-detail-partially-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 \
            runtime/phase0/storage_failure_detail_v1_smoke.c \
            runtime/phase0/storage_failure_detail_v1_smoke_main.c \
            -o storage-failure-detail-smoke
          ./storage-failure-detail-smoke

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm runtime/phase0/storage_failure_detail_v1_bad_ambient.c \
            -o storage-failure-detail-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-storage-failure-detail.ll storage-failure-detail-bad-ambient.ll; then
            echo "expected ABI checker to reject ambient/nullary storage failure provider" >&2
            exit 1
          fi

      - name: Build proof-bound CERT-016 certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/StorageFailureDetailProofCertificationMain.hs \
            -o phil-certify-storage-failure-detail

      - name: Produce proof certificate and proof-bound CERT-016
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage-failure-detail-lowering-certificates
          ./phil-certify-storage-failure-detail
          for certificate in storage-failure-detail-lowering-certificates/*; do
            echo "===== ${certificate} ====="
            cat "${certificate}"
            sha256sum "${certificate}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: phil-storage-failure-detail-lowering-proof-certification
          path: storage-failure-detail-lowering-certificates/*
          if-no-files-found: error
          retention-days: 30
