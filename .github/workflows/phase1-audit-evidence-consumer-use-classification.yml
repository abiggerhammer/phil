name: Phase 1 Audit Evidence Consumer Use Classification

on:
  pull_request:
    paths:
      - 'proof/Phil/Surface/BranchEvidenceSupport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v'
      - 'proof/Phil/Assurance/EvidenceConsumerSelectionCoverage.v'
      - 'proof/Phil/Assurance/EvidenceConsumerUseClassification.v'
      - 'docs/phase-1/audit-evidence-consumer-use-classification-v1.md'
      - '.github/workflows/phase1-audit-evidence-consumer-use-classification.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Surface/BranchEvidenceSupport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v'
      - 'proof/Phil/Assurance/EvidenceConsumerSelectionCoverage.v'
      - 'proof/Phil/Assurance/EvidenceConsumerUseClassification.v'
      - 'docs/phase-1/audit-evidence-consumer-use-classification-v1.md'
      - '.github/workflows/phase1-audit-evidence-consumer-use-classification.yml'

permissions:
  contents: read

jobs:
  evidence-consumer-use-classification:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile evidence-use classification correspondence proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/BranchEvidenceSupport.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceConsumerSelectionCoverage.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceConsumerUseClassification.v
      - name: Record exact proof identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-consumer-use-classification
          cp \
            proof/Phil/Surface/BranchEvidenceSupport.v \
            proof/Phil/Surface/BranchEvidenceSupport.vo \
            proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v \
            proof/Phil/Assurance/EvidenceConsumerSubjectTransport.vo \
            proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v \
            proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.vo \
            proof/Phil/Assurance/EvidenceConsumerSelectionCoverage.v \
            proof/Phil/Assurance/EvidenceConsumerSelectionCoverage.vo \
            proof/Phil/Assurance/EvidenceConsumerUseClassification.v \
            proof/Phil/Assurance/EvidenceConsumerUseClassification.vo \
            evidence-consumer-use-classification/
          sha256sum \
            evidence-consumer-use-classification/BranchEvidenceSupport.v \
            evidence-consumer-use-classification/BranchEvidenceSupport.vo \
            evidence-consumer-use-classification/EvidenceConsumerSubjectTransport.v \
            evidence-consumer-use-classification/EvidenceConsumerSubjectTransport.vo \
            evidence-consumer-use-classification/EvidenceConsumerEndpointCoverage.v \
            evidence-consumer-use-classification/EvidenceConsumerEndpointCoverage.vo \
            evidence-consumer-use-classification/EvidenceConsumerSelectionCoverage.v \
            evidence-consumer-use-classification/EvidenceConsumerSelectionCoverage.vo \
            evidence-consumer-use-classification/EvidenceConsumerUseClassification.v \
            evidence-consumer-use-classification/EvidenceConsumerUseClassification.vo \
            > evidence-consumer-use-classification/D-RES-SUPPORT-01.use-classification.proof.sha256
          cat evidence-consumer-use-classification/D-RES-SUPPORT-01.use-classification.proof.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-consumer-use-classification-proof
          path: evidence-consumer-use-classification
          if-no-files-found: error
