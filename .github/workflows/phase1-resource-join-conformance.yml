name: Phase 1 Resource Join Conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  resource-join-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build
        run: cabal build all --enable-tests

      - name: RES-005 branch-local linear leak conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1BranchLocalLinearLeakMain.hs

      - name: RES-006 affine branch asymmetry conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1AffineBranchAsymmetryMain.hs

      - name: RES-007 scoped loan boundary conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ScopedLoanBoundaryMain.hs

      - name: RES-008 terminal arm exclusion conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1TerminalArmExclusionMain.hs

      - name: RES-009 loop state projection conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1LoopStateProjectionMain.hs

      - name: RES-010 propositional state transport conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1PropositionalStateTransportMain.hs

      - name: RES-011 obligation reconvergence conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ObligationReconvergenceMain.hs

      - name: RES-012 checked binding mode conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CheckedBindingModeMain.hs

      - name: RES-013 join and loop logical invariant conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1JoinLoopInvariantMain.hs
