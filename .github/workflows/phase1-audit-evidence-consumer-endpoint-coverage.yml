name: Phase 1 Audit Evidence Consumer Endpoint Coverage

on:
  pull_request:
    paths:
      - 'proof/Phil/Surface/BranchEvidenceSupport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v'
      - 'docs/phase-1/audit-evidence-consumer-endpoint-coverage-v1.md'
      - '.github/workflows/phase1-audit-evidence-consumer-endpoint-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Surface/BranchEvidenceSupport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v'
      - 'proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v'
      - 'docs/phase-1/audit-evidence-consumer-endpoint-coverage-v1.md'
      - '.github/workflows/phase1-audit-evidence-consumer-endpoint-coverage.yml'

permissions:
  contents: read

jobs:
  evidence-consumer-endpoint-coverage:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile subject transport and endpoint coverage proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/BranchEvidenceSupport.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v
      - name: Record exact proof identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-consumer-endpoint-coverage
          cp \
            proof/Phil/Surface/BranchEvidenceSupport.v \
            proof/Phil/Surface/BranchEvidenceSupport.vo \
            proof/Phil/Assurance/EvidenceConsumerSubjectTransport.v \
            proof/Phil/Assurance/EvidenceConsumerSubjectTransport.vo \
            proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.v \
            proof/Phil/Assurance/EvidenceConsumerEndpointCoverage.vo \
            evidence-consumer-endpoint-coverage/
          sha256sum \
            evidence-consumer-endpoint-coverage/BranchEvidenceSupport.v \
            evidence-consumer-endpoint-coverage/BranchEvidenceSupport.vo \
            evidence-consumer-endpoint-coverage/EvidenceConsumerSubjectTransport.v \
            evidence-consumer-endpoint-coverage/EvidenceConsumerSubjectTransport.vo \
            evidence-consumer-endpoint-coverage/EvidenceConsumerEndpointCoverage.v \
            evidence-consumer-endpoint-coverage/EvidenceConsumerEndpointCoverage.vo \
            > evidence-consumer-endpoint-coverage/D-RES-SUPPORT-01.consumer-endpoint-coverage.proof.sha256
          cat evidence-consumer-endpoint-coverage/D-RES-SUPPORT-01.consumer-endpoint-coverage.proof.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-consumer-endpoint-coverage-proof
          path: evidence-consumer-endpoint-coverage
          if-no-files-found: error
