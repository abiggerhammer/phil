name: Local Runtime Choice Edit

on:
  pull_request:
    paths:
      - '.github/workflows/local-runtime-choice-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: systems-local-runtime-choice
          fetch-depth: 0
      - name: Apply shared Systems and LLVM edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          ir = 'src/Phil/Systems/IR.hs'
          replace_once(ir,
              '''  , SystemsChoiceArm (..)\n  , SystemsTerminator (..)\n''',
              '''  , SystemsChoiceArm (..)\n  , SystemsRuntimeChoiceArm (..)\n  , SystemsTerminator (..)\n''')
          replace_once(ir,
              '''data SystemsChoiceArm = SystemsChoiceArm\n  { choiceArmPayloadBinding :: Maybe ValueId\n  , choiceArmTarget :: BlockId\n  }\n  deriving (Eq, Ord, Show)\n\ndata SystemsTerminator\n''',
              '''data SystemsChoiceArm = SystemsChoiceArm\n  { choiceArmPayloadBinding :: Maybe ValueId\n  , choiceArmTarget :: BlockId\n  }\n  deriving (Eq, Ord, Show)\n\ndata SystemsRuntimeChoiceArm = SystemsRuntimeChoiceArm\n  { runtimeChoiceArmPayloadBinding :: Maybe ValueId\n  , runtimeChoiceArmTarget :: BlockId\n  }\n  deriving (Eq, Ord, Show)\n\ndata SystemsTerminator\n''')
          replace_once(ir,
              '''  | TermSessionOffer\n      { sessionOfferTransport :: ValueId\n      , sessionOfferArms :: Map Text SystemsChoiceArm\n      }\n  | TermReturnScalar ValueId\n''',
              '''  | TermSessionOffer\n      { sessionOfferTransport :: ValueId\n      , sessionOfferArms :: Map Text SystemsChoiceArm\n      }\n  | TermRuntimeChoice\n      { runtimeChoiceName :: Text\n      , runtimeChoiceInputs :: [ValueId]\n      , runtimeChoiceSite :: Maybe RuntimeSiteRef\n      , runtimeChoiceArms :: Map Text SystemsRuntimeChoiceArm\n      }\n  | TermReturnScalar ValueId\n''')
          replace_once(ir,
              '''  TermSessionOffer { sessionOfferArms = arms } ->\n    map (choiceArmTarget . snd) (Map.toAscList arms)\n  TermReturnScalar _ -> []\n''',
              '''  TermSessionOffer { sessionOfferArms = arms } ->\n    map (choiceArmTarget . snd) (Map.toAscList arms)\n  TermRuntimeChoice { runtimeChoiceArms = arms } ->\n    map (runtimeChoiceArmTarget . snd) (Map.toAscList arms)\n  TermReturnScalar _ -> []\n''')
          replace_once(ir,
              '''      TermStore { storeSite = site } -> [site]\n      _ -> []\n''',
              '''      TermStore { storeSite = site } -> [site]\n      TermRuntimeChoice { runtimeChoiceSite = Just site } -> [site]\n      _ -> []\n''')
          replace_once(ir,
              '''  TermSessionOffer transport arms -> tag "session-offer"\n    [unValueId transport, renderList renderChoiceArm (Map.toAscList arms)]\n  TermReturnScalar value -> tag "return-scalar" [unValueId value]\n''',
              '''  TermSessionOffer transport arms -> tag "session-offer"\n    [unValueId transport, renderList renderChoiceArm (Map.toAscList arms)]\n  TermRuntimeChoice name inputs site arms -> tag "runtime-choice"\n    [ name\n    , renderList unValueId inputs\n    , maybe "none" renderRuntimeSite site\n    , renderList renderRuntimeChoiceArm (Map.toAscList arms)\n    ]\n  TermReturnScalar value -> tag "return-scalar" [unValueId value]\n''')
          replace_once(ir,
              '''renderChoiceArm (label, arm) = Text.intercalate ";"\n  [ field "label" label\n  , field "payload" (maybe "none" unValueId (choiceArmPayloadBinding arm))\n  , field "target" (unBlockId (choiceArmTarget arm))\n  ]\n\nrenderLoweringAction''',
              '''renderChoiceArm (label, arm) = Text.intercalate ";"\n  [ field "label" label\n  , field "payload" (maybe "none" unValueId (choiceArmPayloadBinding arm))\n  , field "target" (unBlockId (choiceArmTarget arm))\n  ]\n\nrenderRuntimeChoiceArm :: (Text, SystemsRuntimeChoiceArm) -> Text\nrenderRuntimeChoiceArm (label, arm) = Text.intercalate ";"\n  [ field "label" label\n  , field "payload" (maybe "none" unValueId (runtimeChoiceArmPayloadBinding arm))\n  , field "target" (unBlockId (runtimeChoiceArmTarget arm))\n  ]\n\nrenderLoweringAction''')

          verify = 'src/Phil/Systems/Verify.hs'
          replace_once(verify,
              '''  | SessionSelectPayloadMissing Text BlockId Text ValueId\n  | CopyWithoutCopyDecision Text BlockId DecisionId\n''',
              '''  | SessionSelectPayloadMissing Text BlockId Text ValueId\n  | RuntimeChoiceEmptyName Text BlockId\n  | RuntimeChoiceInputMissing Text BlockId ValueId\n  | RuntimeChoiceEmptyArms Text BlockId\n  | RuntimeChoiceEmptyLabel Text BlockId\n  | RuntimeChoicePayloadMissing Text BlockId Text ValueId\n  | RuntimeChoicePayloadTargetNotDedicated Text BlockId Text BlockId [BlockId]\n  | CopyWithoutCopyDecision Text BlockId DecisionId\n''')
          replace_once(verify,
              '''    TermSessionOffer transport arms -> do\n      case Map.lookup transport (systemsFunctionValues function) of\n''',
              '''    TermRuntimeChoice name inputs _ arms -> do\n      when (Text.null name) $\n        Left (RuntimeChoiceEmptyName functionKey blockKey)\n      forM_ inputs $ \\input ->\n        unless (Map.member input (systemsFunctionValues function)) $\n          Left (RuntimeChoiceInputMissing functionKey blockKey input)\n      when (Map.null arms) $\n        Left (RuntimeChoiceEmptyArms functionKey blockKey)\n      forM_ (Map.toAscList arms) $ \\(label, arm) -> do\n        when (Text.null label) $\n          Left (RuntimeChoiceEmptyLabel functionKey blockKey)\n        case runtimeChoiceArmPayloadBinding arm of\n          Nothing -> pure ()\n          Just payload -> do\n            unless (Map.member payload (systemsFunctionValues function)) $\n              Left (RuntimeChoicePayloadMissing functionKey blockKey label payload)\n            let target = runtimeChoiceArmTarget arm\n                predecessors = predecessorsOf function target\n            unless (predecessors == [blockKey]) $\n              Left (RuntimeChoicePayloadTargetNotDedicated\n                functionKey blockKey label target predecessors)\n    TermSessionOffer transport arms -> do\n      case Map.lookup transport (systemsFunctionValues function) of\n''')

          dataflow = 'src/Phil/Systems/Dataflow.hs'
          replace_once(dataflow,
              '''collectDefinitions function typedScalars = Map.fromListWith (<>)\n  [ (valueId, [ScalarSite (systemsBlockId blockValue) operationIndex])\n  | blockValue <- Map.elems (systemsFunctionBlocks function)\n  , (operationIndex, operation) <- zip [0 ..] (systemsBlockOps blockValue)\n  , valueId <- operationDefinitions operation\n  , Set.member valueId typedScalars\n  ]\n''',
              '''collectDefinitions function typedScalars = Map.fromListWith (<>)\n  ( operationSites <> branchSites )\n  where\n    operationSites =\n      [ (valueId, [ScalarSite (systemsBlockId blockValue) operationIndex])\n      | blockValue <- Map.elems (systemsFunctionBlocks function)\n      , (operationIndex, operation) <- zip [0 ..] (systemsBlockOps blockValue)\n      , valueId <- operationDefinitions operation\n      , Set.member valueId typedScalars\n      ]\n    branchSites = concatMap branchDefinitions (Map.elems (systemsFunctionBlocks function))\n    branchDefinitions blockValue = case systemsBlockTerminator blockValue of\n      TermRuntimeChoice { runtimeChoiceArms = arms } ->\n        [ (valueId, [ScalarSite (runtimeChoiceArmTarget arm) (-1)])\n        | arm <- Map.elems arms\n        , Just valueId <- [runtimeChoiceArmPayloadBinding arm]\n        , Set.member valueId typedScalars\n        ]\n      TermSessionOffer { sessionOfferArms = arms } ->\n        [ (valueId, [ScalarSite (choiceArmTarget arm) (-1)])\n        | arm <- Map.elems arms\n        , Just valueId <- [choiceArmPayloadBinding arm]\n        , Set.member valueId typedScalars\n        ]\n      _ -> []\n''')
          replace_once(dataflow,
              '''  TermReceiveExact { exactLength = lengthValue } -> [lengthValue]\n  TermReturnScalar valueId -> [valueId]\n''',
              '''  TermReceiveExact { exactLength = lengthValue } -> [lengthValue]\n  TermRuntimeChoice { runtimeChoiceInputs = inputs } -> inputs\n  TermReturnScalar valueId -> [valueId]\n''')

          lower = 'src/Phil/LLVM/Lower.hs'
          replace_once(lower,
              '''  TermSessionOffer {} -> LLVMUnreachable Nothing\n  TermReturnScalar valueId ->\n''',
              '''  TermSessionOffer {} -> LLVMUnreachable Nothing\n  TermRuntimeChoice {} -> LLVMUnreachable Nothing\n  TermReturnScalar valueId ->\n''')

          systems = 'src/Phil/Systems.hs'
          replace_once(systems,
              '''  , module Phil.Systems.PayloadCancelChoice\n  ) where\n''',
              '''  , module Phil.Systems.PayloadCancelChoice\n  , module Phil.Systems.LocalRuntimeChoice\n  ) where\n''')
          replace_once(systems,
              '''import Phil.Systems.IR\nimport Phil.Systems.Phase0\nimport Phil.Systems.PayloadCancelChoice\n''',
              '''import Phil.Systems.IR\nimport Phil.Systems.LocalRuntimeChoice\nimport Phil.Systems.Phase0\nimport Phil.Systems.PayloadCancelChoice\n''')

          cabal = 'phil-core.cabal'
          replace_once(cabal,
              '''      Phil.Systems.SessionChoice\n      Phil.Systems.PayloadCancelChoice\n      Phil.LLVM.IR\n''',
              '''      Phil.Systems.SessionChoice\n      Phil.Systems.PayloadCancelChoice\n      Phil.Systems.LocalRuntimeChoice\n      Phil.LLVM.IR\n''')
          replace_once(cabal,
              '''test-suite phil-payload-cancel-choice-abi-tests\n  import:             common-settings\n''',
              '''test-suite phil-local-runtime-choice-tests\n  import:             common-settings\n  type:               exitcode-stdio-1.0\n  hs-source-dirs:     test\n  main-is:            LocalRuntimeChoiceMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      containers >=0.6 && <0.8,\n      phil-core,\n      text >=2.0 && <2.2\n\ntest-suite phil-payload-cancel-choice-abi-tests\n  import:             common-settings\n''')
          PY
          git diff --check
          git config user.name "phil-local-choice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Phil/Systems/IR.hs src/Phil/Systems/Verify.hs src/Phil/Systems/Dataflow.hs src/Phil/LLVM/Lower.hs src/Phil/Systems.hs phil-core.cabal
          git commit -m "Wire branch-local local runtime choice through Systems"
          git push origin HEAD:systems-local-runtime-choice
