name: Phase 1 Assurance Handoff Manifest Closure

on:
  pull_request:
    paths:
      - 'src/Phil/Assurance/Handoff.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'test/AssuranceHandoffManifestClosureMain.hs'
      - 'docs/phase-1/audit-prerequisite-support-handoff-v1.md'
      - '.github/workflows/phase1-assurance-handoff-manifest-closure.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Assurance/Handoff.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'test/AssuranceHandoffManifestClosureMain.hs'
      - 'docs/phase-1/audit-prerequisite-support-handoff-v1.md'
      - '.github/workflows/phase1-assurance-handoff-manifest-closure.yml'

permissions:
  contents: read

jobs:
  handoff-manifest-closure-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck handoff manifest closure
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Verification/ManifestClosure.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/AssuranceHandoffManifestClosureMain.hs

      - name: Replay handoff-to-manifest correspondence controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/AssuranceHandoffManifestClosureMain.hs
