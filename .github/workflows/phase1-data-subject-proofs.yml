name: Phase 1 Data Subject Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/DataSubject.v'
      - 'proof/Phil/Core/DataSubjectImplementation.v'
      - 'proof/Phil/Core/DataSubjectImplementationExtraction.v'
      - 'docs/phase-1/data-subject-proof-v1.md'
      - 'docs/phase-1/data-subject-implementation-refinement-v1.md'
      - 'docs/phase-1/data-subject-production-binding-v1.md'
      - 'app/DataSubjectDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-data-subject-proofs.yml'
      - 'src/DataSubjectKernel.hs'
      - 'src/Phil/Core/DataSubjectTransport.hs'
      - 'test/Phase1DataSubjectTransportMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/DataSubject.v'
      - 'proof/Phil/Core/DataSubjectImplementation.v'
      - 'proof/Phil/Core/DataSubjectImplementationExtraction.v'
      - 'docs/phase-1/data-subject-proof-v1.md'
      - 'docs/phase-1/data-subject-implementation-refinement-v1.md'
      - 'docs/phase-1/data-subject-production-binding-v1.md'
      - 'app/DataSubjectDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-data-subject-proofs.yml'
      - 'src/DataSubjectKernel.hs'
      - 'src/Phil/Core/DataSubjectTransport.hs'
      - 'test/Phase1DataSubjectTransportMain.hs'

permissions:
  contents: read

jobs:
  rocq-data-subject-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-DATA-SUBJECT-001 proof and exact production kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataSubject.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataSubjectImplementation.v
          rm -f DataSubjectKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataSubjectImplementationExtraction.v
          test -s DataSubjectKernel.hs
          grep -q 'decideDataSubjectPrerequisites' DataSubjectKernel.hs
          grep -q 'decideDataSubjectTransportMode' DataSubjectKernel.hs
          grep -q 'decideDataSubjectTransport' DataSubjectKernel.hs
          cmp DataSubjectKernel.hs src/DataSubjectKernel.hs
          test "$(sha256sum DataSubjectKernel.hs | cut -d' ' -f1)" = \
            'b4b03eaab273225b39e50f080ff01fbafd82644b03aebd44f2589742161f424a'

      - name: Record proof and production-kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data-subject-proof
          cp \
            proof/Phil/Core/DataSubject.v \
            proof/Phil/Core/DataSubject.vo \
            proof/Phil/Core/DataSubjectImplementation.v \
            proof/Phil/Core/DataSubjectImplementation.vo \
            proof/Phil/Core/DataSubjectImplementationExtraction.v \
            proof/Phil/Core/DataSubjectImplementationExtraction.vo \
            DataSubjectKernel.hs \
            data-subject-proof/
          sha256sum \
            data-subject-proof/DataSubject.v \
            data-subject-proof/DataSubject.vo \
            data-subject-proof/DataSubjectImplementation.v \
            data-subject-proof/DataSubjectImplementation.vo \
            data-subject-proof/DataSubjectKernel.hs \
            > data-subject-proof/PHIL-DATA-SUBJECT-001.proof.sha256
          {
            echo 'obligation=PHIL-DATA-SUBJECT-001'
            echo 'evidence=Rocq-9.2.0-production-binding'
            cat data-subject-proof/PHIL-DATA-SUBJECT-001.proof.sha256
          } > data-subject-proof/PHIL-DATA-SUBJECT-001.proof-certificate.txt
          cat data-subject-proof/PHIL-DATA-SUBJECT-001.proof-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-data-subject-production-binding
          path: data-subject-proof
          if-no-files-found: error

  verify-data-subject-correspondence:
    needs: rocq-data-subject-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - uses: actions/download-artifact@v4
        with:
          name: rocq-data-subject-production-binding
          path: data-subject-proof

      - name: Verify exact extracted production kernel and direct controls
        run: |
          set -euo pipefail
          cmp data-subject-proof/DataSubjectKernel.hs src/DataSubjectKernel.hs
          test "$(sha256sum src/DataSubjectKernel.hs | cut -d' ' -f1)" = \
            'b4b03eaab273225b39e50f080ff01fbafd82644b03aebd44f2589742161f424a'
          ghc -Wall -Werror -fno-code data-subject-proof/DataSubjectKernel.hs
          ghc -Wall -Werror -fno-code src/DataSubjectKernel.hs
          ghc -Wall -Werror \
            -isrc \
            app/DataSubjectDecisionCorrespondenceMain.hs \
            -o data-subject-kernel-controls
          ./data-subject-kernel-controls

      - name: Typecheck bound DATA-012 implementation and corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/DataSubjectTransport.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1DataSubjectTransportMain.hs

      - name: Re-run unchanged DATA-012 19-case correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataSubjectTransportMain.hs

      - name: Record implementation-refinement production-binding identities
        run: |
          set -euo pipefail
          mkdir -p data-subject-production-binding
          sha256sum \
            src/DataSubjectKernel.hs \
            src/Phil/Core/DataSubjectTransport.hs \
            test/Phase1DataSubjectTransportMain.hs \
            app/DataSubjectDecisionCorrespondenceMain.hs \
            proof/Phil/Core/DataSubjectImplementation.v \
            docs/phase-1/data-subject-implementation-refinement-v1.md \
            docs/phase-1/data-subject-production-binding-v1.md \
            > data-subject-production-binding/PHIL-DATA-SUBJECT-001.closeout.sha256
          cat data-subject-production-binding/PHIL-DATA-SUBJECT-001.closeout.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: data-subject-production-binding
          path: data-subject-production-binding
          if-no-files-found: error
