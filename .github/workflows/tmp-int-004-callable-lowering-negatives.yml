name: Temporary INT-004 Callable Lowering Negatives

on:
  push:
    branches: [phase1-int-004-callable-lowering-negatives]
    paths:
      - 'test/fixtures/phase1-negative/callable-lowering-v1/**'
      - 'test/Phase1INT004PortableCallableLoweringNegativeMain.hs'
      - '.github/workflows/tmp-int-004-callable-lowering-negatives.yml'

jobs:
  portable-callable-lowering-negatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck portable CALL-016 replay
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1INT004PortableCallableLoweringNegativeMain.hs

      - name: Replay portable CALL-016 negatives
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT004PortableCallableLoweringNegativeMain.hs

      - name: Guard portable data against Haskell-private authority
        run: |
          if grep -R -n -E 'CallableLowering[A-Z]|Phil\.Systems|CodePointerEnvironment|\.hs' \
              test/fixtures/phase1-negative/callable-lowering-v1/*.tsv; then
            echo 'portable CALL-016 TSV contains implementation-private identity' >&2
            exit 1
          fi

      - name: Reject unknown projection vocabulary
        run: |
          cp test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv /tmp/projection.tsv
          sed -i '0,/mismatch/s//not-a-relation/' test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLoweringNegativeMain.hs >/tmp/int004-call016.log 2>&1; then
            cat /tmp/int004-call016.log
            echo 'unknown CALL-016 projection vocabulary unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/projection.tsv test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv

      - name: Reject missing projection row
        run: |
          cp test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv /tmp/projection.tsv
          sed -i '/P1-NEG-CALL-016-016/d' test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLoweringNegativeMain.hs >/tmp/int004-call016.log 2>&1; then
            cat /tmp/int004-call016.log
            echo 'missing CALL-016 projection row unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/projection.tsv test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv

      - name: Reject earlier unrelated coordinate mismatch
        run: |
          cp test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv /tmp/projection.tsv
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv')
          rows = [line.split('\t') for line in p.read_text().splitlines()]
          for row in rows:
              if row[0] == 'P1-NEG-CALL-016-016':
                  row[1] = 'mismatch'
          p.write_text('\n'.join('\t'.join(row) for row in rows) + '\n')
          PY
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLoweringNegativeMain.hs >/tmp/int004-call016.log 2>&1; then
            cat /tmp/int004-call016.log
            echo 'earlier contract mismatch unexpectedly counted as cost-accounting rejection' >&2
            exit 1
          fi
          mv /tmp/projection.tsv test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv

      - name: Reject malformed multi-mismatch portable fixture
        run: |
          cp test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv /tmp/projection.tsv
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv')
          rows = [line.split('\t') for line in p.read_text().splitlines()]
          for row in rows:
              if row[0] == 'P1-NEG-CALL-016-002':
                  row[1] = 'mismatch'
          p.write_text('\n'.join('\t'.join(row) for row in rows) + '\n')
          PY
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLoweringNegativeMain.hs >/tmp/int004-call016.log 2>&1; then
            cat /tmp/int004-call016.log
            echo 'multi-mismatch portable fixture unexpectedly accepted as canonical' >&2
            exit 1
          fi
          mv /tmp/projection.tsv test/fixtures/phase1-negative/callable-lowering-v1/projection-v1.tsv

      - name: Reject unknown authority
        run: |
          cp test/fixtures/phase1-negative/callable-lowering-v1/manifest.tsv /tmp/manifest.tsv
          sed -i '0,/matrix:CALL-016/s//matrix:NOT-A-CASE/' test/fixtures/phase1-negative/callable-lowering-v1/manifest.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLoweringNegativeMain.hs >/tmp/int004-call016.log 2>&1; then
            cat /tmp/int004-call016.log
            echo 'unknown authority unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/manifest.tsv test/fixtures/phase1-negative/callable-lowering-v1/manifest.tsv

      - name: Reject missing Certified proof artifact
        run: |
          cp test/fixtures/phase1-negative/callable-lowering-v1/authority-registry-v1.tsv /tmp/authority.tsv
          sed -i '0,/proof\/Phil\/Core\/CallableLowering.v/s//proof\/Phil\/Core\/DefinitelyMissing.v/' \
            test/fixtures/phase1-negative/callable-lowering-v1/authority-registry-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLoweringNegativeMain.hs >/tmp/int004-call016.log 2>&1; then
            cat /tmp/int004-call016.log
            echo 'missing Certified CALL-016 proof unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/authority.tsv test/fixtures/phase1-negative/callable-lowering-v1/authority-registry-v1.tsv

      - name: Replay restored portable CALL-016 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLoweringNegativeMain.hs

      - name: Replay legacy CALL-016 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1CallableLoweringMain.hs

      - name: Replay prior portable Phase-1 corpora
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableStructuralModeNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableScopeNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableRefinementNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs

      - name: Replay frozen INT-004 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableNegativeManifestMain.hs
