name: Temporary INT-004 Callable Lifecycle Negatives

on:
  push:
    branches: [phase1-int-004-callable-lifecycle-negatives]
    paths:
      - 'test/fixtures/phase1-negative/callable-lifecycle-v1/**'
      - 'test/Phase1INT004PortableCallableLifecycleNegativeMain.hs'
      - '.github/workflows/tmp-int-004-callable-lifecycle-negatives.yml'

jobs:
  portable-callable-lifecycle-negatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck portable callable lifecycle replay
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1INT004PortableCallableLifecycleNegativeMain.hs

      - name: Replay portable callable lifecycle negatives
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT004PortableCallableLifecycleNegativeMain.hs

      - name: Guard portable data against Haskell-private authority
        run: |
          if grep -R -n -E 'PreserveCalleeRestrictedStateMismatch|PreserveCalleeProducedSuccessor|ConsumeCalleeProducedSuccessor|ReplaceCallee|UnavailableCallableOccurrence|Phil\.Core|\.hs' \
              test/fixtures/phase1-negative/callable-lifecycle-v1/*.tsv; then
            echo 'portable callable-lifecycle TSV contains implementation-private identity' >&2
            exit 1
          fi

      - name: Reject unknown transition vocabulary
        run: |
          cp test/fixtures/phase1-negative/callable-lifecycle-v1/occurrences-v1.tsv /tmp/occurrences.tsv
          sed -i '0,/preserve/s//not-a-transition/' test/fixtures/phase1-negative/callable-lifecycle-v1/occurrences-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs >/tmp/int004-call.log 2>&1; then
            cat /tmp/int004-call.log
            echo 'unknown transition unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/occurrences.tsv test/fixtures/phase1-negative/callable-lifecycle-v1/occurrences-v1.tsv

      - name: Reject unknown capture mode
        run: |
          cp test/fixtures/phase1-negative/callable-lifecycle-v1/captures-v1.tsv /tmp/captures.tsv
          sed -i '0,/linear/s//not-a-mode/' test/fixtures/phase1-negative/callable-lifecycle-v1/captures-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs >/tmp/int004-call.log 2>&1; then
            cat /tmp/int004-call.log
            echo 'unknown capture mode unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/captures.tsv test/fixtures/phase1-negative/callable-lifecycle-v1/captures-v1.tsv

      - name: Reject missing successor definition
        run: |
          cp test/fixtures/phase1-negative/callable-lifecycle-v1/actions-v1.tsv /tmp/actions.tsv
          sed -i '0,/succ/s//missing-successor/' test/fixtures/phase1-negative/callable-lifecycle-v1/actions-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs >/tmp/int004-call.log 2>&1; then
            cat /tmp/int004-call.log
            echo 'missing successor definition unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/actions.tsv test/fixtures/phase1-negative/callable-lifecycle-v1/actions-v1.tsv

      - name: Reject noncontiguous action trace
        run: |
          cp test/fixtures/phase1-negative/callable-lifecycle-v1/actions-v1.tsv /tmp/actions.tsv
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/fixtures/phase1-negative/callable-lifecycle-v1/actions-v1.tsv')
          rows = p.read_text().splitlines()
          for i, row in enumerate(rows):
              cols = row.split('\t')
              if cols[0] == 'P1-NEG-CALL-008-001' and cols[1] == '2':
                  cols[1] = '3'
                  rows[i] = '\t'.join(cols)
                  break
          p.write_text('\n'.join(rows) + '\n')
          PY
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs >/tmp/int004-call.log 2>&1; then
            cat /tmp/int004-call.log
            echo 'noncontiguous action trace unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/actions.tsv test/fixtures/phase1-negative/callable-lifecycle-v1/actions-v1.tsv

      - name: Reject unknown authority
        run: |
          cp test/fixtures/phase1-negative/callable-lifecycle-v1/manifest.tsv /tmp/manifest.tsv
          sed -i '0,/matrix:CALL-007/s//matrix:NOT-A-CASE/' test/fixtures/phase1-negative/callable-lifecycle-v1/manifest.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs >/tmp/int004-call.log 2>&1; then
            cat /tmp/int004-call.log
            echo 'unknown authority unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/manifest.tsv test/fixtures/phase1-negative/callable-lifecycle-v1/manifest.tsv

      - name: Reject missing Certified proof artifact
        run: |
          cp test/fixtures/phase1-negative/callable-lifecycle-v1/authority-registry-v1.tsv /tmp/authority.tsv
          sed -i '0,/proof\/Phil\/Core\/CallableLifecycle.v/s//proof\/Phil\/Core\/DefinitelyMissing.v/' \
            test/fixtures/phase1-negative/callable-lifecycle-v1/authority-registry-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs >/tmp/int004-call.log 2>&1; then
            cat /tmp/int004-call.log
            echo 'missing Certified proof unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/authority.tsv test/fixtures/phase1-negative/callable-lifecycle-v1/authority-registry-v1.tsv

      - name: Replay restored portable callable lifecycle corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs

      - name: Replay legacy callable lifecycle corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1CallableTransitionsMain.hs

      - name: Replay prior portable generic corpora
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs

      - name: Replay frozen INT-004 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableNegativeManifestMain.hs
