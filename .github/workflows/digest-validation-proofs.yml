name: Digest Validation Proofs

on:
  pull_request:
    paths:
      - 'proof/**'
      - 'src/Phil/Assurance/**'
      - 'src/Phil/Assurance.hs'
      - 'src/Phil/LLVM/DigestValidationProofCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/RocqScalarCertificationMain.hs'
      - 'app/DigestValidationProofCertificationMain.hs'
      - 'test/RocqCertificationMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/digest-validation-proofs.yml'
  push:
    branches:
      - main
    paths:
      - 'proof/**'
      - 'src/Phil/Assurance/**'
      - 'src/Phil/Assurance.hs'
      - 'src/Phil/LLVM/DigestValidationProofCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/RocqScalarCertificationMain.hs'
      - 'app/DigestValidationProofCertificationMain.hs'
      - 'test/RocqCertificationMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/digest-validation-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-digest-validation:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check complete proof corpus including digest validation
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Session.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Process.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionLabel.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionStep.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Recognition.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RecognitionLoan.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessTerminal.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Discharge.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DecisionSound.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionRec.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Focusing.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Elaboration.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Checking.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/ScopeJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/FreshOwnership.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SystemsProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/Manifest.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceUse.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Ownership.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Runtime.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/ScalarDataflow.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/RecognizedRecord.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/DigestValidation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Preservation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Strengthening.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Certification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordABI.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RuntimeSymbolIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceive.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceiveCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/DigestValidation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/DigestValidationCertification.v

      - name: Stage exact checked proof objects
        run: |
          mkdir -p rocq-digest/systems-digest-validation
          mkdir -p rocq-digest/llvm-digest-validation
          mkdir -p rocq-digest/systems-recognized-record
          mkdir -p rocq-digest/llvm-exact-receive
          mkdir -p rocq-digest/llvm-recognized-record-abi
          mkdir -p rocq-digest/llvm-runtime-symbol-identity
          cp proof/Phil/Systems/DigestValidation.v rocq-digest/systems-digest-validation/DigestValidation.v
          cp proof/Phil/Systems/DigestValidation.vo rocq-digest/systems-digest-validation/DigestValidation.vo
          cp proof/Phil/LLVM/DigestValidation.v rocq-digest/llvm-digest-validation/DigestValidation.v
          cp proof/Phil/LLVM/DigestValidation.vo rocq-digest/llvm-digest-validation/DigestValidation.vo
          cp proof/Phil/Systems/RecognizedRecord.v rocq-digest/systems-recognized-record/RecognizedRecord.v
          cp proof/Phil/Systems/RecognizedRecord.vo rocq-digest/systems-recognized-record/RecognizedRecord.vo
          cp proof/Phil/LLVM/ExactReceive.v rocq-digest/llvm-exact-receive/ExactReceive.v
          cp proof/Phil/LLVM/ExactReceive.vo rocq-digest/llvm-exact-receive/ExactReceive.vo
          cp proof/Phil/LLVM/RecognizedRecordABI.v rocq-digest/llvm-recognized-record-abi/RecognizedRecordABI.v
          cp proof/Phil/LLVM/RecognizedRecordABI.vo rocq-digest/llvm-recognized-record-abi/RecognizedRecordABI.vo
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.v rocq-digest/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.vo rocq-digest/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo

      - name: Upload exact checked proof objects
        uses: actions/upload-artifact@v4
        with:
          name: rocq-digest-validation-checked-proof-objects
          path: rocq-digest/
          if-no-files-found: error
          retention-days: 14

  certify-digest-validation:
    needs: rocq-digest-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Download exact checked proof objects
        uses: actions/download-artifact@v4
        with:
          name: rocq-digest-validation-checked-proof-objects
          path: rocq-digest

      - name: Build proof-bound digest-validation certifier
        run: cabal build phil-certify-digest-validation

      - name: Produce digest proof and final certificates
        run: |
          mkdir -p digest-validation-certificates
          CERTIFIER="$(cabal list-bin phil-certify-digest-validation)"
          "$CERTIFIER" \
            rocq-digest/systems-digest-validation/DigestValidation.v \
            rocq-digest/systems-digest-validation/DigestValidation.vo \
            rocq-digest/llvm-digest-validation/DigestValidation.v \
            rocq-digest/llvm-digest-validation/DigestValidation.vo \
            rocq-digest/systems-recognized-record/RecognizedRecord.v \
            rocq-digest/systems-recognized-record/RecognizedRecord.vo \
            rocq-digest/llvm-exact-receive/ExactReceive.v \
            rocq-digest/llvm-exact-receive/ExactReceive.vo \
            rocq-digest/llvm-recognized-record-abi/RecognizedRecordABI.v \
            rocq-digest/llvm-recognized-record-abi/RecognizedRecordABI.vo \
            rocq-digest/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v \
            rocq-digest/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo \
            digest-validation-certificates/PHIL-SYS-DIGEST-001.rocq.cert \
            digest-validation-certificates/PHIL-LLVM-DIGEST-001.rocq.cert \
            digest-validation-certificates/PHIL-SYS-RECORD-001.rocq.cert \
            digest-validation-certificates/PHIL-LLVM-EXACT-RECV-001.rocq.cert \
            digest-validation-certificates/PHIL-LLVM-REC-ABI-001.rocq.cert \
            digest-validation-certificates/PHIL-LLVM-RUNTIME-SYM-001.rocq.cert \
            digest-validation-certificates/PHIL-LLVM-CERT-003.cert \
            digest-validation-certificates/PHIL-LLVM-CERT-004.cert
          for certificate in digest-validation-certificates/*; do
            echo "===== ${certificate} ====="
            cat "${certificate}"
            sha256sum "${certificate}"
          done

      - name: Upload digest-validation certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phil-digest-validation-proof-bound-certification
          path: digest-validation-certificates/*
          if-no-files-found: error
          retention-days: 30
