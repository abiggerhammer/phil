name: Phase 1 VER-001 Intrinsic Invalidity

on:
  pull_request:
    paths:
      - 'src/Phil/Verification.hs'
      - 'test/Phase1VerificationIntrinsicInvalidityMain.hs'
      - 'phil-core.cabal'
      - 'examples/upload/*.phil'
      - 'examples/rejected/*.phil'
      - '.github/workflows/phase1-ver-001-intrinsic-invalidity.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Verification.hs'
      - 'test/Phase1VerificationIntrinsicInvalidityMain.hs'
      - 'phil-core.cabal'
      - 'examples/upload/*.phil'
      - 'examples/rejected/*.phil'
      - '.github/workflows/phase1-ver-001-intrinsic-invalidity.yml'

permissions:
  contents: read

jobs:
  ver-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build application verification boundary
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Run VER-001 intrinsic-invalidity regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationIntrinsicInvalidityMain.hs
      - name: Re-run existing surface conformance controls
        run: cabal test phil-surface-conformance-tests
