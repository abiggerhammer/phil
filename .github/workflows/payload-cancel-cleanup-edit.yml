name: Payload Cancel Cleanup Edit

on:
  pull_request:
    paths:
      - '.github/workflows/payload-cancel-cleanup-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: payload-cancel-session-choice
          fetch-depth: 0
      - name: Remove known lint issue
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^import qualified Data.Text as Text$/d' src/Phil/Systems/PayloadCancelChoice.hs
          git diff --check
          git config user.name "phil-payload-cancel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Phil/Systems/PayloadCancelChoice.hs
          git commit -m "Clean payload/cancel candidate imports"
          git push origin HEAD:payload-cancel-session-choice
