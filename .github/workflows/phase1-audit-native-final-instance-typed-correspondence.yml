name: Phase 1 Audit Native Final Instance Typed Correspondence

on:
  pull_request:
    paths:
      - 'src/Phil/Verification/NativeFinalInstanceCorrespondence.hs'
      - 'src/Phil/Verification/SourceManifestBinding.hs'
      - 'test/Phase1INT005CertifiedReleaseEnvelopeMain.hs'
      - 'proof/Phil/Verification/NativeFinalInstanceTypedCorrespondence.v'
      - 'docs/phase-1/audit-native-final-instance-typed-correspondence-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-audit-native-final-instance-typed-correspondence.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Verification/NativeFinalInstanceCorrespondence.hs'
      - 'src/Phil/Verification/SourceManifestBinding.hs'
      - 'test/Phase1INT005CertifiedReleaseEnvelopeMain.hs'
      - 'proof/Phil/Verification/NativeFinalInstanceTypedCorrespondence.v'
      - 'docs/phase-1/audit-native-final-instance-typed-correspondence-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-audit-native-final-instance-typed-correspondence.yml'

permissions:
  contents: read

jobs:
  checked-native-producer-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Strict full Haskell build
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Typecheck the exact native witness and accepted consumers
        run: |
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code src/Phil/Verification/SourceManifestBinding.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code src/Phil/Verification/NativeFinalInstanceCorrespondence.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
      - name: Replay accepted Upload and Steve and adversarial native inputs
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
      - name: Preserve source and stage acceptance
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationSourceArtifactClosureMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1StageClosureMain.hs

  typed-rocq-boundary:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile typed coordinate boundary and existing conditional model
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Verification/NativeFinalInstanceTypedCorrespondence.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/VerificationArtifact.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestStageReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestNativeCoordinateReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestFixedAdapter.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestFixedAdapterCertification.v
          cat >/tmp/NativeFinalInstanceAssumptions.v <<'EOF'
          From Phil.Verification Require Import NativeFinalInstanceTypedCorrespondence FinalManifestFixedAdapterCertification.
          Print Assumptions bound_preserves_exact_native_coordinates.
          Print Assumptions declaration_only_source_cannot_bind_final_authority.
          Print Assumptions checked_instance_token_preserves_existing_consumer_equalities.
          Print Assumptions substituted_source_application_cannot_bind.
          Print Assumptions substituted_manifest_cannot_bind.
          Print Assumptions substituted_stage_closure_cannot_bind.
          Print Assumptions raw_digest_drift_cannot_bind.
          Print Assumptions lowering_root_drift_cannot_bind.
          Print Assumptions absent_stage_instance_premise_blocks_extension.
          Print Assumptions stage_revision_drift_blocks_equality_gate.
          Print Assumptions revision_equality_does_not_discharge_origin_premise.
          Print Assumptions same_revision_does_not_identify_occurrence.
          Print Assumptions native_bound_transports_to_typed_model_equalities.
          Print Assumptions typed_model_equalities_reflect_only_with_injections.
          Print Assumptions noninjective_representation_hides_digest_drift.
          Print Assumptions native_stage_coordinate_equalities_transport.
          Print Assumptions represented_stage_coordinates_reflect_only_with_injections.
          Print Assumptions separate_noninjective_stage_models_hide_common_and_closed_drift.
          Print Assumptions exact_source_assurance_gate_preserves_consumer_identity.
          Print Assumptions different_certified_source_assurance_cannot_bind.
          Print Assumptions equal_source_identity_cannot_override_exact_binding.
          Print Assumptions equal_application_identity_does_not_authenticate_source_assurance.
          Print Assumptions exact_checked_descriptor_retention_preserves_bound.
          Print Assumptions different_checked_descriptor_cannot_bind.
          Print Assumptions equal_descriptor_identity_cannot_override_exact_retention.
          Print Assumptions equal_architecture_identity_does_not_authenticate_descriptor.
          Print Assumptions checked_source_descriptor_reaches_final_witness_exactly.
          Print Assumptions final_witness_substituted_descriptor_cannot_bind.
          Print Assumptions final_witness_identity_projection_cannot_override_exact_descriptor.
          Print Assumptions checked_source_assurance_reaches_final_witness_exactly.
          Print Assumptions substituted_source_witness_cannot_bind.
          Print Assumptions same_source_identity_does_not_override_witness_equality.
          Print Assumptions checked_manifest_reaches_final_witness_exactly.
          Print Assumptions substituted_full_manifest_cannot_bind.
          Print Assumptions equal_manifest_id_cannot_override_full_manifest.
          Print Assumptions accepted_full_stage_closure_reaches_final_witness.
          Print Assumptions substituted_full_stage_closure_cannot_bind.
          Print Assumptions same_closed_revision_cannot_override_full_stage.
          Print Assumptions accepted_certified_release_reaches_final_witness_exactly.
          Print Assumptions substituted_certified_release_cannot_bind.
          Print Assumptions same_stage_and_manifest_id_cannot_override_exact_release.
          Print Assumptions accepted_certified_source_reaches_final_witness_exactly.
          Print Assumptions substituted_certified_source_cannot_bind.
          Print Assumptions same_source_proof_cannot_override_certified_source_envelope.
          Print Assumptions source_envelope_stage_drift_blocks_exact_retention.
          Print Assumptions checked_source_manifest_binding_reaches_final_witness_exactly.
          Print Assumptions substituted_checked_source_manifest_binding_cannot_bind.
          Print Assumptions declaration_only_binding_cannot_replace_checked_instance_token.
          Print Assumptions same_source_and_manifest_cannot_upgrade_declaration_only_binding.
          Print Assumptions exact_manifest_stage_replay_preserves_full_consumers.
          Print Assumptions native_replay_raw_systems_drift_rejected.
          Print Assumptions native_replay_lowering_root_drift_rejected.
          Print Assumptions equal_raw_and_root_cannot_replace_full_manifest.
          Print Assumptions exact_release_stage_preserves_separately_typed_stage_coordinates.
          Print Assumptions exact_accepted_consumer_replay_retains_all_full_objects.
          Print Assumptions same_full_manifest_cannot_replace_checked_producer.
          Print Assumptions same_source_stage_cannot_replace_certified_source_object.
          Print Assumptions same_release_manifest_stage_cannot_replace_trust_different_release.
          Print Assumptions native_raw_digest_wire_injective.
          Print Assumptions native_lowering_root_wire_injective.
          Print Assumptions native_raw_digest_wire_roundtrip.
          Print Assumptions native_lowering_root_wire_roundtrip.
          Print Assumptions native_digest_roles_have_disjoint_wires.
          Print Assumptions native_wrong_role_decoding_fails.
          Print Assumptions native_systems_revision_wire_injective.
          Print Assumptions native_common_revision_wire_injective.
          Print Assumptions native_closed_revision_wire_injective.
          Print Assumptions native_systems_revision_wire_roundtrip.
          Print Assumptions native_common_revision_wire_roundtrip.
          Print Assumptions native_closed_revision_wire_roundtrip.
          Print Assumptions native_revision_role_wires_pairwise_disjoint.
          Print Assumptions native_revision_wrong_role_decoding_fails.
          Print Assumptions native_revision_and_digest_wire_images_disjoint.
          Print Assumptions native_subject_revision_wire_injective.
          Print Assumptions native_instance_revision_wire_injective.
          Print Assumptions native_realization_revision_wire_injective.
          Print Assumptions native_subject_revision_wire_roundtrip.
          Print Assumptions native_instance_revision_wire_roundtrip.
          Print Assumptions native_realization_revision_wire_roundtrip.
          Print Assumptions native_stage_identity_wires_disjoint.
          Print Assumptions native_stage_identity_wrong_role_decoding_fails.
          Print Assumptions native_stage_identity_and_digest_revision_wires_disjoint.
          Print Assumptions native_verifier_profile_text_wire_injective.
          Print Assumptions native_verifier_profile_text_wire_roundtrip.
          Print Assumptions native_verifier_profile_text_wire_disjoint_from_eight_roles.
          Print Assumptions native_verifier_profile_text_wrong_role_decoders_fail.
          Print Assumptions native_occurrence_key_wire_injective.
          Print Assumptions native_occurrence_key_wire_roundtrip.
          Print Assumptions native_occurrence_key_wire_disjoint_from_nine_roles.
          Print Assumptions native_occurrence_key_wrong_role_decoders_fail.
          Print Assumptions native_checked_occurrence_identity_pair_roundtrip.
          Print Assumptions native_checked_occurrence_identity_pair_injective.
          Print Assumptions native_checked_occurrence_identity_pair_wrong_roles_reject.
          Print Assumptions native_checked_occurrence_same_revision_not_same_identity.
          Print Assumptions native_generic_declaration_wire_roundtrip.
          Print Assumptions native_generic_interface_wire_roundtrip.
          Print Assumptions native_generic_declaration_wire_injective.
          Print Assumptions native_generic_interface_wire_injective.
          Print Assumptions native_generic_scalar_projection_roundtrip.
          Print Assumptions native_generic_scalar_wrong_role_reject.
          Print Assumptions native_generic_scalar_wires_cannot_identify_actuals.
          Print Assumptions native_generic_static_key_wire_roundtrip.
          Print Assumptions native_generic_static_key_wire_injective.
          Print Assumptions native_generic_static_key_wrong_role_reject.
          Print Assumptions native_generic_static_key_wire_cannot_identify_value.
          Print Assumptions native_semantic_atom_wire_roundtrip.
          Print Assumptions native_semantic_atom_wire_injective.
          Print Assumptions native_semantic_atom_wrong_role_reject.
          Print Assumptions native_semantic_atom_model_nonatoms_fail_closed.
          Print Assumptions native_ordered_atom_list_model_roundtrip.
          Print Assumptions native_ordered_atom_list_model_injective.
          Print Assumptions native_ordered_atom_list_model_foreign_key_rejected.
          Print Assumptions native_ordered_atom_list_model_order_sensitive.
          Print Assumptions fixed_adapter_full_certification_preserves_predecessors.
          EOF
          rocq c -Q proof/Phil Phil /tmp/NativeFinalInstanceAssumptions.v 2>&1 | tee typed-native-instance-assumptions.log
          sha256sum proof/Phil/Verification/NativeFinalInstanceTypedCorrespondence.v proof/Phil/Verification/NativeFinalInstanceTypedCorrespondence.vo typed-native-instance-assumptions.log > typed-native-instance-identities.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-final-instance-typed-boundary
          path: |
            typed-native-instance-assumptions.log
            typed-native-instance-identities.sha256
          if-no-files-found: error
