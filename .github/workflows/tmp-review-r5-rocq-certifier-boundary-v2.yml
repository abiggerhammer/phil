name: Temporary R5 Rocq certifier-boundary remediation v2

on:
  push:
    branches: [phase1-review-r5-rocq-certifier-boundary]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-review-r5-rocq-certifier-boundary
      - name: Apply guarded trusted-packaging boundary repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one anchor in {path}, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          # Retire misleading pure certification names across every Haskell
          # source subtree, including the retained Phase-0 projection package.
          # These functions package bytes supplied by a trusted checked producer;
          # they do not themselves invoke or authenticate Rocq.
          for path in Path('.').rglob('*.hs'):
              text = path.read_text()
              text = text.replace('certifyCoreScalarRocqProof', 'packageTrustedCoreScalarRocqProof')
              text = text.replace('certifyRocqProofBundle', 'packageTrustedRocqProofBundle')
              text = text.replace('certifyRocqProof', 'packageTrustedRocqProof')
              path.write_text(text)

          rocq = Path('src/Phil/Assurance/Rocq.hs')
          replace_once(
              rocq,
              'checkerProfile = "rocq/9.2.0 container; rocq c; proof-assistant-theorem/v1"',
              'checkerProfile = "rocq/9.2.0 externally checked; trusted-packaging/proof-assistant-theorem/v1"')
          replace_once(
              rocq,
              '      , evidenceProducer = "Rocq 9.2.0"\n      , evidenceChecker = "Rocq kernel through successful `rocq c`, then Phil assurance manifest verification"',
              '      , evidenceProducer = "trusted externally checked Rocq 9.2.0 inputs"\n      , evidenceChecker = "Phil trusted packaging boundary; successful Rocq checking is an explicit caller precondition"')
          replace_once(
              rocq,
              'packageTrustedRocqProof\n  :: RocqCertificationSpec',
              '-- | Package proof bytes that a trusted caller has already checked with Rocq.\n--\n-- This function deliberately does not run or authenticate Rocq. Calling it is\n-- an explicit trust assertion, suitable for compile-before-package workflows\n-- whose producer step is already inside the trusted build boundary. It must\n-- not be used as untrusted proof ingress.\npackageTrustedRocqProof\n  :: RocqCertificationSpec')

          rocq_bundle = Path('src/Phil/Assurance/RocqBundle.hs')
          replace_once(
              rocq_bundle,
              'checkerProfile = "rocq/9.2.0 container; rocq c; proof-assistant-theorem/v1"',
              'checkerProfile = "rocq/9.2.0 externally checked; trusted-packaging/proof-assistant-theorem/v1"')
          replace_once(
              rocq_bundle,
              'packageTrustedRocqProofBundle\n  :: RocqProofBundleSpec',
              '-- | Package a bundle of proof bytes already checked by a trusted Rocq producer.\n--\n-- This pure boundary hashes and binds supplied source/object bytes but does not\n-- run or authenticate Rocq; successful checking is an explicit caller premise.\npackageTrustedRocqProofBundle\n  :: RocqProofBundleSpec')
          replace_once(
              rocq_bundle,
              '      , evidenceProducer = "Rocq 9.2.0"\n      , evidenceChecker = "Rocq kernel through successful `rocq c`, then Phil assurance proof-bundle manifest verification"',
              '      , evidenceProducer = "trusted externally checked Rocq 9.2.0 inputs"\n      , evidenceChecker = "Phil trusted proof-bundle packaging boundary; successful Rocq checking is an explicit caller precondition"')

          cli = Path('app/RocqScalarCertificationMain.hs')
          replace_once(
              cli,
              '  case args of\n    [sourcePath, compiledPath, outputPath] ->\n      certifyWith coreScalarCertificationSpec sourcePath compiledPath outputPath\n    [profileText, sourcePath, compiledPath, outputPath] ->\n      case certificationSpecFor (Text.pack profileText) of',
              '  case args of\n    ["--trusted-checked-inputs", sourcePath, compiledPath, outputPath] ->\n      packageWith coreScalarCertificationSpec sourcePath compiledPath outputPath\n    ["--trusted-checked-inputs", profileText, sourcePath, compiledPath, outputPath] ->\n      case certificationSpecFor (Text.pack profileText) of')
          replace_once(cli, '        Just spec -> certifyWith spec sourcePath compiledPath outputPath',
                       '        Just spec -> packageWith spec sourcePath compiledPath outputPath')
          replace_once(
              cli,
              '      hPutStrLn stderr\n        "usage: phil-certify-core-scalar [PROFILE] SOURCE.v COMPILED.vo OUTPUT.cert"\n      exitFailure',
              '      hPutStrLn stderr\n        "usage: phil-certify-core-scalar --trusted-checked-inputs [PROFILE] SOURCE.v COMPILED.vo OUTPUT.cert"\n      hPutStrLn stderr\n        "This command packages proof authority only for inputs already checked by a trusted Rocq producer; it does not run Rocq itself."\n      exitFailure')
          replace_once(cli, 'certifyWith :: RocqCertificationSpec -> FilePath -> FilePath -> FilePath -> IO ()\ncertifyWith spec sourcePath compiledPath outputPath = do',
                       'packageWith :: RocqCertificationSpec -> FilePath -> FilePath -> FilePath -> IO ()\npackageWith spec sourcePath compiledPath outputPath = do')
          replace_once(cli, '("certified " <> Text.unpack obligation <>\n          " as ProofAssistantTheorem evidence")',
                       '("packaged trusted checked proof " <> Text.unpack obligation <>\n          " as ProofAssistantTheorem evidence")')
          replace_once(
              cli,
              '      putStrLn\n        ("certificate artifact: " <>',
              '      putStrLn "trusted packaging precondition: caller established successful Rocq checking before this command"\n      putStrLn\n        ("certificate artifact: " <>')

          test = Path('test/RocqCertificationMain.hs')
          replace_once(
              test,
              '    , test "compiled proof object is content-bound" compiledObjectIsBound\n',
              '    , test "compiled proof object is content-bound" compiledObjectIsBound\n'
              '    , test "trusted Rocq packaging names its external-check precondition" trustedPackagingNamesPrecondition\n')
          replace_once(
              test,
              'certificateTamperRejects :: Bool\n',
              'trustedPackagingNamesPrecondition :: Bool\n'
              'trustedPackagingNamesPrecondition = case candidate coreScalarCertificationSpec "compiled-one" of\n'
              '  Left _ -> False\n'
              '  Right bundle ->\n'
              '    "trusted-packaging" `Text.isInfixOf`\n'
              '      rocqCertificateCheckerProfile (rocqBundleCertificate bundle)\n'
              '      && all\n'
              '        (Text.isInfixOf "explicit caller precondition" . evidenceChecker)\n'
              '        (Map.elems (ledgerEvidence (rocqBundleLedger bundle)))\n\n'
              'certificateTamperRejects :: Bool\n')
          PY
          git diff --check
          if git grep -n -E 'certify(CoreScalar)?RocqProof|certifyRocqProofBundle' -- '*.hs'; then
            echo 'legacy misleading Rocq certification symbol remains' >&2
            exit 1
          fi
          git diff --stat
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build and test R5 patch
        run: |
          cabal build all --enable-tests
          cabal test phil-rocq-certification-tests --test-show-details=direct
          cabal exec -- runghc -Wall -Werror -isrc test/RocqCertificationMain.hs
      - name: Exercise public CLI trust gate
        run: |
          set -euo pipefail
          cat > /tmp/review-r5.v <<'EOF'
          (* PHIL-CORE-SCALAR-001 *)
          Theorem scalar_literal_has_intrinsic_type.
          Theorem scalar_literal_type_is_deterministic.
          Theorem boolean_literals_are_valid.
          Theorem valid_uint_has_positive_width.
          Theorem valid_uint_is_below_modulus.
          Theorem zero_width_uint_is_invalid.
          Theorem uint_at_modulus_is_invalid.
          EOF
          printf 'not-a-rocq-object' > /tmp/review-r5.vo
          if cabal run exe:phil-certify-core-scalar -- /tmp/review-r5.v /tmp/review-r5.vo /tmp/review-r5.cert; then
            echo 'legacy unchecked certification invocation unexpectedly succeeded' >&2
            exit 1
          fi
          cabal run exe:phil-certify-core-scalar -- --trusted-checked-inputs /tmp/review-r5.v /tmp/review-r5.vo /tmp/review-r5.cert
          grep -q 'trusted-packaging' /tmp/review-r5.cert
      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add -u
          git commit -m "review: make Rocq proof authority an explicit trusted package boundary"
          git push origin HEAD:phase1-review-r5-rocq-certifier-boundary
