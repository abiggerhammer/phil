name: Phase 1 VER-009 Generic Assurance Reuse

on:
  pull_request:
    paths:
      - 'src/Phil/Verification/GenericAssurance.hs'
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1VerificationGenericAssuranceReuseMain.hs'
      - 'test/Phase1GenericIdentityMain.hs'
      - 'test/Phase1GenericInstantiationMain.hs'
      - 'src/Phil/Verification/ProofEvidence.hs'
      - 'src/Phil/Verification.hs'
      - 'test/Phase1VerificationNoSilentAssumptionExportMain.hs'
      - 'test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs'
      - 'test/Phase1VerificationEvidenceReuseInvalidationMain.hs'
      - 'test/Phase1VerificationEvidenceSubjectRevisionCompetenceMain.hs'
      - 'test/Phase1VerificationProducerFailureUnresolvedMain.hs'
      - 'test/Phase1VerificationProofProducerCheckerSeparationMain.hs'
      - 'test/Phase1VerificationCanonicalObligationGraphMain.hs'
      - 'test/Phase1VerificationIntrinsicInvalidityMain.hs'
      - '.github/workflows/phase1-ver-009-generic-assurance-reuse.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Verification/GenericAssurance.hs'
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1VerificationGenericAssuranceReuseMain.hs'
      - 'test/Phase1GenericIdentityMain.hs'
      - 'test/Phase1GenericInstantiationMain.hs'
      - 'src/Phil/Verification/ProofEvidence.hs'
      - 'src/Phil/Verification.hs'
      - 'test/Phase1VerificationNoSilentAssumptionExportMain.hs'
      - 'test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs'
      - 'test/Phase1VerificationEvidenceReuseInvalidationMain.hs'
      - 'test/Phase1VerificationEvidenceSubjectRevisionCompetenceMain.hs'
      - 'test/Phase1VerificationProducerFailureUnresolvedMain.hs'
      - 'test/Phase1VerificationProofProducerCheckerSeparationMain.hs'
      - 'test/Phase1VerificationCanonicalObligationGraphMain.hs'
      - 'test/Phase1VerificationIntrinsicInvalidityMain.hs'
      - '.github/workflows/phase1-ver-009-generic-assurance-reuse.yml'

permissions:
  contents: read

jobs:
  ver-009:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Run VER-009 generic assurance reuse regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationGenericAssuranceReuseMain.hs

      - name: Re-run generic identity and instantiation controls
        run: |
          cabal exec -- runghc -isrc test/Phase1GenericIdentityMain.hs
          cabal exec -- runghc -isrc test/Phase1GenericInstantiationMain.hs

      - name: Re-run VER-008 and VER-007 policy controls
        run: |
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationNoSilentAssumptionExportMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs

      - name: Re-run VER-006 and VER-005 evidence controls
        run: |
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationEvidenceReuseInvalidationMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationEvidenceSubjectRevisionCompetenceMain.hs

      - name: Re-run VER-004 and VER-003 proof evidence controls
        run: |
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationProducerFailureUnresolvedMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationProofProducerCheckerSeparationMain.hs

      - name: Re-run VER-002 and VER-001 verification controls
        run: |
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationCanonicalObligationGraphMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationIntrinsicInvalidityMain.hs

      - name: Run assurance authority controls
        run: cabal test phil-assurance-tests phil-assurance-handoff-tests phil-decision-tests
