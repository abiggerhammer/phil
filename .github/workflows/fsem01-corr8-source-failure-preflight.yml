name: FSEM-01 CORR-8 Source Failure Prefix Preflight

on:
  push:
    branches:
      - formal-semantics/fsem01-corr8-source-failure-prefix
    paths:
      - 'proof/Phil/Surface/SurfaceSourceFailureCorr8.v'
      - 'proof/Phil/Surface/SurfaceSourceFailureWireCorr8.v'
      - 'test/Phase1FSEM01Corr8SourceFailureMain.hs'
      - 'scripts/fsem01_corr8_source_failure_witness.py'
      - '.github/workflows/fsem01-corr8-source-failure-preflight.yml'
  pull_request:
    paths:
      - 'proof/Phil/Surface/SurfaceSourceFailureCorr8.v'
      - 'proof/Phil/Surface/SurfaceSourceFailureWireCorr8.v'
      - 'test/Phase1FSEM01Corr8SourceFailureMain.hs'
      - 'scripts/fsem01_corr8_source_failure_witness.py'
      - 'docs/phase-1/formal-semantics-source-failure-corr8-fsem01-v1.md'
      - '.github/workflows/fsem01-corr8-source-failure-preflight.yml'

concurrency:
  group: corr8-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rocq-predecessor-model:
    name: Rocq finite terminal-aware predecessor classification and global priority
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile finite model, check assumptions and proof objects
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Surface/SurfaceFiniteContextFrame.v \
            proof/Phil/Surface/SurfaceFiniteMixedJoinCorr6.v \
            proof/Phil/Surface/SurfaceFiniteTerminalJoinCorr7.v \
            proof/Phil/Surface/SurfaceSourceFailureCorr8.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceSourceFailureCorr8
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceFiniteTerminalJoinCorr7.v; then
            echo "Unproved CORR-8 model" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceFiniteTerminalJoinCorr7.v \
            proof/Phil/Surface/SurfaceSourceFailureCorr8.v \
                     proof/Phil/Surface/SurfaceSourceFailureCorr8.vo

  native-predecessor-source:
    name: Strict native source terminal/continuing finite join replay and negative controls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Build strict native source checker and recheck real predecessor traces
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
          for test in \
            Phase1FSEM01ScopedBorrowJoinMain \
            Phase1FSEM01Corr7PredecessorsMain \
            Phase1FSEM01Corr8SourceFailureMain
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1FSEM01Corr8SourceFailureMain.hs --emit corr8-artifacts
          python3 scripts/fsem01_corr8_source_failure_witness.py \
            --artifact-dir corr8-artifacts \
            --rocq-witness corr8-generated/GeneratedCorr8SourceWitness.v
          sha256sum test/Phase1FSEM01Corr8SourceFailureMain.hs \
                     src/Phil/Core/Context.hs \
                     src/Phil/Surface/GrammarV1/SourceScopedBorrowJoin.hs \
                     corr8-artifacts/*.fail
      - uses: actions/upload-artifact@v4
        with:
          name: fsem01-corr8-original-source-failure-prefixes
          path: corr8-artifacts/*.fail
          if-no-files-found: error
          retention-days: 30

  rocq-source-decoder:
    name: Rocq strict finite original-source predecessor decoder
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict source decoder and finite control replay
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/BindingSemantics.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ResourceJoin.v \
            proof/Phil/Core/ResourceScope.v \
            proof/Phil/Surface/SurfaceBinderScopeCore.v \
            proof/Phil/Surface/SurfaceLetPatternScope.v \
            proof/Phil/Surface/SurfaceBorrowViewScope.v \
            proof/Phil/Surface/SurfaceBorrowLoanStateCorrespondence.v \
            proof/Phil/Surface/SurfaceBinderNameEncoding.v \
            proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v \
            proof/Phil/Surface/SurfaceRepresentedBorrowTrace.v \
            proof/Phil/Surface/SurfaceBorrowStepErrorBridge.v \
            proof/Phil/Surface/SurfaceObservationWire.v \
            proof/Phil/Surface/SurfaceFiniteContextFrame.v \
            proof/Phil/Surface/SurfaceFiniteMixedJoinCorr6.v \
            proof/Phil/Surface/SurfaceFiniteTerminalJoinCorr7.v \
            proof/Phil/Surface/SurfaceSourceFailureCorr8.v \
            proof/Phil/Surface/SurfaceSourceFailureWireCorr8.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceSourceFailureWireCorr8
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceFiniteTerminalJoinCorr7.v \
            proof/Phil/Surface/SurfaceSourceFailureCorr8.v \
            proof/Phil/Surface/SurfaceSourceFailureWireCorr8.v; then
            echo "Unproved CORR-8 wire theorem" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceSourceFailureWireCorr8.v \
                     proof/Phil/Surface/SurfaceSourceFailureWireCorr8.vo

  rocq-exact-source-replay:
    name: Rocq replay exact six original Haskell-produced predecessor bytes
    needs: [rocq-predecessor-model, native-predecessor-source, rocq-source-decoder]
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fsem01-corr8-original-source-failure-prefixes
          path: corr8-artifacts
      - name: Independently recheck source identities and generate exact-byte Rocq witness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fsem01_corr8_source_failure_witness.py \
            --artifact-dir corr8-artifacts \
            --rocq-witness corr8-generated/GeneratedCorr8SourceWitness.v
      - name: Compile decoder and literal native-source evidence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/BindingSemantics.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ResourceJoin.v \
            proof/Phil/Core/ResourceScope.v \
            proof/Phil/Surface/SurfaceBinderScopeCore.v \
            proof/Phil/Surface/SurfaceLetPatternScope.v \
            proof/Phil/Surface/SurfaceBorrowViewScope.v \
            proof/Phil/Surface/SurfaceBorrowLoanStateCorrespondence.v \
            proof/Phil/Surface/SurfaceBinderNameEncoding.v \
            proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v \
            proof/Phil/Surface/SurfaceRepresentedBorrowTrace.v \
            proof/Phil/Surface/SurfaceBorrowStepErrorBridge.v \
            proof/Phil/Surface/SurfaceObservationWire.v \
            proof/Phil/Surface/SurfaceFiniteContextFrame.v \
            proof/Phil/Surface/SurfaceFiniteMixedJoinCorr6.v \
            proof/Phil/Surface/SurfaceFiniteTerminalJoinCorr7.v \
            proof/Phil/Surface/SurfaceSourceFailureCorr8.v \
            proof/Phil/Surface/SurfaceSourceFailureWireCorr8.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq c -Q proof/Phil Phil corr8-generated/GeneratedCorr8SourceWitness.v
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceSourceFailureWireCorr8
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            corr8-generated/GeneratedCorr8SourceWitness.v; then
            echo "Unproved CORR-8 literal witness" >&2
            exit 1
          fi
          sha256sum corr8-artifacts/*.fail \
            corr8-generated/GeneratedCorr8SourceWitness.v \
            corr8-generated/GeneratedCorr8SourceWitness.vo \
            proof/Phil/Surface/SurfaceSourceFailureCorr8.vo \
            proof/Phil/Surface/SurfaceSourceFailureWireCorr8.vo
