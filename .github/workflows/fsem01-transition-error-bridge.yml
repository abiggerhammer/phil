name: FSEM-01 Transition and BorrowEscape Simulation Interface

on:
  pull_request:
    paths:
      - 'proof/Phil/Surface/SurfaceBorrowStepErrorBridge.v'
      - 'test/Phase1FSEM01RepresentedLoanTraceMain.hs'
      - 'docs/phase-1/formal-semantics-step-error-bridge-fsem01-v1.md'
      - '.github/workflows/fsem01-transition-error-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Surface/SurfaceBorrowStepErrorBridge.v'
      - 'test/Phase1FSEM01RepresentedLoanTraceMain.hs'
      - 'docs/phase-1/formal-semantics-step-error-bridge-fsem01-v1.md'
      - '.github/workflows/fsem01-transition-error-bridge.yml'

permissions:
  contents: read

jobs:
  rocq-exact-step-error-bridge:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile model dependencies and fail-closed transition proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/BindingSemantics.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ResourceJoin.v \
            proof/Phil/Core/ResourceScope.v \
            proof/Phil/Surface/SurfaceBinderScopeCore.v \
            proof/Phil/Surface/SurfaceLetPatternScope.v \
            proof/Phil/Surface/SurfaceBorrowViewScope.v \
            proof/Phil/Surface/SurfaceBorrowLoanStateCorrespondence.v \
            proof/Phil/Surface/SurfaceBinderNameEncoding.v \
            proof/Phil/Surface/SurfaceDeclarationIdentityBridge.v \
            proof/Phil/Surface/SurfaceRepresentedBorrowTrace.v \
            proof/Phil/Surface/SurfaceBorrowStepErrorBridge.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
      - name: Forbid admissions and record exact proof digest
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceBorrowStepErrorBridge.v; then
            echo "Unexpected admission or global axiom in FSEM-01 step bridge"
            exit 1
          fi
          sha256sum \
            proof/Phil/Surface/SurfaceBorrowStepErrorBridge.v \
            proof/Phil/Surface/SurfaceBorrowStepErrorBridge.vo

  haskell-real-checkpoint-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build actual Haskell substrate with warnings as errors
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Strictly check observational step and tamper tests
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1FSEM01RepresentedLoanTraceMain.hs
      - name: Replay production transition and negative no-successor certificates
        run: cabal exec -- runghc -isrc -Wall -Werror \
          test/Phase1FSEM01RepresentedLoanTraceMain.hs
