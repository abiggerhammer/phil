name: FSEM-01 Two Bool Join Telescope Early Preflight

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - formal-semantics/fsem01-two-slot-bool-join-telescope
  pull_request:
    paths:
      - 'src/Phil/Surface/Check/Engine.hs'
      - 'src/Phil/Surface/GrammarV1/LetPatternScope.hs'
      - 'src/Phil/Surface/GrammarV1/SourceTwoBoolJoinTelescope.hs'
      - 'test/Phase1FSEM01TwoBoolJoinTelescopeMain.hs'
      - 'test/fixtures/fsem01-two-bool-join-telescope-v1/**'
      - 'proof/Phil/Surface/SurfaceSourceTwoBoolJoinTelescope.v'
      - 'docs/phase-1/formal-semantics-two-bool-join-telescope-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-two-bool-join-telescope-preflight.yml'

permissions:
  contents: read

jobs:
  source-two-bool-join-haskell:
    name: Strict source two-Bool tuple and ordered native resource join
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Update Hackage with bounded HTTP1 retry
        shell: bash
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Build warning-free production Haskell library
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Previous one-slot and current two-slot production controls
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            Phase1GrammarV1JoinLoopMain \
            Phase1FSEM01SourceBranchJoinMain \
            Phase1FSEM01AffineJoinScopeMain \
            Phase1FSEM01ScopedBorrowJoinMain \
            Phase1FSEM01BoolJoinTelescopeMain \
            Phase1FSEM01TwoBoolJoinTelescopeMain
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
          sha256sum src/Phil/Surface/GrammarV1/SourceTwoBoolJoinTelescope.hs \
            src/Phil/Surface/Check/Engine.hs \
            test/Phase1FSEM01TwoBoolJoinTelescopeMain.hs

  source-two-bool-join-rocq:
    name: Rocq ordered two-slot insertion, Bool phi and resource frame
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile conditional two-slot source model without admissions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Surface/SurfaceSourceBoolJoinTelescope.v \
            proof/Phil/Surface/SurfaceSourceTwoBoolJoinTelescope.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceSourceTwoBoolJoinTelescope.v; then
            echo "Unproved FSEM two-slot join theorem" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceSourceTwoBoolJoinTelescope.v \
            proof/Phil/Surface/SurfaceSourceTwoBoolJoinTelescope.vo
