name: Temporary INT-006 Steve Provider ABI Bridge

on:
  workflow_dispatch:
  push:
    branches: [phase1-int-006-steve-provider-abi-bridge]
    paths:
      - 'runtime/phase1/SteveProviderBridge.hs'
      - 'runtime/phase1/SteveProviderBridgeSmokeMain.hs'
      - 'src/Phil/Compiler/SteveCAS.hs'
      - 'src/Phil/Compiler/RuntimeChoiceLLVM.hs'
      - 'test/Phase1INT006RuntimeChoiceLLVMMain.hs'
      - 'test/Phase1INT006SteveCASMain.hs'
      - 'scripts/ci/resolve-llvm18.sh'
      - '.github/workflows/tmp-int-006-steve-provider-abi-bridge.yml'

permissions:
  contents: read

jobs:
  steve-provider-abi-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck provider bridge and launcher
        run: |
          cabal exec -- ghc -isrc -iruntime/phase1 \
            -package directory -package unix \
            -Wall -Werror -fno-code runtime/phase1/SteveProviderBridgeSmokeMain.hs

      - name: Replay direct CAS semantics
        run: |
          cabal exec -- runghc \
            --ghc-arg=-package --ghc-arg=directory \
            --ghc-arg=-package --ghc-arg=unix \
            -isrc -itest -Wall -Werror test/Phase1INT006SteveCASMain.hs

      - name: Build and execute exact native provider bridge
        run: |
          PHIL_LLVM18_TOOLS="clang"
          source scripts/ci/resolve-llvm18.sh
          unset PHIL_LLVM18_TOOLS

          work="$RUNNER_TEMP/phil-int006-steve-provider-bridge"
          mkdir -p "$work"
          llvm="$work/steve.ll"
          object="$work/steve.o"
          executable="$work/steve-native-provider-smoke"

          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006RuntimeChoiceLLVMMain.hs emit > "$llvm"
          "$CLANG" --target=x86_64-unknown-linux-gnu -c "$llvm" -o "$object"

          cabal exec -- ghc -isrc -iruntime/phase1 \
            -package directory -package unix \
            -Wall -Werror \
            runtime/phase1/SteveProviderBridgeSmokeMain.hs "$object" \
            -o "$executable"

          "$executable"

      - name: Replay certified runtime-choice LLVM checks
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT006RuntimeChoiceLLVMMain.hs

      - name: Replay real Steve manifest closure
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT005RealWitnessManifestMain.hs
