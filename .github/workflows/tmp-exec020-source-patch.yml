name: Temporary EXEC-020 source patch

on:
  push:
    branches: [phase1-exec-020-explicit-numeric-conversions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-exec-020-explicit-numeric-conversions
      - name: Apply guarded EXEC-020 parser and semantic patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_s, old, new):
              path = Path(path_s)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_s}: expected one anchor, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          # Review fixes in newly-added semantic files.
          replace_once(
              'src/Phil/Core/NumericConversion.hs',
              'convertToSInt signedType@(SIntType width) source = do',
              'convertToSInt signedType source = do')
          replace_once(
              'src/Phil/Core/NumericConversion.hs',
              '  Right (Text.pack (prefix <> decimalMagnitude))',
              '  Just (Text.pack (prefix <> decimalMagnitude))')

          replace_once(
              'src/Phil/Surface/GrammarV1/NumericConversion.hs',
              '  ( FloatOperator (..)\n  , FloatSemanticError\n  , applyFloatOperator',
              '  ( FloatOperator (..)\n  , FloatSemanticError\n  , FloatValue\n  , applyFloatOperator')
          replace_once(
              'src/Phil/Surface/GrammarV1/NumericConversion.hs',
              '  ( NumericConversionError\n  , NumericType\n  , NumericValue (..)\n  , convertNumericValue\n  , numericTypeFromCoreType\n  )',
              '  ( NumericConversionError\n  , NumericConversionResult (..)\n  , NumericType (..)\n  , NumericValue (..)\n  , convertNumericValue\n  , numericTypeFromCoreType\n  , numericValueType\n  )')
          replace_once(
              'src/Phil/Surface/GrammarV1/NumericConversion.hs',
              '  -> Phil.Core.FloatArithmetic.FloatValue\n  -> Phil.Core.FloatArithmetic.FloatValue',
              '  -> FloatValue\n  -> FloatValue')

          replace_once(
              'test/Phase1NumericConversionMain.hs',
              'import qualified Data.Map.Strict as Map\n',
              'import qualified Data.Map.Strict as Map\nimport qualified Data.Text as Text\n')
          replace_once(
              'test/Phase1NumericConversionMain.hs',
              'fromString :: String -> Data.Text.Text\nfromString = Data.Text.pack',
              'fromString :: String -> Text.Text\nfromString = Text.pack')

          # Production Grammar-v1 parser: canonical convert expression.
          replace_once(
              'src/Phil/Surface/GrammarV1/Parser.hs',
              '  | GrammarV1ReleaseExpression (Located GrammarV1Expression)\n  | GrammarV1AcceptExpression',
              '  | GrammarV1ReleaseExpression (Located GrammarV1Expression)\n  | GrammarV1ConvertExpression\n      (Located GrammarV1Expression)\n      (Located GrammarV1Type)\n  | GrammarV1AcceptExpression')
          replace_once(
              'src/Phil/Surface/GrammarV1/Parser.hs',
              '    Just (GrammarKeyword "release") -> parseReleaseExpression\n    Just (GrammarKeyword "transport") -> parseTransportExpression',
              '    Just (GrammarKeyword "release") -> parseReleaseExpression\n    Just (GrammarKeyword "convert") -> parseConvertExpression\n    Just (GrammarKeyword "transport") -> parseTransportExpression')
          replace_once(
              'src/Phil/Surface/GrammarV1/Parser.hs',
              'parseAcceptExpression :: Parser (Located GrammarV1Expression)\n',
              'parseConvertExpression :: Parser (Located GrammarV1Expression)\nparseConvertExpression = do\n  start <- expectKeyword "convert"\n  value <- parseExpression\n  _ <- expectKeyword "to"\n  target <- parseType\n  pure $ Located\n    (SourceSpan\n      (sourceSpanStart (locatedSpan start))\n      (sourceSpanEnd (locatedSpan target)))\n    (GrammarV1ConvertExpression value target)\n\nparseAcceptExpression :: Parser (Located GrammarV1Expression)\n')

          # Closed traversals that inventory strict child evaluation / lexical use.
          replace_once(
              'src/Phil/Surface/GrammarV1/GenericTermScope.hs',
              '  GrammarV1ReleaseExpression resource -> expressionBinderSites resource\n  GrammarV1AcceptExpression value _ -> expressionBinderSites value',
              '  GrammarV1ReleaseExpression resource -> expressionBinderSites resource\n  GrammarV1ConvertExpression value _ -> expressionBinderSites value\n  GrammarV1AcceptExpression value _ -> expressionBinderSites value')
          replace_once(
              'src/Phil/Surface/GrammarV1/SequentialExecution.hs',
              '    GrammarV1ReleaseExpression value ->\n      finishAfterChildren source [value] state\n    GrammarV1AcceptExpression value _ ->',
              '    GrammarV1ReleaseExpression value ->\n      finishAfterChildren source [value] state\n    GrammarV1ConvertExpression value _ ->\n      finishAfterChildren source [value] state\n    GrammarV1AcceptExpression value _ ->')
          replace_once(
              'src/Phil/Surface/GrammarV1/LexicalReferenceScope.hs',
              '    GrammarV1FallbackExpression primary fallback -> combineChecked\n      (grammarV1CheckedExpressionReferences pending scope primary)\n      (checkedFallbackReferences pending scope fallback)\n    GrammarV1TupleExpression elements ->',
              '    GrammarV1FallbackExpression primary fallback -> combineChecked\n      (grammarV1CheckedExpressionReferences pending scope primary)\n      (checkedFallbackReferences pending scope fallback)\n    GrammarV1ConvertExpression value _ ->\n      grammarV1CheckedExpressionReferences pending scope value\n    GrammarV1TupleExpression elements ->')
          replace_once(
              'src/Phil/Surface/GrammarV1/SemanticBindingState.hs',
              '    GrammarV1FallbackExpression primary fallback ->\n      GrammarV1FallbackExpression\n        <$> rewriteExpression renames primary\n        <*> rewriteFallback renames fallback\n    GrammarV1TupleExpression elements ->',
              '    GrammarV1FallbackExpression primary fallback ->\n      GrammarV1FallbackExpression\n        <$> rewriteExpression renames primary\n        <*> rewriteFallback renames fallback\n    GrammarV1ConvertExpression value target ->\n      GrammarV1ConvertExpression\n        <$> rewriteExpression renames value\n        <*> pure target\n    GrammarV1TupleExpression elements ->')

          # Existing Audit job owns the focused implementation corpus.
          replace_once(
              '.github/workflows/phase1-audit-reconciliation-conformance.yml',
              '      - name: EXEC-018 Grammar-v1 F32/F64 source composition\n        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1FloatArithmeticSourceMain.hs\n      - name: VER-013 prove competence and no assertion fallback',
              '      - name: EXEC-018 Grammar-v1 F32/F64 source composition\n        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1FloatArithmeticSourceMain.hs\n      - name: EXEC-020 explicit numeric conversions\n        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1NumericConversionMain.hs\n      - name: VER-013 prove competence and no assertion fallback')
          PY

          git diff --check
          git diff --stat
      - name: Commit guarded EXEC-020 patch
        run: |
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add src/Phil/Core/NumericConversion.hs \
                  src/Phil/Surface/GrammarV1/NumericConversion.hs \
                  src/Phil/Surface/GrammarV1/Parser.hs \
                  src/Phil/Surface/GrammarV1/GenericTermScope.hs \
                  src/Phil/Surface/GrammarV1/SequentialExecution.hs \
                  src/Phil/Surface/GrammarV1/LexicalReferenceScope.hs \
                  src/Phil/Surface/GrammarV1/SemanticBindingState.hs \
                  test/Phase1NumericConversionMain.hs \
                  .github/workflows/phase1-audit-reconciliation-conformance.yml
          git commit -m "phase1: compose explicit numeric conversions"
          git push origin HEAD:phase1-exec-020-explicit-numeric-conversions
