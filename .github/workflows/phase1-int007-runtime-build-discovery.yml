name: INT-007 Runtime Build Discovery

concurrency:
  group: int007-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

on:
  pull_request:
    paths:
      - '.github/workflows/phase1-int007-runtime-build-discovery.yml'

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact macOS runtime/build discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35460703059 --repo ${{ github.repository }} --name int007-runtime-build-discovery-35460703059 --dir dist/int007-runtime-build-discovery
      - name: Freeze exact runtime/build handoff summaries
        run: |
          set -euo pipefail
          cp dist/int007-runtime-build-discovery/Upload-realization-v1.tsv handoff/phase1/runtime/upload-realization-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-systems-v1.tsv handoff/phase1/runtime/upload-systems-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-stage-contract-v1.tsv handoff/phase1/runtime/upload-stage-contract-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-lowering-v1.tsv handoff/phase1/runtime/upload-lowering-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-cost-v1.tsv handoff/phase1/runtime/upload-cost-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-realization-v1.tsv handoff/phase1/runtime/steve-realization-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-systems-v1.tsv handoff/phase1/runtime/steve-systems-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-stage-contract-v1.tsv handoff/phase1/runtime/steve-stage-contract-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-lowering-v1.tsv handoff/phase1/runtime/steve-lowering-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-cost-v1.tsv handoff/phase1/runtime/steve-cost-v1.tsv
          git show 06f583812935d30eda80fa838ae9142c2790c853:.github/workflows/phase1-int007-runtime-build-discovery.yml > .github/workflows/phase1-int007-runtime-build-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/phase1/runtime .github/workflows/phase1-int007-runtime-build-discovery.yml
          git commit -m "Freeze INT-007 runtime/build handoff artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
