name: INT-007 Runtime Build Discovery

concurrency:
  group: int007-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  pull_request:
    paths:
      - 'src/Phil/Handoff/Phase1RuntimeBuild.hs'
      - 'src/Phil/Systems/GenericLowering.hs'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Phase1Stage.hs'
      - 'src/Phil/Systems/StageClosure.hs'
      - 'src/Phil/Systems/CostAttribution.hs'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - 'src/Phil/Examples/Phase1/StageClosureWitnesses.hs'
      - 'test/Phase1INT007RuntimeBuildMain.hs'
      - 'handoff/phase1/runtime/**'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int007-runtime-build-discovery.yml'

jobs:
  discover:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Cancel superseded runs of this workflow
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const currentRunNumber = Number(process.env.GITHUB_RUN_NUMBER);
            const prNumber = context.payload.pull_request.number;
            const workflowName = context.workflow;
            const headRef = context.payload.pull_request.head.ref;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                event: 'pull_request',
                branch: headRef,
                per_page: 100
              }
            );
            const active = new Set([
              'queued',
              'in_progress',
              'pending',
              'waiting',
              'requested'
            ]);
            const stale = runs.filter(run => {
              const samePullRequest =
                (run.pull_requests || []).some(pr => pr.number === prNumber)
                  || run.head_branch === headRef;
              return run.id !== currentRunId
                && run.name === workflowName
                && run.run_number < currentRunNumber
                && active.has(run.status)
                && samePullRequest;
            });
            for (const run of stale) {
              core.info(
                `Cancelling superseded ${workflowName} run ${run.id} (${run.status})`
              );
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              } catch (error) {
                if (error.status === 409) {
                  core.info(`Run ${run.id} already left a cancellable state`);
                } else {
                  throw error;
                }
              }
            }
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build runtime/build handoff format strictly
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Typecheck runtime/build replay strictly
        run: cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007RuntimeBuildMain.hs
      - name: Emit exact runtime/build handoff summaries
        id: discovery
        continue-on-error: true
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007RuntimeBuildMain.hs
      - name: Freeze exact runtime/build handoff summaries
        if: steps.discovery.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          cp dist/int007-runtime-build-discovery/Upload-realization-v1.tsv handoff/phase1/runtime/upload-realization-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-systems-v1.tsv handoff/phase1/runtime/upload-systems-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-stage-contract-v1.tsv handoff/phase1/runtime/upload-stage-contract-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-lowering-v1.tsv handoff/phase1/runtime/upload-lowering-v1.tsv
          cp dist/int007-runtime-build-discovery/Upload-cost-v1.tsv handoff/phase1/runtime/upload-cost-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-realization-v1.tsv handoff/phase1/runtime/steve-realization-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-systems-v1.tsv handoff/phase1/runtime/steve-systems-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-stage-contract-v1.tsv handoff/phase1/runtime/steve-stage-contract-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-lowering-v1.tsv handoff/phase1/runtime/steve-lowering-v1.tsv
          cp dist/int007-runtime-build-discovery/Steve-cost-v1.tsv handoff/phase1/runtime/steve-cost-v1.tsv
          git checkout HEAD^ -- .github/workflows/phase1-int007-runtime-build-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/phase1/runtime .github/workflows/phase1-int007-runtime-build-discovery.yml
          git commit -m "Freeze INT-007 runtime/build handoff artifacts"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
      - name: Upload exact runtime/build discovery artifacts
        if: steps.discovery.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: int007-runtime-build-discovery-${{ github.run_id }}
          path: dist/int007-runtime-build-discovery/*.tsv
          if-no-files-found: error
          retention-days: 7
