name: Phase 1 IO Console Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/Console.v'
      - 'proof/Phil/Core/ConsoleImplementation.v'
      - 'proof/Phil/Core/ConsoleImplementationExtraction.v'
      - 'app/ConsoleDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/console-implementation-refinement-v1.md'
      - 'src/Phil/IO/Console.hs'
      - 'src/Phil/Core/Authority.hs'
      - 'src/Phil/Core/Callable.hs'
      - 'test/Phase1IOConsoleProvidersMain.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - '.github/workflows/phase1-io-console-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/Console.v'
      - 'proof/Phil/Core/ConsoleImplementation.v'
      - 'proof/Phil/Core/ConsoleImplementationExtraction.v'
      - 'app/ConsoleDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/console-implementation-refinement-v1.md'
      - 'src/Phil/IO/Console.hs'
      - 'src/Phil/Core/Authority.hs'
      - 'src/Phil/Core/Callable.hs'
      - 'test/Phase1IOConsoleProvidersMain.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - '.github/workflows/phase1-io-console-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-console-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-P1-IO-CONSOLE-001 semantic and implementation proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Console.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ConsoleImplementation.v
          rm -f ConsoleImplementationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ConsoleImplementationExtraction.v
          test -s ConsoleImplementationKernel.hs

      - name: Record checked proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p console-proof
          cp \
            proof/Phil/Core/Console.v \
            proof/Phil/Core/Console.vo \
            proof/Phil/Core/ConsoleImplementation.v \
            proof/Phil/Core/ConsoleImplementation.vo \
            ConsoleImplementationKernel.hs \
            console-proof/
          sha256sum \
            console-proof/Console.v \
            console-proof/Console.vo \
            console-proof/ConsoleImplementation.v \
            console-proof/ConsoleImplementation.vo \
            console-proof/ConsoleImplementationKernel.hs \
            > console-proof/PHIL-P1-IO-CONSOLE-001.proof.sha256
          cat console-proof/PHIL-P1-IO-CONSOLE-001.proof.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-console-proof
          path: console-proof
          if-no-files-found: error

  verify-console-correspondence:
    needs: rocq-console-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - uses: actions/download-artifact@v4
        with:
          name: rocq-console-proof
          path: console-proof

      - name: Check and execute extracted Console controls
        run: |
          set -euo pipefail
          cp console-proof/ConsoleImplementationKernel.hs .
          cabal exec -- ghc -i. -Wall -Werror -fno-code ConsoleImplementationKernel.hs
          cabal exec -- ghc -i. -Wall -Werror -fno-code app/ConsoleDecisionCorrespondenceMain.hs
          cabal exec -- runghc -Wall -Werror -i. app/ConsoleDecisionCorrespondenceMain.hs
          sha256sum ConsoleImplementationKernel.hs

      - name: Strict-typecheck console implementation authority
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Core/Authority.hs \
            src/Phil/Core/Callable.hs \
            src/Phil/IO/Console.hs \
            test/Phase1IOConsoleProvidersMain.hs

      - name: Re-run unchanged IO-CONSOLE pressure corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1IOConsoleProvidersMain.hs

      - name: Re-run authority-possession dependency corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1AuthorityPossessionMain.hs
