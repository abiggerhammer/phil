name: One-shot INT-007 StageContract Reconcile

on:
  push:
    branches:
      - phase1-audit-digest-subject-production-binding
    paths:
      - '.github/workflows/one-shot-int007-stage-contract-reconcile.yml'

concurrency:
  group: one-shot-int007-stage-contract-reconcile
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-audit-digest-subject-production-binding
      - name: Download verified INT-007 discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/int007-discovery
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10659032817/zip" \
            > /tmp/int007-discovery.zip
          unzip -q /tmp/int007-discovery.zip -d /tmp/int007-discovery
          test "$(sha256sum /tmp/int007-discovery/Upload-stage-contract-v1.tsv | awk '{print $1}')" = \
            b083f64116aef0d27242c82dddfa3f082f924f08e6dae66a2410d56e1f9c6e8f
          test "$(sha256sum /tmp/int007-discovery/Steve-stage-contract-v1.tsv | awk '{print $1}')" = \
            6747a2ab0bd1b35ba33ce5c30fdc801bcd89d1b43f56150a76d5f34c283e7526
      - name: Reconcile frozen StageContract summaries and manifest
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/int007-discovery/Upload-stage-contract-v1.tsv \
            handoff/phase1/runtime/upload-stage-contract-v1.tsv
          cp /tmp/int007-discovery/Steve-stage-contract-v1.tsv \
            handoff/phase1/runtime/steve-stage-contract-v1.tsv
          python3 scripts/build_phase1_int007_complete_manifest.py \
            --output handoff/phase1/manifest-v1.tsv
          python3 scripts/build_phase1_conformance_freeze.py --check
          python3 scripts/build_phase1_int007_complete_manifest.py \
            --output /tmp/phase1-int007-manifest-v1.tsv
          cmp handoff/phase1/manifest-v1.tsv /tmp/phase1-int007-manifest-v1.tsv
      - name: Commit exact regenerated freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "phil-ci"
          git config user.email "phil-ci@users.noreply.github.com"
          git rm .github/workflows/one-shot-int007-stage-contract-reconcile.yml
          git add \
            handoff/phase1/runtime/upload-stage-contract-v1.tsv \
            handoff/phase1/runtime/steve-stage-contract-v1.tsv \
            handoff/phase1/manifest-v1.tsv
          git diff --cached --check
          git diff --cached --quiet && {
            echo "No reconciliation changes required."
            exit 0
          }
          git commit -m "Reconcile INT-007 StageContract freeze"
          git push origin HEAD:phase1-audit-digest-subject-production-binding
