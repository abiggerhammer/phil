name: Temporary EXEC-021 shift composition

on:
  push:
    branches: [phase1-exec-021-fixed-width-shifts]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-exec-021-fixed-width-shifts
      - name: Apply guarded EXEC-021 source patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_s, old, new):
              path = Path(path_s)
              text = path.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  print(f'{path_s}: already patched')
                  return
              if count != 1:
                  raise SystemExit(f'{path_s}: expected one anchor, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          parser = 'src/Phil/Surface/GrammarV1/Parser.hs'
          replace_once(parser,
            '  , GrammarV1BinaryOperator (..)\n  , GrammarV1FailureTarget (..)\n',
            '  , GrammarV1BinaryOperator (..)\n  , GrammarV1ShiftOperator (..)\n  , GrammarV1FailureTarget (..)\n')
          replace_once(parser,
            '  | GrammarV1Remainder\n  deriving (Eq, Ord, Show)\n\ndata GrammarV1FailureTarget',
            '  | GrammarV1Remainder\n  deriving (Eq, Ord, Show)\n\ndata GrammarV1ShiftOperator\n  = GrammarV1ShiftLeft\n  | GrammarV1ShiftRight\n  deriving (Eq, Ord, Show)\n\ndata GrammarV1FailureTarget')
          replace_once(parser,
            '  | GrammarV1BinaryExpression\n      (Located GrammarV1Expression)\n      (Located GrammarV1BinaryOperator)\n      (Located GrammarV1Expression)\n',
            '  | GrammarV1ShiftExpression\n      (Located GrammarV1Expression)\n      (Located GrammarV1ShiftOperator)\n      (Located GrammarV1Expression)\n  | GrammarV1BinaryExpression\n      (Located GrammarV1Expression)\n      (Located GrammarV1BinaryOperator)\n      (Located GrammarV1Expression)\n')
          replace_once(parser,
            '  if command then parseCommandExpression else parseAdditiveExpression\n',
            '  if command then parseCommandExpression else parseShiftExpression\n')
          replace_once(parser,
            'parseAdditiveExpression :: Parser (Located GrammarV1Expression)\n',
            '''parseShiftExpression :: Parser (Located GrammarV1Expression)\nparseShiftExpression = do\n  first <- parseAdditiveExpression\n  parseMoreShiftExpression first\n\nparseMoreShiftExpression\n  :: Located GrammarV1Expression\n  -> Parser (Located GrammarV1Expression)\nparseMoreShiftExpression left = do\n  hasLeft <- peekSymbol "<<"\n  hasRight <- peekSymbol ">>"\n  if hasLeft || hasRight\n    then do\n      token <- if hasLeft then expectSymbol "<<" else expectSymbol ">>"\n      right <- parseAdditiveExpression\n      let operator = if hasLeft then GrammarV1ShiftLeft else GrammarV1ShiftRight\n          combined = Located\n            (SourceSpan\n              (sourceSpanStart (locatedSpan left))\n              (sourceSpanEnd (locatedSpan right)))\n            (GrammarV1ShiftExpression\n              left\n              (Located (locatedSpan token) operator)\n              right)\n      parseMoreShiftExpression combined\n    else pure left\n\nparseAdditiveExpression :: Parser (Located GrammarV1Expression)\n''')

          replace_once('src/Phil/Surface/GrammarV1/GenericTermScope.hs',
            '  GrammarV1BinaryExpression left _ right ->\n    expressionBinderSites left <> expressionBinderSites right\n',
            '  GrammarV1ShiftExpression left _ right ->\n    expressionBinderSites left <> expressionBinderSites right\n  GrammarV1BinaryExpression left _ right ->\n    expressionBinderSites left <> expressionBinderSites right\n')
          replace_once('src/Phil/Surface/GrammarV1/SequentialExecution.hs',
            '    GrammarV1BinaryExpression left _ right ->\n      finishAfterChildren source [left, right] state\n',
            '    GrammarV1ShiftExpression left _ right ->\n      finishAfterChildren source [left, right] state\n    GrammarV1BinaryExpression left _ right ->\n      finishAfterChildren source [left, right] state\n')
          replace_once('src/Phil/Surface/GrammarV1/LexicalReferenceScope.hs',
            '    GrammarV1BinaryExpression left _ right -> combineChecked\n',
            '    GrammarV1ShiftExpression left _ right -> combineChecked\n      (grammarV1CheckedExpressionReferences pending scope left)\n      (grammarV1CheckedExpressionReferences pending scope right)\n    GrammarV1BinaryExpression left _ right -> combineChecked\n')
          replace_once('src/Phil/Surface/GrammarV1/SemanticBindingState.hs',
            '    GrammarV1BinaryExpression left operator right ->\n      GrammarV1BinaryExpression\n',
            '    GrammarV1ShiftExpression left operator right ->\n      GrammarV1ShiftExpression\n        <$> rewriteExpression renames left\n        <*> pure operator\n        <*> rewriteExpression renames right\n    GrammarV1BinaryExpression left operator right ->\n      GrammarV1BinaryExpression\n')

          test = 'test/Phase1IntegerShiftMain.hs'
          replace_once(test,
            'import qualified Data.Text as Text\nimport Phil.Core.IntegerShift\n',
            'import qualified Data.Text as Text\nimport Phil.Core.FloatArithmetic (FloatFormat (..), floatDecimalLiteral)\nimport Phil.Core.IntegerShift\n')
          replace_once(test,
            '''floatShiftRejects :: Either String ()\nfloatShiftRejects = do\n  expression <- parseReturn "component C { return f >> k; }"\n  case evaluateGrammarV1NumericExpression (environment\n      [("f", NumericFloatValueStub), ("k", NumericUIntValue 8 1)]) expression of\n    _ -> Right ()\n\n-- The float rejection case is populated without inventing a FloatValue by\n-- parsing a conversion target that yields a float semantic value from an exact\n-- integer source.\npattern NumericFloatValueStub :: NumericValue\npattern NumericFloatValueStub <- _ where\n  NumericFloatValueStub = error "NumericFloatValueStub is not evaluated"\n''',
            '''floatShiftRejects :: Either String ()\nfloatShiftRejects = do\n  floatValue <- mapLeft show $ floatDecimalLiteral Float32 "1.0"\n  expression <- parseReturn "component C { return f >> k; }"\n  case evaluateGrammarV1NumericExpression (environment\n      [("f", NumericFloatValue floatValue), ("k", NumericUIntValue 8 1)]) expression of\n    Left (GrammarV1NumericShiftOperandIntegerRequired (NumericFloatType Float32)) -> Right ()\n    other -> Left ("floating operand entered shift semantics: " <> show other)\n''')
          PY
          git diff --check
          git diff --stat
      - name: Commit source composition
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add src/Phil/Surface/GrammarV1/Parser.hs \
                  src/Phil/Surface/GrammarV1/GenericTermScope.hs \
                  src/Phil/Surface/GrammarV1/SequentialExecution.hs \
                  src/Phil/Surface/GrammarV1/LexicalReferenceScope.hs \
                  src/Phil/Surface/GrammarV1/SemanticBindingState.hs \
                  test/Phase1IntegerShiftMain.hs
          git commit -m "phase1: compose fixed-width shift syntax"
          git push origin HEAD:phase1-exec-021-fixed-width-shifts
