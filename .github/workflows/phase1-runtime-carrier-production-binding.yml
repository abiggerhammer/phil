name: Phase 1 Runtime Carrier Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Assurance/Manifest.v'
      - 'proof/Phil/Assurance/EvidenceUse.v'
      - 'proof/Phil/Assurance/RuntimeCarrier.v'
      - 'proof/Phil/Assurance/RuntimeCarrierImplementation.v'
      - 'proof/Phil/Assurance/RuntimeCarrierImplementationExtraction.v'
      - 'proof/Phil/Core/RuntimePrimitiveIdentity.v'
      - 'proof/Phil/Core/SystemsRuntimeGraph.v'
      - 'proof/Phil/Systems/Runtime.v'
      - 'generated/RuntimeCarrierKernel.hs'
      - 'src/RuntimeCarrierKernel.hs'
      - 'src/Phil/Systems/RuntimeCarrierBinding.hs'
      - 'src/Phil/Systems/RuntimeCarrierCoverage.hs'
      - 'src/Phil/Systems/RuntimeCarrierCertification.hs'
      - 'src/Phil/Assurance/Verify.hs'
      - 'src/Phil/Systems/StageClosure.hs'
      - 'app/RuntimeCarrierDecisionCorrespondenceMain.hs'
      - 'app/RuntimeCarrierProductionBindingMain.hs'
      - 'test/Phase1RuntimeCarrierBindingMain.hs'
      - 'test/Phase1RuntimeCarrierCoverageMain.hs'
      - 'test/AssuranceMain.hs'
      - 'test/Phase1StageClosureMain.hs'
      - 'docs/phase-1/runtime-carrier-production-binding-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-runtime-carrier-production-binding.yml'
  push:
    branches: [main]
    paths:
      - 'generated/RuntimeCarrierKernel.hs'
      - 'src/RuntimeCarrierKernel.hs'
      - 'src/Phil/Systems/RuntimeCarrierBinding.hs'
      - 'src/Phil/Systems/RuntimeCarrierCoverage.hs'
      - 'src/Phil/Systems/RuntimeCarrierCertification.hs'
      - 'app/RuntimeCarrierProductionBindingMain.hs'
      - 'docs/phase-1/runtime-carrier-production-binding-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-runtime-carrier-production-binding.yml'

permissions:
  contents: read

jobs:
  exact-runtime-carrier-kernel:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Freshly extract exact Runtime Carrier kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/Manifest.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceUse.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Runtime.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimePrimitiveIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsRuntimeGraph.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/RuntimeCarrier.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/RuntimeCarrierImplementation.v
          rm -f RuntimeCarrierKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/RuntimeCarrierImplementationExtraction.v
          test -s RuntimeCarrierKernel.hs
          echo '803113d79bd8b0173f370bcef5997a8d6f756b62df01525bcc4cda53caa0db9f  RuntimeCarrierKernel.hs' | sha256sum -c -
          cmp RuntimeCarrierKernel.hs generated/RuntimeCarrierKernel.hs
          cmp RuntimeCarrierKernel.hs src/RuntimeCarrierKernel.hs
      - name: Record exact kernel identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-carrier-exact-kernel
          cp RuntimeCarrierKernel.hs runtime-carrier-exact-kernel/
          sha256sum \
            RuntimeCarrierKernel.hs \
            generated/RuntimeCarrierKernel.hs \
            src/RuntimeCarrierKernel.hs \
            > runtime-carrier-exact-kernel/PHIL-ASSURE-CARRIER-001.kernel.sha256
          cat runtime-carrier-exact-kernel/PHIL-ASSURE-CARRIER-001.kernel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-carrier-exact-kernel
          path: runtime-carrier-exact-kernel
          if-no-files-found: error

  verify-runtime-carrier-production-binding:
    needs: exact-runtime-carrier-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build broad library regression surface
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Strictly typecheck bound Runtime Carrier surface
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -Wno-unused-imports -fno-code src/RuntimeCarrierKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/RuntimeCarrierBinding.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/RuntimeCarrierCoverage.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/RuntimeCarrierCertification.hs
          cabal exec -- ghc -isrc -Wall -Werror -Wno-unused-imports -fno-code app/RuntimeCarrierDecisionCorrespondenceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/RuntimeCarrierProductionBindingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1RuntimeCarrierBindingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1RuntimeCarrierCoverageMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/AssuranceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1StageClosureMain.hs
      - name: Execute exact extracted-kernel controls
        run: cabal exec -- runghc -Wall -Werror -Wno-unused-imports -isrc app/RuntimeCarrierDecisionCorrespondenceMain.hs
      - name: Execute production-binding controls
        run: cabal exec -- runghc -Wall -Werror -isrc app/RuntimeCarrierProductionBindingMain.hs
      - name: Re-run DEP-001 establishment corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimeCarrierBindingMain.hs
      - name: Re-run DEP-002 coverage/transfer corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimeCarrierCoverageMain.hs
      - name: Re-run unchanged 23-case assurance corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/AssuranceMain.hs
      - name: Re-run unchanged 20-case final StageClosure corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1StageClosureMain.hs
      - name: Record production binding identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-carrier-production-binding
          sha256sum \
            src/RuntimeCarrierKernel.hs \
            src/Phil/Systems/RuntimeCarrierBinding.hs \
            src/Phil/Systems/RuntimeCarrierCoverage.hs \
            src/Phil/Systems/RuntimeCarrierCertification.hs \
            app/RuntimeCarrierProductionBindingMain.hs \
            test/Phase1RuntimeCarrierBindingMain.hs \
            test/Phase1RuntimeCarrierCoverageMain.hs \
            test/AssuranceMain.hs \
            test/Phase1StageClosureMain.hs \
            > runtime-carrier-production-binding/PHIL-ASSURE-CARRIER-001.production.sha256
          cat runtime-carrier-production-binding/PHIL-ASSURE-CARRIER-001.production.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-carrier-production-binding
          path: runtime-carrier-production-binding
          if-no-files-found: error
