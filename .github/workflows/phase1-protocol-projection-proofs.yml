name: Phase 1 Protocol Projection Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ProtocolProjection.v'
      - 'proof/Phil/Core/ProtocolProjectionImplementation.v'
      - 'proof/Phil/Core/ProtocolProjectionImplementationExtraction.v'
      - 'proof/Phil/Core/ProtocolIdentity.v'
      - 'proof/Phil/Core/Session.v'
      - 'src/ProtocolProjectionKernel.hs'
      - 'src/Phil/Core/Protocol/Generic.hs'
      - 'src/Phil/Core/Protocol/Family.hs'
      - 'test/Phase1ProtocolGenericEndpointMain.hs'
      - 'test/Phase1ProtocolProjectionMain.hs'
      - 'app/ProtocolProjectionDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/protocol-generic-endpoint-v1.md'
      - 'docs/phase-1/protocol-projection-v1.md'
      - 'docs/phase-1/protocol-projection-proof-v1.md'
      - 'docs/phase-1/protocol-projection-implementation-refinement-v1.md'
      - 'docs/phase-1/protocol-projection-production-binding-v1.md'
      - '.github/workflows/phase1-protocol-projection-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ProtocolProjection.v'
      - 'proof/Phil/Core/ProtocolProjectionImplementation.v'
      - 'proof/Phil/Core/ProtocolProjectionImplementationExtraction.v'
      - 'proof/Phil/Core/ProtocolIdentity.v'
      - 'proof/Phil/Core/Session.v'
      - 'src/ProtocolProjectionKernel.hs'
      - 'src/Phil/Core/Protocol/Generic.hs'
      - 'src/Phil/Core/Protocol/Family.hs'
      - 'test/Phase1ProtocolGenericEndpointMain.hs'
      - 'test/Phase1ProtocolProjectionMain.hs'
      - 'app/ProtocolProjectionDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/protocol-generic-endpoint-v1.md'
      - 'docs/phase-1/protocol-projection-v1.md'
      - 'docs/phase-1/protocol-projection-proof-v1.md'
      - 'docs/phase-1/protocol-projection-implementation-refinement-v1.md'
      - 'docs/phase-1/protocol-projection-production-binding-v1.md'
      - '.github/workflows/phase1-protocol-projection-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-protocol-projection-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-PROT-PROJ-001 proof and exact production kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Session.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolProjectionImplementation.v
          rm -f ProtocolProjectionKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProtocolProjectionImplementationExtraction.v
          test -s ProtocolProjectionKernel.hs
          grep -q 'decideDeclaredProjectionRoleByFact' ProtocolProjectionKernel.hs
          grep -q 'decideProjectionInstanceByFact' ProtocolProjectionKernel.hs
          grep -q 'decideProjectionSessionByFact' ProtocolProjectionKernel.hs
          grep -q 'planProtocolProjection' ProtocolProjectionKernel.hs
          grep -q 'planTransferredProtocolContract' ProtocolProjectionKernel.hs
          cmp ProtocolProjectionKernel.hs src/ProtocolProjectionKernel.hs
          kernel_sha256="$(sha256sum ProtocolProjectionKernel.hs | cut -d' ' -f1)"
          printf 'kernel_sha256=%s\n' "$kernel_sha256"
          test "$kernel_sha256" = '5c4f9dd27b3b54a4cf596dd6f74b8090bf1442891207a4442a637585e580a556'

      - name: Record proof and production-kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p protocol-projection-proof
          cp \
            proof/Phil/Core/ProtocolProjection.v \
            proof/Phil/Core/ProtocolProjection.vo \
            proof/Phil/Core/ProtocolProjectionImplementation.v \
            proof/Phil/Core/ProtocolProjectionImplementation.vo \
            proof/Phil/Core/ProtocolProjectionImplementationExtraction.v \
            proof/Phil/Core/ProtocolProjectionImplementationExtraction.vo \
            ProtocolProjectionKernel.hs \
            protocol-projection-proof/
          sha256sum \
            protocol-projection-proof/ProtocolProjection.v \
            protocol-projection-proof/ProtocolProjection.vo \
            protocol-projection-proof/ProtocolProjectionImplementation.v \
            protocol-projection-proof/ProtocolProjectionImplementation.vo \
            protocol-projection-proof/ProtocolProjectionKernel.hs \
            > protocol-projection-proof/PHIL-PROT-PROJ-001.proof.sha256
          {
            printf '%s\n' 'obligation=PHIL-PROT-PROJ-001'
            printf '%s\n' 'evidence=Rocq-9.2.0'
            cat protocol-projection-proof/PHIL-PROT-PROJ-001.proof.sha256
          } > protocol-projection-proof/PHIL-PROT-PROJ-001.proof-certificate.txt
          cat protocol-projection-proof/PHIL-PROT-PROJ-001.proof.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-protocol-projection-production-binding
          path: protocol-projection-proof
          if-no-files-found: error

  verify-protocol-projection-correspondence:
    needs: rocq-protocol-projection-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary protocol projection regression substrate
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - uses: actions/download-artifact@v4
        with:
          name: rocq-protocol-projection-production-binding
          path: protocol-projection-proof

      - name: Verify exact extracted production kernel and direct controls
        run: |
          set -euo pipefail
          cmp protocol-projection-proof/ProtocolProjectionKernel.hs src/ProtocolProjectionKernel.hs
          test "$(sha256sum src/ProtocolProjectionKernel.hs | cut -d' ' -f1)" = \
            '5c4f9dd27b3b54a4cf596dd6f74b8090bf1442891207a4442a637585e580a556'
          ghc -Wall -Werror -fno-code protocol-projection-proof/ProtocolProjectionKernel.hs
          ghc -Wall -Werror -fno-code src/ProtocolProjectionKernel.hs
          ghc -Wall -Werror \
            -isrc \
            app/ProtocolProjectionDecisionCorrespondenceMain.hs \
            -o protocol-projection-kernel-controls
          ./protocol-projection-kernel-controls

      - name: Typecheck bound protocol projection production paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Protocol/Generic.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Protocol/Family.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1ProtocolGenericEndpointMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1ProtocolProjectionMain.hs

      - name: Re-run unchanged PROT-003 and PROT-004 pressure corpora
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1ProtocolGenericEndpointMain.hs
          cabal exec -- runghc -isrc test/Phase1ProtocolProjectionMain.hs

      - name: Record implementation-refinement production-binding identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p protocol-projection-production-binding
          sha256sum \
            src/ProtocolProjectionKernel.hs \
            src/Phil/Core/Protocol/Generic.hs \
            src/Phil/Core/Protocol/Family.hs \
            test/Phase1ProtocolGenericEndpointMain.hs \
            test/Phase1ProtocolProjectionMain.hs \
            app/ProtocolProjectionDecisionCorrespondenceMain.hs \
            proof/Phil/Core/ProtocolProjectionImplementation.v \
            docs/phase-1/protocol-projection-implementation-refinement-v1.md \
            docs/phase-1/protocol-projection-production-binding-v1.md \
            > protocol-projection-production-binding/PHIL-PROT-PROJ-001.closeout.sha256
          cat protocol-projection-production-binding/PHIL-PROT-PROJ-001.closeout.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-projection-production-binding
          path: protocol-projection-production-binding
          if-no-files-found: error
