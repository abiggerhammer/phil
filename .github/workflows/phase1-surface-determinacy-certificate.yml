name: Phase 1 Surface Determinacy Certificate

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificateCheck.v'
      - 'docs/phase-1/surface-determinacy-certificate-v1.md'
      - '.github/workflows/phase1-surface-determinacy-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificateCheck.v'
      - 'docs/phase-1/surface-determinacy-certificate-v1.md'
      - '.github/workflows/phase1-surface-determinacy-certificate.yml'

permissions:
  contents: read

jobs:
  derive-exact-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact determinacy inventory
        shell: bash
        run: |
          set -euo pipefail
          output="$(python3 scripts/check_phase1_surface_determinacy.py)"
          printf '%s\n' "$output"
          grep -F '15 reviewed local overlap(s), inventory exact' <<<"$output"
      - name: Derive exact grammar and certificate twice
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          cp proof/Phil/Surface/Grammar.v /tmp/Grammar.first.v
          cp proof/Phil/Surface/GrammarDeterminacyCertificate.v /tmp/GrammarDeterminacyCertificate.first.v
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          cmp /tmp/Grammar.first.v proof/Phil/Surface/Grammar.v
          cmp /tmp/GrammarDeterminacyCertificate.first.v proof/Phil/Surface/GrammarDeterminacyCertificate.v
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: exact-phase1-surface-determinacy-certificate
          path: |
            proof/Phil/Surface/Grammar.v
            proof/Phil/Surface/GrammarDeterminacyCertificate.v
          if-no-files-found: error

  rocq-surface-certificate:
    needs: derive-exact-certificate
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exact-phase1-surface-determinacy-certificate
          path: proof/Phil/Surface
      - name: Compile exact grammar determinacy certificate binding
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificateCheck.v
      - name: Record certificate proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-determinacy-certificate
          cp \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.vo \
            proof/Phil/Surface/GrammarDeterminacyCertificateCheck.v \
            proof/Phil/Surface/GrammarDeterminacyCertificateCheck.vo \
            surface-determinacy-certificate/
          sha256sum \
            grammar/phase1-surface.ebnf \
            grammar/phase1-surface-determinacy.json \
            scripts/derive_phase1_surface_grammar.py \
            scripts/check_phase1_surface_determinacy.py \
            scripts/derive_phase1_surface_determinacy_certificate.py \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.vo \
            proof/Phil/Surface/GrammarDeterminacyCertificateCheck.v \
            proof/Phil/Surface/GrammarDeterminacyCertificateCheck.vo \
            > surface-determinacy-certificate/certificate-identities.sha256
          cat surface-determinacy-certificate/certificate-identities.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-determinacy-certificate
          path: surface-determinacy-certificate
          if-no-files-found: error
