name: Phase 1 INT-011 Darwin Distribution Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'src/Phil/Verification/DistributionRelease.hs'
      - 'app/Phase1INT011DistributionReleaseMain.hs'
      - 'test/Phase1INT011DistributionReleaseMain.hs'
      - 'scripts/release/build-notarized-phil-phase1-darwin-package.sh'
      - 'scripts/release/notarize-darwin-archive.sh'
      - 'scripts/release/smoke-phil-phase1-package.sh'
      - 'handoff/phase1/manifest-v1.tsv'
      - 'docs/tutorials/tour-phase1.md'
      - 'docs/phase-1/surface-grammar-v1.md'
      - 'docs/phase-1/int-011-darwin-distribution-release-v1.md'
      - 'examples/run/**'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int011-darwin-distribution-release.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Verification/DistributionRelease.hs'
      - 'app/Phase1INT011DistributionReleaseMain.hs'
      - 'test/Phase1INT011DistributionReleaseMain.hs'
      - 'scripts/release/build-notarized-phil-phase1-darwin-package.sh'
      - 'scripts/release/notarize-darwin-archive.sh'
      - 'scripts/release/smoke-phil-phase1-package.sh'
      - 'handoff/phase1/manifest-v1.tsv'
      - 'docs/tutorials/tour-phase1.md'
      - 'docs/phase-1/surface-grammar-v1.md'
      - 'docs/phase-1/int-011-darwin-distribution-release-v1.md'
      - 'examples/run/**'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int011-darwin-distribution-release.yml'

permissions:
  contents: read

env:
  PHIL_NOTARY_TIMEOUT_SECONDS: '1200'
  PHIL_NOTARY_POLL_SECONDS: '30'

jobs:
  darwin-build-submit:
    runs-on: macos-26
    environment: macos-release
    timeout-minutes: 35
    env:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Import Developer ID and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/phil-developer-id.p12"
          p8="$RUNNER_TEMP/AuthKey.p8"
          export P12_PATH="$p12" P8_PATH="$p8"
          python3 <<'PY'
          import base64
          import os

          with open(os.environ['P12_PATH'], 'wb') as output:
              output.write(base64.b64decode(os.environ['APPLE_DEVELOPER_ID_P12_BASE64']))
          with open(os.environ['P8_PATH'], 'wb') as output:
              output.write(base64.b64decode(os.environ['APPLE_NOTARY_KEY_P8_BASE64']))
          PY
          chmod 600 "$p12" "$p8"

          keychain="$RUNNER_TEMP/phil-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" \
            -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'\"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          printf 'Developer ID identity: %s\n' "$identity"
          echo "PHIL_DARWIN_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$p8" >> "$GITHUB_ENV"

      - name: Build signed Darwin distribution
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phil-int011-darwin"
          mkdir -p "$out"
          bash scripts/release/build-notarized-phil-phase1-darwin-package.sh build "$out" \
            | tee "$out/build-sign-evidence.txt"

          archive='phil-0.1.0-phase1-aarch64-apple-darwin.zip'
          test -s "$out/$archive"
          test -s "$out/$archive.sha256"
          test -s "$out/$archive.release"
          test -s "$out/$archive.release.sha256"

      - name: Submit exact signed distribution for notarization
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phil-int011-darwin"
          archive="$out/phil-0.1.0-phase1-aarch64-apple-darwin.zip"
          bash scripts/release/notarize-darwin-archive.sh submit "$archive" "$out"
          test -s "$out/$(basename "$archive").notary-id"
          test -s "$out/$(basename "$archive").notary-submit.json"

      - name: Preserve exact signed notarization submission
        uses: actions/upload-artifact@v4
        with:
          name: phil-int011-darwin-notary-submission
          path: |
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.sha256
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.release
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.release.sha256
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.notary-id
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.notary-submit.json
            ${{ runner.temp }}/phil-int011-darwin/build-sign-evidence.txt
          if-no-files-found: error
          retention-days: 7

  darwin-poll-assess:
    needs:
      - darwin-build-submit
    runs-on: macos-26
    environment: macos-release
    timeout-minutes: 35
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers

      - name: Restore exact signed notarization submission
        uses: actions/download-artifact@v4
        with:
          name: phil-int011-darwin-notary-submission
          path: ${{ runner.temp }}/phil-int011-darwin

      - name: Materialize notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          p8="$RUNNER_TEMP/AuthKey.p8"
          export P8_PATH="$p8"
          python3 <<'PY'
          import base64
          import os

          with open(os.environ['P8_PATH'], 'wb') as output:
              output.write(base64.b64decode(os.environ['APPLE_NOTARY_KEY_P8_BASE64']))
          PY
          chmod 600 "$p8"
          echo "APPLE_NOTARY_KEY_PATH=$p8" >> "$GITHUB_ENV"

      - name: Poll notarization to a bounded result
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phil-int011-darwin"
          archive="$out/phil-0.1.0-phase1-aarch64-apple-darwin.zip"
          bash scripts/release/notarize-darwin-archive.sh poll "$archive" "$out" \
            | tee "$out/notarization-evidence.txt"
          grep -q '^notarization=Accepted$' "$out/notarization-evidence.txt"

      - name: Verify quarantined signed distribution
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phil-int011-darwin"
          bash scripts/release/build-notarized-phil-phase1-darwin-package.sh assess "$out" \
            | tee "$out/smoke-evidence.txt"
          grep -q '^PASS: Developer-ID signed, notarized, quarantined Phase-1 Phil distribution$' \
            "$out/smoke-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: phil-int011-darwin-distribution
          path: |
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.sha256
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.release
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.release.sha256
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.notary-id
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.notary-submit.json
            ${{ runner.temp }}/phil-int011-darwin/phil-0.1.0-phase1-aarch64-apple-darwin.zip.notary-info.json
            ${{ runner.temp }}/phil-int011-darwin/build-sign-evidence.txt
            ${{ runner.temp }}/phil-int011-darwin/notarization-evidence.txt
            ${{ runner.temp }}/phil-int011-darwin/smoke-evidence.txt
          if-no-files-found: error
          retention-days: 7
