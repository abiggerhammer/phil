name: Temporary R3 LLVM function-coverage remediation

on:
  push:
    branches: [phase1-review-r3-llvm-function-coverage]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'ci: stage guarded R3 LLVM function-coverage remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-review-r3-llvm-function-coverage
      - name: Apply guarded verifier patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one anchor in {path}, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          verify = Path('src/Phil/LLVM/Verify.hs')
          replace_once(
              verify,
              '  | LLVMFunctionParametersMismatch Text [LLVMParameter] [LLVMParameter]\n  | LLVMMissingEntryBlock Text LLVMBlockId\n',
              '  | LLVMFunctionParametersMismatch Text [LLVMParameter] [LLVMParameter]\n'
              '  | LLVMFunctionSetMismatch [Text] [Text]\n'
              '  | LLVMMissingEntryBlock Text LLVMBlockId\n')

          replace_once(
              verify,
              '  let expectedArtifact = lowerer (targetProfileFromContext context) systemsArtifact\n'
              '      expectedModule = llvmArtifactModule expectedArtifact\n'
              '  forM_ (Map.toAscList (llvmFunctions expectedModule)) $ \\(functionName, expectedFunction) ->\n',
              '  let expectedArtifact = lowerer (targetProfileFromContext context) systemsArtifact\n'
              '      expectedModule = llvmArtifactModule expectedArtifact\n'
              '      expectedFunctions = llvmFunctions expectedModule\n'
              '      actualFunctions = llvmFunctions actualModule\n'
              '      expectedFunctionNames = Map.keys expectedFunctions\n'
              '      actualFunctionNames = Map.keys actualFunctions\n'
              '  unless (actualFunctionNames == expectedFunctionNames) $\n'
              '    Left (LLVMFunctionSetMismatch expectedFunctionNames actualFunctionNames)\n'
              '  forM_ (Map.toAscList expectedFunctions) $ \\(functionName, expectedFunction) ->\n')
          PY
          git diff --check
          git diff -- src/Phil/LLVM/Verify.hs
      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add src/Phil/LLVM/Verify.hs
          git commit -m "review: close LLVM ordinary function coverage"
          git push origin HEAD:phase1-review-r3-llvm-function-coverage
