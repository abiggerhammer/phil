name: Phase 1 Surface Grammar Record Data Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Surface/SurfaceRecordDataProductionCarrier*.v'
      - 'generated/SurfaceGrammarAstRecordDataCarrierKernel.hs'
      - 'src/SurfaceGrammarAstRecordDataCarrierKernel.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstDeclarationCommon.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstRecordData.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstRecordDataRepresentationBridge.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'test/Phase1GrammarV1ReferenceAstRecordDataRepresentationMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - '.github/workflows/phase1-surface-grammar-record-data-production-binding.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'scripts/check_phase1_surface_corpus.py'
      - 'proof/Phil/Surface/GrammarAstRecord*.v'
      - 'proof/Phil/Surface/GrammarAstGeneric*.v'
      - 'proof/Phil/Surface/GrammarAstStructuralMode*.v'
      - 'proof/Phil/Surface/GrammarAstData*.v'
      - 'proof/Phil/Surface/GrammarAstVariant*.v'
      - 'proof/Phil/Surface/GrammarAstTopLevelImplementation*.v'
      - 'proof/Phil/Surface/SurfaceRecordDataProductionCarrier*.v'
      - 'generated/SurfaceGrammarAstRecordDataCarrierKernel.hs'
      - 'src/SurfaceGrammarAstRecordDataCarrierKernel.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'src/Phil/Surface/GrammarV1/Parser.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstDeclarationCommon.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstRecordData.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstRecordDataRepresentationBridge.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'test/Phase1GrammarV1ReferenceAstRecordDataRepresentationMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - '.github/workflows/phase1-surface-grammar-record-data-production-binding.yml'

permissions:
  contents: read

jobs:
  kernel-identity:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check

      - name: Fresh-extract staged and compact record/data kernels
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          {
            echo '-Q proof/Phil Phil'
            find proof/Phil/Surface -maxdepth 1 -type f -name 'Grammar*.v' -print | sort
            echo 'proof/Phil/Surface/SurfaceRecordDataProductionCarrier.v'
            echo 'proof/Phil/Surface/SurfaceRecordDataProductionCarrierExtraction.v'
          } > _CoqProject.surface-record-data-production-binding
          rocq makefile -f _CoqProject.surface-record-data-production-binding \
            -o Makefile.surface-record-data-production-binding
          make -f Makefile.surface-record-data-production-binding -j2 \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentationExtraction.vo \
            proof/Phil/Surface/GrammarAstTopLevelImplementationCarrierExtraction.vo \
            proof/Phil/Surface/GrammarAstRecordDataImplementationRepresentationExtraction.vo \
            proof/Phil/Surface/SurfaceRecordDataProductionCarrierExtraction.vo
          echo 'f912067f823bb55902898cb0238602b3801b7fb142adb98bcf012021a21852b4  SurfaceGrammarAstTopLevelRepresentationKernel.hs' | sha256sum -c -
          echo 'ed31042e87c0a741586a64a4edcb0538d55fa509f1574984c25d375c8be386a2  SurfaceGrammarAstTopLevelCarrierKernel.hs' | sha256sum -c -
          test -s SurfaceGrammarAstRecordDataRepresentationKernel.hs
          sha256sum SurfaceGrammarAstRecordDataRepresentationKernel.hs
          sha256sum SurfaceGrammarAstRecordDataCarrierKernel.hs
          diff -u \
            SurfaceGrammarAstRecordDataCarrierKernel.hs \
            generated/SurfaceGrammarAstRecordDataCarrierKernel.hs
          diff -u \
            generated/SurfaceGrammarAstRecordDataCarrierKernel.hs \
            src/SurfaceGrammarAstRecordDataCarrierKernel.hs

  production-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Strict-typecheck checked-in compact record/data carrier
        run: ghc -Wall -Werror -Wno-name-shadowing -fno-code src/SurfaceGrammarAstRecordDataCarrierKernel.hs

      - name: Check certified and production record/data projections on full corpus
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc --make \
            -Wall -Werror -Wno-name-shadowing \
            -isrc \
            test/Phase1GrammarV1ReferenceAstRecordDataRepresentationMain.hs \
            -o /tmp/phase1-surface-record-data-production-binding
          python3 scripts/check_phase1_surface_corpus.py --emit-parser-cases \
            | /tmp/phase1-surface-record-data-production-binding
