name: Phase 1 Audit Claim Substitution

on:
  pull_request:
    paths:
      - 'src/Phil/Core/Focusing.hs'
      - 'test/Phase1AuditClaimSubstitutionMain.hs'
      - 'docs/phase-1/audit-claim-substitution-remediation-v1.md'
      - '.github/workflows/phase1-audit-claim-substitution.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/Focusing.hs'
      - 'test/Phase1AuditClaimSubstitutionMain.hs'
      - 'docs/phase-1/audit-claim-substitution-remediation-v1.md'
      - '.github/workflows/phase1-audit-claim-substitution.yml'

permissions:
  contents: read

jobs:
  claim-substitution-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck claim substitution repair and audit replay
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Focusing.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1AuditClaimSubstitutionMain.hs

      - name: Replay PHIL-AUD-CLAIM-SUBSTITUTION-001
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1AuditClaimSubstitutionMain.hs

      - name: Replay existing focusing and discharge controls
        run: cabal test phil-focusing-tests phil-discharge-tests --test-show-details=direct
