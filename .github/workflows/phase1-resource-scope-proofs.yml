name: Phase 1 Resource Scope Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'test/Phase1BranchLocalLinearLeakMain.hs'
      - 'test/Phase1AffineBranchAsymmetryMain.hs'
      - 'test/Phase1ScopedLoanBoundaryMain.hs'
      - 'test/Phase1TerminalArmExclusionMain.hs'
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'proof/Phil/Core/ProcessJoin.v'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'proof/Phil/Core/ResourceScope.v'
      - 'proof/Phil/Core/ResourceScopeImplementation.v'
      - 'proof/Phil/Core/ResourceScopeImplementationExtraction.v'
      - 'app/ResourceScopeDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-scope-proof-v1.md'
      - 'docs/phase-1/resource-scope-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-scope-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'test/Phase1BranchLocalLinearLeakMain.hs'
      - 'test/Phase1AffineBranchAsymmetryMain.hs'
      - 'test/Phase1ScopedLoanBoundaryMain.hs'
      - 'test/Phase1TerminalArmExclusionMain.hs'
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'proof/Phil/Core/ProcessJoin.v'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'proof/Phil/Core/ResourceScope.v'
      - 'proof/Phil/Core/ResourceScopeImplementation.v'
      - 'proof/Phil/Core/ResourceScopeImplementationExtraction.v'
      - 'app/ResourceScopeDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-scope-proof-v1.md'
      - 'docs/phase-1/resource-scope-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-scope-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-resource-scope-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-RES-SCOPE-001 proof and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceScopeImplementation.v
          rm -f ResourceScopeKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceScopeImplementationExtraction.v
          test -s ResourceScopeKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-resource-scope-proof
          cp \
            proof/Phil/Core/ResourceScope.v \
            proof/Phil/Core/ResourceScope.vo \
            proof/Phil/Core/ResourceScopeImplementation.v \
            proof/Phil/Core/ResourceScopeImplementation.vo \
            ResourceScopeKernel.hs \
            phase1-resource-scope-proof/
          sha256sum \
            proof/Phil/Core/ResourceScope.v \
            proof/Phil/Core/ResourceScope.vo \
            proof/Phil/Core/ResourceScopeImplementation.v \
            proof/Phil/Core/ResourceScopeImplementation.vo \
            ResourceScopeKernel.hs \
            > phase1-resource-scope-proof/PHIL-RES-SCOPE-001.proof.sha256
          {
            echo 'obligation=PHIL-RES-SCOPE-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat phase1-resource-scope-proof/PHIL-RES-SCOPE-001.proof.sha256
          } > phase1-resource-scope-proof/PHIL-RES-SCOPE-001.proof-certificate.txt
          cat phase1-resource-scope-proof/PHIL-RES-SCOPE-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-resource-scope-proof
          path: phase1-resource-scope-proof
          if-no-files-found: error

  verify-resource-scope-correspondence:
    needs: rocq-resource-scope-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - uses: actions/download-artifact@v4
        with:
          name: rocq-resource-scope-proof
          path: phase1-resource-scope-proof
      - name: Check and execute extracted Resource Scope controls
        shell: bash
        run: |
          set -euo pipefail
          cp phase1-resource-scope-proof/ResourceScopeKernel.hs ResourceScopeKernel.hs
          ghc -Wall -Werror -fno-code ResourceScopeKernel.hs
          ghc -i. -Wall -Werror -fno-code app/ResourceScopeDecisionCorrespondenceMain.hs
          runghc -i. app/ResourceScopeDecisionCorrespondenceMain.hs
          sha256sum ResourceScopeKernel.hs
      - name: Re-run unchanged RES-005 through RES-008 correspondence corpus
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1BranchLocalLinearLeakMain.hs
          cabal exec -- runghc -isrc test/Phase1AffineBranchAsymmetryMain.hs
          cabal exec -- runghc -isrc test/Phase1ScopedLoanBoundaryMain.hs
          cabal exec -- runghc -isrc test/Phase1TerminalArmExclusionMain.hs
