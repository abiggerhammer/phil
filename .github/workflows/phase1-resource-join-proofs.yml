name: Phase 1 Resource Join Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'src/Phil/Systems/SubjectCorrespondence.hs'
      - 'src/Phil/Systems/ProtocolStateCorrespondence.hs'
      - 'test/Main.hs'
      - 'test/ProcessMain.hs'
      - 'test/Phase1SubjectCorrespondenceMain.hs'
      - 'test/Phase1ControlStateProjectionMain.hs'
      - 'test/Phase1ProtocolStateCorrespondenceMain.hs'
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'proof/Phil/Core/ProcessJoin.v'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'proof/Phil/Core/ResourceJoinImplementation.v'
      - 'proof/Phil/Core/ResourceJoinImplementationExtraction.v'
      - 'app/Phase1ResourceJoinCertificationMain.hs'
      - 'app/ResourceJoinDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-join-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-join-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'src/Phil/Systems/SubjectCorrespondence.hs'
      - 'src/Phil/Systems/ProtocolStateCorrespondence.hs'
      - 'test/Main.hs'
      - 'test/ProcessMain.hs'
      - 'test/Phase1SubjectCorrespondenceMain.hs'
      - 'test/Phase1ControlStateProjectionMain.hs'
      - 'test/Phase1ProtocolStateCorrespondenceMain.hs'
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'proof/Phil/Core/ProcessJoin.v'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'proof/Phil/Core/ResourceJoinImplementation.v'
      - 'proof/Phil/Core/ResourceJoinImplementationExtraction.v'
      - 'app/Phase1ResourceJoinCertificationMain.hs'
      - 'app/ResourceJoinDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-join-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-join-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-resource-join:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-RES-JOIN-001 and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoinImplementation.v
          rm -f ResourceJoinKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoinImplementationExtraction.v
          test -s ResourceJoinKernel.hs
          mkdir -p phase1-resource-join-proof
          cp \
            proof/Phil/Core/ResourceJoin.v \
            proof/Phil/Core/ResourceJoin.vo \
            proof/Phil/Core/ResourceJoinImplementation.v \
            proof/Phil/Core/ResourceJoinImplementation.vo \
            ResourceJoinKernel.hs \
            phase1-resource-join-proof/
          sha256sum ResourceJoinKernel.hs \
            > phase1-resource-join-proof/ResourceJoinKernel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-resource-join-proof
          path: phase1-resource-join-proof
          if-no-files-found: error

  certify-phase1-resource-join:
    needs: rocq-phase1-resource-join
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-resource-join-proof
          path: phase1-resource-join-proof
      - name: Check and execute extracted Resource Join controls
        shell: bash
        run: |
          set -euo pipefail
          cp phase1-resource-join-proof/ResourceJoinKernel.hs ResourceJoinKernel.hs
          ghc -Wall -Werror -fno-code ResourceJoinKernel.hs
          ghc -i. -Wall -Werror -fno-code app/ResourceJoinDecisionCorrespondenceMain.hs
          runghc -i. app/ResourceJoinDecisionCorrespondenceMain.hs
          sha256sum ResourceJoinKernel.hs
      - name: Typecheck certifier
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code app/Phase1ResourceJoinCertificationMain.hs
      - name: Re-run resource join correspondence
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Main.hs
          cabal exec -- runghc -isrc test/ProcessMain.hs
          cabal exec -- runghc -isrc test/Phase1SubjectCorrespondenceMain.hs
          cabal exec -- runghc -isrc test/Phase1ControlStateProjectionMain.hs
          cabal exec -- runghc -isrc test/Phase1ProtocolStateCorrespondenceMain.hs
      - name: Emit PHIL-RES-JOIN-001 certificate and correspondence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-resource-join-certification
          cabal exec -- runghc -isrc app/Phase1ResourceJoinCertificationMain.hs \
            phase1-resource-join-proof/ResourceJoin.v \
            phase1-resource-join-proof/ResourceJoin.vo \
            phase1-resource-join-certification/PHIL-RES-JOIN-001.rocq.cert
          sha256sum \
            src/Phil/Systems/ControlStateProjection.hs \
            src/Phil/Systems/SubjectCorrespondence.hs \
            src/Phil/Systems/ProtocolStateCorrespondence.hs \
            test/Main.hs \
            test/ProcessMain.hs \
            test/Phase1SubjectCorrespondenceMain.hs \
            test/Phase1ControlStateProjectionMain.hs \
            test/Phase1ProtocolStateCorrespondenceMain.hs \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ResourceJoin.v \
            proof/Phil/Core/ResourceJoinImplementation.v \
            proof/Phil/Core/ResourceJoinImplementationExtraction.v \
            app/Phase1ResourceJoinCertificationMain.hs \
            app/ResourceJoinDecisionCorrespondenceMain.hs \
            docs/phase-1/resource-join-implementation-refinement-v1.md \
            > phase1-resource-join-certification/PHIL-RES-JOIN-001.correspondence.sha256
          sha256sum ResourceJoinKernel.hs \
            > phase1-resource-join-certification/ResourceJoinKernel.sha256
          cat phase1-resource-join-certification/PHIL-RES-JOIN-001.rocq.cert
          sha256sum phase1-resource-join-certification/PHIL-RES-JOIN-001.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-resource-join-proof-certification
          path: phase1-resource-join-certification
          if-no-files-found: error
