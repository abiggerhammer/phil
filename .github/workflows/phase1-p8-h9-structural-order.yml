name: Phase 1 P8-H9 D2 structural order preflight

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/P8D2StructuralOrderModel.v'
      - 'proof/Phil/Verification/P8H8UnicodeScalarOrder.v'
      - 'proof/Phil/Verification/P8H9StructuralOrderCoherence.v'
      - 'docs/phase-1/p8-h9-structural-order-coherence-v1.md'
      - '.github/workflows/phase1-p8-h9-structural-order.yml'
  push:
    branches:
      - main
      - 'scratch/p8-h9-*'
    paths:
      - 'proof/Phil/Verification/P8D2StructuralOrderModel.v'
      - 'proof/Phil/Verification/P8H8UnicodeScalarOrder.v'
      - 'proof/Phil/Verification/P8H9StructuralOrderCoherence.v'
      - 'docs/phase-1/p8-h9-structural-order-coherence-v1.md'
      - '.github/workflows/phase1-p8-h9-structural-order.yml'

permissions:
  contents: read

jobs:
  rocq-structural-order:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject H9 axioms and incomplete proof declarations
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Admitted|admit|Abort)[[:space:].]' proof/Phil/Verification/P8H9StructuralOrderCoherence.v; then
            echo 'H9 must not add axioms, parameters or incomplete proofs' >&2
            exit 1
          fi
      - name: Compile unchanged C1 D1 D2 H8 plus H9 and recursively check all objects
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq -v
          : > /tmp/p8-h9-assumptions.log
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8H8UnicodeScalarOrder P8H9StructuralOrderCoherence; do
            rocq c -Q proof/Phil Phil "proof/Phil/Verification/$name.v" | tee -a /tmp/p8-h9-assumptions.log
          done
          count="$(grep -c 'Closed under the global context' /tmp/p8-h9-assumptions.log || true)"
          test "$count" -ge 20 || { echo "Only $count/20 closed assumption reports" >&2; exit 1; }
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8H8UnicodeScalarOrder P8H9StructuralOrderCoherence; do
            rocq check -Q proof/Phil Phil "Phil.Verification.$name"
          done
          git -c safe.directory="$PWD" rev-parse HEAD
          sha256sum \
            proof/Phil/Verification/P8UnicodeUtf8Model.v \
            proof/Phil/Verification/P8D1UnicodeStreamModel.v \
            proof/Phil/Verification/P8D2StructuralOrderModel.v \
            proof/Phil/Verification/P8H8UnicodeScalarOrder.v \
            proof/Phil/Verification/P8H9StructuralOrderCoherence.v \
            proof/Phil/Verification/P8UnicodeUtf8Model.vo \
            proof/Phil/Verification/P8D1UnicodeStreamModel.vo \
            proof/Phil/Verification/P8D2StructuralOrderModel.vo \
            proof/Phil/Verification/P8H8UnicodeScalarOrder.vo \
            proof/Phil/Verification/P8H9StructuralOrderCoherence.vo \
            /tmp/p8-h9-assumptions.log
