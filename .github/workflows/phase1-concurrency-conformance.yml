name: Phase 1 Concurrency Conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  concurrency-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: CONC-001 static population and exactly-once activation
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1StaticProcessPopulationMain.hs
      - name: CONC-002 semantic process identity and duplicate target activation
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProcessIdentityMain.hs
      - name: CONC-003 activation context closure and global ownership partition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProcessActivationOwnershipMain.hs
      - name: CONC-004 exact synchronous process rendezvous
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExactProcessRendezvousMain.hs
      - name: CONC-005 exact restricted message ownership transfer
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RestrictedMessageTransferMain.hs
      - name: CONC-006 scheduler-independent source partial order
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1SchedulerIndependentOrderMain.hs
      - name: CONC-007 fatal-process failure and cancellation isolation
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1FailureIsolationMain.hs
      - name: CONC-008 process and whole-program terminal closure
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProcessTerminalClosureMain.hs
      - name: CONC-009 execution realization preservation
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProcessExecutionRealizationMain.hs
      - name: CONC-010 explicit internal/external participant classification
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ParticipantClassificationMain.hs
      - name: CONC-011 unrestricted wrapper reachable-state partition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1UnrestrictedReachabilityMain.hs
