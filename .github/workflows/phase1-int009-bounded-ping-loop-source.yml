name: Phase 1 INT-009 Bounded Ping Loop Source

on:
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/BoundedPingLoopSource.hs'
      - 'test/Phase1INT009BoundedPingLoopSourceMain.hs'
      - '.github/workflows/phase1-int009-bounded-ping-loop-source.yml'
  push:
    branches:
      - phase1-int009-bounded-ping-loop-source

jobs:
  bounded-ping-loop-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate under canonical strict warnings
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Strictly typecheck INT-009 bounded Ping loop source
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/GrammarV1/BoundedPingLoopSource.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1INT009BoundedPingLoopSourceMain.hs
      - name: Execute INT-009 bounded Ping loop source controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT009BoundedPingLoopSourceMain.hs
