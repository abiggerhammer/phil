name: Apply architecture instantiation closeout

on:
  push:
    branches: [bind-architecture-instantiation-decisions-closeout]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact production-binding patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          static = Path('src/Phil/Core/Static.hs')
          cabal = Path('phil-core.cabal')
          kernel = Path('src/ArchitectureInstantiationKernel.hs')

          assert hashlib.sha256(static.read_bytes()).hexdigest() == 'e5b05a6bb6d84920e915c0a23ca4f23dbd3e58bfb4a37e18f82e9d32a6d1b239'
          assert hashlib.sha256(cabal.read_bytes()).hexdigest() == '2128ff77588f16a46fe86d8c20662cc5a5a0db26863fea14f3b02366180ea198'

          s = static.read_text()
          old = 'import qualified ArchitectureIdentityKernel as ArchitectureIdentityKernel\nimport qualified ArchitectureRevisionConstructionKernel as ArchitectureRevisionConstructionKernel\n'
          new = 'import qualified ArchitectureIdentityKernel as ArchitectureIdentityKernel\nimport qualified ArchitectureInstantiationKernel as ArchitectureInstantiationKernel\nimport qualified ArchitectureRevisionConstructionKernel as ArchitectureRevisionConstructionKernel\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''architectureRevisionConstructionKernelBridgeMismatch :: String -> a
          architectureRevisionConstructionKernelBridgeMismatch seam =
            error ("ArchitectureRevisionConstructionKernel bridge mismatch: " <> seam)

          '''
          new = old + '''architectureInstantiationKernelBridgeMismatch :: String -> a
          architectureInstantiationKernelBridgeMismatch seam =
            error ("ArchitectureInstantiationKernel bridge mismatch: " <> seam)

          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''normalizeChildren owner = foldl step (Right Map.empty)
            where
              step accumulated child = do
                children <- accumulated
                let slot = architectureChildSlot child
                if Map.member slot children
                  then Left (DuplicateOccurrenceSlot owner slot)
                  else Right (Map.insert slot (architectureChildNode child) children)
          '''
          new = '''normalizeChildren owner = foldl step (Right Map.empty)
            where
              step accumulated child = do
                children <- accumulated
                let slot = architectureChildSlot child
                    slotFresh = not (Map.member slot children)
                case ArchitectureInstantiationKernel.decideChildSlotByFacts slotFresh of
                  ArchitectureInstantiationKernel.ChildSlotAccepted ->
                    Right (Map.insert slot (architectureChildNode child) children)
                  ArchitectureInstantiationKernel.ChildSlotDuplicate ->
                    Left (DuplicateOccurrenceSlot owner slot)
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    validateRequirement node requirement =
                case architectureRequirementDisposition requirement of
                  Nothing -> Left (UnresolvedArchitectureRequirement
                    ownerKey
                    (architectureRequirementKey requirement)
                    (architectureRequirementKind requirement))
                  Just disposition -> case disposition of
                    RequirementBoundTo target -> do
                      targetNode <- maybe
                        (Left (UnknownArchitectureBindingTarget
                          ownerKey (architectureRequirementKey requirement) target))
                        Right
                        (lookupArchitectureInstance target graph)
                      case architectureRequirementExpectedInterface requirement of
                        Nothing -> Right ()
                        Just expected ->
                          let actual = identityInterfaceRevision
                                (architectureDeclarationIdentity
                                  (checkedArchitectureDescriptor targetNode))
                          in if actual == expected
                              then Right ()
                              else Left (ArchitectureBindingInterfaceMismatch
                                ownerKey (architectureRequirementKey requirement) expected actual)
                    _ -> Right ()
                where
                  ownerKey = identityInstanceKey (checkedArchitectureIdentity node)

              validateReferences node = mapM_ validateReference
                (Map.toList (checkedArchitectureReferences node))
                where
                  ownerKey = identityInstanceKey (checkedArchitectureIdentity node)
                  validateReference (referenceKey, target) =
                    case lookupArchitectureInstance target graph of
                      Just _ -> Right ()
                      Nothing -> Left (UnknownArchitectureReferenceTarget
                        ownerKey referenceKey target)
          '''
          new = '''    validateRequirement node requirement =
                case decision of
                  ArchitectureInstantiationKernel.ArchitectureRequirementAccepted ->
                    Right ()
                  ArchitectureInstantiationKernel.ArchitectureRequirementUnresolved ->
                    Left (UnresolvedArchitectureRequirement
                      ownerKey
                      requirementKey
                      (architectureRequirementKind requirement))
                  ArchitectureInstantiationKernel.ArchitectureRequirementMissingBindingTarget ->
                    case boundTarget of
                      Just target -> Left (UnknownArchitectureBindingTarget
                        ownerKey requirementKey target)
                      Nothing -> architectureInstantiationKernelBridgeMismatch
                        "missing binding target without RequirementBoundTo"
                  ArchitectureInstantiationKernel.ArchitectureRequirementInterfaceMismatch ->
                    case (boundTarget, expectedInterface, targetNode) of
                      (Just _, Just expected, Just matchedTargetNode) ->
                        let actual = targetInterface matchedTargetNode
                        in Left (ArchitectureBindingInterfaceMismatch
                          ownerKey requirementKey expected actual)
                      _ -> architectureInstantiationKernelBridgeMismatch
                        "interface mismatch without bound existing exact-interface target"
                where
                  ownerKey = identityInstanceKey (checkedArchitectureIdentity node)
                  rootKey = identityInstanceKey (architectureGraphRoot graph)
                  requirementKey = architectureRequirementKey requirement
                  disposition = architectureRequirementDisposition requirement
                  hasExplicitDisposition = case disposition of
                    Just _ -> True
                    Nothing -> False
                  boundTarget = case disposition of
                    Just (RequirementBoundTo target) -> Just target
                    _ -> Nothing
                  isBoundTo = case boundTarget of
                    Just _ -> True
                    Nothing -> False
                  targetNode = boundTarget >>= (`lookupArchitectureInstance` graph)
                  targetExists = case targetNode of
                    Just _ -> True
                    Nothing -> False
                  expectedInterface = architectureRequirementExpectedInterface requirement
                  targetInterface target = identityInterfaceRevision
                    (architectureDeclarationIdentity (checkedArchitectureDescriptor target))
                  interfaceMatches = case expectedInterface of
                    Nothing -> True
                    Just expected -> case targetNode of
                      Just target -> targetInterface target == expected
                      Nothing -> False
                  decideRequirement
                    | ownerKey == rootKey =
                        ArchitectureInstantiationKernel.decideRootRequirementByFacts
                    | otherwise =
                        ArchitectureInstantiationKernel.decideArchitectureRequirementByFacts
                  decision = decideRequirement
                    hasExplicitDisposition isBoundTo targetExists interfaceMatches

              validateReferences node = mapM_ validateReference
                (Map.toList (checkedArchitectureReferences node))
                where
                  ownerKey = identityInstanceKey (checkedArchitectureIdentity node)
                  validateReference (referenceKey, target) =
                    case ArchitectureInstantiationKernel.decideArchitectureReferenceByFacts
                      (Map.member target (architectureGraphInstances graph)) of
                      ArchitectureInstantiationKernel.ArchitectureReferenceAccepted ->
                        Right ()
                      ArchitectureInstantiationKernel.ArchitectureReferenceUnknownTarget ->
                        Left (UnknownArchitectureReferenceTarget
                          ownerKey referenceKey target)
          '''
          assert old in s
          s = s.replace(old, new, 1)
          static.write_text(s)

          c = cabal.read_text()
          old = '''  other-modules:
                ArchitectureIdentityKernel
                ArchitectureRevisionConstructionKernel
                AssuranceValidityScopeKernel
          '''
          new = '''  other-modules:
                ArchitectureIdentityKernel
                ArchitectureInstantiationKernel
                ArchitectureRevisionConstructionKernel
                AssuranceValidityScopeKernel
          '''
          assert old in c
          cabal.write_text(c.replace(old, new, 1))

          kernel.write_text('''module ArchitectureInstantiationKernel where

          import qualified Prelude

          data ChildSlotDecision =
             ChildSlotAccepted
           | ChildSlotDuplicate

          decideChildSlotByFacts :: Prelude.Bool -> ChildSlotDecision
          decideChildSlotByFacts slotFresh =
            case slotFresh of {
             Prelude.True -> ChildSlotAccepted;
             Prelude.False -> ChildSlotDuplicate}

          data ArchitectureRequirementDecision =
             ArchitectureRequirementAccepted
           | ArchitectureRequirementUnresolved
           | ArchitectureRequirementMissingBindingTarget
           | ArchitectureRequirementInterfaceMismatch

          decideArchitectureRequirementByFacts :: Prelude.Bool -> Prelude.Bool ->
                                                  Prelude.Bool -> Prelude.Bool ->
                                                  ArchitectureRequirementDecision
          decideArchitectureRequirementByFacts hasExplicitDisposition isBoundTo targetExists interfaceMatches =
            case hasExplicitDisposition of {
             Prelude.True ->
              case isBoundTo of {
               Prelude.True ->
                case targetExists of {
                 Prelude.True ->
                  case interfaceMatches of {
                   Prelude.True -> ArchitectureRequirementAccepted;
                   Prelude.False -> ArchitectureRequirementInterfaceMismatch};
                 Prelude.False -> ArchitectureRequirementMissingBindingTarget};
               Prelude.False -> ArchitectureRequirementAccepted};
             Prelude.False -> ArchitectureRequirementUnresolved}

          decideRootRequirementByFacts :: Prelude.Bool -> Prelude.Bool -> Prelude.Bool
                                          -> Prelude.Bool ->
                                          ArchitectureRequirementDecision
          decideRootRequirementByFacts =
            decideArchitectureRequirementByFacts

          data ArchitectureReferenceDecision =
             ArchitectureReferenceAccepted
           | ArchitectureReferenceUnknownTarget

          decideArchitectureReferenceByFacts :: Prelude.Bool ->
                                                ArchitectureReferenceDecision
          decideArchitectureReferenceByFacts targetExists =
            case targetExists of {
             Prelude.True -> ArchitectureReferenceAccepted;
             Prelude.False -> ArchitectureReferenceUnknownTarget}
          ''')
          assert hashlib.sha256(kernel.read_bytes()).hexdigest() == '2fb3efaca94102faf4576c4a8a38e9bb148ef8de058c3e86d595fedf2daefbad'
          assert hashlib.sha256(static.read_bytes()).hexdigest() == '0913b61fff9dbfa0821057b0fbb8b9e663f1a592bad4604fa8156062328ed931'
          assert hashlib.sha256(cabal.read_bytes()).hexdigest() == '446cca15129ab173936879f13c0874246a2f30679d6df5442fa4d27712df009f'
          PY

      - name: Commit production-binding patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Core/Static.hs src/ArchitectureInstantiationKernel.hs phil-core.cabal
          git commit -m 'Bind architecture instantiation decisions'
          git push origin HEAD:bind-architecture-instantiation-decisions-closeout
