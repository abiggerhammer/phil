name: Phase 1 Authority Possession Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Core/Authority.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - 'docs/phase-1/authority-possession-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'app/Phase1AuthorityPossessionCertificationMain.hs'
      - '.github/workflows/phase1-authority-possession-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/Authority.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - 'docs/phase-1/authority-possession-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'app/Phase1AuthorityPossessionCertificationMain.hs'
      - '.github/workflows/phase1-authority-possession-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-authority-possession:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check structural dependency and PHIL-AUTH-POSSESS-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityPossession.v
          test -f proof/Phil/Core/AuthorityPossession.vo
          mkdir -p phase1-authority-possession-proof
          cp proof/Phil/Core/AuthorityPossession.v phase1-authority-possession-proof/
          cp proof/Phil/Core/AuthorityPossession.vo phase1-authority-possession-proof/
          sha256sum \
            proof/Phil/Core/GenericStructural.v \
            proof/Phil/Core/GenericStructural.vo \
            phase1-authority-possession-proof/AuthorityPossession.v \
            phase1-authority-possession-proof/AuthorityPossession.vo

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-authority-possession-proof
          path: phase1-authority-possession-proof
          if-no-files-found: error

  certify-phase1-authority-possession:
    needs: rocq-phase1-authority-possession
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - name: Typecheck dedicated authority certifier with warnings as errors
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code app/Phase1AuthorityPossessionCertificationMain.hs

      - name: Re-run exact AUTH-001, AUTH-002, and AUTH-005 correspondence cases
        run: cabal exec -- runghc -isrc test/Phase1AuthorityPossessionMain.hs

      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-authority-possession-proof
          path: phase1-authority-possession-proof

      - name: Emit PHIL-AUTH-POSSESS-001 proof certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-authority-possession-certification
          cabal exec -- runghc -isrc app/Phase1AuthorityPossessionCertificationMain.hs \
            phase1-authority-possession-proof/AuthorityPossession.v \
            phase1-authority-possession-proof/AuthorityPossession.vo \
            phase1-authority-possession-certification/PHIL-AUTH-POSSESS-001.rocq.cert

          sha256sum \
            src/Phil/Core/Authority.hs \
            test/Phase1AuthorityPossessionMain.hs \
            docs/phase-1/authority-possession-v1.md \
            proof/Phil/Core/GenericStructural.v \
            proof/Phil/Core/AuthorityPossession.v \
            app/Phase1AuthorityPossessionCertificationMain.hs \
            > phase1-authority-possession-certification/PHIL-AUTH-POSSESS-001.correspondence.sha256

          cat phase1-authority-possession-certification/PHIL-AUTH-POSSESS-001.rocq.cert
          sha256sum phase1-authority-possession-certification/PHIL-AUTH-POSSESS-001.rocq.cert

      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-authority-possession-proof-certification
          path: phase1-authority-possession-certification
          if-no-files-found: error
