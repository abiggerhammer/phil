name: Payload Cancel Session Choice PR Trigger

on:
  pull_request:
    paths:
      - '.github/workflows/payload-cancel-session-choice-pr-trigger.yml'
      - '.github/workflows/payload-cancel-session-choice-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: payload-cancel-session-choice
          fetch-depth: 0
      - name: Run staged edit workflow body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/payload-cancel-session-choice-edit.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line == '          python3 - <<\'PY\'')
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '          PY')
          body = workflow[start + 1:end]
          shell_start = next(i for i, line in enumerate(body) if line.strip() == 'git diff --check')
          body = body[:shell_start]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body) + '\n'
          Path('/tmp/apply.py').write_text(script)
          PY
          python3 /tmp/apply.py
          git diff --check
          git config user.name "phil-payload-cancel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Phil/Systems/IR.hs src/Phil/Systems/Verify.hs src/Phil/LLVM/Lower.hs src/Phil/Systems/SessionChoice.hs src/Phil/Systems.hs phil-core.cabal
          git commit -m "Add explicit outgoing session select to Systems IR"
          git push origin HEAD:payload-cancel-session-choice
