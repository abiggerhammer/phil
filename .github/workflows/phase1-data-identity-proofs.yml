name: Phase 1 Data Identity Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/DataIdentity.v'
      - 'docs/phase-1/data-identity-proof-v1.md'
      - '.github/workflows/phase1-data-identity-proofs.yml'
      - 'src/Phil/Core/DataIdentity.hs'
      - 'src/Phil/Core/DataOperationContract.hs'
      - 'test/Phase1DataIdentityMain.hs'
      - 'test/Phase1DataOperationContractMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/DataIdentity.v'
      - 'docs/phase-1/data-identity-proof-v1.md'
      - '.github/workflows/phase1-data-identity-proofs.yml'
      - 'src/Phil/Core/DataIdentity.hs'
      - 'src/Phil/Core/DataOperationContract.hs'
      - 'test/Phase1DataIdentityMain.hs'
      - 'test/Phase1DataOperationContractMain.hs'

permissions:
  contents: read

jobs:
  rocq-data-identity-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-DATA-ID-001 proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataIdentity.v
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data-identity-proof
          cp proof/Phil/Core/DataIdentity.v proof/Phil/Core/DataIdentity.vo data-identity-proof/
          sha256sum \
            proof/Phil/Core/DataIdentity.v \
            proof/Phil/Core/DataIdentity.vo \
            > data-identity-proof/PHIL-DATA-ID-001.proof.sha256
          {
            echo 'obligation=PHIL-DATA-ID-001'
            echo 'evidence=Rocq-9.2.0'
            cat data-identity-proof/PHIL-DATA-ID-001.proof.sha256
          } > data-identity-proof/PHIL-DATA-ID-001.proof-certificate.txt
          cat data-identity-proof/PHIL-DATA-ID-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-data-identity-proof
          path: data-identity-proof
          if-no-files-found: error

  verify-data-identity-correspondence:
    needs: rocq-data-identity-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: Typecheck unchanged DATA-010/011 implementation paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/DataIdentity.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/DataOperationContract.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1DataIdentityMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1DataOperationContractMain.hs
      - name: Re-run DATA identity / operation correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataIdentityMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataOperationContractMain.hs
