name: FSEM-01 DATA-05A Nested Product Foundation Preflight

on:
  push:
    branches:
      - formal-semantics/fsem01-data05a-nested-product-foundation
    paths:
      - 'test/Phase1FSEM01Data05ANestedProductMain.hs'
      - 'test/fixtures/fsem01-data05a-nested-product-v1/**'
      - 'proof/Phil/Surface/SurfaceNestedProductFoundationD05A.v'
      - 'docs/phase-1/formal-semantics-nested-product-data05a-fsem01-v1.md'
      - '.github/workflows/fsem01-data05a-nested-product-preflight.yml'
  pull_request:
    paths:
      - 'test/Phase1FSEM01Data05ANestedProductMain.hs'
      - 'test/fixtures/fsem01-data05a-nested-product-v1/**'
      - 'proof/Phil/Surface/SurfaceNestedProductFoundationD05A.v'
      - 'docs/phase-1/formal-semantics-nested-product-data05a-fsem01-v1.md'
      - '.github/workflows/fsem01-data05a-nested-product-preflight.yml'

concurrency:
  group: data05a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-source-nested-core:
    name: Strict GHC source-checked nested pattern and native two-stage moves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Strict production library, prior product regressions and DATA-05A
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
          for test in \
            Phase1FSEM01FlatProductMain \
            Phase1FSEM01SourceProductEliminationMain \
            Phase1FSEM01Data05ANestedProductMain
          do
            cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -itest -Wall -Werror "test/$test.hs"
          done
          sha256sum test/Phase1FSEM01Data05ANestedProductMain.hs \
            test/fixtures/fsem01-data05a-nested-product-v1/*.phil \
            src/Phil/Core/DataMode.hs \
            src/Phil/Surface/GrammarV1/PatternBinderScope.hs

  rocq-nested-two-stage:
    name: Rocq finite positional nested restoration and two Linear owner deletion
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile real Core product models and conditional DATA-05A proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/DataMode.v \
            proof/Phil/Core/DataProduct.v \
            proof/Phil/Surface/SurfaceNestedProductFoundationD05A.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceNestedProductFoundationD05A
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceNestedProductFoundationD05A.v; then
            echo "Unproved DATA-05A nested product foundation" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceNestedProductFoundationD05A.v \
            proof/Phil/Surface/SurfaceNestedProductFoundationD05A.vo
