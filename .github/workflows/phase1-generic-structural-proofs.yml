name: Phase 1 Generic Structural Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1GenericStructuralMain.hs'
      - 'docs/phase-1/generic-structural-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'app/RocqScalarCertificationMain.hs'
      - '.github/workflows/phase1-generic-structural-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1GenericStructuralMain.hs'
      - 'docs/phase-1/generic-structural-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'app/RocqScalarCertificationMain.hs'
      - '.github/workflows/phase1-generic-structural-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-generic-structural:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check PHIL-GEN-STRUCT-001 in Rocq
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          test -f proof/Phil/Core/GenericStructural.vo
          mkdir -p phase1-generic-structural-proof
          cp proof/Phil/Core/GenericStructural.v phase1-generic-structural-proof/
          cp proof/Phil/Core/GenericStructural.vo phase1-generic-structural-proof/
          sha256sum phase1-generic-structural-proof/GenericStructural.v \
                    phase1-generic-structural-proof/GenericStructural.vo

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-generic-structural-proof
          path: phase1-generic-structural-proof
          if-no-files-found: error

  certify-phase1-generic-structural:
    needs: rocq-phase1-generic-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - name: Re-run exact GEN-001 through GEN-003 correspondence cases
        run: cabal exec -- runghc -isrc test/Phase1GenericStructuralMain.hs

      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-generic-structural-proof
          path: phase1-generic-structural-proof

      - name: Emit PHIL-GEN-STRUCT-001 proof certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-generic-structural-certification
          CERTIFIER="$(cabal list-bin exe:phil-certify-core-scalar)"
          "$CERTIFIER" \
            phase1-generic-structural \
            phase1-generic-structural-proof/GenericStructural.v \
            phase1-generic-structural-proof/GenericStructural.vo \
            phase1-generic-structural-certification/PHIL-GEN-STRUCT-001.rocq.cert

          sha256sum \
            src/Phil/Core/Generic.hs \
            test/Phase1GenericStructuralMain.hs \
            docs/phase-1/generic-structural-v1.md \
            proof/Phil/Core/GenericStructural.v \
            app/RocqScalarCertificationMain.hs \
            > phase1-generic-structural-certification/PHIL-GEN-STRUCT-001.correspondence.sha256

          cat phase1-generic-structural-certification/PHIL-GEN-STRUCT-001.rocq.cert
          sha256sum phase1-generic-structural-certification/PHIL-GEN-STRUCT-001.rocq.cert

      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-generic-structural-proof-certification
          path: phase1-generic-structural-certification
          if-no-files-found: error
