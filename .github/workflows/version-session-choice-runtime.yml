name: Version Session Choice Runtime

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/VersionChoiceOperands.hs'
      - 'src/Phil/Systems/VersionSessionChoice.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/VersionSessionChoice.hs'
      - 'src/Phil/LLVM/VersionSessionChoiceCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMVersionSessionChoiceMain.hs'
      - 'runtime/phase0/version_session_choice_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/VersionSessionChoiceABIMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/version-session-choice-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/VersionChoiceOperands.hs'
      - 'src/Phil/Systems/VersionSessionChoice.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/LLVM/VersionSessionChoice.hs'
      - 'src/Phil/LLVM/VersionSessionChoiceCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMVersionSessionChoiceMain.hs'
      - 'runtime/phase0/version_session_choice_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/VersionSessionChoiceABIMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/version-session-choice-runtime.yml'

permissions:
  contents: write

jobs:
  version-session-choice-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build emitter and focused tests
        run: cabal build phil-llvm-phase0-version-session-choice phil-version-session-choice-abi-tests
      - name: Verify ABI and execute version-choice runtime primitives
        shell: bash
        run: |
          set -euo pipefail
          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-version-session-choice)"
          "$EMITTER" > phase0-version-session-choice.ll
          "$LLVM_AS" phase0-version-session-choice.ll -o phase0-version-session-choice.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/version_session_choice_v1_smoke.c \
            -o version-session-runtime.ll
          python3 scripts/check_runtime_abi.py --partial \
            phase0-version-session-choice.ll version-session-runtime.ll
          "$LLVM_AS" version-session-runtime.ll -o version-session-runtime.bc
          "$LLVM_LINK" phase0-version-session-choice.bc version-session-runtime.bc \
            -o phase0-version-session-choice-partially-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 \
            runtime/phase0/version_session_choice_v1_smoke.c \
            runtime/phase0/version_session_choice_v1_smoke_main.c \
            -o version-session-choice-smoke
          ./version-session-choice-smoke

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm runtime/phase0/version_session_choice_v1_bad_ambient.c \
            -o version-session-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-version-session-choice.ll version-session-bad-ambient.ll; then
            echo "expected ABI checker to reject ambient/nullary version-choice provider" >&2
            exit 1
          fi

          cabal test phil-version-session-choice-abi-tests

  apply-refinement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lower-version-session-choice
          fetch-depth: 0
      - name: Apply staged refinement patch and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/version-refinement-fix-v2.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw = workflow[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          )
          code = code.replace(
              "'        expectedBinding = LLVMVersionChoicePayloadBinding\\n          (unValueId (versionChoiceClientSelectedVersion witness))\\n    pure (llvmBlockTerminator offer == expectedTerm\\n      && expectedBinding `elem` llvmBlockOps target)\\n'",
              "'          expectedBinding = LLVMVersionChoicePayloadBinding\\n            (unValueId (versionChoiceClientSelectedVersion witness))\\n      pure (llvmBlockTerminator offer == expectedTerm\\n        && expectedBinding `elem` llvmBlockOps target)\\n'",
              1,
          )
          code = code.replace(
              "'''        expectedBinding = LLVMVersionChoicePayloadBinding\n          (unValueId (versionChoiceClientSelectedVersion witness))\n        refinementOkay = case llvmBlockTerminator target of",
              "'''          expectedBinding = LLVMVersionChoicePayloadBinding\n            (unValueId (versionChoiceClientSelectedVersion witness))\n          refinementOkay = case llvmBlockTerminator target of",
              1,
          )
          code = code.replace(
              "    pure (llvmBlockTerminator offer == expectedTerm\n      && expectedBinding `elem` llvmBlockOps target\n      && refinementOkay)",
              "      pure (llvmBlockTerminator offer == expectedTerm\n        && expectedBinding `elem` llvmBlockOps target\n        && refinementOkay)",
              1,
          )
          exec(compile(code, 'version-refinement-fix-v2', 'exec'))
          PY
          git diff --check
          git rm .github/workflows/version-refinement-fix.yml .github/workflows/version-refinement-fix-v2.yml
          git show HEAD^:.github/workflows/version-session-choice-runtime.yml > .github/workflows/version-session-choice-runtime.yml
          git config user.name "phil-version-lowering-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/version-session-choice-runtime.yml \
            src/Phil/LLVM/IR.hs \
            src/Phil/LLVM/VersionSessionChoice.hs \
            src/Phil/LLVM/VersionSessionChoiceCertification.hs \
            runtime/phase0/version_session_choice_v1.h \
            runtime/phase0/version_session_choice_v1_smoke_fixture.h \
            runtime/phase0/version_session_choice_v1_smoke.c \
            runtime/phase0/version_session_choice_v1_smoke_main.c \
            runtime/phase0/version_session_choice_v1_bad_ambient.c \
            test/VersionSessionChoiceABIMain.hs \
            docs/phase-0/version-session-choice-abi-v1.md
          git commit -m "Make client version refinement explicit"
          git push origin HEAD:lower-version-session-choice
