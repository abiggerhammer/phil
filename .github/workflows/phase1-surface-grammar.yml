name: Phase 1 surface grammar

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_corpus.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'src/Phil/Surface/GrammarV1/**'
      - 'test/Phase1GrammarV1LexerMain.hs'
      - 'test/Phase1GrammarV1StructuralParserMain.hs'
      - 'test/Phase1GrammarV1RefinementTransportMain.hs'
      - 'test/Phase1GrammarV1CallableContractMain.hs'
      - 'test/Phase1GrammarV1OutcomeCalleeMain.hs'
      - 'test/Phase1GrammarV1CallableOutcomeStateMain.hs'
      - 'test/Phase1GrammarV1CalleeTransitionElaborationMain.hs'
      - 'test/Phase1GrammarV1ProductFunctionMain.hs'
      - 'test/Phase1GrammarV1OfferCaseMain.hs'
      - 'test/Phase1GrammarV1JoinLoopMain.hs'
      - 'test/Phase1GrammarV1ClosureMain.hs'
      - 'test/Phase1GrammarV1RejectMain.hs'
      - 'test/Phase1GrammarV1BoundaryStaticReferenceMain.hs'
      - 'test/Phase1GrammarV1CheckedBoundaryValueTypeMain.hs'
      - 'test/Phase1GrammarV1BoundaryCanonicalityMain.hs'
      - 'test/Phase1GrammarV1BoundaryCodecReferenceElaborationMain.hs'
      - 'test/Phase1GrammarV1StaticProcessNetworkMain.hs'
      - 'test/Phase1GrammarV1ExternalProtocolParticipantMain.hs'
      - 'test/Phase1GrammarV1ProviderDeclarationsMain.hs'
      - 'test/Phase1GrammarV1CallableEffectsMain.hs'
      - 'test/Phase1GrammarV1StaticValueTypesMain.hs'
      - 'test/Phase1GrammarV1CheckedTypeAliasMain.hs'
      - 'test/Phase1GrammarV1CheckedRecordFieldsMain.hs'
      - 'test/Phase1GrammarV1CheckedDataVariantsMain.hs'
      - 'test/Phase1GrammarV1SessionExpressionsMain.hs'
      - 'test/Phase1GrammarV1ProtocolRoleTemplatesMain.hs'
      - 'test/Phase1GrammarV1DeterminacyMain.hs'
      - 'test/Phase1GrammarV1DeterminacyVariantMain.hs'
      - 'test/Phase1GrammarV1CorpusMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - 'docs/phase-1/surface-grammar-v1.md'
      - 'docs/phase-1/surface-parser-production-corpus-v1.md'
      - 'docs/phase-1/surface-determinacy-v1.md'
      - '.github/workflows/phase1-surface-grammar.yml'
  push:
    branches:
      - main
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_corpus.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'src/Phil/Surface/GrammarV1/**'
      - 'test/Phase1GrammarV1LexerMain.hs'
      - 'test/Phase1GrammarV1StructuralParserMain.hs'
      - 'test/Phase1GrammarV1RefinementTransportMain.hs'
      - 'test/Phase1GrammarV1CallableContractMain.hs'
      - 'test/Phase1GrammarV1OutcomeCalleeMain.hs'
      - 'test/Phase1GrammarV1CallableOutcomeStateMain.hs'
      - 'test/Phase1GrammarV1CalleeTransitionElaborationMain.hs'
      - 'test/Phase1GrammarV1ProductFunctionMain.hs'
      - 'test/Phase1GrammarV1OfferCaseMain.hs'
      - 'test/Phase1GrammarV1JoinLoopMain.hs'
      - 'test/Phase1GrammarV1ClosureMain.hs'
      - 'test/Phase1GrammarV1RejectMain.hs'
      - 'test/Phase1GrammarV1BoundaryStaticReferenceMain.hs'
      - 'test/Phase1GrammarV1CheckedBoundaryValueTypeMain.hs'
      - 'test/Phase1GrammarV1BoundaryCanonicalityMain.hs'
      - 'test/Phase1GrammarV1BoundaryCodecReferenceElaborationMain.hs'
      - 'test/Phase1GrammarV1StaticProcessNetworkMain.hs'
      - 'test/Phase1GrammarV1ExternalProtocolParticipantMain.hs'
      - 'test/Phase1GrammarV1ProviderDeclarationsMain.hs'
      - 'test/Phase1GrammarV1CallableEffectsMain.hs'
      - 'test/Phase1GrammarV1StaticValueTypesMain.hs'
      - 'test/Phase1GrammarV1CheckedTypeAliasMain.hs'
      - 'test/Phase1GrammarV1CheckedRecordFieldsMain.hs'
      - 'test/Phase1GrammarV1CheckedDataVariantsMain.hs'
      - 'test/Phase1GrammarV1SessionExpressionsMain.hs'
      - 'test/Phase1GrammarV1ProtocolRoleTemplatesMain.hs'
      - 'test/Phase1GrammarV1DeterminacyMain.hs'
      - 'test/Phase1GrammarV1DeterminacyVariantMain.hs'
      - 'test/Phase1GrammarV1CorpusMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - 'docs/phase-1/surface-grammar-v1.md'
      - 'docs/phase-1/surface-parser-production-corpus-v1.md'
      - 'docs/phase-1/surface-determinacy-v1.md'
      - '.github/workflows/phase1-surface-grammar.yml'

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check grammar-only tools
        run: |
          python3 -m py_compile scripts/derive_phase1_surface_grammar.py
          python3 -m py_compile scripts/check_phase1_surface_corpus.py
          python3 -m py_compile scripts/check_phase1_surface_determinacy.py

      - name: Check surface production corpus integrity
        run: python3 scripts/check_phase1_surface_corpus.py

      - name: Check Grammar-v1 local determinacy inventory
        run: python3 scripts/check_phase1_surface_determinacy.py

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Check Grammar-v1 lexical authority
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1LexerMain.hs

      - name: Check Grammar-v1 production parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1StructuralParserMain.hs

      - name: Check Grammar-v1 refinement and transport parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1RefinementTransportMain.hs

      - name: Check Grammar-v1 callable contract parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CallableContractMain.hs

      - name: Check Grammar-v1 outcome and callee parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1OutcomeCalleeMain.hs

      - name: Check Grammar-v1 callable outcome-state routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CallableOutcomeStateMain.hs

      - name: Check Grammar-v1 callee transition routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CalleeTransitionElaborationMain.hs

      - name: Check Grammar-v1 product and function parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1ProductFunctionMain.hs

      - name: Check Grammar-v1 offer and case parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1OfferCaseMain.hs

      - name: Check Grammar-v1 join and loop parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1JoinLoopMain.hs

      - name: Check Grammar-v1 closure parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1ClosureMain.hs

      - name: Check Grammar-v1 standalone reject parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1RejectMain.hs

      - name: Check Grammar-v1 boundary static-reference parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BoundaryStaticReferenceMain.hs

      - name: Check Grammar-v1 checked boundary value-type routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CheckedBoundaryValueTypeMain.hs

      - name: Check Grammar-v1 boundary canonicality routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BoundaryCanonicalityMain.hs

      - name: Check Grammar-v1 boundary codec reference routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BoundaryCodecReferenceElaborationMain.hs

      - name: Check Grammar-v1 static process-network parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1StaticProcessNetworkMain.hs

      - name: Check Grammar-v1 external protocol-participant parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1ExternalProtocolParticipantMain.hs

      - name: Check Grammar-v1 provider declaration parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1ProviderDeclarationsMain.hs

      - name: Check Grammar-v1 callable and effect-set parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CallableEffectsMain.hs

      - name: Check Grammar-v1 static value and type parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1StaticValueTypesMain.hs

      - name: Check Grammar-v1 checked type-alias routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CheckedTypeAliasMain.hs

      - name: Check Grammar-v1 checked record-field routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CheckedRecordFieldsMain.hs

      - name: Check Grammar-v1 checked data-variant routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CheckedDataVariantsMain.hs

      - name: Check Grammar-v1 session expression parsing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1SessionExpressionsMain.hs

      - name: Check Grammar-v1 protocol role template routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1ProtocolRoleTemplatesMain.hs

      - name: Check Grammar-v1 determinacy shape pressure
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1DeterminacyMain.hs

      - name: Check Grammar-v1 variant determinacy pressure
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1DeterminacyVariantMain.hs

      - name: Check manifest-driven Grammar-v1 corpus
        run: |
          python3 scripts/check_phase1_surface_corpus.py --emit-parser-cases \
            | cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CorpusMain.hs

      - name: Derive typed Rocq grammar
        run: python3 scripts/derive_phase1_surface_grammar.py --write

      - name: Check deterministic derivation
        run: |
          cp proof/Phil/Surface/Grammar.v /tmp/Grammar.first.v
          python3 scripts/derive_phase1_surface_grammar.py --write
          cmp /tmp/Grammar.first.v proof/Phil/Surface/Grammar.v
          python3 scripts/derive_phase1_surface_grammar.py --check

      - name: Upload derived grammar
        uses: actions/upload-artifact@v4
        with:
          name: phase1-surface-grammar-rocq
          path: proof/Phil/Surface/Grammar.v
          if-no-files-found: error
          retention-days: 7

  rocq:
    needs: derive
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download derived grammar
        uses: actions/download-artifact@v4
        with:
          name: phase1-surface-grammar-rocq
          path: proof/Phil/Surface

      - name: Compile formal grammar warning-clean
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          if ! rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v > /tmp/rocq-grammar.log 2>&1; then
            cat /tmp/rocq-grammar.log
            exit 1
          fi
          cat /tmp/rocq-grammar.log
          if grep -q 'Warning:' /tmp/rocq-grammar.log; then
            echo 'Rocq emitted warnings while compiling the derived Phase 1 grammar.' >&2
            exit 1
          fi
