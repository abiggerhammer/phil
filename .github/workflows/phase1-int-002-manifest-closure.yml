name: Phase 1 INT-002 Manifest Closure

on:
  push:
    paths:
      - 'examples/upload/client.phil'
      - 'examples/upload/server.phil'
      - 'src/Phil/Assurance/Phase0.hs'
      - 'src/Phil/Assurance/Types.hs'
      - 'src/Phil/Assurance/Verify.hs'
      - 'src/Phil/Compiler/SourceArchitecture.hs'
      - 'src/Phil/Compiler/SourceBundle.hs'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - 'src/Phil/Surface/Lineage.hs'
      - 'src/Phil/Surface/Phase0.hs'
      - 'src/Phil/Systems/GenericLowering.hs'
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Phase1Stage.hs'
      - 'src/Phil/Verification.hs'
      - 'src/Phil/Verification/Bundle.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'test/Phase1INT001WitnessE2EMain.hs'
      - 'test/Phase1INT002ManifestClosureMain.hs'
      - 'test/Phase1INT002UploadManifestMain.hs'
      - 'test/AssuranceMain.hs'
      - 'test/Phase1VerificationNoSilentAssumptionExportMain.hs'
      - 'test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs'
      - 'test/Phase1VerificationIndependentTargetMain.hs'
      - '.github/workflows/phase1-int-002-manifest-closure.yml'
  pull_request:
    paths:
      - 'examples/upload/client.phil'
      - 'examples/upload/server.phil'
      - 'src/Phil/Assurance/Phase0.hs'
      - 'src/Phil/Assurance/Types.hs'
      - 'src/Phil/Assurance/Verify.hs'
      - 'src/Phil/Compiler/SourceArchitecture.hs'
      - 'src/Phil/Compiler/SourceBundle.hs'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - 'src/Phil/Surface/Lineage.hs'
      - 'src/Phil/Surface/Phase0.hs'
      - 'src/Phil/Systems/GenericLowering.hs'
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Phase1Stage.hs'
      - 'src/Phil/Verification.hs'
      - 'src/Phil/Verification/Bundle.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'test/Phase1INT001WitnessE2EMain.hs'
      - 'test/Phase1INT002ManifestClosureMain.hs'
      - 'test/Phase1INT002UploadManifestMain.hs'
      - 'test/AssuranceMain.hs'
      - 'test/Phase1VerificationNoSilentAssumptionExportMain.hs'
      - 'test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs'
      - 'test/Phase1VerificationIndependentTargetMain.hs'
      - '.github/workflows/phase1-int-002-manifest-closure.yml'

jobs:
  manifest-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck generic manifest closure boundary
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Verification.hs \
            src/Phil/Verification/Bundle.hs \
            src/Phil/Verification/ManifestClosure.hs \
            test/Phase1INT002ManifestClosureMain.hs

      - name: Strict typecheck ordinary-source Upload manifest boundary
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Verification.hs \
            src/Phil/Verification/Bundle.hs \
            src/Phil/Verification/ManifestClosure.hs \
            test/Phase1INT002UploadManifestMain.hs

      - name: Execute INT-002 generic manifest closure pressure corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT002ManifestClosureMain.hs

      - name: Execute ordinary-source Upload manifest closure
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT002UploadManifestMain.hs

      - name: Replay INT-001 ordinary witness source path
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001WitnessE2EMain.hs

      - name: Replay assurance manifest verifier corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/AssuranceMain.hs

      - name: Replay ADR-025 no-silent-assumption/export controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationNoSilentAssumptionExportMain.hs

      - name: Replay ADR-025 runtime policy controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs

      - name: Replay canonical VerificationBundle target controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationIndependentTargetMain.hs
