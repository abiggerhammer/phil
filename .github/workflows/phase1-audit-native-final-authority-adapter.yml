name: Phase 1 Audit Native Final Authority Adapter

on:
  pull_request:
    paths:
      - 'src/Phil/Verification/FinalAuthorityAdapter.hs'
      - 'test/Phase1INT005CertifiedReleaseEnvelopeMain.hs'
      - 'phil-core.cabal'
      - 'docs/phase-1/audit-final-authority-native-adapter-v1.md'
      - '.github/workflows/phase1-audit-native-final-authority-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Verification/FinalAuthorityAdapter.hs'
      - 'test/Phase1INT005CertifiedReleaseEnvelopeMain.hs'
      - 'phil-core.cabal'
      - 'docs/phase-1/audit-final-authority-native-adapter-v1.md'
      - '.github/workflows/phase1-audit-native-final-authority-adapter.yml'

permissions:
  contents: read

jobs:
  native-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build all with warnings fatal
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Strict typecheck native adapter and full caller fixture
        run: |
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code src/Phil/Verification/FinalAuthorityAdapter.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
      - name: Execute source/manifest/stage adapter positive and negative controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
      - name: Preserve independent source and StageClosure acceptance regressions
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationSourceArtifactClosureMain.hs
          cabal exec -- runghc -isrc test/Phase1StageClosureMain.hs

  model-premises:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Recompile final-manifest/native-coordinate/fixed-adapter theorems
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/VerificationArtifact.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestStageReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestNativeCoordinateReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestFixedAdapter.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestFixedAdapterCertification.v
          cat >/tmp/NativeFinalAuthorityAssumptions.v <<'EOF'
          From Phil.Verification Require Import FinalManifestFixedAdapterCertification.
          Print Assumptions fixed_adapter_full_certification_preserves_predecessors.
          EOF
          rocq c -Q proof/Phil Phil /tmp/NativeFinalAuthorityAssumptions.v 2>&1 | tee native-final-authority-assumptions.log
          sha256sum proof/Phil/Verification/FinalManifestFixedAdapterCertification.v proof/Phil/Verification/FinalManifestFixedAdapterCertification.vo native-final-authority-assumptions.log > native-final-authority-identities.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-final-authority-model-premises
          path: |
            native-final-authority-assumptions.log
            native-final-authority-identities.sha256
          if-no-files-found: error
