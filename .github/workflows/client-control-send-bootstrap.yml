name: Client Control Send Bootstrap

on:
  push:
    branches:
      - client-control-send-abi
    paths:
      - '.github/workflows/client-control-send-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-control-send-abi
          fetch-depth: 0
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Register target and physical LLVM operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_before(text, marker, insertion, label):
              sentinel = insertion.splitlines()[0]
              if sentinel in text:
                  return text
              if marker not in text:
                  raise SystemExit(f'{label}: marker missing')
              return text.replace(marker, insertion + marker, 1)

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: marker missing')
              return text.replace(old, new, 1)

          ir_path = Path('src/Phil/LLVM/IR.hs')
          ir = ir_path.read_text()

          ir = insert_before(
              ir,
              '  | LLVMAcceptedResponse Text Text\n',
              '  | LLVMClientSupportedVersions Text\n'
              '  | LLVMClientPayloadLength Text Text\n'
              '  | LLVMClientPayloadKind Text Text\n'
              '  | LLVMClientSHA256 Text Text\n'
              '  | LLVMClientSendHello Text Text\n'
              '  | LLVMClientSendBegin Text Text Text Text\n',
              'client control-send op constructors')

          ir = insert_before(
              ir,
              '  | LLVMBeginPolicyValidate\n',
              '  | LLVMVersionRefinementWithSet\n'
              '      RuntimeSiteRef\n'
              '      Text\n'
              '      Text\n'
              '      Text\n'
              '      LLVMBlockId\n'
              '      LLVMBlockId\n',
              'explicit version-set refinement constructor')

          ir = insert_before(
              ir,
              '  LLVMBeginPolicyValidate _ _ _ _ accepted rejected -> [accepted, rejected]\n',
              '  LLVMVersionRefinementWithSet _ _ _ _ yes no -> [yes, no]\n',
              'version-set refinement successors')

          ir = insert_before(
              ir,
              '        LLVMBeginPolicyValidate site _ _ _ _ _ -> [site]\n',
              '        LLVMVersionRefinementWithSet site _ _ _ _ _ -> [site]\n',
              'version-set refinement runtime site')

          if '      , "phil-runtime/phase0/client-control-send-v1"\n' not in ir:
              ir = replace_once(
                  ir,
                  '      , "phil-runtime/phase0/transport-exact-send-v1"\n',
                  '      , "phil-runtime/phase0/transport-exact-send-v1"\n'
                  '      , "phil-runtime/phase0/client-control-send-v1"\n',
                  'client control-send runtime profile')

          if '      <> clientControlSendDeclarations\n' not in ir:
              ir = replace_once(
                  ir,
                  '      <> exactSendDeclaration\n',
                  '      <> clientControlSendDeclarations\n'
                  '      <> exactSendDeclaration\n',
                  'client control-send declarations hook')

          ir = insert_before(
              ir,
              '    exactSendDeclaration =\n',
              '    clientControlSendDeclarations =\n'
              '      if runtimeProfile == "phil-runtime/phase0/client-control-send-v1"\n'
              '        then\n'
              '          [ "declare ptr @phil_runtime_supported_versions()"\n'
              '          , "declare i64 @phil_runtime_payload_length(ptr)"\n'
              '          , "declare ptr @phil_runtime_payload_kind(ptr)"\n'
              '          , "declare ptr @phil_runtime_sha256(ptr)"\n'
              '          , "declare void @phil_runtime_send_hello(ptr, ptr)"\n'
              '          , "declare void @phil_runtime_send_begin_sha256(ptr, i64, ptr, ptr)"\n'
              '          , "declare i1 @phil_runtime_refine_selected_version_with_set(ptr, ptr, i16)"\n'
              '          ]\n'
              '        else []\n\n',
              'client control-send declaration definitions')

          ir = insert_before(
              ir,
              '      LLVMAcceptedResponse transport uploadId ->\n',
              '      LLVMClientSupportedVersions output ->\n'
              '        [ "%" <> symbol output <> " = call ptr @phil_runtime_supported_versions()" ]\n'
              '      LLVMClientPayloadLength output payload ->\n'
              '        [ "%" <> symbol output <> " = call i64 @phil_runtime_payload_length(ptr %"\n'
              '            <> symbol payload <> ")"\n'
              '        ]\n'
              '      LLVMClientPayloadKind output payload ->\n'
              '        [ "%" <> symbol output <> " = call ptr @phil_runtime_payload_kind(ptr %"\n'
              '            <> symbol payload <> ")"\n'
              '        ]\n'
              '      LLVMClientSHA256 output payload ->\n'
              '        [ "%" <> symbol output <> " = call ptr @phil_runtime_sha256(ptr %"\n'
              '            <> symbol payload <> ")"\n'
              '        ]\n'
              '      LLVMClientSendHello transport versions ->\n'
              '        [ "call void @phil_runtime_send_hello(ptr %" <> symbol transport\n'
              '            <> ", ptr %" <> symbol versions <> ")"\n'
              '        ]\n'
              '      LLVMClientSendBegin transport payloadLength payloadKind digest ->\n'
              '        [ "call void @phil_runtime_send_begin_sha256(ptr %" <> symbol transport\n'
              '            <> ", i64 %" <> symbol payloadLength\n'
              '            <> ", ptr %" <> symbol payloadKind\n'
              '            <> ", ptr %" <> symbol digest <> ")"\n'
              '        ]\n',
              'client control-send op rendering')

          ir = insert_before(
              ir,
              '      LLVMBeginPolicyValidate _ policyContext beginRecord reason accepted rejected ->\n',
              '      LLVMVersionRefinementWithSet _ transport versions selected yes no ->\n'
              '        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n'
              '            validName = "%phil_version_refinement_ok_" <> blockSymbol\n'
              '        in\n'
              '          [ validName <> " = call i1 @phil_runtime_refine_selected_version_with_set(ptr %"\n'
              '              <> symbol transport <> ", ptr %" <> symbol versions\n'
              '              <> ", i16 %" <> symbol selected <> ")"\n'
              '          , "br i1 " <> validName\n'
              '              <> ", label %" <> symbol (unLLVMBlockId yes)\n'
              '              <> ", label %" <> symbol (unLLVMBlockId no)\n'
              '          ]\n',
              'explicit version-set refinement rendering')
          ir_path.write_text(ir)

          verify_path = Path('src/Phil/LLVM/Verify.hs')
          verify = verify_path.read_text()
          verify = insert_before(
              verify,
              '      LLVMAcceptedResponse {} -> True\n',
              '      LLVMClientSupportedVersions {} -> True\n'
              '      LLVMClientPayloadLength {} -> True\n'
              '      LLVMClientPayloadKind {} -> True\n'
              '      LLVMClientSHA256 {} -> True\n'
              '      LLVMClientSendHello {} -> True\n'
              '      LLVMClientSendBegin {} -> True\n',
              'ordinary client control-send ops')
          verify_path.write_text(verify)

          llvm_path = Path('src/Phil/LLVM.hs')
          llvm = llvm_path.read_text()
          if '  , module Phil.LLVM.ClientControlSend\n' not in llvm:
              llvm = replace_once(
                  llvm,
                  '  , module Phil.LLVM.ExactSendCertification\n  ) where',
                  '  , module Phil.LLVM.ExactSendCertification\n'
                  '  , module Phil.LLVM.ClientControlSend\n'
                  '  ) where',
                  'Phil.LLVM export')
          if 'import Phil.LLVM.ClientControlSend\n' not in llvm:
              llvm = replace_once(
                  llvm,
                  'import Phil.LLVM.ExactSendCertification\n',
                  'import Phil.LLVM.ExactSendCertification\n'
                  'import Phil.LLVM.ClientControlSend\n',
                  'Phil.LLVM import')
          llvm_path.write_text(llvm)

          module_path = Path('src/Phil/LLVM/ClientControlSend.hs')
          module_text = module_path.read_text().replace(
              'import Phil.Core.Scalar (ScalarType (..))\n', '')
          start = module_text.find('    contract0 = llvmArtifactContract base\n')
          end = module_text.find('    artifact = base\n', start)
          if start < 0 or end < 0:
              raise SystemExit('ClientControlSend contract markers missing')
          module_text = (
              module_text[:start]
              + '    contract0 = llvmArtifactContract base\n'
                '    contract1 = contract0 { llvmContractTargetDigest = llvmModuleDigest module1 }\n'
              + module_text[end:]
          )
          module_path.write_text(module_text)

          cabal_path = Path('phil-core.cabal')
          cabal = cabal_path.read_text()
          if '      Phil.LLVM.ClientControlSend\n' not in cabal:
              cabal = replace_once(
                  cabal,
                  '      Phil.LLVM.ExactSendCertification\n',
                  '      Phil.LLVM.ExactSendCertification\n'
                  '      Phil.LLVM.ClientControlSend\n',
                  'Cabal client control-send module')

          if 'executable phil-llvm-phase0-client-control-send\n' not in cabal:
              executable = '''executable phil-llvm-phase0-client-control-send
            import:             common-settings
            hs-source-dirs:     app
            main-is:            LLVMClientControlSendMain.hs
            build-depends:
                base >=4.17 && <5,
                phil-core,
                text >=2.0 && <2.2

          '''.replace('          ', '')
              if 'executable philc\n' not in cabal:
                  raise SystemExit('Cabal philc marker missing')
              cabal = cabal.replace('executable philc\n', executable + 'executable philc\n', 1)

          if 'test-suite phil-client-control-send-abi-tests\n' not in cabal:
              test_block = '''test-suite phil-client-control-send-abi-tests
            import:             common-settings
            type:               exitcode-stdio-1.0
            hs-source-dirs:     test
            main-is:            ClientControlSendABIMain.hs
            build-depends:
                base >=4.17 && <5,
                containers >=0.6 && <0.8,
                phil-core,
                text >=2.0 && <2.2

          '''.replace('          ', '')
              marker = 'test-suite phil-hello-policy-validation-abi-tests\n'
              if marker not in cabal:
                  raise SystemExit('Cabal ABI test marker missing')
              cabal = cabal.replace(marker, test_block + marker, 1)
          cabal_path.write_text(cabal)
          PY

      - name: Build and verify focused target
        shell: bash
        run: |
          set -euo pipefail
          cabal build phil-llvm-phase0-client-control-send phil-client-control-send-abi-tests
          cabal test phil-client-control-send-abi-tests --test-show-details=direct

          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-client-control-send)"
          "$EMITTER" > phase0-client-control-send.ll
          "$LLVM_AS" phase0-client-control-send.ll -o phase0-client-control-send.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/client_control_send_v1_smoke.c \
            -o client-control-send-runtime.ll
          python3 scripts/check_runtime_abi.py --partial \
            phase0-client-control-send.ll client-control-send-runtime.ll
          "$LLVM_AS" client-control-send-runtime.ll -o client-control-send-runtime.bc
          "$LLVM_LINK" phase0-client-control-send.bc client-control-send-runtime.bc \
            -o phase0-client-control-send-partially-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 \
            runtime/phase0/client_control_send_v1_smoke.c \
            runtime/phase0/client_control_send_v1_smoke_main.c \
            -o client-control-send-smoke
          ./client-control-send-smoke

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm runtime/phase0/client_control_send_v1_bad_ambient.c \
            -o client-control-send-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-client-control-send.ll client-control-send-bad-ambient.ll; then
            echo "expected ABI checker to reject ambient/nullary client control-send provider" >&2
            exit 1
          fi

      - name: Commit validated registration and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name phil-client-control-send-bootstrap
          git config user.email github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/client-control-send-bootstrap.yml
          git add src/Phil/LLVM/IR.hs src/Phil/LLVM/Verify.hs \
            src/Phil/LLVM/ClientControlSend.hs src/Phil/LLVM.hs phil-core.cabal
          git commit -m 'Register client control-send physical lowering'
          git push origin HEAD:client-control-send-abi

# second push intentionally triggers this already-registered temporary workflow
