name: Temporary INT-004 Multi-Binding Environment

on:
  push:
    branches: [phase1-int-004-multibinding-environments]
    paths:
      - 'test/Phase1INT004PortableNegativeManifestMain.hs'
      - 'test/fixtures/phase1-negative/**'
      - 'scripts/staging/int004_multibinding_environment.py'
      - '.github/workflows/tmp-int-004-multibinding-environment.yml'

permissions:
  contents: write

jobs:
  multibinding-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply portable multi-binding decoder
        run: python3 scripts/staging/int004_multibinding_environment.py

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck INT-004 multi-binding replay
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1INT004PortableNegativeManifestMain.hs

      - name: Replay all frozen negatives with incompatible-join portable
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT004PortableNegativeManifestMain.hs

      - name: Guard normalized multi-binding portability and fallback exclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          forbidden = ['.phil', 'examples/rejected', 'phase0EnvironmentFor', 'Phil.Surface', 'TyEndpoint']
          for filename in ['environment-profiles-v1.tsv', 'environment-bindings-v1.tsv']:
              text = Path('test/fixtures/phase1-negative', filename).read_text()
              for token in forbidden:
                  assert token not in text, f'{filename} contains implementation/path token: {token}'

          profiles = [line.split('\t') for line in Path('test/fixtures/phase1-negative/environment-profiles-v1.tsv').read_text().splitlines() if line]
          by_profile = {row[0]: row for row in profiles[1:]}
          join = by_profile['phase0.incompatible-join']
          assert join[1:8] == ['s0', 'linear', 'select', '-', '-', '-', 'left:left;right:right']
          assert join[8] == 'continue_with_common_state:continue-common-state'
          assert join[9] == 'false'

          bindings = [line.split('\t') for line in Path('test/fixtures/phase1-negative/environment-bindings-v1.tsv').read_text().splitlines() if line]
          assert bindings[0] == ['profile_id','binding_name','binding_mode','binding_type','binding_shape']
          assert bindings[1:] == [['phase0.incompatible-join','condition','unrestricted','bool','plain']]

          manifest = [line.split('\t') for line in Path('test/fixtures/phase1-negative/manifest.tsv').read_text().splitlines() if line]
          by_id = {row[0]: row for row in manifest[1:]}
          assert by_id['P1-NEG-P0-008'][4] == 'phase0.incompatible-join'

          replay = Path('test/Phase1INT004PortableNegativeManifestMain.hs').read_text()
          legacy_section = replay.split('legacyProfileEnvironment ::', 1)[1].split('checkIntegrity', 1)[0]
          assert 'phase0.incompatible-join' not in legacy_section
          assert '"select" -> do' in replay
          assert 'environment-bindings-v1.tsv' in replay
          assert 'PrimitiveContinueCommonState' in replay
          PY

      - name: Extra-binding corruption fails closed
        run: |
          set -euo pipefail
          cp test/fixtures/phase1-negative/environment-bindings-v1.tsv /tmp/environment-bindings-v1.tsv

          cat >> test/fixtures/phase1-negative/environment-bindings-v1.tsv <<'EOF'
          phase0.incompatible-join	condition	unrestricted	bool	plain
          EOF
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableNegativeManifestMain.hs; then
            echo 'duplicate portable extra binding was accepted' >&2
            exit 1
          fi
          cp /tmp/environment-bindings-v1.tsv test/fixtures/phase1-negative/environment-bindings-v1.tsv

          sed 's/phase0.incompatible-join/phase0.not-declared/' /tmp/environment-bindings-v1.tsv > test/fixtures/phase1-negative/environment-bindings-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableNegativeManifestMain.hs; then
            echo 'binding for undeclared portable profile was accepted' >&2
            exit 1
          fi
          cp /tmp/environment-bindings-v1.tsv test/fixtures/phase1-negative/environment-bindings-v1.tsv

          sed 's/\tbool\tplain/\tnot-a-type\tplain/' /tmp/environment-bindings-v1.tsv > test/fixtures/phase1-negative/environment-bindings-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableNegativeManifestMain.hs; then
            echo 'unknown portable binding type was accepted' >&2
            exit 1
          fi
          cp /tmp/environment-bindings-v1.tsv test/fixtures/phase1-negative/environment-bindings-v1.tsv

      - name: Replay restored portable corpus
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT004PortableNegativeManifestMain.hs

      - name: Replay legacy surface conformance harness
        run: cabal test phil-surface-conformance-tests

      - name: Transport validated multi-binding decoder semantics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/Phase1INT004PortableNegativeManifestMain.hs
          if git diff --cached --quiet; then
            echo 'Committed semantic head already contains multi-binding decoder.'
          else
            git commit -m 'int: materialize incompatible-join environment portably'
            git push origin HEAD:phase1-int-004-multibinding-environments
          fi
