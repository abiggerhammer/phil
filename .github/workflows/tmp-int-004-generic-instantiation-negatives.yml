name: Temporary INT-004 Generic Instantiation Negatives

on:
  push:
    branches: [phase1-int-004-generic-instantiation-negatives]
    paths:
      - 'test/fixtures/phase1-negative/generic-instantiation-v1/**'
      - 'test/Phase1INT004PortableGenericInstantiationNegativeMain.hs'
      - 'scripts/staging/int004_generic_instantiation_cleanup.py'
      - '.github/workflows/tmp-int-004-generic-instantiation-negatives.yml'

permissions:
  contents: write

jobs:
  portable-generic-instantiation-negatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply warning cleanup
        run: python3 scripts/staging/int004_generic_instantiation_cleanup.py

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck portable generic-instantiation replay
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1INT004PortableGenericInstantiationNegativeMain.hs

      - name: Replay portable generic-instantiation negatives
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT004PortableGenericInstantiationNegativeMain.hs

      - name: Guard portable data against Haskell-private authority
        run: |
          if grep -R -n -E 'GenericProviderInterfaceMismatch|GenericProviderRefinementMismatch|GenericPropositionEvidenceMismatch|GenericAssumptionNotPermitted|GenericExportNotPermitted|Phil\.Core|\.hs' \
              test/fixtures/phase1-negative/generic-instantiation-v1/*.tsv; then
            echo 'portable generic-instantiation TSV contains implementation-private identity' >&2
            exit 1
          fi

      - name: Reject unknown requirement kind
        run: |
          cp test/fixtures/phase1-negative/generic-instantiation-v1/requirements-v1.tsv /tmp/requirements.tsv
          sed -i '0,/provider-contract/s//not-a-requirement/' test/fixtures/phase1-negative/generic-instantiation-v1/requirements-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs >/tmp/int004-generic-inst.log 2>&1; then
            cat /tmp/int004-generic-inst.log
            echo 'unknown requirement kind unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/requirements.tsv test/fixtures/phase1-negative/generic-instantiation-v1/requirements-v1.tsv

      - name: Reject unknown disposition kind
        run: |
          cp test/fixtures/phase1-negative/generic-instantiation-v1/dispositions-v1.tsv /tmp/dispositions.tsv
          sed -i '0,/exact-provider/s//not-a-disposition/' test/fixtures/phase1-negative/generic-instantiation-v1/dispositions-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs >/tmp/int004-generic-inst.log 2>&1; then
            cat /tmp/int004-generic-inst.log
            echo 'unknown disposition kind unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/dispositions.tsv test/fixtures/phase1-negative/generic-instantiation-v1/dispositions-v1.tsv

      - name: Reject undeclared requirement reference
        run: |
          cp test/fixtures/phase1-negative/generic-instantiation-v1/dispositions-v1.tsv /tmp/dispositions.tsv
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/fixtures/phase1-negative/generic-instantiation-v1/dispositions-v1.tsv')
          rows = p.read_text().splitlines()
          cols = rows[1].split('\t')
          cols[1] = 'not-declared'
          rows[1] = '\t'.join(cols)
          p.write_text('\n'.join(rows) + '\n')
          PY
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs >/tmp/int004-generic-inst.log 2>&1; then
            cat /tmp/int004-generic-inst.log
            echo 'undeclared requirement reference unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/dispositions.tsv test/fixtures/phase1-negative/generic-instantiation-v1/dispositions-v1.tsv

      - name: Reject duplicate requirement id
        run: |
          cp test/fixtures/phase1-negative/generic-instantiation-v1/requirements-v1.tsv /tmp/requirements.tsv
          sed -n '2p' test/fixtures/phase1-negative/generic-instantiation-v1/requirements-v1.tsv >> test/fixtures/phase1-negative/generic-instantiation-v1/requirements-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs >/tmp/int004-generic-inst.log 2>&1; then
            cat /tmp/int004-generic-inst.log
            echo 'duplicate requirement id unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/requirements.tsv test/fixtures/phase1-negative/generic-instantiation-v1/requirements-v1.tsv

      - name: Reject malformed policy boolean
        run: |
          cp test/fixtures/phase1-negative/generic-instantiation-v1/policies-v1.tsv /tmp/policies.tsv
          sed -i '0,/false/s//not-a-bool/' test/fixtures/phase1-negative/generic-instantiation-v1/policies-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs >/tmp/int004-generic-inst.log 2>&1; then
            cat /tmp/int004-generic-inst.log
            echo 'malformed policy boolean unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/policies.tsv test/fixtures/phase1-negative/generic-instantiation-v1/policies-v1.tsv

      - name: Reject unknown authority
        run: |
          cp test/fixtures/phase1-negative/generic-instantiation-v1/manifest.tsv /tmp/manifest.tsv
          sed -i '0,/matrix:GEN-007/s//matrix:NOT-A-CASE/' test/fixtures/phase1-negative/generic-instantiation-v1/manifest.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs >/tmp/int004-generic-inst.log 2>&1; then
            cat /tmp/int004-generic-inst.log
            echo 'unknown authority unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/manifest.tsv test/fixtures/phase1-negative/generic-instantiation-v1/manifest.tsv

      - name: Reject missing Certified proof artifact
        run: |
          cp test/fixtures/phase1-negative/generic-instantiation-v1/authority-registry-v1.tsv /tmp/authority.tsv
          sed -i '0,/proof\/Phil\/Core\/GenericInstantiation.v/s//proof\/Phil\/Core\/DefinitelyMissing.v/' \
            test/fixtures/phase1-negative/generic-instantiation-v1/authority-registry-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs >/tmp/int004-generic-inst.log 2>&1; then
            cat /tmp/int004-generic-inst.log
            echo 'missing Certified proof unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/authority.tsv test/fixtures/phase1-negative/generic-instantiation-v1/authority-registry-v1.tsv

      - name: Replay restored portable generic-instantiation corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs

      - name: Replay legacy generic-instantiation corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1GenericInstantiationMain.hs

      - name: Replay prior portable generic corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericNegativeMain.hs

      - name: Replay frozen INT-004 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableNegativeManifestMain.hs

      - name: Transport tested generic-instantiation replay harness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          token = os.environ['GITHUB_TOKEN']
          path = 'test/Phase1INT004PortableGenericInstantiationNegativeMain.hs'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'phil-int004-generic-instantiation-staging',
          }
          req = urllib.request.Request(api + '?ref=' + branch, headers=headers)
          with urllib.request.urlopen(req) as response:
              current = json.load(response)
          payload = json.dumps({
              'message': 'INT-004: clean portable generic-instantiation replay harness',
              'content': base64.b64encode(open(path, 'rb').read()).decode(),
              'branch': branch,
              'sha': current['sha'],
          }).encode()
          req = urllib.request.Request(api, data=payload, method='PUT', headers={**headers, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
