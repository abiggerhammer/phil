name: Phase 1 Surface Determinacy Oracle Assembly Coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rocq-oracle-assembly-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check

      - name: Compile oracle assembly coverage
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          compile() {
            file="$1"
            echo "=== compiling ${file} at $(date -u +%FT%TZ) ==="
            rocq c -Q proof/Phil Phil "${file}"
            echo "=== finished ${file} at $(date -u +%FT%TZ) ==="
          }
          compile proof/Phil/Surface/Grammar.v
          compile proof/Phil/Surface/GrammarDerivation.v
          compile proof/Phil/Surface/GrammarDerivationOracle.v
          compile proof/Phil/Surface/GrammarDeterminacyCertificate.v
          compile proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          compile proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          compile proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          compile proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          compile proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          compile proof/Phil/Surface/GrammarDerivationLookahead.v
          compile proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
          compile proof/Phil/Surface/GrammarDeterminacyContinuationSoundness.v
          echo "=== timing GrammarDeterminacyOracleAssemblyCoverage.v at $(date -u +%FT%TZ) ==="
          timeout 300s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyOracleAssemblyCoverage.v
          echo "=== finished GrammarDeterminacyOracleAssemblyCoverage.v at $(date -u +%FT%TZ) ==="

      - name: Record oracle-assembly proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-determinacy-oracle-assembly-coverage
          cp \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDerivation.v \
            proof/Phil/Surface/GrammarDerivationOracle.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDeterminacyNullableFirst.v \
            proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v \
            proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v \
            proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v \
            proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v \
            proof/Phil/Surface/GrammarDerivationLookahead.v \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v \
            proof/Phil/Surface/GrammarDeterminacyContinuationSoundness.v \
            proof/Phil/Surface/GrammarDeterminacyOracleAssemblyCoverage.v \
            proof/Phil/Surface/GrammarDeterminacyOracleAssemblyCoverage.vo \
            surface-determinacy-oracle-assembly-coverage/
          sha256sum \
            grammar/phase1-surface.ebnf \
            grammar/phase1-surface-determinacy.json \
            proof/Phil/Surface/GrammarDeterminacyOracleAssemblyCoverage.v \
            proof/Phil/Surface/GrammarDeterminacyOracleAssemblyCoverage.vo \
            > surface-determinacy-oracle-assembly-coverage/identities.sha256
          cat surface-determinacy-oracle-assembly-coverage/identities.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-determinacy-oracle-assembly-coverage
          path: surface-determinacy-oracle-assembly-coverage
          if-no-files-found: error
