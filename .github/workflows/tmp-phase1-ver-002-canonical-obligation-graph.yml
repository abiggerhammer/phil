name: Temporary VER-002 canonical obligation graph staging

on:
  push:
    branches: [phase1-ver-002-canonical-obligation-graph]

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Run VER-002 canonical obligation graph regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationCanonicalObligationGraphMain.hs

      - name: Re-run VER-001 intrinsic invalidity boundary
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationIntrinsicInvalidityMain.hs

      - name: Run assurance handoff and discharge controls
        run: cabal test phil-assurance-handoff-tests phil-discharge-tests
