name: Phase 1 Provider Replacement Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Core/ProviderReplacementQualification.hs'
      - 'test/Phase1ProviderReplacementQualificationMain.hs'
      - 'docs/phase-1/provider-replacement-qualification-v1.md'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'app/Phase1ProviderReplacementCertificationMain.hs'
      - '.github/workflows/phase1-provider-replacement-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/ProviderReplacementQualification.hs'
      - 'test/Phase1ProviderReplacementQualificationMain.hs'
      - 'docs/phase-1/provider-replacement-qualification-v1.md'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'app/Phase1ProviderReplacementCertificationMain.hs'
      - '.github/workflows/phase1-provider-replacement-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-provider-replacement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-PROV-REPLACE-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderReplacementQualification.v
          mkdir -p phase1-provider-replacement-proof
          cp \
            proof/Phil/Core/ProviderReplacementQualification.v \
            proof/Phil/Core/ProviderReplacementQualification.vo \
            phase1-provider-replacement-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-provider-replacement-proof
          path: phase1-provider-replacement-proof
          if-no-files-found: error

  certify-phase1-provider-replacement:
    needs: rocq-phase1-provider-replacement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier substrate with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - name: Typecheck certifier
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code app/Phase1ProviderReplacementCertificationMain.hs
      - name: Re-run PROV-015 correspondence
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1ProviderReplacementQualificationMain.hs
      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-provider-replacement-proof
          path: phase1-provider-replacement-proof
      - name: Emit PHIL-PROV-REPLACE-001 certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-provider-replacement-certification
          cabal exec -- runghc -isrc app/Phase1ProviderReplacementCertificationMain.hs \
            phase1-provider-replacement-proof/ProviderReplacementQualification.v \
            phase1-provider-replacement-proof/ProviderReplacementQualification.vo \
            phase1-provider-replacement-certification/PHIL-PROV-REPLACE-001.rocq.cert
          sha256sum \
            src/Phil/Core/ProviderReplacementQualification.hs \
            test/Phase1ProviderReplacementQualificationMain.hs \
            docs/phase-1/provider-replacement-qualification-v1.md \
            proof/Phil/Core/ProviderReplacementQualification.v \
            app/Phase1ProviderReplacementCertificationMain.hs \
            > phase1-provider-replacement-certification/PHIL-PROV-REPLACE-001.correspondence.sha256
          cat phase1-provider-replacement-certification/PHIL-PROV-REPLACE-001.rocq.cert
          sha256sum phase1-provider-replacement-certification/PHIL-PROV-REPLACE-001.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-provider-replacement-proof-certification
          path: phase1-provider-replacement-certification
          if-no-files-found: error
