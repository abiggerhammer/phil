name: Phase 1 P8-D1 independent UTF-8 stream proof

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/P8D1UnicodeStreamModel.v'
      - 'test/P8D1UnicodeStreamMain.hs'
      - 'docs/phase-1/p8-d1-unicode-stream-proof-boundary-v1.md'
      - '.github/workflows/phase1-p8-d1-unicode-stream.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Verification/P8D1UnicodeStreamModel.v'
      - 'test/P8D1UnicodeStreamMain.hs'
      - 'docs/phase-1/p8-d1-unicode-stream-proof-boundary-v1.md'
      - '.github/workflows/phase1-p8-d1-unicode-stream.yml'

permissions:
  contents: read

jobs:
  native-utf8-stream-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Strict complete native build
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Strict native differential typecheck
        run: cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/P8D1UnicodeStreamMain.hs
      - name: Execute actual Data.Text strict UTF-8 stream differential and tamper negatives
        run: cabal exec -- runghc -isrc -Wall -Werror test/P8D1UnicodeStreamMain.hs
      - name: Preserve source and selected stage/release regression controls
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationSourceArtifactClosureMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1StageClosureMain.hs

  rocq-utf8-stream-proof:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile full C1 to D1 proof closure, inspect named assumptions and recursively check proof objects
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          rocq -v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/P8UnicodeUtf8Model.v | tee /tmp/p8-d1-c1-assumptions.log
          rocq c -Q proof/Phil Phil proof/Phil/Verification/P8D1UnicodeStreamModel.v | tee /tmp/p8-d1-assumptions.log
          rocq check -Q proof/Phil Phil Phil.Verification.P8UnicodeUtf8Model
          rocq check -Q proof/Phil Phil Phil.Verification.P8D1UnicodeStreamModel
          sha256sum proof/Phil/Verification/P8UnicodeUtf8Model.vo proof/Phil/Verification/P8D1UnicodeStreamModel.vo /tmp/p8-d1-c1-assumptions.log /tmp/p8-d1-assumptions.log
