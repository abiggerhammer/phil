name: Phase 1 Target Runtime Primitive Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/RuntimePrimitiveIdentity.v'
      - 'proof/Phil/Core/RuntimePrimitiveIdentityImplementation.v'
      - 'proof/Phil/Core/RuntimePrimitiveIdentityImplementationExtraction.v'
      - 'proof/Phil/LLVM/Preservation.v'
      - 'proof/Phil/LLVM/RuntimeSymbolIdentity.v'
      - 'proof/Phil/LLVM/RuntimeSymbolTargetPrimitiveRefinement.v'
      - 'src/Phil/Systems/RuntimePrimitiveReuse.hs'
      - 'app/RuntimePrimitiveIdentityDecisionCorrespondenceMain.hs'
      - 'test/Phase1RuntimePrimitiveReuseMain.hs'
      - 'docs/phase-1/backend-portability-audit-v1.md'
      - 'docs/phase-1/target-runtime-primitive-implementation-refinement-v1.md'
      - '.github/workflows/phase1-target-runtime-primitive-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/RuntimePrimitiveIdentity.v'
      - 'proof/Phil/Core/RuntimePrimitiveIdentityImplementation.v'
      - 'proof/Phil/Core/RuntimePrimitiveIdentityImplementationExtraction.v'
      - 'proof/Phil/LLVM/RuntimeSymbolTargetPrimitiveRefinement.v'
      - 'src/Phil/Systems/RuntimePrimitiveReuse.hs'
      - 'app/RuntimePrimitiveIdentityDecisionCorrespondenceMain.hs'
      - 'test/Phase1RuntimePrimitiveReuseMain.hs'
      - 'docs/phase-1/target-runtime-primitive-implementation-refinement-v1.md'
      - '.github/workflows/phase1-target-runtime-primitive-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-target-runtime-primitive-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile target-neutral primitive identity, implementation refinement, and LLVM refinement
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimePrimitiveIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimePrimitiveIdentityImplementation.v
          rm -f RuntimePrimitiveIdentityKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimePrimitiveIdentityImplementationExtraction.v
          test -s RuntimePrimitiveIdentityKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Preservation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RuntimeSymbolIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RuntimeSymbolTargetPrimitiveRefinement.v
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target-runtime-primitive-proof
          cp \
            proof/Phil/Core/RuntimePrimitiveIdentity.v \
            proof/Phil/Core/RuntimePrimitiveIdentity.vo \
            proof/Phil/Core/RuntimePrimitiveIdentityImplementation.v \
            proof/Phil/Core/RuntimePrimitiveIdentityImplementation.vo \
            proof/Phil/LLVM/RuntimeSymbolTargetPrimitiveRefinement.v \
            proof/Phil/LLVM/RuntimeSymbolTargetPrimitiveRefinement.vo \
            RuntimePrimitiveIdentityKernel.hs \
            target-runtime-primitive-proof/
          sha256sum \
            proof/Phil/Core/RuntimePrimitiveIdentity.v \
            proof/Phil/Core/RuntimePrimitiveIdentity.vo \
            proof/Phil/Core/RuntimePrimitiveIdentityImplementation.v \
            proof/Phil/Core/RuntimePrimitiveIdentityImplementation.vo \
            proof/Phil/LLVM/RuntimeSymbolIdentity.v \
            proof/Phil/LLVM/RuntimeSymbolTargetPrimitiveRefinement.v \
            proof/Phil/LLVM/RuntimeSymbolTargetPrimitiveRefinement.vo \
            RuntimePrimitiveIdentityKernel.hs \
            src/Phil/Systems/RuntimePrimitiveReuse.hs \
            app/RuntimePrimitiveIdentityDecisionCorrespondenceMain.hs \
            test/Phase1RuntimePrimitiveReuseMain.hs \
            docs/phase-1/target-runtime-primitive-implementation-refinement-v1.md \
            > target-runtime-primitive-proof/PHIL-TARGET-RUNTIME-PRIM-001.proof.sha256
          {
            echo 'obligation=PHIL-TARGET-RUNTIME-PRIM-001'
            echo 'evidence=Rocq-9.2.0-machine-refinement-staging'
            cat target-runtime-primitive-proof/PHIL-TARGET-RUNTIME-PRIM-001.proof.sha256
          } > target-runtime-primitive-proof/PHIL-TARGET-RUNTIME-PRIM-001.proof-certificate.txt
          cat target-runtime-primitive-proof/PHIL-TARGET-RUNTIME-PRIM-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-target-runtime-primitive-proof
          path: target-runtime-primitive-proof
          if-no-files-found: error

  verify-target-runtime-primitive-correspondence:
    needs: rocq-target-runtime-primitive-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-target-runtime-primitive-proof
          path: target-runtime-primitive-proof
      - name: Strict typecheck exact kernel and SYS-016 correspondence surface
        run: |
          set -euo pipefail
          cabal exec -- ghc -i"$PWD/target-runtime-primitive-proof" -Wall -Werror -Wno-unused-imports -fno-code target-runtime-primitive-proof/RuntimePrimitiveIdentityKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/RuntimePrimitiveReuse.hs
          cabal exec -- ghc -i"$PWD/target-runtime-primitive-proof" -Wall -Werror -fno-code app/RuntimePrimitiveIdentityDecisionCorrespondenceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1RuntimePrimitiveReuseMain.hs
      - name: Execute exact extracted-kernel controls
        run: cabal exec -- runghc -i"$PWD/target-runtime-primitive-proof" -Wall -Werror app/RuntimePrimitiveIdentityDecisionCorrespondenceMain.hs
      - name: Re-run unchanged SYS-016 correspondence corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimePrimitiveReuseMain.hs
