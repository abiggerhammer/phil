name: FSEM-01 J-5 Linear Join Slot Preflight

on:
  push:
    branches:
      - formal-semantics/fsem01-j5-linear-join-slot
    paths:
      - 'src/Phil/Surface/Check/Engine.hs'
      - 'src/Phil/Surface/GrammarV1/SourceLinearJoinTelescope.hs'
      - 'phil-core.cabal'
      - 'test/Phase1FSEM01LinearJoinTelescopeMain.hs'
      - 'test/fixtures/fsem01-linear-join-telescope-v1/**'
      - 'proof/Phil/Surface/SurfaceSourceLinearJoinTelescope.v'
      - '.github/workflows/fsem01-j5-linear-join-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/Check/Engine.hs'
      - 'src/Phil/Surface/GrammarV1/SourceLinearJoinTelescope.hs'
      - 'phil-core.cabal'
      - 'test/Phase1FSEM01LinearJoinTelescopeMain.hs'
      - 'test/fixtures/fsem01-linear-join-telescope-v1/**'
      - 'proof/Phil/Surface/SurfaceSourceLinearJoinTelescope.v'
      - 'docs/phase-1/formal-semantics-linear-join-j5-fsem01-v1.md'
      - '.github/workflows/fsem01-j5-linear-join-preflight.yml'

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rocq-linear-slot:
    name: Rocq exact Linear consume/join/fresh slot/one-shot return
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile conditional Core Linear slot correspondence and recursive object check
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Surface/SurfaceSourceLinearJoinTelescope.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceSourceLinearJoinTelescope
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceSourceLinearJoinTelescope.v; then
            echo "Unproved J-5 Linear slot claims" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceSourceLinearJoinTelescope.v \
                     proof/Phil/Surface/SurfaceSourceLinearJoinTelescope.vo

  native-linear-source:
    name: Strict GHC source-to-Core Linear phi, exact failure prefixes and regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Strict production checker, source adapter and grammar witnesses
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
          for test in \
            Phase1FSEM01BoolJoinTelescopeMain \
            Phase1FSEM01TwoBoolJoinTelescopeMain \
            Phase1FSEM01LinearLoopTransferMain \
            Phase1FSEM01LinearJoinTelescopeMain
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
          sha256sum src/Phil/Surface/Check/Engine.hs \
                     src/Phil/Surface/GrammarV1/SourceLinearJoinTelescope.hs \
                     test/Phase1FSEM01LinearJoinTelescopeMain.hs \
                     test/fixtures/fsem01-linear-join-telescope-v1/*.phil
