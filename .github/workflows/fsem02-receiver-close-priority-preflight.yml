name: FSEM-02 Receiver Close Priority Preflight

on:
  push:
    branches:
      - formal-semantics/fsem02-receiver-close-priority
    paths:
      - 'test/Phase1FSEM02RestrictedSourceTransferMain.hs'
      - 'test/fixtures/fsem02-restricted-source-transfer-v1/**'
      - 'proof/Phil/Core/FSEM02ReceiverClosePriority.v'
      - 'docs/phase-1/typing-and-semantics-reader-guide-v1.md'
      - 'docs/phase-1/formal-semantics-receiver-close-native-priority-fsem02-v1.md'
      - '.github/workflows/fsem02-receiver-close-priority-preflight.yml'
  pull_request:
    paths:
      - 'test/Phase1FSEM02RestrictedSourceTransferMain.hs'
      - 'test/fixtures/fsem02-restricted-source-transfer-v1/**'
      - 'proof/Phil/Core/FSEM02ReceiverClosePriority.v'
      - 'docs/phase-1/typing-and-semantics-reader-guide-v1.md'
      - 'docs/phase-1/formal-semantics-receiver-close-native-priority-fsem02-v1.md'
      - '.github/workflows/fsem02-receiver-close-priority-preflight.yml'

permissions:
  contents: read

jobs:
  strict-source-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - run: bash scripts/ci/cabal-update-retry.sh
      - run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Receiver source-negative versus native resource matrix
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1FSEM02RestrictedSourceTransferMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1FSEM02RestrictedSourceTransferMain.hs
          sha256sum test/Phase1FSEM02RestrictedSourceTransferMain.hs test/fixtures/fsem02-restricted-source-transfer-v1/*.phil
  rocq:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Exact finite priority and no-successor theorems
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/FSEM02ReceiverClosePriority.v
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' proof/Phil/Core/FSEM02ReceiverClosePriority.v; then exit 1; fi
          sha256sum proof/Phil/Core/FSEM02ReceiverClosePriority.v proof/Phil/Core/FSEM02ReceiverClosePriority.vo
