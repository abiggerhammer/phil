name: FSEM-01 Mixed Affine Linear Early Preflight

concurrency:
  # PR runs supersede only earlier runs of the same workflow and same PR.
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Focused Haskell/Rocq gate on work-branch pushes, BEFORE broad PR CI.
  push:
    branches:
      - formal-semantics/fsem01-mixed-affine-linear
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceAffineResource.hs'
      - 'test/Phase1FSEM01MixedAffineLinearMain.hs'
      - 'test/fixtures/fsem01-mixed-affine-linear-v1/**'
      - 'proof/Phil/Surface/SurfaceMixedAffineLinearBridge.v'
      - 'docs/phase-1/formal-semantics-mixed-affine-linear-fsem01-v1.md'
      - '.github/workflows/fsem01-mixed-affine-linear-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceAffineResource.hs'
      - 'test/Phase1FSEM01MixedAffineLinearMain.hs'
      - 'test/fixtures/fsem01-mixed-affine-linear-v1/**'
      - 'proof/Phil/Surface/SurfaceMixedAffineLinearBridge.v'
      - 'docs/phase-1/formal-semantics-mixed-affine-linear-fsem01-v1.md'
      - '.github/workflows/fsem01-mixed-affine-linear-preflight.yml'

permissions:
  contents: read

jobs:
  strict-haskell-mixed-source:
    name: Strict SURF-008 and mixed affine/linear source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Update Hackage index with bounded HTTP1 retry
        shell: bash
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Build strict production library
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
      - name: Run SURF-008 and FSEM-01 source regression battery
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            Phase1GrammarV1IntrinsicTypeCompositionMain \
            Phase1GrammarV1CallableContractMain \
            Phase1GrammarV1CheckedBoundaryValueTypeMain \
            Phase1GrammarV1CheckedTypeAliasMain \
            Phase1GrammarV1CheckedRecordFieldsMain \
            Phase1GrammarV1CheckedDataVariantsMain \
            Phase1GrammarV1CheckedDataModeCompositionMain \
            Phase1GrammarV1NamedTypeModeMain \
            Phase1FSEM01TwoOwnerSourceMain \
            Phase1FSEM01FlatProductMain \
            Phase1FSEM01FiniteContextMain \
            Phase1FSEM01SourceAffineMain
          do
            echo "== SURF-008 / $test =="
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
      - name: Typecheck and execute real mixed-mode source paths
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1FSEM01MixedAffineLinearMain.hs
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1FSEM01MixedAffineLinearMain.hs
          sha256sum src/Phil/Surface/GrammarV1/SourceAffineResource.hs \
            test/Phase1FSEM01MixedAffineLinearMain.hs

  rocq-mixed-frame:
    name: Mixed ownership spectator frame and linear debt proofs
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile existing and new model theorems
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Surface/SurfaceFiniteContextFrame.v \
            proof/Phil/Surface/SurfaceSourceAffineBridge.v \
            proof/Phil/Surface/SurfaceMixedAffineLinearBridge.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceMixedAffineLinearBridge.v; then
            echo "New unproved mixed-mode assumption" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceMixedAffineLinearBridge.v \
            proof/Phil/Surface/SurfaceMixedAffineLinearBridge.vo
