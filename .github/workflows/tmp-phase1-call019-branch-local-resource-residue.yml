name: Temporary CALL-019 Branch Local Resource Residue

on:
  push:
    branches:
      - phase1-call019-branch-local-resource-residue

permissions:
  contents: read

jobs:
  branch-local-resource-residue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build Haskell substrate
        run: cabal build all --enable-tests
      - name: Check CALL-019 branch-local resource residue
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019OutcomeBranchResourcesMain.hs
      - name: Replay CALL-019 branch residue join discipline
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019BranchResidueJoinMain.hs
      - name: Replay CALL-019 Surface arm proof bindings
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019SurfaceArmProofBindingsMain.hs
      - name: Replay CALL-019 outcome continuation state
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019OutcomeContinuationStateMain.hs
      - name: Replay Steve invoke integration
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1INT006SteveApplicationShellMain.hs
