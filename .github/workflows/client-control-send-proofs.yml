# Equivalence witness for Phase 0 LLVM boundary proof consolidation.
name: Client Control Send Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/LLVM/ClientControlSend.v'
      - 'src/Phil/LLVM/ClientControlSend.hs'
      - 'src/Phil/LLVM/ClientControlSendProofCertification.hs'
      - 'src/Phil/LLVM/ExactSend.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/Systems/ClientOutbound.hs'
      - 'app/ClientControlSendProofCorrespondenceMain.hs'
      - 'app/ClientControlSendProofCertificationMain.hs'
      - 'app/LLVMClientControlSendMain.hs'
      - 'runtime/phase0/client_control_send_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ClientControlSendABIMain.hs'
      - 'docs/phase-0/client-control-send-abi-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/client-control-send-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/LLVM/ClientControlSend.v'
      - 'src/Phil/LLVM/ClientControlSend.hs'
      - 'src/Phil/LLVM/ClientControlSendProofCertification.hs'
      - 'src/Phil/LLVM/ExactSend.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Verify.hs'
      - 'src/Phil/Systems/ClientOutbound.hs'
      - 'app/ClientControlSendProofCorrespondenceMain.hs'
      - 'app/ClientControlSendProofCertificationMain.hs'
      - 'app/LLVMClientControlSendMain.hs'
      - 'runtime/phase0/client_control_send_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ClientControlSendABIMain.hs'
      - 'docs/phase-0/client-control-send-abi-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/client-control-send-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-client-control-send:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check Client Control Send proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ClientControlSend.v
      - name: Stage checked Client Control Send proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rocq-client-control-send/proof/Phil/LLVM
          cp proof/Phil/LLVM/ClientControlSend.v \
             proof/Phil/LLVM/ClientControlSend.vo \
             rocq-client-control-send/proof/Phil/LLVM/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-client-control-send-checked-proof-objects
          path: rocq-client-control-send/
          if-no-files-found: error
          retention-days: 14

  certify-client-control-send:
    needs: rocq-client-control-send
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-client-control-send-checked-proof-objects
          path: rocq-client-control-send

      - name: Build target and focused regression
        run: |
          cabal build lib:phil-core \
            phil-llvm-phase0-client-control-send \
            phil-client-control-send-abi-tests

      - name: Run focused client-control-send regression
        run: cabal test phil-client-control-send-abi-tests --test-show-details=direct

      - name: Typecheck proof support with warnings as errors
        run: |
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/LLVM/ClientControlSendProofCertification.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/ClientControlSendProofCorrespondenceMain.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/ClientControlSendProofCertificationMain.hs

      - name: Run exact correspondence and drift checks
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/ClientControlSendProofCorrespondenceMain.hs \
            -o phil-check-client-control-send-proof-correspondence
          ./phil-check-client-control-send-proof-correspondence

      - name: Re-run LLVM, ABI, provider, and native gates
        shell: bash
        run: |
          set -euo pipefail
          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-client-control-send)"
          "$EMITTER" > phase0-client-control-send.ll
          "$LLVM_AS" phase0-client-control-send.ll -o phase0-client-control-send.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/client_control_send_v1_smoke.c \
            -o client-control-send-runtime.ll
          python3 scripts/check_runtime_abi.py --partial \
            phase0-client-control-send.ll client-control-send-runtime.ll
          "$LLVM_AS" client-control-send-runtime.ll -o client-control-send-runtime.bc
          "$LLVM_LINK" phase0-client-control-send.bc client-control-send-runtime.bc \
            -o phase0-client-control-send-partially-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 \
            runtime/phase0/client_control_send_v1_smoke.c \
            runtime/phase0/client_control_send_v1_smoke_main.c \
            -o client-control-send-smoke
          ./client-control-send-smoke

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm runtime/phase0/client_control_send_v1_bad_ambient.c \
            -o client-control-send-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-client-control-send.ll client-control-send-bad-ambient.ll; then
            echo "expected ABI checker to reject ambient/nullary client control-send provider" >&2
            exit 1
          fi

      - name: Build proof-bound CERT-014 certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/ClientControlSendProofCertificationMain.hs \
            -o phil-certify-client-control-send

      - name: Produce proof certificate and proof-bound CERT-014
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client-control-send-certificates
          ./phil-certify-client-control-send
          for certificate in client-control-send-certificates/*; do
            echo "===== ${certificate} ====="
            cat "${certificate}"
            sha256sum "${certificate}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: phil-client-control-send-proof-certification
          path: client-control-send-certificates/*
          if-no-files-found: error
          retention-days: 30
