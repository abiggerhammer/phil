name: Temporary INT-001 witness end-to-end staging

on:
  push:
    branches: [phase1-int-001-witness-e2e]
    paths:
      - 'scripts/staging/int001_witness_e2e.py'
      - 'test/Phase1INT001WitnessE2EMain.hs'
      - 'src/Phil/Compiler/SourceCorePolicy.hs'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - '.github/workflows/tmp-int-001-witness-e2e.yml'

jobs:
  witness-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-int-001-witness-e2e
          fetch-depth: 0
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Confirm staged correspondence repairs are transported
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging/int001_witness_e2e.py
          git diff --exit-code -- \
            src/Phil/Compiler/SourceCorePolicy.hs \
            src/Phil/Examples/Phase1/SystemsWitnesses.hs

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck INT-001 correspondence boundary
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Compiler/SourceCorePolicy.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Examples/Phase1/SystemsWitnesses.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1INT001WitnessE2EMain.hs

      - name: Replay earlier INT-001 correspondence gates
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001SourceCorePolicyMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001SourceSystemsMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001SteveOrdinaryProviderSourceMain.hs

      - name: Replay generic Systems witness gate
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1GenericSystemsLoweringMain.hs

      - name: Run real witness end-to-end gate
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001WitnessE2EMain.hs
