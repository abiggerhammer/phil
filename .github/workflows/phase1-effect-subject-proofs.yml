name: Phase 1 Effect Subject Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/EffectSubject.v'
      - 'proof/Phil/Core/EffectSubjectImplementation.v'
      - 'proof/Phil/Core/EffectSubjectImplementationExtraction.v'
      - 'docs/phase-1/effect-subject-implementation-refinement-v1.md'
      - 'docs/phase-1/effect-subject-production-binding-v1.md'
      - 'app/EffectSubjectDecisionCorrespondenceMain.hs'
      - 'src/EffectSubjectKernel.hs'
      - 'src/Phil/Core/Effect.hs'
      - 'test/Phase1GrammarV1CallableEffectsMain.hs'
      - '.github/workflows/phase1-effect-subject-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/EffectSubject.v'
      - 'proof/Phil/Core/EffectSubjectImplementation.v'
      - 'proof/Phil/Core/EffectSubjectImplementationExtraction.v'
      - 'docs/phase-1/effect-subject-implementation-refinement-v1.md'
      - 'docs/phase-1/effect-subject-production-binding-v1.md'
      - 'app/EffectSubjectDecisionCorrespondenceMain.hs'
      - 'src/EffectSubjectKernel.hs'
      - 'src/Phil/Core/Effect.hs'
      - 'test/Phase1GrammarV1CallableEffectsMain.hs'
      - '.github/workflows/phase1-effect-subject-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-effect-subject-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-EFFECT-SUBJECT-001 proof and exact production kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/EffectSubject.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/EffectSubjectImplementation.v
          rm -f EffectSubjectKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/EffectSubjectImplementationExtraction.v
          test -s EffectSubjectKernel.hs
          grep -q 'decideEffectSubjectCorrespondence' EffectSubjectKernel.hs
          grep -q 'decideEffectSubjectRetarget' EffectSubjectKernel.hs

      - name: Record proof and extracted-kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p effect-subject-proof
          cp \
            proof/Phil/Core/EffectSubject.v \
            proof/Phil/Core/EffectSubject.vo \
            proof/Phil/Core/EffectSubjectImplementation.v \
            proof/Phil/Core/EffectSubjectImplementation.vo \
            proof/Phil/Core/EffectSubjectImplementationExtraction.v \
            proof/Phil/Core/EffectSubjectImplementationExtraction.vo \
            EffectSubjectKernel.hs \
            effect-subject-proof/
          sha256sum \
            effect-subject-proof/EffectSubject.v \
            effect-subject-proof/EffectSubject.vo \
            effect-subject-proof/EffectSubjectImplementation.v \
            effect-subject-proof/EffectSubjectImplementation.vo \
            effect-subject-proof/EffectSubjectKernel.hs \
            > effect-subject-proof/PHIL-EFFECT-SUBJECT-001.proof.sha256
          cat effect-subject-proof/PHIL-EFFECT-SUBJECT-001.proof.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-effect-subject-production-binding
          path: effect-subject-proof
          if-no-files-found: error

      - name: Verify checked-in production kernel is the exact extraction
        shell: bash
        run: |
          set -euo pipefail
          cmp EffectSubjectKernel.hs src/EffectSubjectKernel.hs
          test "$(sha256sum EffectSubjectKernel.hs | cut -d' ' -f1)" = \
            '91b982a6891d04a3915d7cb8293c3c39ae3da0789c49f0ced4235a3d4c8f154e'

  verify-effect-subject-correspondence:
    needs: rocq-effect-subject-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - uses: actions/download-artifact@v4
        with:
          name: rocq-effect-subject-production-binding
          path: effect-subject-proof

      - name: Verify exact extracted production kernel and direct controls
        run: |
          set -euo pipefail
          cmp effect-subject-proof/EffectSubjectKernel.hs src/EffectSubjectKernel.hs
          test "$(sha256sum src/EffectSubjectKernel.hs | cut -d' ' -f1)" = \
            '91b982a6891d04a3915d7cb8293c3c39ae3da0789c49f0ced4235a3d4c8f154e'
          ghc -Wall -Werror -fno-code effect-subject-proof/EffectSubjectKernel.hs
          ghc -Wall -Werror -fno-code src/EffectSubjectKernel.hs
          ghc -Wall -Werror \
            -isrc \
            app/EffectSubjectDecisionCorrespondenceMain.hs \
            -o effect-subject-kernel-controls
          ./effect-subject-kernel-controls

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Typecheck bound EFF-001/002 implementation and corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Effect.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1GrammarV1CallableEffectsMain.hs

      - name: Re-run unchanged EFF-001/002 callable-effect pressure
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1CallableEffectsMain.hs

      - name: Record implementation-refinement production-binding identities
        run: |
          set -euo pipefail
          mkdir -p effect-subject-production-binding
          sha256sum \
            src/EffectSubjectKernel.hs \
            src/Phil/Core/Effect.hs \
            test/Phase1GrammarV1CallableEffectsMain.hs \
            app/EffectSubjectDecisionCorrespondenceMain.hs \
            proof/Phil/Core/EffectSubjectImplementation.v \
            proof/Phil/Core/EffectSubjectImplementationExtraction.v \
            docs/phase-1/effect-subject-implementation-refinement-v1.md \
            docs/phase-1/effect-subject-production-binding-v1.md \
            > effect-subject-production-binding/PHIL-EFFECT-SUBJECT-001.closeout.sha256
          cat effect-subject-production-binding/PHIL-EFFECT-SUBJECT-001.closeout.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: effect-subject-production-binding
          path: effect-subject-production-binding
          if-no-files-found: error
