name: Temporary apply CALL-019 surface decision bridge

on:
  push:
    branches:
      - phase1-call019-surface-decision-bridge

permissions:
  contents: write

jobs:
  apply-call019-surface-decision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-call019-surface-decision-bridge

      - name: Patch neutral surface decision seam
        shell: bash
        run: python3 .github/tmp-apply-call019-surface-decision.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add src/Phil/Surface/Check/Types.hs src/Phil/Surface/Check.hs src/Phil/Surface/Check/Engine.hs src/Phil/Compiler/CallableOutcomeDispatch.hs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "CALL-019: wire callable outcomes through decide"
          git push origin HEAD:phase1-call019-surface-decision-bridge
