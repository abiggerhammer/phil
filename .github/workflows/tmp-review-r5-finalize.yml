name: Temporary R5 finalization

on:
  push:
    branches: [phase1-review-r5-rocq-certifier-boundary]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-review-r5-rocq-certifier-boundary
      - name: Wire permanent R5 gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          proofs = Path('.github/workflows/proofs.yml')
          text = proofs.read_text()
          marker = '  certify-recognized-record:\n'
          if text.count(marker) != 1:
              raise SystemExit('expected one recognized-record job marker')
          prefix, suffix = text.split(marker, 1)
          old = '          "$CERTIFIER" \\\n'
          new = '          "$CERTIFIER" --trusted-checked-inputs \\\n'
          count = prefix.count(old)
          if count != 3:
              raise SystemExit(f'expected three phil-certify-core-scalar invocations before recognized-record job, found {count}')
          proofs.write_text(prefix.replace(old, new) + marker + suffix)

          audit = Path('.github/workflows/phase1-audit-reconciliation-conformance.yml')
          text = audit.read_text()
          anchor = (
              '      - name: REVIEW-R03 LLVM closed-world function coverage\n'
              '        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ReviewR3LLVMFunctionCoverageMain.hs\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('expected one R3 audit anchor')
          addition = anchor + (
              '      - name: REVIEW-R05 public Rocq proof authority requires explicit trusted packaging\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              "          cat > /tmp/review-r5.v <<'EOF'\n"
              '          (* PHIL-CORE-SCALAR-001 *)\n'
              '          Theorem scalar_literal_has_intrinsic_type.\n'
              '          Theorem scalar_literal_type_is_deterministic.\n'
              '          Theorem boolean_literals_are_valid.\n'
              '          Theorem valid_uint_has_positive_width.\n'
              '          Theorem valid_uint_is_below_modulus.\n'
              '          Theorem zero_width_uint_is_invalid.\n'
              '          Theorem uint_at_modulus_is_invalid.\n'
              '          EOF\n'
              "          printf 'not-a-rocq-object' > /tmp/review-r5.vo\n"
              '          if cabal run exe:phil-certify-core-scalar -- /tmp/review-r5.v /tmp/review-r5.vo /tmp/review-r5.cert; then\n'
              "            echo 'legacy unchecked certification invocation unexpectedly succeeded' >&2\n"
              '            exit 1\n'
              '          fi\n'
              '          cabal run exe:phil-certify-core-scalar -- --trusted-checked-inputs /tmp/review-r5.v /tmp/review-r5.vo /tmp/review-r5.cert\n'
              "          grep -q 'trusted-packaging' /tmp/review-r5.cert\n"
          )
          audit.write_text(text.replace(anchor, addition, 1))
          PY
          git diff --check
          if git grep -n -E 'certify(CoreScalar)?RocqProof|certifyRocqProofBundle' -- '*.hs'; then
            echo 'legacy misleading Rocq certification symbol remains' >&2
            exit 1
          fi
          rm .github/workflows/tmp-review-r5-finalize.yml
          git diff --check
          git diff --stat
      - name: Commit final R5 wiring
        run: |
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add -A
          git commit -m "review: register R5 trusted Rocq packaging boundary"
          git push origin HEAD:phase1-review-r5-rocq-certifier-boundary
