name: Audit Landed Event Composition

on:
  push:
    branches: [audit-durable-subject-independent-20260924]
    paths: ['.github/workflows/audit-landed-event-composition.yml']

permissions:
  contents: read

concurrency:
  group: audit-landed-event-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-event-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c1b3df8a93c1897ead6d497b3476b6ec0143312
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f00482b3a5e2ada1ec2a9bf776be9639bd9871b7
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1f32aa4ae1aeeaee6db39975b3a86e35adf76890
          path: historical
          persist-credentials: false
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.18.1.0'
      - name: Preserve and verify exact inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/drivers evidence/build-adapter evidence/build-closure
          git -C subject rev-parse HEAD > evidence/subject-commit.txt
          git -C driver rev-parse HEAD > evidence/driver-commit.txt
          git -C historical rev-parse HEAD > evidence/fixture-commit.txt
          printf '%s\n' '${{ github.sha }}' > evidence/workflow-commit.txt
          test "$(cat evidence/subject-commit.txt)" = 6c1b3df8a93c1897ead6d497b3476b6ec0143312
          test "$(cat evidence/driver-commit.txt)" = f00482b3a5e2ada1ec2a9bf776be9639bd9871b7
          test "$(cat evidence/fixture-commit.txt)" = 1f32aa4ae1aeeaee6db39975b3a86e35adf76890
          git -C subject status --porcelain --untracked-files=all > evidence/subject-status-before.txt
          test ! -s evidence/subject-status-before.txt
          cp driver/audit/landed-event-chain/*.hs evidence/drivers/
          cp historical/audit/definedness-final-closure/DefinednessClosureControls.hs evidence/drivers/ClosureFixture.original.hs
          test "$(git hash-object evidence/drivers/ClosureFixture.original.hs)" = c80410a33dfc35c77c6fd358cc00232763405330
          python3 - <<'PY'
          import difflib
          from pathlib import Path
          original=Path('evidence/drivers/ClosureFixture.original.hs').read_text()
          assert original.count('module Main (main) where') == 1
          old='(Map.fromList [(rev h,parentId) | h <- certificateEntries])'
          assert original.count(old) == 1
          adapted=original.replace('module Main (main) where','module ClosureFixture where').replace(old,old+'\n        Map.empty')
          Path('evidence/drivers/ClosureFixture.hs').write_text(adapted)
          Path('evidence/fixture-compatibility.diff').write_text(''.join(difflib.unified_diff(original.splitlines(True),adapted.splitlines(True),fromfile='historical',tofile='namespace-and-empty-direct-map')))
          PY
          sha256sum evidence/drivers/*.hs > evidence/drivers.sha256
          for path in audit/landed-event-chain/EventAdapterPreservation.hs audit/landed-event-chain/EventClosureComposition.hs; do
            printf '%s %s\n' "$(git -C driver rev-parse "HEAD:$path")" "$path" >> evidence/driver-git-blobs.txt
          done
          for path in src/Phil/Assurance.hs src/Phil/Assurance/Handoff.hs src/Phil/Assurance/EvidenceFactAuthority.hs src/Phil/Verification/ManifestClosure.hs src/Phil/Core/Value.hs src/Phil/Core/Checker.hs src/Phil/Core/Discharge.hs; do
            printf '%s %s\n' "$(git -C subject rev-parse "HEAD:$path")" "$path" >> evidence/source-git-blobs.txt
          done
          ghc --numeric-version > evidence/ghc-version.txt
          cabal --numeric-version > evidence/cabal-version.txt
      - name: Build exact production substrate
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cabal update 2>&1 | tee ../evidence/dependency-index.log
          cabal build all --enable-tests 2>&1 | tee ../evidence/build.log
      - name: Strictly compile independent actual-event drivers
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -O0 -Wall -Werror -isrc -outputdir ../evidence/build-adapter ../evidence/drivers/EventAdapterPreservation.hs -o ../evidence/adapter-test 2>&1 | tee ../evidence/adapter-compile.log
          cabal exec -- ghc -O0 -Wall -Werror -isrc -i../evidence/drivers -outputdir ../evidence/build-closure ../evidence/drivers/EventClosureComposition.hs -o ../evidence/closure-test 2>&1 | tee ../evidence/closure-compile.log
      - name: Measure every required assertion without hiding failures
        shell: bash
        run: |
          set -euo pipefail
          for suite in adapter closure; do
            set +e
            "evidence/$suite-test" > "evidence/$suite.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "evidence/$suite.exit"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          inventories={'adapter':[f'C{i:02d}' for i in range(1,9)]+['R01','R02'],
                       'closure':[f'C{i:02d}' for i in range(1,9)]}
          result={'measurement_complete':True,'repair_certified':False,
                  'ordinary_source_adapter_established':False,
                  'evidence_packaging':'explicit audit-only adapter','suites':{}}
          for suite,expected in inventories.items():
              lines=Path(f'evidence/{suite}.log').read_text().splitlines()
              rows=[s.split(' ',2) for s in lines if s.startswith(('PASS ','FAIL '))]
              assert [r[1] for r in rows]==expected,(suite,rows)
              assert lines.count(f'COMPLETE correctness_groups={len(expected)}')==1
              code=int(Path(f'evidence/{suite}.exit').read_text())
              assert code in (0,1)
              assert (code==0)==all(r[0]=='PASS' for r in rows)
              result['suites'][suite]={'exit':code,'cases':rows}
          result['all_required_assertions_passed']=all(s['exit']==0 for s in result['suites'].values())
          Path('evidence/protocol.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          # Green measurement may retain R failures, never repair certification.
          # Unexpected preservation or final-consumer failures still fail the job.
          assert all(r[0]=='PASS' for s in result['suites'].values() for r in s['cases'] if r[1].startswith('C'))
          PY
      - name: Verify unchanged subject after measurement
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C subject status --porcelain --untracked-files=all > evidence/subject-status-after.txt
          test ! -s evidence/subject-status-after.txt
          test "$(git -C subject rev-parse HEAD)" = 6c1b3df8a93c1897ead6d497b3476b6ec0143312
      - name: Retain complete raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landed-event-composition-6c1b3df8
          path: |
            evidence/*.txt
            evidence/*.sha256
            evidence/*.diff
            evidence/*.log
            evidence/*.exit
            evidence/*.json
            evidence/drivers/
          if-no-files-found: error
