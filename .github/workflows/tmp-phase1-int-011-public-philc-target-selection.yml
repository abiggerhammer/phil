name: Temporary INT-011 Public philc Target Selection

on:
  push:
    branches:
      - phase1-int-011-public-philc-target-selection

permissions:
  contents: read

jobs:
  public-philc-target-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build Phil toolchain
        run: cabal build all --enable-tests

      - name: Exercise explicit public philc target selection
        run: bash scripts/ci/phase0-llvm-runtime-smoke.sh
