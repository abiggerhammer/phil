name: Phase 1 Surface Grammar AST Record Data Correspondence

on:
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/ReferenceAstDeclarationCommon.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstRecordData.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstTypePayload.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstProposition.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstEffects.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstStaticArgumentClosure.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'src/Phil/Surface/GrammarV1/Parser.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'test/Phase1GrammarV1ReferenceAstRecordDataMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - 'scripts/check_phase1_surface_corpus.py'
      - '.github/workflows/phase1-surface-grammar-ast-record-data.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Surface/GrammarV1/ReferenceAstDeclarationCommon.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstRecordData.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstTypePayload.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstProposition.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstEffects.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstStaticArgumentClosure.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'src/Phil/Surface/GrammarV1/Parser.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'test/Phase1GrammarV1ReferenceAstRecordDataMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - 'scripts/check_phase1_surface_corpus.py'
      - '.github/workflows/phase1-surface-grammar-ast-record-data.yml'

permissions:
  contents: read

jobs:
  ast-record-data-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Strictly compile record/data correspondence harness
        run: |
          cabal exec -- ghc --make \
            -Wall -Werror \
            -isrc \
            test/Phase1GrammarV1ReferenceAstRecordDataMain.hs \
            -o /tmp/phase1-surface-grammar-ast-record-data

      - name: Check certified record/data declarations against production AST
        run: |
          python scripts/check_phase1_surface_corpus.py --emit-parser-cases \
            | /tmp/phase1-surface-grammar-ast-record-data
