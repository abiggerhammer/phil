name: Temporary SURF-005 parser migration

on:
  push:
    branches:
      - phase1-surf-005-remove-ambiguities

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-005-remove-ambiguities
          fetch-depth: 0
      - name: Apply determinate Grammar-v1 parser migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def between(text, start, end, replacement, label):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"{label}: start anchor not found")
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f"{label}: end anchor not found")
              return text[:i] + replacement.rstrip() + "\n\n" + text[j+1:]

          parser_path = Path("src/Phil/Surface/GrammarV1/Parser.hs")
          p = parser_path.read_text()

          p = between(p,
            "parseStatement :: Parser (Located GrammarV1Statement)",
            "\nparsePattern :: Parser (Located GrammarV1Pattern)",
            r'''parseStatement :: Parser (Located GrammarV1Statement)
parseStatement = do
  token <- peekToken
  case fmap locatedValue token of
    Just (GrammarKeyword "let") -> parseLetStatement
    Just (GrammarKeyword "return") -> parseReturnStatement
    Just _ -> do
      expression <- parseExpression
      end <- expectSymbol ";"
      pure $ Located
        (SourceSpan
          (sourceSpanStart (locatedSpan expression))
          (sourceSpanEnd (locatedSpan end)))
        (GrammarV1ExpressionStatement expression)
    Nothing -> failParser "expected statement at end of input"

parseLetStatement :: Parser (Located GrammarV1Statement)
parseLetStatement = do
  start <- expectKeyword "let"
  pattern' <- parsePattern
  _ <- expectSymbol "="
  expression <- parseExpression
  end <- expectSymbol ";"
  pure $ Located
    (SourceSpan
      (sourceSpanStart (locatedSpan start))
      (sourceSpanEnd (locatedSpan end)))
    (GrammarV1LetStatement pattern' expression)

parseReturnStatement :: Parser (Located GrammarV1Statement)
parseReturnStatement = do
  start <- expectKeyword "return"
  expression <- parseExpression
  end <- expectSymbol ";"
  pure $ Located
    (SourceSpan
      (sourceSpanStart (locatedSpan start))
      (sourceSpanEnd (locatedSpan end)))
    (GrammarV1ReturnStatement expression)''',
            "statement terminators")

          p = between(p,
            "peekFallbackStart :: Parser Bool",
            "\nparseFallback :: Parser (Located GrammarV1Fallback)",
            r'''peekFallbackStart :: Parser Bool
peekFallbackStart = Parser $ \tokens ->
  Right (startsFallback tokens, tokens)
  where
    startsFallback (first : second : _) =
      case (locatedValue first, locatedValue second) of
        (GrammarKeyword "or", GrammarKeyword "fail") -> True
        (GrammarKeyword "or", GrammarKeyword "reject") -> True
        _ -> False
    startsFallback _ = False

peekCommandExpressionStart :: Parser Bool
peekCommandExpressionStart = do
  token <- peekToken
  pure $ case fmap locatedValue token of
    Just (GrammarKeyword keyword) -> keyword `elem`
      [ "construct", "borrow", "if", "match", "decide", "closure", "loop"
      , "continue", "break", "receive_frame", "receive_exact", "receive"
      , "recognize", "validate", "send_exact", "send", "select", "offer"
      , "commit_receive", "reject", "fail", "close", "release", "transport"
      , "accept", "prove"
      ]
    _ -> False

parseBaseExpression :: Parser (Located GrammarV1Expression)
parseBaseExpression = do
  command <- peekCommandExpressionStart
  if command then parseCommandExpression else parseAdditiveExpression

parseExpression :: Parser (Located GrammarV1Expression)
parseExpression = do
  base <- parseBaseExpression
  hasFallback <- peekFallbackStart
  if hasFallback
    then do
      _ <- expectKeyword "or"
      fallback <- parseFallback
      pure $ Located
        (SourceSpan
          (sourceSpanStart (locatedSpan base))
          (sourceSpanEnd (locatedSpan fallback)))
        (GrammarV1FallbackExpression base fallback)
    else pure base''',
            "expression command layer")

          p = between(p,
            "parsePostfixExpression :: Parser (Located GrammarV1Expression)",
            "\nparseReceiveFrameExpression :: Parser (Located GrammarV1Expression)",
            r'''parsePostfixExpression :: Parser (Located GrammarV1Expression)
parsePostfixExpression = do
  token <- peekToken
  case fmap locatedValue token of
    Just (GrammarIdentifier _) -> parseNamedPostfixExpression
    _ -> do
      primary <- parsePrimaryExpression
      parseMorePostfixExpression primary

parseNamedPostfixExpression :: Parser (Located GrammarV1Expression)
parseNamedPostfixExpression = do
  name <- parseQualifiedName
  hasStatic <- peekSymbol "["
  (staticArguments, staticEnd) <- if hasStatic
    then do
      (arguments, end) <- parseStaticArguments
      pure (arguments, Just end)
    else pure ([], Nothing)
  let referenceEnd = maybe (locatedSpan name) locatedSpan staticEnd
      reference = GrammarV1StaticReference
        { grammarV1StaticReferenceName = locatedValue name
        , grammarV1StaticReferenceArguments = staticArguments
        }
      referenceLocated = Located
        (SourceSpan
          (sourceSpanStart (locatedSpan name))
          (sourceSpanEnd referenceEnd))
        reference
  hasTermArguments <- peekSymbol "("
  if hasTermArguments
    then do
      (arguments, end) <- parseTermArguments
      let named = Located
            (SourceSpan
              (sourceSpanStart (locatedSpan name))
              (sourceSpanEnd (locatedSpan end)))
            (GrammarV1NameExpression reference arguments)
      parseMorePostfixExpression named
    else if hasStatic
      then do
        let named = Located (locatedSpan referenceLocated) (GrammarV1NameExpression reference [])
        parseMorePostfixExpression named
      else pure $ Located
        (locatedSpan name)
        (GrammarV1NameExpression reference [])

parseMorePostfixExpression
  :: Located GrammarV1Expression
  -> Parser (Located GrammarV1Expression)
parseMorePostfixExpression base = do
  hasProjection <- peekSymbol "."
  if hasProjection
    then do
      _ <- expectSymbol "."
      field <- expectIdentifier
      let projected = Located
            (SourceSpan
              (sourceSpanStart (locatedSpan base))
              (sourceSpanEnd (locatedSpan field)))
            (GrammarV1ProjectionExpression base field)
      parseMorePostfixExpression projected
    else pure base

parsePrimaryExpression :: Parser (Located GrammarV1Expression)
parsePrimaryExpression = do
  token <- peekToken
  case fmap locatedValue token of
    Just (GrammarKeyword "true") -> do
      value <- expectKeyword "true"
      pure (Located (locatedSpan value) (GrammarV1BoolExpression True))
    Just (GrammarKeyword "false") -> do
      value <- expectKeyword "false"
      pure (Located (locatedSpan value) (GrammarV1BoolExpression False))
    Just (GrammarKeyword "unit") -> do
      value <- expectKeyword "unit"
      pure (Located (locatedSpan value) GrammarV1UnitExpression)
    Just (GrammarDecimalInteger _) -> do
      value <- takeToken
      case locatedValue value of
        GrammarDecimalInteger integer ->
          pure (Located (locatedSpan value) (GrammarV1IntegerExpression integer))
        _ -> failParser "internal DECIMAL_INTEGER expression dispatch error"
    Just (GrammarSymbol "(") -> parseTupleOrParenthesizedExpression
    Just other -> failParser $
      "expected arithmetic primary_expression; found " <> renderToken other
    Nothing -> failParser "expected primary_expression at end of input"

parseCommandExpression :: Parser (Located GrammarV1Expression)
parseCommandExpression = do
  token <- peekToken
  case fmap locatedValue token of
    Just (GrammarKeyword "construct") -> parseConstructExpression
    Just (GrammarKeyword "borrow") -> parseBorrowExpression
    Just (GrammarKeyword "if") -> parseIfExpression
    Just (GrammarKeyword "match") -> parseMatchExpression
    Just (GrammarKeyword "decide") -> parseDecideExpression
    Just (GrammarKeyword "closure") -> parseClosureExpression
    Just (GrammarKeyword "loop") -> parseLoopExpression
    Just (GrammarKeyword "continue") -> parseContinueExpression
    Just (GrammarKeyword "break") -> parseBreakExpression
    Just (GrammarKeyword "receive_frame") -> parseReceiveFrameExpression
    Just (GrammarKeyword "receive_exact") -> parseReceiveExactExpression
    Just (GrammarKeyword "receive") -> parseReceiveExpression
    Just (GrammarKeyword "recognize") -> parseRecognizeExpression
    Just (GrammarKeyword "validate") -> parseValidateExpression
    Just (GrammarKeyword "send_exact") -> parseSendExactExpression
    Just (GrammarKeyword "send") -> parseSendExpression
    Just (GrammarKeyword "select") -> parseSelectExpression
    Just (GrammarKeyword "offer") -> parseOfferExpression
    Just (GrammarKeyword "commit_receive") -> parseCommitReceiveExpression
    Just (GrammarKeyword "reject") -> parseRejectExpression
    Just (GrammarKeyword "fail") -> parseFailExpression
    Just (GrammarKeyword "close") -> parseCloseExpression
    Just (GrammarKeyword "release") -> parseReleaseExpression
    Just (GrammarKeyword "transport") -> parseTransportExpression
    Just (GrammarKeyword "accept") -> parseAcceptExpression
    Just (GrammarKeyword "prove") -> parseProveExpression
    Just other -> failParser $
      "expected command_expression; found " <> renderToken other
    Nothing -> failParser "expected command_expression at end of input"''',
            "postfix and command factoring")

          p = between(p,
            "parseReceiveExactExpression :: Parser (Located GrammarV1Expression)",
            "\nparseReceiveExpression :: Parser (Located GrammarV1Expression)",
            r'''parseReceiveExactExpression :: Parser (Located GrammarV1Expression)
parseReceiveExactExpression = do
  start <- expectKeyword "receive_exact"
  amount <- parseBaseExpression
  hasUsing <- peekKeyword "using"
  evidence <- if hasUsing
    then expectKeyword "using" >> Just <$> parseBaseExpression
    else pure Nothing
  _ <- expectKeyword "on"
  endpoint <- parseBaseExpression
  pure $ Located
    (SourceSpan
      (sourceSpanStart (locatedSpan start))
      (sourceSpanEnd (locatedSpan endpoint)))
    (GrammarV1ReceiveExactExpression amount endpoint evidence)''',
            "receive_exact using placement")

          p = between(p,
            "parseSelectExpression :: Parser (Located GrammarV1Expression)",
            "\nparseBranchValue :: Parser (Located GrammarV1BranchValue)",
            r'''parseSelectExpression :: Parser (Located GrammarV1Expression)
parseSelectExpression = do
  start <- expectKeyword "select"
  branch <- parseBranchValue
  hasUsing <- peekKeyword "using"
  evidence <- if hasUsing
    then expectKeyword "using" >> Just <$> parseBaseExpression
    else pure Nothing
  _ <- expectKeyword "on"
  endpoint <- parseBaseExpression
  pure $ Located
    (SourceSpan
      (sourceSpanStart (locatedSpan start))
      (sourceSpanEnd (locatedSpan endpoint)))
    (GrammarV1SelectExpression branch endpoint evidence)''',
            "select using placement")

          p = between(p,
            "parseProveExpression :: Parser (Located GrammarV1Expression)",
            "\nparseTransportExpression :: Parser (Located GrammarV1Expression)",
            r'''parseProveExpression :: Parser (Located GrammarV1Expression)
parseProveExpression = do
  start <- expectKeyword "prove"
  _ <- expectSymbol "("
  proposition <- parseProposition
  end <- expectSymbol ")"
  pure $ locatedBetween start end (GrammarV1ProveExpression proposition)''',
            "prove delimiter")

          p = between(p,
            "parseStaticPostfixExpression :: Parser (Located GrammarV1StaticValueExpression)",
            "\nparseMoreStaticPostfix\n",
            r'''parseStaticPostfixExpression :: Parser (Located GrammarV1StaticValueExpression)
parseStaticPostfixExpression = do
  token <- peekToken
  case fmap locatedValue token of
    Just (GrammarIdentifier _) -> do
      name <- parseQualifiedName
      hasStatic <- peekSymbol "["
      if hasStatic
        then do
          (arguments, end) <- parseStaticArguments
          let reference = Located
                (SourceSpan
                  (sourceSpanStart (locatedSpan name))
                  (sourceSpanEnd (locatedSpan end)))
                GrammarV1StaticReference
                  { grammarV1StaticReferenceName = locatedValue name
                  , grammarV1StaticReferenceArguments = arguments
                  }
              base = Located
                (locatedSpan reference)
                (GrammarV1StaticValueReference reference)
          parseMoreStaticPostfix base
        else pure $ Located
          (locatedSpan name)
          (GrammarV1StaticValueReference
            (Located (locatedSpan name) GrammarV1StaticReference
              { grammarV1StaticReferenceName = locatedValue name
              , grammarV1StaticReferenceArguments = []
              }))
    _ -> do
      primary <- parseStaticPrimaryExpression
      parseMoreStaticPostfix primary''',
            "static postfix factoring")

          start = p.find("parseNameExpression :: Parser (Located GrammarV1Expression)")
          if start >= 0:
              end = p.find("\nparseTermArguments ::", start)
              if end < 0:
                  raise SystemExit("parseNameExpression end anchor not found")
              p = p[:start] + p[end+1:]

          p = p.replace("value <- parseAdditiveExpression\n  _ <- expectKeyword \"as\"", "value <- parseBaseExpression\n  _ <- expectKeyword \"as\"")
          p = p.replace("scrutinee <- parseAdditiveExpression\n  _ <- expectSymbol \"{\"", "scrutinee <- parseBaseExpression\n  _ <- expectSymbol \"{\"")
          p = p.replace("endpoint <- parseAdditiveExpression", "endpoint <- parseBaseExpression")
          p = p.replace("source <- parseAdditiveExpression", "source <- parseBaseExpression")
          p = p.replace("position <- if hasAt\n    then expectKeyword \"at\" >> Just <$> parseAdditiveExpression", "position <- if hasAt\n    then expectKeyword \"at\" >> Just <$> parseBaseExpression")
          p = p.replace("value <- parseAdditiveExpression", "value <- parseBaseExpression")
          p = p.replace("evidence <- parseAdditiveExpression", "evidence <- parseBaseExpression")
          p = p.replace("operand <- parseAdditiveExpression", "operand <- parseBaseExpression")
          p = p.replace("scrutinee <- parseAdditiveExpression", "scrutinee <- parseBaseExpression")

          p = p.replace("left <- parseExpression\n  parseRelationFromLeft left", "left <- parseAdditiveExpression\n  parseRelationFromLeft left")
          p = p.replace("right <- parseExpression\n  pure $ Located\n    (SourceSpan\n      (sourceSpanStart (locatedSpan left))", "right <- parseAdditiveExpression\n  pure $ Located\n    (SourceSpan\n      (sourceSpanStart (locatedSpan left))")

          parser_path.write_text(p)

          grammar_path = Path("grammar/phase1-surface.ebnf")
          g = grammar_path.read_text()
          g = between(g,
            "expression = additive_expression, [ \"or\", fallback ] ;",
            "\nconstruct_expression =",
            '''expression = base_expression, [ "or", fallback ] ;
fallback = "fail", failure_target | "reject", base_expression ;

base_expression = command_expression | additive_expression ;

command_expression =
    construct_expression
  | borrow_expression
  | if_expression
  | match_expression
  | decide_expression
  | closure_expression
  | loop_expression
  | continue_expression
  | break_expression
  | receive_frame_expression
  | receive_exact_expression
  | receive_expression
  | recognize_expression
  | validate_expression
  | send_exact_expression
  | send_expression
  | select_expression
  | offer_expression
  | commit_receive_expression
  | reject_expression
  | fail_expression
  | close_expression
  | release_expression
  | transport_expression
  | accept_expression
  | prove_expression
  ;

additive_expression =
  multiplicative_expression,
  { ( "+" | "-" ), multiplicative_expression } ;

multiplicative_expression =
  postfix_expression, { "*", postfix_expression } ;

postfix_expression =
    named_postfix_expression
  | primary_expression, { ".", identifier }
  ;

named_postfix_expression =
  qualified_name,
  [ static_arguments, [ term_arguments ], { ".", identifier }
    | term_arguments, { ".", identifier } ] ;

primary_expression =
    tuple_expression
  | parenthesized_expression
  | "true"
  | "false"
  | "unit"
  | integer_literal
  ;''',
            "grammar expression layer")

          replacements = {
            '"borrow", additive_expression, "as", identifier, block': '"borrow", base_expression, "as", identifier, block',
            '"decide", additive_expression,': '"decide", base_expression,',
            '"receive_exact", additive_expression,\n  [ "using", additive_expression ], "on", postfix_expression': '"receive_exact", base_expression,\n  [ "using", base_expression ], "on", base_expression',
            '"receive", type_expression, "on", postfix_expression': '"receive", type_expression, "on", base_expression',
            '"recognize", static_reference, "from", postfix_expression': '"recognize", static_reference, "from", base_expression',
            '[ "at", additive_expression ], "on", postfix_expression': '[ "at", base_expression ], "on", base_expression',
            '"send_exact", additive_expression, "on", postfix_expression': '"send_exact", base_expression, "on", base_expression',
            '"send", additive_expression, "on", postfix_expression': '"send", base_expression, "on", base_expression',
            '"select", branch_value, [ "using", additive_expression ],\n  "on", postfix_expression': '"select", branch_value, [ "using", base_expression ],\n  "on", base_expression',
            '"offer", additive_expression,': '"offer", base_expression,',
            '"commit_receive", additive_expression, "using", postfix_expression': '"commit_receive", base_expression, "using", base_expression',
            '"reject", postfix_expression': '"reject", base_expression',
            '"fail", failure_target, "on", postfix_expression': '"fail", failure_target, "on", base_expression',
            'close_expression = "close", postfix_expression': 'close_expression = "close", base_expression',
            'release_expression = "release", postfix_expression': 'release_expression = "release", base_expression',
            '"transport", additive_expression, "to", type_expression,\n  "using", postfix_expression': '"transport", base_expression, "to", type_expression,\n  "using", base_expression',
            '"accept", additive_expression, "as", type_expression': '"accept", base_expression, "as", type_expression',
            'prove_expression = "prove", proposition ;': 'prove_expression = "prove", "(", proposition, ")" ;',
          }
          for old, new in replacements.items():
              if old not in g:
                  raise SystemExit(f"grammar replacement not found: {old}")
              g = g.replace(old, new, 1)

          old_static = '''static_postfix_expression =
    static_reference
  | static_nonreference_primary_expression, { ".", identifier }
  ;'''
          new_static = '''static_postfix_expression =
    qualified_name, [ static_arguments, { ".", identifier } ]
  | static_nonreference_primary_expression, { ".", identifier }
  ;'''
          if old_static not in g:
              raise SystemExit("static postfix grammar block not found")
          g = g.replace(old_static, new_static, 1)
          grammar_path.write_text(g)
          PY

          rm .github/workflows/_temporary-surf005-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Phil/Surface/GrammarV1/Parser.hs grammar/phase1-surface.ebnf .github/workflows/_temporary-surf005-migrate.yml
          git commit -m "Adapt Grammar-v1 parser to determinate command syntax"
          git push origin HEAD:phase1-surf-005-remove-ambiguities
