name: Temporary SURF-005 parser migration

on:
  push:
    branches:
      - phase1-surf-005-remove-ambiguities

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-005-remove-ambiguities
          fetch-depth: 0
      - name: Apply determinate Grammar-v1 parser migration
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/migrate_surf005.py
          python3 /tmp/migrate_surf005.py
          rm .github/workflows/_temporary-surf005-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Surface/GrammarV1/Parser.hs grammar/phase1-surface.ebnf .github/workflows/_temporary-surf005-migrate.yml
          git commit -m 'Adapt Grammar-v1 parser to determinate command syntax'
          git push origin HEAD:phase1-surf-005-remove-ambiguities
