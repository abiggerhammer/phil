name: Temporary SURF-005 parser migration

on:
  push:
    branches:
      - phase1-surf-005-remove-ambiguities

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-005-remove-ambiguities
          fetch-depth: 0
      - name: Apply determinate Grammar-v1 parser migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          parser_path = Path("src/Phil/Surface/GrammarV1/Parser.hs")
          p = parser_path.read_text()

          old = '''parseStatement :: Parser (Located GrammarV1Statement)
          parseStatement = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarKeyword "let") -> parseLetStatement
              Just (GrammarKeyword "return") -> parseReturnStatement
              Just _ -> do
                expression <- parseExpression
                pure $ Located
                  (locatedSpan expression)
                  (GrammarV1ExpressionStatement expression)
              Nothing -> failParser "expected statement at end of input"

          parseLetStatement :: Parser (Located GrammarV1Statement)
          parseLetStatement = do
            start <- expectKeyword "let"
            pattern' <- parsePattern
            _ <- expectSymbol "="
            expression <- parseExpression
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd (locatedSpan expression)))
              (GrammarV1LetStatement pattern' expression)

          parseReturnStatement :: Parser (Located GrammarV1Statement)
          parseReturnStatement = do
            start <- expectKeyword "return"
            expression <- parseExpression
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd (locatedSpan expression)))
              (GrammarV1ReturnStatement expression)
          '''.replace('          ', '')
          new = '''parseStatement :: Parser (Located GrammarV1Statement)
          parseStatement = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarKeyword "let") -> parseLetStatement
              Just (GrammarKeyword "return") -> parseReturnStatement
              Just _ -> do
                expression <- parseExpression
                end <- expectSymbol ";"
                pure $ Located
                  (SourceSpan
                    (sourceSpanStart (locatedSpan expression))
                    (sourceSpanEnd (locatedSpan end)))
                  (GrammarV1ExpressionStatement expression)
              Nothing -> failParser "expected statement at end of input"

          parseLetStatement :: Parser (Located GrammarV1Statement)
          parseLetStatement = do
            start <- expectKeyword "let"
            pattern' <- parsePattern
            _ <- expectSymbol "="
            expression <- parseExpression
            end <- expectSymbol ";"
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd (locatedSpan end)))
              (GrammarV1LetStatement pattern' expression)

          parseReturnStatement :: Parser (Located GrammarV1Statement)
          parseReturnStatement = do
            start <- expectKeyword "return"
            expression <- parseExpression
            end <- expectSymbol ";"
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd (locatedSpan end)))
              (GrammarV1ReturnStatement expression)
          '''.replace('          ', '')
          p = replace_one(p, old, new, "statement terminators")

          old = '''peekFallbackStart :: Parser Bool
          peekFallbackStart = Parser $ \\tokens ->
            Right (startsFallback tokens, tokens)
            where
              startsFallback (first : second : _) =
                case (locatedValue first, locatedValue second) of
                  (GrammarKeyword "or", GrammarKeyword "fail") -> True
                  (GrammarKeyword "or", GrammarKeyword "reject") -> True
                  _ -> False
              startsFallback _ = False

          parseExpression :: Parser (Located GrammarV1Expression)
          parseExpression = do
            base <- parseAdditiveExpression
            hasFallback <- peekFallbackStart
            if hasFallback
              then do
                _ <- expectKeyword "or"
                fallback <- parseFallback
                pure $ Located
                  (SourceSpan
                    (sourceSpanStart (locatedSpan base))
                    (sourceSpanEnd (locatedSpan fallback)))
                  (GrammarV1FallbackExpression base fallback)
              else pure base
          '''.replace('          ', '')
          new = '''peekFallbackStart :: Parser Bool
          peekFallbackStart = Parser $ \\tokens ->
            Right (startsFallback tokens, tokens)
            where
              startsFallback (first : second : _) =
                case (locatedValue first, locatedValue second) of
                  (GrammarKeyword "or", GrammarKeyword "fail") -> True
                  (GrammarKeyword "or", GrammarKeyword "reject") -> True
                  _ -> False
              startsFallback _ = False

          peekCommandExpressionStart :: Parser Bool
          peekCommandExpressionStart = do
            token <- peekToken
            pure $ case fmap locatedValue token of
              Just (GrammarKeyword keyword) -> keyword `elem`
                [ "construct", "borrow", "if", "match", "decide", "closure", "loop"
                , "continue", "break", "receive_frame", "receive_exact", "receive"
                , "recognize", "validate", "send_exact", "send", "select", "offer"
                , "commit_receive", "reject", "fail", "close", "release", "transport"
                , "accept", "prove"
                ]
              _ -> False

          parseExpression :: Parser (Located GrammarV1Expression)
          parseExpression = do
            command <- peekCommandExpressionStart
            base <- if command then parseCommandExpression else parseAdditiveExpression
            hasFallback <- peekFallbackStart
            if hasFallback
              then do
                _ <- expectKeyword "or"
                fallback <- parseFallback
                pure $ Located
                  (SourceSpan
                    (sourceSpanStart (locatedSpan base))
                    (sourceSpanEnd (locatedSpan fallback)))
                  (GrammarV1FallbackExpression base fallback)
              else pure base
          '''.replace('          ', '')
          p = replace_one(p, old, new, "command expression layer")

          old = '''parsePostfixExpression :: Parser (Located GrammarV1Expression)
          parsePostfixExpression = do
            primary <- parsePrimaryExpression
            parseMorePostfixExpression primary

          parseMorePostfixExpression
            :: Located GrammarV1Expression
            -> Parser (Located GrammarV1Expression)
          parseMorePostfixExpression base = do
            hasProjection <- peekSymbol "."
            if hasProjection
              then do
                _ <- expectSymbol "."
                field <- expectIdentifier
                let projected = Located
                      (SourceSpan
                        (sourceSpanStart (locatedSpan base))
                        (sourceSpanEnd (locatedSpan field)))
                      (GrammarV1ProjectionExpression base field)
                parseMorePostfixExpression projected
              else pure base

          parsePrimaryExpression :: Parser (Located GrammarV1Expression)
          parsePrimaryExpression = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarKeyword "construct") -> parseConstructExpression
              Just (GrammarKeyword "borrow") -> parseBorrowExpression
              Just (GrammarKeyword "if") -> parseIfExpression
              Just (GrammarKeyword "match") -> parseMatchExpression
              Just (GrammarKeyword "decide") -> parseDecideExpression
              Just (GrammarKeyword "closure") -> parseClosureExpression
              Just (GrammarKeyword "loop") -> parseLoopExpression
              Just (GrammarKeyword "continue") -> parseContinueExpression
              Just (GrammarKeyword "break") -> parseBreakExpression
              Just (GrammarKeyword "receive_frame") -> parseReceiveFrameExpression
              Just (GrammarKeyword "receive_exact") -> parseReceiveExactExpression
              Just (GrammarKeyword "receive") -> parseReceiveExpression
              Just (GrammarKeyword "recognize") -> parseRecognizeExpression
              Just (GrammarKeyword "validate") -> parseValidateExpression
              Just (GrammarKeyword "send_exact") -> parseSendExactExpression
              Just (GrammarKeyword "send") -> parseSendExpression
              Just (GrammarKeyword "select") -> parseSelectExpression
              Just (GrammarKeyword "commit_receive") -> parseCommitReceiveExpression
              Just (GrammarKeyword "fail") -> parseFailExpression
              Just (GrammarKeyword "close") -> parseCloseExpression
              Just (GrammarKeyword "release") -> parseReleaseExpression
              Just (GrammarKeyword "transport") -> parseTransportExpression
              Just (GrammarKeyword "accept") -> parseAcceptExpression
              Just (GrammarKeyword "prove") -> parseProveExpression
              Just (GrammarKeyword "offer") -> parseOfferExpression
              Just (GrammarKeyword "reject") -> parseRejectExpression
              Just (GrammarKeyword "true") -> do
                value <- expectKeyword "true"
                pure (Located (locatedSpan value) (GrammarV1BoolExpression True))
              Just (GrammarKeyword "false") -> do
                value <- expectKeyword "false"
                pure (Located (locatedSpan value) (GrammarV1BoolExpression False))
              Just (GrammarKeyword "unit") -> do
                value <- expectKeyword "unit"
                pure (Located (locatedSpan value) GrammarV1UnitExpression)
              Just (GrammarDecimalInteger _) -> do
                value <- takeToken
                case locatedValue value of
                  GrammarDecimalInteger integer ->
                    pure (Located (locatedSpan value) (GrammarV1IntegerExpression integer))
                  _ -> failParser "internal DECIMAL_INTEGER expression dispatch error"
              Just (GrammarSymbol "(") -> parseTupleOrParenthesizedExpression
              Just (GrammarIdentifier _) -> parseNameExpression
              Just other -> failParser $
                "SURF-002 term/block slice does not yet implement primary_expression beginning with "
                  <> renderToken other
              Nothing -> failParser "expected primary_expression at end of input"
          '''.replace('          ', '')
          new = '''parsePostfixExpression :: Parser (Located GrammarV1Expression)
          parsePostfixExpression = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarIdentifier _) -> parseNamedPostfixExpression
              _ -> do
                primary <- parsePrimaryExpression
                parseMorePostfixExpression primary

          parseNamedPostfixExpression :: Parser (Located GrammarV1Expression)
          parseNamedPostfixExpression = do
            reference <- parseStaticReference
            hasTermArguments <- peekSymbol "("
            if hasTermArguments
              then do
                (arguments, end) <- parseTermArguments
                let named = Located
                      (SourceSpan
                        (sourceSpanStart (locatedSpan reference))
                        (sourceSpanEnd (locatedSpan end)))
                      (GrammarV1NameExpression (locatedValue reference) arguments)
                parseMorePostfixExpression named
              else pure $ Located
                (locatedSpan reference)
                (GrammarV1NameExpression (locatedValue reference) [])

          parseMorePostfixExpression
            :: Located GrammarV1Expression
            -> Parser (Located GrammarV1Expression)
          parseMorePostfixExpression base = do
            hasProjection <- peekSymbol "."
            if hasProjection
              then do
                _ <- expectSymbol "."
                field <- expectIdentifier
                let projected = Located
                      (SourceSpan
                        (sourceSpanStart (locatedSpan base))
                        (sourceSpanEnd (locatedSpan field)))
                      (GrammarV1ProjectionExpression base field)
                parseMorePostfixExpression projected
              else pure base

          parsePrimaryExpression :: Parser (Located GrammarV1Expression)
          parsePrimaryExpression = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarKeyword "true") -> do
                value <- expectKeyword "true"
                pure (Located (locatedSpan value) (GrammarV1BoolExpression True))
              Just (GrammarKeyword "false") -> do
                value <- expectKeyword "false"
                pure (Located (locatedSpan value) (GrammarV1BoolExpression False))
              Just (GrammarKeyword "unit") -> do
                value <- expectKeyword "unit"
                pure (Located (locatedSpan value) GrammarV1UnitExpression)
              Just (GrammarDecimalInteger _) -> do
                value <- takeToken
                case locatedValue value of
                  GrammarDecimalInteger integer ->
                    pure (Located (locatedSpan value) (GrammarV1IntegerExpression integer))
                  _ -> failParser "internal DECIMAL_INTEGER expression dispatch error"
              Just (GrammarSymbol "(") -> parseTupleOrParenthesizedExpression
              Just other -> failParser $
                "expected non-command primary_expression; found " <> renderToken other
              Nothing -> failParser "expected primary_expression at end of input"

          parseCommandExpression :: Parser (Located GrammarV1Expression)
          parseCommandExpression = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarKeyword "construct") -> parseConstructExpression
              Just (GrammarKeyword "borrow") -> parseBorrowExpression
              Just (GrammarKeyword "if") -> parseIfExpression
              Just (GrammarKeyword "match") -> parseMatchExpression
              Just (GrammarKeyword "decide") -> parseDecideExpression
              Just (GrammarKeyword "closure") -> parseClosureExpression
              Just (GrammarKeyword "loop") -> parseLoopExpression
              Just (GrammarKeyword "continue") -> parseContinueExpression
              Just (GrammarKeyword "break") -> parseBreakExpression
              Just (GrammarKeyword "receive_frame") -> parseReceiveFrameExpression
              Just (GrammarKeyword "receive_exact") -> parseReceiveExactExpression
              Just (GrammarKeyword "receive") -> parseReceiveExpression
              Just (GrammarKeyword "recognize") -> parseRecognizeExpression
              Just (GrammarKeyword "validate") -> parseValidateExpression
              Just (GrammarKeyword "send_exact") -> parseSendExactExpression
              Just (GrammarKeyword "send") -> parseSendExpression
              Just (GrammarKeyword "select") -> parseSelectExpression
              Just (GrammarKeyword "offer") -> parseOfferExpression
              Just (GrammarKeyword "commit_receive") -> parseCommitReceiveExpression
              Just (GrammarKeyword "reject") -> parseRejectExpression
              Just (GrammarKeyword "fail") -> parseFailExpression
              Just (GrammarKeyword "close") -> parseCloseExpression
              Just (GrammarKeyword "release") -> parseReleaseExpression
              Just (GrammarKeyword "transport") -> parseTransportExpression
              Just (GrammarKeyword "accept") -> parseAcceptExpression
              Just (GrammarKeyword "prove") -> parseProveExpression
              Just other -> failParser $
                "expected command_expression; found " <> renderToken other
              Nothing -> failParser "expected command_expression at end of input"
          '''.replace('          ', '')
          p = replace_one(p, old, new, "postfix/command factoring")

          old = '''parseReceiveExactExpression :: Parser (Located GrammarV1Expression)
          parseReceiveExactExpression = do
            start <- expectKeyword "receive_exact"
            amount <- parseAdditiveExpression
            _ <- expectKeyword "on"
            endpoint <- parseAdditiveExpression
            hasUsing <- peekKeyword "using"
            evidence <- if hasUsing
              then expectKeyword "using" >> Just <$> parseAdditiveExpression
              else pure Nothing
            let endSpan = maybe (locatedSpan endpoint) locatedSpan evidence
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd endSpan))
              (GrammarV1ReceiveExactExpression amount endpoint evidence)
          '''.replace('          ', '')
          new = '''parseReceiveExactExpression :: Parser (Located GrammarV1Expression)
          parseReceiveExactExpression = do
            start <- expectKeyword "receive_exact"
            amount <- parseAdditiveExpression
            hasUsing <- peekKeyword "using"
            evidence <- if hasUsing
              then expectKeyword "using" >> Just <$> parseAdditiveExpression
              else pure Nothing
            _ <- expectKeyword "on"
            endpoint <- parseAdditiveExpression
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd (locatedSpan endpoint)))
              (GrammarV1ReceiveExactExpression amount endpoint evidence)
          '''.replace('          ', '')
          p = replace_one(p, old, new, "receive_exact using placement")

          old = '''parseSelectExpression :: Parser (Located GrammarV1Expression)
          parseSelectExpression = do
            start <- expectKeyword "select"
            branch <- parseBranchValue
            _ <- expectKeyword "on"
            endpoint <- parseAdditiveExpression
            hasUsing <- peekKeyword "using"
            evidence <- if hasUsing
              then expectKeyword "using" >> Just <$> parseAdditiveExpression
              else pure Nothing
            let endSpan = maybe (locatedSpan endpoint) locatedSpan evidence
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd endSpan))
              (GrammarV1SelectExpression branch endpoint evidence)
          '''.replace('          ', '')
          new = '''parseSelectExpression :: Parser (Located GrammarV1Expression)
          parseSelectExpression = do
            start <- expectKeyword "select"
            branch <- parseBranchValue
            hasUsing <- peekKeyword "using"
            evidence <- if hasUsing
              then expectKeyword "using" >> Just <$> parseAdditiveExpression
              else pure Nothing
            _ <- expectKeyword "on"
            endpoint <- parseAdditiveExpression
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd (locatedSpan endpoint)))
              (GrammarV1SelectExpression branch endpoint evidence)
          '''.replace('          ', '')
          p = replace_one(p, old, new, "select using placement")

          old = '''parseProveExpression :: Parser (Located GrammarV1Expression)
          parseProveExpression = do
            start <- expectKeyword "prove"
            proposition <- parseProposition
            pure $ Located
              (SourceSpan
                (sourceSpanStart (locatedSpan start))
                (sourceSpanEnd (locatedSpan proposition)))
              (GrammarV1ProveExpression proposition)
          '''.replace('          ', '')
          new = '''parseProveExpression :: Parser (Located GrammarV1Expression)
          parseProveExpression = do
            start <- expectKeyword "prove"
            _ <- expectSymbol "("
            proposition <- parseProposition
            end <- expectSymbol ")"
            pure $ locatedBetween start end (GrammarV1ProveExpression proposition)
          '''.replace('          ', '')
          p = replace_one(p, old, new, "prove delimiter")

          old = '''parseStaticPostfixExpression :: Parser (Located GrammarV1StaticValueExpression)
          parseStaticPostfixExpression = do
            primary <- parseStaticPrimaryExpression
            parseMoreStaticPostfix primary
          '''.replace('          ', '')
          new = '''parseStaticPostfixExpression :: Parser (Located GrammarV1StaticValueExpression)
          parseStaticPostfixExpression = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarIdentifier _) -> parseStaticPrimaryExpression
              _ -> do
                primary <- parseStaticPrimaryExpression
                parseMoreStaticPostfix primary
          '''.replace('          ', '')
          p = replace_one(p, old, new, "static postfix factoring")

          old = '''parseNameExpression :: Parser (Located GrammarV1Expression)
          parseNameExpression = do
            reference <- parseStaticReference
            hasTermArguments <- peekSymbol "("
            if hasTermArguments
              then do
                (arguments, end) <- parseTermArguments
                pure $ Located
                  (SourceSpan
                    (sourceSpanStart (locatedSpan reference))
                    (sourceSpanEnd (locatedSpan end)))
                  (GrammarV1NameExpression (locatedValue reference) arguments)
              else pure $ Located
                (locatedSpan reference)
                (GrammarV1NameExpression (locatedValue reference) [])

          '''.replace('          ', '')
          if old not in p:
              raise SystemExit("old parseNameExpression block not found exactly once")
          p = p.replace(old, '', 1)

          parser_path.write_text(p)

          grammar_path = Path("grammar/phase1-surface.ebnf")
          g = grammar_path.read_text()
          old = '''expression = additive_expression, [ "or", fallback ] ;
          fallback = "fail", failure_target | "reject", additive_expression ;

          additive_expression =
            multiplicative_expression,
            { ( "+" | "-" ), multiplicative_expression } ;

          multiplicative_expression =
            postfix_expression, { "*", postfix_expression } ;

          postfix_expression =
              named_postfix_expression
            | nonname_primary_expression, { ".", identifier }
            ;

          named_postfix_expression =
            qualified_name, [ static_arguments ],
            [ term_arguments, { ".", identifier } ] ;

          nonname_primary_expression =
              construct_expression
            | borrow_expression
            | if_expression
            | match_expression
            | decide_expression
            | closure_expression
            | loop_expression
            | continue_expression
            | break_expression
            | receive_frame_expression
            | receive_exact_expression
            | receive_expression
            | recognize_expression
            | validate_expression
            | send_exact_expression
            | send_expression
            | select_expression
            | offer_expression
            | commit_receive_expression
            | reject_expression
            | fail_expression
            | close_expression
            | release_expression
            | transport_expression
            | accept_expression
            | prove_expression
            | tuple_expression
            | parenthesized_expression
            | "true"
            | "false"
            | "unit"
            | integer_literal
            ;
          '''.replace('          ', '')
          new = '''expression = base_expression, [ "or", fallback ] ;
          fallback = "fail", failure_target | "reject", additive_expression ;

          base_expression = command_expression | additive_expression ;

          command_expression =
              construct_expression
            | borrow_expression
            | if_expression
            | match_expression
            | decide_expression
            | closure_expression
            | loop_expression
            | continue_expression
            | break_expression
            | receive_frame_expression
            | receive_exact_expression
            | receive_expression
            | recognize_expression
            | validate_expression
            | send_exact_expression
            | send_expression
            | select_expression
            | offer_expression
            | commit_receive_expression
            | reject_expression
            | fail_expression
            | close_expression
            | release_expression
            | transport_expression
            | accept_expression
            | prove_expression
            ;

          additive_expression =
            multiplicative_expression,
            { ( "+" | "-" ), multiplicative_expression } ;

          multiplicative_expression =
            postfix_expression, { "*", postfix_expression } ;

          postfix_expression =
              named_postfix_expression
            | primary_expression, { ".", identifier }
            ;

          named_postfix_expression =
            qualified_name, [ static_arguments ],
            [ term_arguments, { ".", identifier } ] ;

          primary_expression =
              tuple_expression
            | parenthesized_expression
            | "true"
            | "false"
            | "unit"
            | integer_literal
            ;
          '''.replace('          ', '')
          g = replace_one(g, old, new, "grammar command layer")

          old = '''receive_exact_expression =
            "receive_exact", additive_expression,
            [ "using", additive_expression ], "on", postfix_expression ;
          '''.replace('          ', '')
          new = '''receive_exact_expression =
            "receive_exact", additive_expression,
            [ "using", additive_expression ], "on", additive_expression ;
          '''.replace('          ', '')
          g = replace_one(g, old, new, "grammar receive_exact endpoint")

          for label, old, new in [
              ("receive endpoint", '"receive", type_expression, "on", postfix_expression ;', '"receive", type_expression, "on", additive_expression ;'),
              ("recognize source", '"recognize", static_reference, "from", postfix_expression ;', '"recognize", static_reference, "from", additive_expression ;'),
              ("validate endpoint", '[ "at", additive_expression ], "on", postfix_expression ;', '[ "at", additive_expression ], "on", additive_expression ;'),
              ("send_exact endpoint", '"send_exact", additive_expression, "on", postfix_expression ;', '"send_exact", additive_expression, "on", additive_expression ;'),
              ("send endpoint", '"send", additive_expression, "on", postfix_expression ;', '"send", additive_expression, "on", additive_expression ;'),
              ("select endpoint", '"on", postfix_expression ;', '"on", additive_expression ;'),
              ("commit evidence", '"commit_receive", additive_expression, "using", postfix_expression ;', '"commit_receive", additive_expression, "using", additive_expression ;'),
              ("reject operand", '"reject", postfix_expression ;', '"reject", additive_expression ;'),
              ("fail endpoint", '"fail", failure_target, "on", postfix_expression ;', '"fail", failure_target, "on", additive_expression ;'),
              ("close operand", 'close_expression = "close", postfix_expression ;', 'close_expression = "close", additive_expression ;'),
              ("release operand", 'release_expression = "release", postfix_expression ;', 'release_expression = "release", additive_expression ;'),
              ("transport evidence", '"using", postfix_expression ;', '"using", additive_expression ;'),
          ]:
              g = replace_one(g, old, new, label)

          g = replace_one(g, 'prove_expression = "prove", proposition ;', 'prove_expression = "prove", "(", proposition, ")" ;', "grammar prove delimiter")
          grammar_path.write_text(g)
          PY

          rm .github/workflows/_temporary-surf005-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Phil/Surface/GrammarV1/Parser.hs grammar/phase1-surface.ebnf .github/workflows/_temporary-surf005-migrate.yml
          git commit -m "Adapt Grammar-v1 parser to determinate command syntax"
          git push origin HEAD:phase1-surf-005-remove-ambiguities
