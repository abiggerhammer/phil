name: Phase 1 INT-009 Bounded Ping Runtime

on:
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/BoundedPingRuntime.hs'
      - 'test/Phase1INT009BoundedPingRuntimeMain.hs'
      - '.github/workflows/phase1-int009-bounded-ping-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Surface/GrammarV1/BoundedPingRuntime.hs'
      - 'test/Phase1INT009BoundedPingRuntimeMain.hs'
      - '.github/workflows/phase1-int009-bounded-ping-runtime.yml'

jobs:
  bounded-ping-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate under canonical strict warnings
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Strictly typecheck INT-009 bounded Ping runtime
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/GrammarV1/BoundedPingRuntime.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1INT009BoundedPingRuntimeMain.hs
      - name: Execute INT-009 bounded Ping runtime controls
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1INT009BoundedPingRuntimeMain.hs
