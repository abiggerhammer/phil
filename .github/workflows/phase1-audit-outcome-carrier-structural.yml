name: Phase 1 Audit Outcome Carrier Structural

on:
  pull_request:
    paths:
      - 'src/Phil/Surface/Check/Engine.hs'
      - 'src/Phil/Surface/Check/Support.hs'
      - 'test/Phase1AuditOutcomeCarrierStructuralMain.hs'
      - 'docs/phase-1/audit-outcome-carrier-structural-remediation-v1.md'
      - '.github/workflows/phase1-audit-outcome-carrier-structural.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Surface/Check/Engine.hs'
      - 'src/Phil/Surface/Check/Support.hs'
      - 'test/Phase1AuditOutcomeCarrierStructuralMain.hs'
      - 'docs/phase-1/audit-outcome-carrier-structural-remediation-v1.md'
      - '.github/workflows/phase1-audit-outcome-carrier-structural.yml'

permissions:
  contents: read

jobs:
  outcome-carrier-structural-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck carrier repair and audit replay
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/Check/Support.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/Check/Engine.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1AuditOutcomeCarrierStructuralMain.hs

      - name: Replay PHIL-AUD-OUTCOME-CARRIER-STRUCTURAL-001
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1AuditOutcomeCarrierStructuralMain.hs

      - name: Replay CALL-019 resource and branch compatibility controls
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019OutcomeBranchResourceApplyMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019OutcomeBranchResourceInstallMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019SurfaceArmResourceResidueMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019SurfaceArmProofBindingsMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019SurfaceDecisionBridgeMain.hs
