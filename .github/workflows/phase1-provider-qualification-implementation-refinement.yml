name: Phase 1 Provider Qualification Implementation Refinement

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ProviderQualificationImplementationBridge.v'
      - 'proof/Phil/Core/ProviderQualificationImplementation.v'
      - 'proof/Phil/Core/ProviderQualificationImplementationExtraction.v'
      - 'proof/Phil/Core/ProviderQualificationProductionExtraction.v'
      - 'docs/phase-1/provider-qualification-implementation-refinement-v1.md'
      - '.github/workflows/phase1-provider-qualification-implementation-refinement.yml'
      - 'src/ProviderQualificationKernelSupport.hs'
      - 'src/ProviderQualificationKernel.hs'
      - 'src/Phil/Core/ProviderQualification.hs'
      - 'src/Phil/Core/ProviderQualification/Bound.hs'
      - 'test/Phase1ProviderQualificationMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ProviderQualificationImplementationBridge.v'
      - 'proof/Phil/Core/ProviderQualificationImplementation.v'
      - 'proof/Phil/Core/ProviderQualificationImplementationExtraction.v'
      - 'proof/Phil/Core/ProviderQualificationProductionExtraction.v'
      - 'docs/phase-1/provider-qualification-implementation-refinement-v1.md'
      - '.github/workflows/phase1-provider-qualification-implementation-refinement.yml'
      - 'src/ProviderQualificationKernelSupport.hs'
      - 'src/ProviderQualificationKernel.hs'
      - 'src/Phil/Core/ProviderQualification.hs'
      - 'src/Phil/Core/ProviderQualification/Bound.hs'
      - 'test/Phase1ProviderQualificationMain.hs'

permissions:
  contents: read

jobs:
  rocq-provider-qualification-implementation-refinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile provider finite-map bridge and nested traversal
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderQualificationImplementationBridge.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderQualificationImplementation.v
      - name: Regenerate bound support kernel and extract provider traversal
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f ProviderQualificationKernelSupport.hs ProviderQualificationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderQualificationImplementationExtraction.v
          test -s ProviderQualificationKernelSupport.hs
          grep -q '^module ProviderQualificationKernelSupport where' ProviderQualificationKernelSupport.hs
          grep -q '^sameKeyDomainb ::' ProviderQualificationKernelSupport.hs
          grep -q '^lookupAssoc ::' ProviderQualificationKernelSupport.hs
          grep -q '^allFiniteb ::' ProviderQualificationKernelSupport.hs
          if ! cmp -s ProviderQualificationKernelSupport.hs src/ProviderQualificationKernelSupport.hs; then
            echo 'checked-in provider support kernel differs from fresh Rocq extraction' >&2
            diff -u src/ProviderQualificationKernelSupport.hs ProviderQualificationKernelSupport.hs || true
            exit 1
          fi
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderQualificationProductionExtraction.v
          test -s ProviderQualificationKernel.hs
          grep -q '^module ProviderQualificationKernel where' ProviderQualificationKernel.hs
          grep -q '^decideOutcomeTraversal ::' ProviderQualificationKernel.hs
          grep -q '^decideProviderQualification ::' ProviderQualificationKernel.hs
          mkdir -p provider-qualification-implementation-refinement-proof
          cp \
            proof/Phil/Core/ProviderQualificationImplementationBridge.v \
            proof/Phil/Core/ProviderQualificationImplementationBridge.vo \
            proof/Phil/Core/ProviderQualificationImplementation.v \
            proof/Phil/Core/ProviderQualificationImplementation.vo \
            proof/Phil/Core/ProviderQualificationImplementationExtraction.v \
            proof/Phil/Core/ProviderQualificationProductionExtraction.v \
            ProviderQualificationKernelSupport.hs \
            ProviderQualificationKernel.hs \
            provider-qualification-implementation-refinement-proof/
          sha256sum provider-qualification-implementation-refinement-proof/*
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-provider-qualification-implementation-refinement
          path: provider-qualification-implementation-refinement-proof
          if-no-files-found: error

  verify-extracted-provider-kernels:
    needs: rocq-provider-qualification-implementation-refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-provider-qualification-implementation-refinement
          path: provider-qualification-implementation-refinement-proof
      - name: Typecheck provider support and nested traversal kernels
        run: |
          set -euo pipefail
          cmp -s \
            provider-qualification-implementation-refinement-proof/ProviderQualificationKernelSupport.hs \
            src/ProviderQualificationKernelSupport.hs
          ghc -Wall -Werror -fno-code src/ProviderQualificationKernelSupport.hs
          ghc -Wall -Werror -fno-code \
            provider-qualification-implementation-refinement-proof/ProviderQualificationKernel.hs
      - name: Preserve existing PROV-001–005 behavior before final binding
        run: |
          set -euo pipefail
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- runghc -isrc test/Phase1CallableRefinementMain.hs
          cabal exec -- runghc -isrc test/Phase1ProviderQualificationMain.hs
