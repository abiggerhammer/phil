name: Storage Failure Detail

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/StorageFailure.hs'
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/Systems/ClientOutbound.hs'
      - 'src/Phil/Systems.hs'
      - 'test/StorageFailureMain.hs'
      - 'docs/phase-0/storage-failure-detail-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/storage-failure-detail.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/Systems/StorageFailure.hs'
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/Systems/ClientOutbound.hs'
      - 'src/Phil/Systems.hs'
      - 'test/StorageFailureMain.hs'
      - 'docs/phase-0/storage-failure-detail-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/storage-failure-detail.yml'

permissions:
  contents: read

jobs:
  storage-failure-detail:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build focused semantic test
        run: cabal build phil-storage-failure-detail-tests

      - name: Verify storage failure semantic candidate
        run: cabal test phil-storage-failure-detail-tests --test-show-details=direct
