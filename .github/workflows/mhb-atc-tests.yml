name: MHB ATC Radar Replay

on:
  pull_request:
    paths:
      - 'scripts/mhb_atc.py'
      - 'scripts/test_mhb_atc.py'
      - 'scripts/mhb_atc_stage.py'
      - 'scripts/test_mhb_atc_stage.py'
      - 'scripts/mhb_atc_admit.py'
      - 'scripts/test_mhb_atc_admit.py'
      - 'scripts/mhb_atc_immutable.py'
      - 'scripts/mhb_atc_inventory.py'
      - 'scripts/test_mhb_atc_inventory.py'
      - 'scripts/mhb_atc_inventory_snapshot.sh'
      - 'scripts/mhb_atc_publisher_identity_snapshot.sh'
      - '.github/atc-publisher-policy.json'
      - 'scripts/test_mhb_atc_immutable.py'
      - 'scripts/test_mhb_atc_auto_config.py'
      - 'scripts/mhb_atc_reconcile.py'
      - 'scripts/test_mhb_atc_reconcile.py'
      - '.github/workflows/mhb-atc-reconcile.yml'
      - '.github/workflows/mhb-atc-admit.yml'
      - '.github/workflows/mhb-atc-publisher-token-preflight.yml'
      - '.github/workflows/mhb-atc-worker-token-preflight.yml'
      - '.github/atc-worker-policy.json'
      - '.github/atc-worker-lanes.json'
      - '.github/workflows/mhb-atc-worker-broker.yml'
      - 'scripts/mhb_atc_worker_broker.py'
      - 'scripts/test_mhb_atc_worker_broker.py'
      - 'scripts/test_mhb_atc_staged_push_ci.py'
      - 'scripts/test_mhb_atc_privileged_pr_ci.py'
      - 'scripts/mhb_atc_live_authority.py'
      - 'scripts/test_mhb_atc_live_authority.py'
      - 'docs/phase-2/mhb-atc-live-authority-audit.md'
      # Recheck EVERY workflow change; a future unbounded push must fail.
      - '.github/workflows/**'
      - 'docs/phase-2/mhb-atc-worker-broker.md'
      - 'docs/phase-2/mhb-atc-privileged-pr-ci.md'
      - 'scripts/test_mhb_atc_worker_preflight.py'
      - 'docs/phase-2/mhb-atc-worker-app.md'
      - '.github/workflows/mhb-atc-stage.yml'
      - 'docs/mhb-atc.md'
      - '.github/workflows/mhb-atc-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/mhb_atc.py'
      - 'scripts/test_mhb_atc.py'
      - 'scripts/mhb_atc_stage.py'
      - 'scripts/test_mhb_atc_stage.py'
      - 'scripts/mhb_atc_admit.py'
      - 'scripts/test_mhb_atc_admit.py'
      - 'scripts/mhb_atc_immutable.py'
      - 'scripts/mhb_atc_inventory.py'
      - 'scripts/test_mhb_atc_inventory.py'
      - 'scripts/mhb_atc_inventory_snapshot.sh'
      - 'scripts/mhb_atc_publisher_identity_snapshot.sh'
      - '.github/atc-publisher-policy.json'
      - 'scripts/test_mhb_atc_immutable.py'
      - 'scripts/test_mhb_atc_auto_config.py'
      - 'scripts/mhb_atc_reconcile.py'
      - 'scripts/test_mhb_atc_reconcile.py'
      - '.github/workflows/mhb-atc-reconcile.yml'
      - '.github/workflows/mhb-atc-admit.yml'
      - '.github/workflows/mhb-atc-publisher-token-preflight.yml'
      - '.github/workflows/mhb-atc-worker-token-preflight.yml'
      - '.github/atc-worker-policy.json'
      - '.github/atc-worker-lanes.json'
      - '.github/workflows/mhb-atc-worker-broker.yml'
      - 'scripts/mhb_atc_worker_broker.py'
      - 'scripts/test_mhb_atc_worker_broker.py'
      - 'scripts/test_mhb_atc_staged_push_ci.py'
      - 'scripts/test_mhb_atc_privileged_pr_ci.py'
      - 'scripts/mhb_atc_live_authority.py'
      - 'scripts/test_mhb_atc_live_authority.py'
      - 'docs/phase-2/mhb-atc-live-authority-audit.md'
      # Recheck EVERY workflow change; a future unbounded push must fail.
      - '.github/workflows/**'
      - 'docs/phase-2/mhb-atc-worker-broker.md'
      - 'docs/phase-2/mhb-atc-privileged-pr-ci.md'
      - 'scripts/test_mhb_atc_worker_preflight.py'
      - 'docs/phase-2/mhb-atc-worker-app.md'
      - '.github/workflows/mhb-atc-stage.yml'
      - 'docs/mhb-atc.md'
      - '.github/workflows/mhb-atc-tests.yml'

permissions:
  contents: read

concurrency:
  group: mhb-atc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax
        run: python3 -m py_compile scripts/mhb_atc.py scripts/test_mhb_atc.py scripts/mhb_atc_stage.py scripts/test_mhb_atc_stage.py scripts/mhb_atc_admit.py scripts/test_mhb_atc_admit.py scripts/mhb_atc_immutable.py scripts/test_mhb_atc_immutable.py scripts/mhb_atc_inventory.py scripts/test_mhb_atc_inventory.py scripts/test_mhb_atc_auto_config.py scripts/test_mhb_atc_worker_preflight.py scripts/mhb_atc_worker_broker.py scripts/test_mhb_atc_worker_broker.py scripts/test_mhb_atc_staged_push_ci.py scripts/test_mhb_atc_privileged_pr_ci.py scripts/mhb_atc_live_authority.py scripts/test_mhb_atc_live_authority.py scripts/mhb_atc_reconcile.py scripts/test_mhb_atc_reconcile.py
      - name: Offline radar and admission-policy tests
        run: python3 scripts/test_mhb_atc.py
      - name: Offline durable staging-intent tests
        run: python3 scripts/test_mhb_atc_stage.py
      - name: Offline single-slot admission tests
        run: python3 scripts/test_mhb_atc_admit.py
      - name: Opt-in scheduled admission safety tests
        run: python3 scripts/test_mhb_atc_auto_config.py
      - name: Offline worker App W1 no-key delegation and manual preflight tests
        run: python3 scripts/test_mhb_atc_worker_preflight.py
      - name: Worker App W2 fork-to-staged broker authorization and safety replays
        run: python3 scripts/test_mhb_atc_worker_broker.py
      - name: Install pinned YAML parser for G1 audit (test-only)
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'PyYAML==6.0.3'
      - name: G1 staged-push CI namespace and historical workflow-tree isolation
        run: python3 scripts/test_mhb_atc_staged_push_ci.py
      - name: G2 privileged PR environment, token and controller isolation
        run: python3 scripts/test_mhb_atc_privileged_pr_ci.py
      - name: Offline owner settings evidence and fail-closed trust boundary tests
        run: python3 scripts/test_mhb_atc_live_authority.py
      - name: Immutable publisher, ruleset and receipt negative replay tests
        run: python3 scripts/test_mhb_atc_immutable.py
      - name: Full protected-ref census and authenticated history replays
        run: python3 scripts/test_mhb_atc_inventory.py
      - name: Offline slot-release and recovery tests
        run: python3 scripts/test_mhb_atc_reconcile.py

  policy-reader-visibility:
    # Confirm the SAME low-privilege GITHUB_TOKEN class used by the actual
    # controller can validate the pinned owner-authenticated version even if
    # GitHub redacts bypass_actors. No admin App token is ever granted here.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify live policy evidence through ordinary workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/rulesets/27365284" > /tmp/atc-reader-ruleset.json
          python3 scripts/mhb_atc_immutable.py ruleset \
            --ruleset-json /tmp/atc-reader-ruleset.json \
            --repo "$GH_REPO" --app-id 5782193 --ruleset-id 27365284
          jq -r '("Ruleset live revision: " + (.updated_at // "MISSING")),
                 ("Bypass field visible to workflow token: " + (has("bypass_actors")|tostring))' \
            /tmp/atc-reader-ruleset.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify configured publisher App and bot identity (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_APP_SLUG: ${{ vars.MHB_ATC_PUBLISHER_APP_SLUG }}
          PUBLISHER_APP_ID: ${{ vars.MHB_ATC_PUBLISHER_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Exact same read-only identity helper used by the controller.
          # The private /apps/{slug} endpoint is NOT accessed. Bot user
          # metadata is read with the ordinary scoped GITHUB_TOKEN.
          . scripts/mhb_atc_publisher_identity_snapshot.sh
          jq -r '[
            "- Publisher App: \(.app_slug) (App ID \(.app_id))",
            "- Bot account: \(.bot_login) (GitHub user ID \(.bot_id))",
            "- Identity verified via read-only GitHub Actions token; no App key or publisher token"
          ] | .[]' /tmp/atc-publisher-identity.json >> "$GITHUB_STEP_SUMMARY"
