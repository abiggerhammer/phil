name: Control Codec Runtime

on:
  pull_request:
    paths:
      - 'src/Phil/LLVM/ControlCodec.hs'
      - 'src/Phil/LLVM/StorageFailureDetail.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMControlCodecMain.hs'
      - 'runtime/phase0/control_codec_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ControlCodecABIMain.hs'
      - 'docs/phase-0/control-codec-v1.md'
      - 'phil-core.cabal'
  push:
    branches: [main]
    paths:
      - 'src/Phil/LLVM/ControlCodec.hs'
      - 'src/Phil/LLVM/StorageFailureDetail.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMControlCodecMain.hs'
      - 'runtime/phase0/control_codec_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/ControlCodecABIMain.hs'
      - 'docs/phase-0/control-codec-v1.md'
      - 'phil-core.cabal'

permissions:
  contents: read

jobs:
  control-codec-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build emitter and focused tests
        run: cabal build phil-llvm-phase0-control-codec phil-control-codec-abi-tests

      - name: Verify profile and predecessor regressions
        run: |
          cabal test phil-control-codec-abi-tests --test-show-details=direct
          cabal test phil-storage-failure-detail-abi-tests --test-show-details=direct
          cabal test phil-server-framed-ingress-abi-tests --test-show-details=direct
          cabal test phil-client-control-send-abi-tests --test-show-details=direct

      - name: Assemble, ABI-check, link, and execute shared codec
        shell: bash
        run: |
          set -euo pipefail
          LLVM_AS=llvm-as-18
          LLVM_LINK=llvm-link-18
          CLANG=clang-18
          EMITTER="$(cabal list-bin phil-llvm-phase0-control-codec)"

          "$EMITTER" > phase0-control-codec.ll
          "$LLVM_AS" phase0-control-codec.ll -o phase0-control-codec.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm runtime/phase0/control_codec_v1.c \
            -o control-codec-runtime.ll
          python3 scripts/check_runtime_abi.py --partial \
            phase0-control-codec.ll control-codec-runtime.ll
          "$LLVM_AS" control-codec-runtime.ll -o control-codec-runtime.bc
          "$LLVM_LINK" phase0-control-codec.bc control-codec-runtime.bc \
            -o phase0-control-codec-partially-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 \
            runtime/phase0/control_codec_v1.c \
            runtime/phase0/control_codec_v1_smoke.c \
            runtime/phase0/control_codec_v1_smoke_main.c \
            -o control-codec-smoke
          ./control-codec-smoke
