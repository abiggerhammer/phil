name: Phase 1 INT-007 Handoff Manifest

on:
  pull_request:
    paths:
      - 'src/Phil/Handoff/Phase1Manifest.hs'
      - 'src/Phil/Handoff/Phase1WitnessSourceBundle.hs'
      - 'src/Phil/Handoff/Phase1CheckedArchitecture.hs'
      - 'src/Phil/Handoff/Phase1VerificationBundle.hs'
      - 'src/Phil/Handoff/Phase1WholeSourceVerification.hs'
      - 'src/Phil/Handoff/Phase1AssuranceInputs.hs'
      - 'src/Phil/Handoff/Phase1RuntimeBuild.hs'
      - 'src/Phil/Verification/GrammarV1WholeSource.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'src/Phil/Systems/GenericLowering.hs'
      - 'src/Phil/Core/Static.hs'
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Phase1Stage.hs'
      - 'src/Phil/Systems/StageClosure.hs'
      - 'src/Phil/Systems/CostAttribution.hs'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - 'src/Phil/Examples/Phase1/StageClosureWitnesses.hs'
      - 'test/Phase1INT007HandoffManifestMain.hs'
      - 'test/Phase1INT007WitnessSourceBundleMain.hs'
      - 'test/Phase1INT007CheckedArchitectureMain.hs'
      - 'test/Phase1INT007VerificationBundleMain.hs'
      - 'test/Phase1INT007PingVerificationBundleMain.hs'
      - 'test/Phase1INT007AssuranceInputsMain.hs'
      - 'test/Phase1INT007RuntimeBuildMain.hs'
      - 'test/Phil/Test/Phase1/ManifestWitnesses.hs'
      - 'handoff/phase1/manifest-v1.tsv'
      - 'handoff/phase1/witnesses/*.tsv'
      - 'handoff/phase1/ping/**'
      - 'handoff/phase1/runtime/**'
      - 'docs/phase-1/int-007-handoff-manifest-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int-007-handoff-manifest.yml'
      - 'grammar/phase1-surface.ebnf'
      - 'test/fixtures/phase1-surface/manifest.json'
      - 'test/fixtures/phase1/surf010-inline.bundle'
      - 'test/fixtures/phase1/surf010-metadata.bundle'
      - 'test/fixtures/phase1-negative/manifest.tsv'
      - 'examples/upload/client.phil'
      - 'examples/upload/server.phil'
      - 'examples/steve/put.phil'
      - 'examples/steve/get.phil'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Handoff/Phase1Manifest.hs'
      - 'src/Phil/Handoff/Phase1WitnessSourceBundle.hs'
      - 'src/Phil/Handoff/Phase1CheckedArchitecture.hs'
      - 'src/Phil/Handoff/Phase1VerificationBundle.hs'
      - 'src/Phil/Handoff/Phase1WholeSourceVerification.hs'
      - 'src/Phil/Handoff/Phase1AssuranceInputs.hs'
      - 'src/Phil/Handoff/Phase1RuntimeBuild.hs'
      - 'src/Phil/Verification/GrammarV1WholeSource.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'src/Phil/Systems/GenericLowering.hs'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - 'src/Phil/Examples/Phase1/StageClosureWitnesses.hs'
      - 'test/Phase1INT007HandoffManifestMain.hs'
      - 'test/Phase1INT007WitnessSourceBundleMain.hs'
      - 'test/Phase1INT007CheckedArchitectureMain.hs'
      - 'test/Phase1INT007VerificationBundleMain.hs'
      - 'test/Phase1INT007PingVerificationBundleMain.hs'
      - 'test/Phase1INT007AssuranceInputsMain.hs'
      - 'test/Phase1INT007RuntimeBuildMain.hs'
      - 'test/Phil/Test/Phase1/ManifestWitnesses.hs'
      - 'handoff/phase1/manifest-v1.tsv'
      - 'handoff/phase1/witnesses/*.tsv'
      - 'handoff/phase1/ping/**'
      - 'handoff/phase1/runtime/**'
      - 'docs/phase-1/int-007-handoff-manifest-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int-007-handoff-manifest.yml'
      - 'grammar/phase1-surface.ebnf'
      - 'test/fixtures/phase1-surface/manifest.json'
      - 'test/fixtures/phase1/surf010-inline.bundle'
      - 'test/fixtures/phase1/surf010-metadata.bundle'
      - 'test/fixtures/phase1-negative/manifest.tsv'
      - 'examples/upload/client.phil'
      - 'examples/upload/server.phil'
      - 'examples/steve/put.phil'
      - 'examples/steve/get.phil'

jobs:
  handoff-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate under canonical strict warnings
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Strictly typecheck INT-007 handoff boundaries
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Handoff/Phase1Manifest.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Handoff/Phase1WitnessSourceBundle.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Handoff/Phase1CheckedArchitecture.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Handoff/Phase1VerificationBundle.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Handoff/Phase1WholeSourceVerification.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Handoff/Phase1AssuranceInputs.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Handoff/Phase1RuntimeBuild.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Verification/GrammarV1WholeSource.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1INT007HandoffManifestMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1INT007WitnessSourceBundleMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007CheckedArchitectureMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007VerificationBundleMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007PingVerificationBundleMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007AssuranceInputsMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007RuntimeBuildMain.hs
      - name: Check exact Phase-1 handoff manifest integrity
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT007HandoffManifestMain.hs
      - name: Reconstruct Upload and Steve SourceBundles from handoff bytes
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT007WitnessSourceBundleMain.hs
      - name: Reconstruct checked semantics and ArchitectureInstance identities
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007CheckedArchitectureMain.hs
      - name: Reconstruct Upload and Steve VerificationBundles and obligation graphs
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007VerificationBundleMain.hs
      - name: Reconstruct five canonical Ping VerificationBundles
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007PingVerificationBundleMain.hs
      - name: Reconstruct Upload and Steve assurance inputs
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007AssuranceInputsMain.hs
      - name: Reconstruct Upload and Steve runtime/build artifacts
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007RuntimeBuildMain.hs
