name: Final Session Offer Lowering PR Trigger

on:
  pull_request:
    paths:
      - '.github/workflows/session-offer-lowering-pr-trigger.yml'
      - '.github/workflows/session-offer-lowering-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: lower-final-session-offer
          fetch-depth: 0
      - name: Run staged lowering applicator
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^          set -euo pipefail$/,$p' .github/workflows/session-offer-lowering-edit.yml \
            | sed 's/^          //' \
            | sed '/^git config user.name/i rm -f .github/workflows/final-response-receive-runtime.yml' \
            | sed '/^git config user.name/i rm -f .github/workflows/session-offer-lowering-pr-trigger.yml' \
            > /tmp/apply-final-session-offer.sh
          bash /tmp/apply-final-session-offer.sh
