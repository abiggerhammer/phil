name: Temporary EXEC-017 parser patch

on:
  push:
    branches: [phase1-exec-017-integer-division-source]

permissions:
  contents: write

jobs:
  patch-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-exec-017-integer-division-source
      - name: Apply exact parser replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Phil/Surface/GrammarV1/Parser.hs')
          text = path.read_text()

          old_carrier = '''data GrammarV1BinaryOperator
            = GrammarV1Add
            | GrammarV1Subtract
            | GrammarV1Multiply
            deriving (Eq, Ord, Show)'''
          new_carrier = '''data GrammarV1BinaryOperator
            = GrammarV1Add
            | GrammarV1Subtract
            | GrammarV1Multiply
            | GrammarV1Divide
            | GrammarV1Remainder
            deriving (Eq, Ord, Show)'''

          old_parser = '''parseMoreMultiplicativeExpression left = do
            hasMultiply <- peekSymbol "*"
            if hasMultiply
              then do
                token <- takeToken
                right <- parsePostfixExpression
                let operator = Located (locatedSpan token) GrammarV1Multiply
                    combined = Located
                      (SourceSpan
                        (sourceSpanStart (locatedSpan left))
                        (sourceSpanEnd (locatedSpan right)))
                      (GrammarV1BinaryExpression left operator right)
                parseMoreMultiplicativeExpression combined
              else pure left'''
          new_parser = '''parseMoreMultiplicativeExpression left = do
            hasMultiply <- peekSymbol "*"
            hasDivide <- peekSymbol "/"
            hasRemainder <- peekSymbol "%"
            if hasMultiply || hasDivide || hasRemainder
              then do
                token <- takeToken
                operatorValue <- case locatedValue token of
                  GrammarSymbol "*" -> pure GrammarV1Multiply
                  GrammarSymbol "/" -> pure GrammarV1Divide
                  GrammarSymbol "%" -> pure GrammarV1Remainder
                  other -> failParser $
                    "internal multiplicative operator dispatch error for " <> renderToken other
                right <- parsePostfixExpression
                let operator = Located (locatedSpan token) operatorValue
                    combined = Located
                      (SourceSpan
                        (sourceSpanStart (locatedSpan left))
                        (sourceSpanEnd (locatedSpan right)))
                      (GrammarV1BinaryExpression left operator right)
                parseMoreMultiplicativeExpression combined
              else pure left'''

          assert text.count(old_carrier) == 1, 'binary operator carrier anchor changed'
          assert text.count(old_parser) == 1, 'multiplicative parser anchor changed'
          text = text.replace(old_carrier, new_carrier).replace(old_parser, new_parser)
          path.write_text(text)
          PY
      - name: Commit parser edit and remove temporary workflow
        run: |
          git config user.name 'Meredith L. Patterson'
          git config user.email 'clonearmy@gmail.com'
          git rm .github/workflows/tmp-exec017-parser-patch.yml
          git add src/Phil/Surface/GrammarV1/Parser.hs
          git commit -m 'phase1: parse integer division and remainder operators'
          git push origin HEAD:phase1-exec-017-integer-division-source
