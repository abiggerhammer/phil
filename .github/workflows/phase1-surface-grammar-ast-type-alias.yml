name: Phase 1 Surface Grammar AST Type Alias Correspondence

on:
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/ReferenceAstTypeAlias.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstTopLevel.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'src/Phil/Surface/GrammarV1/Parser.hs'
      - 'src/Phil/Surface/GrammarV1/Lexer.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'test/Phase1GrammarV1ReferenceAstTypeAliasMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - 'scripts/check_phase1_surface_corpus.py'
      - '.github/workflows/phase1-surface-grammar-ast-type-alias.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Surface/GrammarV1/ReferenceAstTypeAlias.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstTopLevel.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'src/Phil/Surface/GrammarV1/Parser.hs'
      - 'src/Phil/Surface/GrammarV1/Lexer.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'test/Phase1GrammarV1ReferenceAstTypeAliasMain.hs'
      - 'test/fixtures/phase1-surface/**'
      - 'scripts/check_phase1_surface_corpus.py'
      - '.github/workflows/phase1-surface-grammar-ast-type-alias.yml'

permissions:
  contents: read

jobs:
  ast-type-alias-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Strictly compile type-alias correspondence harness
        run: |
          cabal exec -- ghc --make \
            -Wall -Werror \
            -isrc \
            test/Phase1GrammarV1ReferenceAstTypeAliasMain.hs \
            -o /tmp/phase1-surface-grammar-ast-type-alias

      - name: Check certified type-alias spine against production AST
        run: |
          python3 scripts/check_phase1_surface_corpus.py --emit-parser-cases \
            | /tmp/phase1-surface-grammar-ast-type-alias
