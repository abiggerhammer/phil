name: CERT-008 Package Registration

on:
  pull_request:
    paths:
      - '.github/workflows/cert008-register.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lower-final-session-offer
          fetch-depth: 0
      - name: Register certification module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('phil-core.cabal')
          text = p.read_text()
          old = '      Phil.LLVM.SessionOffer\n  build-depends:\n'
          new = '      Phil.LLVM.SessionOffer\n      Phil.LLVM.SessionOfferCertification\n  build-depends:\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected SessionOffer registration shape')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "phil-cert008-bot"
          git config user.email "actions@users.noreply.github.com"
          git add phil-core.cabal
          git commit -m "Register final-response CERT-008 module"
          git push origin HEAD:lower-final-session-offer
