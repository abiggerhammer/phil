name: Recognition Gates Back-Certification

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/Recognition.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqRecognitionGates.hs'
      - 'app/RecognitionGatesBackCertificationMain.hs'
      - '.github/workflows/recognition-gates-back-certification.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/Recognition.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqRecognitionGates.hs'
      - 'app/RecognitionGatesBackCertificationMain.hs'
      - '.github/workflows/recognition-gates-back-certification.yml'

permissions:
  contents: read

jobs:
  check-recognition-gates:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check Recognition theorem corpus
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Recognition.v
      - name: Stage checked Recognition proof
        run: |
          mkdir -p checked/proof/Phil/Core
          cp proof/Phil/Core/Recognition.v checked/proof/Phil/Core/
          cp proof/Phil/Core/Recognition.vo checked/proof/Phil/Core/
      - uses: actions/upload-artifact@v4
        with:
          name: recognition-gates-checked-proof
          path: checked/
          if-no-files-found: error
          retention-days: 14

  certify-recognition-gates:
    needs: check-recognition-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: recognition-gates-checked-proof
          path: checked
      - name: Build Phil assurance library
        run: cabal build lib:phil-core
      - name: Typecheck back-certification metadata and certifier
        run: |
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/Assurance/RocqRecognitionGates.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/RecognitionGatesBackCertificationMain.hs
      - name: Build back-certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/RecognitionGatesBackCertificationMain.hs \
            -o phil-certify-recognition-gates
      - name: Produce two proof-assistant certificates
        run: |
          mkdir -p recognition-gates-certificates
          ./phil-certify-recognition-gates checked recognition-gates-certificates
          test "$(find recognition-gates-certificates -type f -name '*.rocq.cert' | wc -l)" -eq 2
          sha256sum recognition-gates-certificates/*.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-recognition-gates-proof-certificates
          path: recognition-gates-certificates/
          if-no-files-found: error
          retention-days: 30
