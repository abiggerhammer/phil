name: Phase 1 Boundary Representation Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/BoundaryRepresentation.v'
      - 'proof/Phil/Core/BoundaryRepresentationImplementation.v'
      - 'proof/Phil/Core/BoundaryRepresentationImplementationExtraction.v'
      - 'docs/phase-1/boundary-representation-proof-v1.md'
      - 'docs/phase-1/boundary-representation-implementation-refinement-v1.md'
      - 'docs/phase-1/boundary-representation-production-binding-v1.md'
      - 'app/BoundaryRepresentationDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-boundary-representation-proofs.yml'
      - 'src/BoundaryRepresentationKernel.hs'
      - 'src/Phil/Core/BoundaryMapping.hs'
      - 'src/Phil/Core/BoundaryDirection.hs'
      - 'phil-core.cabal'
      - 'test/Phase1BoundaryMappingMain.hs'
      - 'test/Phase1BoundaryMappingFailureMain.hs'
      - 'test/Phase1TransformingBoundaryMappingMain.hs'
      - 'test/Phase1BoundaryDirectionMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/BoundaryRepresentation.v'
      - 'proof/Phil/Core/BoundaryRepresentationImplementation.v'
      - 'proof/Phil/Core/BoundaryRepresentationImplementationExtraction.v'
      - 'docs/phase-1/boundary-representation-proof-v1.md'
      - 'docs/phase-1/boundary-representation-implementation-refinement-v1.md'
      - 'docs/phase-1/boundary-representation-production-binding-v1.md'
      - 'app/BoundaryRepresentationDecisionCorrespondenceMain.hs'
      - '.github/workflows/phase1-boundary-representation-proofs.yml'
      - 'src/BoundaryRepresentationKernel.hs'
      - 'src/Phil/Core/BoundaryMapping.hs'
      - 'src/Phil/Core/BoundaryDirection.hs'
      - 'phil-core.cabal'
      - 'test/Phase1BoundaryMappingMain.hs'
      - 'test/Phase1BoundaryMappingFailureMain.hs'
      - 'test/Phase1TransformingBoundaryMappingMain.hs'
      - 'test/Phase1BoundaryDirectionMain.hs'

permissions:
  contents: read

jobs:
  rocq-boundary-representation-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-BND-REP-001 and verify exact production kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryRepresentation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryRepresentationImplementation.v
          rm -f BoundaryRepresentationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/BoundaryRepresentationImplementationExtraction.v
          test -s BoundaryRepresentationKernel.hs
          grep -q 'decideBoundaryMappingByFacts' BoundaryRepresentationKernel.hs
          grep -q 'planBoundaryCorrespondence' BoundaryRepresentationKernel.hs
          grep -q 'decideBoundaryUse' BoundaryRepresentationKernel.hs
          cmp BoundaryRepresentationKernel.hs src/BoundaryRepresentationKernel.hs
          kernel_sha="$(sha256sum BoundaryRepresentationKernel.hs | awk '{print $1}')"
          test "$kernel_sha" = '9f9c6f424ee5bcb570071a2390917024f2adc7996ea807a053becea414b8dcc8'
          sha256sum BoundaryRepresentationKernel.hs src/BoundaryRepresentationKernel.hs
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boundary-representation-proof
          cp \
            proof/Phil/Core/BoundaryRepresentation.v \
            proof/Phil/Core/BoundaryRepresentation.vo \
            proof/Phil/Core/BoundaryRepresentationImplementation.v \
            proof/Phil/Core/BoundaryRepresentationImplementation.vo \
            proof/Phil/Core/BoundaryRepresentationImplementationExtraction.v \
            proof/Phil/Core/BoundaryRepresentationImplementationExtraction.vo \
            BoundaryRepresentationKernel.hs \
            boundary-representation-proof/
          sha256sum \
            proof/Phil/Core/BoundaryRepresentation.v \
            proof/Phil/Core/BoundaryRepresentation.vo \
            proof/Phil/Core/BoundaryRepresentationImplementation.v \
            proof/Phil/Core/BoundaryRepresentationImplementation.vo \
            BoundaryRepresentationKernel.hs \
            > boundary-representation-proof/PHIL-BND-REP-001.proof.sha256
          {
            echo 'obligation=PHIL-BND-REP-001'
            echo 'evidence=Rocq-9.2.0'
            cat boundary-representation-proof/PHIL-BND-REP-001.proof.sha256
          } > boundary-representation-proof/PHIL-BND-REP-001.proof-certificate.txt
          cat boundary-representation-proof/PHIL-BND-REP-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-boundary-representation-production-binding
          path: boundary-representation-proof
          if-no-files-found: error

  verify-boundary-representation-production-binding:
    needs: rocq-boundary-representation-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-boundary-representation-production-binding
          path: boundary-representation-proof
      - name: Strict-compile exact kernel and bound production seams
        run: |
          set -euo pipefail
          cmp boundary-representation-proof/BoundaryRepresentationKernel.hs src/BoundaryRepresentationKernel.hs
          ghc -Wall -Werror -fno-code src/BoundaryRepresentationKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/BoundaryMapping.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/BoundaryDirection.hs
      - name: Execute exact extracted-kernel controls
        run: |
          set -euo pipefail
          ghc -Wall -Werror \
            -isrc \
            app/BoundaryRepresentationDecisionCorrespondenceMain.hs \
            -o boundary-representation-kernel-controls
          ./boundary-representation-kernel-controls
      - name: Strict-typecheck unchanged BND-004–007 corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1BoundaryMappingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1BoundaryMappingFailureMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1TransformingBoundaryMappingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1BoundaryDirectionMain.hs
      - name: Re-run unchanged BND-004–007 correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1BoundaryMappingMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1BoundaryMappingFailureMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1TransformingBoundaryMappingMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1BoundaryDirectionMain.hs
      - name: Record production-binding identities
        run: |
          set -euo pipefail
          mkdir -p boundary-representation-production-binding
          sha256sum \
            src/BoundaryRepresentationKernel.hs \
            src/Phil/Core/BoundaryMapping.hs \
            src/Phil/Core/BoundaryDirection.hs \
            phil-core.cabal \
            test/Phase1BoundaryMappingMain.hs \
            test/Phase1BoundaryMappingFailureMain.hs \
            test/Phase1TransformingBoundaryMappingMain.hs \
            test/Phase1BoundaryDirectionMain.hs \
            app/BoundaryRepresentationDecisionCorrespondenceMain.hs \
            proof/Phil/Core/BoundaryRepresentationImplementation.v \
            docs/phase-1/boundary-representation-production-binding-v1.md \
            > boundary-representation-production-binding/PHIL-BND-REP-001.production-binding.sha256
          cat boundary-representation-production-binding/PHIL-BND-REP-001.production-binding.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-representation-production-binding
          path: boundary-representation-production-binding
          if-no-files-found: error
