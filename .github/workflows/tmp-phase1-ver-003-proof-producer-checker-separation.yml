name: Temporary VER-003 proof producer checker separation staging

on:
  push:
    branches: [phase1-ver-003-proof-producer-checker-separation]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-ver-003-proof-producer-checker-separation
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Register VER-003 proof evidence module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('phil-core.cabal')
          text = path.read_text()
          old = "      Phil.Verification\n  other-modules:\n"
          new = "      Phil.Verification\n      Phil.Verification.ProofEvidence\n  other-modules:\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one Phil.Verification exposed-module anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Run VER-003 producer/checker separation regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationProofProducerCheckerSeparationMain.hs

      - name: Re-run VER-002 and VER-001 verification controls
        run: |
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationCanonicalObligationGraphMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationIntrinsicInvalidityMain.hs

      - name: Run decision and assurance controls
        run: cabal test phil-decision-tests phil-assurance-handoff-tests

      - name: Commit staged module registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phil-core.cabal
          git commit -m 'ver: register checked proof evidence boundary'
          git push origin HEAD:phase1-ver-003-proof-producer-checker-separation
