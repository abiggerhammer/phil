name: Phase 1 Surface Borrow View Scope Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/BindingSemantics.v'
      - 'proof/Phil/Surface/SurfaceBinderScopeCore.v'
      - 'proof/Phil/Surface/SurfaceLetPatternScope.v'
      - 'proof/Phil/Surface/SurfaceBorrowViewScope.v'
      - 'src/Phil/Surface/GrammarV1/BorrowViewScope.hs'
      - 'src/Phil/Surface/GrammarV1/LetPatternScope.hs'
      - 'test/Phase1GrammarV1BorrowViewScopeMain.hs'
      - 'docs/phase-1/surface-borrow-view-scope-proof-v1.md'
      - '.github/workflows/phase1-surface-borrow-view-scope-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/BindingSemantics.v'
      - 'proof/Phil/Surface/SurfaceBinderScopeCore.v'
      - 'proof/Phil/Surface/SurfaceLetPatternScope.v'
      - 'proof/Phil/Surface/SurfaceBorrowViewScope.v'
      - 'src/Phil/Surface/GrammarV1/BorrowViewScope.hs'
      - 'src/Phil/Surface/GrammarV1/LetPatternScope.hs'
      - 'test/Phase1GrammarV1BorrowViewScopeMain.hs'
      - 'docs/phase-1/surface-borrow-view-scope-proof-v1.md'
      - '.github/workflows/phase1-surface-borrow-view-scope-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-surface-borrow-view-scope:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile Surface borrow-view scope proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/BindingSemantics.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SurfaceBinderScopeCore.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SurfaceLetPatternScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SurfaceBorrowViewScope.v
          sha256sum \
            proof/Phil/Surface/SurfaceBorrowViewScope.v \
            proof/Phil/Surface/SurfaceBorrowViewScope.vo \
            > surface-borrow-view-scope-proof.sha256
          cat surface-borrow-view-scope-proof.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: surface-borrow-view-scope-proof
          path: surface-borrow-view-scope-proof.sha256
          if-no-files-found: error

  verify-surface-borrow-view-scope:
    needs: rocq-surface-borrow-view-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck borrow-view scope authorities
        run: |
          set -euo pipefail
          for module in \
            src/Phil/Surface/GrammarV1/BorrowViewScope.hs \
            src/Phil/Surface/GrammarV1/LetPatternScope.hs \
            test/Phase1GrammarV1BorrowViewScopeMain.hs
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$module"
          done
      - name: Replay SURF-009 borrow-view scope corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BorrowViewScopeMain.hs
