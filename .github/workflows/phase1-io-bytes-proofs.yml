name: Phase 1 IO Bytes Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/RuntimeBytes.v'
      - 'proof/Phil/Core/RuntimeBytesImplementation.v'
      - 'src/Phil/Core/Syntax.hs'
      - 'src/Phil/Core/Value.hs'
      - 'src/Phil/Surface/GrammarV1/CheckedType.hs'
      - 'test/Phase1IOBytesRuntimeSizedMain.hs'
      - '.github/workflows/phase1-io-bytes-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/RuntimeBytes.v'
      - 'proof/Phil/Core/RuntimeBytesImplementation.v'
      - 'src/Phil/Core/Syntax.hs'
      - 'src/Phil/Core/Value.hs'
      - 'src/Phil/Surface/GrammarV1/CheckedType.hs'
      - 'test/Phase1IOBytesRuntimeSizedMain.hs'
      - '.github/workflows/phase1-io-bytes-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-runtime-bytes-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-P1-IO-BYTES-001 semantic and implementation proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimeBytes.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimeBytesImplementation.v

      - name: Record checked proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-bytes-proof
          cp \
            proof/Phil/Core/RuntimeBytes.v \
            proof/Phil/Core/RuntimeBytes.vo \
            proof/Phil/Core/RuntimeBytesImplementation.v \
            proof/Phil/Core/RuntimeBytesImplementation.vo \
            runtime-bytes-proof/
          sha256sum \
            runtime-bytes-proof/RuntimeBytes.v \
            runtime-bytes-proof/RuntimeBytes.vo \
            runtime-bytes-proof/RuntimeBytesImplementation.v \
            runtime-bytes-proof/RuntimeBytesImplementation.vo \
            > runtime-bytes-proof/PHIL-P1-IO-BYTES-001.proof.sha256
          cat runtime-bytes-proof/PHIL-P1-IO-BYTES-001.proof.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-runtime-bytes-proof
          path: runtime-bytes-proof
          if-no-files-found: error

  verify-runtime-bytes-correspondence:
    needs: rocq-runtime-bytes-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Strict-typecheck runtime Bytes implementation authority
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Syntax.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Value.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/GrammarV1/CheckedType.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1IOBytesRuntimeSizedMain.hs

      - name: Re-run unchanged IO-BYTES pressure corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1IOBytesRuntimeSizedMain.hs
