name: Phase 1 IO Bytes Production Binding

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/RuntimeBytes.v'
      - 'proof/Phil/Core/RuntimeBytesImplementation.v'
      - 'proof/Phil/Core/RuntimeBytesImplementationExtraction.v'
      - 'src/RuntimeBytesKernel.hs'
      - 'src/Phil/Core/Syntax.hs'
      - 'src/Phil/Core/Value.hs'
      - 'src/Phil/Surface/GrammarV1/CheckedType.hs'
      - 'app/RuntimeBytesDecisionCorrespondenceMain.hs'
      - 'test/Phase1IOBytesRuntimeSizedMain.hs'
      - '.github/workflows/phase1-io-bytes-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/RuntimeBytes.v'
      - 'proof/Phil/Core/RuntimeBytesImplementation.v'
      - 'proof/Phil/Core/RuntimeBytesImplementationExtraction.v'
      - 'src/RuntimeBytesKernel.hs'
      - 'src/Phil/Core/Syntax.hs'
      - 'src/Phil/Core/Value.hs'
      - 'src/Phil/Surface/GrammarV1/CheckedType.hs'
      - 'app/RuntimeBytesDecisionCorrespondenceMain.hs'
      - 'test/Phase1IOBytesRuntimeSizedMain.hs'
      - '.github/workflows/phase1-io-bytes-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-runtime-bytes-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-P1-IO-BYTES-001 proof and fresh extracted kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimeBytes.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimeBytesImplementation.v
          rm -f RuntimeBytesKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/RuntimeBytesImplementationExtraction.v
          test -s RuntimeBytesKernel.hs
          grep -q 'decideBytesCheckByFacts' RuntimeBytesKernel.hs
          grep -q 'decideRuntimeBytesRefinementByFacts' RuntimeBytesKernel.hs

      - name: Verify checked-in production kernel is exact extraction
        shell: bash
        run: |
          set -euo pipefail
          cmp RuntimeBytesKernel.hs src/RuntimeBytesKernel.hs
          printf '%s  %s\n' \
            'c8d05c29a23b66af9fa45b9d2f413d5b2f02ab904e80b04233ca05a49e261430' \
            'RuntimeBytesKernel.hs' | sha256sum --check --strict
          printf '%s  %s\n' \
            'c8d05c29a23b66af9fa45b9d2f413d5b2f02ab904e80b04233ca05a49e261430' \
            'src/RuntimeBytesKernel.hs' | sha256sum --check --strict

      - name: Record checked proof and extraction identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-bytes-proof
          cp \
            proof/Phil/Core/RuntimeBytes.v \
            proof/Phil/Core/RuntimeBytes.vo \
            proof/Phil/Core/RuntimeBytesImplementation.v \
            proof/Phil/Core/RuntimeBytesImplementation.vo \
            proof/Phil/Core/RuntimeBytesImplementationExtraction.v \
            proof/Phil/Core/RuntimeBytesImplementationExtraction.vo \
            RuntimeBytesKernel.hs \
            runtime-bytes-proof/
          sha256sum \
            runtime-bytes-proof/RuntimeBytes.v \
            runtime-bytes-proof/RuntimeBytes.vo \
            runtime-bytes-proof/RuntimeBytesImplementation.v \
            runtime-bytes-proof/RuntimeBytesImplementation.vo \
            runtime-bytes-proof/RuntimeBytesKernel.hs \
            > runtime-bytes-proof/PHIL-P1-IO-BYTES-001.proof.sha256
          cat runtime-bytes-proof/PHIL-P1-IO-BYTES-001.proof.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-runtime-bytes-production-binding
          path: runtime-bytes-proof
          if-no-files-found: error

  verify-runtime-bytes-correspondence:
    needs: rocq-runtime-bytes-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - uses: actions/download-artifact@v4
        with:
          name: rocq-runtime-bytes-production-binding
          path: runtime-bytes-proof

      - name: Verify production kernel identity
        run: |
          set -euo pipefail
          cmp runtime-bytes-proof/RuntimeBytesKernel.hs src/RuntimeBytesKernel.hs
          printf '%s  %s\n' \
            'c8d05c29a23b66af9fa45b9d2f413d5b2f02ab904e80b04233ca05a49e261430' \
            'src/RuntimeBytesKernel.hs' | sha256sum --check --strict
          ghc -Wall -Werror -fno-code src/RuntimeBytesKernel.hs

      - name: Run direct extracted-kernel controls
        run: |
          set -euo pipefail
          runghc -Wall -Werror -isrc app/RuntimeBytesDecisionCorrespondenceMain.hs

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Strict-typecheck runtime Bytes production authority
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Syntax.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Value.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Surface/GrammarV1/CheckedType.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1IOBytesRuntimeSizedMain.hs

      - name: Re-run unchanged IO-BYTES pressure corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1IOBytesRuntimeSizedMain.hs

      - name: Record production-binding identities
        run: |
          set -euo pipefail
          mkdir -p runtime-bytes-production-binding
          sha256sum \
            src/RuntimeBytesKernel.hs \
            src/Phil/Core/Value.hs \
            app/RuntimeBytesDecisionCorrespondenceMain.hs \
            test/Phase1IOBytesRuntimeSizedMain.hs \
            > runtime-bytes-production-binding/PHIL-P1-IO-BYTES-001.production.sha256
          cat runtime-bytes-production-binding/PHIL-P1-IO-BYTES-001.production.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-bytes-production-binding
          path: runtime-bytes-production-binding
          if-no-files-found: error
