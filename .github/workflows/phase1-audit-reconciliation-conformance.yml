name: Phase 1 Audit Reconciliation Conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-reconciliation-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: GEN-013 exact static actual kind elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericStaticKindMain.hs
      - name: SURF-008 Grammar-v1 static kind and reference elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1StaticKindElaborationMain.hs
      - name: SURF-008 Grammar-v1 structural-mode elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1StructuralModeElaborationMain.hs
      - name: GEN-014 generic requirement category fidelity
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericRequirementCategoryMain.hs
      - name: SURF-008 Grammar-v1 generic requirement elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1GenericRequirementElaborationMain.hs
      - name: CALL-017 explicit stricter closure mode
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExplicitClosureModeMain.hs
      - name: CALL-018 outcome classification and residual-obligation fidelity
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CallableOutcomeFidelityMain.hs
      - name: PROT-008 Message admissibility before ownership transfer
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProtocolMessageAdmissibilityMain.hs
      - name: EXEC-014 resource-specific release competence
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExplicitReleaseMain.hs
      - name: EXEC-015 omitted else identity predecessor
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1OmittedElseIdentityMain.hs
      - name: VER-013 prove competence and no assertion fallback
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProveCompetenceMain.hs
      - name: SURF-010 portable persisted lineage competence
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1PortableSourceLineageMain.hs
      - name: SURF-006 exact Grammar-v1 source-bundle revision binding
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarRevisionBindingMain.hs
      - name: DEP-002 RuntimeBound carrier coverage across process/domain transfer
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimeCarrierCoverageMain.hs
