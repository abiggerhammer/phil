name: Phase 1 Audit Reconciliation Conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-reconciliation-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: GEN-013 exact static actual kind elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericStaticKindMain.hs
      - name: SURF-008 Grammar-v1 static kind and reference elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1StaticKindElaborationMain.hs
      - name: SURF-008 Grammar-v1 structural-mode elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1StructuralModeElaborationMain.hs
      - name: SURF-008 Grammar-v1 relation elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1RelationElaborationMain.hs
      - name: SURF-008 Grammar-v1 intrinsic relation leaf elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicRelationElaborationMain.hs
      - name: SURF-008 Grammar-v1 intrinsic proposition composition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicPropositionCompositionMain.hs
      - name: SURF-008 Grammar-v1 logical proposition elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1LogicalPropositionElaborationMain.hs
      - name: SURF-008 Grammar-v1 logical Proof type elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1LogicalProofTypeElaborationMain.hs
      - name: SURF-008 Grammar-v1 intrinsic Proof type composition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicProofTypeCompositionMain.hs
      - name: SURF-008 Grammar-v1 intrinsic type composition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicTypeCompositionMain.hs
      - name: SURF-008 Grammar-v1 intrinsic refinement type elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicRefinementTypeElaborationMain.hs
      - name: SURF-008 Grammar-v1 bare Frame type elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BareFrameTypeElaborationMain.hs
      - name: SURF-008 Grammar-v1 bare named type elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BareNamedTypeElaborationMain.hs
      - name: SURF-008 Grammar-v1 bare Validated type elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BareValidatedTypeElaborationMain.hs
      - name: SURF-008 Grammar-v1 intrinsic claim application elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicClaimApplicationElaborationMain.hs
      - name: SURF-008 Grammar-v1 primitive type elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1PrimitiveTypeElaborationMain.hs
      - name: SURF-008 Grammar-v1 intrinsic reference literal elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicRefLiteralElaborationMain.hs
      - name: SURF-008 Grammar-v1 binding-aware simple reference elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BoundSimpleReferenceElaborationMain.hs
      - name: SURF-008 Grammar-v1 binding-aware refinement expression composition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BoundRefExpressionCompositionMain.hs
      - name: SURF-008 Grammar-v1 binding-aware Bytes type elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1BoundBytesTypeElaborationMain.hs
      - name: SURF-008 Grammar-v1 intrinsic Bytes type elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1IntrinsicBytesTypeElaborationMain.hs
      - name: GEN-014 generic requirement category fidelity
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericRequirementCategoryMain.hs
      - name: SURF-008 Grammar-v1 generic requirement elaboration routing
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1GenericRequirementElaborationMain.hs
      - name: CALL-017 explicit stricter closure mode
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExplicitClosureModeMain.hs
      - name: CALL-018 outcome classification and residual-obligation fidelity
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CallableOutcomeFidelityMain.hs
      - name: PROT-008 Message admissibility before ownership transfer
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProtocolMessageAdmissibilityMain.hs
      - name: EXEC-005/006 immutable bindings and semantic initialization
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExecutionSemanticsMain.hs
      - name: EXEC-009 checked UInt outcome lowering fidelity
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CheckedUIntArithmeticLoweringMain.hs
      - name: EXEC-011 explicit environmental observation boundary
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1EnvironmentObservationMain.hs
      - name: EXEC-012 target-independent UB/poison/trap partiality
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimePartialityMain.hs
      - name: EXEC-013 realization capacity/resource exhaustion disposition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimeCapacityPartialityMain.hs
      - name: EXEC-014 resource-specific release competence
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExplicitReleaseMain.hs
      - name: EXEC-015 omitted else identity predecessor
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1OmittedElseIdentityMain.hs
      - name: EXEC-016 fixed-width signed integer semantics
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExecutionSIntArithmeticMain.hs
      - name: EXEC-017 exact integer division/remainder core
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1IntegerDivisionCoreMain.hs
      - name: EXEC-017 Grammar-v1 integer division/remainder composition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1IntegerDivisionSourceMain.hs
      - name: EXEC-018 strict F32/F64 Core semantic authority and realization gate
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1FloatArithmeticCoreMain.hs
      - name: EXEC-018 Grammar-v1 F32/F64 source composition
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1FloatArithmeticSourceMain.hs
      - name: EXEC-019 numeric proposition competence boundary
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1NumericPropositionCompetenceMain.hs
      - name: EXEC-020 explicit numeric conversions
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1NumericConversionMain.hs
      - name: EXEC-021 exact fixed-width integer shifts
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1IntegerShiftMain.hs
      - name: EXEC-022 Unicode scalar Char semantics
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1UnicodeCharMain.hs
      - name: EXEC-023 immutable semantic String
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1UnicodeStringMain.hs
      - name: EXEC-024 exact runtime Char/String literal elaboration
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1TextLiteralMain.hs
      - name: EXEC-025 explicit UTF-8 text encoding and decoding
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1TextEncodingMain.hs
      - name: EXEC-026 versioned Unicode text algorithms and unit discipline
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1UnicodeTextPolicyMain.hs
      - name: REVIEW-R01 LLVM source-name injectivity
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ReviewR1LLVMNamesMain.hs
      - name: VER-013 prove competence and no assertion fallback
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProveCompetenceMain.hs
      - name: SURF-010 portable persisted lineage competence
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1PortableSourceLineageMain.hs
      - name: SURF-006 exact Grammar-v1 source-bundle revision binding
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarRevisionBindingMain.hs
      - name: DEP-001 exact RuntimeBound carrier binding
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimeCarrierBindingMain.hs
      - name: DEP-002 RuntimeBound carrier coverage across process/domain transfer
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1RuntimeCarrierCoverageMain.hs
      - name: DEP-003–005 deployment qualification, freshness, and topology integrity
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DeploymentQualificationMain.hs
      - name: DEP-006 qualification-gated narrow authority
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DeploymentAuthorityMain.hs
