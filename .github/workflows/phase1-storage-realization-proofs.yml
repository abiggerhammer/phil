name: Phase 1 Storage Realization Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'proof/Phil/Core/ArchitectureRealization.v'
      - 'proof/Phil/Systems/FactDisposition.v'
      - 'proof/Phil/Assurance/ValidityScope.v'
      - 'proof/Phil/Core/SystemsStageClosure.v'
      - 'proof/Phil/Core/SystemsRealizationEffects.v'
      - 'proof/Phil/Core/SystemsSubjectAuthority.v'
      - 'proof/Phil/Core/StorageRealization.v'
      - 'proof/Phil/Core/StorageRealizationImplementation.v'
      - 'proof/Phil/Core/StorageRealizationImplementationExtraction.v'
      - 'src/Phil/Systems/Storage.hs'
      - 'test/Phase1StorageRealizationMain.hs'
      - 'app/StorageRealizationDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/storage-realization-proof-v1.md'
      - 'docs/phase-1/storage-realization-implementation-refinement-v1.md'
      - '.github/workflows/phase1-storage-realization-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'proof/Phil/Core/ArchitectureRealization.v'
      - 'proof/Phil/Systems/FactDisposition.v'
      - 'proof/Phil/Assurance/ValidityScope.v'
      - 'proof/Phil/Core/SystemsStageClosure.v'
      - 'proof/Phil/Core/SystemsRealizationEffects.v'
      - 'proof/Phil/Core/SystemsSubjectAuthority.v'
      - 'proof/Phil/Core/StorageRealization.v'
      - 'proof/Phil/Core/StorageRealizationImplementation.v'
      - 'proof/Phil/Core/StorageRealizationImplementationExtraction.v'
      - 'src/Phil/Systems/Storage.hs'
      - 'test/Phase1StorageRealizationMain.hs'
      - 'app/StorageRealizationDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/storage-realization-proof-v1.md'
      - 'docs/phase-1/storage-realization-implementation-refinement-v1.md'
      - '.github/workflows/phase1-storage-realization-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-storage-realization-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile certified predecessors and PHIL-MEM-REALIZE-001 implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureInstantiation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderReplacementQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureRealization.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsRealizationEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsSubjectAuthority.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageRealization.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageRealizationImplementation.v
          rm -f StorageRealizationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageRealizationImplementationExtraction.v
          test -s StorageRealizationKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage-realization-proof
          cp \
            proof/Phil/Core/StorageRealization.v \
            proof/Phil/Core/StorageRealization.vo \
            proof/Phil/Core/StorageRealizationImplementation.v \
            proof/Phil/Core/StorageRealizationImplementation.vo \
            StorageRealizationKernel.hs \
            storage-realization-proof/
          sha256sum \
            proof/Phil/Core/ArchitectureRealization.v \
            proof/Phil/Core/SystemsSubjectAuthority.v \
            proof/Phil/Core/SystemsRealizationEffects.v \
            proof/Phil/Core/StorageRealization.v \
            proof/Phil/Core/StorageRealization.vo \
            proof/Phil/Core/StorageRealizationImplementation.v \
            proof/Phil/Core/StorageRealizationImplementation.vo \
            StorageRealizationKernel.hs \
            src/Phil/Systems/Storage.hs \
            test/Phase1StorageRealizationMain.hs \
            app/StorageRealizationDecisionCorrespondenceMain.hs \
            > storage-realization-proof/PHIL-MEM-REALIZE-001.implementation.sha256
          {
            echo 'obligation=PHIL-MEM-REALIZE-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat storage-realization-proof/PHIL-MEM-REALIZE-001.implementation.sha256
          } > storage-realization-proof/PHIL-MEM-REALIZE-001.implementation-certificate.txt
          cat storage-realization-proof/PHIL-MEM-REALIZE-001.implementation-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-storage-realization-proof
          path: storage-realization-proof
          if-no-files-found: error

  verify-storage-realization-correspondence:
    needs: rocq-storage-realization-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-storage-realization-proof
          path: storage-realization-proof
      - name: Check and execute extracted Storage Realization controls
        run: |
          set -euo pipefail
          cp storage-realization-proof/StorageRealizationKernel.hs .
          cabal exec -- ghc -i. -Wall -Werror -Wno-unused-imports -fno-code \
            StorageRealizationKernel.hs \
            app/StorageRealizationDecisionCorrespondenceMain.hs
          cabal exec -- runghc -i. -Wall -Werror -Wno-unused-imports \
            app/StorageRealizationDecisionCorrespondenceMain.hs
      - name: Strict typecheck unchanged storage realization implementation and corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/Storage.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1StorageRealizationMain.hs
      - name: Re-run unchanged MEM-001--006 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1StorageRealizationMain.hs
