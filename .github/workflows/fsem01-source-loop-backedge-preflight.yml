name: FSEM-01 Source Bool Loop Backedge Early Preflight

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - formal-semantics/fsem01-source-loop-backedge-bool
  pull_request:
    paths:
      - 'src/Phil/Surface/Check/Engine.hs'
      - 'src/Phil/Surface/GrammarV1/SourceBoolLoopResource.hs'
      - 'test/Phase1FSEM01SourceBoolLoopMain.hs'
      - 'test/fixtures/fsem01-source-bool-loop-v1/**'
      - 'proof/Phil/Surface/SurfaceSourceBoolLoopBackedge.v'
      - 'docs/phase-1/formal-semantics-source-bool-loop-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-source-loop-backedge-preflight.yml'

permissions:
  contents: read

jobs:
  source-loop-haskell:
    name: Strict checked loop source entry/header/backedge and error prefixes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Update Hackage with bounded HTTP1 retry
        shell: bash
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Strict production library build
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
      - name: Existing source grammar, join, loan and loop controls
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            Phase1GrammarV1JoinLoopMain \
            Phase1LoopStateProjectionMain \
            Phase1ScopedLoanBoundaryMain \
            Phase1FSEM01SourceBranchJoinMain \
            Phase1FSEM01BoolJoinTelescopeMain \
            Phase1FSEM01TwoBoolJoinTelescopeMain \
            Phase1FSEM01SourceBoolLoopMain
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
          sha256sum src/Phil/Surface/GrammarV1/SourceBoolLoopResource.hs \
            src/Phil/Surface/Check/Engine.hs \
            test/Phase1FSEM01SourceBoolLoopMain.hs

  source-loop-rocq:
    name: Rocq Bool loop entry/backedge linear frame and closed loans
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile conditional source backedge model without admissions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Surface/SurfaceSourceBoolJoinTelescope.v \
            proof/Phil/Surface/SurfaceSourceBoolLoopBackedge.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceSourceBoolLoopBackedge.v; then
            echo "Unproved FSEM-01 L-1 loop theorem" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceSourceBoolLoopBackedge.v \
            proof/Phil/Surface/SurfaceSourceBoolLoopBackedge.vo
