name: Phase 1 Data Sum Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/DataSum.v'
      - 'docs/phase-1/data-sum-proof-v1.md'
      - '.github/workflows/phase1-data-sum-proofs.yml'
      - 'proof/Phil/Core/DataMode.v'
      - 'proof/Phil/Core/DataElimination.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'src/Phil/Core/DataMode.hs'
      - 'src/Phil/Core/Context.hs'
      - 'test/Phase1ConservativeSumModeMain.hs'
      - 'test/Phase1ConsumingSumMatchMain.hs'
      - 'test/Phase1SumArmLinearLeakMain.hs'
      - 'test/Phase1ExplicitBranchResourceSumMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/DataSum.v'
      - 'docs/phase-1/data-sum-proof-v1.md'
      - '.github/workflows/phase1-data-sum-proofs.yml'
      - 'proof/Phil/Core/DataMode.v'
      - 'proof/Phil/Core/DataElimination.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'src/Phil/Core/DataMode.hs'
      - 'src/Phil/Core/Context.hs'
      - 'test/Phase1ConservativeSumModeMain.hs'
      - 'test/Phase1ConsumingSumMatchMain.hs'
      - 'test/Phase1SumArmLinearLeakMain.hs'
      - 'test/Phase1ExplicitBranchResourceSumMain.hs'

permissions:
  contents: read

jobs:
  rocq-data-sum-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-DATA-SUM-001 proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataElimination.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataSum.v
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data-sum-proof
          cp proof/Phil/Core/DataSum.v proof/Phil/Core/DataSum.vo data-sum-proof/
          sha256sum \
            proof/Phil/Core/DataSum.v \
            proof/Phil/Core/DataSum.vo \
            > data-sum-proof/PHIL-DATA-SUM-001.proof.sha256
          {
            echo 'obligation=PHIL-DATA-SUM-001'
            echo 'evidence=Rocq-9.2.0'
            cat data-sum-proof/PHIL-DATA-SUM-001.proof.sha256
          } > data-sum-proof/PHIL-DATA-SUM-001.proof-certificate.txt
          cat data-sum-proof/PHIL-DATA-SUM-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-data-sum-proof
          path: data-sum-proof
          if-no-files-found: error

  verify-data-sum-correspondence:
    needs: rocq-data-sum-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - name: Typecheck unchanged DATA-007/008/013 paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/DataMode.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Context.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1ConservativeSumModeMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1ConsumingSumMatchMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1SumArmLinearLeakMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1ExplicitBranchResourceSumMain.hs
      - name: Re-run resource-bearing sum correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConservativeSumModeMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConsumingSumMatchMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1SumArmLinearLeakMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExplicitBranchResourceSumMain.hs
