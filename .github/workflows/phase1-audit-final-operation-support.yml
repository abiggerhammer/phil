name: Phase 1 Audit Final Operation Support

on:
  pull_request:
    paths:
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'test/Phase1AuditFinalOperationSupportMain.hs'
      - 'docs/phase-1/audit-final-operation-support-remediation-v1.md'
      - '.github/workflows/phase1-audit-final-operation-support.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Verification/ManifestClosure.hs'
      - 'test/Phase1AuditFinalOperationSupportMain.hs'
      - 'docs/phase-1/audit-final-operation-support-remediation-v1.md'
      - '.github/workflows/phase1-audit-final-operation-support.yml'

permissions:
  contents: read

jobs:
  final-operation-support-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck final operation support repair
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Verification/ManifestClosure.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1AuditFinalOperationSupportMain.hs

      - name: Replay final operation support closure controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1AuditFinalOperationSupportMain.hs
