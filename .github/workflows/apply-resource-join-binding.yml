name: Apply Resource Join Binding

on:
  push:
    branches: [bind-resource-join-decisions]
    paths:
      - '.github/workflows/apply-resource-join-binding.yml'

permissions:
  contents: write

jobs:
  apply-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bind-resource-join-decisions
      - name: Apply guarded production patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Phil/Systems/ControlStateProjection.hs')
          text = path.read_text()

          old_import = 'import qualified SystemsControlPreservationKernel as Kernel\n'
          new_import = ('import qualified ResourceJoinKernel as ResourceJoinKernel\n'
                        'import qualified SystemsControlPreservationKernel as Kernel\n')
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          old_join = '  checkRestrictedMultiplicity\n  checkLinearCoverage\n  where\n'
          new_join = '  checkRestrictedMultiplicity\n  checkLinearCoverage\n  checkResourceJoinKernel\n  where\n'
          assert text.count(old_join) == 1
          text = text.replace(old_join, new_join, 1)

          marker = '\ncheckClosureCaptureProjection\n'
          assert text.count(marker) == 1
          helper = r'''
              checkResourceJoinKernel =
                case ResourceJoinKernel.decideResourceProjectionByFacts
                    allIncomingLinearExactlyOnceBound
                    noInventedLinearOwners
                    allBoundLinearSubjectsAdmissible of
                  ResourceJoinKernel.ResourceProjectionAcceptedDecision -> Right ()
                  _ -> kernelInvariant "resource-join"
                where
                  bindingCounts = Map.fromListWith (+)
                    [ (ref, 1 :: Int)
                    | ref <- Map.elems (stateProjectionBindings projection)
                    ]
                  incomingLinear = Set.fromList
                    [ ref
                    | (ref, mode) <- Map.toAscList
                        (stateProjectionIncomingRestricted projection)
                    , mode == Linear
                    ]
                  linearBindings =
                    [ (slotKey, ref)
                    | (slotKey, ref) <- Map.toAscList
                        (stateProjectionBindings projection)
                    , Just slot <- [Map.lookup slotKey (stateBoundarySlots boundary)]
                    , stateSlotMode slot == Linear
                    ]
                  allIncomingLinearExactlyOnceBound = all
                    (\ref -> Map.findWithDefault 0 ref bindingCounts == 1)
                    (Set.toList incomingLinear)
                  noInventedLinearOwners = all
                    (\(_, ref) ->
                      Map.lookup ref (stateProjectionIncomingRestricted projection)
                        == Just Linear)
                    linearBindings
                  allBoundLinearSubjectsAdmissible = all subjectAdmissible linearBindings
                  subjectAdmissible (slotKey, ref) =
                    case Map.lookup slotKey (stateBoundarySlots boundary) of
                      Nothing -> False
                      Just slot -> case stateSlotSubjectRequirement slot of
                        AnyStateSubject -> True
                        FixedStateSubject subject ->
                          maybe False (Set.member ref) (Map.lookup subject subjectIndex)
          '''
          helper = '\n'.join(line[4:] if line.startswith('    ') else line
                             for line in helper.splitlines()) + '\n'
          text = text.replace(marker, '\n' + helper + 'checkClosureCaptureProjection\n', 1)
          path.write_text(text)

          cabal = Path('phil-core.cabal')
          ctext = cabal.read_text()
          old_module = '      SystemsIdentityKernel\n'
          new_module = '      SystemsIdentityKernel\n      ResourceJoinKernel\n'
          assert ctext.count(old_module) == 1
          ctext = ctext.replace(old_module, new_module, 1)
          cabal.write_text(ctext)
          PY
          rm .github/workflows/apply-resource-join-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Systems/ControlStateProjection.hs phil-core.cabal .github/workflows/apply-resource-join-binding.yml
          git commit -m 'Bind Resource Join acceptance to certified kernel'
          git push origin HEAD:bind-resource-join-decisions
