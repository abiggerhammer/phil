name: Phase 1 Surface Determinacy Witness Soundness

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDerivation.v'
      - 'proof/Phil/Surface/GrammarDerivationLookahead.v'
      - 'proof/Phil/Surface/GrammarDerivationOracle.v'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificate.v'
      - 'proof/Phil/Surface/GrammarDeterminacyNullableFirst.v'
      - 'proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v'
      - 'proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v'
      - 'proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v'
      - 'proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v'
      - 'proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v'
      - 'docs/phase-1/surface-determinacy-witness-soundness-v1.md'
      - '.github/workflows/phase1-surface-determinacy-witness-soundness.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDerivation.v'
      - 'proof/Phil/Surface/GrammarDerivationLookahead.v'
      - 'proof/Phil/Surface/GrammarDerivationOracle.v'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificate.v'
      - 'proof/Phil/Surface/GrammarDeterminacyNullableFirst.v'
      - 'proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v'
      - 'proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v'
      - 'proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v'
      - 'proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v'
      - 'docs/phase-1/surface-determinacy-witness-soundness-v1.md'
      - '.github/workflows/phase1-surface-determinacy-witness-soundness.yml'

permissions:
  contents: read

jobs:
  rocq-witness-soundness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check
      - name: Apply diagnostic first-definedness split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v')
          source = path.read_text()
          start = source.index('Lemma choice_safe_first_defined :')
          end = source.index('\nDefinition NullableWitnessFuelProperty', start)
          new = '''Lemma choice_safe_first_optional_safety_equation :
            forall fuel body,
              choice_bodies_nonnullable_fuel (S fuel) (EOptional body) =
              andb
                (negb (nullable_expression phase1_surface_nullable_facts body))
                (choice_bodies_nonnullable_fuel fuel body).
          Proof.
            reflexivity.
          Qed.

          Lemma choice_safe_first_repetition_safety_equation :
            forall fuel body,
              choice_bodies_nonnullable_fuel (S fuel) (ERepetition body) =
              andb
                (negb (nullable_expression phase1_surface_nullable_facts body))
                (choice_bodies_nonnullable_fuel fuel body).
          Proof.
            reflexivity.
          Qed.

          Lemma first_expression_optional_fuel_equation :
            forall fuel body,
              first_expression_fuel
                (S fuel)
                phase1_surface_nullable_facts
                phase1_surface_first_facts
                (EOptional body) =
              first_expression_fuel
                fuel
                phase1_surface_nullable_facts
                phase1_surface_first_facts
                body.
          Proof.
            reflexivity.
          Qed.

          Lemma first_expression_repetition_fuel_equation :
            forall fuel body,
              first_expression_fuel
                (S fuel)
                phase1_surface_nullable_facts
                phase1_surface_first_facts
                (ERepetition body) =
              first_expression_fuel
                fuel
                phase1_surface_nullable_facts
                phase1_surface_first_facts
                body.
          Proof.
            reflexivity.
          Qed.

          Lemma choice_safe_first_optional_defined :
            forall fuel body,
              (forall expression,
                choice_bodies_nonnullable_fuel fuel expression = true ->
                exists tokens,
                  first_expression_fuel
                    fuel
                    phase1_surface_nullable_facts
                    phase1_surface_first_facts
                    expression = Some tokens) ->
              choice_bodies_nonnullable_fuel (S fuel) (EOptional body) = true ->
              exists tokens,
                first_expression_fuel
                  (S fuel)
                  phase1_surface_nullable_facts
                  phase1_surface_first_facts
                  (EOptional body) = Some tokens.
          Proof.
            intros fuel body IH Hsafe.
            rewrite choice_safe_first_optional_safety_equation in Hsafe.
            apply andb_true_iff in Hsafe as [_ Hbody_safe].
            destruct (IH body Hbody_safe) as [tokens Htokens].
            exists tokens.
            rewrite first_expression_optional_fuel_equation.
            exact Htokens.
          Qed.

          Lemma choice_safe_first_repetition_defined :
            forall fuel body,
              (forall expression,
                choice_bodies_nonnullable_fuel fuel expression = true ->
                exists tokens,
                  first_expression_fuel
                    fuel
                    phase1_surface_nullable_facts
                    phase1_surface_first_facts
                    expression = Some tokens) ->
              choice_bodies_nonnullable_fuel (S fuel) (ERepetition body) = true ->
              exists tokens,
                first_expression_fuel
                  (S fuel)
                  phase1_surface_nullable_facts
                  phase1_surface_first_facts
                  (ERepetition body) = Some tokens.
          Proof.
            intros fuel body IH Hsafe.
            rewrite choice_safe_first_repetition_safety_equation in Hsafe.
            apply andb_true_iff in Hsafe as [_ Hbody_safe].
            destruct (IH body Hbody_safe) as [tokens Htokens].
            exists tokens.
            rewrite first_expression_repetition_fuel_equation.
            exact Htokens.
          Qed.

          Lemma choice_safe_first_defined_step :
            forall fuel,
              (forall expression,
                choice_bodies_nonnullable_fuel fuel expression = true ->
                exists tokens,
                  first_expression_fuel
                    fuel
                    phase1_surface_nullable_facts
                    phase1_surface_first_facts
                    expression = Some tokens) ->
              forall expression,
                choice_bodies_nonnullable_fuel (S fuel) expression = true ->
                exists tokens,
                  first_expression_fuel
                    (S fuel)
                    phase1_surface_nullable_facts
                    phase1_surface_first_facts
                    expression = Some tokens.
          Proof.
            intros fuel IH expression Hsafe.
            destruct expression as
              [literal | class_name | name | items | items | body | body].
            - abstract (simpl; eexists; reflexivity).
            - abstract (simpl; eexists; reflexivity).
            - abstract (simpl; eexists; reflexivity).
            - abstract (
                simpl in Hsafe;
                exact (choice_safe_first_sequence_defined fuel items IH Hsafe)).
            - abstract (
                simpl in Hsafe;
                exact (choice_safe_first_alternative_defined fuel items IH Hsafe)).
            - exact (choice_safe_first_optional_defined fuel body IH Hsafe).
            - exact (choice_safe_first_repetition_defined fuel body IH Hsafe).
          Qed.

          Lemma choice_safe_first_defined :
            forall fuel expression,
              choice_bodies_nonnullable_fuel fuel expression = true ->
              exists tokens,
                first_expression_fuel
                  fuel
                  phase1_surface_nullable_facts
                  phase1_surface_first_facts
                  expression = Some tokens.
          Proof.
            induction fuel as [| fuel IH].
            - intros expression Hsafe.
              simpl in Hsafe. discriminate.
            - intros expression Hsafe.
              exact (choice_safe_first_defined_step fuel IH expression Hsafe).
          Qed.
          '''
          path.write_text(source[:start] + new + source[end:])
          PY
      - name: Apply diagnostic nullable-witness case split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v')
          source = path.read_text()
          start = source.index('Theorem phase1_surface_nullable_witness_fuel_sound :')
          end = source.index('\nCorollary phase1_surface_nullable_witness_matches_computed_facts', start)
          new = '''Lemma nullable_witness_nonterminal_fuel_case :
            forall name body,
              lookupRule name phase1_surface_rules = Some body ->
              NullableWitness phase1_surface_rules body ->
              NullableWitnessFuelProperty body ->
              NullableWitnessFuelProperty (ENonterminal name).
          Proof.
            intros name body Hlookup Hbody IHbody.
            unfold NullableWitnessFuelProperty in *.
            intros fuel Hfuel Hsafe.
            destruct fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - assert (Hbody_safe :
                choice_bodies_nonnullable_fuel expression_fuel body = true).
              { eapply phase1_surface_rule_body_choice_safe. exact Hlookup. }
              specialize (IHbody expression_fuel (Nat.le_refl _) Hbody_safe).
              pose proof (phase1_surface_nullable_lookup_rule name body Hlookup)
                as Hlookup_fact.
              unfold nullable_expression in Hlookup_fact.
              rewrite IHbody in Hlookup_fact.
              simpl in Hlookup_fact.
              simpl. rewrite Hlookup_fact. reflexivity.
          Qed.

          Lemma nullable_witness_sequence_fuel_case :
            forall items,
              NullableSequenceWitness phase1_surface_rules items ->
              NullableSequenceFuelProperty items ->
              NullableWitnessFuelProperty (ESequence items).
          Proof.
            intros items Hitems IHitems.
            unfold NullableWitnessFuelProperty, NullableSequenceFuelProperty in *.
            intros fuel Hfuel Hsafe.
            destruct fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - simpl in Hsafe.
              exact (IHitems fuel Hfuel Hsafe).
          Qed.

          Lemma nullable_witness_alternative_fuel_case :
            forall items,
              NullableAlternativeWitness phase1_surface_rules items ->
              NullableAlternativeFuelProperty items ->
              NullableWitnessFuelProperty (EAlternative items).
          Proof.
            intros items Hitems IHitems.
            unfold NullableWitnessFuelProperty, NullableAlternativeFuelProperty in *.
            intros fuel Hfuel Hsafe.
            destruct fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - simpl in Hsafe.
              exact (IHitems fuel Hfuel Hsafe).
          Qed.

          Lemma nullable_witness_optional_fuel_case :
            forall body,
              NullableWitnessFuelProperty (EOptional body).
          Proof.
            intros body.
            unfold NullableWitnessFuelProperty.
            intros fuel Hfuel Hsafe.
            destruct fuel; simpl in *; try discriminate; reflexivity.
          Qed.

          Lemma nullable_witness_repetition_fuel_case :
            forall body,
              NullableWitnessFuelProperty (ERepetition body).
          Proof.
            intros body.
            unfold NullableWitnessFuelProperty.
            intros fuel Hfuel Hsafe.
            destruct fuel; simpl in *; try discriminate; reflexivity.
          Qed.

          Lemma nullable_sequence_nil_fuel_case :
            NullableSequenceFuelProperty [].
          Proof.
            unfold NullableSequenceFuelProperty.
            intros fuel Hfuel Hsafe.
            reflexivity.
          Qed.

          Lemma nullable_sequence_cons_fuel_case :
            forall item rest,
              NullableWitness phase1_surface_rules item ->
              NullableWitnessFuelProperty item ->
              NullableSequenceWitness phase1_surface_rules rest ->
              NullableSequenceFuelProperty rest ->
              NullableSequenceFuelProperty (item :: rest).
          Proof.
            intros item rest Hitem IHitem Hrest IHrest.
            unfold NullableSequenceFuelProperty in *.
            intros fuel Hfuel Hsafe.
            simpl in Hsafe.
            apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
            assert (Hfuel_item : fuel <= expression_fuel) by lia.
            specialize (IHitem fuel Hfuel_item Hitem_safe).
            specialize (IHrest fuel Hfuel Hrest_safe).
            simpl in IHrest.
            simpl.
            rewrite IHitem, IHrest.
            reflexivity.
          Qed.

          Lemma nullable_alternative_here_fuel_case :
            forall item rest,
              NullableWitness phase1_surface_rules item ->
              NullableWitnessFuelProperty item ->
              NullableAlternativeFuelProperty (item :: rest).
          Proof.
            intros item rest Hitem IHitem.
            unfold NullableAlternativeFuelProperty in *.
            intros fuel Hfuel Hsafe.
            simpl in Hsafe.
            apply andb_true_iff in Hsafe as [Hhead_safe Hrest_safe].
            apply andb_true_iff in Hhead_safe as [_ Hitem_safe].
            assert (Hfuel_item : fuel <= expression_fuel) by lia.
            specialize (IHitem fuel Hfuel_item Hitem_safe).
            assert (Hrest_expr_safe :
              choice_bodies_nonnullable_fuel
                (S fuel) (EAlternative rest) = true).
            { simpl. exact Hrest_safe. }
            destruct (choice_safe_nullable_defined
              (S fuel) (EAlternative rest) Hrest_expr_safe)
              as [rest_value Hrest_value].
            simpl in Hrest_value.
            simpl.
            rewrite IHitem, Hrest_value.
            reflexivity.
          Qed.

          Lemma nullable_alternative_later_fuel_case :
            forall item rest,
              NullableAlternativeWitness phase1_surface_rules rest ->
              NullableAlternativeFuelProperty rest ->
              NullableAlternativeFuelProperty (item :: rest).
          Proof.
            intros item rest Hrest IHrest.
            unfold NullableAlternativeFuelProperty in *.
            intros fuel Hfuel Hsafe.
            simpl in Hsafe.
            apply andb_true_iff in Hsafe as [Hhead_safe Hrest_safe].
            apply andb_true_iff in Hhead_safe as [_ Hitem_safe].
            destruct (choice_safe_nullable_defined fuel item Hitem_safe)
              as [item_value Hitem_value].
            specialize (IHrest fuel Hfuel Hrest_safe).
            simpl in IHrest.
            simpl.
            rewrite Hitem_value, IHrest.
            destruct item_value; reflexivity.
          Qed.

          Theorem phase1_surface_nullable_witness_fuel_sound :
            (forall expression,
              NullableWitness phase1_surface_rules expression ->
              NullableWitnessFuelProperty expression) /\\
            (forall items,
              NullableSequenceWitness phase1_surface_rules items ->
              NullableSequenceFuelProperty items) /\\
            (forall items,
              NullableAlternativeWitness phase1_surface_rules items ->
              NullableAlternativeFuelProperty items).
          Proof.
            apply NullableWitness_mutind.
            - exact nullable_witness_nonterminal_fuel_case.
            - exact nullable_witness_sequence_fuel_case.
            - exact nullable_witness_alternative_fuel_case.
            - exact nullable_witness_optional_fuel_case.
            - exact nullable_witness_repetition_fuel_case.
            - exact nullable_sequence_nil_fuel_case.
            - exact nullable_sequence_cons_fuel_case.
            - exact nullable_alternative_here_fuel_case.
            - exact nullable_alternative_later_fuel_case.
          Qed.
          '''
          path.write_text(source[:start] + new + source[end:])
          PY
      - name: Compile nullable/FIRST witness soundness bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          compile() {
            file="$1"
            echo "=== compiling ${file} at $(date -u +%FT%TZ) ==="
            rocq c -Q proof/Phil Phil "${file}"
            echo "=== finished ${file} at $(date -u +%FT%TZ) ==="
          }
          compile proof/Phil/Surface/Grammar.v
          compile proof/Phil/Surface/GrammarDerivation.v
          compile proof/Phil/Surface/GrammarDerivationOracle.v
          compile proof/Phil/Surface/GrammarDeterminacyCertificate.v
          compile proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          compile proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          compile proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          compile proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          compile proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          compile proof/Phil/Surface/GrammarDerivationLookahead.v
          echo "=== timing GrammarDeterminacyWitnessSoundness.v at $(date -u +%FT%TZ) ==="
          timeout 300s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
          echo "=== finished GrammarDeterminacyWitnessSoundness.v at $(date -u +%FT%TZ) ==="
      - name: Record witness-soundness proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-determinacy-witness-soundness
          cp \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDerivation.v \
            proof/Phil/Surface/GrammarDerivationLookahead.v \
            proof/Phil/Surface/GrammarDerivationOracle.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDeterminacyNullableFirst.v \
            proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v \
            proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v \
            proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v \
            proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.vo \
            surface-determinacy-witness-soundness/
          sha256sum \
            grammar/phase1-surface.ebnf \
            scripts/derive_phase1_surface_grammar.py \
            scripts/check_phase1_surface_determinacy.py \
            scripts/derive_phase1_surface_determinacy_certificate.py \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDerivation.v \
            proof/Phil/Surface/GrammarDerivationLookahead.v \
            proof/Phil/Surface/GrammarDerivationOracle.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDeterminacyNullableFirst.v \
            proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v \
            proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v \
            proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v \
            proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.vo \
            > surface-determinacy-witness-soundness/identities.sha256
          cat surface-determinacy-witness-soundness/identities.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-determinacy-witness-soundness
          path: surface-determinacy-witness-soundness
          if-no-files-found: error
