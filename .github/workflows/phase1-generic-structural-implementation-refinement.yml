name: Phase 1 Generic Structural Implementation Refinement

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/GenericStructuralImplementation.v'
      - 'proof/Phil/Core/GenericStructuralImplementationExtraction.v'
      - 'docs/phase-1/generic-structural-implementation-refinement-v1.md'
      - 'src/GenericStructuralKernel.hs'
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1GenericStructuralMain.hs'
      - 'test/Phase1GenericRequirementsMain.hs'
      - '.github/workflows/phase1-generic-structural-implementation-refinement.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/GenericStructuralImplementation.v'
      - 'proof/Phil/Core/GenericStructuralImplementationExtraction.v'
      - 'docs/phase-1/generic-structural-implementation-refinement-v1.md'
      - 'src/GenericStructuralKernel.hs'
      - 'src/Phil/Core/Generic.hs'
      - 'test/Phase1GenericStructuralMain.hs'
      - 'test/Phase1GenericRequirementsMain.hs'
      - '.github/workflows/phase1-generic-structural-implementation-refinement.yml'

permissions:
  contents: read

jobs:
  rocq-generic-structural-implementation-refinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile certified GEN-001-003 model and executable decision
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructuralImplementation.v
      - name: Regenerate and bind generic structural kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f GenericStructuralKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructuralImplementationExtraction.v
          test -s GenericStructuralKernel.hs
          grep -q '^module GenericStructuralKernel where' GenericStructuralKernel.hs
          grep -q '^addStructuralUse ::' GenericStructuralKernel.hs
          grep -q '^inferGenericStructuralRequirements ::' GenericStructuralKernel.hs
          grep -q '^modeAllowsStructuralPermission ::' GenericStructuralKernel.hs
          grep -q '^modeSatisfiesRequirements ::' GenericStructuralKernel.hs
          grep -q '^decideGenericStructuralActual ::' GenericStructuralKernel.hs
          if ! cmp -s GenericStructuralKernel.hs src/GenericStructuralKernel.hs; then
            echo 'checked-in generic structural kernel differs from fresh Rocq extraction' >&2
            diff -u src/GenericStructuralKernel.hs GenericStructuralKernel.hs || true
            exit 1
          fi
          sha256sum GenericStructuralKernel.hs src/GenericStructuralKernel.hs
          mkdir -p generic-structural-implementation-refinement-proof
          cp \
            proof/Phil/Core/GenericStructural.v \
            proof/Phil/Core/GenericStructural.vo \
            proof/Phil/Core/GenericStructuralImplementation.v \
            proof/Phil/Core/GenericStructuralImplementation.vo \
            proof/Phil/Core/GenericStructuralImplementationExtraction.v \
            GenericStructuralKernel.hs \
            generic-structural-implementation-refinement-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-generic-structural-implementation-refinement
          path: generic-structural-implementation-refinement-proof
          if-no-files-found: error

  verify-generic-structural-correspondence:
    needs: rocq-generic-structural-implementation-refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-generic-structural-implementation-refinement
          path: generic-structural-implementation-refinement-proof
      - name: Typecheck extracted, checked-in, and production GEN-001-003 paths
        run: |
          set -euo pipefail
          cmp -s \
            generic-structural-implementation-refinement-proof/GenericStructuralKernel.hs \
            src/GenericStructuralKernel.hs
          ghc -Wall -Werror -fno-code src/GenericStructuralKernel.hs
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Core/Generic.hs \
            test/Phase1GenericStructuralMain.hs \
            test/Phase1GenericRequirementsMain.hs
      - name: Exercise production structural path through extracted kernel
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1GenericStructuralMain.hs
          cabal exec -- runghc -isrc test/Phase1GenericRequirementsMain.hs
