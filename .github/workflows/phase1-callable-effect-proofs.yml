name: Phase 1 Callable Effect Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Core/Callable.hs'
      - 'test/Phase1CallableCaptureEffectsMain.hs'
      - 'test/Phase1CallableEffectBoundMain.hs'
      - 'docs/phase-1/callable-capture-effects-v1.md'
      - 'docs/phase-1/callable-effect-bound-v1.md'
      - 'proof/Phil/Core/CallableEffects.v'
      - 'app/Phase1CallableEffectCertificationMain.hs'
      - '.github/workflows/phase1-callable-effect-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/Callable.hs'
      - 'test/Phase1CallableCaptureEffectsMain.hs'
      - 'test/Phase1CallableEffectBoundMain.hs'
      - 'docs/phase-1/callable-capture-effects-v1.md'
      - 'docs/phase-1/callable-effect-bound-v1.md'
      - 'proof/Phil/Core/CallableEffects.v'
      - 'app/Phase1CallableEffectCertificationMain.hs'
      - '.github/workflows/phase1-callable-effect-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-callable-effect:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-CALL-EFFECT-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableEffects.v
          mkdir -p phase1-callable-effect-proof
          cp proof/Phil/Core/CallableEffects.v proof/Phil/Core/CallableEffects.vo phase1-callable-effect-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-callable-effect-proof
          path: phase1-callable-effect-proof
          if-no-files-found: error

  certify-phase1-callable-effect:
    needs: rocq-phase1-callable-effect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - name: Typecheck certifier
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code app/Phase1CallableEffectCertificationMain.hs
      - name: Re-run CALL-004 and CALL-005 correspondence
        run: cabal exec -- runghc -isrc test/Phase1CallableCaptureEffectsMain.hs
      - name: Re-run CALL-011 correspondence
        run: cabal exec -- runghc -isrc test/Phase1CallableEffectBoundMain.hs
      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-callable-effect-proof
          path: phase1-callable-effect-proof
      - name: Emit PHIL-CALL-EFFECT-001 certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-callable-effect-certification
          cabal exec -- runghc -isrc app/Phase1CallableEffectCertificationMain.hs \
            phase1-callable-effect-proof/CallableEffects.v \
            phase1-callable-effect-proof/CallableEffects.vo \
            phase1-callable-effect-certification/PHIL-CALL-EFFECT-001.rocq.cert
          sha256sum \
            src/Phil/Core/Callable.hs \
            test/Phase1CallableCaptureEffectsMain.hs \
            test/Phase1CallableEffectBoundMain.hs \
            docs/phase-1/callable-capture-effects-v1.md \
            docs/phase-1/callable-effect-bound-v1.md \
            proof/Phil/Core/CallableEffects.v \
            app/Phase1CallableEffectCertificationMain.hs \
            > phase1-callable-effect-certification/PHIL-CALL-EFFECT-001.correspondence.sha256
          cat phase1-callable-effect-certification/PHIL-CALL-EFFECT-001.rocq.cert
          sha256sum phase1-callable-effect-certification/PHIL-CALL-EFFECT-001.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-callable-effect-proof-certification
          path: phase1-callable-effect-certification
          if-no-files-found: error
