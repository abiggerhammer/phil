name: FSEM-06 SteveGet Selected Core Payload Refinement

on:
  push:
    branches:
      - formal-semantics/fsem06-steveget-core-payload-refinement
    paths:
      - 'src/Phil/Compiler/SelectedSteveGetCoreExecution.hs'
      - 'phil-core.cabal'
      - 'proof/Phil/Verification/FSEM06SteveGetSelectedCorePayloadRefinement.v'
      - 'test/FSEM06SteveGetSelectedCorePayloadMain.hs'
      - 'docs/phase-1/fsem06-steveget-core-payload-execution-v1.md'
      - '.github/workflows/fsem06-steveget-core-payload-refinement.yml'
      - 'scripts/ci/steveget_scope_routing.py'
      - 'scripts/ci/test_steveget_scope_routing.py'
  pull_request:
    paths:
      - 'src/Phil/Compiler/SelectedSteveGetCoreExecution.hs'
      - 'phil-core.cabal'
      - 'proof/Phil/Verification/FSEM06SteveGetSelectedCorePayloadRefinement.v'
      - 'test/FSEM06SteveGetSelectedCorePayloadMain.hs'
      - 'docs/phase-1/fsem06-steveget-core-payload-execution-v1.md'
      - '.github/workflows/fsem06-steveget-core-payload-refinement.yml'
      - 'scripts/ci/steveget_scope_routing.py'
      - 'scripts/ci/test_steveget_scope_routing.py'

concurrency:
  group: fsem06-selected-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selected-rocq:
    name: Rocq 9.2 selected exact native selector and labelled fixed-E lifting
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile accepted source and selected theorem; extract static and dynamic checkers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          upstream=proof/Phil/Verification/FSEM05SteveGetSelectedSourceEvents.v
          proof=proof/Phil/Verification/FSEM06SteveGetSelectedCorePayloadRefinement.v
          rocq c -Q proof/Phil Phil "$upstream"
          rocq c -Q proof/Phil Phil "$proof" | tee /tmp/fsem06-assumptions.log
          test "$(grep -c '^Closed under the global context' /tmp/fsem06-assumptions.log)" -eq 32
          if grep -Eq '^Axioms:' /tmp/fsem06-assumptions.log; then exit 1; fi
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' "$proof"; then
            echo "unexpected new admission" >&2
            exit 1
          fi
          rocq check -Q proof/Phil Phil Phil.Verification.FSEM05SteveGetSelectedSourceEvents Phil.Verification.FSEM06SteveGetSelectedCorePayloadRefinement
          sha256sum "$upstream" "$proof" proof/Phil/Verification/FSEM06SteveGetSelectedCorePayloadRefinement.vo /tmp/fsem06-assumptions.log
          test "$(git hash-object examples/steve/get.phil)" = 8de9853762201b516d7c05bfd5568e54acbd7dc8
          test -f FSEM06SteveGetNativeKernel.hs
          mkdir -p /tmp/fsem06-extracted
          cp FSEM06SteveGetNativeKernel.hs /tmp/fsem06-extracted/
          (cd /tmp/fsem06-extracted && sha256sum FSEM06SteveGetNativeKernel.hs > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fsem06-checked-extracted-selector
          path: /tmp/fsem06-extracted
          if-no-files-found: error

  strict-actual-core:
    name: GHC 9.6.7 actual source Core typed-plan and opaque-origin adversarial checks
    needs: selected-rocq
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - uses: actions/download-artifact@v4
        with:
          name: fsem06-checked-extracted-selector
          path: /tmp/fsem06-extracted
      - name: Strict unsuppressed actual-object build and adversarial execution
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/fsem06-extracted && sha256sum -c SHA256SUMS)
          bash scripts/ci/cabal-update-retry.sh
          cabal build lib:phil-core --ghc-options='-Werror'
          cabal exec -- ghc --make -Wall -Werror -isrc -itest -i/tmp/fsem06-extracted \
            -outputdir /tmp/fsem06-ghc test/FSEM06SteveGetSelectedCorePayloadMain.hs \
            -o /tmp/fsem06-selected
          /tmp/fsem06-selected
          sha256sum src/Phil/Compiler/SelectedSteveGetCoreExecution.hs \
            test/FSEM06SteveGetSelectedCorePayloadMain.hs \
            examples/steve/get.phil /tmp/fsem06-extracted/FSEM06SteveGetNativeKernel.hs

  scope:
    name: Exclusive FSEM-06 authorized paths and exact family claim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise SteveGet routing offline
        run: python3 scripts/ci/test_steveget_scope_routing.py
      - name: Classify event and enforce applicable historical scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/steveget_scope_routing.py fsem06
