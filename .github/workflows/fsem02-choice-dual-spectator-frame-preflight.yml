name: FSEM-02 Choice Dual Borrowed Spectator Frame Preflight

on:
  push:
    branches:
      - formal-semantics/fsem02-choice-dual-spectator-frame
    paths:
      - 'test/Phase1FSEM02SourceJointChoiceMain.hs'
      - 'proof/Phil/Core/FSEM02PairedChoiceJointBridge.v'
      - 'docs/phase-1/formal-semantics-choice-dual-spectator-frame-fsem02-v1.md'
      - 'docs/phase-1/formal-semantics-protocol-progression-fsem02-v1.md'
      - '.github/workflows/fsem02-choice-dual-spectator-frame-preflight.yml'
  pull_request:
    paths:
      - 'test/Phase1FSEM02SourceJointChoiceMain.hs'
      - 'proof/Phil/Core/FSEM02PairedChoiceJointBridge.v'
      - 'docs/phase-1/formal-semantics-choice-dual-spectator-frame-fsem02-v1.md'
      - 'docs/phase-1/formal-semantics-protocol-progression-fsem02-v1.md'
      - '.github/workflows/fsem02-choice-dual-spectator-frame-preflight.yml'

permissions:
  contents: read

jobs:
  strict-native:
    name: Strict Haskell two-sided borrowed spectators and source Choice parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - run: bash scripts/ci/cabal-update-retry.sh
      - run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Exact Go/Cancel two-sided active loans, local/joint maps and negative witnesses
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1FSEM02SourceJointChoiceMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1FSEM02SourceJointChoiceMain.hs
          sha256sum test/Phase1FSEM02SourceJointChoiceMain.hs
          sha256sum test/fixtures/fsem02-source-choice-v1/*.phil
          sha256sum test/fixtures/fsem02-source-joint-choice-v1/*.phil
          sha256sum test/fixtures/fsem02-source-offer-v1/*.phil
          sha256sum test/fixtures/fsem02-source-offer-replay-v1/*.phil

  rocq:
    name: Rocq 9.2 two-sided local loan and spectator frame theorem
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile session steps, choice model, independent ownership premise
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ProcessTerminal.v \
            proof/Phil/Core/ArchitectureIdentity.v \
            proof/Phil/Core/ArchitectureInstantiation.v \
            proof/Phil/Core/ProviderReplacementQualification.v \
            proof/Phil/Core/ArchitectureRealization.v \
            proof/Phil/Systems/FactDisposition.v \
            proof/Phil/Assurance/ValidityScope.v \
            proof/Phil/Core/SystemsStageClosure.v \
            proof/Phil/Core/SystemsGenericLowering.v \
            proof/Phil/Core/ConcurrencySemantics.v \
            proof/Phil/Core/SessionStep.v \
            proof/Phil/Core/FSEM02ProtocolHeadProgression.v \
            proof/Phil/Core/FSEM02JointSourceChoice.v \
            proof/Phil/Core/FSEM02PairedChoiceJointBridge.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
              proof/Phil/Core/FSEM02PairedChoiceJointBridge.v; then
            echo "New unproved FSEM-02 assumption" >&2
            exit 1
          fi
          sha256sum proof/Phil/Core/FSEM02PairedChoiceJointBridge.v \
            proof/Phil/Core/FSEM02PairedChoiceJointBridge.vo
