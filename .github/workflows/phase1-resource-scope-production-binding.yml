name: Phase 1 Resource Scope Production Binding

on:
  pull_request:
    paths:
      - 'generated/ResourceScopeKernel.hs'
      - 'src/ResourceScopeKernel.hs'
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'phil-core.cabal'
      - 'proof/Phil/Core/ResourceScope.v'
      - 'proof/Phil/Core/ResourceScopeImplementation.v'
      - 'proof/Phil/Core/ResourceScopeImplementationExtraction.v'
      - 'app/ResourceScopeDecisionCorrespondenceMain.hs'
      - 'test/Phase1BranchLocalLinearLeakMain.hs'
      - 'test/Phase1AffineBranchAsymmetryMain.hs'
      - 'test/Phase1ScopedLoanBoundaryMain.hs'
      - 'test/Phase1TerminalArmExclusionMain.hs'
      - 'docs/phase-1/resource-scope-production-binding-v1.md'
      - '.github/workflows/phase1-resource-scope-production-binding.yml'

permissions:
  contents: read

jobs:
  exact-resource-scope-kernel:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Fresh-extract exact Resource Scope kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceScopeImplementation.v
          rm -f ResourceScopeKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceScopeImplementationExtraction.v
          test -s ResourceScopeKernel.hs
          echo '4dfd2f2d22a4a84de67b3c60d4ec18bc64eeaf1491982cd79e214d761a3ea965  ResourceScopeKernel.hs' | sha256sum -c -
          cmp ResourceScopeKernel.hs generated/ResourceScopeKernel.hs
          cmp ResourceScopeKernel.hs src/ResourceScopeKernel.hs
      - name: Record exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resource-scope-exact-kernel
          cp ResourceScopeKernel.hs resource-scope-exact-kernel/
          sha256sum \
            ResourceScopeKernel.hs \
            generated/ResourceScopeKernel.hs \
            src/ResourceScopeKernel.hs \
            proof/Phil/Core/ResourceScope.v \
            proof/Phil/Core/ResourceScopeImplementation.v \
            proof/Phil/Core/ResourceScopeImplementationExtraction.v \
            > resource-scope-exact-kernel/PHIL-RES-SCOPE-001.exact-kernel.sha256
          cat resource-scope-exact-kernel/PHIL-RES-SCOPE-001.exact-kernel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: resource-scope-exact-kernel
          path: resource-scope-exact-kernel
          if-no-files-found: error

  verify-resource-scope-production-binding:
    needs: exact-resource-scope-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build production library with warnings as errors
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Strict-typecheck bound Resource Scope surface
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/ResourceScopeKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/ControlStateProjection.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/ResourceScopeDecisionCorrespondenceMain.hs
      - name: Execute 8 direct controls through production kernel
        run: cabal exec -- runghc -isrc app/ResourceScopeDecisionCorrespondenceMain.hs
      - name: Re-run unchanged RES-005 through RES-008 correspondence corpus
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1BranchLocalLinearLeakMain.hs
          cabal exec -- runghc -isrc test/Phase1AffineBranchAsymmetryMain.hs
          cabal exec -- runghc -isrc test/Phase1ScopedLoanBoundaryMain.hs
          cabal exec -- runghc -isrc test/Phase1TerminalArmExclusionMain.hs
      - name: Record production-binding identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resource-scope-production-binding
          sha256sum \
            generated/ResourceScopeKernel.hs \
            src/ResourceScopeKernel.hs \
            src/Phil/Systems/ControlStateProjection.hs \
            phil-core.cabal \
            app/ResourceScopeDecisionCorrespondenceMain.hs \
            test/Phase1BranchLocalLinearLeakMain.hs \
            test/Phase1AffineBranchAsymmetryMain.hs \
            test/Phase1ScopedLoanBoundaryMain.hs \
            test/Phase1TerminalArmExclusionMain.hs \
            docs/phase-1/resource-scope-implementation-refinement-v1.md \
            docs/phase-1/resource-scope-production-binding-v1.md \
            > resource-scope-production-binding/PHIL-RES-SCOPE-001.production-binding.sha256
          cat resource-scope-production-binding/PHIL-RES-SCOPE-001.production-binding.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: resource-scope-production-binding
          path: resource-scope-production-binding
          if-no-files-found: error
