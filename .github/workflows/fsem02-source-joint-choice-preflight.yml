name: FSEM-02 Source Joint Select Offer Early Preflight

on:
  push:
    branches:
      - formal-semantics/fsem02-source-select-offer-joint-replay
    paths:
      - 'src/Phil/Surface/GrammarV1/ComponentChoiceRendezvous.hs'
      - 'test/Phase1FSEM02SourceJointChoiceMain.hs'
      - 'test/fixtures/fsem02-source-joint-choice-v1/**'
      - 'proof/Phil/Core/FSEM02JointSourceChoice.v'
      - 'phil-core.cabal'
      - '.github/workflows/fsem02-source-joint-choice-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/ComponentChoiceRendezvous.hs'
      - 'test/Phase1FSEM02SourceJointChoiceMain.hs'
      - 'test/fixtures/fsem02-source-joint-choice-v1/**'
      - 'proof/Phil/Core/FSEM02JointSourceChoice.v'
      - 'phil-core.cabal'
      - '.github/workflows/fsem02-source-joint-choice-preflight.yml'

permissions:
  contents: read

jobs:
  strict-source-joint-choice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - run: bash scripts/ci/cabal-update-retry.sh
      - run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Two parsed source programs, atomic joint Core step and exact negatives
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1FSEM02SourceJointChoiceMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1FSEM02SourceJointChoiceMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1FSEM02SourceOfferReplayMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1FSEM02SourceChoiceMain.hs
          sha256sum src/Phil/Surface/GrammarV1/ComponentChoiceRendezvous.hs test/Phase1FSEM02SourceJointChoiceMain.hs test/fixtures/fsem02-source-joint-choice-v1/*.phil test/fixtures/fsem02-source-offer-replay-v1/*.phil
  rocq:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Exact dependencies and bounded joint-source-choice proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ProcessTerminal.v \
            proof/Phil/Core/ArchitectureIdentity.v \
            proof/Phil/Core/ArchitectureInstantiation.v \
            proof/Phil/Core/ProviderReplacementQualification.v \
            proof/Phil/Core/ArchitectureRealization.v \
            proof/Phil/Systems/FactDisposition.v \
            proof/Phil/Assurance/ValidityScope.v \
            proof/Phil/Core/SystemsStageClosure.v \
            proof/Phil/Core/SystemsGenericLowering.v \
            proof/Phil/Core/ConcurrencySemantics.v \
            proof/Phil/Core/SessionStep.v \
            proof/Phil/Core/FSEM02ProtocolHeadProgression.v \
            proof/Phil/Core/FSEM02JointSourceChoice.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' proof/Phil/Core/FSEM02JointSourceChoice.v; then exit 1; fi
          sha256sum proof/Phil/Core/FSEM02JointSourceChoice.v proof/Phil/Core/FSEM02JointSourceChoice.vo
