name: Version Session Choice Apply

on:
  pull_request:
    paths:
      - '.github/workflows/version-session-choice-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lower-version-session-choice
          fetch-depth: 0
      - name: Apply shared Systems and LLVM plumbing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # Systems IR: explicit architecture/runtime inputs and opaque runtime values.
          replace_once(
              'src/Phil/Systems/IR.hs',
              '  | RuntimeScalar Text\n  | TypedScalar ScalarType\n  | RuntimeRecord Text\n',
              '  | RuntimeScalar Text\n  | RuntimeInput Text\n  | RuntimeOpaque Text\n  | TypedScalar ScalarType\n  | RuntimeRecord Text\n')
          replace_once(
              'src/Phil/Systems/IR.hs',
              '  RuntimeScalar description -> "runtime-scalar(" <> atom description <> ")"\n  TypedScalar scalarType -> "typed-scalar(" <> atom (renderScalarType scalarType) <> ")"\n',
              '  RuntimeScalar description -> "runtime-scalar(" <> atom description <> ")"\n  RuntimeInput description -> "runtime-input(" <> atom description <> ")"\n  RuntimeOpaque description -> "runtime-opaque(" <> atom description <> ")"\n  TypedScalar scalarType -> "typed-scalar(" <> atom (renderScalarType scalarType) <> ")"\n')

          # LLVM IR constructors.
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '  | LLVMFieldProjection Text Text Text Text ScalarType\n  | LLVMAcceptedResponse Text Text\n',
              '  | LLVMFieldProjection Text Text Text Text ScalarType\n  | LLVMOpaqueFieldProjection Text Text Text Text\n  | LLVMChooseSupportedPayloadBinding Text\n  | LLVMUnsupportedSelect Text\n  | LLVMVersionSelect Text Text\n  | LLVMVersionChoicePayloadBinding Text\n  | LLVMAcceptedResponse Text Text\n')
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '  | LLVMPayloadCancelOffer\n      Text\n      LLVMBlockId\n      LLVMBlockId\n  | LLVMReturnScalar Text ScalarType\n',
              '  | LLVMPayloadCancelOffer\n      Text\n      LLVMBlockId\n      LLVMBlockId\n  | LLVMChooseSupported\n      Text\n      Text\n      Text\n      LLVMBlockId\n      LLVMBlockId\n  | LLVMVersionChoiceOffer\n      Text\n      Text\n      LLVMBlockId\n      LLVMBlockId\n  | LLVMReturnScalar Text ScalarType\n')
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '  LLVMPayloadCancelOffer _ payloadTarget cancelTarget -> [payloadTarget, cancelTarget]\n  LLVMReturnScalar _ _ -> []\n',
              '  LLVMPayloadCancelOffer _ payloadTarget cancelTarget -> [payloadTarget, cancelTarget]\n  LLVMChooseSupported _ _ _ someTarget noneTarget -> [someTarget, noneTarget]\n  LLVMVersionChoiceOffer _ _ versionTarget unsupportedTarget -> [versionTarget, unsupportedTarget]\n  LLVMReturnScalar _ _ -> []\n')

          # Runtime profile inheritance.
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '      , "phil-runtime/phase0/payload-cancel-choice-v1"\n      ]\n',
              '      , "phil-runtime/phase0/payload-cancel-choice-v1"\n      , "phil-runtime/phase0/version-session-choice-v1"\n      ]\n')

          # New declarations in canonical renderer.
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '      <> payloadCancelSelectDeclaration\n      <> payloadCancelReceiveDeclaration\n      <> map renderCallDeclaration',
              '      <> payloadCancelSelectDeclaration\n      <> payloadCancelReceiveDeclaration\n      <> chooseSupportedDeclaration\n      <> unsupportedSelectDeclaration\n      <> versionSelectDeclaration\n      <> versionChoiceReceiveDeclaration\n      <> map renderCallDeclaration')
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '      <> map renderFieldProjectionDeclaration (Set.toAscList fieldProjectionSignatures)\n      <> map renderRecognitionDeclaration',
              '      <> map renderFieldProjectionDeclaration (Set.toAscList fieldProjectionSignatures)\n      <> map renderOpaqueFieldProjectionDeclaration (Set.toAscList opaqueFieldProjectionSignatures)\n      <> map renderRecognitionDeclaration')
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '    payloadCancelReceiveDeclaration =\n      if any hasPayloadCancelOffer allBlocks\n        then ["declare i1 @phil_runtime_receive_payload_cancel(ptr)"]\n        else []\n\n    callNames = Set.fromList\n',
              '    payloadCancelReceiveDeclaration =\n      if any hasPayloadCancelOffer allBlocks\n        then ["declare i1 @phil_runtime_receive_payload_cancel(ptr)"]\n        else []\n\n    chooseSupportedDeclaration =\n      if any hasChooseSupported allBlocks\n        then ["declare i1 @phil_runtime_choose_supported(ptr, ptr, ptr)"]\n        else []\n\n    unsupportedSelectDeclaration =\n      if any hasUnsupportedSelect allBlocks\n        then ["declare void @phil_runtime_select_unsupported(ptr)"]\n        else []\n\n    versionSelectDeclaration =\n      if any hasVersionSelect allBlocks\n        then ["declare void @phil_runtime_select_version(ptr, i16)"]\n        else []\n\n    versionChoiceReceiveDeclaration =\n      if any hasVersionChoiceOffer allBlocks\n        then ["declare i1 @phil_runtime_receive_version_choice(ptr, ptr)"]\n        else []\n\n    callNames = Set.fromList\n')
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '    fieldProjectionSignatures = Set.fromList\n      [ (grammar, fieldName, scalarType)\n      | blockValue <- allBlocks\n      , LLVMFieldProjection _ _ grammar fieldName scalarType <- llvmBlockOps blockValue\n      ]\n\n    recognitionGrammars = Set.fromList\n',
              '    fieldProjectionSignatures = Set.fromList\n      [ (grammar, fieldName, scalarType)\n      | blockValue <- allBlocks\n      , LLVMFieldProjection _ _ grammar fieldName scalarType <- llvmBlockOps blockValue\n      ]\n\n    opaqueFieldProjectionSignatures = Set.fromList\n      [ (grammar, fieldName)\n      | blockValue <- allBlocks\n      , LLVMOpaqueFieldProjection _ _ grammar fieldName <- llvmBlockOps blockValue\n      ]\n\n    recognitionGrammars = Set.fromList\n')
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '    hasPayloadCancelOffer blockValue = case llvmBlockTerminator blockValue of\n      LLVMPayloadCancelOffer {} -> True\n      _ -> False\n\n    renderCallDeclaration name =',
              '    hasPayloadCancelOffer blockValue = case llvmBlockTerminator blockValue of\n      LLVMPayloadCancelOffer {} -> True\n      _ -> False\n\n    hasChooseSupported blockValue = case llvmBlockTerminator blockValue of\n      LLVMChooseSupported {} -> True\n      _ -> False\n\n    hasUnsupportedSelect blockValue = any isUnsupportedSelect (llvmBlockOps blockValue)\n    isUnsupportedSelect LLVMUnsupportedSelect {} = True\n    isUnsupportedSelect _ = False\n\n    hasVersionSelect blockValue = any isVersionSelect (llvmBlockOps blockValue)\n    isVersionSelect LLVMVersionSelect {} = True\n    isVersionSelect _ = False\n\n    hasVersionChoiceOffer blockValue = case llvmBlockTerminator blockValue of\n      LLVMVersionChoiceOffer {} -> True\n      _ -> False\n\n    renderCallDeclaration name =')
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '    renderFieldProjectionDeclaration (grammar, fieldName, scalarType) =\n      "declare " <> renderScalarType scalarType\n        <> " @phil_record_" <> symbol grammar <> "_get_" <> symbol fieldName <> "(ptr)"\n    renderRecognitionDeclaration grammar =',
              '    renderFieldProjectionDeclaration (grammar, fieldName, scalarType) =\n      "declare " <> renderScalarType scalarType\n        <> " @phil_record_" <> symbol grammar <> "_get_" <> symbol fieldName <> "(ptr)"\n    renderOpaqueFieldProjectionDeclaration (grammar, fieldName) =\n      "declare ptr @phil_record_" <> symbol grammar <> "_get_" <> symbol fieldName <> "(ptr)"\n    renderRecognitionDeclaration grammar =')

          # Op renderer.
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '      LLVMFieldProjection output record grammar fieldName scalarType ->\n        [ "%" <> symbol output <> " = call " <> renderScalarType scalarType\n            <> " @phil_record_" <> symbol grammar <> "_get_" <> symbol fieldName\n            <> "(ptr %" <> symbol record <> ")"\n        ]\n      LLVMAcceptedResponse transport uploadId ->',
              '      LLVMFieldProjection output record grammar fieldName scalarType ->\n        [ "%" <> symbol output <> " = call " <> renderScalarType scalarType\n            <> " @phil_record_" <> symbol grammar <> "_get_" <> symbol fieldName\n            <> "(ptr %" <> symbol record <> ")"\n        ]\n      LLVMOpaqueFieldProjection output record grammar fieldName ->\n        [ "%" <> symbol output <> " = call ptr @phil_record_" <> symbol grammar\n            <> "_get_" <> symbol fieldName <> "(ptr %" <> symbol record <> ")"\n        ]\n      LLVMChooseSupportedPayloadBinding selected ->\n        [ "%" <> symbol selected <> " = load i16, ptr %phil_choose_supported_slot_"\n            <> symbol selected\n        ]\n      LLVMUnsupportedSelect transport ->\n        [ "call void @phil_runtime_select_unsupported(ptr %" <> symbol transport <> ")" ]\n      LLVMVersionSelect transport selected ->\n        [ "call void @phil_runtime_select_version(ptr %" <> symbol transport\n            <> ", i16 %" <> symbol selected <> ")"\n        ]\n      LLVMVersionChoicePayloadBinding selected ->\n        [ "%" <> symbol selected <> " = load i16, ptr %phil_version_choice_slot_"\n            <> symbol selected\n        ]\n      LLVMAcceptedResponse transport uploadId ->')

          # Terminator renderer.
          replace_once(
              'src/Phil/LLVM/IR.hs',
              '      LLVMPayloadCancelOffer transportName payloadTarget cancelTarget ->\n        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n            payloadName = "%phil_payload_cancel_is_payload_" <> blockSymbol\n        in\n          [ payloadName <> " = call i1 @phil_runtime_receive_payload_cancel(ptr %"\n              <> symbol transportName <> ")"\n          , "br i1 " <> payloadName\n              <> ", label %" <> symbol (unLLVMBlockId payloadTarget)\n              <> ", label %" <> symbol (unLLVMBlockId cancelTarget)\n          ]\n      LLVMReturnScalar name scalarType ->',
              '      LLVMPayloadCancelOffer transportName payloadTarget cancelTarget ->\n        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n            payloadName = "%phil_payload_cancel_is_payload_" <> blockSymbol\n        in\n          [ payloadName <> " = call i1 @phil_runtime_receive_payload_cancel(ptr %"\n              <> symbol transportName <> ")"\n          , "br i1 " <> payloadName\n              <> ", label %" <> symbol (unLLVMBlockId payloadTarget)\n              <> ", label %" <> symbol (unLLVMBlockId cancelTarget)\n          ]\n      LLVMChooseSupported supported offered selected someTarget noneTarget ->\n        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n            slotName = "%phil_choose_supported_slot_" <> symbol selected\n            someName = "%phil_choose_supported_some_" <> blockSymbol\n        in\n          [ slotName <> " = alloca i16"\n          , someName <> " = call i1 @phil_runtime_choose_supported(ptr %"\n              <> symbol supported <> ", ptr %" <> symbol offered <> ", ptr " <> slotName <> ")"\n          , "br i1 " <> someName\n              <> ", label %" <> symbol (unLLVMBlockId someTarget)\n              <> ", label %" <> symbol (unLLVMBlockId noneTarget)\n          ]\n      LLVMVersionChoiceOffer transport selected versionTarget unsupportedTarget ->\n        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n            slotName = "%phil_version_choice_slot_" <> symbol selected\n            versionName = "%phil_version_choice_is_version_" <> blockSymbol\n        in\n          [ slotName <> " = alloca i16"\n          , versionName <> " = call i1 @phil_runtime_receive_version_choice(ptr %"\n              <> symbol transport <> ", ptr " <> slotName <> ")"\n          , "br i1 " <> versionName\n              <> ", label %" <> symbol (unLLVMBlockId versionTarget)\n              <> ", label %" <> symbol (unLLVMBlockId unsupportedTarget)\n          ]\n      LLVMReturnScalar name scalarType ->')

          # LLVM lowerer parameters and opaque projection.
          replace_once(
              'src/Phil/LLVM/Lower.hs',
              '      [ LLVMParameter (unValueId valueId) LLVMPointerParameter\n      | (valueId, SystemsValue { systemsValueRole = TransportHandle }) <-\n          Map.toAscList (systemsFunctionValues functionValue)\n      ]\n',
              '      [ LLVMParameter (unValueId valueId) LLVMPointerParameter\n      | (valueId, SystemsValue { systemsValueRole = role }) <-\n          Map.toAscList (systemsFunctionValues functionValue)\n      , isPointerParameterRole role\n      ]\n')
          replace_once(
              'src/Phil/LLVM/Lower.hs',
              '          , Just projection <- recordProjection functionValue name inputs outputs ->\n              [projection]\n          | mode == AcceptedResponseMode\n',
              '          , Just projection <- recordProjection functionValue name inputs outputs ->\n              [projection]\n          | mode /= ConservativeMode\n          , Just projection <- recordOpaqueProjection functionValue name inputs outputs ->\n              [projection]\n          | mode == AcceptedResponseMode\n')
          replace_once(
              'src/Phil/LLVM/Lower.hs',
              'acceptedResponseOperands\n  :: SystemsFunction\n',
              'recordOpaqueProjection\n  :: SystemsFunction\n  -> Text\n  -> [ValueId]\n  -> [ValueId]\n  -> Maybe LLVMOp\nrecordOpaqueProjection functionValue name inputs outputs =\n  case (inputs, outputs) of\n    ([recordValue], [outputValue]) -> do\n      SystemsValue { systemsValueRole = RuntimeRecord grammar } <-\n        Map.lookup recordValue (systemsFunctionValues functionValue)\n      SystemsValue { systemsValueRole = RuntimeOpaque _ } <-\n        Map.lookup outputValue (systemsFunctionValues functionValue)\n      fieldName <- Text.stripPrefix ("project recognized " <> grammar <> ".") name\n      pure (LLVMOpaqueFieldProjection\n        (unValueId outputValue)\n        (unValueId recordValue)\n        grammar\n        fieldName)\n    _ -> Nothing\n\nisPointerParameterRole :: SystemsValueRole -> Bool\nisPointerParameterRole role = case role of\n  TransportHandle -> True\n  RuntimeInput _ -> True\n  _ -> False\n\nacceptedResponseOperands\n  :: SystemsFunction\n')

          # LLVM verifier ordinary physical operations.
          replace_once(
              'src/Phil/LLVM/Verify.hs',
              '      LLVMFieldProjection {} -> True\n      LLVMAcceptedResponse {} -> True\n',
              '      LLVMFieldProjection {} -> True\n      LLVMOpaqueFieldProjection {} -> True\n      LLVMChooseSupportedPayloadBinding {} -> True\n      LLVMUnsupportedSelect {} -> True\n      LLVMVersionSelect {} -> True\n      LLVMVersionChoicePayloadBinding {} -> True\n      LLVMAcceptedResponse {} -> True\n')

          # Public module routers.
          replace_once(
              'src/Phil/Systems.hs',
              '  , module Phil.Systems.VersionSessionChoice\n  ) where\n',
              '  , module Phil.Systems.VersionSessionChoice\n  , module Phil.Systems.VersionChoiceOperands\n  ) where\n')
          replace_once(
              'src/Phil/Systems.hs',
              'import Phil.Systems.VersionSessionChoice\nimport Phil.Systems.Verify\n',
              'import Phil.Systems.VersionChoiceOperands\nimport Phil.Systems.VersionSessionChoice\nimport Phil.Systems.Verify\n')
          replace_once(
              'src/Phil/LLVM.hs',
              '  , module Phil.LLVM.PayloadCancelChoiceCertification\n  ) where\n',
              '  , module Phil.LLVM.PayloadCancelChoiceCertification\n  , module Phil.LLVM.VersionSessionChoice\n  , module Phil.LLVM.VersionSessionChoiceCertification\n  ) where\n')
          replace_once(
              'src/Phil/LLVM.hs',
              'import Phil.LLVM.StorageProofCertification\nimport Phil.LLVM.Verify\n',
              'import Phil.LLVM.StorageProofCertification\nimport Phil.LLVM.VersionSessionChoice\nimport Phil.LLVM.VersionSessionChoiceCertification\nimport Phil.LLVM.Verify\n')

          # Emitter import.
          replace_once(
              'app/LLVMVersionSessionChoiceMain.hs',
              'import Phil.LLVM.VersionSessionChoice\n',
              'import Phil.LLVM.IR (llvmArtifactText)\nimport Phil.LLVM.VersionSessionChoice\n')

          # Cabal module/executable/test registration.
          replace_once(
              'phil-core.cabal',
              '      Phil.Systems.VersionSessionChoice\n      Phil.LLVM.IR\n',
              '      Phil.Systems.VersionSessionChoice\n      Phil.Systems.VersionChoiceOperands\n      Phil.LLVM.IR\n')
          replace_once(
              'phil-core.cabal',
              '      Phil.LLVM.PayloadCancelChoiceCertification\n  build-depends:\n',
              '      Phil.LLVM.PayloadCancelChoiceCertification\n      Phil.LLVM.VersionSessionChoice\n      Phil.LLVM.VersionSessionChoiceCertification\n  build-depends:\n')
          replace_once(
              'phil-core.cabal',
              'executable philc\n',
              '''executable phil-llvm-phase0-version-session-choice\n  import:             common-settings\n  hs-source-dirs:     app\n  main-is:            LLVMVersionSessionChoiceMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      phil-core,\n      text >=2.0 && <2.2\n\nexecutable philc\n''')
          replace_once(
              'phil-core.cabal',
              'test-suite phil-payload-cancel-choice-abi-tests\n',
              '''test-suite phil-version-session-choice-abi-tests\n  import:             common-settings\n  type:               exitcode-stdio-1.0\n  hs-source-dirs:     test\n  main-is:            VersionSessionChoiceABIMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      containers >=0.6 && <0.8,\n      phil-core,\n      text >=2.0 && <2.2\n\ntest-suite phil-payload-cancel-choice-abi-tests\n''')
          PY

          git diff --check
          git rm .github/workflows/version-session-choice-apply.yml
          git config user.name "phil-version-lowering-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/Phil/Systems/IR.hs \
            src/Phil/Systems.hs \
            src/Phil/LLVM/IR.hs \
            src/Phil/LLVM/Lower.hs \
            src/Phil/LLVM/Verify.hs \
            src/Phil/LLVM.hs \
            app/LLVMVersionSessionChoiceMain.hs \
            phil-core.cabal
          git commit -m "Wire physical version choice lowering"
          git push origin HEAD:lower-version-session-choice
