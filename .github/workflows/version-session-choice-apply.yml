name: Version Session Choice Apply

on:
  pull_request:
    paths:
      - '.github/workflows/version-session-choice-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-session-choice
          fetch-depth: 0
      - name: Apply package wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/Phil/Systems.hs',
              '  , module Phil.Systems.LocalRuntimeChoice\n  ) where\n',
              '  , module Phil.Systems.LocalRuntimeChoice\n  , module Phil.Systems.VersionSessionChoice\n  ) where\n')
          replace_once(
              'src/Phil/Systems.hs',
              'import Phil.Systems.Storage\nimport Phil.Systems.Verify\n',
              'import Phil.Systems.Storage\nimport Phil.Systems.VersionSessionChoice\nimport Phil.Systems.Verify\n')

          replace_once(
              'test/VersionSessionChoiceMain.hs',
              'import qualified Data.Map.Strict as Map\nimport Phil.LLVM\n',
              'import qualified Data.Map.Strict as Map\nimport Data.Text (Text)\nimport Phil.LLVM\n')

          replace_once(
              'phil-core.cabal',
              '      Phil.Systems.LocalRuntimeChoice\n      Phil.LLVM.IR\n',
              '      Phil.Systems.LocalRuntimeChoice\n      Phil.Systems.VersionSessionChoice\n      Phil.LLVM.IR\n')

          block = '''test-suite phil-version-session-choice-tests
  import:             common-settings
  type:               exitcode-stdio-1.0
  hs-source-dirs:     test
  main-is:            VersionSessionChoiceMain.hs
  build-depends:
      base >=4.17 && <5,
      containers >=0.6 && <0.8,
      phil-core,
      text >=2.0 && <2.2

'''
          replace_once(
              'phil-core.cabal',
              'test-suite phil-payload-cancel-choice-abi-tests\n',
              block + 'test-suite phil-payload-cancel-choice-abi-tests\n')
          PY
          git diff --check
          git rm .github/workflows/version-session-choice-apply.yml
          git config user.name "phil-version-choice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Phil/Systems.hs test/VersionSessionChoiceMain.hs phil-core.cabal
          git commit -m "Wire version session choice slice"
          git push origin HEAD:version-session-choice
