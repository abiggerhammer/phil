name: Version Session Choice

on:
  pull_request:
    paths:
      - 'phil-core.cabal'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Dataflow.hs'
      - 'src/Phil/Systems/Verify.hs'
      - 'src/Phil/Systems/LocalRuntimeChoice.hs'
      - 'src/Phil/Systems/PayloadCancelChoice.hs'
      - 'src/Phil/Systems/VersionSessionChoice.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'test/VersionSessionChoiceMain.hs'
      - 'docs/phase-0/version-session-choice-v1.md'
      - '.github/workflows/version-session-choice.yml'
  push:
    branches:
      - main
    paths:
      - 'phil-core.cabal'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Dataflow.hs'
      - 'src/Phil/Systems/Verify.hs'
      - 'src/Phil/Systems/LocalRuntimeChoice.hs'
      - 'src/Phil/Systems/PayloadCancelChoice.hs'
      - 'src/Phil/Systems/VersionSessionChoice.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'test/VersionSessionChoiceMain.hs'
      - 'docs/phase-0/version-session-choice-v1.md'
      - '.github/workflows/version-session-choice.yml'

permissions:
  contents: read

jobs:
  version-session-choice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: latest
      - name: Build focused suite
        run: cabal build phil-version-session-choice-tests
      - name: Run focused suite
        run: cabal test phil-version-session-choice-tests
