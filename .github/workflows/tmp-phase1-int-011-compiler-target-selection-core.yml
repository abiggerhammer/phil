name: Temporary INT-011 Compiler Target Selection Core

on:
  push:
    branches:
      - phase1-int-011-compiler-target-selection-core

permissions:
  contents: read

jobs:
  test-committed-head:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Run focused runnable compiler tests
        shell: bash
        run: |
          set -euo pipefail
          cabal test phil-runnable-tests
