name: Phase 1 Systems Revision Canonicalization Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/SystemsRevisionCanonicalization.v'
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/SystemsStageClosure.v'
      - 'proof/Phil/Systems/Identity.v'
      - 'src/Phil/Systems/Phase1Stage.hs'
      - 'test/Phase1GenericSystemsStageMain.hs'
      - 'test/Phase1StageClosureMain.hs'
      - 'docs/phase-1/systems-revision-canonicalization-proof-v1.md'
      - '.github/workflows/phase1-systems-revision-canonicalization-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/SystemsRevisionCanonicalization.v'
      - 'docs/phase-1/systems-revision-canonicalization-proof-v1.md'
      - '.github/workflows/phase1-systems-revision-canonicalization-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-systems-revision-canonicalization-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile certified predecessors and PHIL-SYS-REV-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsRevisionCanonicalization.v
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p systems-revision-canonicalization-proof
          cp \
            proof/Phil/Core/SystemsRevisionCanonicalization.v \
            proof/Phil/Core/SystemsRevisionCanonicalization.vo \
            systems-revision-canonicalization-proof/
          sha256sum \
            proof/Phil/Core/ArchitectureIdentity.v \
            proof/Phil/Systems/Identity.v \
            proof/Phil/Core/SystemsStageClosure.v \
            proof/Phil/Core/SystemsRevisionCanonicalization.v \
            proof/Phil/Core/SystemsRevisionCanonicalization.vo \
            > systems-revision-canonicalization-proof/PHIL-SYS-REV-001.proof.sha256
          {
            echo 'obligation=PHIL-SYS-REV-001'
            echo 'evidence=Rocq-9.2.0'
            cat systems-revision-canonicalization-proof/PHIL-SYS-REV-001.proof.sha256
          } > systems-revision-canonicalization-proof/PHIL-SYS-REV-001.proof-certificate.txt
          cat systems-revision-canonicalization-proof/PHIL-SYS-REV-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-systems-revision-canonicalization-proof
          path: systems-revision-canonicalization-proof
          if-no-files-found: error

  verify-systems-revision-canonicalization-correspondence:
    needs: rocq-systems-revision-canonicalization-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck canonical Systems revision implementation
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/Phase1Stage.hs
      - name: Re-run unchanged canonical revision correspondence corpora
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1GenericSystemsStageMain.hs
          cabal exec -- runghc -isrc test/Phase1StageClosureMain.hs
