name: Bootstrap Type Definedness Remediation

on:
  push:
    branches: [remediate-audit-type-definedness]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediate-audit-type-definedness
      - name: Apply narrow production patch
        shell: python
        run: |
          from pathlib import Path

          focusing = Path("src/Phil/Core/Focusing.hs")
          text = focusing.read_text()
          old = '''canonicalizeProposition staticContext state proposition = do
            validateStaticContext staticContext
            (_, canonical, _, steps) <- canonicalizeDetailed staticContext state [] proposition
            Right (canonical, steps)
          '''
          new = '''canonicalizeProposition staticContext state proposition = do
            validateStaticContext staticContext
            (expanded, canonical, sideConditions, steps) <-
              canonicalizeDetailed staticContext state [] proposition
            case firstStaticallyFalse sideConditions of
              Just prerequisite -> Left (StaticallyFalseGoal prerequisite)
              Nothing
                | all ((== Truth) . normalizeProposition) sideConditions ->
                    Right (canonical, steps)
                | otherwise ->
                    Right (expanded, filter (not . isNormalizationStep) steps)
            where
              firstStaticallyFalse [] = Nothing
              firstStaticallyFalse (prerequisite : rest)
                | normalizeProposition prerequisite == Falsehood = Just prerequisite
                | otherwise = firstStaticallyFalse rest
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Focusing canonicalizer patch anchor count: {text.count(old)}")
          focusing.write_text(text.replace(old, new))

          value = Path("src/Phil/Core/Value.hs")
          text = value.read_text()
          old = '''  ( Branch (..)
            , Mode
            , Name
            , PendingRecvSpec (..)
          '''
          new = '''  ( Branch (..)
            , Mode
            , Name
            , PendingRecvSpec (..)
            , ProductElementType (..)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Value import patch anchor count: {text.count(old)}")
          text = text.replace(old, new)

          old = '''      mapLeft valueSortError (checkTypeSorts state ty)
                case ty of
                  TyPendingRecv _ -> Left (InternalResourceNotValue name ty)
                  _ -> pure ValueResult
                    { valueResultType = ty
                    , valueResultMode = Just mode
                    , valueResultTerm = Just (RefVar name)
                    , valueResultEvidence =
                        map (EvidenceByBinding name . normalizeProposition)
                          (bindingEvidencePropositions name ty)
                    , valueResultState = state { resourceContext = nextContext }
                    }
          '''
          new = '''      mapLeft valueSortError (checkTypeSorts state ty)
                definednessUses <- checkTypeDefinedness ty state
                case ty of
                  TyPendingRecv _ -> Left (InternalResourceNotValue name ty)
                  _ -> pure ValueResult
                    { valueResultType = ty
                    , valueResultMode = Just mode
                    , valueResultTerm = Just (RefVar name)
                    , valueResultEvidence =
                        appendEvidenceList
                          definednessUses
                          ( map (EvidenceByBinding name . normalizeProposition)
                              (bindingEvidencePropositions name ty)
                          )
                    , valueResultState = state { resourceContext = nextContext }
                    }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Value synth patch anchor count: {text.count(old)}")
          text = text.replace(old, new)

          old = '''    _ -> do
                mapLeft valueSortError (checkTypeSorts state expected)
                synthesized <- synthValue value state
                let actual = valueResultType synthesized
                case bytesCheckDecision actual expected of
                  RuntimeBytesKernel.BytesCheckAcceptedForgetting ->
                    Right synthesized { valueResultType = expected }
                  RuntimeBytesKernel.BytesCheckAcceptedDefinitionallyEqual ->
                    Right synthesized { valueResultType = expected }
                  RuntimeBytesKernel.BytesCheckRequiresExplicitTransport ->
                    Left (ExplicitTransportRequired actual expected)
                  RuntimeBytesKernel.BytesCheckIncompatible
                    | refinementErasesTo actual expected ->
                        Right synthesized { valueResultType = expected }
                    | otherwise -> Left (ValueTypeMismatch actual expected)
          '''
          new = '''    _ -> do
                mapLeft valueSortError (checkTypeSorts state expected)
                definednessUses <- checkTypeDefinedness expected state
                synthesized <- synthValue value state
                let actual = valueResultType synthesized
                    accepted = synthesized
                      { valueResultType = expected
                      , valueResultEvidence = appendEvidenceList
                          definednessUses
                          (valueResultEvidence synthesized)
                      }
                case bytesCheckDecision actual expected of
                  RuntimeBytesKernel.BytesCheckAcceptedForgetting -> Right accepted
                  RuntimeBytesKernel.BytesCheckAcceptedDefinitionallyEqual -> Right accepted
                  RuntimeBytesKernel.BytesCheckRequiresExplicitTransport ->
                    Left (ExplicitTransportRequired actual expected)
                  RuntimeBytesKernel.BytesCheckIncompatible
                    | refinementErasesTo actual expected -> Right accepted
                    | otherwise -> Left (ValueTypeMismatch actual expected)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Value check patch anchor count: {text.count(old)}")
          text = text.replace(old, new)

          anchor = '''appendEvidenceList :: [EvidenceUse] -> [EvidenceUse] -> [EvidenceUse]
          appendEvidenceList additions existing =
            foldl (flip appendEvidence) existing additions
            where
              appendEvidence evidenceUse accumulated
                | evidenceUse `elem` accumulated = accumulated
                | otherwise = accumulated ++ [evidenceUse]
          '''
          addition = anchor + '''
          -- | Discharge type-definedness prerequisites before definitional equality can
          -- normalize away the partial term which generated them. Refinement predicates
          -- are handled after their binder is instantiated by the existing refinement
          -- path; product elements can be checked recursively at this boundary.
          checkTypeDefinedness :: Ty -> CheckState -> Either ValueError [EvidenceUse]
          checkTypeDefinedness ty state =
            case ty of
              TyBytes index -> sideConditions (Equal index index)
              TyProof proposition -> sideConditions proposition
              TyProduct elements ->
                fmap concat (mapM (checkTypeDefinedness . productElementType) elements)
              TyRefined _ base _ -> checkTypeDefinedness base state
              _ -> Right []
            where
              sideConditions proposition =
                mapLeft ValueRefinementError (dischargeSideConditions proposition state)
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"Value helper patch anchor count: {text.count(anchor)}")
          value.write_text(text.replace(anchor, addition))

          Path(".github/workflows/bootstrap-type-definedness-remediation.yml").unlink()
      - name: Commit production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Core/Focusing.hs src/Phil/Core/Value.hs .github/workflows/bootstrap-type-definedness-remediation.yml
          git commit -m 'Preserve and consume type definedness prerequisites'
          git push origin HEAD:remediate-audit-type-definedness
