name: Phase 1 Surface Parser Rank

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rocq-parser-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check

      - name: Compile parser recursion rank
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          timeout 300s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarParserRank.v

      - name: Record parser-rank identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-parser-rank
          cp \
            proof/Phil/Surface/GrammarParserRank.v \
            proof/Phil/Surface/GrammarParserRank.vo \
            surface-parser-rank/
          sha256sum \
            grammar/phase1-surface.ebnf \
            proof/Phil/Surface/GrammarParserRank.v \
            proof/Phil/Surface/GrammarParserRank.vo \
            > surface-parser-rank/identities.sha256
          cat surface-parser-rank/identities.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-parser-rank
          path: surface-parser-rank
          if-no-files-found: error
