name: Phase 1 Callable Scope Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/CallableScope.v'
      - 'src/Phil/Core/CallableScope.hs'
      - 'test/Phase1CallableScopeMain.hs'
      - 'docs/phase-1/callable-scope-v1.md'
      - 'docs/phase-1/callable-scope-proof-v1.md'
      - '.github/workflows/phase1-callable-scope-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/CallableScope.v'
      - 'src/Phil/Core/CallableScope.hs'
      - 'test/Phase1CallableScopeMain.hs'
      - 'docs/phase-1/callable-scope-v1.md'
      - 'docs/phase-1/callable-scope-proof-v1.md'
      - '.github/workflows/phase1-callable-scope-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-callable-scope-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-CALL-SCOPE-001 proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableScope.v

      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p callable-scope-proof
          cp proof/Phil/Core/CallableScope.v proof/Phil/Core/CallableScope.vo callable-scope-proof/
          sha256sum \
            proof/Phil/Core/CallableScope.v \
            proof/Phil/Core/CallableScope.vo \
            > callable-scope-proof/PHIL-CALL-SCOPE-001.proof.sha256
          {
            printf '%s\n' 'obligation=PHIL-CALL-SCOPE-001'
            printf '%s\n' 'evidence=Rocq-9.2.0'
            cat callable-scope-proof/PHIL-CALL-SCOPE-001.proof.sha256
          } > callable-scope-proof/PHIL-CALL-SCOPE-001.proof-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-callable-scope-proof
          path: callable-scope-proof
          if-no-files-found: error

  verify-callable-scope-correspondence:
    needs: rocq-callable-scope-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Typecheck existing CALL-SCOPE production path
        run: |
          set -euo pipefail
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Core/CallableScope.hs \
            test/Phase1CallableScopeMain.hs

      - name: Re-run unchanged CALL-010 and CALL-014 corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1CallableScopeMain.hs
