# CI normalization equivalence witness; execution semantics unchanged.
name: LLVM Foundations Back-Certification

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/Scalar.v'
      - 'proof/Phil/Systems/Scalar.v'
      - 'proof/Phil/LLVM/Identity.v'
      - 'proof/Phil/LLVM/Preservation.v'
      - 'proof/Phil/LLVM/Strengthening.v'
      - 'proof/Phil/LLVM/Scalar.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqLLVMFoundations.hs'
      - 'app/LLVMFoundationsBackCertificationMain.hs'
      - '.github/workflows/llvm-foundations-back-certification.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/Scalar.v'
      - 'proof/Phil/Systems/Scalar.v'
      - 'proof/Phil/LLVM/Identity.v'
      - 'proof/Phil/LLVM/Preservation.v'
      - 'proof/Phil/LLVM/Strengthening.v'
      - 'proof/Phil/LLVM/Scalar.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqLLVMFoundations.hs'
      - 'app/LLVMFoundationsBackCertificationMain.hs'
      - '.github/workflows/llvm-foundations-back-certification.yml'

permissions:
  contents: read

jobs:
  check-llvm-foundations:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check LLVM foundation theorem corpus
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Preservation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Strengthening.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Scalar.v
      - name: Stage checked proof sources and objects
        run: |
          mkdir -p checked/proof/Phil/LLVM
          for proof in Identity Preservation Strengthening Scalar; do
            cp "proof/Phil/LLVM/${proof}.v" checked/proof/Phil/LLVM/
            cp "proof/Phil/LLVM/${proof}.vo" checked/proof/Phil/LLVM/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-foundations-checked-proofs
          path: checked/
          if-no-files-found: error
          retention-days: 14

  certify-llvm-foundations:
    needs: check-llvm-foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: llvm-foundations-checked-proofs
          path: checked
      - name: Build Phil assurance library
        run: cabal build lib:phil-core
      - name: Typecheck back-certification metadata and certifier
        run: |
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/Assurance/RocqLLVMFoundations.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/LLVMFoundationsBackCertificationMain.hs
      - name: Build back-certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/LLVMFoundationsBackCertificationMain.hs \
            -o phil-certify-llvm-foundations
      - name: Produce four proof-assistant certificates
        run: |
          mkdir -p llvm-foundations-certificates
          ./phil-certify-llvm-foundations checked llvm-foundations-certificates
          test "$(find llvm-foundations-certificates -type f -name '*.rocq.cert' | wc -l)" -eq 4
          sha256sum llvm-foundations-certificates/*.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-llvm-foundations-proof-certificates
          path: llvm-foundations-certificates/
          if-no-files-found: error
          retention-days: 30
