name: Phase 1 Data Mode Production Binding

on:
  pull_request:
    paths:
      - 'generated/DataModeKernel.hs'
      - 'src/DataModeKernel.hs'
      - 'src/Phil/Core/DataModeKernelBridge.hs'
      - 'src/Phil/Core/DataMode.hs'
      - 'src/Phil/Core/NominalDataMode.hs'
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/DataMode.v'
      - 'proof/Phil/Core/DataModeImplementation.v'
      - 'proof/Phil/Core/DataModeImplementationExtraction.v'
      - 'app/DataModeDecisionCorrespondenceMain.hs'
      - 'app/DataModeProductionBindingMain.hs'
      - 'test/Phase1DataModeMain.hs'
      - 'test/Phase1LinearRecordConstructionMain.hs'
      - 'test/Phase1DuplicateRestrictedFieldMain.hs'
      - 'test/Phase1GenericModePropagationMain.hs'
      - 'test/Phase1NominalModeStrengtheningMain.hs'
      - 'docs/phase-1/data-mode-implementation-refinement-v1.md'
      - 'docs/phase-1/data-mode-production-binding-v1.md'
      - '.github/workflows/phase1-data-mode-production-binding.yml'

permissions:
  contents: read

jobs:
  exact-data-mode-kernel:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Fresh-extract exact Data Mode kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataModeImplementation.v
          rm -f DataModeKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/DataModeImplementationExtraction.v
          test -s DataModeKernel.hs
          echo '32f459278217bc15a33d02bee48333de51de33be7972816a30d4f2406ba41b40  DataModeKernel.hs' | sha256sum -c -
          cmp DataModeKernel.hs generated/DataModeKernel.hs
          cmp DataModeKernel.hs src/DataModeKernel.hs
      - name: Record exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data-mode-exact-kernel
          cp DataModeKernel.hs data-mode-exact-kernel/
          sha256sum \
            DataModeKernel.hs \
            generated/DataModeKernel.hs \
            src/DataModeKernel.hs \
            proof/Phil/Core/DataMode.v \
            proof/Phil/Core/DataModeImplementation.v \
            proof/Phil/Core/DataModeImplementationExtraction.v \
            > data-mode-exact-kernel/PHIL-DATA-MODE-001.exact-kernel.sha256
          cat data-mode-exact-kernel/PHIL-DATA-MODE-001.exact-kernel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: data-mode-exact-kernel
          path: data-mode-exact-kernel
          if-no-files-found: error

  verify-data-mode-production-binding:
    needs: exact-data-mode-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build production library with warnings as errors
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Strict-typecheck bound Data Mode surface
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/DataModeKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/DataModeKernelBridge.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/DataMode.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/NominalDataMode.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/DataModeDecisionCorrespondenceMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/DataModeProductionBindingMain.hs
      - name: Execute 16 direct controls through production kernel
        run: cabal exec -- runghc -Wall -Werror -isrc app/DataModeDecisionCorrespondenceMain.hs
      - name: Execute production Data Mode binding controls
        run: cabal exec -- runghc -Wall -Werror -isrc app/DataModeProductionBindingMain.hs
      - name: Re-run unchanged DATA-001–003, DATA-009, and DATA-014 correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataModeMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1LinearRecordConstructionMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1DuplicateRestrictedFieldMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericModePropagationMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1NominalModeStrengtheningMain.hs
      - name: Record production-binding identities
        run: |
          set -euo pipefail
          mkdir -p data-mode-production-binding
          sha256sum \
            generated/DataModeKernel.hs \
            src/DataModeKernel.hs \
            src/Phil/Core/DataModeKernelBridge.hs \
            src/Phil/Core/DataMode.hs \
            src/Phil/Core/NominalDataMode.hs \
            app/DataModeDecisionCorrespondenceMain.hs \
            app/DataModeProductionBindingMain.hs \
            docs/phase-1/data-mode-implementation-refinement-v1.md \
            docs/phase-1/data-mode-production-binding-v1.md \
            > data-mode-production-binding/PHIL-DATA-MODE-001.production-binding.sha256
          cat data-mode-production-binding/PHIL-DATA-MODE-001.production-binding.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: data-mode-production-binding
          path: data-mode-production-binding
          if-no-files-found: error
