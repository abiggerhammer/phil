name: Temporary CALL-019 Surface Arm Proof Bindings Staging

on:
  push:
    branches:
      - phase1-call019-surface-arm-proof-bindings
    paths:
      - '.github/workflows/tmp-phase1-call019-surface-arm-proof-bindings-author3.yml'

jobs:
  surface-arm-proof-bindings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase1-call019-surface-arm-proof-bindings
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build Haskell substrate
        run: cabal build all --enable-tests
      - name: Check CALL-019 Surface arm proof bindings
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019SurfaceArmProofBindingsMain.hs
      - name: Replay CALL-019 branch-local fact binding
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019OutcomeBranchFactsMain.hs
      - name: Replay CALL-019 outcome continuation state
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019OutcomeContinuationStateMain.hs
      - name: Replay CALL-019 branch-aware invocation context
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019BranchAwareInvocationContextMain.hs
      - name: Replay CALL-019 branch semantic witness
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019OutcomeBranchSemanticWitnessMain.hs
      - name: Replay CALL-019 declared-terminal control
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019OutcomeControlBoundaryMain.hs
