name: Temporary CALL-019 Branch Residue Join Author

on:
  push:
    branches:
      - phase1-call019-branch-residue-join-discipline
    paths:
      - 'scripts/tmp_call019_branch_residue_join.py'
      - '.github/workflows/tmp-phase1-call019-branch-residue-join-author.yml'

permissions:
  contents: write

jobs:
  author-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase1-call019-branch-residue-join-discipline
          fetch-depth: 0

      - name: Apply CALL-019 residue join slice
        run: python3 scripts/tmp_call019_branch_residue_join.py

      - name: Fix focused test imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/Phase1CALL019BranchResidueJoinMain.hs')
          text = path.read_text()
          old = '  , RejectionClass (..)\n  , SurfaceCallableSignature (..)\n'
          new = '  , RejectionClass (..)\n  , SurfaceCheckError (..)\n  , SurfaceCallableSignature (..)\n'
          if text.count(old) != 1:
              raise SystemExit(f'focused test import site count {text.count(old)}')
          text = text.replace(old, new, 1)
          redundant = '  , Pattern (..)\n'
          if text.count(redundant) != 1:
              raise SystemExit(f'focused test redundant Pattern import count {text.count(redundant)}')
          path.write_text(text.replace(redundant, '', 1))
          PY

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build Haskell substrate
        run: cabal build all --enable-tests

      - name: Check CALL-019 branch residue join discipline
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019BranchResidueJoinMain.hs

      - name: Replay CALL-019 Surface arm facts
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1CALL019SurfaceArmProofBindingsMain.hs

      - name: Replay Core resource join corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Main.hs

      - name: Commit semantic slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Meredith L. Patterson'
          git config user.email 'clonearmy@gmail.com'
          git add \
            src/Phil/Surface/Check/Types.hs \
            src/Phil/Surface/Check/Engine.hs \
            src/Phil/Compiler/CallableOutcomeDispatch.hs \
            src/Phil/Compiler/CallableOutcomeBranchSemantics.hs \
            src/Phil/Compiler/CallableOutcomeBranchResidue.hs \
            test/Phase1CALL019BranchResidueJoinMain.hs
          git commit -m 'Enforce CALL-019 branch residue join discipline'
          git push origin HEAD:phase1-call019-branch-residue-join-discipline
