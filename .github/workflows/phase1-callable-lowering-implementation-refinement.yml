name: Phase 1 Callable Lowering Implementation Refinement

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/CallableLoweringImplementation.v'
      - 'proof/Phil/Core/CallableLoweringImplementationExtraction.v'
      - 'docs/phase-1/callable-lowering-implementation-refinement-v1.md'
      - '.github/workflows/phase1-callable-lowering-implementation-refinement.yml'
      - 'src/CallableLoweringKernel.hs'
      - 'src/Phil/Systems/CallableLowering.hs'
      - 'test/Phase1CallableLoweringMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/CallableLoweringImplementation.v'
      - 'proof/Phil/Core/CallableLoweringImplementationExtraction.v'
      - 'docs/phase-1/callable-lowering-implementation-refinement-v1.md'
      - '.github/workflows/phase1-callable-lowering-implementation-refinement.yml'
      - 'src/CallableLoweringKernel.hs'
      - 'src/Phil/Systems/CallableLowering.hs'
      - 'test/Phase1CallableLoweringMain.hs'

permissions:
  contents: read

jobs:
  rocq-callable-lowering-implementation-refinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile CALL-016 implementation-refinement proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLifecycle.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRefinement.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLowering.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLoweringImplementation.v
      - name: Regenerate and bind proved CALL-016 kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f CallableLoweringKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLoweringImplementationExtraction.v
          test -s CallableLoweringKernel.hs
          grep -q '^module CallableLoweringKernel where' CallableLoweringKernel.hs
          grep -q '^decideCallableLowering ::' CallableLoweringKernel.hs
          if ! cmp -s CallableLoweringKernel.hs src/CallableLoweringKernel.hs; then
            echo 'checked-in CALL-016 kernel differs from fresh Rocq extraction' >&2
            diff -u src/CallableLoweringKernel.hs CallableLoweringKernel.hs || true
            exit 1
          fi
          sha256sum CallableLoweringKernel.hs src/CallableLoweringKernel.hs
          mkdir -p callable-lowering-implementation-refinement-proof
          cp \
            proof/Phil/Core/CallableLoweringImplementation.v \
            proof/Phil/Core/CallableLoweringImplementation.vo \
            proof/Phil/Core/CallableLoweringImplementationExtraction.v \
            CallableLoweringKernel.hs \
            callable-lowering-implementation-refinement-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-callable-lowering-implementation-refinement
          path: callable-lowering-implementation-refinement-proof
          if-no-files-found: error

  verify-production-callable-lowering:
    needs: rocq-callable-lowering-implementation-refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-callable-lowering-implementation-refinement
          path: callable-lowering-implementation-refinement-proof
      - name: Typecheck extracted, checked-in, and production CALL-016 path
        run: |
          set -euo pipefail
          cmp -s \
            callable-lowering-implementation-refinement-proof/CallableLoweringKernel.hs \
            src/CallableLoweringKernel.hs
          ghc -Wall -Werror -fno-code src/CallableLoweringKernel.hs
          ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/CallableLowering.hs
      - name: Exercise production CALL-016 path through extracted kernel
        run: |
          set -euo pipefail
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- runghc -isrc test/Phase1CallableLoweringMain.hs
