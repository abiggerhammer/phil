name: FSEM-01 DATA-05E Recursive Product Source/Core Preflight

on:
  push:
    branches:
      - formal-semantics/fsem01-data05e-recursive-tree
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceRecursiveProductElimination.hs'
      - 'test/Phase1FSEM01Data05ERecursiveProductMain.hs'
      - 'test/fixtures/fsem01-data05e-recursive-product-v1/**'
      - 'proof/Phil/Surface/SurfaceRecursiveProductSourceD05E.v'
      - 'docs/phase-1/formal-semantics-recursive-product-data05e-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-data05e-recursive-product-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/SourceRecursiveProductElimination.hs'
      - 'test/Phase1FSEM01Data05ERecursiveProductMain.hs'
      - 'test/fixtures/fsem01-data05e-recursive-product-v1/**'
      - 'proof/Phil/Surface/SurfaceRecursiveProductSourceD05E.v'
      - 'docs/phase-1/formal-semantics-recursive-product-data05e-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-data05e-recursive-product-preflight.yml'

concurrency:
  group: data05e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-source-tree:
    name: Strict GHC recursive source tree and independent Core/Surface conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Warning-clean full production library and product-tree regressions
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core --ghc-options=-Werror
          for test in \
            Phase1FSEM01FlatProductMain \
            Phase1FSEM01SourceProductEliminationMain \
            Phase1FSEM01Data05ANestedProductMain \
            Phase1FSEM01Data05BSourceSurfaceMain \
            Phase1FSEM01Data05CSourceAdmissionMain \
            Phase1FSEM01Data05DSourceAdmissionMain \
            Phase1FSEM01Data05ERecursiveProductMain
          do
            cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -itest -Wall -Werror "test/$test.hs"
          done
          sha256sum \
            src/Phil/Surface/GrammarV1/SourceRecursiveProductElimination.hs \
            test/Phase1FSEM01Data05ERecursiveProductMain.hs \
            src/Phil/Core/DataMode.hs \
            src/Phil/Surface/Check/Engine.hs

  rocq-recursive-tree:
    name: Rocq inductive arbitrary finite product tree preservation
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile production proof foundations and the finite-tree induction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/DataMode.v \
            proof/Phil/Core/DataProduct.v \
            proof/Phil/Surface/SurfaceRecursiveProductSourceD05E.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceRecursiveProductSourceD05E
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceRecursiveProductSourceD05E.v; then
            echo "An unproved DATA-05E admission was introduced" >&2
            exit 1
          fi
          sha256sum \
            proof/Phil/Surface/SurfaceRecursiveProductSourceD05E.v \
            proof/Phil/Surface/SurfaceRecursiveProductSourceD05E.vo
