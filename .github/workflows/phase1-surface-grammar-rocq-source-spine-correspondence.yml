name: Phase 1 Surface Grammar Rocq Source Spine Correspondence

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-grammar-rocq-source-spine-correspondence.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-grammar-rocq-source-spine-correspondence.yml'

permissions:
  contents: read

jobs:
  rocq-source-spine-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check

      - name: Compile source correspondence, representation bridges, and recursive grouping
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          {
            echo '-Q proof/Phil Phil'
            find proof/Phil/Surface -maxdepth 1 -type f -name 'Grammar*.v' -print | sort
          } > _CoqProject.surface-source-spine
          rocq makefile -f _CoqProject.surface-source-spine -o Makefile.surface-source-spine
          make -f Makefile.surface-source-spine -j2 \
            proof/Phil/Surface/GrammarAstSourceSpine.vo \
            proof/Phil/Surface/GrammarAstImplementationRepresentation.vo \
            proof/Phil/Surface/GrammarAstImplementationRepresentationExtraction.vo \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentation.vo \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentationExtraction.vo \
            proof/Phil/Surface/GrammarAstRecursiveGrouping.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingWellFormed.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingTotality.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingExamples.vo

      - name: Check recursive grouping theorem assumptions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          cat > RecursiveGroupingAssumptions.v <<'EOF'
          From Phil.Surface Require Import
            GrammarAstRecursiveGrouping
            GrammarAstRecursiveGroupingWellFormed
            GrammarAstRecursiveGroupingTotality.
          Print Assumptions phase1_surface_normalize_recursive_grouping_fuel_round_trip.
          Print Assumptions phase1_surface_grouping_well_formed_from_derivation_mutual.
          Print Assumptions phase1_surface_recursive_grouping_sufficient_fuel.
          Print Assumptions phase1_surface_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_recursive_grouping_expression_total_from_derivation.
          EOF
          rocq c -Q proof/Phil Phil RecursiveGroupingAssumptions.v \
            | tee recursive-grouping-assumptions.txt
          python3 - <<'PY'
          from pathlib import Path
          output = Path("recursive-grouping-assumptions.txt").read_text()
          assert output.count("Closed under the global context") == 5, output
          assert "Axioms:" not in output, output
          PY
          rocq check -silent -Q proof/Phil Phil \
            Phil.Surface.GrammarAstRecursiveGroupingTotality \
            Phil.Surface.GrammarAstRecursiveGroupingExamples

      - name: Record source representation and recursive grouping identities
        shell: bash
        run: |
          set -euo pipefail
          test -f SurfaceGrammarAstRepresentationKernel.hs
          test -f SurfaceGrammarAstTopLevelRepresentationKernel.hs
          mkdir -p surface-grammar-ast-representation
          cp SurfaceGrammarAstRepresentationKernel.hs surface-grammar-ast-representation/
          cp SurfaceGrammarAstTopLevelRepresentationKernel.hs surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp recursive-grouping-assumptions.txt surface-grammar-ast-representation/
          sha256sum \
            grammar/phase1-surface.ebnf \
            proof/Phil/Surface/GrammarAstImplementationRepresentation.v \
            proof/Phil/Surface/GrammarAstImplementationRepresentation.vo \
            SurfaceGrammarAstRepresentationKernel.hs \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentation.v \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentation.vo \
            SurfaceGrammarAstTopLevelRepresentationKernel.hs \
            proof/Phil/Surface/GrammarAstRecursiveGrouping.v \
            proof/Phil/Surface/GrammarAstRecursiveGrouping.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingWellFormed.v \
            proof/Phil/Surface/GrammarAstRecursiveGroupingWellFormed.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingTotality.v \
            proof/Phil/Surface/GrammarAstRecursiveGroupingTotality.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstRecursiveGroupingExamples.vo \
            > surface-grammar-ast-representation/identities.sha256
          cat surface-grammar-ast-representation/identities.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-grammar-ast-representation
          path: surface-grammar-ast-representation
          if-no-files-found: error
