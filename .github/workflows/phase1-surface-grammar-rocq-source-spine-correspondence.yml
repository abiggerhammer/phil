name: Phase 1 Surface Grammar Rocq Source Spine Correspondence

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-grammar-rocq-source-spine-correspondence.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-grammar-rocq-source-spine-correspondence.yml'

permissions:
  contents: write

jobs:
  rocq-source-spine-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surface-grammar-corr-source-header

      - name: Repair exact-list lemma binder types
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('proof/Phil/Surface/GrammarAstSourceHeader.v')
          s = p.read_text()
          replacements = {
              '''Lemma phase1_surface_exact2_round_trip {A : Type} :\n  forall items a b,\n''':
              '''Lemma phase1_surface_exact2_round_trip {A : Type} :\n  forall (items : list A) (a b : A),\n''',
              '''Lemma phase1_surface_exact3_round_trip {A : Type} :\n  forall items a b c,\n''':
              '''Lemma phase1_surface_exact3_round_trip {A : Type} :\n  forall (items : list A) (a b c : A),\n''',
              '''Lemma phase1_surface_exact4_round_trip {A : Type} :\n  forall items a b c d,\n''':
              '''Lemma phase1_surface_exact4_round_trip {A : Type} :\n  forall (items : list A) (a b c d : A),\n''',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proof/Phil/Surface/GrammarAstSourceHeader.v
          if ! git diff --cached --quiet; then
            git commit -m 'Annotate exact-list lemma binder types'
            git push origin HEAD:phase1-surface-grammar-corr-source-header
          fi

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check

      - name: Compile proof-side source header correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          {
            echo '-Q proof/Phil Phil'
            find proof/Phil/Surface -maxdepth 1 -type f -name 'Grammar*.v' -print | sort
          } > _CoqProject.surface-source-spine
          rocq makefile -f _CoqProject.surface-source-spine -o Makefile.surface-source-spine
          make -f Makefile.surface-source-spine -j2 \
            proof/Phil/Surface/GrammarAstSourceHeader.vo
