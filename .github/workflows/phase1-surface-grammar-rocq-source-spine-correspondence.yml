          Print Assumptions phase1_surface_normalize_data_generic_requirement_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_recursive_grouping_record_implementation_round_trip.
          Print Assumptions phase1_surface_recursive_grouping_record_implementation_inverse.
          Print Assumptions phase1_surface_recursive_grouping_data_implementation_round_trip.
          Print Assumptions phase1_surface_recursive_grouping_data_implementation_inverse.
          Print Assumptions phase1_surface_normalize_recursive_grouping_record_implementation_round_trip.
          Print Assumptions phase1_surface_normalize_recursive_grouping_data_implementation_round_trip.
          Print Assumptions phase1_surface_normalize_recursive_grouping_record_data_declaration_spine_round_trip.
          Print Assumptions phase1_surface_certified_record_has_recursive_grouping_implementation_view.
          Print Assumptions phase1_surface_certified_data_has_recursive_grouping_implementation_view.
          Print Assumptions phase1_surface_recursive_grouping_impl_admission_tag_sound.
          Print Assumptions phase1_surface_recursive_grouping_implementation_tagged_round_trip.
          Print Assumptions phase1_surface_recursive_grouping_implementation_admission_tag_exact.
          Print Assumptions phase1_surface_certified_record_has_tagged_recursive_grouping_view.
          Print Assumptions phase1_surface_certified_data_has_tagged_recursive_grouping_view.
          Print Assumptions phase1_surface_recursive_grouping_tagged_admission_injective.
          Print Assumptions phase1_surface_recursive_grouping_tagged_record_data_disjoint.
          Print Assumptions phase1_surface_tagged_requirements_presence_separated.
          Print Assumptions phase1_surface_tagged_requirements_presence_not_collapsed.
          Print Assumptions phase1_surface_recursive_grouping_tagged_admission_replay.
          Print Assumptions phase1_surface_recursive_grouping_tagged_admission_replay_unique.
          Print Assumptions phase1_surface_recursive_grouping_tagged_admission_cross_tag_exclusion.
          Print Assumptions phase1_surface_recursive_grouping_record_data_same_tree_excluded.
          Print Assumptions phase1_surface_recursive_grouping_data_tag_rejects_record_tree.
          Print Assumptions phase1_surface_recursive_grouping_record_tag_rejects_data_tree.
