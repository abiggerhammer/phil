name: Phase 1 Surface Grammar Rocq Source Spine Correspondence

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-grammar-rocq-source-spine-correspondence.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-grammar-rocq-source-spine-correspondence.yml'

permissions:
  contents: read

jobs:
  rocq-source-spine-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check

      - name: Compile source correspondence, representation bridges, and grouping consumers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          {
            echo '-Q proof/Phil Phil'
            find proof/Phil/Surface -maxdepth 1 -type f -name 'Grammar*.v' -print | sort
          } > _CoqProject.surface-source-spine
          rocq makefile -f _CoqProject.surface-source-spine -o Makefile.surface-source-spine
          make -f Makefile.surface-source-spine -j2 \
            proof/Phil/Surface/GrammarAstSourceSpine.vo \
            proof/Phil/Surface/GrammarAstImplementationRepresentation.vo \
            proof/Phil/Surface/GrammarAstImplementationRepresentationExtraction.vo \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentation.vo \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentationExtraction.vo \
            proof/Phil/Surface/GrammarAstRecursiveGrouping.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingWellFormed.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingTotality.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstPrimaryExpressionIntegerSpineTotality.vo \
            proof/Phil/Surface/GrammarAstPostfixExpressionRefinedSpineTotality.vo \
            proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstPrimaryPostfixRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstArithmeticRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstFallbackRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstFallbackRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingExamples.vo

      - name: Compile new generic-requirement modules with all warnings enabled
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          for module in GrammarAstGenericRequirementRecursiveGroupingSpine GrammarAstGenericRequirementRecursiveGroupingSpineTotality GrammarAstGenericRequirementRecursiveGroupingExamples; do
            rocq c -w +all -Q proof/Phil Phil "proof/Phil/Surface/${module}.v"
          done

      - name: Check recursive grouping and carrier composition theorem assumptions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          cat > RecursiveGroupingAssumptions.v <<'EOF'
          From Phil.Surface Require Import
            GrammarAstRecursiveGrouping
            GrammarAstRecursiveGroupingWellFormed
            GrammarAstRecursiveGroupingTotality
            GrammarAstPrimaryExpressionRecursiveGroupingSpine
            GrammarAstPrimaryExpressionRecursiveGroupingSpineTotality
            GrammarAstPostfixExpressionRecursiveGroupingSpine
            GrammarAstPostfixExpressionRecursiveGroupingSpineTotality
            GrammarAstUnaryExpressionRecursiveGroupingSpine
            GrammarAstUnaryExpressionRecursiveGroupingSpineTotality
            GrammarAstMultiplicativeExpressionRecursiveGroupingSpine
            GrammarAstMultiplicativeExpressionRecursiveGroupingSpineTotality
            GrammarAstAdditiveExpressionRecursiveGroupingSpine
            GrammarAstAdditiveExpressionRecursiveGroupingSpineTotality
            GrammarAstShiftExpressionRecursiveGroupingSpine
            GrammarAstShiftExpressionRecursiveGroupingSpineTotality
            GrammarAstBaseExpressionRecursiveGroupingSpine
            GrammarAstBaseExpressionRecursiveGroupingSpineTotality
            GrammarAstFallbackRecursiveGroupingSpine
            GrammarAstFallbackRecursiveGroupingSpineTotality
            GrammarAstExpressionRecursiveGroupingSpine
            GrammarAstExpressionRecursiveGroupingSpineTotality
            GrammarAstTermArgumentsRecursiveGroupingSpine
            GrammarAstTermArgumentsRecursiveGroupingSpineTotality
            GrammarAstEffectExpressionRecursiveGroupingSpine
            GrammarAstEffectExpressionRecursiveGroupingSpineTotality
            GrammarAstEffectSetRecursiveGroupingSpine
            GrammarAstEffectSetRecursiveGroupingSpineTotality
            GrammarAstGenericRequirementRecursiveGroupingSpine
            GrammarAstGenericRequirementRecursiveGroupingSpineTotality.
          Print Assumptions phase1_surface_normalize_recursive_grouping_fuel_round_trip.
          Print Assumptions phase1_surface_grouping_well_formed_from_derivation_mutual.
          Print Assumptions phase1_surface_recursive_grouping_sufficient_fuel.
          Print Assumptions phase1_surface_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_recursive_grouping_expression_total_from_derivation.
          Print Assumptions phase1_surface_normalize_primary_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_primary_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_primary_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_postfix_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_postfix_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_postfix_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_unary_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_unary_expression_recursive_grouping_sufficient_fuel_from_derivation.
          Print Assumptions phase1_surface_normalize_unary_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_unary_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_multiplicative_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_multiplicative_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_multiplicative_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_additive_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_additive_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_additive_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_shift_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_shift_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_shift_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_base_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_base_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_base_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_fallback_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_fallback_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_fallback_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_term_argument_recursive_grouping_values_round_trip.
          Print Assumptions phase1_surface_normalize_term_arguments_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_term_arguments_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_term_arguments_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_optional_term_arguments_recursive_grouping_round_trip.
          Print Assumptions phase1_surface_normalize_effect_expression_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_effect_expression_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_effect_expression_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_refine_effect_expression_recursive_grouping_reference_preserved.
          Print Assumptions phase1_surface_normalize_effect_set_recursive_grouping_values_round_trip.
          Print Assumptions phase1_surface_normalize_effect_set_literal_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_effect_set_literal_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_effect_set_literal_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_normalize_effect_set_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_effect_set_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_effect_set_recursive_grouping_total_from_derivation.
          Print Assumptions phase1_surface_refine_effect_set_recursive_grouping_reference_preserved.
          Print Assumptions phase1_surface_normalize_generic_requirement_recursive_grouping_tree_round_trip.
          Print Assumptions phase1_surface_normalize_generic_requirement_recursive_grouping_tree_total_from_derivation.
          Print Assumptions phase1_surface_refine_generic_requirement_recursive_grouping_total_from_derivation.
          EOF
          rocq c -Q proof/Phil Phil RecursiveGroupingAssumptions.v \
            | tee recursive-grouping-assumptions.txt
          python3 - <<'PY'
          from pathlib import Path
          output = Path("recursive-grouping-assumptions.txt").read_text()
          assert output.count("Closed under the global context") == 53, output
          assert "Axioms:" not in output, output
          PY
          rocq check -silent -Q proof/Phil Phil \
            Phil.Surface.GrammarAstRecursiveGroupingTotality \
            Phil.Surface.GrammarAstRecursiveGroupingExamples \
            Phil.Surface.GrammarAstPrimaryExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstPostfixExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstPrimaryPostfixRecursiveGroupingExamples \
            Phil.Surface.GrammarAstUnaryExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstMultiplicativeExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstAdditiveExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstShiftExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstArithmeticRecursiveGroupingExamples \
            Phil.Surface.GrammarAstBaseExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstFallbackRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstExpressionRecursiveGroupingExamples \
            Phil.Surface.GrammarAstTermArgumentsRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstTermArgumentsRecursiveGroupingExamples \
            Phil.Surface.GrammarAstEffectExpressionRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstEffectExpressionRecursiveGroupingExamples \
            Phil.Surface.GrammarAstEffectSetRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstEffectSetRecursiveGroupingExamples \
            Phil.Surface.GrammarAstGenericRequirementRecursiveGroupingSpineTotality \
            Phil.Surface.GrammarAstGenericRequirementRecursiveGroupingExamples

      - name: Record source representation and recursive grouping identities
        shell: bash
        run: |
          set -euo pipefail
          test -f SurfaceGrammarAstRepresentationKernel.hs
          test -f SurfaceGrammarAstTopLevelRepresentationKernel.hs
          mkdir -p surface-grammar-ast-representation
          cp SurfaceGrammarAstRepresentationKernel.hs surface-grammar-ast-representation/
          cp SurfaceGrammarAstTopLevelRepresentationKernel.hs surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstPrimaryPostfixRecursiveGroupingExamples.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstPrimaryPostfixRecursiveGroupingExamples.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstArithmeticRecursiveGroupingExamples.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstArithmeticRecursiveGroupingExamples.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstFallbackRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstFallbackRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstEffectSetRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstEffectSetRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGrouping*.v surface-grammar-ast-representation/
          cp proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGrouping*.vo surface-grammar-ast-representation/
          cp recursive-grouping-assumptions.txt surface-grammar-ast-representation/
          sha256sum \
            grammar/phase1-surface.ebnf \
            proof/Phil/Surface/GrammarAstImplementationRepresentation.v \
            proof/Phil/Surface/GrammarAstImplementationRepresentation.vo \
            SurfaceGrammarAstRepresentationKernel.hs \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentation.v \
            proof/Phil/Surface/GrammarAstTopLevelImplementationRepresentation.vo \
            SurfaceGrammarAstTopLevelRepresentationKernel.hs \
            proof/Phil/Surface/GrammarAstRecursiveGrouping.v \
            proof/Phil/Surface/GrammarAstRecursiveGrouping.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingWellFormed.v \
            proof/Phil/Surface/GrammarAstRecursiveGroupingWellFormed.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingTotality.v \
            proof/Phil/Surface/GrammarAstRecursiveGroupingTotality.vo \
            proof/Phil/Surface/GrammarAstRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstPrimaryExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstPostfixExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstPrimaryPostfixRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstPrimaryPostfixRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstUnaryExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstMultiplicativeExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstAdditiveExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstShiftExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstArithmeticRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstArithmeticRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstBaseExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstFallbackRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstFallbackRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstFallbackRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstFallbackRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstExpressionRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstTermArgumentsRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstEffectExpressionRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstEffectSetRecursiveGroupingExamples.vo \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingSpine.v \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingSpine.vo \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingSpineTotality.v \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingSpineTotality.vo \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingExamples.v \
            proof/Phil/Surface/GrammarAstGenericRequirementRecursiveGroupingExamples.vo \
            > surface-grammar-ast-representation/identities.sha256
          cat surface-grammar-ast-representation/identities.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-grammar-ast-representation
          path: surface-grammar-ast-representation
          if-no-files-found: error
