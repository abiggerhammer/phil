          Print Assumptions phase1_surface_record_data_implementation_admission_image_iff.
          Print Assumptions phase1_surface_recursive_grouping_observation_admitted_tag_exact.
          Print Assumptions phase1_surface_recursive_grouping_observation_admitted_key_sound.
          Print Assumptions phase1_surface_derived_record_has_admitted_observation.
          Print Assumptions phase1_surface_derived_data_has_admitted_observation.
          Print Assumptions phase1_surface_admitted_observation_equality_preserves_tag.
          Print Assumptions phase1_surface_admitted_record_data_observations_disjoint.
          Print Assumptions phase1_surface_admitted_observation_collides_on_distinct_exact_keys.
          Print Assumptions phase1_surface_certified_record_data_observations_separated.
          Print Assumptions phase1_surface_recursive_grouping_observation_related_reflexive_on_admission.
          Print Assumptions phase1_surface_recursive_grouping_observation_related_symmetric.
          Print Assumptions phase1_surface_recursive_grouping_observation_related_transitive.
          Print Assumptions phase1_surface_recursive_grouping_observation_related_preserves_tag.
          Print Assumptions phase1_surface_recursive_grouping_observation_related_not_exact_key_equality.
          Print Assumptions phase1_surface_recursive_grouping_observation_malformed_reflexivity_rejected.
          EOF
          rocq c -Q proof/Phil Phil RecursiveGroupingAssumptions.v \
            | tee recursive-grouping-assumptions.txt
          python3 - <<'PY'
          from pathlib import Path
          output = Path("recursive-grouping-assumptions.txt").read_text()
          assert output.count("Closed under the global context") == 115, output
          assert "Axioms:" not in output, output
          PY
          rocq check -silent -Q proof/Phil Phil \
            Phil.Surface.GrammarAstRecursiveGroupingTotality \
            Phil.Surface.GrammarAstRecursiveGroupingExamples \
            Phil.Surface.GrammarAstPrimaryExpressionRecursiveGroupingSpineTotality \
