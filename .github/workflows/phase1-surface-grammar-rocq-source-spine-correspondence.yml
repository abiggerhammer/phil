          Print Assumptions phase1_surface_certified_record_nonmatching_tag_rejected.
          Print Assumptions phase1_surface_certified_data_nonmatching_tag_rejected.
          Print Assumptions phase1_surface_certified_record_admission_fiber_singleton.
          Print Assumptions phase1_surface_certified_data_admission_fiber_singleton.
          Print Assumptions phase1_surface_certified_record_data_admission_fibers_disjoint.
          Print Assumptions phase1_surface_certified_record_root_fiber_equality_iff.
          Print Assumptions phase1_surface_certified_data_root_fiber_equality_iff.
