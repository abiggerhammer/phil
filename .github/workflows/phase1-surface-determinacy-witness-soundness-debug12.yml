name: Phase 1 Surface Determinacy Witness Soundness Debug 12

on:
  pull_request:

permissions:
  contents: read

jobs:
  rocq-witness-soundness-debug12:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write

      - name: Apply depth-safe nullable witness diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase1-surface-determinacy-witness-soundness-debug5.yml').read_text()
          marker = workflow.index('- name: Apply wrapped value-only nullable diagnostics')
          start = workflow.index('          from pathlib import Path', marker)
          end = workflow.index('\n          PY', start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<existing-debug5-diagnostics>', 'exec'), {})

          path = Path('proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v')
          source = path.read_text()
          block_start = source.index('Inductive NullableWitnessTruthProperty')
          block_end = source.index('\nLemma overlap_token_eqb_eq', block_start)

          replacement = r'''Fixpoint nullable_depth_safe_fuel
            (fuel : nat)
            (expression : EbnfExpression) : bool :=
            match fuel with
            | O => false
            | S remaining =>
                match expression with
                | ELiteral _ => true
                | ELexicalClass _ => true
                | ENonterminal _ => true
                | ESequence items =>
                    forallb (nullable_depth_safe_fuel remaining) items
                | EAlternative items =>
                    forallb (nullable_depth_safe_fuel remaining) items
                | EOptional _ => true
                | ERepetition _ => true
                end
            end.

          Lemma forallb_impl_true_depth :
            forall (A : Type) (source target : A -> bool) items,
              (forall item, source item = true -> target item = true) ->
              forallb source items = true ->
              forallb target items = true.
          Proof.
            intros A source target items Himpl.
            induction items as [| item rest IH]; simpl; intros Hall.
            - reflexivity.
            - apply andb_true_iff in Hall as [Hitem Hrest].
              apply andb_true_iff. split.
              + apply Himpl. exact Hitem.
              + apply IH. exact Hrest.
          Qed.

          Lemma choice_safe_implies_nullable_depth_safe :
            forall fuel expression,
              choice_bodies_nonnullable_fuel fuel expression = true ->
              nullable_depth_safe_fuel fuel expression = true.
          Proof.
            induction fuel as [| fuel IH]; intros expression Hsafe.
            - simpl in Hsafe. discriminate.
            - destruct expression as
                [literal | class_name | name | items | items | body | body];
                simpl in Hsafe |- *.
              + reflexivity.
              + reflexivity.
              + reflexivity.
              + eapply
                  (forallb_impl_true_depth
                    EbnfExpression
                    (choice_bodies_nonnullable_fuel fuel)
                    (nullable_depth_safe_fuel fuel)).
                * intros item Hitem. apply IH. exact Hitem.
                * exact Hsafe.
              + pose proof
                  (forallb_andb_right
                    EbnfExpression
                    (fun item =>
                      negb
                        (nullable_expression
                          phase1_surface_nullable_facts item))
                    (choice_bodies_nonnullable_fuel fuel)
                    items Hsafe)
                  as Hbodies.
                eapply
                  (forallb_impl_true_depth
                    EbnfExpression
                    (choice_bodies_nonnullable_fuel fuel)
                    (nullable_depth_safe_fuel fuel)).
                * intros item Hitem. apply IH. exact Hitem.
                * exact Hbodies.
              + reflexivity.
              + reflexivity.
          Qed.

          Definition nullable_depth_safe_rule (rule : GrammarRule) : bool :=
            match rule with
            | (_, expression) =>
                nullable_depth_safe_fuel expression_fuel expression
            end.

          Theorem phase1_surface_all_rule_bodies_nullable_depth_safe :
            forallb nullable_depth_safe_rule phase1_surface_rules = true.
          Proof.
            vm_compute.
            reflexivity.
          Qed.

          Lemma phase1_surface_rule_body_nullable_depth_safe :
            forall name body,
              lookupRule name phase1_surface_rules = Some body ->
              nullable_depth_safe_fuel expression_fuel body = true.
          Proof.
            intros name body Hlookup.
            eapply lookupRule_forallb.
            - exact phase1_surface_all_rule_bodies_nullable_depth_safe.
            - exact Hlookup.
          Qed.

          Lemma nullable_depth_safe_sequence_defined :
            forall fuel items,
              (forall expression,
                nullable_depth_safe_fuel fuel expression = true ->
                exists value,
                  nullable_expression_fuel
                    fuel phase1_surface_nullable_facts expression = Some value) ->
              forallb (nullable_depth_safe_fuel fuel) items = true ->
              exists value,
                nullable_expression_fuel
                  (S fuel) phase1_surface_nullable_facts
                  (ESequence items) = Some value.
          Proof.
            intros fuel items Hdefined.
            induction items as [| item rest IHrest]; intros Hsafe.
            - simpl. eexists. reflexivity.
            - simpl in Hsafe.
              apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
              destruct (Hdefined item Hitem_safe) as [item_value Hitem].
              destruct (IHrest Hrest_safe) as [rest_value Hrest].
              eapply nullable_sequence_cons_defined; eauto.
          Qed.

          Lemma nullable_depth_safe_alternative_defined :
            forall fuel items,
              (forall expression,
                nullable_depth_safe_fuel fuel expression = true ->
                exists value,
                  nullable_expression_fuel
                    fuel phase1_surface_nullable_facts expression = Some value) ->
              forallb (nullable_depth_safe_fuel fuel) items = true ->
              exists value,
                nullable_expression_fuel
                  (S fuel) phase1_surface_nullable_facts
                  (EAlternative items) = Some value.
          Proof.
            intros fuel items Hdefined.
            induction items as [| item rest IHrest]; intros Hsafe.
            - simpl. eexists. reflexivity.
            - simpl in Hsafe.
              apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
              destruct (Hdefined item Hitem_safe) as [item_value Hitem].
              destruct (IHrest Hrest_safe) as [rest_value Hrest].
              eapply nullable_alternative_cons_defined; eauto.
          Qed.

          Lemma nullable_depth_safe_defined :
            forall fuel expression,
              nullable_depth_safe_fuel fuel expression = true ->
              exists value,
                nullable_expression_fuel
                  fuel phase1_surface_nullable_facts expression = Some value.
          Proof.
            induction fuel as [| fuel IH]; intros expression Hsafe.
            - simpl in Hsafe. discriminate.
            - destruct expression as
                [literal | class_name | name | items | items | body | body];
                simpl in Hsafe |- *.
              + eexists. reflexivity.
              + eexists. reflexivity.
              + eexists. reflexivity.
              + eapply nullable_depth_safe_sequence_defined.
                * intros child Hchild. apply IH. exact Hchild.
                * exact Hsafe.
              + eapply nullable_depth_safe_alternative_defined.
                * intros child Hchild. apply IH. exact Hchild.
                * exact Hsafe.
              + eexists. reflexivity.
              + eexists. reflexivity.
          Qed.

          Fixpoint nullable_witness_depth_sound
            (expression : EbnfExpression)
            (witness : NullableWitness phase1_surface_rules expression)
            {struct witness} :
            forall fuel,
              nullable_depth_safe_fuel fuel expression = true ->
              nullable_expression_fuel
                fuel phase1_surface_nullable_facts expression = Some true
          with nullable_sequence_witness_depth_sound
            (items : list EbnfExpression)
            (witness : NullableSequenceWitness phase1_surface_rules items)
            {struct witness} :
            forall fuel,
              nullable_depth_safe_fuel fuel (ESequence items) = true ->
              nullable_expression_fuel
                fuel phase1_surface_nullable_facts
                (ESequence items) = Some true
          with nullable_alternative_witness_depth_sound
            (items : list EbnfExpression)
            (witness : NullableAlternativeWitness phase1_surface_rules items)
            {struct witness} :
            forall fuel,
              nullable_depth_safe_fuel fuel (EAlternative items) = true ->
              nullable_expression_fuel
                fuel phase1_surface_nullable_facts
                (EAlternative items) = Some true.
          Proof.
            - destruct witness as
                [name body Hlookup Hbody
                | items Hitems
                | items Hitems
                | body
                | body].
              + intros fuel Hsafe.
                destruct fuel as [| fuel].
                * simpl in Hsafe. discriminate.
                * assert (Hbody_safe :
                    nullable_depth_safe_fuel expression_fuel body = true).
                  {
                    apply phase1_surface_rule_body_nullable_depth_safe with name.
                    exact Hlookup.
                  }
                  pose proof
                    (nullable_witness_depth_sound
                      body Hbody expression_fuel Hbody_safe)
                    as Hbody_true.
                  pose proof
                    (phase1_surface_nullable_lookup_rule name body Hlookup)
                    as Hlookup_fact.
                  unfold nullable_expression in Hlookup_fact.
                  rewrite Hbody_true in Hlookup_fact.
                  simpl in Hlookup_fact.
                  simpl.
                  rewrite Hlookup_fact.
                  reflexivity.
              + intros fuel Hsafe.
                exact
                  (nullable_sequence_witness_depth_sound
                    items Hitems fuel Hsafe).
              + intros fuel Hsafe.
                exact
                  (nullable_alternative_witness_depth_sound
                    items Hitems fuel Hsafe).
              + intros fuel Hsafe.
                destruct fuel as [| fuel].
                * simpl in Hsafe. discriminate.
                * reflexivity.
              + intros fuel Hsafe.
                destruct fuel as [| fuel].
                * simpl in Hsafe. discriminate.
                * reflexivity.
            - destruct witness as [| item rest Hitem Hrest].
              + intros fuel Hsafe.
                destruct fuel as [| fuel].
                * simpl in Hsafe. discriminate.
                * reflexivity.
              + intros parent_fuel Hsafe.
                destruct parent_fuel as [| fuel].
                * simpl in Hsafe. discriminate.
                * simpl in Hsafe.
                  apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
                  pose proof
                    (nullable_witness_depth_sound
                      item Hitem fuel Hitem_safe)
                    as Hitem_true.
                  assert (Hrest_expr_safe :
                    nullable_depth_safe_fuel
                      (S fuel) (ESequence rest) = true).
                  { simpl. exact Hrest_safe. }
                  pose proof
                    (nullable_sequence_witness_depth_sound
                      rest Hrest (S fuel) Hrest_expr_safe)
                    as Hrest_true.
                  pose proof Hrest_true as Hrest_local.
                  simpl in Hrest_local.
                  simpl.
                  rewrite Hitem_true, Hrest_local.
                  reflexivity.
            - destruct witness as
                [item rest Hitem
                | item rest Hrest].
              + intros parent_fuel Hsafe.
                destruct parent_fuel as [| fuel].
                * simpl in Hsafe. discriminate.
                * simpl in Hsafe.
                  apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
                  pose proof
                    (nullable_witness_depth_sound
                      item Hitem fuel Hitem_safe)
                    as Hitem_true.
                  assert (Hrest_expr_safe :
                    nullable_depth_safe_fuel
                      (S fuel) (EAlternative rest) = true).
                  { simpl. exact Hrest_safe. }
                  destruct
                    (nullable_depth_safe_defined
                      (S fuel) (EAlternative rest) Hrest_expr_safe)
                    as [rest_value Hrest_defined].
                  pose proof Hrest_defined as Hrest_local.
                  simpl in Hrest_local.
                  simpl.
                  rewrite Hitem_true, Hrest_local.
                  reflexivity.
              + intros parent_fuel Hsafe.
                destruct parent_fuel as [| fuel].
                * simpl in Hsafe. discriminate.
                * simpl in Hsafe.
                  apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
                  destruct
                    (nullable_depth_safe_defined fuel item Hitem_safe)
                    as [item_value Hitem_defined].
                  assert (Hrest_expr_safe :
                    nullable_depth_safe_fuel
                      (S fuel) (EAlternative rest) = true).
                  { simpl. exact Hrest_safe. }
                  pose proof
                    (nullable_alternative_witness_depth_sound
                      rest Hrest (S fuel) Hrest_expr_safe)
                    as Hrest_true.
                  pose proof Hrest_true as Hrest_local.
                  simpl in Hrest_local.
                  simpl.
                  rewrite Hitem_defined, Hrest_local.
                  destruct item_value; reflexivity.
          Defined.

          Theorem phase1_surface_nullable_witness_matches_computed_facts :
            forall expression,
              NullableWitness phase1_surface_rules expression ->
              choice_bodies_nonnullable_fuel
                expression_fuel expression = true ->
              nullable_expression
                phase1_surface_nullable_facts expression = true.
          Proof.
            intros expression Hwitness Hchoice_safe.
            pose proof
              (choice_safe_implies_nullable_depth_safe
                expression_fuel expression Hchoice_safe)
              as Hdepth_safe.
            pose proof
              (nullable_witness_depth_sound
                expression Hwitness expression_fuel Hdepth_safe)
              as Hnullable.
            unfold nullable_expression.
            rewrite Hnullable.
            reflexivity.
          Qed.
          '''

          source = source[:block_start] + replacement + source[block_end:]
          path.write_text(source)
          PY

      - name: Compile witness soundness with timing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationLookahead.v
          timeout 300s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
