name: Rejected Response Proofs

on:
  pull_request:
    paths:
      - 'proof/**'
      - 'src/Phil/LLVM/RejectedResponseCertification.hs'
      - 'app/StorageProofCertificationMain.hs'
      - '.github/workflows/rejected-response-proofs.yml'
  push:
    branches:
      - main
    paths:
      - 'proof/**'
      - 'src/Phil/LLVM/RejectedResponseCertification.hs'
      - 'app/StorageProofCertificationMain.hs'
      - '.github/workflows/rejected-response-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-rejected-response:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check complete proof corpus including rejected response
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Session.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Process.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionLabel.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionStep.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Recognition.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RecognitionLoan.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessTerminal.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Discharge.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DecisionSound.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionRec.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Focusing.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Elaboration.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Checking.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/ScopeJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/FreshOwnership.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SystemsProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/Manifest.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceUse.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Ownership.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Runtime.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/ScalarDataflow.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/RecognizedRecord.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/DigestValidation.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Storage.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/AcceptedResponse.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/RejectedResponse.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Preservation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Strengthening.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Certification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordABI.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RuntimeSymbolIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceive.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceiveCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/DigestValidation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/DigestValidationCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Storage.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/StorageCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/AcceptedResponse.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/AcceptedResponseCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RejectedResponse.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RejectedResponseCertification.v

      - name: Stage exact checked proof objects
        run: |
          mkdir -p rocq-rejected/systems-rejected-response
          mkdir -p rocq-rejected/llvm-rejected-response
          mkdir -p rocq-rejected/systems-accepted-response
          mkdir -p rocq-rejected/llvm-accepted-response
          mkdir -p rocq-rejected/systems-storage
          mkdir -p rocq-rejected/llvm-storage
          mkdir -p rocq-rejected/systems-digest-validation
          mkdir -p rocq-rejected/llvm-digest-validation
          mkdir -p rocq-rejected/systems-recognized-record
          mkdir -p rocq-rejected/llvm-exact-receive
          mkdir -p rocq-rejected/llvm-recognized-record-abi
          mkdir -p rocq-rejected/llvm-runtime-symbol-identity
          cp proof/Phil/Systems/RejectedResponse.v rocq-rejected/systems-rejected-response/RejectedResponse.v
          cp proof/Phil/Systems/RejectedResponse.vo rocq-rejected/systems-rejected-response/RejectedResponse.vo
          cp proof/Phil/LLVM/RejectedResponse.v rocq-rejected/llvm-rejected-response/RejectedResponse.v
          cp proof/Phil/LLVM/RejectedResponse.vo rocq-rejected/llvm-rejected-response/RejectedResponse.vo
          cp proof/Phil/Systems/AcceptedResponse.v rocq-rejected/systems-accepted-response/AcceptedResponse.v
          cp proof/Phil/Systems/AcceptedResponse.vo rocq-rejected/systems-accepted-response/AcceptedResponse.vo
          cp proof/Phil/LLVM/AcceptedResponse.v rocq-rejected/llvm-accepted-response/AcceptedResponse.v
          cp proof/Phil/LLVM/AcceptedResponse.vo rocq-rejected/llvm-accepted-response/AcceptedResponse.vo
          cp proof/Phil/Systems/Storage.v rocq-rejected/systems-storage/Storage.v
          cp proof/Phil/Systems/Storage.vo rocq-rejected/systems-storage/Storage.vo
          cp proof/Phil/LLVM/Storage.v rocq-rejected/llvm-storage/Storage.v
          cp proof/Phil/LLVM/Storage.vo rocq-rejected/llvm-storage/Storage.vo
          cp proof/Phil/Systems/DigestValidation.v rocq-rejected/systems-digest-validation/DigestValidation.v
          cp proof/Phil/Systems/DigestValidation.vo rocq-rejected/systems-digest-validation/DigestValidation.vo
          cp proof/Phil/LLVM/DigestValidation.v rocq-rejected/llvm-digest-validation/DigestValidation.v
          cp proof/Phil/LLVM/DigestValidation.vo rocq-rejected/llvm-digest-validation/DigestValidation.vo
          cp proof/Phil/Systems/RecognizedRecord.v rocq-rejected/systems-recognized-record/RecognizedRecord.v
          cp proof/Phil/Systems/RecognizedRecord.vo rocq-rejected/systems-recognized-record/RecognizedRecord.vo
          cp proof/Phil/LLVM/ExactReceive.v rocq-rejected/llvm-exact-receive/ExactReceive.v
          cp proof/Phil/LLVM/ExactReceive.vo rocq-rejected/llvm-exact-receive/ExactReceive.vo
          cp proof/Phil/LLVM/RecognizedRecordABI.v rocq-rejected/llvm-recognized-record-abi/RecognizedRecordABI.v
          cp proof/Phil/LLVM/RecognizedRecordABI.vo rocq-rejected/llvm-recognized-record-abi/RecognizedRecordABI.vo
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.v rocq-rejected/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.vo rocq-rejected/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo

      - name: Upload exact checked proof objects
        uses: actions/upload-artifact@v4
        with:
          name: rocq-rejected-response-checked-proof-objects
          path: rocq-rejected/
          if-no-files-found: error
          retention-days: 14

  certify-rejected-response:
    needs: rocq-rejected-response
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Download exact checked proof objects
        uses: actions/download-artifact@v4
        with:
          name: rocq-rejected-response-checked-proof-objects
          path: rocq-rejected

      - name: Build proof-bound rejected-response certifier
        run: cabal build phil-certify-storage

      - name: Produce rejected-response proof and final certificates
        run: |
          mkdir -p rejected-response-certificates
          CERTIFIER="$(cabal list-bin phil-certify-storage)"
          "$CERTIFIER" \
            rocq-rejected/systems-rejected-response/RejectedResponse.v \
            rocq-rejected/systems-rejected-response/RejectedResponse.vo \
            rocq-rejected/llvm-rejected-response/RejectedResponse.v \
            rocq-rejected/llvm-rejected-response/RejectedResponse.vo \
            rocq-rejected/systems-accepted-response/AcceptedResponse.v \
            rocq-rejected/systems-accepted-response/AcceptedResponse.vo \
            rocq-rejected/llvm-accepted-response/AcceptedResponse.v \
            rocq-rejected/llvm-accepted-response/AcceptedResponse.vo \
            rocq-rejected/systems-storage/Storage.v \
            rocq-rejected/systems-storage/Storage.vo \
            rocq-rejected/llvm-storage/Storage.v \
            rocq-rejected/llvm-storage/Storage.vo \
            rocq-rejected/systems-digest-validation/DigestValidation.v \
            rocq-rejected/systems-digest-validation/DigestValidation.vo \
            rocq-rejected/llvm-digest-validation/DigestValidation.v \
            rocq-rejected/llvm-digest-validation/DigestValidation.vo \
            rocq-rejected/systems-recognized-record/RecognizedRecord.v \
            rocq-rejected/systems-recognized-record/RecognizedRecord.vo \
            rocq-rejected/llvm-exact-receive/ExactReceive.v \
            rocq-rejected/llvm-exact-receive/ExactReceive.vo \
            rocq-rejected/llvm-recognized-record-abi/RecognizedRecordABI.v \
            rocq-rejected/llvm-recognized-record-abi/RecognizedRecordABI.vo \
            rocq-rejected/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v \
            rocq-rejected/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo \
            rejected-response-certificates/PHIL-SYS-REJECTED-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-REJECTED-001.rocq.cert \
            rejected-response-certificates/PHIL-SYS-ACCEPTED-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-ACCEPTED-001.rocq.cert \
            rejected-response-certificates/PHIL-SYS-STORAGE-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-STORAGE-001.rocq.cert \
            rejected-response-certificates/PHIL-SYS-DIGEST-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-DIGEST-001.rocq.cert \
            rejected-response-certificates/PHIL-SYS-RECORD-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-EXACT-RECV-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-REC-ABI-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-RUNTIME-SYM-001.rocq.cert \
            rejected-response-certificates/PHIL-LLVM-CERT-006.cert \
            rejected-response-certificates/PHIL-LLVM-CERT-007.cert
          for certificate in rejected-response-certificates/*; do
            echo "===== ${certificate} ====="
            cat "${certificate}"
            sha256sum "${certificate}"
          done

      - name: Upload rejected-response certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phil-rejected-response-proof-bound-certification
          path: rejected-response-certificates/*
          if-no-files-found: error
          retention-days: 30
