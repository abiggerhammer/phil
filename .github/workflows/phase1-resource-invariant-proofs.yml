name: Phase 1 Resource Invariant Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ResourceInvariant.v'
      - 'proof/Phil/Core/ResourceInvariantImplementation.v'
      - 'proof/Phil/Core/ResourceInvariantImplementationExtraction.v'
      - 'app/ResourceInvariantDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-invariant-proof-v1.md'
      - 'docs/phase-1/resource-invariant-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-invariant-proofs.yml'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'proof/Phil/Core/ResourceLoop.v'
      - 'proof/Phil/Core/ResourceObligation.v'
      - 'src/Phil/Systems/ControlStateInvariant.hs'
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'test/Phase1JoinLoopInvariantMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ResourceInvariant.v'
      - 'proof/Phil/Core/ResourceInvariantImplementation.v'
      - 'proof/Phil/Core/ResourceInvariantImplementationExtraction.v'
      - 'app/ResourceInvariantDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/resource-invariant-proof-v1.md'
      - 'docs/phase-1/resource-invariant-implementation-refinement-v1.md'
      - '.github/workflows/phase1-resource-invariant-proofs.yml'
      - 'proof/Phil/Core/ResourceJoin.v'
      - 'proof/Phil/Core/ResourceLoop.v'
      - 'proof/Phil/Core/ResourceObligation.v'
      - 'src/Phil/Systems/ControlStateInvariant.hs'
      - 'src/Phil/Systems/ControlStateProjection.hs'
      - 'test/Phase1JoinLoopInvariantMain.hs'

permissions:
  contents: read

jobs:
  rocq-resource-invariant-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-RES-INVARIANT-001 proof and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceLoop.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceObligation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceInvariant.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceInvariantImplementation.v
          rm -f ResourceInvariantKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ResourceInvariantImplementationExtraction.v
          test -s ResourceInvariantKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resource-invariant-proof
          cp \
            proof/Phil/Core/ResourceInvariant.v \
            proof/Phil/Core/ResourceInvariant.vo \
            proof/Phil/Core/ResourceInvariantImplementation.v \
            proof/Phil/Core/ResourceInvariantImplementation.vo \
            ResourceInvariantKernel.hs \
            resource-invariant-proof/
          sha256sum \
            proof/Phil/Core/ResourceInvariant.v \
            proof/Phil/Core/ResourceInvariant.vo \
            proof/Phil/Core/ResourceInvariantImplementation.v \
            proof/Phil/Core/ResourceInvariantImplementation.vo \
            ResourceInvariantKernel.hs \
            > resource-invariant-proof/PHIL-RES-INVARIANT-001.proof.sha256
          {
            echo 'obligation=PHIL-RES-INVARIANT-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat resource-invariant-proof/PHIL-RES-INVARIANT-001.proof.sha256
          } > resource-invariant-proof/PHIL-RES-INVARIANT-001.proof-certificate.txt
          cat resource-invariant-proof/PHIL-RES-INVARIANT-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-resource-invariant-proof
          path: resource-invariant-proof
          if-no-files-found: error

  verify-resource-invariant-correspondence:
    needs: rocq-resource-invariant-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - uses: actions/download-artifact@v4
        with:
          name: rocq-resource-invariant-proof
          path: resource-invariant-proof
      - name: Check and execute extracted Resource Invariant controls
        shell: bash
        run: |
          set -euo pipefail
          cp resource-invariant-proof/ResourceInvariantKernel.hs ResourceInvariantKernel.hs
          ghc -Wall -Werror -fno-code ResourceInvariantKernel.hs
          ghc -i. -Wall -Werror -fno-code app/ResourceInvariantDecisionCorrespondenceMain.hs
          runghc -i. app/ResourceInvariantDecisionCorrespondenceMain.hs
          sha256sum ResourceInvariantKernel.hs
      - name: Typecheck unchanged RES-013 implementation paths
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/ControlStateProjection.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/ControlStateInvariant.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1JoinLoopInvariantMain.hs
      - name: Re-run unchanged RES-013 correspondence corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1JoinLoopInvariantMain.hs
