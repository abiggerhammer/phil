name: FSEM-01 CORR-4 Finite Linear Step Refinement

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - formal-semantics/fsem01-corr4-finite-linear-step-refinement
    paths:
      - 'test/Phase1FSEM01Corr4LinearStepMain.hs'
      - 'proof/Phil/Surface/SurfaceFiniteLinearStepCorr4.v'
      - '.github/workflows/fsem01-corr4-finite-linear-step-preflight.yml'
  pull_request:
    paths:
      - 'test/Phase1FSEM01Corr4LinearStepMain.hs'
      - 'proof/Phil/Surface/SurfaceFiniteLinearStepCorr4.v'
      - 'docs/phase-1/formal-semantics-linear-step-corr4-fsem01-v1.md'
      - '.github/workflows/fsem01-corr4-finite-linear-step-preflight.yml'

permissions:
  contents: read

jobs:
  strict-source-linear-step:
    name: Strict source Core linear transitions, native failure prefix and independent finite decisions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Bounded Hackage HTTP1 retry
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Strict production Haskell
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Strict CORR-2, CORR-3 and CORR-4 native source replay
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            Phase1FSEM01JoinLoopCorr2Main \
            Phase1FSEM01Corr3FiniteProjectionMain \
            Phase1FSEM01Corr4LinearStepMain
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
          sha256sum \
            test/Phase1FSEM01Corr4LinearStepMain.hs \
            src/Phil/Core/Context.hs \
            src/Phil/Surface/GrammarV1/SourceLinearLoopTransfer.hs

  rocq-executable-linear-step:
    name: Rocq total finite linear step decisions and exact extensional Core correspondence
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile FSEM-01 finite proof predecessors and CORR-4
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Surface/SurfaceFiniteContextFrame.v \
            proof/Phil/Surface/SurfaceSourceScopedBorrowJoin.v \
            proof/Phil/Surface/SurfaceSourceLinearLoopTransfer.v \
            proof/Phil/Surface/SurfaceSourceJoinLoopCorr2.v \
            proof/Phil/Surface/SurfaceSourceJoinLoopCorr3.v \
            proof/Phil/Surface/SurfaceFiniteLinearStepCorr4.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
              proof/Phil/Surface/SurfaceFiniteLinearStepCorr4.v; then
            echo "Unproved FSEM-01 CORR-4 theorem" >&2
            exit 1
          fi
          rocq check -Q proof/Phil Phil Phil.Surface.SurfaceFiniteLinearStepCorr4
          sha256sum proof/Phil/Surface/SurfaceFiniteLinearStepCorr4.v \
            proof/Phil/Surface/SurfaceFiniteLinearStepCorr4.vo
