name: MHB ATC Admit One (Manual)

# Scheduled ATC admission is disabled unless the repo variable is exactly 'true'.
# Manual dry-run/admit-one remain available, and legacy Phase 1 lanes are unchanged.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads queue only; admit-one opens exactly one PR"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - admit-one

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Durable serialization across *all* ATC admission attempts.
  group: mhb-atc-admission-global
  queue: max
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       vars.MHB_ATC_AUTO_ADMIT_ENABLED == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Mint dedicated protected-head publisher token
        id: publisher_token
        if: >-
          vars.MHB_ATC_IMMUTABLE_HEADS_ENABLED == 'true' &&
          (github.event_name == 'schedule' || inputs.mode == 'admit-one')
        uses: actions/create-github-app-token@v3
        with:
          client-id: \${{ vars.MHB_ATC_PUBLISHER_APP_CLIENT_ID }}
          private-key: \${{ secrets.MHB_ATC_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile queue and optionally publish one immutable exact head
        env:
          GH_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
          MODE: \${{ github.event_name == 'schedule' && 'admit-one' || inputs.mode }}
          IMMUTABLE_ENABLED: \${{ vars.MHB_ATC_IMMUTABLE_HEADS_ENABLED }}
          PUBLISHER_TOKEN: \${{ steps.publisher_token.outputs.token }}
          PUBLISHER_APP_ID: \${{ vars.MHB_ATC_PUBLISHER_APP_ID }}
          PUBLISHER_RULESET_ID: \${{ vars.MHB_ATC_PUBLISHER_RULESET_ID }}
        shell: bash
        run: |
          set -euo pipefail

          read_snapshot() {
            gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
              | jq -s 'add // []' > /tmp/atc-open-issues.json
            gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
              | jq -s 'add // []' > /tmp/atc-open-prs.json
            python3 scripts/mhb_atc_admit.py \
              --issues /tmp/atc-open-issues.json \
              --prs /tmp/atc-open-prs.json > /tmp/atc-plan.json
          }

          # A missing or inactive ruleset must never fall back to a mutable PR head.
          verify_publisher_ruleset() {
            test -n "$PUBLISHER_APP_ID" && test -n "$PUBLISHER_RULESET_ID"
            gh api "repos/$GH_REPO/rulesets/$PUBLISHER_RULESET_ID" > /tmp/atc-ruleset.json
            python3 scripts/mhb_atc_immutable.py ruleset \
              --ruleset-json /tmp/atc-ruleset.json \
              --repo "$GH_REPO" \
              --app-id "$PUBLISHER_APP_ID" \
              --ruleset-id "$PUBLISHER_RULESET_ID"
          }

          read_snapshot
          cat /tmp/atc-plan.json
          decision="$(jq -r '.decision' /tmp/atc-plan.json)"

          if [ "$MODE" = "dry-run" ]; then
            {
              echo "### MHB-ATC admission (read-only)"
              echo "- mode: dry-run"
              echo "- decision: $decision"
              echo "- immutable publishing: NOT attempted"
              echo "- no PR created; no queue state changed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$MODE" = "admit-one" || { echo "Unknown mode" >&2; exit 1; }
          test "$IMMUTABLE_ENABLED" = "true" || {
            echo "Immutable publisher activation gate is disabled" >&2
            exit 1
          }
          test -n "$PUBLISHER_TOKEN" || {
            echo "Dedicated publisher GitHub App token missing" >&2
            exit 1
          }
          if [ "$decision" = "hold" ]; then
            echo "No admission clearance; capacity occupied or no candidate."
            exit 0
          fi
          test "$decision" = "would-admit"

          # Fail closed BEFORE reserving any capacity if ruleset not active.
          verify_publisher_ruleset

          # Re-read all open issue and PR state before the irreversible transaction.
          prior="$(cat /tmp/atc-plan.json)"
          read_snapshot
          test "$(cat /tmp/atc-plan.json)" = "$prior" || {
            echo "Admission plan moved; refusing stale publish" >&2
            exit 1
          }
          issue="$(jq -r '.candidate_issue' /tmp/atc-plan.json)"
          lane="$(jq -r '.lane' /tmp/atc-plan.json)"
          branch="$(jq -r '.branch' /tmp/atc-plan.json)"
          expected="$(jq -r '.head_sha' /tmp/atc-plan.json)"

          python3 scripts/mhb_atc_immutable.py contract \
            --issue "$issue" --lane "$lane" \
            --staged "$branch" --sha "$expected" --repo "$GH_REPO" \
            > /tmp/atc-binding.json
          admitted="$(jq -r '.admitted_branch' /tmp/atc-binding.json)"
          title="$(jq -r '.title' /tmp/atc-binding.json)"
          jq -r '.body' /tmp/atc-binding.json > /tmp/atc-pr-body.md

          live="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
          test "$live" = "$expected" || {
            echo "Staged candidate $issue is stale; refusing publishing" >&2
            exit 1
          }

          # The new ref MUST NOT be pre-existing, even with a matching SHA:
          # a crash-created orphan is a human investigation, not automatic reuse.
          gh api "repos/$GH_REPO/git/matching-refs/heads/$admitted" \
            > /tmp/atc-admitted-refs.json
          python3 scripts/mhb_atc_immutable.py ref \
            --issue "$issue" --lane "$lane" --staged "$branch" \
            --sha "$expected" --repo "$GH_REPO" \
            --refs /tmp/atc-admitted-refs.json --expect absent

          # Global controller concurrency already serializes all ATC mutations.
          for label in "atc: admitting" "atc: admitted"; do
            if ! gh label list --repo "$GH_REPO" --limit 1000 --json name \
                 | jq -e --arg name "$label" 'any(.[]; .name == $name)' >/dev/null; then
              gh label create "$label" --repo "$GH_REPO" \
                --color 6a737d --description "MHB-ATC immutable admission lifecycle"
            fi
          done

          gh issue edit "$issue" --repo "$GH_REPO" \
            --remove-label "atc: staged" --add-label "atc: admitting"
          gh issue comment "$issue" --repo "$GH_REPO" \
            --body "ATC immutable admission reserved: staged $branch at $expected, protected PR head $admitted. An orphan ref blocks automatic requeue."

          # Final ref and ruleset preflight before the protected write.
          verify_publisher_ruleset
          live="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
          test "$live" = "$expected" || {
            echo "Staged candidate drifted after reservation" >&2
            exit 1
          }
          gh api "repos/$GH_REPO/git/matching-refs/heads/$admitted" \
            > /tmp/atc-admitted-refs.json
          python3 scripts/mhb_atc_immutable.py ref \
            --issue "$issue" --lane "$lane" --staged "$branch" \
            --sha "$expected" --repo "$GH_REPO" \
            --refs /tmp/atc-admitted-refs.json --expect absent

          # Create-only publishing: never update/force/delete an admitted ref.
          GH_TOKEN="$PUBLISHER_TOKEN" gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/heads/$admitted" -f "sha=$expected" \
            > /tmp/atc-publisher-create-ref.json

          gh api "repos/$GH_REPO/git/matching-refs/heads/$admitted" \
            > /tmp/atc-admitted-refs.json
          python3 scripts/mhb_atc_immutable.py ref \
            --issue "$issue" --lane "$lane" --staged "$branch" \
            --sha "$expected" --repo "$GH_REPO" \
            --refs /tmp/atc-admitted-refs.json --expect present

          # GitHub App token intentionally triggers normal pull_request CI;
          # GITHUB_TOKEN would suppress the event's usual downstream workflows.
          url="$(GH_TOKEN="$PUBLISHER_TOKEN" gh pr create \
            --repo "$GH_REPO" --base main --head "$admitted" \
            --title "$title" --body-file /tmp/atc-pr-body.md)"
          number="$(gh pr view "$url" --repo "$GH_REPO" --json number --jq .number)"
          gh api "repos/$GH_REPO/pulls/$number" > /tmp/atc-created-pr.json
          python3 scripts/mhb_atc_immutable.py verify-pr \
            --issue "$issue" --lane "$lane" --staged "$branch" \
            --sha "$expected" --repo "$GH_REPO" \
            --pr-json /tmp/atc-created-pr.json

          gh pr edit "$number" --repo "$GH_REPO" \
            --add-label "atc: admitted" --add-label "lane: $lane"
          gh issue edit "$issue" --repo "$GH_REPO" \
            --remove-label "atc: admitting" --add-label "atc: admitted"

          {
            echo "### MHB-ATC immutable admission"
            echo "- candidate issue: #$issue"
            echo "- staged branch: $branch"
            echo "- protected PR head: $admitted"
            echo "- exact commit: $expected"
            echo "- PR: $url"
            echo "- merge authority: NONE"
            echo "- next admission requires positive PR/issue reconciliation"
          } >> "$GITHUB_STEP_SUMMARY"
