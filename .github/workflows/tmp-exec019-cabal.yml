name: Temporary EXEC-019 cabal registration

on:
  push:
    branches: [phase1-exec-019-numeric-proposition-competence]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-exec-019-numeric-proposition-competence
      - name: Register numeric proposition competence module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('phil-core.cabal')
          text = path.read_text()
          old = '      Phil.Core.Decision\n      Phil.Core.Discharge\n'
          new = '      Phil.Core.Decision\n      Phil.Core.NumericPropositionCompetence\n      Phil.Core.Discharge\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one cabal anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cabal registration
        run: |
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add phil-core.cabal
          git commit -m "phase1: register numeric proposition competence module"
          git push origin HEAD:phase1-exec-019-numeric-proposition-competence
