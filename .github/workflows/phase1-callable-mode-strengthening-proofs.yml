name: Phase 1 Callable Mode Strengthening Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/CallableMode.v'
      - 'proof/Phil/Core/CallableModeStrengthening.v'
      - 'src/Phil/Core/Callable/ModeDeclaration.hs'
      - 'test/Phase1ExplicitClosureModeMain.hs'
      - 'docs/phase-1/callable-mode-strengthening-proof-v1.md'
      - '.github/workflows/phase1-callable-mode-strengthening-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/CallableMode.v'
      - 'proof/Phil/Core/CallableModeStrengthening.v'
      - 'src/Phil/Core/Callable/ModeDeclaration.hs'
      - 'test/Phase1ExplicitClosureModeMain.hs'
      - 'docs/phase-1/callable-mode-strengthening-proof-v1.md'
      - '.github/workflows/phase1-callable-mode-strengthening-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-callable-mode-strengthening-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile Certified predecessor and PHIL-CALL-MODE-STRENGTHEN-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableModeStrengthening.v
      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p callable-mode-strengthening-proof
          cp \
            proof/Phil/Core/CallableModeStrengthening.v \
            proof/Phil/Core/CallableModeStrengthening.vo \
            callable-mode-strengthening-proof/
          sha256sum \
            proof/Phil/Core/CallableMode.v \
            proof/Phil/Core/CallableModeStrengthening.v \
            proof/Phil/Core/CallableModeStrengthening.vo \
            src/Phil/Core/Callable/ModeDeclaration.hs \
            test/Phase1ExplicitClosureModeMain.hs \
            > callable-mode-strengthening-proof/PHIL-CALL-MODE-STRENGTHEN-001.proof.sha256
          {
            echo 'obligation=PHIL-CALL-MODE-STRENGTHEN-001'
            echo 'evidence=Rocq-9.2.0'
            cat callable-mode-strengthening-proof/PHIL-CALL-MODE-STRENGTHEN-001.proof.sha256
          } > callable-mode-strengthening-proof/PHIL-CALL-MODE-STRENGTHEN-001.proof-certificate.txt
          cat callable-mode-strengthening-proof/PHIL-CALL-MODE-STRENGTHEN-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-callable-mode-strengthening-proof
          path: callable-mode-strengthening-proof
          if-no-files-found: error

  verify-callable-mode-strengthening-correspondence:
    needs: rocq-callable-mode-strengthening-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck CALL-017 implementation and corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Callable/ModeDeclaration.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1ExplicitClosureModeMain.hs
      - name: Re-run unchanged CALL-017 corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExplicitClosureModeMain.hs
