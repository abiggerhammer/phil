name: Exact Receive Proofs

on:
  pull_request:
    paths:
      - 'proof/**'
      - '_CoqProject'
      - 'src/Phil/Assurance/**'
      - 'src/Phil/Assurance.hs'
      - 'src/Phil/LLVM/ExactReceiveProofCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/RocqScalarCertificationMain.hs'
      - 'app/ExactReceiveProofCertificationMain.hs'
      - 'test/RocqCertificationMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/exact-receive-proofs.yml'
  push:
    branches:
      - main
    paths:
      - 'proof/**'
      - '_CoqProject'
      - 'src/Phil/Assurance/**'
      - 'src/Phil/Assurance.hs'
      - 'src/Phil/LLVM/ExactReceiveProofCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/RocqScalarCertificationMain.hs'
      - 'app/ExactReceiveProofCertificationMain.hs'
      - 'test/RocqCertificationMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/exact-receive-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-exact-receive:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check complete proof corpus including exact receive
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Session.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Process.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionLabel.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionStep.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Recognition.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RecognitionLoan.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessTerminal.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Discharge.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DecisionSound.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionRec.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Focusing.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Elaboration.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Checking.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/ScopeJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/FreshOwnership.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SystemsProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/Manifest.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceUse.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Ownership.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Runtime.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/ScalarDataflow.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/RecognizedRecord.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Preservation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Strengthening.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Certification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordABI.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RuntimeSymbolIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceive.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceiveCertification.v

      - name: Stage exact checked proof objects
        run: |
          mkdir -p rocq-exact/llvm-exact-receive
          mkdir -p rocq-exact/llvm-recognized-record-abi
          mkdir -p rocq-exact/llvm-runtime-symbol-identity
          cp proof/Phil/LLVM/ExactReceive.v rocq-exact/llvm-exact-receive/ExactReceive.v
          cp proof/Phil/LLVM/ExactReceive.vo rocq-exact/llvm-exact-receive/ExactReceive.vo
          cp proof/Phil/LLVM/RecognizedRecordABI.v rocq-exact/llvm-recognized-record-abi/RecognizedRecordABI.v
          cp proof/Phil/LLVM/RecognizedRecordABI.vo rocq-exact/llvm-recognized-record-abi/RecognizedRecordABI.vo
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.v rocq-exact/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.vo rocq-exact/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo

      - name: Upload exact checked proof objects
        uses: actions/upload-artifact@v4
        with:
          name: rocq-exact-receive-checked-proof-objects
          path: rocq-exact/
          if-no-files-found: error
          retention-days: 14

  certify-exact-receive:
    needs: rocq-exact-receive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Download exact checked proof objects
        uses: actions/download-artifact@v4
        with:
          name: rocq-exact-receive-checked-proof-objects
          path: rocq-exact

      - name: Build proof-bound exact-receive certifier
        run: cabal build phil-certify-exact-receive

      - name: Produce exact-receive proof and final certificates
        run: |
          mkdir -p exact-receive-certificates
          CERTIFIER="$(cabal list-bin phil-certify-exact-receive)"
          "$CERTIFIER" \
            rocq-exact/llvm-exact-receive/ExactReceive.v \
            rocq-exact/llvm-exact-receive/ExactReceive.vo \
            rocq-exact/llvm-recognized-record-abi/RecognizedRecordABI.v \
            rocq-exact/llvm-recognized-record-abi/RecognizedRecordABI.vo \
            rocq-exact/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v \
            rocq-exact/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo \
            exact-receive-certificates/PHIL-LLVM-EXACT-RECV-001.rocq.cert \
            exact-receive-certificates/PHIL-LLVM-REC-ABI-001.rocq.cert \
            exact-receive-certificates/PHIL-LLVM-RUNTIME-SYM-001.rocq.cert \
            exact-receive-certificates/PHIL-LLVM-CERT-003.cert
          cat exact-receive-certificates/PHIL-LLVM-EXACT-RECV-001.rocq.cert
          sha256sum exact-receive-certificates/PHIL-LLVM-EXACT-RECV-001.rocq.cert
          cat exact-receive-certificates/PHIL-LLVM-REC-ABI-001.rocq.cert
          sha256sum exact-receive-certificates/PHIL-LLVM-REC-ABI-001.rocq.cert
          cat exact-receive-certificates/PHIL-LLVM-RUNTIME-SYM-001.rocq.cert
          sha256sum exact-receive-certificates/PHIL-LLVM-RUNTIME-SYM-001.rocq.cert
          cat exact-receive-certificates/PHIL-LLVM-CERT-003.cert
          sha256sum exact-receive-certificates/PHIL-LLVM-CERT-003.cert

      - name: Upload exact-receive certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phil-exact-receive-proof-bound-certification
          path: exact-receive-certificates/*
          if-no-files-found: error
          retention-days: 30
