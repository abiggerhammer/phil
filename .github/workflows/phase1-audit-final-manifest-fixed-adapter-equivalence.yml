name: Phase 1 Audit Final Manifest Fixed Adapter Equivalence

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/FinalManifestFixedAdapterEquivalence.v'
      - '.github/workflows/phase1-audit-final-manifest-fixed-adapter-equivalence.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Verification/FinalManifestFixedAdapterEquivalence.v'
      - '.github/workflows/phase1-audit-final-manifest-fixed-adapter-equivalence.yml'

permissions:
  contents: read

jobs:
  final-manifest-fixed-adapter-equivalence:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile adapter equivalence proof and dependency closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/VerificationArtifact.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestStageReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestNativeCoordinateReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestFixedAdapter.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestFixedAdapterEquivalence.v

          cat > /tmp/FinalManifestFixedAdapterEquivalenceAssumptions.v <<'EOF'
          From Phil.Verification Require Import FinalManifestFixedAdapterEquivalence.
          Print Assumptions fixed_adapter_iff_native_release_relations.
          EOF
          rocq c -Q proof/Phil Phil /tmp/FinalManifestFixedAdapterEquivalenceAssumptions.v 2>&1 | tee final-manifest-fixed-adapter-equivalence-assumptions.log

      - name: Record exact proof and object identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-manifest-fixed-adapter-equivalence
          cp proof/Phil/Verification/FinalManifestFixedAdapterEquivalence.v final-manifest-fixed-adapter-equivalence/
          cp proof/Phil/Verification/FinalManifestFixedAdapterEquivalence.vo final-manifest-fixed-adapter-equivalence/
          cp final-manifest-fixed-adapter-equivalence-assumptions.log final-manifest-fixed-adapter-equivalence/
          sha256sum \
            proof/Phil/Verification/FinalManifestFixedAdapter.v \
            proof/Phil/Verification/FinalManifestFixedAdapter.vo \
            proof/Phil/Verification/FinalManifestFixedAdapterEquivalence.v \
            proof/Phil/Verification/FinalManifestFixedAdapterEquivalence.vo \
            final-manifest-fixed-adapter-equivalence-assumptions.log \
            > final-manifest-fixed-adapter-equivalence/identities.sha256
          cat final-manifest-fixed-adapter-equivalence/identities.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: final-manifest-fixed-adapter-equivalence
          path: final-manifest-fixed-adapter-equivalence
          if-no-files-found: error
