name: Phase 1 Surface Determinacy Simple Resolvers

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDerivation.v'
      - 'proof/Phil/Surface/GrammarDerivationOracle.v'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificate.v'
      - 'proof/Phil/Surface/GrammarDeterminacyNullableFirst.v'
      - 'proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v'
      - 'proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v'
      - 'docs/phase-1/surface-determinacy-simple-resolvers-v1.md'
      - '.github/workflows/phase1-surface-determinacy-simple-resolvers.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/check_phase1_surface_determinacy.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/GrammarDerivation.v'
      - 'proof/Phil/Surface/GrammarDerivationOracle.v'
      - 'proof/Phil/Surface/GrammarDeterminacyCertificate.v'
      - 'proof/Phil/Surface/GrammarDeterminacyNullableFirst.v'
      - 'proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v'
      - 'proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v'
      - 'docs/phase-1/surface-determinacy-simple-resolvers-v1.md'
      - '.github/workflows/phase1-surface-determinacy-simple-resolvers.yml'

permissions:
  contents: read

jobs:
  rocq-simple-resolvers:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Derive exact grammar and overlap certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check
      - name: Compile exact simple overlap resolvers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
      - name: Record resolver proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-determinacy-simple-resolvers
          cp \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDerivation.v \
            proof/Phil/Surface/GrammarDerivationOracle.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDeterminacyNullableFirst.v \
            proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v \
            proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v \
            proof/Phil/Surface/GrammarDeterminacySimpleResolvers.vo \
            surface-determinacy-simple-resolvers/
          sha256sum \
            grammar/phase1-surface.ebnf \
            scripts/derive_phase1_surface_grammar.py \
            scripts/check_phase1_surface_determinacy.py \
            scripts/derive_phase1_surface_determinacy_certificate.py \
            proof/Phil/Surface/Grammar.v \
            proof/Phil/Surface/GrammarDerivation.v \
            proof/Phil/Surface/GrammarDerivationOracle.v \
            proof/Phil/Surface/GrammarDeterminacyCertificate.v \
            proof/Phil/Surface/GrammarDeterminacyNullableFirst.v \
            proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v \
            proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v \
            proof/Phil/Surface/GrammarDeterminacySimpleResolvers.vo \
            > surface-determinacy-simple-resolvers/identities.sha256
          cat surface-determinacy-simple-resolvers/identities.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-surface-determinacy-simple-resolvers
          path: surface-determinacy-simple-resolvers
          if-no-files-found: error
