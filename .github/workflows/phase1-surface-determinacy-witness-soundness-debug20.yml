name: Phase 1 Surface Determinacy Witness Soundness Debug 20

on:
  pull_request:

permissions:
  contents: read

jobs:
  rocq-witness-soundness-debug20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write

      - name: Apply abstracted FIRST step diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          history = Path('.github/debug-workflow-history')
          workflows = Path('.github/workflows')
          for archived in history.glob('phase1-surface-determinacy-witness-soundness-debug*.yml'):
              (workflows / archived.name).write_text(archived.read_text())

          workflow = Path('.github/workflows/phase1-surface-determinacy-witness-soundness-debug19.yml').read_text()
          marker = workflow.index('- name: Apply member-based FIRST alternative diagnostic')
          start = workflow.index('          from pathlib import Path', marker)
          end = workflow.index('\n          PY', start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<existing-debug19-diagnostics>', 'exec'), {})

          path = Path('proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v')
          source = path.read_text()
          step_start = source.index('Lemma computed_first_sem_sound_step :')
          step_end = source.index('\nTheorem computed_first_sem_sound :', step_start)

          replacement = r'''Lemma computed_first_sem_sound_step :
            forall token fuel,
              (forall expression,
                ComputedFirstSem token expression ->
                choice_bodies_nonnullable_fuel fuel expression = true ->
                exists tokens,
                  first_expression_fuel
                    fuel
                    phase1_surface_nullable_facts
                    phase1_surface_first_facts
                    expression = Some tokens /\
                  token_mem token tokens = true) ->
              forall expression,
                ComputedFirstSem token expression ->
                choice_bodies_nonnullable_fuel (S fuel) expression = true ->
                exists tokens,
                  first_expression_fuel
                    (S fuel)
                    phase1_surface_nullable_facts
                    phase1_surface_first_facts
                    expression = Some tokens /\
                  token_mem token tokens = true.
          Proof.
            intros token fuel IH expression Hsem Hsafe.
            destruct Hsem as
              [literal Htoken
              | class_name Htoken
              | name Hmem
              | items Hitems
              | items Hitems
              | body Hbody
              | body Hbody].
            - abstract (
                subst token;
                exists [OverlapLiteral literal];
                split;
                [ reflexivity
                | unfold token_mem;
                  rewrite overlap_token_eqb_refl;
                  reflexivity ]).
            - abstract (
                subst token;
                exists [OverlapLexicalClass class_name];
                split;
                [ reflexivity
                | unfold token_mem;
                  rewrite overlap_token_eqb_refl;
                  reflexivity ]).
            - abstract (
                exists (lookup_tokens name phase1_surface_first_facts);
                split;
                [ reflexivity
                | exact Hmem ]).
            - abstract (
                simpl in Hsafe;
                exact
                  (computed_first_sequence_sem_sound
                    token fuel items IH Hitems Hsafe)).
            - abstract (
                simpl in Hsafe;
                exact
                  (computed_first_alternative_sem_sound
                    token fuel items IH Hitems Hsafe)).
            - abstract (
                simpl in Hsafe;
                apply andb_true_iff in Hsafe as [_ Hbody_safe];
                exact (IH body Hbody Hbody_safe)).
            - abstract (
                simpl in Hsafe;
                apply andb_true_iff in Hsafe as [_ Hbody_safe];
                exact (IH body Hbody Hbody_safe)).
          Qed.
          '''

          source = source[:step_start] + replacement + source[step_end:]
          path.write_text(source)
          print(f'generated witness proof characters: {len(source)}')
          PY

      - name: Compile witness soundness with forced timeout
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationLookahead.v
          timeout -k 5s 90s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
