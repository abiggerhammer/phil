name: Phase 1 Data Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: DATA-001 unrestricted record mode conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataModeMain.hs
      - name: DATA-002 linear record construction conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1LinearRecordConstructionMain.hs
      - name: DATA-003 duplicate restricted field conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DuplicateRestrictedFieldMain.hs
      - name: DATA-004 consuming record destruction conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConsumingRecordDestructionMain.hs
      - name: DATA-005 missing linear field disposition conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1MissingLinearFieldDispositionMain.hs
      - name: DATA-006 borrowed restricted aggregate inspection conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1BorrowedAggregateInspectionMain.hs
      - name: DATA-007 conservative sum mode conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConservativeSumModeMain.hs
      - name: DATA-004/007 consuming sum payload restoration conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConsumingSumMatchMain.hs
      - name: DATA-008 continuing sum arm linear leak conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1SumArmLinearLeakMain.hs
      - name: DATA-009 generic mode propagation conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericModePropagationMain.hs
      - name: DATA-010 nominal identity and transparent alias conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataIdentityMain.hs
      - name: DATA-011 explicit operation contract conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataOperationContractMain.hs
      - name: DATA-013 explicit branch-dependent resource sum conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ExplicitBranchResourceSumMain.hs
      - name: DATA-014 explicit nominal mode strengthening conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1NominalModeStrengtheningMain.hs
      - name: DATA-016 legal affine omission conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1AffineOmissionMain.hs
