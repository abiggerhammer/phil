name: Phase 1 Data Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - name: DATA-001 unrestricted record mode conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DataModeMain.hs
      - name: DATA-002 linear record construction conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1LinearRecordConstructionMain.hs
      - name: DATA-003 duplicate restricted field conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DuplicateRestrictedFieldMain.hs
      - name: DATA-004 consuming record destruction conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConsumingRecordDestructionMain.hs
      - name: DATA-005 missing linear field disposition conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1MissingLinearFieldDispositionMain.hs
      - name: DATA-006 legal affine omission conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1AffineOmissionMain.hs
      - name: DATA-007 conservative sum mode conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConservativeSumModeMain.hs
      - name: DATA-008 consuming sum match conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ConsumingSumMatchMain.hs
      - name: DATA-009 generic mode propagation conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericModePropagationMain.hs
