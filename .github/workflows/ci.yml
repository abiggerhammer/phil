name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct

      - name: Verify Phase 0 LLVM locally
        shell: bash
        run: |
          cabal run phil-llvm-phase0 > phase0-upload.ll
          if command -v llvm-as-18 >/dev/null 2>&1; then
            LLVM_AS=llvm-as-18
          elif command -v llvm-as >/dev/null 2>&1 && llvm-as --version | head -n 1 | grep -Eq 'LLVM version 18([.]|$)'; then
            LLVM_AS=llvm-as
          else
            echo "LLVM 18 llvm-as is required by the Phase 0 target profile" >&2
            exit 1
          fi
          "$LLVM_AS" phase0-upload.ll -o /dev/null
          "$LLVM_AS" --version | head -n 1
