name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build
        run: cabal build all --enable-tests

      - name: Haskell lint
        run: cabal build all --enable-tests --project-file=cabal.project.ci

      - name: Test
        run: cabal test all --test-show-details=direct

      - name: Phase 1 import noninterference conformance
        run: cabal exec -- runghc -isrc test/Phase1ImportNoninterferenceMain.hs

      - name: Phase 1 architecture instantiation conformance
        run: cabal exec -- runghc -isrc test/Phase1ArchitectureInstantiationMain.hs

      - name: Phase 1 architecture rename identity conformance
        run: cabal exec -- runghc -isrc test/Phase1ArchitectureRenameIdentityMain.hs

      - name: Phase 1 architecture interface validity conformance
        run: cabal exec -- runghc -isrc test/Phase1ArchitectureInterfaceValidityMain.hs

      - name: Phase 1 architecture definition replacement conformance
        run: cabal exec -- runghc -isrc test/Phase1ArchitectureDefinitionReplacementMain.hs

      - name: Phase 1 architecture sibling noninterference conformance
        run: cabal exec -- runghc -isrc test/Phase1ArchitectureSiblingNoninterferenceMain.hs

      - name: Phase 1 architecture provider replacement conformance
        run: cabal exec -- runghc -isrc test/Phase1ArchitectureProviderReplacementMain.hs

      - name: Phase 1 protocol exact action conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProtocolExactActionMain.hs

      - name: Phase 1 protocol identity separation conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProtocolIdentitySeparationMain.hs

      - name: Phase 1 protocol generic endpoint conformance
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProtocolGenericEndpointMain.hs

      - name: Phase 1 generic structural conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericStructuralMain.hs

      - name: Phase 1 generic requirement stability conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericRequirementsMain.hs

      - name: Phase 1 generic instantiation conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericInstantiationMain.hs

      - name: Phase 1 generic identity conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericIdentityMain.hs

      - name: Phase 1 callable capture and effect conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableCaptureEffectsMain.hs

      - name: Phase 1 callable transition conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableTransitionsMain.hs

      - name: Phase 1 callable effect bound conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableEffectBoundMain.hs

      - name: Phase 1 callable scope conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableScopeMain.hs

      - name: Phase 1 callable refinement conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableRefinementMain.hs

      - name: Phase 1 callable recursion conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableRecursionMain.hs

      - name: Phase 1 foreign callable qualification conformance
        run: cabal exec -- runghc -isrc test/Phase1ForeignCallableQualificationMain.hs

      - name: Phase 1 callable lowering conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableLoweringMain.hs

      - name: Phase 1 authority possession conformance
        run: cabal exec -- runghc -isrc test/Phase1AuthorityPossessionMain.hs

      - name: Phase 1 authority attenuation conformance
        run: cabal exec -- runghc -isrc test/Phase1AuthorityAttenuationMain.hs

      - name: Phase 1 authority confinement conformance
        run: cabal exec -- runghc -isrc test/Phase1AuthorityConfinementMain.hs

      - name: Phase 1 provider semantic qualification conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderQualificationMain.hs

      - name: Phase 1 provider state simulation conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderStateQualificationMain.hs

      - name: Phase 1 provider-wide law conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderLawQualificationMain.hs

      - name: Phase 1 provider lifecycle conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderLifecycleQualificationMain.hs

      - name: Phase 1 provider authority confinement conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderAuthorityQualificationMain.hs

      - name: Phase 1 provider evidence competence conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderEvidenceQualificationMain.hs

      - name: Phase 1 provider qualification identity conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderQualificationIdentityMain.hs

      - name: Phase 1 provider qualification dependency conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderQualificationDependencyMain.hs

      - name: Phase 1 provider cross-target reuse conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderQualificationTargetReuseMain.hs

      - name: Phase 1 provider admission applicability conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderQualificationApplicabilityMain.hs

      - name: Phase 1 provider replacement qualification conformance
        run: cabal exec -- runghc -isrc test/Phase1ProviderReplacementQualificationMain.hs

      - name: Phase 1 Steve provider qualification conformance
        run: cabal exec -- runghc -isrc test/Phase1SteveProviderQualificationMain.hs

      - name: Phase 1 generic Systems/StageContract conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericSystemsStageMain.hs

      - name: Phase 1 Systems semantic subject correspondence
        run: cabal exec -- runghc -isrc test/Phase1SubjectCorrespondenceMain.hs

      - name: Phase 1 Systems provider call correspondence
        run: cabal exec -- runghc -isrc test/Phase1ProviderCallCorrespondenceMain.hs

      - name: Phase 1 Systems authority/effect correspondence
        run: cabal exec -- runghc -isrc test/Phase1AuthorityEffectCorrespondenceMain.hs

      - name: Phase 1 Systems branch resource/failure correspondence
        run: cabal exec -- runghc -isrc test/Phase1BranchResourceFailureMain.hs

      - name: Phase 1 Systems control-state projection
        run: cabal exec -- runghc -isrc test/Phase1ControlStateProjectionMain.hs

      - name: Phase 1 Systems protocol state correspondence
        run: cabal exec -- runghc -isrc test/Phase1ProtocolStateCorrespondenceMain.hs

      - name: Phase 1 Systems boundary owner/length/commit correspondence
        run: cabal exec -- runghc -isrc test/Phase1BoundaryCommitCorrespondenceMain.hs

      - name: Phase 1 Systems evidence subject transfer
        run: cabal exec -- runghc -isrc test/Phase1EvidenceSubjectTransferMain.hs

      - name: Phase 1 Systems evidence erasure
        run: cabal exec -- runghc -isrc test/Phase1EvidenceErasureMain.hs

      - name: Phase 1 Systems assumption dependency
        run: cabal exec -- runghc -isrc test/Phase1AssumptionDependencyMain.hs

      - name: Phase 1 Systems target strengthening
        run: cabal exec -- runghc -isrc test/Phase1TargetStrengtheningMain.hs

      - name: Phase 1 Systems runtime claim binding
        run: cabal exec -- runghc -isrc test/Phase1RuntimeClaimBindingMain.hs

      - name: Phase 1 Systems primitive reuse
        run: cabal exec -- runghc -isrc test/Phase1RuntimePrimitiveReuseMain.hs

      - name: Phase 1 Systems staging effects
        run: cabal exec -- runghc -isrc test/Phase1StagingEffectMain.hs

      - name: Phase 1 Systems cost attribution
        run: cabal exec -- runghc -isrc test/Phase1CostAttributionMain.hs

      - name: Phase 1 Systems next-stage requirements
        run: cabal exec -- runghc -isrc test/Phase1NextStageRequirementMain.hs

      - name: Phase 1 Systems final revision closure
        run: cabal exec -- runghc -isrc test/Phase1StageClosureMain.hs

      - name: Verify LLVM and run Phil programs
        run: bash scripts/ci/phase0-llvm-runtime-smoke.sh
