name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build
        run: cabal build all --enable-tests

      - name: Haskell lint
        run: cabal build all --enable-tests --project-file=cabal.project.ci

      - name: Test
        run: cabal test all --test-show-details=direct

      - name: Phase 1 import noninterference conformance
        run: cabal exec -- runghc -isrc test/Phase1ImportNoninterferenceMain.hs

      - name: Phase 1 architecture instantiation conformance
        run: cabal exec -- runghc -isrc test/Phase1ArchitectureInstantiationMain.hs

      - name: Phase 1 generic structural conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericStructuralMain.hs

      - name: Phase 1 generic requirement stability conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericRequirementsMain.hs

      - name: Phase 1 generic instantiation conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericInstantiationMain.hs

      - name: Phase 1 generic identity conformance
        run: cabal exec -- runghc -isrc test/Phase1GenericIdentityMain.hs

      - name: Phase 1 callable capture and effect conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableCaptureEffectsMain.hs

      - name: Phase 1 callable transition conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableTransitionsMain.hs

      - name: Phase 1 callable effect bound conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableEffectBoundMain.hs

      - name: Phase 1 callable scope conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableScopeMain.hs

      - name: Phase 1 callable refinement conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableRefinementMain.hs

      - name: Phase 1 callable recursion conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableRecursionMain.hs

      - name: Phase 1 foreign callable qualification conformance
        run: cabal exec -- runghc -isrc test/Phase1ForeignCallableQualificationMain.hs

      - name: Phase 1 callable lowering conformance
        run: cabal exec -- runghc -isrc test/Phase1CallableLoweringMain.hs

      - name: Phase 1 authority possession conformance
        run: cabal exec -- runghc -isrc test/Phase1AuthorityPossessionMain.hs

      - name: Phase 1 authority attenuation conformance
        run: cabal exec -- runghc -isrc test/Phase1AuthorityAttenuationMain.hs

      - name: Phase 1 authority confinement conformance
        run: cabal exec -- runghc -isrc test/Phase1AuthorityConfinementMain.hs

      - name: Verify LLVM and run Phil programs
        run: bash scripts/ci/phase0-llvm-runtime-smoke.sh
