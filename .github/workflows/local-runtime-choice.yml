name: Local Runtime Choice

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Verify.hs'
      - 'src/Phil/Systems/Dataflow.hs'
      - 'src/Phil/Systems/LocalRuntimeChoice.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'test/LocalRuntimeChoiceMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/local-runtime-choice.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/Systems/IR.hs'
      - 'src/Phil/Systems/Verify.hs'
      - 'src/Phil/Systems/Dataflow.hs'
      - 'src/Phil/Systems/LocalRuntimeChoice.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'test/LocalRuntimeChoiceMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/local-runtime-choice.yml'

permissions:
  contents: read

jobs:
  local-runtime-choice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build focused suite
        run: cabal build phil-local-runtime-choice-tests
      - name: Run focused suite
        run: cabal test phil-local-runtime-choice-tests
