name: FSEM-02 Restricted Source Transfer Early Preflight

on:
  push:
    branches:
      - formal-semantics/fsem02-restricted-source-payload-transfer
    paths:
      - 'src/Phil/Surface/GrammarV1/ComponentRestrictedRendezvous.hs'
      - 'test/Phase1FSEM02RestrictedSourceTransferMain.hs'
      - 'proof/Phil/Core/FSEM02RestrictedSourceTransfer.v'
      - 'test/fixtures/fsem02-restricted-source-transfer-v1/**'
      - 'phil-core.cabal'
      - '.github/workflows/fsem02-restricted-source-transfer-preflight.yml'
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/ComponentRestrictedRendezvous.hs'
      - 'test/Phase1FSEM02RestrictedSourceTransferMain.hs'
      - 'proof/Phil/Core/FSEM02RestrictedSourceTransfer.v'
      - 'test/fixtures/fsem02-restricted-source-transfer-v1/**'
      - 'phil-core.cabal'
      - '.github/workflows/fsem02-restricted-source-transfer-preflight.yml'

concurrency:
  group: fsem02-restricted-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-restricted-source-and-owner-transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - run: bash scripts/ci/cabal-update-retry.sh
      - run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Actual parsed restricted source, activation-derived payload transfer and exact failures
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1FSEM02RestrictedSourceTransferMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1FSEM02RestrictedSourceTransferMain.hs
          sha256sum src/Phil/Surface/GrammarV1/ComponentRestrictedRendezvous.hs test/Phase1FSEM02RestrictedSourceTransferMain.hs test/fixtures/fsem02-restricted-source-transfer-v1/*.phil
  rocq:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Exact dependencies and bounded restricted-source transfer proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Core/ProcessJoin.v \
            proof/Phil/Core/ProcessTerminal.v \
            proof/Phil/Core/ArchitectureIdentity.v \
            proof/Phil/Core/ArchitectureInstantiation.v \
            proof/Phil/Core/ProviderReplacementQualification.v \
            proof/Phil/Core/ArchitectureRealization.v \
            proof/Phil/Systems/FactDisposition.v \
            proof/Phil/Assurance/ValidityScope.v \
            proof/Phil/Core/SystemsStageClosure.v \
            proof/Phil/Core/SystemsGenericLowering.v \
            proof/Phil/Core/ConcurrencySemantics.v \
            proof/Phil/Core/SessionStep.v \
            proof/Phil/Core/FSEM02ProtocolHeadProgression.v \
            proof/Phil/Core/FSEM02JointSourceChoice.v \
            proof/Phil/Core/FSEM02StatefulSourceChoice.v \
            proof/Phil/Core/FSEM02RestrictedSourceTransfer.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' proof/Phil/Core/FSEM02RestrictedSourceTransfer.v; then exit 1; fi
          sha256sum proof/Phil/Core/FSEM02RestrictedSourceTransfer.v proof/Phil/Core/FSEM02RestrictedSourceTransfer.vo
