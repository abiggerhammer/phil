name: Phase 1 Deployment Qualification Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Assurance/DeploymentQualification.v'
      - 'proof/Phil/Assurance/DeploymentQualificationImplementation.v'
      - 'proof/Phil/Assurance/DeploymentQualificationImplementationExtraction.v'
      - 'src/Phil/Assurance/DeploymentQualification.hs'
      - 'test/Phase1DeploymentQualificationMain.hs'
      - 'app/DeploymentQualificationDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/deployment-qualification-proof-v1.md'
      - 'docs/phase-1/deployment-qualification-implementation-refinement-v1.md'
      - '.github/workflows/phase1-deployment-qualification-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Assurance/DeploymentQualification.v'
      - 'proof/Phil/Assurance/DeploymentQualificationImplementation.v'
      - 'proof/Phil/Assurance/DeploymentQualificationImplementationExtraction.v'
      - 'src/Phil/Assurance/DeploymentQualification.hs'
      - 'test/Phase1DeploymentQualificationMain.hs'
      - 'app/DeploymentQualificationDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/deployment-qualification-proof-v1.md'
      - 'docs/phase-1/deployment-qualification-implementation-refinement-v1.md'
      - '.github/workflows/phase1-deployment-qualification-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-deployment-qualification-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-DEPLOY-QUAL-001 and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/DeploymentQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/DeploymentQualificationImplementation.v
          rm -f DeploymentQualificationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/DeploymentQualificationImplementationExtraction.v
          test -s DeploymentQualificationKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-qualification-proof
          cp \
            proof/Phil/Assurance/DeploymentQualification.v \
            proof/Phil/Assurance/DeploymentQualification.vo \
            proof/Phil/Assurance/DeploymentQualificationImplementation.v \
            proof/Phil/Assurance/DeploymentQualificationImplementation.vo \
            DeploymentQualificationKernel.hs \
            deployment-qualification-proof/
          sha256sum \
            proof/Phil/Assurance/DeploymentQualification.v \
            proof/Phil/Assurance/DeploymentQualification.vo \
            proof/Phil/Assurance/DeploymentQualificationImplementation.v \
            proof/Phil/Assurance/DeploymentQualificationImplementation.vo \
            DeploymentQualificationKernel.hs \
            src/Phil/Assurance/DeploymentQualification.hs \
            test/Phase1DeploymentQualificationMain.hs \
            app/DeploymentQualificationDecisionCorrespondenceMain.hs \
            > deployment-qualification-proof/PHIL-DEPLOY-QUAL-001.implementation.sha256
          {
            echo 'obligation=PHIL-DEPLOY-QUAL-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat deployment-qualification-proof/PHIL-DEPLOY-QUAL-001.implementation.sha256
          } > deployment-qualification-proof/PHIL-DEPLOY-QUAL-001.implementation-certificate.txt
          cat deployment-qualification-proof/PHIL-DEPLOY-QUAL-001.implementation-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-deployment-qualification-proof
          path: deployment-qualification-proof
          if-no-files-found: error

  verify-deployment-qualification-correspondence:
    needs: rocq-deployment-qualification-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-deployment-qualification-proof
          path: deployment-qualification-proof
      - name: Check and execute extracted Deployment Qualification controls
        run: |
          set -euo pipefail
          cp deployment-qualification-proof/DeploymentQualificationKernel.hs .
          cabal exec -- ghc -i. -Wall -Werror -Wno-unused-imports -fno-code \
            DeploymentQualificationKernel.hs \
            app/DeploymentQualificationDecisionCorrespondenceMain.hs
          cabal exec -- runghc -i. -Wall -Werror -Wno-unused-imports \
            app/DeploymentQualificationDecisionCorrespondenceMain.hs
      - name: Strict typecheck unchanged deployment qualification implementation and corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Assurance/DeploymentQualification.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1DeploymentQualificationMain.hs
      - name: Re-run unchanged DEP-003 through DEP-005 corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1DeploymentQualificationMain.hs
