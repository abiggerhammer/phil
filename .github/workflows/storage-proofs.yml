name: Storage Proofs

on:
  pull_request:
    paths:
      - 'proof/**'
      - 'src/Phil/Assurance/RocqStorage.hs'
      - 'src/Phil/LLVM/StorageProofCertification.hs'
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/LLVM/Storage.hs'
      - 'src/Phil/LLVM/StorageCertification.hs'
      - 'app/StorageProofCertificationMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/storage-proofs.yml'
  push:
    branches:
      - main
    paths:
      - 'proof/**'
      - 'src/Phil/Assurance/RocqStorage.hs'
      - 'src/Phil/LLVM/StorageProofCertification.hs'
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/LLVM/Storage.hs'
      - 'src/Phil/LLVM/StorageCertification.hs'
      - 'app/StorageProofCertificationMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/storage-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-storage:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check complete proof corpus including storage
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Session.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Process.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionLabel.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionStep.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Recognition.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/RecognitionLoan.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProcessTerminal.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Discharge.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/DecisionSound.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionRec.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Focusing.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Elaboration.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Checking.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/ScopeJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/FreshOwnership.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SystemsProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/Manifest.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/EvidenceUse.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Ownership.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Runtime.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/ScalarDataflow.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/RecognizedRecord.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/DigestValidation.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/Storage.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Identity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Preservation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/FieldProjection.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Strengthening.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Certification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Scalar.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordABI.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RuntimeSymbolIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/RecognizedRecordCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceive.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/ExactReceiveCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/DigestValidation.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/DigestValidationCertification.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/Storage.v
          rocq c -Q proof/Phil Phil proof/Phil/LLVM/StorageCertification.v

      - name: Stage exact checked proof objects
        run: |
          mkdir -p rocq-storage/systems-storage
          mkdir -p rocq-storage/llvm-storage
          mkdir -p rocq-storage/systems-digest-validation
          mkdir -p rocq-storage/llvm-digest-validation
          mkdir -p rocq-storage/systems-recognized-record
          mkdir -p rocq-storage/llvm-exact-receive
          mkdir -p rocq-storage/llvm-recognized-record-abi
          mkdir -p rocq-storage/llvm-runtime-symbol-identity
          cp proof/Phil/Systems/Storage.v rocq-storage/systems-storage/Storage.v
          cp proof/Phil/Systems/Storage.vo rocq-storage/systems-storage/Storage.vo
          cp proof/Phil/LLVM/Storage.v rocq-storage/llvm-storage/Storage.v
          cp proof/Phil/LLVM/Storage.vo rocq-storage/llvm-storage/Storage.vo
          cp proof/Phil/Systems/DigestValidation.v rocq-storage/systems-digest-validation/DigestValidation.v
          cp proof/Phil/Systems/DigestValidation.vo rocq-storage/systems-digest-validation/DigestValidation.vo
          cp proof/Phil/LLVM/DigestValidation.v rocq-storage/llvm-digest-validation/DigestValidation.v
          cp proof/Phil/LLVM/DigestValidation.vo rocq-storage/llvm-digest-validation/DigestValidation.vo
          cp proof/Phil/Systems/RecognizedRecord.v rocq-storage/systems-recognized-record/RecognizedRecord.v
          cp proof/Phil/Systems/RecognizedRecord.vo rocq-storage/systems-recognized-record/RecognizedRecord.vo
          cp proof/Phil/LLVM/ExactReceive.v rocq-storage/llvm-exact-receive/ExactReceive.v
          cp proof/Phil/LLVM/ExactReceive.vo rocq-storage/llvm-exact-receive/ExactReceive.vo
          cp proof/Phil/LLVM/RecognizedRecordABI.v rocq-storage/llvm-recognized-record-abi/RecognizedRecordABI.v
          cp proof/Phil/LLVM/RecognizedRecordABI.vo rocq-storage/llvm-recognized-record-abi/RecognizedRecordABI.vo
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.v rocq-storage/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v
          cp proof/Phil/LLVM/RuntimeSymbolIdentity.vo rocq-storage/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo

      - name: Upload exact checked proof objects
        uses: actions/upload-artifact@v4
        with:
          name: rocq-storage-checked-proof-objects
          path: rocq-storage/
          if-no-files-found: error
          retention-days: 14

  certify-storage:
    needs: rocq-storage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Download exact checked proof objects
        uses: actions/download-artifact@v4
        with:
          name: rocq-storage-checked-proof-objects
          path: rocq-storage

      - name: Build proof-bound storage certifier
        run: cabal build phil-certify-storage

      - name: Produce storage proof and final certificates
        run: |
          mkdir -p storage-certificates
          CERTIFIER="$(cabal list-bin phil-certify-storage)"
          "$CERTIFIER" \
            rocq-storage/systems-storage/Storage.v \
            rocq-storage/systems-storage/Storage.vo \
            rocq-storage/llvm-storage/Storage.v \
            rocq-storage/llvm-storage/Storage.vo \
            rocq-storage/systems-digest-validation/DigestValidation.v \
            rocq-storage/systems-digest-validation/DigestValidation.vo \
            rocq-storage/llvm-digest-validation/DigestValidation.v \
            rocq-storage/llvm-digest-validation/DigestValidation.vo \
            rocq-storage/systems-recognized-record/RecognizedRecord.v \
            rocq-storage/systems-recognized-record/RecognizedRecord.vo \
            rocq-storage/llvm-exact-receive/ExactReceive.v \
            rocq-storage/llvm-exact-receive/ExactReceive.vo \
            rocq-storage/llvm-recognized-record-abi/RecognizedRecordABI.v \
            rocq-storage/llvm-recognized-record-abi/RecognizedRecordABI.vo \
            rocq-storage/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.v \
            rocq-storage/llvm-runtime-symbol-identity/RuntimeSymbolIdentity.vo \
            storage-certificates/PHIL-SYS-STORAGE-001.rocq.cert \
            storage-certificates/PHIL-LLVM-STORAGE-001.rocq.cert \
            storage-certificates/PHIL-SYS-DIGEST-001.rocq.cert \
            storage-certificates/PHIL-LLVM-DIGEST-001.rocq.cert \
            storage-certificates/PHIL-SYS-RECORD-001.rocq.cert \
            storage-certificates/PHIL-LLVM-EXACT-RECV-001.rocq.cert \
            storage-certificates/PHIL-LLVM-REC-ABI-001.rocq.cert \
            storage-certificates/PHIL-LLVM-RUNTIME-SYM-001.rocq.cert \
            storage-certificates/PHIL-LLVM-CERT-004.cert \
            storage-certificates/PHIL-LLVM-CERT-005.cert
          for certificate in storage-certificates/*; do
            echo "===== ${certificate} ====="
            cat "${certificate}"
            sha256sum "${certificate}"
          done

      - name: Upload storage certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phil-storage-proof-bound-certification
          path: storage-certificates/*
          if-no-files-found: error
          retention-days: 30
