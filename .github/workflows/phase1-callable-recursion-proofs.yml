name: Phase 1 Callable Recursion Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Core/CallableRecursion.hs'
      - 'test/Phase1CallableRecursionMain.hs'
      - 'test/Phase1CallableRefinementMain.hs'
      - 'docs/phase-1/callable-recursion-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/CallableMode.v'
      - 'proof/Phil/Core/CallableEffects.v'
      - 'proof/Phil/Core/CallableLifecycle.v'
      - 'proof/Phil/Core/CallableRefinement.v'
      - 'proof/Phil/Core/CallableRecursion.v'
      - 'app/Phase1CallableRecursionCertificationMain.hs'
      - '.github/workflows/phase1-callable-recursion-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/CallableRecursion.hs'
      - 'test/Phase1CallableRecursionMain.hs'
      - 'test/Phase1CallableRefinementMain.hs'
      - 'docs/phase-1/callable-recursion-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/CallableMode.v'
      - 'proof/Phil/Core/CallableEffects.v'
      - 'proof/Phil/Core/CallableLifecycle.v'
      - 'proof/Phil/Core/CallableRefinement.v'
      - 'proof/Phil/Core/CallableRecursion.v'
      - 'app/Phase1CallableRecursionCertificationMain.hs'
      - '.github/workflows/phase1-callable-recursion-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-callable-recursion:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-CALL-REC-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLifecycle.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRefinement.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRecursion.v
          mkdir -p phase1-callable-recursion-proof
          cp proof/Phil/Core/CallableRecursion.v proof/Phil/Core/CallableRecursion.vo phase1-callable-recursion-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-callable-recursion-proof
          path: phase1-callable-recursion-proof
          if-no-files-found: error

  certify-phase1-callable-recursion:
    needs: rocq-phase1-callable-recursion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
      - name: Typecheck certifier
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code app/Phase1CallableRecursionCertificationMain.hs
      - name: Re-run callable recursion correspondence
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1CallableRefinementMain.hs
          cabal exec -- runghc -isrc test/Phase1CallableRecursionMain.hs
      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-callable-recursion-proof
          path: phase1-callable-recursion-proof
      - name: Emit PHIL-CALL-REC-001 certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-callable-recursion-certification
          cabal exec -- runghc -isrc app/Phase1CallableRecursionCertificationMain.hs \
            phase1-callable-recursion-proof/CallableRecursion.v \
            phase1-callable-recursion-proof/CallableRecursion.vo \
            phase1-callable-recursion-certification/PHIL-CALL-REC-001.rocq.cert
          sha256sum \
            src/Phil/Core/CallableRecursion.hs \
            test/Phase1CallableRefinementMain.hs \
            test/Phase1CallableRecursionMain.hs \
            docs/phase-1/callable-recursion-v1.md \
            proof/Phil/Core/CallableRefinement.v \
            proof/Phil/Core/CallableRecursion.v \
            app/Phase1CallableRecursionCertificationMain.hs \
            > phase1-callable-recursion-certification/PHIL-CALL-REC-001.correspondence.sha256
          cat phase1-callable-recursion-certification/PHIL-CALL-REC-001.rocq.cert
          sha256sum phase1-callable-recursion-certification/PHIL-CALL-REC-001.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-callable-recursion-proof-certification
          path: phase1-callable-recursion-certification
          if-no-files-found: error
