name: Temporary SURF-005 test migration

on:
  push:
    branches:
      - phase1-surf-005-remove-ambiguities

permissions:
  contents: write

jobs:
  migrate-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-005-remove-ambiguities
          fetch-depth: 0
      - name: Migrate embedded Grammar-v1 source
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/migrate_tests.py
          python3 /tmp/migrate_tests.py
          rm .github/workflows/_temporary-surf005-test-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/Phase1GrammarV1*Main.hs .github/workflows/_temporary-surf005-test-migrate.yml
          git commit -m 'Migrate Grammar-v1 tests to determinate syntax'
          git push origin HEAD:phase1-surf-005-remove-ambiguities
