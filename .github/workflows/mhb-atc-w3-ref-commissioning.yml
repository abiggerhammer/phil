name: MHB ATC W3 Protected Ref Trial (Manual, Source Disabled)

# No automated event ever has worker/publisher credentials.
# Source policy live_authorized=false; repo runtime variable is OFF by default.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan reads only; run is separately source- and variable-gated"
        type: choice
        required: true
        default: plan
        options: [plan, run, cleanup]
      nonce:
        description: "Fresh, never-used 12-lowercase-hex nonce"
        type: string
        required: true
      confirm:
        description: "PLAN_ONLY or separately authorized W3 protected-ref acknowledgment"
        type: string
        required: true
        default: PLAN_ONLY
      original_run_id:
        description: "Original owner/main run ID; mandatory only for cleanup mode"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: mhb-atc-admission-global
  queue: max
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  MHB_ATC_W3_REF_TRIAL_ENABLED: ${{ vars.MHB_ATC_W3_REF_TRIAL_ENABLED }}
  MHB_ATC_WORKER_BROKER_ENABLED: ${{ vars.MHB_ATC_WORKER_BROKER_ENABLED }}
  MHB_ATC_IMMUTABLE_HEADS_ENABLED: ${{ vars.MHB_ATC_IMMUTABLE_HEADS_ENABLED }}
  MHB_ATC_AUTO_ADMIT_ENABLED: ${{ vars.MHB_ATC_AUTO_ADMIT_ENABLED }}
  MHB_ATC_PHASE2_STAGE_BRIDGE_ENABLED: ${{ vars.MHB_ATC_PHASE2_STAGE_BRIDGE_ENABLED }}
  W3_CONFIRM: ${{ inputs.confirm }}

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'abiggerhammer/phil' &&
      github.actor == 'abiggerhammer' &&
      github.triggering_actor == 'abiggerhammer' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted dispatch SHA without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Prepare a clean exact local main
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Download authenticated original-run binding for recovery only
        if: inputs.mode == 'cleanup'
        uses: actions/download-artifact@v4
        with:
          name: mhb-atc-w3-origin
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/w3-recovery

      - name: Read-only W3 preflight; run requires both dormant-source and variable switches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          NONCE: ${{ inputs.nonce }}
          W3_ORIGIN_RUN_ID: ${{ inputs.original_run_id }}
          W3_ORIGIN_BINDING_FILE: ${{ runner.temp }}/w3-recovery/w3-origin.json
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            plan)
              test "$W3_CONFIRM" = PLAN_ONLY
              python3 scripts/mhb_atc_w3_ref_trial.py plan --nonce "$NONCE"
              ;;
            run)
              test "$W3_CONFIRM" = AUTHORIZE_W3_PROTECTED_REFS_ONLY
              test -z "$W3_ORIGIN_RUN_ID"
              python3 scripts/mhb_atc_w3_ref_trial.py prepare-origin \
                --nonce "$NONCE"
              ;;
            cleanup)
              test "$W3_CONFIRM" = RECOVER_W3_EXACT_REFS_ONLY
              python3 scripts/mhb_atc_w3_ref_trial.py recovery-plan --nonce "$NONCE"
              ;;
            *) echo 'Unexpected commissioning mode' >&2; exit 1 ;;
          esac

      - name: Upload verified nonsecret original lineage before protected token jobs
        if: inputs.mode == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: mhb-atc-w3-origin
          path: ${{ runner.temp }}/w3-origin.json
          if-no-files-found: error
          retention-days: 30

  publisher_seed:
    needs: [prepare]
    if: >-
      needs.prepare.result == 'success' &&
      inputs.mode == 'run' &&
      vars.MHB_ATC_W3_REF_TRIAL_ENABLED == 'true'
    environment: atc-publisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare exact local main
        run: git switch -C main "$GITHUB_SHA"
      - name: Mint publisher-only token for canary/seed
        id: publisher_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MHB_ATC_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.MHB_ATC_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify publisher CREATE and DELETE cleanup, then create exact seed
        env:
          W3_APP_TOKEN: ${{ steps.publisher_token.outputs.token }}
          W3_ACTION_APP_SLUG: ${{ steps.publisher_token.outputs.app-slug }}
          W3_ACTION_INSTALLATION_ID: ${{ steps.publisher_token.outputs.installation-id }}
          NONCE: ${{ inputs.nonce }}
        run: python3 scripts/mhb_atc_w3_ref_trial.py publisher-seed --nonce "$NONCE"
      - name: Preserve sanitized partial publisher seed evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhb-atc-w3-evidence-seed
          path: ${{ runner.temp }}/w3-evidence.json
          if-no-files-found: ignore
          retention-days: 30

  worker_denials:
    needs: [prepare, publisher_seed]
    if: >-
      needs.prepare.result == 'success' &&
      needs.publisher_seed.result == 'success' &&
      inputs.mode == 'run' &&
      vars.MHB_ATC_W3_REF_TRIAL_ENABLED == 'true'
    environment: atc-worker-broker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare exact local main
        run: git switch -C main "$GITHUB_SHA"
      - name: Authenticate worker App numeric ID and full installed grants (JWT GET only)
        env:
          APP_PRIVATE_KEY: ${{ secrets.MHB_ATC_WORKER_APP_PRIVATE_KEY }}
          APP_CLIENT_ID: ${{ vars.MHB_ATC_WORKER_APP_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$APP_PRIVATE_KEY" && test -n "$APP_CLIENT_ID"
          key="$RUNNER_TEMP/atc-w1id-key.pem"
          app="$RUNNER_TEMP/atc-w1id-app.json"
          installed="$RUNNER_TEMP/atc-w1id-installations.json"
          auth_header="$RUNNER_TEMP/atc-w1id-auth-header.txt"
          receipt="$RUNNER_TEMP/atc-w1id-receipt.json"
          cleanup() {
            rm -f "$key" "$app" "$installed" "$auth_header"
            unset APP_JWT APP_PRIVATE_KEY
          }
          trap cleanup EXIT

          # Private key and JWT never enter arguments, URLs, artifact uploads,
          # action outputs, step summaries or logs. Only trusted main runs.
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key"
          unset APP_PRIVATE_KEY
          now="$(date -u +%s)"
          iat="$((now - 60))"
          exp="$((now + 300))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' |
            openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          payload="$(jq -nc --argjson iat "$iat" --argjson exp "$exp" \
            --arg iss "$APP_CLIENT_ID" '{iat:$iat,exp:$exp,iss:$iss}' |
            openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          signature="$(printf '%s' "$header.$payload" |
            openssl dgst -sha256 -sign "$key" -binary |
            openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          APP_JWT="$header.$payload.$signature"
          unset signature
          # Curl reads a 0600-only temporary header file; never put the
          # bearer JWT into a process argument or public step output.
          printf 'Authorization: Bearer %s\n' "$APP_JWT" > "$auth_header"
          unset APP_JWT

          # JWT-authenticated GET /app binds actual numeric App ID and grants
          # to the protected key, not merely a configured numeric variable.
          curl --fail --silent --show-error --proto '=https' \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "@$auth_header" \
            "https://api.github.com/app" > "$app"
          curl --fail --silent --show-error --proto '=https' \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "@$auth_header" \
            "https://api.github.com/app/installations?per_page=100&page=1" > "$installed"
          python3 scripts/mhb_atc_worker_app_identity.py \
            --app-json "$app" --installations-json "$installed" \
            --worker-policy .github/atc-worker-policy.json \
            --configured-client-id "$APP_CLIENT_ID" > "$receipt"
          test "$(jq -r '.decision' "$receipt")" = \
            "authenticated-worker-app-and-installation"
          {
            echo "### MHB-ATC W1-ID authenticated JWT metadata"
            echo "- trusted source: main, manual owner only"
            echo "- App ID/slug and minimal grants: checked against JWT GET /app"
            echo "- installed App ID/slug and selected policy: checked against JWT installations"
            echo "- installation-to-token identity: checked at the next step"
            echo "- key and JWT: not printed or delegated"
            echo "- repository writes: NONE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint worker App token only inside protected broker environment
        id: worker_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MHB_ATC_WORKER_APP_CLIENT_ID }}
          private-key: ${{ secrets.MHB_ATC_WORKER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Four serial exact-ref denials, STOP on first unexpected result
        env:
          W3_APP_TOKEN: ${{ steps.worker_token.outputs.token }}
          W3_ACTION_APP_SLUG: ${{ steps.worker_token.outputs.app-slug }}
          W3_ACTION_INSTALLATION_ID: ${{ steps.worker_token.outputs.installation-id }}
          NONCE: ${{ inputs.nonce }}
        run: python3 scripts/mhb_atc_w3_ref_trial.py worker-negative --nonce "$NONCE"
      - name: Preserve sanitized partial worker denial evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhb-atc-w3-evidence-worker
          path: ${{ runner.temp }}/w3-evidence.json
          if-no-files-found: ignore
          retention-days: 30

  publisher_cleanup:
    needs: [prepare, publisher_seed, worker_denials]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      ((inputs.mode == 'run' &&
        (needs.publisher_seed.result == 'success' ||
         needs.publisher_seed.result == 'failure')) ||
       (inputs.mode == 'cleanup' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'abiggerhammer' &&
        github.triggering_actor == 'abiggerhammer' &&
        github.run_attempt == 1))
    environment: atc-publisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare exact local main
        run: git switch -C main "$GITHUB_SHA"
      - name: Recover original owner-authenticated lineage before publisher token
        if: inputs.mode == 'cleanup'
        uses: actions/download-artifact@v4
        with:
          name: mhb-atc-w3-origin
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/w3-recovery
      - name: GET-only independent cleanup preflight at original source/nonce
        if: inputs.mode == 'cleanup'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          W3_ORIGIN_RUN_ID: ${{ inputs.original_run_id }}
          W3_ORIGIN_BINDING_FILE: ${{ runner.temp }}/w3-recovery/w3-origin.json
          NONCE: ${{ inputs.nonce }}
        run: python3 scripts/mhb_atc_w3_ref_trial.py recovery-plan --nonce "$NONCE"

      - name: Mint publisher token for scoped cleanup regardless of probe result
        id: cleanup_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MHB_ATC_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.MHB_ATC_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Delete only known-SHA disposable canary/create/seed refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          W3_ORIGIN_RUN_ID: ${{ inputs.original_run_id }}
          W3_ORIGIN_BINDING_FILE: ${{ runner.temp }}/w3-recovery/w3-origin.json
          W3_APP_TOKEN: ${{ steps.cleanup_token.outputs.token }}
          W3_ACTION_APP_SLUG: ${{ steps.cleanup_token.outputs.app-slug }}
          W3_ACTION_INSTALLATION_ID: ${{ steps.cleanup_token.outputs.installation-id }}
          NONCE: ${{ inputs.nonce }}
        run: python3 scripts/mhb_atc_w3_ref_trial.py publisher-cleanup --nonce "$NONCE"
      - name: Preserve sanitized publisher cleanup evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhb-atc-w3-evidence-cleanup
          path: ${{ runner.temp }}/w3-evidence.json
          if-no-files-found: ignore
          retention-days: 30
