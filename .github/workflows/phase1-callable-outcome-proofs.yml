name: Phase 1 Callable Outcome Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/CallableOutcomeFidelity.v'
      - 'proof/Phil/Core/CallableOutcomeImplementation.v'
      - 'proof/Phil/Core/CallableOutcomeImplementationExtraction.v'
      - 'docs/phase-1/callable-outcome-fidelity-proof-v1.md'
      - 'docs/phase-1/callable-outcome-implementation-refinement-v1.md'
      - '.github/workflows/phase1-callable-outcome-proofs.yml'
      - 'app/CallableOutcomeDecisionCorrespondenceMain.hs'
      - 'src/Phil/Core/CallableOutcome.hs'
      - 'src/Phil/Core/Callable.hs'
      - 'src/Phil/Core/CallableRefinement.hs'
      - 'src/Phil/Core/Syntax.hs'
      - 'test/Phase1CallableOutcomeFidelityMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/CallableOutcomeFidelity.v'
      - 'proof/Phil/Core/CallableOutcomeImplementation.v'
      - 'proof/Phil/Core/CallableOutcomeImplementationExtraction.v'
      - 'docs/phase-1/callable-outcome-fidelity-proof-v1.md'
      - 'docs/phase-1/callable-outcome-implementation-refinement-v1.md'
      - '.github/workflows/phase1-callable-outcome-proofs.yml'
      - 'app/CallableOutcomeDecisionCorrespondenceMain.hs'
      - 'src/Phil/Core/CallableOutcome.hs'
      - 'src/Phil/Core/Callable.hs'
      - 'src/Phil/Core/CallableRefinement.hs'
      - 'src/Phil/Core/Syntax.hs'
      - 'test/Phase1CallableOutcomeFidelityMain.hs'

permissions:
  contents: read

jobs:
  rocq-callable-outcome-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile Certified predecessor and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableOutcomeFidelity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableOutcomeImplementation.v
          rm -f CallableOutcomeKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableOutcomeImplementationExtraction.v
          test -s CallableOutcomeKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p callable-outcome-proof
          cp \
            proof/Phil/Core/CallableOutcomeFidelity.v \
            proof/Phil/Core/CallableOutcomeFidelity.vo \
            proof/Phil/Core/CallableOutcomeImplementation.v \
            proof/Phil/Core/CallableOutcomeImplementation.vo \
            CallableOutcomeKernel.hs \
            callable-outcome-proof/
          sha256sum \
            proof/Phil/Core/CallableOutcomeFidelity.v \
            proof/Phil/Core/CallableOutcomeFidelity.vo \
            proof/Phil/Core/CallableOutcomeImplementation.v \
            proof/Phil/Core/CallableOutcomeImplementation.vo \
            CallableOutcomeKernel.hs \
            src/Phil/Core/CallableOutcome.hs \
            test/Phase1CallableOutcomeFidelityMain.hs \
            app/CallableOutcomeDecisionCorrespondenceMain.hs \
            > callable-outcome-proof/PHIL-CALL-OUTCOME-001.proof.sha256
          {
            echo 'obligation=PHIL-CALL-OUTCOME-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat callable-outcome-proof/PHIL-CALL-OUTCOME-001.proof.sha256
          } > callable-outcome-proof/PHIL-CALL-OUTCOME-001.proof-certificate.txt
          cat callable-outcome-proof/PHIL-CALL-OUTCOME-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-callable-outcome-proof
          path: callable-outcome-proof
          if-no-files-found: error

  verify-callable-outcome-correspondence:
    needs: rocq-callable-outcome-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-callable-outcome-proof
          path: callable-outcome-proof
      - name: Check and execute extracted CALL-OUTCOME controls
        run: |
          set -euo pipefail
          cp callable-outcome-proof/CallableOutcomeKernel.hs .
          cabal exec -- ghc -i. -Wall -Werror -Wno-unused-imports -fno-code \
            CallableOutcomeKernel.hs \
            app/CallableOutcomeDecisionCorrespondenceMain.hs
          cabal exec -- runghc -i. -Wall -Werror -Wno-unused-imports \
            app/CallableOutcomeDecisionCorrespondenceMain.hs
      - name: Strict typecheck unchanged CALL-018 implementation and corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/CallableOutcome.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1CallableOutcomeFidelityMain.hs
      - name: Re-run unchanged CALL-018 corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1CallableOutcomeFidelityMain.hs
