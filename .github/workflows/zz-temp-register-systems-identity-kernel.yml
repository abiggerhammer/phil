name: Temporary Register Systems Identity Kernel

on:
  push:
    branches: [bind-systems-identity-decisions]
    paths:
      - '.github/workflows/zz-temp-register-systems-identity-kernel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bind-systems-identity-decisions
          fetch-depth: 0
      - name: Register exact kernel module
        shell: python
        run: |
          from pathlib import Path
          path = Path('phil-core.cabal')
          text = path.read_text()
          marker = '      AssuranceValidityScopeKernel\n'
          replacement = marker + '      SystemsIdentityKernel\n'
          assert '      SystemsIdentityKernel\n' not in text
          assert text.count(marker) == 1
          path.write_text(text.replace(marker, replacement, 1))
      - name: Commit registration and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-register-systems-identity-kernel.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phil-core.cabal .github/workflows/zz-temp-register-systems-identity-kernel.yml
          git commit -m 'Register Systems identity kernel with Cabal'
          git push origin HEAD:bind-systems-identity-decisions
