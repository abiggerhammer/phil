name: Temporary INT-006 Runtime Choice Systems

on:
  workflow_dispatch:
  push:
    branches: [phase1-int-006-runtime-choice-systems]
    paths:
      - 'src/Phil/Compiler/RuntimeChoicePayload.hs'
      - 'src/Phil/Compiler/RuntimeChoiceSystems.hs'
      - 'test/Phase1INT006RuntimeChoicePayloadMain.hs'
      - 'test/Phase1INT006RuntimeChoiceSystemsMain.hs'
      - 'src/Phil/Systems/**'
      - 'src/Phil/Examples/Phase1/SystemsWitnesses.hs'
      - '.github/workflows/tmp-int-006-runtime-choice-systems.yml'

permissions:
  contents: read

jobs:
  runtime-choice-systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck INT-006 payload path
        run: |
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1INT006RuntimeChoicePayloadMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1INT006RuntimeChoiceSystemsMain.hs

      - name: Exercise certified payload-plan controls
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006RuntimeChoicePayloadMain.hs

      - name: Exercise Systems payload binding and resealing
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006RuntimeChoiceSystemsMain.hs

      - name: Replay ordinary-source Steve integration
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT001WitnessE2EMain.hs

      - name: Replay real Steve manifest closure
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT005RealWitnessManifestMain.hs
