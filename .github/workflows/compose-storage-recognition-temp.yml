name: Compose Storage and Recognition Failure Semantics

on:
  push:
    branches:
      - storage-failure-detail-temp
    paths:
      - '.github/workflows/compose-storage-recognition-temp.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary composition branch
        uses: actions/checkout@v4
        with:
          ref: storage-failure-detail-temp
          fetch-depth: 0

      - name: Merge current main and resolve additive registration conflicts
        shell: bash
        run: |
          git config user.name phil-semantic-compose
          git config user.email github-actions[bot]@users.noreply.github.com
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            git checkout --ours src/Phil/Systems.hs phil-core.cabal
            git show origin/main:phil-core.cabal > /tmp/main.cabal

            python3 - <<'PY'
          from pathlib import Path

          systems_path = Path('src/Phil/Systems.hs')
          systems = systems_path.read_text()
          if 'module Phil.Systems.RecognitionFailure' not in systems:
              marker = '  , module Phil.Systems.StorageFailure\n  ) where'
              replacement = '  , module Phil.Systems.StorageFailure\n  , module Phil.Systems.RecognitionFailure\n  ) where'
              if marker not in systems:
                  raise SystemExit('Systems export insertion marker missing')
              systems = systems.replace(marker, replacement, 1)
          if 'import Phil.Systems.RecognitionFailure\n' not in systems:
              marker = 'import Phil.Systems.RejectedResponse\n'
              if marker not in systems:
                  raise SystemExit('Systems import insertion marker missing')
              systems = systems.replace(marker, 'import Phil.Systems.RecognitionFailure\n' + marker, 1)
          systems_path.write_text(systems)

          cabal_path = Path('phil-core.cabal')
          cabal = cabal_path.read_text()
          if '      Phil.Systems.RecognitionFailure\n' not in cabal:
              marker = '      Phil.Systems.StorageFailure\n      Phil.LLVM.IR'
              replacement = '      Phil.Systems.StorageFailure\n      Phil.Systems.RecognitionFailure\n      Phil.LLVM.IR'
              if marker not in cabal:
                  raise SystemExit('Cabal module insertion marker missing')
              cabal = cabal.replace(marker, replacement, 1)

          if 'test-suite phil-recognition-failure-detail-tests\n' not in cabal:
              main_cabal = Path('/tmp/main.cabal').read_text()
              start_marker = 'test-suite phil-recognition-failure-detail-tests\n'
              start = main_cabal.find(start_marker)
              if start < 0:
                  raise SystemExit('Recognition test block missing from main')
              next_start = main_cabal.find('\ntest-suite ', start + len(start_marker))
              if next_start < 0:
                  block = main_cabal[start:]
              else:
                  block = main_cabal[start:next_start + 1]
              insertion = 'test-suite phil-hello-policy-validation-abi-tests\n'
              if insertion not in cabal:
                  raise SystemExit('Cabal test insertion marker missing')
              cabal = cabal.replace(insertion, block + insertion, 1)
          cabal_path.write_text(cabal)
          PY

            git add src/Phil/Systems.hs phil-core.cabal
          fi

          git rm .github/workflows/compose-storage-recognition-temp.yml
          git add -A
          git commit -m 'Compose storage and recognition failure semantics'
          git push origin HEAD:storage-failure-detail-temp

# trigger composition after workflow registration
