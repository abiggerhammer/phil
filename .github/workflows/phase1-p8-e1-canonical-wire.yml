name: Phase 1 P8-E1 canonical recursive wire model

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/P8E1CanonicalWireModel.v'
      - 'test/P8E1CanonicalWireMain.hs'
      - 'docs/phase-1/p8-e1-canonical-wire-model-v1.md'
      - '.github/workflows/phase1-p8-e1-canonical-wire.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Verification/P8E1CanonicalWireModel.v'
      - 'test/P8E1CanonicalWireMain.hs'
      - 'docs/phase-1/p8-e1-canonical-wire-model-v1.md'
      - '.github/workflows/phase1-p8-e1-canonical-wire.yml'

permissions:
  contents: read

jobs:
  native-canonical-wire-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build native production and all tests with strict warnings
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Compile real codec differential under GHC -Wall -Werror
        run: cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/P8E1CanonicalWireMain.hs
      - name: Native positive and tamper-negative executions
        run: cabal exec -- runghc -isrc -Wall -Werror test/P8E1CanonicalWireMain.hs
      - name: Preserve original source and release regression checks
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationSourceArtifactClosureMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1StageClosureMain.hs

  rocq-canonical-wire-model:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile C1 to E1 full dependency chain, assumptions, check all objects
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          rocq -v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/P8UnicodeUtf8Model.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/P8D1UnicodeStreamModel.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/P8D2StructuralOrderModel.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/P8E1CanonicalWireModel.v | tee /tmp/p8-e1-assumptions.log
          rocq check -Q proof/Phil Phil Phil.Verification.P8UnicodeUtf8Model
          rocq check -Q proof/Phil Phil Phil.Verification.P8D1UnicodeStreamModel
          rocq check -Q proof/Phil Phil Phil.Verification.P8D2StructuralOrderModel
          rocq check -Q proof/Phil Phil Phil.Verification.P8E1CanonicalWireModel
          sha256sum proof/Phil/Verification/P8UnicodeUtf8Model.vo proof/Phil/Verification/P8D1UnicodeStreamModel.vo proof/Phil/Verification/P8D2StructuralOrderModel.vo proof/Phil/Verification/P8E1CanonicalWireModel.vo /tmp/p8-e1-assumptions.log
