name: Temporary INT-002 Upload witness manifest staging

on:
  push:
    branches: [phase1-int-002-witness-manifests]
    paths:
      - 'scripts/staging/int002_upload_manifest.py'
      - 'test/Phase1INT002UploadManifestMain.hs'
      - 'src/Phil/Verification.hs'
      - 'src/Phil/Verification/Bundle.hs'
      - 'src/Phil/Verification/ManifestClosure.hs'
      - '.github/workflows/tmp-int-002-upload-manifest.yml'

permissions:
  contents: write

jobs:
  upload-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-int-002-witness-manifests
          fetch-depth: 0
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply staged Upload manifest binding repairs
        run: python3 scripts/staging/int002_upload_manifest.py

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck INT-002 Upload manifest boundary
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Verification.hs \
            src/Phil/Verification/Bundle.hs \
            src/Phil/Verification/ManifestClosure.hs \
            test/Phase1INT002UploadManifestMain.hs

      - name: Execute real ordinary-source Upload manifest closure
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT002UploadManifestMain.hs

      - name: Replay generic INT-002 manifest closure corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT002ManifestClosureMain.hs

      - name: Replay INT-001 ordinary witness source path
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001WitnessE2EMain.hs

      - name: Replay assurance and ADR-025 regressions
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/AssuranceMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationNoSilentAssumptionExportMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationPolicySensitiveRuntimeClosureMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationIndependentTargetMain.hs

      - name: Transport validated generic binding repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Phil/Verification.hs \
            src/Phil/Verification/Bundle.hs \
            src/Phil/Verification/ManifestClosure.hs
          git diff --cached --quiet && { echo 'no semantic repairs to transport'; exit 1; }
          git commit -m 'int: bind Upload manifest to ordinary source verification'
          git push origin HEAD:phase1-int-002-witness-manifests
