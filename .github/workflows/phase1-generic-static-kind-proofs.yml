name: Phase 1 Generic Static Kind Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/GenericStaticKind.v'
      - 'proof/Phil/Core/GenericStaticKindImplementation.v'
      - 'proof/Phil/Core/GenericStaticKindImplementationExtraction.v'
      - 'src/Phil/Core/Generic/StaticActual.hs'
      - 'test/Phase1GenericStaticKindMain.hs'
      - 'app/GenericStaticKindDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/generic-static-kind-proof-v1.md'
      - 'docs/phase-1/generic-static-kind-implementation-refinement-v1.md'
      - '.github/workflows/phase1-generic-static-kind-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/GenericStaticKind.v'
      - 'proof/Phil/Core/GenericStaticKindImplementation.v'
      - 'proof/Phil/Core/GenericStaticKindImplementationExtraction.v'
      - 'src/Phil/Core/Generic/StaticActual.hs'
      - 'test/Phase1GenericStaticKindMain.hs'
      - 'app/GenericStaticKindDecisionCorrespondenceMain.hs'
      - 'docs/phase-1/generic-static-kind-proof-v1.md'
      - 'docs/phase-1/generic-static-kind-implementation-refinement-v1.md'
      - '.github/workflows/phase1-generic-static-kind-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-generic-static-kind-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile PHIL-GEN-KIND-001 proof and implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStaticKind.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStaticKindImplementation.v
          rm -f GenericStaticKindKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStaticKindImplementationExtraction.v
          test -s GenericStaticKindKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generic-static-kind-proof
          cp \
            proof/Phil/Core/GenericStaticKind.v \
            proof/Phil/Core/GenericStaticKind.vo \
            proof/Phil/Core/GenericStaticKindImplementation.v \
            proof/Phil/Core/GenericStaticKindImplementation.vo \
            GenericStaticKindKernel.hs \
            generic-static-kind-proof/
          sha256sum \
            proof/Phil/Core/GenericStaticKind.v \
            proof/Phil/Core/GenericStaticKind.vo \
            proof/Phil/Core/GenericStaticKindImplementation.v \
            proof/Phil/Core/GenericStaticKindImplementation.vo \
            GenericStaticKindKernel.hs \
            src/Phil/Core/Generic/StaticActual.hs \
            test/Phase1GenericStaticKindMain.hs \
            app/GenericStaticKindDecisionCorrespondenceMain.hs \
            > generic-static-kind-proof/PHIL-GEN-KIND-001.proof.sha256
          {
            echo 'obligation=PHIL-GEN-KIND-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat generic-static-kind-proof/PHIL-GEN-KIND-001.proof.sha256
          } > generic-static-kind-proof/PHIL-GEN-KIND-001.proof-certificate.txt
          cat generic-static-kind-proof/PHIL-GEN-KIND-001.proof-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-generic-static-kind-proof
          path: generic-static-kind-proof
          if-no-files-found: error

  verify-generic-static-kind-correspondence:
    needs: rocq-generic-static-kind-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-generic-static-kind-proof
          path: generic-static-kind-proof
      - name: Check and execute extracted GEN-KIND controls
        run: |
          set -euo pipefail
          cp generic-static-kind-proof/GenericStaticKindKernel.hs .
          cabal exec -- ghc -i. -Wall -Werror -Wno-unused-imports -fno-code \
            GenericStaticKindKernel.hs \
            app/GenericStaticKindDecisionCorrespondenceMain.hs
          cabal exec -- runghc -i. -Wall -Werror -Wno-unused-imports \
            app/GenericStaticKindDecisionCorrespondenceMain.hs
      - name: Strict typecheck unchanged GEN-013 implementation and corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Core/Generic/StaticActual.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1GenericStaticKindMain.hs
      - name: Re-run unchanged GEN-013 corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GenericStaticKindMain.hs
