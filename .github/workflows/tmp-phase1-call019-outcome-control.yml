name: Temporary CALL-019 Outcome Control Boundary

on:
  push:
    branches:
      - phase1-call019-outcome-control

permissions:
  contents: read

jobs:
  outcome-control:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build Haskell substrate
        run: cabal build all --enable-tests

      - name: Check CALL-019 outcome control boundary
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019OutcomeControlBoundaryMain.hs

      - name: Replay CALL-019 outcome dispatch
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019OutcomeDispatchMain.hs

      - name: Replay CALL-019 surface decision bridge
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019SurfaceDecisionBridgeMain.hs

      - name: Replay CALL-019 authority possession
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1CALL019AuthorityPossessionMain.hs

      - name: Replay Steve invoke integration
        run: cabal exec -- runghc -Wall -Werror -isrc -itest test/Phase1INT006SteveApplicationShellMain.hs
