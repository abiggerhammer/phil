name: Phase 1 Audit Expression Operands

on:
  pull_request:
    paths:
      - 'src/Phil/Surface/Check/Support.hs'
      - 'test/Phase1AuditExprOperandsMain.hs'
      - 'docs/phase-1/audit-expr-operands-remediation-v1.md'
      - '.github/workflows/phase1-audit-expr-operands.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Surface/Check/Support.hs'
      - 'test/Phase1AuditExprOperandsMain.hs'
      - 'docs/phase-1/audit-expr-operands-remediation-v1.md'
      - '.github/workflows/phase1-audit-expr-operands.yml'

permissions:
  contents: read

jobs:
  expr-operands-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck audit and affected public consumers
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code             src/Phil/Surface/Check/Support.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code             test/Phase1AuditExprOperandsMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code             test/Phase1VerificationIntrinsicInvalidityMain.hs

      - name: Replay PHIL-AUD-EXPR-OPERANDS-001
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1AuditExprOperandsMain.hs

      - name: Replay intrinsic-invalidity controls
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationIntrinsicInvalidityMain.hs

      - name: Replay frozen Surface conformance controls
        run: cabal test phil-surface-conformance-tests --test-show-details=direct
