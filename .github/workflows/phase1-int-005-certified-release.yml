name: Phase 1 INT-005 Certified Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Phil/**'
      - 'test/Phil/Test/Phase1/**'
      - 'test/Phase1INT001WitnessE2EMain.hs'
      - 'test/Phase1INT002UploadManifestMain.hs'
      - 'test/Phase1INT002SteveManifestMain.hs'
      - 'test/Phase1INT005*.hs'
      - 'examples/upload/**'
      - 'examples/steve/**'
      - 'scripts/ci/phase1-int-005-*.sh'
      - 'scripts/ci/resolve-llvm18.sh'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int-005-certified-release.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/**'
      - 'test/Phil/Test/Phase1/**'
      - 'test/Phase1INT001WitnessE2EMain.hs'
      - 'test/Phase1INT002UploadManifestMain.hs'
      - 'test/Phase1INT002SteveManifestMain.hs'
      - 'test/Phase1INT005*.hs'
      - 'examples/upload/**'
      - 'examples/steve/**'
      - 'scripts/ci/phase1-int-005-*.sh'
      - 'scripts/ci/resolve-llvm18.sh'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int-005-certified-release.yml'

permissions:
  contents: read

jobs:
  certified-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck INT-005 release path
        run: |
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1INT005RealWitnessManifestMain.hs
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1INT005ReleasePackageMain.hs

      - name: Replay certified release envelope controls
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT005CertifiedReleaseEnvelopeMain.hs

      - name: Replay real ordinary-source witness certification
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT005RealWitnessManifestMain.hs

      - name: Verify inspectable release package controls
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT005ReleasePackageMain.hs

      - name: Emit package and execute both native witnesses
        run: bash scripts/ci/phase1-int-005-release-package.sh

      - name: Upload certified release bundles
        uses: actions/upload-artifact@v4
        with:
          name: int005-certified-release-bundles
          path: dist/int005-certified-release/
          if-no-files-found: error
