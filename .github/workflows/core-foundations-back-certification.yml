# CI normalization equivalence witness; execution semantics unchanged.
name: Core Foundations Back-Certification

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'proof/Phil/Core/Session.v'
      - 'proof/Phil/Core/SessionStep.v'
      - 'proof/Phil/Core/SessionLabel.v'
      - 'src/Phil/Core/Context.hs'
      - 'src/Phil/Core/Session.hs'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/Types.hs'
      - 'src/Phil/Assurance/Verify.hs'
      - 'src/Phil/Assurance/RocqCoreFoundations.hs'
      - 'app/CoreFoundationsBackCertificationMain.hs'
      - '.github/workflows/core-foundations-back-certification.yml'
  push:
    branches:
      - main
    paths:
      - 'proof/Phil/Core/Syntax.v'
      - 'proof/Phil/Core/Context.v'
      - 'proof/Phil/Core/ContextJoin.v'
      - 'proof/Phil/Core/Session.v'
      - 'proof/Phil/Core/SessionStep.v'
      - 'proof/Phil/Core/SessionLabel.v'
      - 'src/Phil/Core/Context.hs'
      - 'src/Phil/Core/Session.hs'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/Types.hs'
      - 'src/Phil/Assurance/Verify.hs'
      - 'src/Phil/Assurance/RocqCoreFoundations.hs'
      - 'app/CoreFoundationsBackCertificationMain.hs'
      - '.github/workflows/core-foundations-back-certification.yml'

permissions:
  contents: read

jobs:
  check-core-foundations:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check foundational Core theorem corpus
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Syntax.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Context.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ContextJoin.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/Session.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionStep.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SessionLabel.v
      - name: Stage checked proof sources and objects
        run: |
          mkdir -p checked/proof/Phil/Core
          for proof in Context ContextJoin Session SessionStep SessionLabel; do
            cp "proof/Phil/Core/${proof}.v" checked/proof/Phil/Core/
            cp "proof/Phil/Core/${proof}.vo" checked/proof/Phil/Core/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: core-foundations-checked-proofs
          path: checked/
          if-no-files-found: error
          retention-days: 14

  certify-core-foundations:
    needs: check-core-foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: core-foundations-checked-proofs
          path: checked
      - name: Build Phil assurance library
        run: cabal build lib:phil-core
      - name: Typecheck back-certification metadata and certifier
        run: |
          cabal exec -- ghc \
            -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/Assurance/RocqCoreFoundations.hs
          cabal exec -- ghc \
            -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/CoreFoundationsBackCertificationMain.hs
      - name: Build core-foundations certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp \
            app/CoreFoundationsBackCertificationMain.hs \
            -o phil-certify-core-foundations
      - name: Produce six proof-assistant certificates
        run: |
          mkdir -p core-foundations-certificates
          ./phil-certify-core-foundations checked core-foundations-certificates
          test "$(find core-foundations-certificates -type f -name '*.rocq.cert' | wc -l)" -eq 6
          for certificate in core-foundations-certificates/*.rocq.cert; do
            echo "=== ${certificate} ==="
            cat "${certificate}"
            sha256sum "${certificate}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: phil-core-foundations-proof-certificates
          path: core-foundations-certificates/
          if-no-files-found: error
          retention-days: 30
