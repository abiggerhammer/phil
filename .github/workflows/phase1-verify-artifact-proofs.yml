name: Phase 1 Verification Artifact Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Systems/FactDisposition.v'
      - 'proof/Phil/Assurance/ValidityScope.v'
      - 'proof/Phil/Core/SystemsStageClosure.v'
      - 'proof/Phil/Verification/VerificationArtifact.v'
      - 'proof/Phil/Verification/VerificationArtifactImplementation.v'
      - 'src/Phil/Verification/ArtifactClosure.hs'
      - 'src/Phil/Verification/GenericAssurance.hs'
      - 'src/Phil/Systems/StageClosure.hs'
      - 'test/Phase1VerificationSourceArtifactClosureMain.hs'
      - 'test/Phase1VerificationGenericAssuranceReuseMain.hs'
      - 'test/Phase1INT002ManifestClosureMain.hs'
      - 'test/Phase1StageClosureMain.hs'
      - 'docs/phase-1/verification-artifact-proof-boundary-v1.md'
      - '.github/workflows/phase1-verify-artifact-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Systems/FactDisposition.v'
      - 'proof/Phil/Assurance/ValidityScope.v'
      - 'proof/Phil/Core/SystemsStageClosure.v'
      - 'proof/Phil/Verification/VerificationArtifact.v'
      - 'proof/Phil/Verification/VerificationArtifactImplementation.v'
      - 'src/Phil/Verification/ArtifactClosure.hs'
      - 'src/Phil/Verification/GenericAssurance.hs'
      - 'src/Phil/Systems/StageClosure.hs'
      - 'test/Phase1VerificationSourceArtifactClosureMain.hs'
      - 'test/Phase1VerificationGenericAssuranceReuseMain.hs'
      - 'test/Phase1INT002ManifestClosureMain.hs'
      - 'test/Phase1StageClosureMain.hs'
      - 'docs/phase-1/verification-artifact-proof-boundary-v1.md'
      - '.github/workflows/phase1-verify-artifact-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-verification-artifact-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-VERIFY-ARTIFACT-001 semantic and implementation proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/VerificationArtifact.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/VerificationArtifactImplementation.v

      - name: Record checked proof identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            proof/Phil/Verification/VerificationArtifact.v \
            proof/Phil/Verification/VerificationArtifact.vo \
            proof/Phil/Verification/VerificationArtifactImplementation.v \
            proof/Phil/Verification/VerificationArtifactImplementation.vo \
            > verification-artifact-proof-sha256.txt
          cat verification-artifact-proof-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: verification-artifact-proof
          path: |
            proof/Phil/Verification/VerificationArtifact.v
            proof/Phil/Verification/VerificationArtifact.vo
            proof/Phil/Verification/VerificationArtifactImplementation.v
            proof/Phil/Verification/VerificationArtifactImplementation.vo
            verification-artifact-proof-sha256.txt

  verify-verification-artifact-correspondence:
    needs: rocq-verification-artifact-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck artifact production surfaces
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Verification/ArtifactClosure.hs \
            src/Phil/Verification/GenericAssurance.hs \
            src/Phil/Systems/StageClosure.hs

      - name: Strict typecheck VER-010 artifact regression
        run: cabal exec -- ghc -isrc -Wall -Werror -Wno-name-shadowing -Wno-unused-imports -fno-code test/Phase1VerificationSourceArtifactClosureMain.hs

      - name: Strict typecheck generic assurance regression
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1VerificationGenericAssuranceReuseMain.hs

      - name: Strict typecheck final manifest closure regression
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1INT002ManifestClosureMain.hs

      - name: Strict typecheck StageClosure regression
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1StageClosureMain.hs

      - name: Run unchanged VER-010 source versus artifact closure corpus
        run: cabal exec -- runghc -Wall -Werror -Wno-name-shadowing -Wno-unused-imports -isrc test/Phase1VerificationSourceArtifactClosureMain.hs

      - name: Re-run generic source assurance control
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1VerificationGenericAssuranceReuseMain.hs

      - name: Re-run final manifest closure control
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1INT002ManifestClosureMain.hs

      - name: Re-run certified StageClosure control
        run: cabal exec -- runghc -isrc test/Phase1StageClosureMain.hs

      - name: Run decision and assurance authority controls
        run: cabal test phil-decision-tests phil-assurance-tests phil-assurance-handoff-tests
