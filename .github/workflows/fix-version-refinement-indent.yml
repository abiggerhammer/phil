name: Fix Version Refinement Indent

on:
  pull_request:
    paths:
      - '.github/workflows/fix-version-refinement-indent.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lower-version-session-choice
          fetch-depth: 0
      - name: Fix LLVM version refinement renderer indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Phil/LLVM/IR.hs')
          text = p.read_text()
          old = '''      LLVMVersionRefinement _ transport selected yes no ->
        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))
  validName = "%phil_version_refinement_ok_" <> blockSymbol
        in
[ validName <> " = call i1 @phil_runtime_refine_selected_version(ptr %"
    <> symbol transport <> ", i16 %" <> symbol selected <> ")"
, "br i1 " <> validName
    <> ", label %" <> symbol (unLLVMBlockId yes)
    <> ", label %" <> symbol (unLLVMBlockId no)
]
'''
          new = '''      LLVMVersionRefinement _ transport selected yes no ->
        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))
            validName = "%phil_version_refinement_ok_" <> blockSymbol
        in
          [ validName <> " = call i1 @phil_runtime_refine_selected_version(ptr %"
              <> symbol transport <> ", i16 %" <> symbol selected <> ")"
          , "br i1 " <> validName
              <> ", label %" <> symbol (unLLVMBlockId yes)
              <> ", label %" <> symbol (unLLVMBlockId no)
          ]
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one malformed renderer block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "phil-version-lowering-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Phil/LLVM/IR.hs
          git commit -m "Fix version refinement renderer indentation"
          git push origin HEAD:lower-version-session-choice
