name: Phase 1 Surface Generic Binder Scope Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/BindingSemantics.v'
      - 'proof/Phil/Surface/SurfaceBinderScopeCore.v'
      - 'proof/Phil/Surface/SurfaceGenericBinderScope.v'
      - 'src/Phil/Surface/GrammarV1/GenericBinderScope.hs'
      - 'src/Phil/Surface/GrammarV1/CallableEffects.hs'
      - 'src/Phil/Surface/GrammarV1/SemanticEffectPolymorphism.hs'
      - 'test/Phase1GrammarV1GenericBinderScopeMain.hs'
      - 'docs/phase-1/surface-generic-binder-scope-proof-v1.md'
      - '.github/workflows/phase1-surface-generic-binder-scope-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/BindingSemantics.v'
      - 'proof/Phil/Surface/SurfaceBinderScopeCore.v'
      - 'proof/Phil/Surface/SurfaceGenericBinderScope.v'
      - 'src/Phil/Surface/GrammarV1/GenericBinderScope.hs'
      - 'src/Phil/Surface/GrammarV1/CallableEffects.hs'
      - 'src/Phil/Surface/GrammarV1/SemanticEffectPolymorphism.hs'
      - 'test/Phase1GrammarV1GenericBinderScopeMain.hs'
      - 'docs/phase-1/surface-generic-binder-scope-proof-v1.md'
      - '.github/workflows/phase1-surface-generic-binder-scope-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-surface-generic-binder-scope:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile Surface generic binder scope proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/BindingSemantics.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SurfaceBinderScopeCore.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/SurfaceGenericBinderScope.v
          sha256sum \
            proof/Phil/Surface/SurfaceGenericBinderScope.v \
            proof/Phil/Surface/SurfaceGenericBinderScope.vo \
            > surface-generic-binder-scope-proof.sha256
          cat surface-generic-binder-scope-proof.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: surface-generic-binder-scope-proof
          path: surface-generic-binder-scope-proof.sha256
          if-no-files-found: error

  verify-surface-generic-binder-scope:
    needs: rocq-surface-generic-binder-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests
      - name: Strict typecheck generic binder authorities
        run: |
          set -euo pipefail
          for module in \
            src/Phil/Surface/GrammarV1/GenericBinderScope.hs \
            src/Phil/Surface/GrammarV1/CallableEffects.hs \
            src/Phil/Surface/GrammarV1/SemanticEffectPolymorphism.hs \
            test/Phase1GrammarV1GenericBinderScopeMain.hs
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "$module"
          done
      - name: Replay SURF-009 generic binder scope corpus
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1GrammarV1GenericBinderScopeMain.hs
