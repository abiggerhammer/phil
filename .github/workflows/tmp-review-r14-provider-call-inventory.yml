name: Temporary R14 provider call inventory remediation

on:
  push:
    branches: [phase1-review-r14-provider-call-inventory]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-review-r14-provider-call-inventory
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply R14 independent inventory repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          edit(
              'src/Phil/Systems/ProviderCallCorrespondence.hs',
              '''  , verifyProviderCallStageBundle\n  , verifyProviderCallStageBundleAgainst\n  ) where\n''',
              '''  , verifyProviderCallStageBundle\n  , verifyProviderCallStageBundleAgainst\n  , verifyProviderCallStageBundleCompleteAgainst\n  ) where\n''')
          edit(
              'src/Phil/Systems/ProviderCallCorrespondence.hs',
              '''  | ProviderCallExpectedSiteMissing SystemsMechanismKey\n  | ProviderCallExpectedOccurrenceMismatch SystemsMechanismKey Text Text\n''',
              '''  | ProviderCallExpectedSiteMissing SystemsMechanismKey\n  | ProviderCallRequiredSiteDomainMismatch\n      (Set SystemsMechanismKey) (Set SystemsMechanismKey)\n  | ProviderCallExpectedOccurrenceMismatch SystemsMechanismKey Text Text\n''')
          edit(
              'src/Phil/Systems/ProviderCallCorrespondence.hs',
              '''kernelProviderBindingBasis\n  :: Map SystemsMechanismKey ProviderCallLink\n''',
              '''-- | Independent completeness gate for a provider-call stage.  REVIEW-R13\n-- establishes the semantic meaning of each represented call; REVIEW-R14 adds\n-- equality with the separately supplied required provider-call inventory.\nverifyProviderCallStageBundleCompleteAgainst\n  :: ProviderCallExpectationMap\n  -> ProviderCallStageBundle\n  -> Either ProviderCallStageVerificationError ()\nverifyProviderCallStageBundleCompleteAgainst expectations bundle = do\n  verifyProviderCallStageBundleAgainst expectations bundle\n  requireEqual ProviderCallRequiredSiteDomainMismatch\n    (Map.keysSet expectations)\n    (providerCallStageCallSites bundle)\n\nkernelProviderBindingBasis\n  :: Map SystemsMechanismKey ProviderCallLink\n''')

          edit(
              'src/Phil/Systems/AuthorityEffectCorrespondence.hs',
              '''  , makeAuthorityEffectStageBundle\n  , verifyAuthorityEffectStageBundle\n  ) where\n''',
              '''  , makeAuthorityEffectStageBundle\n  , verifyAuthorityEffectStageBundle\n  , verifyAuthorityEffectStageBundleAgainst\n  ) where\n''')
          edit(
              'src/Phil/Systems/AuthorityEffectCorrespondence.hs',
              '''  , ProviderCallStageVerificationError\n  , SelectedProviderAdmission (..)\n  , verifyProviderCallStageBundle\n  )\n''',
              '''  , ProviderCallExpectationMap\n  , ProviderCallStageVerificationError\n  , SelectedProviderAdmission (..)\n  , verifyProviderCallStageBundle\n  , verifyProviderCallStageBundleCompleteAgainst\n  )\n''')
          edit(
              'src/Phil/Systems/AuthorityEffectCorrespondence.hs',
              '''checkSurface\n  :: Map Text SelectedProviderAdmission\n''',
              '''-- | Independent full-coverage entry point.  The ordinary verifier remains\n-- a relative validator for explicitly supplied subsets; this entry point binds\n-- that subset to the separately established provider-call inventory before the\n-- effect/authority stage is accepted.\nverifyAuthorityEffectStageBundleAgainst\n  :: ProviderCallExpectationMap\n  -> AuthorityEffectStageBundle\n  -> Either AuthorityEffectStageVerificationError ()\nverifyAuthorityEffectStageBundleAgainst expectations bundle = do\n  mapLeft AuthorityEffectBaseStageError $\n    verifyProviderCallStageBundleCompleteAgainst\n      expectations (authorityEffectStageBase bundle)\n  verifyAuthorityEffectStageBundle bundle\n\ncheckSurface\n  :: Map Text SelectedProviderAdmission\n''')
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Run R14 regression
        run: cabal exec -- runghc -Wall -Werror -isrc test/Phase1ReviewR14ProviderCallInventoryMain.hs

      - name: Run R13 and provider correspondence controls
        run: |
          set -euo pipefail
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1ReviewR13ProviderOperationCorrespondenceMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1ProviderCallCorrespondenceMain.hs
          cabal exec -- runghc -Wall -Werror -isrc test/Phase1AuthorityEffectCorrespondenceMain.hs

      - name: Commit R14 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/Phil/Systems/ProviderCallCorrespondence.hs \
            src/Phil/Systems/AuthorityEffectCorrespondence.hs
          git commit -m 'review: bind provider coverage to independent site inventory'
          git push origin HEAD:phase1-review-r14-provider-call-inventory
