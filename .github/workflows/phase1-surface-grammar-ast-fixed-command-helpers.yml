name: Phase 1 Surface Grammar AST Fixed Command Helper Correspondence

on:
  pull_request:
    paths:
      - 'src/Phil/Surface/GrammarV1/ReferenceAstFixedCommandHelpers.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstExpressionCore.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstStaticReference.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'src/Phil/Surface/GrammarV1/Parser.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'test/Phase1GrammarV1ReferenceAstFixedCommandHelpersMain.hs'
      - '.github/workflows/phase1-surface-grammar-ast-fixed-command-helpers.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Surface/GrammarV1/ReferenceAstFixedCommandHelpers.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstExpressionCore.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceAstStaticReference.hs'
      - 'src/Phil/Surface/GrammarV1/ReferenceKernelBridge.hs'
      - 'src/Phil/Surface/GrammarV1/Parser.hs'
      - 'src/SurfaceGrammarRecognizerKernel.hs'
      - 'test/Phase1GrammarV1ReferenceAstFixedCommandHelpersMain.hs'
      - '.github/workflows/phase1-surface-grammar-ast-fixed-command-helpers.yml'

permissions:
  contents: read

jobs:
  ast-fixed-command-helper-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests

      - name: Strictly compile fixed-command helper correspondence harness
        run: |
          cabal exec -- ghc --make \
            -Wall -Werror \
            -isrc \
            test/Phase1GrammarV1ReferenceAstFixedCommandHelpersMain.hs \
            -o /tmp/phase1-surface-grammar-ast-fixed-command-helpers

      - name: Check certified fixed-command helpers against production AST
        run: /tmp/phase1-surface-grammar-ast-fixed-command-helpers
