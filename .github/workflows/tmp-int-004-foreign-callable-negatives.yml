name: Temporary INT-004 Foreign Callable Negatives

on:
  push:
    branches: [phase1-int-004-foreign-callable-negatives]
    paths:
      - 'test/fixtures/phase1-negative/foreign-callable-v1/**'
      - 'test/Phase1INT004PortableForeignCallableNegativeMain.hs'
      - '.github/workflows/tmp-int-004-foreign-callable-negatives.yml'

jobs:
  portable-foreign-callable-negatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck portable CALL-015 replay
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1INT004PortableForeignCallableNegativeMain.hs

      - name: Replay portable CALL-015 negatives
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT004PortableForeignCallableNegativeMain.hs

      - name: Guard portable data against Haskell-private authority
        run: |
          if grep -R -n -E 'ForeignCallableQualificationMissing|ForeignCallableQualificationArtifactMismatch|ForeignCallableQualificationSurfaceMismatch|ForeignCallableQualificationMissingEvidence|ForeignCallableQualificationRefinementError|CallableEffectBoundTooWide|CallableAuthorityRequirementTooStrong|CallableFailureSetTooWide|Phil\.Core|\.hs' \
              test/fixtures/phase1-negative/foreign-callable-v1/*.tsv; then
            echo 'portable CALL-015 TSV contains implementation-private identity' >&2
            exit 1
          fi

      - name: Reject unknown evidence vocabulary
        run: |
          cp test/fixtures/phase1-negative/foreign-callable-v1/evidence-v1.tsv /tmp/evidence.tsv
          sed -i '0,/abi-correspondence/s//not-evidence/' test/fixtures/phase1-negative/foreign-callable-v1/evidence-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs >/tmp/int004-call015.log 2>&1; then
            cat /tmp/int004-call015.log
            echo 'unknown evidence vocabulary unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/evidence.tsv test/fixtures/phase1-negative/foreign-callable-v1/evidence-v1.tsv

      - name: Reject missing qualified surface
        run: |
          cp test/fixtures/phase1-negative/foreign-callable-v1/surfaces-v1.tsv /tmp/surfaces.tsv
          sed -i '/P1-NEG-CALL-015-007\tqualified/d' test/fixtures/phase1-negative/foreign-callable-v1/surfaces-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs >/tmp/int004-call015.log 2>&1; then
            cat /tmp/int004-call015.log
            echo 'missing qualified surface unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/surfaces.tsv test/fixtures/phase1-negative/foreign-callable-v1/surfaces-v1.tsv

      - name: Reject earlier unrelated qualification failure
        run: |
          cp test/fixtures/phase1-negative/foreign-callable-v1/evidence-v1.tsv /tmp/evidence.tsv
          sed -i '/P1-NEG-CALL-015-005\tfailure-behavior/d' test/fixtures/phase1-negative/foreign-callable-v1/evidence-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs >/tmp/int004-call015.log 2>&1; then
            cat /tmp/int004-call015.log
            echo 'earlier missing-evidence failure unexpectedly counted as refinement rejection' >&2
            exit 1
          fi
          mv /tmp/evidence.tsv test/fixtures/phase1-negative/foreign-callable-v1/evidence-v1.tsv

      - name: Reject malformed qualification-presence vocabulary
        run: |
          cp test/fixtures/phase1-negative/foreign-callable-v1/artifacts-v1.tsv /tmp/artifacts.tsv
          sed -i '0,/false/s//maybe/' test/fixtures/phase1-negative/foreign-callable-v1/artifacts-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs >/tmp/int004-call015.log 2>&1; then
            cat /tmp/int004-call015.log
            echo 'malformed qualification presence unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/artifacts.tsv test/fixtures/phase1-negative/foreign-callable-v1/artifacts-v1.tsv

      - name: Reject unknown authority
        run: |
          cp test/fixtures/phase1-negative/foreign-callable-v1/manifest.tsv /tmp/manifest.tsv
          sed -i '0,/matrix:CALL-015/s//matrix:NOT-A-CASE/' test/fixtures/phase1-negative/foreign-callable-v1/manifest.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs >/tmp/int004-call015.log 2>&1; then
            cat /tmp/int004-call015.log
            echo 'unknown authority unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/manifest.tsv test/fixtures/phase1-negative/foreign-callable-v1/manifest.tsv

      - name: Reject missing Certified proof artifact
        run: |
          cp test/fixtures/phase1-negative/foreign-callable-v1/authority-registry-v1.tsv /tmp/authority.tsv
          sed -i '0,/proof\/Phil\/Core\/ForeignCallableQualification.v/s//proof\/Phil\/Core\/DefinitelyMissing.v/' \
            test/fixtures/phase1-negative/foreign-callable-v1/authority-registry-v1.tsv
          if cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs >/tmp/int004-call015.log 2>&1; then
            cat /tmp/int004-call015.log
            echo 'missing Certified proof unexpectedly accepted' >&2
            exit 1
          fi
          mv /tmp/authority.tsv test/fixtures/phase1-negative/foreign-callable-v1/authority-registry-v1.tsv

      - name: Replay restored portable CALL-015 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableForeignCallableNegativeMain.hs

      - name: Replay legacy CALL-015 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1ForeignCallableQualificationMain.hs

      - name: Replay prior portable Phase-1 corpora
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableGenericInstantiationNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableLifecycleNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableStructuralModeNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableScopeNegativeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableCallableRefinementNegativeMain.hs

      - name: Replay frozen INT-004 corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT004PortableNegativeManifestMain.hs
