name: Focusing Foundations Back-Certification

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/Focusing.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqFocusingFoundations.hs'
      - 'app/FocusingFoundationsBackCertificationMain.hs'
      - '.github/workflows/focusing-foundations-back-certification.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/Focusing.v'
      - 'src/Phil/Assurance/Rocq.hs'
      - 'src/Phil/Assurance/RocqFocusingFoundations.hs'
      - 'app/FocusingFoundationsBackCertificationMain.hs'
      - '.github/workflows/focusing-foundations-back-certification.yml'

permissions:
  contents: read

jobs:
  check-focusing-foundations:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check Focusing theorem corpus
        run: |
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/Focusing.v
      - name: Stage checked proof source and object
        run: |
          mkdir -p checked/proof/Phil/Core
          cp proof/Phil/Core/Focusing.v checked/proof/Phil/Core/
          cp proof/Phil/Core/Focusing.vo checked/proof/Phil/Core/
      - uses: actions/upload-artifact@v4
        with:
          name: focusing-foundations-checked-proof
          path: checked/
          if-no-files-found: error
          retention-days: 14

  certify-focusing-foundations:
    needs: check-focusing-foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: focusing-foundations-checked-proof
          path: checked
      - name: Build Phil assurance library
        run: cabal build lib:phil-core
      - name: Typecheck back-certification metadata and certifier
        run: |
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/Assurance/RocqFocusingFoundations.hs
          cabal exec -- ghc -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/FocusingFoundationsBackCertificationMain.hs
      - name: Build back-certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp app/FocusingFoundationsBackCertificationMain.hs \
            -o phil-certify-focusing-foundations
      - name: Produce five proof-assistant certificates
        run: |
          mkdir -p focusing-foundations-certificates
          ./phil-certify-focusing-foundations checked focusing-foundations-certificates
          test "$(find focusing-foundations-certificates -type f -name '*.rocq.cert' | wc -l)" -eq 5
          sha256sum focusing-foundations-certificates/*.rocq.cert
      - uses: actions/upload-artifact@v4
        with:
          name: phil-focusing-foundations-proof-certificates
          path: focusing-foundations-certificates/
          if-no-files-found: error
          retention-days: 30
