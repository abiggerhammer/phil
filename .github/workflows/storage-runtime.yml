# CI normalization equivalence witness; execution semantics unchanged.
name: Storage Runtime

on:
  pull_request:
    paths:
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'src/Phil/LLVM/Storage.hs'
      - 'src/Phil/LLVM/StorageCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMStorageMain.hs'
      - 'runtime/phase0/storage_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/StorageABIMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/storage-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/Systems.hs'
      - 'src/Phil/LLVM/IR.hs'
      - 'src/Phil/LLVM/Lower.hs'
      - 'src/Phil/LLVM/Storage.hs'
      - 'src/Phil/LLVM/StorageCertification.hs'
      - 'src/Phil/LLVM.hs'
      - 'app/LLVMStorageMain.hs'
      - 'runtime/phase0/storage_v1*'
      - 'scripts/check_runtime_abi.py'
      - 'test/StorageABIMain.hs'
      - 'phil-core.cabal'
      - '.github/workflows/storage-runtime.yml'

permissions:
  contents: read

jobs:
  storage-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build storage emitter and tests
        run: cabal build phil-llvm-phase0-storage phil-storage-abi-tests

      - name: Verify storage ABI and execute persistence paths
        shell: bash
        run: |
          set -euo pipefail

          if command -v llvm-as-18 >/dev/null 2>&1; then
            LLVM_AS=llvm-as-18
          elif command -v llvm-as >/dev/null 2>&1 && llvm-as --version | head -n 1 | grep -Eq 'LLVM version 18([.]|$)'; then
            LLVM_AS=llvm-as
          else
            echo "LLVM 18 llvm-as is required by storage-v1" >&2
            exit 1
          fi

          if command -v llvm-link-18 >/dev/null 2>&1; then
            LLVM_LINK=llvm-link-18
          elif command -v llvm-link >/dev/null 2>&1 && llvm-link --version | head -n 1 | grep -Eq 'LLVM version 18([.]|$)'; then
            LLVM_LINK=llvm-link
          else
            echo "LLVM 18 llvm-link is required by storage-v1" >&2
            exit 1
          fi

          if command -v clang-18 >/dev/null 2>&1; then
            CLANG=clang-18
          elif command -v clang >/dev/null 2>&1 && clang --version | head -n 1 | grep -Eq 'clang version 18([.]|$)'; then
            CLANG=clang
          else
            echo "Clang 18 is required by storage-v1" >&2
            exit 1
          fi

          STORAGE_EMITTER="$(cabal list-bin phil-llvm-phase0-storage)"
          "$STORAGE_EMITTER" > phase0-upload-storage.ll
          "$LLVM_AS" phase0-upload-storage.ll -o phase0-upload-storage.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu \
            -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -S -emit-llvm \
            runtime/phase0/storage_v1_smoke.c \
            -o storage-runtime.ll

          python3 scripts/check_runtime_abi.py \
            phase0-upload-storage.ll \
            storage-runtime.ll
          "$LLVM_AS" storage-runtime.ll -o storage-runtime.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu \
            -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iruntime/phase0 -emit-llvm -c \
            runtime/phase0/storage_v1_smoke_main.c \
            -o storage-smoke-main.bc

          "$LLVM_LINK" \
            phase0-upload-storage.bc \
            storage-runtime.bc \
            storage-smoke-main.bc \
            -o phase0-upload-storage-linked.bc

          "$CLANG" --target=x86_64-unknown-linux-gnu \
            phase0-upload-storage-linked.bc \
            -lcrypto \
            -o phase0-upload-storage-smoke
          ./phase0-upload-storage-smoke

          "$CLANG" --target=x86_64-unknown-linux-gnu \
            -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -S -emit-llvm \
            runtime/phase0/storage_v1_bad_ambient.c \
            -o storage-bad-ambient.ll
          if python3 scripts/check_runtime_abi.py --partial \
              phase0-upload-storage.ll \
              storage-bad-ambient.ll; then
            echo "expected ABI checker to reject nullary/bool storage provider" >&2
            exit 1
          fi
          echo "PASS: runtime ABI checker rejects ambient nullary storage"

          "$LLVM_AS" --version | head -n 1
          "$CLANG" --version | head -n 1
