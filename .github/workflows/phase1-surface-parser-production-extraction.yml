name: Phase 1 Surface Parser Production Extraction

on:
  pull_request:
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-parser-production-extraction.yml'
  push:
    branches: [main]
    paths:
      - 'grammar/phase1-surface.ebnf'
      - 'grammar/phase1-surface-determinacy.json'
      - 'scripts/derive_phase1_surface_grammar.py'
      - 'scripts/derive_phase1_surface_determinacy_certificate.py'
      - 'proof/Phil/Surface/Grammar*.v'
      - '.github/workflows/phase1-surface-parser-production-extraction.yml'

permissions:
  contents: read

jobs:
  extract-reference-recognizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write
          python3 scripts/derive_phase1_surface_grammar.py --check
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --check

      - name: Compile executable recognizer extraction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          cat > _CoqProject.surface-recognizer <<'EOF'
          -Q proof/Phil Phil
          proof/Phil/Surface/GrammarParserProductionKernel.v
          proof/Phil/Surface/GrammarParserProductionExtraction.v
          EOF
          rocq makefile -f _CoqProject.surface-recognizer -o Makefile.surface-recognizer
          make -f Makefile.surface-recognizer -j2
          test -s SurfaceGrammarRecognizerKernel.hs

      - name: Record extraction identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p surface-parser-production-extraction
          cp SurfaceGrammarRecognizerKernel.hs surface-parser-production-extraction/
          cp proof/Phil/Surface/GrammarParserProductionKernel.v surface-parser-production-extraction/
          cp proof/Phil/Surface/GrammarParserProductionExtraction.v surface-parser-production-extraction/
          sha256sum \
            grammar/phase1-surface.ebnf \
            grammar/phase1-surface-determinacy.json \
            proof/Phil/Surface/GrammarParserRecognizer.v \
            proof/Phil/Surface/GrammarParserProgress.v \
            proof/Phil/Surface/GrammarParserProductionKernel.v \
            proof/Phil/Surface/GrammarParserProductionExtraction.v \
            SurfaceGrammarRecognizerKernel.hs \
            > surface-parser-production-extraction/identities.sha256
          cat surface-parser-production-extraction/identities.sha256
          sed -n '1,120p' SurfaceGrammarRecognizerKernel.hs

      - uses: actions/upload-artifact@v4
        with:
          name: surface-grammar-recognizer-kernel
          path: surface-parser-production-extraction
          if-no-files-found: error

  strict-haskell:
    needs: extract-reference-recognizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: surface-grammar-recognizer-kernel
          path: extracted

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Strict-typecheck extracted reference recognizer
        run: ghc -Wall -Werror -fno-code extracted/SurfaceGrammarRecognizerKernel.hs
