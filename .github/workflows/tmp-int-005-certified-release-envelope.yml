name: Temporary INT-005 Certified Release Envelope

on:
  push:
    branches: [phase1-int-005-certified-release-envelope]
    paths:
      - 'src/Phil/Verification/CertifiedRelease.hs'
      - 'src/Phil/Systems/ProtocolStateCorrespondence.hs'
      - 'src/Phil/Systems/BoundaryCommitCorrespondence.hs'
      - 'test/Phase1VerificationSourceArtifactClosureMain.hs'
      - 'test/Phase1INT005CertifiedReleaseEnvelopeMain.hs'
      - '.github/workflows/tmp-int-005-certified-release-envelope.yml'

permissions:
  contents: write

jobs:
  certified-release-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Apply exact pre-existing warning cleanups
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          protocol = Path('src/Phil/Systems/ProtocolStateCorrespondence.hs')
          text = protocol.read_text()
          old = '''        ProtocolOpaqueAction semanticAction\n          | not (Text.null semanticAction) -> Right Nothing'''
          new = '''        ProtocolOpaqueAction opaqueActionName\n          | not (Text.null opaqueActionName) -> Right Nothing'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('expected exactly one ProtocolOpaqueAction shadow site')
              protocol.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('ProtocolOpaqueAction shadow site has unexpected shape')

          boundary = Path('src/Phil/Systems/BoundaryCommitCorrespondence.hs')
          text = boundary.read_text()
          old_import = 'import Data.Set (Set)\n'
          if old_import in text:
              if text.count(old_import) != 1:
                  raise SystemExit('expected exactly one redundant Data.Set(Set) import')
              boundary.write_text(text.replace(old_import, '', 1))

          ver010 = Path('test/Phase1VerificationSourceArtifactClosureMain.hs')
          text = ver010.read_text()
          replacements = [
              ('  sourceAssurance <- sourceAssuranceOrFail\n',
               '  closedSourceAssurance <- sourceAssuranceOrFail\n'),
              ('testValidArtifactCertification sourceAssurance validStage',
               'testValidArtifactCertification closedSourceAssurance validStage'),
              ('testSourceClosureIsNotArtifactClosure sourceAssurance validStage changedStage',
               'testSourceClosureIsNotArtifactClosure closedSourceAssurance validStage changedStage'),
              ('testArtifactIdentityMutation sourceAssurance validStage',
               'testArtifactIdentityMutation closedSourceAssurance validStage'),
          ]
          changed = False
          for old_text, new_text in replacements:
              if old_text in text:
                  if text.count(old_text) != 1:
                      raise SystemExit(f'expected exactly one VER-010 shadow site: {old_text!r}')
                  text = text.replace(old_text, new_text, 1)
                  changed = True
              elif new_text not in text:
                  raise SystemExit(f'VER-010 shadow site has unexpected shape: {old_text!r}')
          if changed:
              ver010.write_text(text)
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck INT-005 release envelope
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1INT005CertifiedReleaseEnvelopeMain.hs

      - name: Exercise INT-005 release-envelope controls
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT005CertifiedReleaseEnvelopeMain.hs

      - name: Guard release constructor against witness identity dispatch
        run: |
          if grep -n -E 'Upload|Steve|program:upload|program:steve' \
              src/Phil/Verification/CertifiedRelease.hs; then
            echo 'certified-release constructor contains witness-specific identity' >&2
            exit 1
          fi

      - name: Replay VER-010 source/artifact closure
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1VerificationSourceArtifactClosureMain.hs

      - name: Replay INT-001 shared witness backend path
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT001WitnessE2EMain.hs

      - name: Replay INT-002 final manifest closure
        run: |
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT002UploadManifestMain.hs
          cabal exec -- runghc -isrc -Wall -Werror \
            test/Phase1INT002SteveManifestMain.hs

      - name: Transport exact tested warning cleanups
        shell: bash
        run: |
          if git diff --quiet -- \
              src/Phil/Systems/ProtocolStateCorrespondence.hs \
              src/Phil/Systems/BoundaryCommitCorrespondence.hs \
              test/Phase1VerificationSourceArtifactClosureMain.hs; then
            echo 'warning cleanups already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Phil/Systems/ProtocolStateCorrespondence.hs \
            src/Phil/Systems/BoundaryCommitCorrespondence.hs \
            test/Phase1VerificationSourceArtifactClosureMain.hs
          git commit -m 'style: clear INT-005 strict warning blockers'
          git push
