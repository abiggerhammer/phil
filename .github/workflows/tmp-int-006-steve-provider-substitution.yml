name: Temporary INT-006 Steve Provider Substitution

on:
  workflow_dispatch:
  push:
    branches: [phase1-int-006-steve-provider-substitution]
    paths:
      - 'test/Phase1INT006SteveProviderSubstitutionMain.hs'
      - '.github/workflows/tmp-int-006-steve-provider-substitution.yml'

permissions:
  contents: read

jobs:
  steve-provider-substitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck Steve provider substitution witness
        run: |
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1INT006SteveProviderSubstitutionMain.hs

      - name: Exercise Steve provider substitution witness
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006SteveProviderSubstitutionMain.hs

      - name: Replay generic provider replacement qualification
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1ProviderReplacementQualificationMain.hs

      - name: Replay materialized Steve provider qualifications
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1SteveProviderQualificationMain.hs

      - name: Replay Steve application shell composition
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT006SteveApplicationShellMain.hs
