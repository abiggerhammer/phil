name: Phase 1 Authority Confinement Proofs

on:
  pull_request:
    paths:
      - 'src/Phil/Core/AuthorityConfinement.hs'
      - 'src/Phil/Core/ProviderAuthorityQualification.hs'
      - 'src/Phil/Core/AuthorityAttenuation.hs'
      - 'src/Phil/Core/ProviderQualification.hs'
      - 'test/Phase1AuthorityConfinementMain.hs'
      - 'test/Phase1ProviderAuthorityQualificationMain.hs'
      - 'test/Phase1AuthorityAttenuationMain.hs'
      - 'test/Phase1ProviderQualificationMain.hs'
      - 'docs/phase-1/authority-confinement-v1.md'
      - 'docs/phase-1/provider-authority-confinement-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'proof/Phil/Core/AuthorityAttenuation.v'
      - 'proof/Phil/Core/AuthorityConfinement.v'
      - 'app/Phase1AuthorityConfinementCertificationMain.hs'
      - '.github/workflows/phase1-authority-confinement-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'src/Phil/Core/AuthorityConfinement.hs'
      - 'src/Phil/Core/ProviderAuthorityQualification.hs'
      - 'src/Phil/Core/AuthorityAttenuation.hs'
      - 'src/Phil/Core/ProviderQualification.hs'
      - 'test/Phase1AuthorityConfinementMain.hs'
      - 'test/Phase1ProviderAuthorityQualificationMain.hs'
      - 'test/Phase1AuthorityAttenuationMain.hs'
      - 'test/Phase1ProviderQualificationMain.hs'
      - 'docs/phase-1/authority-confinement-v1.md'
      - 'docs/phase-1/provider-authority-confinement-v1.md'
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'proof/Phil/Core/AuthorityAttenuation.v'
      - 'proof/Phil/Core/AuthorityConfinement.v'
      - 'app/Phase1AuthorityConfinementCertificationMain.hs'
      - '.github/workflows/phase1-authority-confinement-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-phase1-authority-confinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check authority proof chain and PHIL-AUTH-CONFINE-001
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityPossession.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityAttenuation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityConfinement.v
          test -f proof/Phil/Core/AuthorityConfinement.vo
          mkdir -p phase1-authority-confinement-proof
          cp proof/Phil/Core/AuthorityConfinement.v phase1-authority-confinement-proof/
          cp proof/Phil/Core/AuthorityConfinement.vo phase1-authority-confinement-proof/
          sha256sum \
            proof/Phil/Core/GenericStructural.v \
            proof/Phil/Core/GenericStructural.vo \
            proof/Phil/Core/AuthorityPossession.v \
            proof/Phil/Core/AuthorityPossession.vo \
            proof/Phil/Core/AuthorityAttenuation.v \
            proof/Phil/Core/AuthorityAttenuation.vo \
            phase1-authority-confinement-proof/AuthorityConfinement.v \
            phase1-authority-confinement-proof/AuthorityConfinement.vo

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-phase1-authority-confinement-proof
          path: phase1-authority-confinement-proof
          if-no-files-found: error

  certify-phase1-authority-confinement:
    needs: rocq-phase1-authority-confinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build existing proof certifier with warnings as errors
        run: cabal build exe:phil-certify-core-scalar --ghc-options=-Werror

      - name: Typecheck dedicated authority confinement certifier with warnings as errors
        run: cabal exec -- ghc -isrc -Wall -Werror -fno-code app/Phase1AuthorityConfinementCertificationMain.hs

      - name: Re-run AUTH-003 attenuation dependency correspondence
        run: cabal exec -- runghc -isrc test/Phase1AuthorityAttenuationMain.hs

      - name: Re-run exact AUTH-004 closure confinement correspondence
        run: cabal exec -- runghc -isrc test/Phase1AuthorityConfinementMain.hs

      - name: Re-run provider semantic qualification dependency correspondence
        run: cabal exec -- runghc -isrc test/Phase1ProviderQualificationMain.hs

      - name: Re-run exact PROV-009 and AUTH-006 provider authority correspondence
        run: cabal exec -- runghc -isrc test/Phase1ProviderAuthorityQualificationMain.hs

      - uses: actions/download-artifact@v4
        with:
          name: rocq-phase1-authority-confinement-proof
          path: phase1-authority-confinement-proof

      - name: Emit PHIL-AUTH-CONFINE-001 proof certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-authority-confinement-certification
          cabal exec -- runghc -isrc app/Phase1AuthorityConfinementCertificationMain.hs \
            phase1-authority-confinement-proof/AuthorityConfinement.v \
            phase1-authority-confinement-proof/AuthorityConfinement.vo \
            phase1-authority-confinement-certification/PHIL-AUTH-CONFINE-001.rocq.cert

          sha256sum \
            src/Phil/Core/AuthorityAttenuation.hs \
            src/Phil/Core/AuthorityConfinement.hs \
            src/Phil/Core/ProviderQualification.hs \
            src/Phil/Core/ProviderAuthorityQualification.hs \
            test/Phase1AuthorityAttenuationMain.hs \
            test/Phase1AuthorityConfinementMain.hs \
            test/Phase1ProviderQualificationMain.hs \
            test/Phase1ProviderAuthorityQualificationMain.hs \
            docs/phase-1/authority-confinement-v1.md \
            docs/phase-1/provider-authority-confinement-v1.md \
            proof/Phil/Core/GenericStructural.v \
            proof/Phil/Core/AuthorityPossession.v \
            proof/Phil/Core/AuthorityAttenuation.v \
            proof/Phil/Core/AuthorityConfinement.v \
            app/Phase1AuthorityConfinementCertificationMain.hs \
            > phase1-authority-confinement-certification/PHIL-AUTH-CONFINE-001.correspondence.sha256

          cat phase1-authority-confinement-certification/PHIL-AUTH-CONFINE-001.rocq.cert
          sha256sum phase1-authority-confinement-certification/PHIL-AUTH-CONFINE-001.rocq.cert

      - uses: actions/upload-artifact@v4
        with:
          name: phil-phase1-authority-confinement-proof-certification
          path: phase1-authority-confinement-certification
          if-no-files-found: error
