name: FSEM-01 Scoped Linear Loop Loan Early Preflight

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - formal-semantics/fsem01-scoped-loan-loop-backedge
  pull_request:
    paths:
      - 'src/Phil/Surface/Check/Engine.hs'
      - 'src/Phil/Surface/GrammarV1/LoopStateScope.hs'
      - 'src/Phil/Surface/GrammarV1/SourceLinearLoopTransfer.hs'
      - 'test/Phase1FSEM01ScopedLinearLoopLoanMain.hs'
      - 'test/fixtures/fsem01-scoped-linear-loop-loan-v1/**'
      - 'proof/Phil/Surface/SurfaceSourceScopedLinearLoopLoan.v'
      - 'docs/phase-1/formal-semantics-source-scoped-loop-loan-fsem01-v1.md'
      - 'phil-core.cabal'
      - '.github/workflows/fsem01-scoped-loop-loan-preflight.yml'

permissions:
  contents: read

jobs:
  scoped-loop-loan-haskell:
    name: Strict source scoped loan and Linear loop reentry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - name: Update Hackage with bounded HTTP1 retry
        shell: bash
        run: bash scripts/ci/cabal-update-retry.sh
      - name: Strict warning-free Haskell production library
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Existing L-2 and new L-3 source fixtures
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            Phase1GrammarV1JoinLoopMain \
            Phase1FSEM01SourceBoolLoopMain \
            Phase1FSEM01SourceBoolBreakMain \
            Phase1FSEM01LinearLoopTransferMain \
            Phase1FSEM01ScopedLinearLoopLoanMain
          do
            cabal exec -- ghc -isrc -Wall -Werror -fno-code "test/$test.hs"
            cabal exec -- runghc -isrc -Wall -Werror "test/$test.hs"
          done
          sha256sum src/Phil/Surface/Check/Engine.hs \
            src/Phil/Surface/GrammarV1/LoopStateScope.hs \
            src/Phil/Surface/GrammarV1/SourceLinearLoopTransfer.hs \
            test/Phase1FSEM01ScopedLinearLoopLoanMain.hs

  scoped-loop-loan-rocq:
    name: Rocq scoped loan owner move and join rejection proofs
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile conditional ownership/loan model without admissions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in \
            proof/Phil/Core/Syntax.v \
            proof/Phil/Core/Context.v \
            proof/Phil/Core/ContextJoin.v \
            proof/Phil/Surface/SurfaceSourceLinearLoopTransfer.v \
            proof/Phil/Surface/SurfaceSourceScopedLinearLoopLoan.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' \
            proof/Phil/Surface/SurfaceSourceScopedLinearLoopLoan.v; then
            echo "Unproved L-3 scoped-loop-loan theorem" >&2
            exit 1
          fi
          sha256sum proof/Phil/Surface/SurfaceSourceScopedLinearLoopLoan.v \
            proof/Phil/Surface/SurfaceSourceScopedLinearLoopLoan.vo
