name: Phase 1 Architecture Instantiation Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'src/Phil/Core/Static.hs'
      - 'test/Phase1ArchitectureInstantiationMain.hs'
      - 'docs/phase-1/architecture-instantiation-v1.md'
      - 'docs/phase-1/architecture-instantiation-proof-v1.md'
      - '.github/workflows/phase1-architecture-instantiation-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'src/Phil/Core/Static.hs'
      - 'test/Phase1ArchitectureInstantiationMain.hs'
      - 'docs/phase-1/architecture-instantiation-v1.md'
      - 'docs/phase-1/architecture-instantiation-proof-v1.md'
      - '.github/workflows/phase1-architecture-instantiation-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-architecture-instantiation-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile PHIL-ARCH-INST-001 proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureInstantiation.v

      - name: Record proof identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p architecture-instantiation-proof
          cp \
            proof/Phil/Core/ArchitectureInstantiation.v \
            proof/Phil/Core/ArchitectureInstantiation.vo \
            architecture-instantiation-proof/
          sha256sum \
            proof/Phil/Core/ArchitectureInstantiation.v \
            proof/Phil/Core/ArchitectureInstantiation.vo \
            > architecture-instantiation-proof/PHIL-ARCH-INST-001.proof.sha256
          {
            printf '%s\n' 'obligation=PHIL-ARCH-INST-001'
            printf '%s\n' 'evidence=Rocq-9.2.0'
            cat architecture-instantiation-proof/PHIL-ARCH-INST-001.proof.sha256
          } > architecture-instantiation-proof/PHIL-ARCH-INST-001.proof-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-architecture-instantiation-proof
          path: architecture-instantiation-proof
          if-no-files-found: error

  verify-architecture-instantiation-correspondence:
    needs: rocq-architecture-instantiation-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Typecheck architecture instantiation implementation path
        run: |
          set -euo pipefail
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1ArchitectureInstantiationMain.hs

      - name: Re-run ARCH-005, ARCH-006, ARCH-008, and ARCH-009 corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1ArchitectureInstantiationMain.hs
