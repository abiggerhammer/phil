name: Final Session Offer Lowering Edit

on:
  push:
    branches:
      - lower-final-session-offer
    paths:
      - '.github/workflows/session-offer-lowering-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: lower-final-session-offer
          fetch-depth: 0

      - name: Apply lowering slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # LLVM IR vocabulary: explicit final-response decoder, accepted-arm payload bind,
          # and application sink. The target still carries no DigestFailure object.
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "  | LLVMAcceptedResponse Text Text\n  | LLVMRejectedResponse Text Int\n  | LLVMStrengtheningOp LLVMStrengtheningId Text\n",
              "  | LLVMAcceptedResponse Text Text\n  | LLVMRejectedResponse Text Int\n  | LLVMFinalResponsePayloadBinding Text\n  | LLVMRecordUploadId Text\n  | LLVMStrengtheningOp LLVMStrengtheningId Text\n",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "  | LLVMStore\n      RuntimeSiteRef\n      Text\n      Text\n      LLVMBlockId\n      LLVMBlockId\n  | LLVMReturnScalar Text ScalarType\n",
              "  | LLVMStore\n      RuntimeSiteRef\n      Text\n      Text\n      LLVMBlockId\n      LLVMBlockId\n  | LLVMFinalResponseOffer\n      Text\n      Text\n      LLVMBlockId\n      LLVMBlockId\n  | LLVMReturnScalar Text ScalarType\n",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "  LLVMStore _ _ _ yes no -> [yes, no]\n  LLVMReturnScalar _ _ -> []\n",
              "  LLVMStore _ _ _ yes no -> [yes, no]\n  LLVMFinalResponseOffer _ _ yes no -> [yes, no]\n  LLVMReturnScalar _ _ -> []\n",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "      , \"phil-runtime/phase0/rejected-response-v1\"\n      ]\n",
              "      , \"phil-runtime/phase0/rejected-response-v1\"\n      , \"phil-runtime/phase0/final-response-receive-v1\"\n      ]\n",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "      <> acceptedResponseDeclaration\n      <> rejectedResponseDeclaration\n      <> map renderCallDeclaration",
              "      <> acceptedResponseDeclaration\n      <> rejectedResponseDeclaration\n      <> finalResponseReceiveDeclaration\n      <> recordUploadIdDeclaration\n      <> map renderCallDeclaration",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "    rejectedResponseDeclaration =\n      if any hasRejectedResponse allBlocks\n        then [\"declare void @phil_runtime_select_rejected(ptr, i8)\"]\n        else []\n\n    callNames = Set.fromList\n",
              "    rejectedResponseDeclaration =\n      if any hasRejectedResponse allBlocks\n        then [\"declare void @phil_runtime_select_rejected(ptr, i8)\"]\n        else []\n\n    finalResponseReceiveDeclaration =\n      if any hasFinalResponseOffer allBlocks\n        then [\"declare i1 @phil_runtime_receive_final_response(ptr, ptr)\"]\n        else []\n\n    recordUploadIdDeclaration =\n      if any hasRecordUploadId allBlocks\n        then [\"declare void @phil_runtime_record_upload_id(ptr)\"]\n        else []\n\n    callNames = Set.fromList\n",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "    hasRejectedResponse blockValue = any isRejectedResponse (llvmBlockOps blockValue)\n    isRejectedResponse LLVMRejectedResponse {} = True\n    isRejectedResponse _ = False\n\n    renderCallDeclaration name",
              "    hasRejectedResponse blockValue = any isRejectedResponse (llvmBlockOps blockValue)\n    isRejectedResponse LLVMRejectedResponse {} = True\n    isRejectedResponse _ = False\n\n    hasFinalResponseOffer blockValue = case llvmBlockTerminator blockValue of\n      LLVMFinalResponseOffer {} -> True\n      _ -> False\n\n    hasRecordUploadId blockValue = any isRecordUploadId (llvmBlockOps blockValue)\n    isRecordUploadId LLVMRecordUploadId {} = True\n    isRecordUploadId _ = False\n\n    renderCallDeclaration name",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "      LLVMRejectedResponse transport reasonCode ->\n        [ \"call void @phil_runtime_select_rejected(ptr %\" <> symbol transport\n            <> \", i8 \" <> Text.pack (show reasonCode) <> \")\"\n        ]\n      LLVMStrengtheningOp strengtheningId description ->\n",
              "      LLVMRejectedResponse transport reasonCode ->\n        [ \"call void @phil_runtime_select_rejected(ptr %\" <> symbol transport\n            <> \", i8 \" <> Text.pack (show reasonCode) <> \")\"\n        ]\n      LLVMFinalResponsePayloadBinding uploadId ->\n        [ \"%\" <> symbol uploadId <> \" = load ptr, ptr %phil_final_response_upload_id_slot_\"\n            <> symbol uploadId\n        ]\n      LLVMRecordUploadId uploadId ->\n        [ \"call void @phil_runtime_record_upload_id(ptr %\" <> symbol uploadId <> \")\" ]\n      LLVMStrengtheningOp strengtheningId description ->\n",
          )
          replace_once(
              "src/Phil/LLVM/IR.hs",
              "      LLVMStore _ payloadName uploadIdName yes no ->\n        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n            resultType = \"{ i8, ptr }\"\n            resultName = \"%phil_store_result_\" <> blockSymbol\n            statusName = \"%phil_store_status_\" <> blockSymbol\n            okName = \"%phil_store_ok_\" <> blockSymbol\n        in\n          [ resultName <> \" = call \" <> resultType\n              <> \" @phil_runtime_store(ptr %\" <> symbol payloadName <> \")\"\n          , statusName <> \" = extractvalue \" <> resultType <> \" \" <> resultName <> \", 0\"\n          , \"%\" <> symbol uploadIdName <> \" = extractvalue \" <> resultType <> \" \" <> resultName <> \", 1\"\n          , okName <> \" = icmp eq i8 \" <> statusName <> \", 1\"\n          , \"br i1 \" <> okName\n              <> \", label %\" <> symbol (unLLVMBlockId yes)\n              <> \", label %\" <> symbol (unLLVMBlockId no)\n          ]\n      LLVMReturnScalar name scalarType ->\n",
              "      LLVMStore _ payloadName uploadIdName yes no ->\n        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n            resultType = \"{ i8, ptr }\"\n            resultName = \"%phil_store_result_\" <> blockSymbol\n            statusName = \"%phil_store_status_\" <> blockSymbol\n            okName = \"%phil_store_ok_\" <> blockSymbol\n        in\n          [ resultName <> \" = call \" <> resultType\n              <> \" @phil_runtime_store(ptr %\" <> symbol payloadName <> \")\"\n          , statusName <> \" = extractvalue \" <> resultType <> \" \" <> resultName <> \", 0\"\n          , \"%\" <> symbol uploadIdName <> \" = extractvalue \" <> resultType <> \" \" <> resultName <> \", 1\"\n          , okName <> \" = icmp eq i8 \" <> statusName <> \", 1\"\n          , \"br i1 \" <> okName\n              <> \", label %\" <> symbol (unLLVMBlockId yes)\n              <> \", label %\" <> symbol (unLLVMBlockId no)\n          ]\n      LLVMFinalResponseOffer transportName uploadIdName yes no ->\n        let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))\n            slotName = \"%phil_final_response_upload_id_slot_\" <> symbol uploadIdName\n            acceptedName = \"%phil_final_response_accepted_\" <> blockSymbol\n        in\n          [ slotName <> \" = alloca ptr\"\n          , acceptedName <> \" = call i1 @phil_runtime_receive_final_response(ptr %\"\n              <> symbol transportName <> \", ptr \" <> slotName <> \")\"\n          , \"br i1 \" <> acceptedName\n              <> \", label %\" <> symbol (unLLVMBlockId yes)\n              <> \", label %\" <> symbol (unLLVMBlockId no)\n          ]\n      LLVMReturnScalar name scalarType ->\n",
          )

          # Generic LLVM verifier treats the new physical operations as ordinary target structure.
          replace_once(
              "src/Phil/LLVM/Verify.hs",
              "      LLVMAcceptedResponse {} -> True\n      LLVMRejectedResponse {} -> True\n      LLVMStrengtheningOp _ _ -> False\n",
              "      LLVMAcceptedResponse {} -> True\n      LLVMRejectedResponse {} -> True\n      LLVMFinalResponsePayloadBinding {} -> True\n      LLVMRecordUploadId {} -> True\n      LLVMStrengtheningOp _ _ -> False\n",
          )

          # Public exports.
          replace_once(
              "src/Phil/LLVM.hs",
              "  , module Phil.LLVM.RejectedResponseCertification\n  ) where\n",
              "  , module Phil.LLVM.RejectedResponseCertification\n  , module Phil.LLVM.SessionOffer\n  ) where\n",
          )
          replace_once(
              "src/Phil/LLVM.hs",
              "import Phil.LLVM.RejectedResponseCertification\nimport Phil.LLVM.Storage\n",
              "import Phil.LLVM.RejectedResponseCertification\nimport Phil.LLVM.SessionOffer\nimport Phil.LLVM.Storage\n",
          )

          # Cabal registration.
          replace_once(
              "phil-core.cabal",
              "      Phil.LLVM.RejectedResponse\n      Phil.LLVM.RejectedResponseCertification\n  build-depends:\n",
              "      Phil.LLVM.RejectedResponse\n      Phil.LLVM.RejectedResponseCertification\n      Phil.LLVM.SessionOffer\n  build-depends:\n",
          )
          replace_once(
              "phil-core.cabal",
              "executable phil-llvm-phase0-rejected-response\n  import:             common-settings\n  hs-source-dirs:     app\n  main-is:            LLVMRejectedResponseMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      phil-core,\n      text >=2.0 && <2.2\n\nexecutable philc\n",
              "executable phil-llvm-phase0-rejected-response\n  import:             common-settings\n  hs-source-dirs:     app\n  main-is:            LLVMRejectedResponseMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      phil-core,\n      text >=2.0 && <2.2\n\nexecutable phil-llvm-phase0-final-response-receive\n  import:             common-settings\n  hs-source-dirs:     app\n  main-is:            LLVMFinalResponseReceiveMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      phil-core,\n      text >=2.0 && <2.2\n\nexecutable philc\n",
          )
          replace_once(
              "phil-core.cabal",
              "test-suite phil-session-choice-tests\n  import:             common-settings\n  type:               exitcode-stdio-1.0\n  hs-source-dirs:     test\n  main-is:            SessionChoiceMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      containers >=0.6 && <0.8,\n      phil-core,\n      text >=2.0 && <2.2\n\n",
              "test-suite phil-session-choice-tests\n  import:             common-settings\n  type:               exitcode-stdio-1.0\n  hs-source-dirs:     test\n  main-is:            SessionChoiceMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      containers >=0.6 && <0.8,\n      phil-core,\n      text >=2.0 && <2.2\n\ntest-suite phil-final-response-receive-tests\n  import:             common-settings\n  type:               exitcode-stdio-1.0\n  hs-source-dirs:     test\n  main-is:            FinalResponseReceiveMain.hs\n  build-depends:\n      base >=4.17 && <5,\n      containers >=0.6 && <0.8,\n      phil-core,\n      text >=2.0 && <2.2\n\n",
          )

          session_offer = r'''{-# LANGUAGE OverloadedStrings #-}

module Phil.LLVM.SessionOffer
  ( FinalResponseReceiveLLVMError (..)
  , finalResponseReceiveABIDescriptor
  , phase0FinalResponseReceiveLLVMTarget
  , phase0FinalResponseReceiveLLVMArtifact
  , phase0FinalResponseReceiveLLVMVerificationContext
  , lowerSystemsFinalResponseReceive
  , verifyFinalResponseReceiveWitness
  , verifyFinalResponseReceiveTranslation
  , verifyPhase0FinalResponseReceiveLLVM
  ) where

import Control.Monad (forM_, unless)
import Data.Char (isAlphaNum)
import qualified Data.Map.Strict as Map
import Data.Text (Text)
import qualified Data.Text as Text
import Phil.Assurance.Types (digestText, unDigest)
import Phil.LLVM.AcceptedResponse (acceptedResponseWitness)
import Phil.LLVM.IR
import Phil.LLVM.RejectedResponse
  ( rejectedResponseABIDescriptor
  , lowerSystemsRejectedResponse
  , phase0RejectedResponseLLVMTarget
  )
import Phil.LLVM.Verify
import Phil.Systems.AcceptedResponse
import Phil.Systems.IR
import Phil.Systems.RejectedResponse
import Phil.Systems.SessionChoice

data FinalResponseReceiveLLVMError
  = FinalResponseReceiveSystemsError SessionChoiceError
  | FinalResponseReceiveLLVMVerificationError LLVMVerificationError
  | FinalResponseReceiveFunctionMissing Text
  | FinalResponseReceiveBlockMissing Text LLVMBlockId
  | FinalResponseReceiveTransportParameterMismatch Text [LLVMParameter]
  | FinalResponseReceiveOfferMismatch Text LLVMBlockId LLVMTerminator
  | FinalResponseReceiveAcceptedOpsMismatch Text LLVMBlockId [LLVMOp]
  | FinalResponseReceiveRejectedOpsMismatch Text LLVMBlockId [LLVMOp]
  | FinalResponseReceiveAcceptedOutcomeMismatch Text LLVMBlockId LLVMTerminator
  | FinalResponseReceiveRejectedOutcomeMismatch Text LLVMBlockId LLVMTerminator
  | FinalResponseReceiveServerAcceptedRegression Text LLVMBlockId [LLVMOp]
  | FinalResponseReceiveServerRejectedRegression Text LLVMBlockId [LLVMOp]
  | FinalResponseReceiveRenderedCallMissing Text
  | FinalResponseReceiveGenericCallDetected Text
  | FinalResponseReceiveAmbientStateDetected Text
  | FinalResponseReceiveDigestFailureLeaked Text
  deriving (Eq, Show)

finalResponseReceiveABIDescriptor :: Text
finalResponseReceiveABIDescriptor = Text.unlines
  [ "phil-runtime/phase0/final-response-receive-v1"
  , "base-rejected-response-abi-digest=" <> unDigest (digestText rejectedResponseABIDescriptor)
  , "target=" <> llvmTargetTripleName phase0RejectedResponseLLVMTarget
  , "data-layout=" <> llvmTargetDataLayout phase0RejectedResponseLLVMTarget
  , "receive-final-response=phil_runtime_receive_final_response(ptr,ptr)->i1"
  , "receive-transport-operand=exact-client-transport-handle"
  , "accepted-out-operand=caller-owned-pointer-slot-for-opaque-UploadId-handle"
  , "accepted-return=true"
  , "rejected-return=false"
  , "accepted-wire=exactly-0x01||UploadIdToken[16]"
  , "rejected-wire=exactly-0x00||0x01"
  , "accepted-token-materialization=runtime-private-opaque-UploadId-handle"
  , "rejected-DigestFailure-representation=erased-after-exact-program-no-use-witness"
  , "record-upload-id=phil_runtime_record_upload_id(ptr)->void"
  , "malformed-truncated-reserved-response=runtime-must-not-return-normally"
  , "malformed-response-generated-branch=none"
  , "outer-framing=not-defined-by-this-profile"
  , "ambient-final-response-state=forbidden"
  , "ambient-upload-id-state=forbidden"
  , "runtime-symbol-identity=physical-primitive-and-signature"
  , "pointer-strengthening=none-by-default"
  ]

phase0FinalResponseReceiveLLVMTarget :: LLVMTargetProfile
phase0FinalResponseReceiveLLVMTarget = phase0RejectedResponseLLVMTarget
  { llvmTargetRuntimeABIDigest = digestText finalResponseReceiveABIDescriptor
  , llvmTargetRuntimeABIProfile = "phil-runtime/phase0/final-response-receive-v1"
  }

phase0FinalResponseReceiveLLVMArtifact :: Either SessionChoiceError LLVMArtifact
phase0FinalResponseReceiveLLVMArtifact = do
  bundle <- phase0SessionChoiceBundle
  pure (lowerSystemsFinalResponseReceive
    phase0FinalResponseReceiveLLVMTarget
    (sessionChoiceArtifact bundle))

lowerSystemsFinalResponseReceive :: LLVMTargetProfile -> SystemsArtifact -> LLVMArtifact
lowerSystemsFinalResponseReceive target systemsArtifact = artifact
  where
    base = lowerSystemsRejectedResponse target systemsArtifact
    witness = phase0FinalResponseChoiceWitness
    module0 = llvmArtifactModule base
    module1 = module0
      { llvmFunctions = Map.adjust rewriteFunction
          (sessionChoiceFunction witness)
          (llvmFunctions module0)
      }
    rewriteFunction function = function
      { llvmFunctionBlocks = Map.adjust rewriteAcceptedBlock acceptedBlockId $
          Map.adjust rewriteOfferBlock offerBlockId (llvmFunctionBlocks function)
      }
    offerBlockId = LLVMBlockId (unBlockId (sessionChoiceOfferBlock witness))
    acceptedBlockId = LLVMBlockId (unBlockId (sessionChoiceAcceptedTarget witness))
    rejectedBlockId = LLVMBlockId (unBlockId (sessionChoiceRejectedTarget witness))
    rewriteOfferBlock blockValue = blockValue
      { llvmBlockTerminator = LLVMFinalResponseOffer
          (unValueId (sessionChoiceTransport witness))
          (unValueId (sessionChoiceAcceptedPayload witness))
          acceptedBlockId
          rejectedBlockId
      }
    rewriteAcceptedBlock blockValue = blockValue
      { llvmBlockOps = concatMap rewriteAcceptedOp (llvmBlockOps blockValue) }
    rewriteAcceptedOp operation = case operation of
      LLVMCall name | name == sessionChoiceRecordOperation witness ->
        [ LLVMFinalResponsePayloadBinding (unValueId (sessionChoiceAcceptedPayload witness))
        , LLVMRecordUploadId (unValueId (sessionChoiceAcceptedPayload witness))
        ]
      other -> [other]
    contract0 = llvmArtifactContract base
    contract1 = contract0 { llvmContractTargetDigest = llvmModuleDigest module1 }
    artifact = base
      { llvmArtifactModule = module1
      , llvmArtifactText = renderLLVMModule module1
      , llvmArtifactContract = contract1
      }

phase0FinalResponseReceiveLLVMVerificationContext
  :: SessionChoiceBundle
  -> LLVMVerificationContext
phase0FinalResponseReceiveLLVMVerificationContext bundle = LLVMVerificationContext
  { llvmSystemsContext = sessionChoiceContext bundle
  , llvmExpectedLanguageVersion = llvmTargetLanguageVersion phase0FinalResponseReceiveLLVMTarget
  , llvmExpectedToolVersion = llvmTargetToolVersion phase0FinalResponseReceiveLLVMTarget
  , llvmExpectedTargetTriple = llvmTargetTripleName phase0FinalResponseReceiveLLVMTarget
  , llvmExpectedDataLayout = llvmTargetDataLayout phase0FinalResponseReceiveLLVMTarget
  , llvmExpectedRuntimeABIDigest = llvmTargetRuntimeABIDigest phase0FinalResponseReceiveLLVMTarget
  , llvmExpectedRuntimeABIProfile = llvmTargetRuntimeABIProfile phase0FinalResponseReceiveLLVMTarget
  , llvmAuthorizedStrengthenings = mempty
  }

verifyFinalResponseReceiveTranslation
  :: SessionChoiceBundle
  -> LLVMArtifact
  -> Either FinalResponseReceiveLLVMError ()
verifyFinalResponseReceiveTranslation bundle llvmArtifact = do
  mapLeft FinalResponseReceiveSystemsError $ verifySessionChoiceBundle bundle
  let systemsArtifact = sessionChoiceArtifact bundle
      systemsProgram = systemsArtifactProgram systemsArtifact
      llvmModule = llvmArtifactModule llvmArtifact
      context = phase0FinalResponseReceiveLLVMVerificationContext bundle
  forM_ (Map.toAscList (systemsProgramFunctions systemsProgram)) $
    \(functionName, systemsFunction) -> do
      llvmFunction <- lookupLLVMFunction llvmModule functionName
      let expectedParameters =
            [ LLVMParameter (unValueId valueId) LLVMPointerParameter
            | (valueId, SystemsValue { systemsValueRole = TransportHandle }) <-
                Map.toAscList (systemsFunctionValues systemsFunction)
            ]
      unless (llvmFunctionParameters llvmFunction == expectedParameters) $
        Left (FinalResponseReceiveTransportParameterMismatch
          functionName (llvmFunctionParameters llvmFunction))
  verifyFinalResponseReceiveWitness bundle llvmArtifact
  mapLeft FinalResponseReceiveLLVMVerificationError $
    verifyLLVMEmissionWith
      lowerSystemsFinalResponseReceive
      context
      systemsArtifact
      llvmArtifact

verifyFinalResponseReceiveWitness
  :: SessionChoiceBundle
  -> LLVMArtifact
  -> Either FinalResponseReceiveLLVMError ()
verifyFinalResponseReceiveWitness bundle llvmArtifact = do
  let witness = sessionChoiceWitness bundle
      predecessor = sessionChoicePredecessor bundle
      rejectedWitness = rejectedResponseWitness predecessor
      acceptedWitness = acceptedResponseWitness (rejectedResponseAcceptedBundle predecessor)
      moduleValue = llvmArtifactModule llvmArtifact
      clientFunctionName = sessionChoiceFunction witness
      offerBlockId = LLVMBlockId (unBlockId (sessionChoiceOfferBlock witness))
      acceptedBlockId = LLVMBlockId (unBlockId (sessionChoiceAcceptedTarget witness))
      rejectedBlockId = LLVMBlockId (unBlockId (sessionChoiceRejectedTarget witness))
      uploadIdName = unValueId (sessionChoiceAcceptedPayload witness)
      transportName = unValueId (sessionChoiceTransport witness)
  clientFunction <- lookupLLVMFunction moduleValue clientFunctionName
  offerBlock <- lookupLLVMBlock clientFunctionName clientFunction offerBlockId
  unless
    (llvmBlockTerminator offerBlock == LLVMFinalResponseOffer
      transportName uploadIdName acceptedBlockId rejectedBlockId) $
    Left (FinalResponseReceiveOfferMismatch
      clientFunctionName offerBlockId (llvmBlockTerminator offerBlock))

  acceptedBlock <- lookupLLVMBlock clientFunctionName clientFunction acceptedBlockId
  unless
    (llvmBlockOps acceptedBlock ==
      [LLVMFinalResponsePayloadBinding uploadIdName, LLVMRecordUploadId uploadIdName]) $
    Left (FinalResponseReceiveAcceptedOpsMismatch
      clientFunctionName acceptedBlockId (llvmBlockOps acceptedBlock))
  unless (llvmBlockTerminator acceptedBlock == LLVMReturn "success") $
    Left (FinalResponseReceiveAcceptedOutcomeMismatch
      clientFunctionName acceptedBlockId (llvmBlockTerminator acceptedBlock))

  rejectedBlock <- lookupLLVMBlock clientFunctionName clientFunction rejectedBlockId
  unless (null (llvmBlockOps rejectedBlock)) $
    Left (FinalResponseReceiveRejectedOpsMismatch
      clientFunctionName rejectedBlockId (llvmBlockOps rejectedBlock))
  unless (llvmBlockTerminator rejectedBlock == LLVMReturn "failure") $
    Left (FinalResponseReceiveRejectedOutcomeMismatch
      clientFunctionName rejectedBlockId (llvmBlockTerminator rejectedBlock))

  serverFunction <- lookupLLVMFunction moduleValue (rejectedResponseFunction rejectedWitness)
  let serverAcceptedBlockId = LLVMBlockId (unBlockId (acceptedResponseBlock acceptedWitness))
      serverRejectedBlockId = LLVMBlockId (unBlockId (rejectedResponseBlock rejectedWitness))
  serverAcceptedBlock <- lookupLLVMBlock
    (rejectedResponseFunction rejectedWitness) serverFunction serverAcceptedBlockId
  unless
    (llvmBlockOps serverAcceptedBlock ==
      [ LLVMAcceptedResponse
          (unValueId (acceptedResponseTransport acceptedWitness))
          (unValueId (acceptedResponseUploadId acceptedWitness))
      ]) $
    Left (FinalResponseReceiveServerAcceptedRegression
      (rejectedResponseFunction rejectedWitness)
      serverAcceptedBlockId
      (llvmBlockOps serverAcceptedBlock))
  serverRejectedBlock <- lookupLLVMBlock
    (rejectedResponseFunction rejectedWitness) serverFunction serverRejectedBlockId
  case llvmBlockOps serverRejectedBlock of
    [LLVMBufferRelease _, LLVMRejectedResponse _ _] -> pure ()
    operations -> Left (FinalResponseReceiveServerRejectedRegression
      (rejectedResponseFunction rejectedWitness) serverRejectedBlockId operations)

  let rendered = llvmArtifactText llvmArtifact
      receiveNeedle = "@phil_runtime_receive_final_response(ptr %"
        <> symbolish transportName <> ", ptr %phil_final_response_upload_id_slot_"
        <> symbolish uploadIdName <> ")"
      loadNeedle = "%" <> symbolish uploadIdName
        <> " = load ptr, ptr %phil_final_response_upload_id_slot_" <> symbolish uploadIdName
      recordNeedle = "@phil_runtime_record_upload_id(ptr %" <> symbolish uploadIdName <> ")"
  unless (Text.isInfixOf receiveNeedle rendered
      && Text.isInfixOf loadNeedle rendered
      && Text.isInfixOf recordNeedle rendered) $
    Left (FinalResponseReceiveRenderedCallMissing clientFunctionName)
  unless
    ( not (Text.isInfixOf "@phil_call_receive_accepted_rejected_label" rendered)
    && not (Text.isInfixOf "@phil_call_record_upload_id" rendered)
    ) $
    Left (FinalResponseReceiveGenericCallDetected clientFunctionName)
  unless
    ( not (Text.isInfixOf "@phil_current_final_response" rendered)
    && not (Text.isInfixOf "@phil_current_upload_id" rendered)
    && not (Text.isInfixOf "@phil_last_response" rendered)
    ) $
    Left (FinalResponseReceiveAmbientStateDetected clientFunctionName)
  unless (not (Text.isInfixOf "client_digest_failure" rendered)) $
    Left (FinalResponseReceiveDigestFailureLeaked clientFunctionName)

lookupLLVMFunction
  :: LLVMModule
  -> Text
  -> Either FinalResponseReceiveLLVMError LLVMFunction
lookupLLVMFunction moduleValue functionName =
  case Map.lookup functionName (llvmFunctions moduleValue) of
    Nothing -> Left (FinalResponseReceiveFunctionMissing functionName)
    Just value -> Right value

lookupLLVMBlock
  :: Text
  -> LLVMFunction
  -> LLVMBlockId
  -> Either FinalResponseReceiveLLVMError LLVMBlock
lookupLLVMBlock functionName function blockId =
  case Map.lookup blockId (llvmFunctionBlocks function) of
    Nothing -> Left (FinalResponseReceiveBlockMissing functionName blockId)
    Just value -> Right value

symbolish :: Text -> Text
symbolish = Text.map (\character -> if isAlphaNum character then character else '_')

verifyPhase0FinalResponseReceiveLLVM :: Either FinalResponseReceiveLLVMError ()
verifyPhase0FinalResponseReceiveLLVM = do
  bundle <- mapLeft FinalResponseReceiveSystemsError phase0SessionChoiceBundle
  let llvmArtifact = lowerSystemsFinalResponseReceive
        phase0FinalResponseReceiveLLVMTarget
        (sessionChoiceArtifact bundle)
  verifyFinalResponseReceiveTranslation bundle llvmArtifact

mapLeft :: (left -> mapped) -> Either left right -> Either mapped right
mapLeft transform = either (Left . transform) Right
'''
          Path("src/Phil/LLVM/SessionOffer.hs").write_text(session_offer)

          emitter = r'''module Main (main) where

import qualified Data.Text.IO as TextIO
import Phil.LLVM
  ( llvmArtifactText
  , phase0FinalResponseReceiveLLVMArtifact
  , verifyPhase0FinalResponseReceiveLLVM
  )
import System.Exit (exitFailure)
import qualified System.IO as IO

main :: IO () = case (verifyPhase0FinalResponseReceiveLLVM, phase0FinalResponseReceiveLLVMArtifact) of
  (Left verificationError, _) -> do
    IO.hPutStrLn IO.stderr $
      "Phase 0 final-response receive LLVM verification failed: " <> show verificationError
    exitFailure
  (_, Left systemsError) -> do
    IO.hPutStrLn IO.stderr $
      "Phase 0 final-response Systems candidate failed: " <> show systemsError
    exitFailure
  (Right (), Right artifact) -> TextIO.putStr (llvmArtifactText artifact)
'''
          Path("app/LLVMFinalResponseReceiveMain.hs").write_text(emitter)

          tests = r'''{-# LANGUAGE OverloadedStrings #-}

module Main (main) where

import qualified Data.Map.Strict as Map
import qualified Data.Text as Text
import Phil.LLVM
import Phil.Systems
import System.Exit (exitFailure)

main :: IO ()
main = do
  results <- sequence
    [ test "final-response receive translation verifies" translationPasses
    , test "offer lowers to exact decoder operands and targets" exactOffer
    , test "accepted payload binds then reaches record_upload_id" exactAcceptedPayloadUse
    , test "rejected DigestFailure has no target representation" rejectedReasonErased
    , test "legacy generic final-response calls are absent" noLegacyCalls
    , test "wrong accepted target is rejected" wrongAcceptedTargetRejects
    , test "missing accepted payload binding is rejected" missingBindingRejects
    ]
  if and results then pure () else exitFailure

translationPasses :: Bool
translationPasses = case phase0SessionChoiceBundle of
  Left _ -> False
  Right bundle -> case verifyFinalResponseReceiveTranslation bundle (artifactFor bundle) of
    Right () -> True
    Left _ -> False

exactOffer :: Bool
exactOffer = withBundle $ \bundle artifact ->
  let witness = sessionChoiceWitness bundle
      expected = LLVMFinalResponseOffer
        (unValueId (sessionChoiceTransport witness))
        (unValueId (sessionChoiceAcceptedPayload witness))
        (LLVMBlockId (unBlockId (sessionChoiceAcceptedTarget witness)))
        (LLVMBlockId (unBlockId (sessionChoiceRejectedTarget witness)))
  in case lookupBlock artifact (sessionChoiceFunction witness) (sessionChoiceOfferBlock witness) of
      Just blockValue -> llvmBlockTerminator blockValue == expected
      Nothing -> False

exactAcceptedPayloadUse :: Bool
exactAcceptedPayloadUse = withBundle $ \bundle artifact ->
  let witness = sessionChoiceWitness bundle
      uploadId = unValueId (sessionChoiceAcceptedPayload witness)
  in case lookupBlock artifact (sessionChoiceFunction witness) (sessionChoiceAcceptedTarget witness) of
      Just blockValue -> llvmBlockOps blockValue
        == [LLVMFinalResponsePayloadBinding uploadId, LLVMRecordUploadId uploadId]
      Nothing -> False

rejectedReasonErased :: Bool
rejectedReasonErased = withBundle $ \_ artifact ->
  not (Text.isInfixOf "client_digest_failure" (llvmArtifactText artifact))

noLegacyCalls :: Bool
noLegacyCalls = withBundle $ \_ artifact ->
  let rendered = llvmArtifactText artifact
  in not (Text.isInfixOf "phil_call_receive_accepted_rejected_label" rendered)
      && not (Text.isInfixOf "phil_call_record_upload_id" rendered)

wrongAcceptedTargetRejects :: Bool
wrongAcceptedTargetRejects = withBundle $ \bundle artifact ->
  let witness = sessionChoiceWitness bundle
      mutated = mapBlock artifact (sessionChoiceFunction witness) (sessionChoiceOfferBlock witness) $ \blockValue ->
        blockValue { llvmBlockTerminator = case llvmBlockTerminator blockValue of
          LLVMFinalResponseOffer transport uploadId _ rejected ->
            LLVMFinalResponseOffer transport uploadId rejected rejected
          other -> other
        }
  in case verifyFinalResponseReceiveWitness bundle mutated of
      Left FinalResponseReceiveOfferMismatch {} -> True
      _ -> False

missingBindingRejects :: Bool
missingBindingRejects = withBundle $ \bundle artifact ->
  let witness = sessionChoiceWitness bundle
      mutated = mapBlock artifact (sessionChoiceFunction witness) (sessionChoiceAcceptedTarget witness) $ \blockValue ->
        blockValue { llvmBlockOps = [LLVMRecordUploadId (unValueId (sessionChoiceAcceptedPayload witness))] }
  in case verifyFinalResponseReceiveWitness bundle mutated of
      Left FinalResponseReceiveAcceptedOpsMismatch {} -> True
      _ -> False

withBundle :: (SessionChoiceBundle -> LLVMArtifact -> Bool) -> Bool
withBundle action = case phase0SessionChoiceBundle of
  Left _ -> False
  Right bundle -> action bundle (artifactFor bundle)

artifactFor :: SessionChoiceBundle -> LLVMArtifact
artifactFor bundle = lowerSystemsFinalResponseReceive
  phase0FinalResponseReceiveLLVMTarget
  (sessionChoiceArtifact bundle)

lookupBlock :: LLVMArtifact -> Text.Text -> BlockId -> Maybe LLVMBlock
lookupBlock artifact functionName blockId = do
  function <- Map.lookup functionName (llvmFunctions (llvmArtifactModule artifact))
  Map.lookup (LLVMBlockId (unBlockId blockId)) (llvmFunctionBlocks function)

mapBlock
  :: LLVMArtifact
  -> Text.Text
  -> BlockId
  -> (LLVMBlock -> LLVMBlock)
  -> LLVMArtifact
mapBlock artifact functionName blockId transform =
  let moduleValue = llvmArtifactModule artifact
      functions = llvmFunctions moduleValue
      functions' = Map.adjust
        (\function -> function
          { llvmFunctionBlocks = Map.adjust transform
              (LLVMBlockId (unBlockId blockId))
              (llvmFunctionBlocks function)
          })
        functionName
        functions
      moduleValue' = moduleValue { llvmFunctions = functions' }
  in artifact
      { llvmArtifactModule = moduleValue'
      , llvmArtifactText = renderLLVMModule moduleValue'
      }

test :: String -> Bool -> IO Bool
test label passed = do
  putStrLn ((if passed then "PASS: " else "FAIL: ") <> label)
  pure passed
'''
