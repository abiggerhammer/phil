name: FSEM-02 Partial-Mask Reversibility Preflight

on:
  push:
    branches:
      - formal-semantics/fsem02-four-site-mask-reversibility
    paths:
      - 'test/Phase1FSEM02ProtocolProgressionMain.hs'
      - 'proof/Phil/Core/FSEM02PingPartialMaskReversibility.v'
      - 'docs/phase-1/formal-semantics-source-ping-partial-mask-reversibility-fsem02-v1.md'
      - 'docs/phase-1/typing-and-semantics-reader-guide-v1.md'
      - '.github/workflows/fsem02-partial-mask-reversibility-preflight.yml'
  pull_request:
    paths:
      - 'test/Phase1FSEM02ProtocolProgressionMain.hs'
      - 'proof/Phil/Core/FSEM02PingPartialMaskReversibility.v'
      - 'docs/phase-1/formal-semantics-source-ping-partial-mask-reversibility-fsem02-v1.md'
      - 'docs/phase-1/typing-and-semantics-reader-guide-v1.md'
      - '.github/workflows/fsem02-partial-mask-reversibility-preflight.yml'

permissions:
  contents: read

jobs:
  strict-haskell-source-ping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
          cabal-update: false
      - run: bash scripts/ci/cabal-update-retry.sh
      - run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Check 36,864 partial-mask probes and source witnesses
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1FSEM02ProtocolProgressionMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1FSEM02ProtocolProgressionMain.hs
          sha256sum test/Phase1FSEM02ProtocolProgressionMain.hs test/fixtures/fsem02-protocol-progression-v1/accepted.phil test/fixtures/fsem02-protocol-progression-v1/stale-close.phil

  rocq:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check observation mask absorption and disjointness
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          for file in proof/Phil/Core/Syntax.v proof/Phil/Core/Context.v proof/Phil/Core/ContextJoin.v proof/Phil/Core/ProcessJoin.v proof/Phil/Core/ProcessTerminal.v proof/Phil/Core/ArchitectureIdentity.v proof/Phil/Core/ArchitectureInstantiation.v proof/Phil/Core/ProviderReplacementQualification.v proof/Phil/Core/ArchitectureRealization.v proof/Phil/Systems/FactDisposition.v proof/Phil/Assurance/ValidityScope.v proof/Phil/Core/SystemsStageClosure.v proof/Phil/Core/SystemsGenericLowering.v proof/Phil/Core/ConcurrencySemantics.v proof/Phil/Core/SessionStep.v proof/Phil/Core/FSEM02ProtocolHeadProgression.v proof/Phil/Core/FSEM02BranchOutcomeSeparation.v proof/Phil/Core/FSEM02OfferSuccessorFreshness.v proof/Phil/Core/FSEM02PingSuccessorFreshness.v proof/Phil/Core/FSEM02PingJointAtomicity.v proof/Phil/Core/FSEM02PingThreeProcessFrame.v proof/Phil/Core/FSEM02PingDisjointPairs.v proof/Phil/Core/FSEM02PingDisjointTerminalInterleavings.v proof/Phil/Core/FSEM02PingClosePrefixFaultRetry.v proof/Phil/Core/FSEM02PingTripleDisjointTerminal.v proof/Phil/Core/FSEM02PingMixedPrefixFault.v proof/Phil/Core/FSEM02PingMixedPrefixStalePing.v proof/Phil/Core/FSEM02PingPartnerSelection.v proof/Phil/Core/FSEM02PingPartialPartnerPrefix.v proof/Phil/Core/FSEM02PingAdaptivePartnerSuffix.v proof/Phil/Core/FSEM02PingAdaptiveHalfCloseSuffix.v proof/Phil/Core/FSEM02PingAdaptiveFreePeerHeadRetry.v proof/Phil/Core/FSEM02PingAdaptiveFreePeerResourceRetry.v proof/Phil/Core/FSEM02PingAdaptiveFreePeerResourceShapeRetry.v proof/Phil/Core/FSEM02PingAdaptiveHeadResourcePriorityRetry.v proof/Phil/Core/FSEM02PingAdaptiveCrossPeerHeadOwnerRetry.v proof/Phil/Core/FSEM02PingAdaptiveCrossPeerHeadResourceShapeRetry.v proof/Phil/Core/FSEM02PingAdaptiveDualHeadResourceLadder.v proof/Phil/Core/FSEM02PingAdaptiveDualHeadDualResourceLadder.v proof/Phil/Core/FSEM02PingFourFaultRepairOrderConfluence.v proof/Phil/Core/FSEM02PingPostRepairReinjection.v proof/Phil/Core/FSEM02PingPostRepairFourSiteBounce.v proof/Phil/Core/FSEM02PingPartialMaskReversibility.v
          do
            rocq c -Q proof/Phil Phil "$file"
          done
          if grep -nE '^[[:space:]]*(Admitted[.]|Axiom[[:space:]]|Parameter[[:space:]])' proof/Phil/Core/FSEM02PingPartialMaskReversibility.v; then exit 1; fi
          sha256sum proof/Phil/Core/FSEM02PingPartialMaskReversibility.v proof/Phil/Core/FSEM02PingPartialMaskReversibility.vo
