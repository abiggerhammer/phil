name: INT-007 Ping Verification Discovery

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

on:
  pull_request:
    paths:
      - 'src/Phil/Verification/GrammarV1WholeSource.hs'
      - 'src/Phil/Handoff/Phase1VerificationBundle.hs'
      - 'src/Phil/Handoff/Phase1WholeSourceVerification.hs'
      - 'test/Phase1INT007PingVerificationBundleMain.hs'
      - 'handoff/phase1/ping/**'
      - 'phil-core.cabal'
      - '.github/workflows/phase1-int007-ping-verification-discovery.yml'

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded runs of this workflow
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const currentRunNumber = Number(process.env.GITHUB_RUN_NUMBER);
            const prNumber = context.payload.pull_request.number;
            const workflowName = context.workflow;
            const headRef = context.payload.pull_request.head.ref;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                event: 'pull_request',
                branch: headRef,
                per_page: 100
              }
            );
            const active = new Set([
              'queued',
              'in_progress',
              'pending',
              'waiting',
              'requested'
            ]);
            const stale = runs.filter(run => {
              const samePullRequest =
                (run.pull_requests || []).some(pr => pr.number === prNumber)
                  || run.head_branch === headRef;
              return run.id !== currentRunId
                && run.name === workflowName
                && run.run_number < currentRunNumber
                && active.has(run.status)
                && samePullRequest;
            });
            for (const run of stale) {
              core.info(
                `Cancelling superseded ${workflowName} run ${run.id} (${run.status})`
              );
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              } catch (error) {
                if (error.status === 409) {
                  core.info(`Run ${run.id} already left a cancellable state`);
                } else {
                  throw error;
                }
              }
            }
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build whole-source verification bridge strictly
        run: cabal build lib:phil-core --ghc-options=-Werror
      - name: Typecheck Ping handoff replay strictly
        run: cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/Phase1INT007PingVerificationBundleMain.hs
      - name: Emit exact Ping VerificationBundle summaries
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT007PingVerificationBundleMain.hs
