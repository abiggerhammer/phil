name: Remaining Runtime Test Evidence

on:
  pull_request:
    paths:
      - 'src/Phil/Assurance/RemainingRuntimeTestEvidenceProfiles.hs'
      - 'app/TestEvidenceCertificationMain.hs'
      - 'scripts/certify_remaining_runtime_test_evidence.sh'
      - 'src/Phil/Assurance/TestEvidenceCertification.hs'
      - 'src/Phil/Assurance/Verify.hs'
      - 'src/Phil/LLVM/**'
      - 'runtime/phase0/digest_validation_v1*'
      - 'runtime/phase0/transport_exact_receive_v1*'
      - 'runtime/phase0/storage_v1*'
      - 'runtime/phase0/accepted_response_v1*'
      - 'runtime/phase0/rejected_response_v1*'
      - 'scripts/check_runtime_abi.py'
      - '.github/workflows/remaining-runtime-test-evidence.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Phil/Assurance/RemainingRuntimeTestEvidenceProfiles.hs'
      - 'app/TestEvidenceCertificationMain.hs'
      - 'scripts/certify_remaining_runtime_test_evidence.sh'
      - 'src/Phil/Assurance/TestEvidenceCertification.hs'
      - 'src/Phil/Assurance/Verify.hs'
      - 'src/Phil/LLVM/**'
      - 'runtime/phase0/digest_validation_v1*'
      - 'runtime/phase0/transport_exact_receive_v1*'
      - 'runtime/phase0/storage_v1*'
      - 'runtime/phase0/accepted_response_v1*'
      - 'runtime/phase0/rejected_response_v1*'
      - 'scripts/check_runtime_abi.py'
      - '.github/workflows/remaining-runtime-test-evidence.yml'

permissions:
  contents: read

jobs:
  certify-remaining-runtime-test-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build runtime emitters and assurance library
        run: |
          cabal build \
            lib:phil-core \
            phil-llvm-phase0-digest-validation \
            phil-llvm-phase0-exact-receive \
            phil-llvm-phase0-storage \
            phil-llvm-phase0-accepted-response \
            phil-llvm-phase0-rejected-response

      - name: Typecheck remaining profiles and dispatcher
        run: |
          cabal exec -- ghc \
            -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code src/Phil/Assurance/RemainingRuntimeTestEvidenceProfiles.hs
          cabal exec -- ghc \
            -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -Werror \
            -isrc -iapp -fno-code app/TestEvidenceCertificationMain.hs

      - name: Build test-evidence certifier
        run: |
          cabal exec -- ghc -O0 -isrc -iapp \
            app/TestEvidenceCertificationMain.hs \
            -o phil-certify-test-evidence

      - name: Run and certify remaining runtime fixtures
        shell: bash
        run: bash scripts/certify_remaining_runtime_test_evidence.sh

      - uses: actions/upload-artifact@v4
        with:
          name: phil-remaining-runtime-test-evidence-certificates
          path: remaining-runtime-test-evidence-certificates/*.test.cert
          if-no-files-found: error
          retention-days: 30
