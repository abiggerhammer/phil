name: Temporary INT-006 Darwin Sign Notarize

on:
  push:
    branches:
      - phase1-int-006-darwin-sign-notarize

permissions:
  contents: read

jobs:
  build-submit:
    runs-on: macos-26
    environment: macos-release
    env:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Import Developer ID and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/phil-developer-id.p12"
          p8="$RUNNER_TEMP/AuthKey.p8"
          export P12_PATH="$p12" P8_PATH="$p8"
          python3 <<'PY'
          import base64
          import os

          with open(os.environ['P12_PATH'], 'wb') as output:
              output.write(base64.b64decode(os.environ['APPLE_DEVELOPER_ID_P12_BASE64']))
          with open(os.environ['P8_PATH'], 'wb') as output:
              output.write(base64.b64decode(os.environ['APPLE_NOTARY_KEY_P8_BASE64']))
          PY
          chmod 600 "$p12" "$p8"

          keychain="$RUNNER_TEMP/phil-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" \
            -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'\"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          printf 'Developer ID identity: %s\n' "$identity"

          echo "PHIL_DARWIN_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$p8" >> "$GITHUB_ENV"

      - name: Build and Developer-ID sign Steve archive
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/steve-notarized"
          mkdir -p "$out"
          bash scripts/release/build-notarized-steve-phase1-darwin-package.sh build "$out" \
            | tee "$out/build-sign-evidence.txt"
          archive='phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip'
          test -s "$out/$archive"
          test -s "$out/$archive.sha256"

      - name: Submit signed Steve archive for notarization
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/steve-notarized"
          archive="$out/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip"
          bash scripts/release/notarize-darwin-archive.sh submit "$archive" "$out"
          test -s "$out/$(basename "$archive").notary-id"
          test -s "$out/$(basename "$archive").notary-submit.json"

      - name: Preserve exact signed submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: int006-steve-darwin-notary-submission
          path: |
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.sha256
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.notary-id
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.notary-submit.json
            ${{ runner.temp }}/steve-notarized/build-sign-evidence.txt
          if-no-files-found: error
          retention-days: 7

  poll-assess:
    needs:
      - build-submit
    runs-on: macos-26
    environment: macos-release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      PHIL_NOTARY_TIMEOUT_SECONDS: '1200'
      PHIL_NOTARY_POLL_SECONDS: '30'
    steps:
      - uses: actions/checkout@v4

      - name: Verify native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers

      - name: Restore exact signed submission bundle
        uses: actions/download-artifact@v4
        with:
          name: int006-steve-darwin-notary-submission
          path: ${{ runner.temp }}/steve-notarized

      - name: Materialize notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          p8="$RUNNER_TEMP/AuthKey.p8"
          export P8_PATH="$p8"
          python3 <<'PY'
          import base64
          import os

          with open(os.environ['P8_PATH'], 'wb') as output:
              output.write(base64.b64decode(os.environ['APPLE_NOTARY_KEY_P8_BASE64']))
          PY
          chmod 600 "$p8"
          echo "APPLE_NOTARY_KEY_PATH=$p8" >> "$GITHUB_ENV"

      - name: Poll notarization to a bounded result
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/steve-notarized"
          archive="$out/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip"
          bash scripts/release/notarize-darwin-archive.sh poll "$archive" "$out" \
            | tee "$out/notarization-evidence.txt"
          grep -q '^notarization=Accepted$' "$out/notarization-evidence.txt"

      - name: Quarantine, Gatekeeper-assess and smoke Steve
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/steve-notarized"
          bash scripts/release/build-notarized-steve-phase1-darwin-package.sh assess "$out" \
            | tee "$out/smoke-evidence.txt"
          grep -q '^PASS: Developer-ID signed, notarized, quarantined Phase-1 Steve package$' \
            "$out/smoke-evidence.txt"

      - name: Preserve accepted notarization and quarantine smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: int006-steve-darwin-signed-notarized-staging
          path: |
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.sha256
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.notary-id
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.notary-submit.json
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.notary-info.json
            ${{ runner.temp }}/steve-notarized/phil-steve-0.1.1-phase1-aarch64-apple-darwin.zip.notary-log.json
            ${{ runner.temp }}/steve-notarized/build-sign-evidence.txt
            ${{ runner.temp }}/steve-notarized/notarization-evidence.txt
            ${{ runner.temp }}/steve-notarized/smoke-evidence.txt
          if-no-files-found: warn
          retention-days: 7
