name: Phase 1 Audit Final Manifest Fixed Adapter

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/FinalManifestFixedAdapter.v'
      - 'docs/phase-1/audit-final-manifest-fixed-adapter-v1.md'
      - '.github/workflows/phase1-audit-final-manifest-fixed-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Verification/FinalManifestFixedAdapter.v'
      - 'docs/phase-1/audit-final-manifest-fixed-adapter-v1.md'
      - '.github/workflows/phase1-audit-final-manifest-fixed-adapter.yml'

permissions:
  contents: read

jobs:
  final-manifest-fixed-adapter:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile fixed final-authority adapter proof and dependency closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/VerificationArtifact.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestStageReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestNativeCoordinateReflection.v
          rocq c -Q proof/Phil Phil proof/Phil/Verification/FinalManifestFixedAdapter.v

          cat > /tmp/FinalManifestFixedAdapterAssumptions.v <<'EOF'
          From Phil.Verification Require Import FinalManifestFixedAdapter.
          Print Assumptions fixed_adapter_release_bound.
          Print Assumptions fixed_adapter_stage_represents.
          Print Assumptions fixed_adapter_establishes_final_manifest_match.
          Print Assumptions fixed_adapter_source_identity_is_exact.
          Print Assumptions fixed_adapter_stage_subject_is_exact.
          EOF
          rocq c -Q proof/Phil Phil /tmp/FinalManifestFixedAdapterAssumptions.v 2>&1 | tee final-manifest-fixed-adapter-assumptions.log

      - name: Record exact proof and object identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-manifest-fixed-adapter
          cp proof/Phil/Verification/FinalManifestFixedAdapter.v final-manifest-fixed-adapter/
          cp proof/Phil/Verification/FinalManifestFixedAdapter.vo final-manifest-fixed-adapter/
          cp final-manifest-fixed-adapter-assumptions.log final-manifest-fixed-adapter/
          sha256sum             proof/Phil/Verification/VerificationArtifact.v             proof/Phil/Verification/VerificationArtifact.vo             proof/Phil/Verification/FinalManifestStageReflection.v             proof/Phil/Verification/FinalManifestStageReflection.vo             proof/Phil/Verification/FinalManifestNativeCoordinateReflection.v             proof/Phil/Verification/FinalManifestNativeCoordinateReflection.vo             proof/Phil/Verification/FinalManifestFixedAdapter.v             proof/Phil/Verification/FinalManifestFixedAdapter.vo             final-manifest-fixed-adapter-assumptions.log             > final-manifest-fixed-adapter/identities.sha256
          cat final-manifest-fixed-adapter/identities.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: final-manifest-fixed-adapter
          path: final-manifest-fixed-adapter
          if-no-files-found: error
