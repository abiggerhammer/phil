name: Temporary CALL-019 Invoke Surface Semantics

on:
  push:
    branches: [phase1-call-019-invoke-semantics]
    paths:
      - '.github/workflows/tmp-call-019-invoke-surface.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests
      - name: Exercise CALL-019 callable surface semantics
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1CALL019InvokeSurfaceMain.hs
      - name: Replay explicit invoke syntax
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1CALL019InvokeSyntaxMain.hs
      - name: Replay exact callable resolution substrate
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1CALL019CallableResolutionMain.hs
      - name: Replay INT-001 source architecture identity
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT001SourceArchitectureMain.hs
      - name: Replay INT-001 source/Core correspondence
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT001SourceCorePolicyMain.hs
