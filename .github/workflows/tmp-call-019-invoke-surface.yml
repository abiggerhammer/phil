name: Temporary CALL-019 Invoke Surface Semantics

on:
  push:
    branches: [phase1-call-019-invoke-semantics]
    paths:
      - '.github/workflows/tmp-call-019-invoke-surface.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch callable surface semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Surface checker types: keep callable namespace distinct from primitives
          # and carry exact declaration identity plus checked argument/result shape.
          replace(
              'src/Phil/Surface/Check/Types.hs',
              '  , PrimitiveSemantics (..)\n  , ReleaseRequirement (..)',
              '  , PrimitiveSemantics (..)\n  , SurfaceCallableSignature (..)\n  , ReleaseRequirement (..)')
          replace(
              'src/Phil/Surface/Check/Types.hs',
              'import Phil.Core.Static (StaticContext)',
              'import Phil.Core.Static (DeclarationKey, StaticContext)')
          replace(
              'src/Phil/Surface/Check/Types.hs',
              '  | UnknownPrimitive\n  | TypeMismatch',
              '  | UnknownPrimitive\n  | UnknownCallable\n  | TypeMismatch')
          replace(
              'src/Phil/Surface/Check/Types.hs',
              '  | PrimitiveHandlePayload\n  deriving (Eq, Ord, Show)\n\n-- | Exact prerequisites established by the competent resource/callable/provider',
              '''  | PrimitiveHandlePayload\n  deriving (Eq, Ord, Show)\n\n-- | Already-resolved ordinary callable signature available to the surface\n-- checker. The display spelling remains only the map key: exact declaration\n-- identity is carried explicitly and provider primitives live in a separate map.\n-- Parameter/result structural modes are checked together with semantic types so\n-- restricted ownership transfer cannot be erased by a name-only invocation.\ndata SurfaceCallableSignature = SurfaceCallableSignature\n  { surfaceCallableDeclarationKey :: DeclarationKey\n  , surfaceCallableParameters :: [(Mode, Ty)]\n  , surfaceCallableResult :: Maybe (Mode, Ty)\n  }\n  deriving (Eq, Show)\n\n-- | Exact prerequisites established by the competent resource/callable/provider''')
          replace(
              'src/Phil/Surface/Check/Types.hs',
              '  , surfacePrimitives :: Map Text PrimitiveSemantics\n  , surfaceTypeAliases',
              '  , surfacePrimitives :: Map Text PrimitiveSemantics\n  , surfaceCallables :: Map Text SurfaceCallableSignature\n  , surfaceTypeAliases')
          replace(
              'src/Phil/Surface/Check/Types.hs',
              '  , surfacePrimitives = Map.empty\n  , surfaceTypeAliases',
              '  , surfacePrimitives = Map.empty\n  , surfaceCallables = Map.empty\n  , surfaceTypeAliases')

          # Preflight must recurse through invoke arguments without consulting the
          # provider-primitive namespace.
          replace(
              'src/Phil/Surface/Check/Preflight.hs',
              '{-# LANGUAGE OverloadedStrings #-}',
              '{-# LANGUAGE OverloadedStrings #-}\n{-# LANGUAGE PatternSynonyms #-}')
          replace(
              'src/Phil/Surface/Check/Preflight.hs',
              '  , SurfaceExpression (..)\n  , SurfaceProposition (..)',
              '  , SurfaceExpression (..)\n  , pattern InvokeExpression\n  , SurfaceProposition (..)')
          replace(
              'src/Phil/Surface/Check/Preflight.hs',
              '        TupleExpression values -> mapM_ (checkExpression bound) values\n        CallExpression name arguments -> do',
              '        TupleExpression values -> mapM_ (checkExpression bound) values\n        InvokeExpression _ arguments -> mapM_ (checkExpression bound) arguments\n        CallExpression name arguments -> do')

          # Production surface execution: invoke uses a separate callable signature
          # map and sequentially transfers/validates each argument.
          replace(
              'src/Phil/Surface/Check/Engine.hs',
              '{-# LANGUAGE OverloadedStrings #-}',
              '{-# LANGUAGE OverloadedStrings #-}\n{-# LANGUAGE PatternSynonyms #-}')
          replace(
              'src/Phil/Surface/Check/Engine.hs',
              '  , SurfaceExpression (..)\n  , SurfaceProposition',
              '  , SurfaceExpression (..)\n  , pattern InvokeExpression\n  , SurfaceProposition')
          replace(
              'src/Phil/Surface/Check/Engine.hs',
              '    ConstructExpression constructor fields -> do\n      scalar <- constructValue environment state locatedExpression constructor fields\n      Right [valuePath state (RuntimeScalar scalar)]\n    CallExpression name arguments ->',
              '    ConstructExpression constructor fields -> do\n      scalar <- constructValue environment state locatedExpression constructor fields\n      Right [valuePath state (RuntimeScalar scalar)]\n    InvokeExpression name arguments ->\n      evalCallable environment state locatedExpression name arguments\n    CallExpression name arguments ->')
          replace(
              'src/Phil/Surface/Check/Engine.hs',
              'evalPrimitive\n  :: SurfaceEnvironment',
              '''evalCallable\n  :: SurfaceEnvironment\n  -> SurfaceState\n  -> Located SurfaceExpression\n  -> Text\n  -> [Located SurfaceExpression]\n  -> Either SurfaceCheckError [SurfacePath]\nevalCallable environment state located name arguments =\n  case Map.lookup name (surfaceCallables environment) of\n    Nothing -> throw located UnknownCallable\n      ("callable is not declared in invocation Sigma: " <> name)\n    Just signature -> do\n      let parameters = surfaceCallableParameters signature\n      unless (length arguments == length parameters) $\n        throw located TypeMismatch\n          ("callable arity mismatch; expected " <> Text.pack (show (length parameters)))\n      next <- foldM checkArgument state (zip parameters arguments)\n      result <- callableResultValue signature\n      Right [valuePath next result]\n  where\n    checkArgument current ((expectedMode, expectedType), expression) = do\n      paths <- evalExpression environment current expression\n      case paths of\n        [SurfacePath PathContinue next (Just value)] -> do\n          unless (compareTypes (runtimeType value) expectedType == DefinitionallyEqual) $\n            throw expression TypeMismatch "callable argument type mismatch"\n          actualMode <- callableRuntimeMode expression value\n          unless (actualMode == expectedMode) $\n            throw expression StructuralUse "callable argument structural mode mismatch"\n          Right next\n        _ -> throw expression TypeMismatch\n          "callable argument must produce exactly one continuing value"\n\n    callableRuntimeMode expression value = case value of\n      RuntimeUnit -> Right Unrestricted\n      RuntimeScalar scalar -> Right (scalarMode scalar)\n      RuntimeTuple _ -> throw expression TypeMismatch\n        "tuple-valued callable arguments require an explicit product signature"\n\n    callableResultValue signature = case surfaceCallableResult signature of\n      Nothing -> Right RuntimeUnit\n      Just (mode, ty)\n        | compareTypes ty TyUnit == DefinitionallyEqual ->\n            if mode == Unrestricted\n              then Right RuntimeUnit\n              else throw located TypeMismatch\n                "callable signature cannot return restricted Unit"\n        | otherwise -> Right\n            (RuntimeScalar (ScalarValue mode ty (shapeForType ty)))\n\nevalPrimitive\n  :: SurfaceEnvironment''')

          # Architecture identity must record invoke as invoke, not as the hidden
          # compatibility encoding of an ordinary provider call.
          replace(
              'src/Phil/Compiler/SourceArchitecture.hs',
              '{-# LANGUAGE OverloadedStrings #-}',
              '{-# LANGUAGE OverloadedStrings #-}\n{-# LANGUAGE PatternSynonyms #-}')
          replace(
              'src/Phil/Compiler/SourceArchitecture.hs',
              '  TupleExpression values -> tagged "tuple"\n    [SemanticOrdered (map (expressionSemantics . locatedValue) values)]\n  CallExpression name arguments -> tagged "call"',
              '  TupleExpression values -> tagged "tuple"\n    [SemanticOrdered (map (expressionSemantics . locatedValue) values)]\n  InvokeExpression name arguments -> tagged "invoke"\n    [ atom name\n    , SemanticOrdered (map (expressionSemantics . locatedValue) arguments)\n    ]\n  CallExpression name arguments -> tagged "call"')

          # Provider-call correspondence policy must not count invoke itself as a
          # provider primitive call, while still seeing provider calls nested in args.
          replace(
              'src/Phil/Compiler/SourceCorePolicy.hs',
              '{-# LANGUAGE OverloadedStrings #-}',
              '{-# LANGUAGE OverloadedStrings #-}\n{-# LANGUAGE PatternSynonyms #-}')
          replace(
              'src/Phil/Compiler/SourceCorePolicy.hs',
              '  TupleExpression values -> calls values\n  CallExpression name arguments -> name : calls arguments',
              '  TupleExpression values -> calls values\n  InvokeExpression _ arguments -> calls arguments\n  CallExpression name arguments -> name : calls arguments')
          PY

          cat > test/Phase1CALL019InvokeSurfaceMain.hs <<'HS'
          {-# LANGUAGE OverloadedStrings #-}

          module Main (main) where

          import qualified Data.Map.Strict as Map
          import Data.Text (Text)
          import Phil.Core.Static (DeclarationKey (..), emptyStaticContext)
          import Phil.Core.Syntax (Mode (..), Ty (..))
          import Phil.Surface.Check
            ( InitialBinding (..)
            , PrimitiveSemantics (..)
            , RejectionClass (..)
            , SurfaceCallableSignature (..)
            , SurfaceCheckError (..)
            , SurfaceEnvironment (..)
            , SurfaceShape (..)
            , checkSurfaceComponent
            , emptySurfaceEnvironment
            )
          import Phil.Surface.Parser (parseSurfaceFile)
          import Phil.Surface.Syntax (Component, Located, SurfaceFile (..))
          import System.Exit (exitFailure)

          main :: IO ()
          main = do
            results <- sequence
              [ test "CALL-019 invoke accepts exact checked signature" validLinearInvoke
              , test "CALL-019 invoke transfers a restricted argument" invokeConsumesLinear
              , test "CALL-019 unknown callable rejects at callable competence" unknownCallableRejects
              , test "CALL-019 provider primitive cannot rescue invoke lookup" primitiveCannotRescueInvoke
              , test "CALL-019 ordinary call remains provider primitive lookup" ordinaryCallRemainsPrimitive
              , test "CALL-019 callable result carries declared restricted mode" restrictedResultReturns
              ]
            if and results then pure () else exitFailure

          test :: String -> Either String () -> IO Bool
          test label result = case result of
            Right () -> putStrLn ("PASS: " <> label) >> pure True
            Left detail -> putStrLn ("FAIL: " <> label <> " -- " <> detail) >> pure False

          blobType :: Ty
          blobType = TyOpaque "Blob"

          candidateBinding :: InitialBinding
          candidateBinding = InitialBinding Linear blobType PlainShape

          callable :: Text -> [(Mode, Ty)] -> Maybe (Mode, Ty) -> SurfaceCallableSignature
          callable key parameters result = SurfaceCallableSignature
            { surfaceCallableDeclarationKey = DeclarationKey key
            , surfaceCallableParameters = parameters
            , surfaceCallableResult = result
            }

          takeSignature :: SurfaceCallableSignature
          takeSignature = callable "decl.take" [(Linear, blobType)] Nothing

          baseWithCandidate :: SurfaceEnvironment
          baseWithCandidate = (emptySurfaceEnvironment emptyStaticContext)
            { surfaceInitialBindings = Map.singleton "candidate" candidateBinding
            , surfaceCallables = Map.singleton "Take" takeSignature
            }

          validLinearInvoke :: Either String ()
          validLinearInvoke = expectAccept baseWithCandidate
            "component Caller(candidate) { invoke Take(candidate) return unit }"

          invokeConsumesLinear :: Either String ()
          invokeConsumesLinear = expectReject StructuralUse baseWithCandidate
            "component Caller(candidate) { invoke Take(candidate) return candidate }"

          unknownCallableRejects :: Either String ()
          unknownCallableRejects = expectReject UnknownCallable
            (emptySurfaceEnvironment emptyStaticContext)
            "component Caller { invoke Missing() return unit }"

          namespaceEnvironment :: SurfaceEnvironment
          namespaceEnvironment = (emptySurfaceEnvironment emptyStaticContext)
            { surfaceInitialBindings = Map.singleton "candidate" candidateBinding
            , surfacePrimitives = Map.singleton "Worker" PrimitiveUse
            , surfaceCallables = Map.singleton "Worker"
                (callable "decl.worker" [] Nothing)
            }

          primitiveCannotRescueInvoke :: Either String ()
          primitiveCannotRescueInvoke = expectReject TypeMismatch namespaceEnvironment
            "component Caller(candidate) { invoke Worker(candidate) return unit }"

          ordinaryCallRemainsPrimitive :: Either String ()
          ordinaryCallRemainsPrimitive = expectAccept namespaceEnvironment
            "component Caller(candidate) { Worker(candidate) return unit }"

          restrictedResultReturns :: Either String ()
          restrictedResultReturns = expectAccept
            ((emptySurfaceEnvironment emptyStaticContext)
              { surfaceCallables = Map.singleton "Maker"
                  (callable "decl.maker" [] (Just (Linear, blobType)))
              })
            "component Caller { let result = invoke Maker() return result }"

          expectAccept :: SurfaceEnvironment -> Text -> Either String ()
          expectAccept environment source = do
            component <- parseOne source
            _ <- mapLeft show (checkSurfaceComponent environment component)
            Right ()

          expectReject :: RejectionClass -> SurfaceEnvironment -> Text -> Either String ()
          expectReject expected environment source = do
            component <- parseOne source
            case checkSurfaceComponent environment component of
              Left err
                | surfaceErrorClass err == expected -> Right ()
                | otherwise -> Left ("expected " <> show expected <> ", got " <> show err)
              Right result -> Left ("expected rejection, got acceptance: " <> show result)

          parseOne :: Text -> Either String (Located Component)
          parseOne source = do
            parsed <- mapLeft show (parseSurfaceFile "call019-surface" source)
            case surfaceComponents parsed of
              [component] -> Right component
              components -> Left ("expected one component, got " <> show (length components))

          mapLeft :: (a -> b) -> Either a c -> Either b c
          mapLeft f = either (Left . f) Right
          HS

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Phil/Surface/Check/Types.hs \
            src/Phil/Surface/Check/Preflight.hs \
            src/Phil/Surface/Check/Engine.hs \
            src/Phil/Compiler/SourceArchitecture.hs \
            src/Phil/Compiler/SourceCorePolicy.hs \
            test/Phase1CALL019InvokeSurfaceMain.hs
          git commit -m 'call: check invoke through callable surface namespace'
          git push origin HEAD:phase1-call-019-invoke-semantics
