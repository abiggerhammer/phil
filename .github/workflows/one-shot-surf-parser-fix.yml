name: One-shot SURF parser fix

on:
  push:
    branches:
      - phase1-surf-008-bound-relation-elaboration

permissions:
  contents: write

jobs:
  patch-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-008-bound-relation-elaboration
      - name: Repair proposition relation disambiguation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          parser_path = Path('src/Phil/Surface/GrammarV1/Parser.hs')
          parser = parser_path.read_text()
          old = textwrap.dedent('''\
          parsePropositionAtom :: Parser (Located GrammarV1Proposition)
          parsePropositionAtom = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarKeyword "true") -> do
                value <- expectKeyword "true"
                pure (Located (locatedSpan value) GrammarV1TrueProposition)
              Just (GrammarKeyword "false") -> do
                value <- expectKeyword "false"
                pure (Located (locatedSpan value) GrammarV1FalseProposition)
              Just (GrammarSymbol "(") -> do
                start <- expectSymbol "("
                proposition <- parseProposition
                end <- expectSymbol ")"
                pure $ Located
                  (SourceSpan
                    (sourceSpanStart (locatedSpan start))
                    (sourceSpanEnd (locatedSpan end)))
                  (locatedValue proposition)
              Just (GrammarIdentifier _) -> parseNamedPropositionAtom
              Just _ -> parseRelationProposition
              Nothing -> failParser "expected proposition at end of input"
          ''')
          new = textwrap.dedent('''\
          parsePropositionAtom :: Parser (Located GrammarV1Proposition)
          parsePropositionAtom = do
            relation <- peekParsesRelationProposition
            if relation
              then parseRelationProposition
              else parseNonRelationPropositionAtom

          -- | Preserve the normative proposition_atom ordering without committing
          -- identifier-, literal-, or parenthesis-led input to a shorter parse.
          -- relation_proposition owns a complete additive_expression on each side,
          -- so probe that production first and consume nothing during the probe.
          peekParsesRelationProposition :: Parser Bool
          peekParsesRelationProposition = Parser $ \\tokens ->
            Right
              ( case runParser parseRelationProposition tokens of
                  Right _ -> True
                  Left _ -> False
              , tokens
              )

          parseNonRelationPropositionAtom :: Parser (Located GrammarV1Proposition)
          parseNonRelationPropositionAtom = do
            token <- peekToken
            case fmap locatedValue token of
              Just (GrammarKeyword "true") -> do
                value <- expectKeyword "true"
                pure (Located (locatedSpan value) GrammarV1TrueProposition)
              Just (GrammarKeyword "false") -> do
                value <- expectKeyword "false"
                pure (Located (locatedSpan value) GrammarV1FalseProposition)
              Just (GrammarSymbol "(") -> do
                start <- expectSymbol "("
                proposition <- parseProposition
                end <- expectSymbol ")"
                pure $ Located
                  (SourceSpan
                    (sourceSpanStart (locatedSpan start))
                    (sourceSpanEnd (locatedSpan end)))
                  (locatedValue proposition)
              Just (GrammarIdentifier _) -> parseNamedPropositionAtom
              Just _ -> parseRelationProposition
              Nothing -> failParser "expected proposition at end of input"
          ''')
          if parser.count(old) != 1:
              raise SystemExit(f'parser target count was {parser.count(old)}, expected 1')
          parser_path.write_text(parser.replace(old, new, 1))

          test_path = Path('test/Phase1GrammarV1BoundRelationElaborationMain.hs')
          test = test_path.read_text()

          actual_start = test.index('  let actual =\n')
          expected_start = test.index('      expected =\n', actual_start)
          test = (
              test[:actual_start]
              + '  let actual = map (grammarV1BoundRelationProposition state) propositions\n'
              + test[expected_start:]
          )

          helper_start = test.index('projectedProposition :: GrammarV1Proposition\n')
          source_start = test.index('source :: Text.Text\n', helper_start)
          test = test[:helper_start] + test[source_start:]

          old_source = (
              '  , "claim Called = n(1) == n;"\n'
              '  , "claim Consumed = spent == n;"\n'
              '  , "claim TruthLeaf = true;"\n'
          )
          new_source = (
              '  , "claim Called = n(1) == n;"\n'
              '  , "claim Projected = (n).field == n;"\n'
              '  , "claim Consumed = spent == n;"\n'
              '  , "claim Arithmetic = n + 1 == m;"\n'
              '  , "claim TruthLeaf = true;"\n'
          )
          if test.count(old_source) != 1:
              raise SystemExit(f'test source target count was {test.count(old_source)}, expected 1')
          test_path.write_text(test.replace(old_source, new_source, 1))
          PY
      - name: Commit parser repair and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-surf-parser-fix.yml
          git add src/Phil/Surface/GrammarV1/Parser.hs test/Phase1GrammarV1BoundRelationElaborationMain.hs
          git diff --cached --check
          git commit -m 'Fix additive relation proposition parsing'
          git push origin HEAD:phase1-surf-008-bound-relation-elaboration
