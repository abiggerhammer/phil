name: Temporary recognition grammar patch

on:
  push:
    branches:
      - remediate-audit-recognition-grammar
    paths:
      - '.github/workflows/tmp-recognition-grammar-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediate-audit-recognition-grammar
      - name: Apply focused Engine repair and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Phil/Surface/Check/Engine.hs')
          text = path.read_text()

          old_import = '''  , receivePendingSpec\n  , trustedRecognitionFailure\n'''
          new_import = '''  , receivePendingSpec\n  , rawGrammarId\n  , trustedRecognitionFailure\n'''
          if text.count(old_import) != 1:
              raise SystemExit('unexpected Phil.Core.Recognition import shape')
          text = text.replace(old_import, new_import)

          old_branch = '''    PendingRawShape rawView -> do\n      parsed <- mapRecognition located $\n'''
          new_branch = '''    PendingRawShape rawView -> do\n      unless (rawGrammarId rawView == GrammarId grammar) $\n        throw located RecognitionProvenance\n          "recognizer grammar differs from pending frame grammar"\n      parsed <- mapRecognition located $\n'''
          if text.count(old_branch) != 1:
              raise SystemExit('unexpected PendingRawShape recognition branch')
          text = text.replace(old_branch, new_branch)
          path.write_text(text)

          Path('.github/workflows/tmp-recognition-grammar-patch.yml').unlink()
      - name: Commit focused repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Surface/Check/Engine.hs .github/workflows/tmp-recognition-grammar-patch.yml
          git commit -m 'Bind requested recognition grammar to pending ingress'
          git push origin HEAD:remediate-audit-recognition-grammar
