name: Version Refinement Fix

on:
  pull_request:
    paths:
      - '.github/workflows/version-refinement-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lower-version-session-choice
          fetch-depth: 0
      - name: Make client version refinement explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # LLVM IR: explicit transport-scoped selected-version refinement.
          replace_once('src/Phil/LLVM/IR.hs',
          '''  | LLVMVersionChoiceOffer
              Text
              Text
              LLVMBlockId
              LLVMBlockId
            | LLVMReturnScalar Text ScalarType
          ''',
          '''  | LLVMVersionChoiceOffer
              Text
              Text
              LLVMBlockId
              LLVMBlockId
            | LLVMVersionRefinement
              RuntimeSiteRef
              Text
              Text
              LLVMBlockId
              LLVMBlockId
            | LLVMReturnScalar Text ScalarType
          ''')
          replace_once('src/Phil/LLVM/IR.hs',
          '''  LLVMVersionChoiceOffer _ _ versionTarget unsupportedTarget -> [versionTarget, unsupportedTarget]
            LLVMReturnScalar _ _ -> []
          ''',
          '''  LLVMVersionChoiceOffer _ _ versionTarget unsupportedTarget -> [versionTarget, unsupportedTarget]
            LLVMVersionRefinement _ _ _ yes no -> [yes, no]
            LLVMReturnScalar _ _ -> []
          ''')
          replace_once('src/Phil/LLVM/IR.hs',
          '''        LLVMStore site _ _ _ _ -> [site]
                _ -> []
          ''',
          '''        LLVMStore site _ _ _ _ -> [site]
                LLVMVersionRefinement site _ _ _ _ -> [site]
                _ -> []
          ''')
          replace_once('src/Phil/LLVM/IR.hs',
          '''      <> versionChoiceReceiveDeclaration
                <> map renderCallDeclaration''',
          '''      <> versionChoiceReceiveDeclaration
                <> versionRefinementDeclaration
                <> map renderCallDeclaration''')
          replace_once('src/Phil/LLVM/IR.hs',
          '''    versionChoiceReceiveDeclaration =
                if any hasVersionChoiceOffer allBlocks
                  then ["declare i1 @phil_runtime_receive_version_choice(ptr, ptr)"]
                  else []
          ''',
          '''    versionChoiceReceiveDeclaration =
                if any hasVersionChoiceOffer allBlocks
                  then ["declare i1 @phil_runtime_receive_version_choice(ptr, ptr)"]
                  else []

              versionRefinementDeclaration =
                if any hasVersionRefinement allBlocks
                  then ["declare i1 @phil_runtime_refine_selected_version(ptr, i16)"]
                  else []
          ''')
          replace_once('src/Phil/LLVM/IR.hs',
          '''    hasVersionChoiceOffer blockValue = case llvmBlockTerminator blockValue of
                LLVMVersionChoiceOffer {} -> True
                _ -> False
          ''',
          '''    hasVersionChoiceOffer blockValue = case llvmBlockTerminator blockValue of
                LLVMVersionChoiceOffer {} -> True
                _ -> False

              hasVersionRefinement blockValue = case llvmBlockTerminator blockValue of
                LLVMVersionRefinement {} -> True
                _ -> False
          ''')
          replace_once('src/Phil/LLVM/IR.hs',
          '''      LLVMVersionChoiceOffer transport selected versionTarget unsupportedTarget ->
                let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))
                    slotName = "%phil_version_choice_slot_" <> symbol selected
                    versionName = "%phil_version_choice_is_version_" <> blockSymbol
                in
                  [ slotName <> " = alloca i16"
                  , versionName <> " = call i1 @phil_runtime_receive_version_choice(ptr %"
                      <> symbol transport <> ", ptr " <> slotName <> ")"
                  , "br i1 " <> versionName
                      <> ", label %" <> symbol (unLLVMBlockId versionTarget)
                      <> ", label %" <> symbol (unLLVMBlockId unsupportedTarget)
                  ]
                LLVMReturnScalar name scalarType ->
          ''',
          '''      LLVMVersionChoiceOffer transport selected versionTarget unsupportedTarget ->
                let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))
                    slotName = "%phil_version_choice_slot_" <> symbol selected
                    versionName = "%phil_version_choice_is_version_" <> blockSymbol
                in
                  [ slotName <> " = alloca i16"
                  , versionName <> " = call i1 @phil_runtime_receive_version_choice(ptr %"
                      <> symbol transport <> ", ptr " <> slotName <> ")"
                  , "br i1 " <> versionName
                      <> ", label %" <> symbol (unLLVMBlockId versionTarget)
                      <> ", label %" <> symbol (unLLVMBlockId unsupportedTarget)
                  ]
                LLVMVersionRefinement _ transport selected yes no ->
                  let blockSymbol = symbol (unLLVMBlockId (llvmBlockId blockValue))
                      validName = "%phil_version_refinement_ok_" <> blockSymbol
                  in
                    [ validName <> " = call i1 @phil_runtime_refine_selected_version(ptr %"
                        <> symbol transport <> ", i16 %" <> symbol selected <> ")"
                    , "br i1 " <> validName
                        <> ", label %" <> symbol (unLLVMBlockId yes)
                        <> ", label %" <> symbol (unLLVMBlockId no)
                    ]
                LLVMReturnScalar name scalarType ->
          ''')

          # Target-specific lowerer and validator.
          replace_once('src/Phil/LLVM/VersionSessionChoice.hs',
          '''  | VersionChoiceLLVMClientBindingMismatch Text LLVMBlockId [LLVMOp]
            | VersionChoiceLLVMPayloadCancelRegression Text
          ''',
          '''  | VersionChoiceLLVMClientBindingMismatch Text LLVMBlockId [LLVMOp]
            | VersionChoiceLLVMClientRefinementMismatch Text LLVMBlockId LLVMTerminator
            | VersionChoiceLLVMPayloadCancelRegression Text
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoice.hs',
          '''  , "receive-out=pointer-to-i16-selected-version-slot"
            , "wire-unsupported=0x00"
          ''',
          '''  , "receive-out=pointer-to-i16-selected-version-slot"
            , "client-refine=phil_runtime_refine_selected_version(ptr,i16)->i1"
            , "client-refine-arg0=exact-client-transport-handle"
            , "client-refine-arg1=decoded-selected-version"
            , "client-refine-provider-obligation=transport-local-offered-set-is-exact-set-sent-in-prior-Hello"
            , "wire-unsupported=0x00"
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoice.hs',
          '''    rewriteClientVersionTarget blockValue = blockValue
                { llvmBlockOps = LLVMVersionChoicePayloadBinding
                    (unValueId (versionChoiceClientSelectedVersion versionWitness))
                    : llvmBlockOps blockValue
                }
          ''',
          '''    rewriteClientVersionTarget blockValue = blockValue
                { llvmBlockOps = LLVMVersionChoicePayloadBinding
                    (unValueId (versionChoiceClientSelectedVersion versionWitness))
                    : llvmBlockOps blockValue
                , llvmBlockTerminator = case llvmBlockTerminator blockValue of
                    LLVMRuntimeBranch site _ yes no -> LLVMVersionRefinement
                      site
                      (unValueId (versionChoiceClientTransport versionWitness))
                      (unValueId (versionChoiceClientSelectedVersion versionWitness))
                      yes
                      no
                    other -> other
                }
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoice.hs',
          '''  unless (LLVMVersionChoicePayloadBinding clientSelected `elem` llvmBlockOps clientVersion) $
                Left (VersionChoiceLLVMClientBindingMismatch
                  clientName clientVersionTargetId (llvmBlockOps clientVersion))
          ''',
          '''  unless (LLVMVersionChoicePayloadBinding clientSelected `elem` llvmBlockOps clientVersion) $
                Left (VersionChoiceLLVMClientBindingMismatch
                  clientName clientVersionTargetId (llvmBlockOps clientVersion))
              case llvmBlockTerminator clientVersion of
                LLVMVersionRefinement _ transport selected yes no
                  | transport == clientTransport
                      && selected == clientSelected
                      && yes == LLVMBlockId (unBlockId (versionChoiceClientVersionSuccess versionWitness))
                      && no == LLVMBlockId (unBlockId (versionChoiceClientVersionFailure versionWitness)) -> pure ()
                other -> Left (VersionChoiceLLVMClientRefinementMismatch
                  clientName clientVersionTargetId other)
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoice.hs',
          '''    && Text.isInfixOf "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)" rendered
                ) $
          ''',
          '''    && Text.isInfixOf "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)" rendered
                && Text.isInfixOf "declare i1 @phil_runtime_refine_selected_version(ptr, i16)" rendered
                && Text.isInfixOf ("@phil_runtime_refine_selected_version(ptr %" <> symbolish clientTransport
                    <> ", i16 %" <> symbolish clientSelected <> ")") rendered
                ) $
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoice.hs',
          '''mapLeft :: (a -> b) -> Either a c -> Either b c
          ''',
          '''symbolish :: Text -> Text
              symbolish = Text.map (\character -> if isSymbol character then character else '_')
                where
                  isSymbol character =
                    (character >= 'a' && character <= 'z')
                      || (character >= 'A' && character <= 'Z')
                      || (character >= '0' && character <= '9')

              mapLeft :: (a -> b) -> Either a c -> Either b c
          ''')

          # Translation certificate explicitly binds refinement and its residual provider association.
          replace_once('src/Phil/LLVM/VersionSessionChoiceCertification.hs',
          '''-- choose_supported set semantics, opaque version-set representation, concrete
          -- byte I/O, malformed-input non-return, physical write success, LLVM 18,
          -- linking, and native execution remain independent gates.
          ''',
          '''-- choose_supported set semantics, transport-local client offered-version
          -- association, opaque version-set representation, concrete byte I/O,
          -- malformed-input non-return, physical write success, LLVM 18, linking,
          -- and native execution remain independent gates.
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoiceCertification.hs',
          '''        , ("receiver", "phil_runtime_receive_version_choice(ptr,ptr)->i1")
                , ("wire_unsupported", "0x00")
          ''',
          '''        , ("receiver", "phil_runtime_receive_version_choice(ptr,ptr)->i1")
                , ("client_refinement", "phil_runtime_refine_selected_version(ptr,i16)->i1")
                , ("client_refinement_transport_state", "external provider must bind transport-local offered set to exact prior Hello")
                , ("wire_unsupported", "0x00")
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoiceCertification.hs',
          '''exact server selectors, exact client receiver and branch-local UInt16 binding, preservation of payload/cancel physical lowering, and absence of ambient choice/version/transport state, while provider set-selection semantics, opaque version-set representation, concrete byte I/O, malformed-input non-return, physical write success, provider conformance, LLVM 18, linking, and native execution remain external gates."
          ''',
          '''exact server selectors, exact client receiver and branch-local UInt16 binding, explicit transport-scoped client refinement of the decoded UInt16, preservation of payload/cancel physical lowering, and absence of global ambient choice/version/transport state, while provider set-selection semantics, exact transport-local association with the versions sent in the prior Hello, opaque version-set representation, concrete byte I/O, malformed-input non-return, physical write success, provider conformance, LLVM 18, linking, and native execution remain external gates."
          ''')
          replace_once('src/Phil/LLVM/VersionSessionChoiceCertification.hs',
          '''            , "client receiver maps false->unsupported true->version and binds selected UInt16 only on version"
                , "payload/cancel and final-response physical lowerings remain intact"
          ''',
          '''            , "client receiver maps false->unsupported true->version and binds selected UInt16 only on version"
                , "client refinement consumes exact transport plus decoded selected UInt16"
                , "payload/cancel and final-response physical lowerings remain intact"
          ''')

          # Runtime ABI and fixture.
          replace_once('runtime/phase0/version_session_choice_v1.h',
          '''bool phil_runtime_receive_version_choice(
              void *transport,
              uint16_t *selected_version_out);
          ''',
          '''bool phil_runtime_receive_version_choice(
              void *transport,
              uint16_t *selected_version_out);
          bool phil_runtime_refine_selected_version(
              void *transport,
              uint16_t selected_version);
          ''')
          replace_once('runtime/phase0/version_session_choice_v1_smoke_fixture.h',
          '''struct phil_test_choice_transport {
              uint8_t input[PHIL_TEST_WIRE_CAPACITY];
          ''',
          '''struct phil_test_choice_transport {
              const struct phil_test_version_set *offered_versions;
              uint8_t input[PHIL_TEST_WIRE_CAPACITY];
          ''')
          replace_once('runtime/phase0/version_session_choice_v1_smoke.c',
          '''bool phil_runtime_receive_version_choice(
              void *transport_value,
              uint16_t *selected_version_out) {
          ''',
          '''bool phil_runtime_refine_selected_version(
              void *transport_value,
              uint16_t selected_version) {
              struct phil_test_choice_transport *transport = as_transport(transport_value);
              size_t i;
              if (transport->offered_versions == NULL
                  || transport->offered_versions->length > PHIL_TEST_VERSION_CAPACITY) {
                  abort();
              }
              for (i = 0; i < transport->offered_versions->length; ++i) {
                  if (transport->offered_versions->values[i] == selected_version) {
                      return true;
                  }
              }
              return false;
          }

          bool phil_runtime_receive_version_choice(
              void *transport_value,
              uint16_t *selected_version_out) {
          ''')
          replace_once('runtime/phase0/version_session_choice_v1_smoke_main.c',
          '''    reset_transport(&transport);
              transport.input[0] = 0x00u;
          ''',
          '''    reset_transport(&transport);
              transport.offered_versions = &hello.versions;
              if (!phil_runtime_refine_selected_version(&transport, 2u)
                  || phil_runtime_refine_selected_version(&transport, 9u)) {
                  fputs("selected-version refinement mismatch\n", stderr);
                  return 1;
              }

              reset_transport(&transport);
              transport.input[0] = 0x00u;
          ''')
          replace_once('runtime/phase0/version_session_choice_v1_bad_ambient.c',
          '''bool phil_runtime_receive_version_choice(uint16_t *selected_version_out) {
              (void) selected_version_out;
              return false;
          }
          ''',
          '''bool phil_runtime_receive_version_choice(uint16_t *selected_version_out) {
              (void) selected_version_out;
              return false;
          }
          bool phil_runtime_refine_selected_version(uint16_t selected_version) {
              (void) selected_version;
              return false;
          }
          ''')

          # Focused Haskell test checks the physical refinement terminator/call.
          replace_once('test/VersionSessionChoiceABIMain.hs',
          '''      let expectedTerm = LLVMVersionChoiceOffer
                    (unValueId (versionChoiceClientTransport witness))
                    (unValueId (versionChoiceClientSelectedVersion witness))
                    (LLVMBlockId (unBlockId (versionChoiceClientVersionTarget witness)))
                    (LLVMBlockId (unBlockId (versionChoiceClientUnsupportedTarget witness)))
                  expectedBinding = LLVMVersionChoicePayloadBinding
                    (unValueId (versionChoiceClientSelectedVersion witness))
              pure (llvmBlockTerminator offer == expectedTerm
                && expectedBinding `elem` llvmBlockOps target)
          ''',
          '''      let expectedTerm = LLVMVersionChoiceOffer
                    (unValueId (versionChoiceClientTransport witness))
                    (unValueId (versionChoiceClientSelectedVersion witness))
                    (LLVMBlockId (unBlockId (versionChoiceClientVersionTarget witness)))
                    (LLVMBlockId (unBlockId (versionChoiceClientUnsupportedTarget witness)))
                  expectedBinding = LLVMVersionChoicePayloadBinding
                    (unValueId (versionChoiceClientSelectedVersion witness))
                  refinementOkay = case llvmBlockTerminator target of
                    LLVMVersionRefinement _ transport selected yes no ->
                      transport == unValueId (versionChoiceClientTransport witness)
                        && selected == unValueId (versionChoiceClientSelectedVersion witness)
                        && yes == LLVMBlockId (unBlockId (versionChoiceClientVersionSuccess witness))
                        && no == LLVMBlockId (unBlockId (versionChoiceClientVersionFailure witness))
                    _ -> False
              pure (llvmBlockTerminator offer == expectedTerm
                && expectedBinding `elem` llvmBlockOps target
                && refinementOkay)
          ''')
          replace_once('test/VersionSessionChoiceABIMain.hs',
          '''      , "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)"
                ]
          ''',
          '''      , "declare i1 @phil_runtime_receive_version_choice(ptr, ptr)"
                , "declare i1 @phil_runtime_refine_selected_version(ptr, i16)"
                ]
          ''')

          # ABI note: make the residual association explicit.
          p = Path('docs/phase-0/version-session-choice-abi-v1.md')
          text = p.read_text()
          marker = "## Malformed input and failure behavior\n"
          insert = '''## Client selected-version refinement\n\nAfter decoding `version(selected)`, the client refinement is a physical runtime boundary:\n\n```llvm\ndeclare i1 @phil_runtime_refine_selected_version(ptr %transport, i16 %selected)\n```\n\nThe transport operand is explicit and identifies the session-local state. The runtime provider must associate that transport with the exact versions placed in the client's prior `Hello`; this association is an external provider obligation in the translation-only `PHIL-LLVM-CERT-010` tranche. No global/current selected-version or offered-version slot is permitted.\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('ABI note malformed-input heading anchor mismatch')
          p.write_text(text.replace(marker, insert + marker, 1))
          PY

          git diff --check
          git rm .github/workflows/version-refinement-fix.yml
          git config user.name "phil-version-lowering-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/Phil/LLVM/IR.hs \
            src/Phil/LLVM/VersionSessionChoice.hs \
            src/Phil/LLVM/VersionSessionChoiceCertification.hs \
            runtime/phase0/version_session_choice_v1.h \
            runtime/phase0/version_session_choice_v1_smoke_fixture.h \
            runtime/phase0/version_session_choice_v1_smoke.c \
            runtime/phase0/version_session_choice_v1_smoke_main.c \
            runtime/phase0/version_session_choice_v1_bad_ambient.c \
            test/VersionSessionChoiceABIMain.hs \
            docs/phase-0/version-session-choice-abi-v1.md
          git commit -m "Make client version refinement explicit"
          git push origin HEAD:lower-version-session-choice
