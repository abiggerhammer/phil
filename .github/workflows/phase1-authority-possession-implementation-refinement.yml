name: Phase 1 Authority Possession Implementation Refinement

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'proof/Phil/Core/AuthorityPossessionImplementation.v'
      - 'proof/Phil/Core/AuthorityPossessionImplementationExtraction.v'
      - 'docs/phase-1/authority-possession-implementation-refinement-v1.md'
      - 'src/AuthorityPossessionKernel.hs'
      - 'src/Phil/Core/Authority.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - '.github/workflows/phase1-authority-possession-implementation-refinement.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/GenericStructural.v'
      - 'proof/Phil/Core/AuthorityPossession.v'
      - 'proof/Phil/Core/AuthorityPossessionImplementation.v'
      - 'proof/Phil/Core/AuthorityPossessionImplementationExtraction.v'
      - 'docs/phase-1/authority-possession-implementation-refinement-v1.md'
      - 'src/AuthorityPossessionKernel.hs'
      - 'src/Phil/Core/Authority.hs'
      - 'test/Phase1AuthorityPossessionMain.hs'
      - '.github/workflows/phase1-authority-possession-implementation-refinement.yml'

permissions:
  contents: read

jobs:
  rocq-authority-possession-implementation-refinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compile certified authority model and executable correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityPossession.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityPossessionImplementation.v

      - name: Fresh-extract and compare authority possession kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f AuthorityPossessionKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/AuthorityPossessionImplementationExtraction.v
          test -s AuthorityPossessionKernel.hs
          grep -q 'decideAuthorityExerciseFacts' AuthorityPossessionKernel.hs
          grep -q 'decideAuthorityCopy' AuthorityPossessionKernel.hs
          grep -q 'decideAuthorityDrop' AuthorityPossessionKernel.hs
          if ! cmp -s AuthorityPossessionKernel.hs src/AuthorityPossessionKernel.hs; then
            diff -u src/AuthorityPossessionKernel.hs AuthorityPossessionKernel.hs || true
            exit 1
          fi
          sha256sum AuthorityPossessionKernel.hs
          mkdir -p authority-possession-implementation-refinement-proof
          cp \
            proof/Phil/Core/AuthorityPossession.v \
            proof/Phil/Core/AuthorityPossessionImplementation.v \
            proof/Phil/Core/AuthorityPossessionImplementation.vo \
            AuthorityPossessionKernel.hs \
            authority-possession-implementation-refinement-proof/

      - uses: actions/upload-artifact@v4
        with:
          name: rocq-authority-possession-implementation-refinement
          path: authority-possession-implementation-refinement-proof
          if-no-files-found: error

  verify-authority-possession-production-binding:
    needs: rocq-authority-possession-implementation-refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Typecheck exact kernel and bound authority production path
        run: |
          set -euo pipefail
          ghc -isrc -Wall -Werror -c src/AuthorityPossessionKernel.hs
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Core/Authority.hs \
            test/Phase1AuthorityPossessionMain.hs

      - name: Run bound AUTH-001, AUTH-002, and AUTH-005 correspondence corpus
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc test/Phase1AuthorityPossessionMain.hs

      - name: Record production closeout identities
        run: |
          set -euo pipefail
          mkdir -p authority-possession-production-binding
          sha256sum \
            src/AuthorityPossessionKernel.hs \
            src/Phil/Core/Authority.hs \
            test/Phase1AuthorityPossessionMain.hs \
            > authority-possession-production-binding/PHIL-AUTH-POSSESS-IMPL-001.correspondence.sha256
          cat authority-possession-production-binding/PHIL-AUTH-POSSESS-IMPL-001.correspondence.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: phil-authority-possession-production-binding
          path: authority-possession-production-binding
          if-no-files-found: error
