name: Temporary CALL-019 Surface Decision Bridge

on:
  push:
    branches:
      - phase1-call019-surface-decision-bridge

permissions:
  contents: read

jobs:
  call019-surface-decision-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        shell: bash
        run: |
          set -euo pipefail
          cabal build all --enable-tests

      - name: Exercise CALL-019 callable decide bridge
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019SurfaceDecisionBridgeMain.hs

      - name: Replay CALL-019 outcome dispatch
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019OutcomeDispatchMain.hs

      - name: Replay CALL-019 authority possession bridge
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019AuthorityPossessionMain.hs

      - name: Replay CALL-019 invocation context enforcement
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019InvocationContextMain.hs

      - name: Replay Steve invoke integration
        shell: bash
        run: |
          set -euo pipefail
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1INT006SteveApplicationShellMain.hs
