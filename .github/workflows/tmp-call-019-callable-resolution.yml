name: Temporary CALL-019 Callable Resolution

on:
  workflow_dispatch:
  push:
    branches: [phase1-call-019-component-invocation]
    paths:
      - 'src/Phil/Compiler/CallableInvocation.hs'
      - 'test/Phase1CALL019CallableResolutionMain.hs'
      - '.github/workflows/tmp-call-019-callable-resolution.yml'

permissions:
  contents: read

jobs:
  callable-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck CALL-019 resolution substrate
        run: |
          cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code \
            test/Phase1CALL019CallableResolutionMain.hs

      - name: Exercise exact callable resolution and rejection corpus
        run: |
          cabal exec -- runghc -isrc -itest -Wall -Werror \
            test/Phase1CALL019CallableResolutionMain.hs

      - name: Replay callable refinement authority
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1CallableRefinementMain.hs

      - name: Replay ordinary SourceBundle checking
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT001OrdinarySourceBundleMain.hs

      - name: Replay Steve shell foundation
        run: cabal exec -- runghc -isrc -itest -Wall -Werror test/Phase1INT006SteveApplicationShellMain.hs
