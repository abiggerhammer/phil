name: Temporary INT-001 Steve ordinary provider source

on:
  push:
    paths:
      - 'examples/steve/**'
      - 'test/Phase1INT001SteveOrdinaryProviderSourceMain.hs'
      - '.github/workflows/tmp-int-001-steve-provider-source.yml'

permissions:
  contents: write

jobs:
  stage-steve-provider-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-int-001-steve-ordinary-provider-source
          fetch-depth: 0
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Apply generic provider-decision source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def lines(*xs):
              return "\n".join(xs) + "\n"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact patch site, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/Phil/Surface/Check/Types.hs',
              lines('  , PrimitiveSemantics (..)', '  , ReleaseRequirement (..)'),
              lines('  , PrimitiveArgumentDiscipline (..)', '  , ProviderOutcomeSpec (..)', '  , PrimitiveSemantics (..)', '  , ReleaseRequirement (..)'))

          replace_once(
              'src/Phil/Surface/Check/Types.hs',
              lines('data PrimitiveSemantics', '  = PrimitiveSupportedVersions'),
              lines(
                  'data PrimitiveArgumentDiscipline',
                  '  = PrimitiveReadOnly',
                  '  | PrimitiveConsume',
                  '  deriving (Eq, Ord, Show)',
                  '',
                  'data ProviderOutcomeSpec = ProviderOutcomeSpec',
                  '  { providerOutcomeLabel :: Text',
                  '  , providerOutcomePayload :: [(Mode, Ty)]',
                  '  }',
                  '  deriving (Eq, Ord, Show)',
                  '',
                  'data PrimitiveSemantics',
                  '  = PrimitiveSupportedVersions'))

          replace_once(
              'src/Phil/Surface/Check/Types.hs',
              lines('  | PrimitiveContinueCommonState', '  | PrimitiveHandlePayload', '  deriving (Eq, Ord, Show)'),
              lines('  | PrimitiveContinueCommonState', '  | PrimitiveProviderDecision [PrimitiveArgumentDiscipline] [ProviderOutcomeSpec]', '  | PrimitiveHandlePayload', '  deriving (Eq, Ord, Show)'))

          replace_once(
              'src/Phil/Surface/Check/Types.hs',
              lines('  | DigestDecision Proposition', '  | StoreDecision', '  deriving (Eq, Show)'),
              lines('  | DigestDecision Proposition', '  | StoreDecision', '  | ProviderDecision [ProviderOutcomeSpec]', '  deriving (Eq, Show)'))

          replace_once(
              'src/Phil/Surface/Check.hs',
              lines('  , PrimitiveSemantics (..)', '  , ReleaseRequirement (..)'),
              lines('  , PrimitiveArgumentDiscipline (..)', '  , ProviderOutcomeSpec (..)', '  , PrimitiveSemantics (..)', '  , ReleaseRequirement (..)'))

          replace_once(
              'src/Phil/Surface/Parser.hs',
              lines(
                  'pCasePattern :: Parser CasePattern',
                  'pCasePattern = do',
                  '  label <- rawIdentifier',
                  '  binders <- optional (parens (identifier `MP.sepBy` symbol ","))',
                  '  pure (CasePattern label (maybe [] id binders))'),
              lines(
                  'pCasePattern :: Parser CasePattern',
                  'pCasePattern = do',
                  '  label <- caseLabel',
                  '  binders <- optional (parens (identifier `MP.sepBy` symbol ","))',
                  '  pure (CasePattern label (maybe [] id binders))',
                  '',
                  '-- Case labels are protocol/provider outcome tokens, not ordinary term',
                  '-- identifiers. Hyphens are admitted only here so `not-found` and',
                  '-- `storage-failure` remain single semantic labels without changing',
                  '-- subtraction or ordinary identifier lexing.',
                  'caseLabel :: Parser Text',
                  'caseLabel = lexeme $',
                  '  Text.pack <$> ((:) <$> identifierStart <*> MP.many caseLabelContinue)',
                  '  where',
                  "    caseLabelContinue = identifierContinue <|> MPC.char '-'"))

          replace_once(
              'src/Phil/Surface/Check/Engine.hs',
              lines('    PrimitiveContinueCommonState -> readArguments 1 >> unit', '    PrimitiveHandlePayload -> unit'),
              lines(
                  '    PrimitiveContinueCommonState -> readArguments 1 >> unit',
                  '    PrimitiveProviderDecision disciplines outcomes -> do',
                  '      arity (length disciplines)',
                  '      when (null outcomes) $',
                  '        throw located TypeMismatch "provider decision declares no outcomes"',
                  '      let labels = map providerOutcomeLabel outcomes',
                  '      unless (Set.size (Set.fromList labels) == length labels) $',
                  '        throw located TypeMismatch "provider decision outcome labels are not unique"',
                  '      next <- foldM applyProviderArgument state (zip disciplines arguments)',
                  '      Right',
                  '        [ valuePath next (RuntimeScalar',
                  '            (ScalarValue Unrestricted',
                  '              (TyOpaque "ProviderDecision")',
                  '              (DecisionShape (ProviderDecision outcomes))))',
                  '        ]',
                  '    PrimitiveHandlePayload -> unit'))

          replace_once(
              'src/Phil/Surface/Check/Engine.hs',
              lines(
                  '    consumeRestrictedIfNamed current expression = case locatedValue expression of',
                  '      VariableExpression name -> case Map.lookup name (stateBindings current) of',
                  '        Just meta | bindingMode meta /= Unrestricted ->',
                  '          snd <$> moveVariable expression name current',
                  '        _ -> Right current',
                  '      _ -> Right current'),
              lines(
                  '    consumeRestrictedIfNamed current expression = case locatedValue expression of',
                  '      VariableExpression name -> case Map.lookup name (stateBindings current) of',
                  '        Just meta | bindingMode meta /= Unrestricted ->',
                  '          snd <$> moveVariable expression name current',
                  '        _ -> Right current',
                  '      _ -> Right current',
                  '',
                  '    applyProviderArgument current (discipline, expression) =',
                  '      case discipline of',
                  '        PrimitiveReadOnly -> do',
                  '          _ <- inferReadOnlyScalar environment current expression',
                  '          Right current',
                  '        PrimitiveConsume -> do',
                  '          (value, next) <- moveVariableArgument current expression',
                  '          when (scalarMode value == Unrestricted) $',
                  '            throw expression StructuralUse',
                  '              "provider consume argument requires an affine or linear owner"',
                  '          Right next'))

          replace_once(
              'src/Phil/Surface/Check/Engine.hs',
              lines('  DigestDecision {} -> ["rejected", "accepted"]', '  StoreDecision -> ["failure", "success"]'),
              lines('  DigestDecision {} -> ["rejected", "accepted"]', '  StoreDecision -> ["failure", "success"]', '  ProviderDecision outcomes -> map providerOutcomeLabel outcomes'))

          replace_once(
              'src/Phil/Surface/Check/Engine.hs',
              lines(
                  '    (StoreDecision, "failure", [reason]) ->',
                  '      insertBindingMeta (locatedSpan located) reason',
                  '        (BindingMeta Unrestricted (TyOpaque "StorageFailure") PlainShape) state',
                  '    _ -> throw located TypeMismatch'),
              lines(
                  '    (StoreDecision, "failure", [reason]) ->',
                  '      insertBindingMeta (locatedSpan located) reason',
                  '        (BindingMeta Unrestricted (TyOpaque "StorageFailure") PlainShape) state',
                  '    (ProviderDecision outcomes, providerLabel, providerBinders) ->',
                  '      case',
                  '        [ providerOutcomePayload outcome',
                  '        | outcome <- outcomes',
                  '        , providerOutcomeLabel outcome == providerLabel',
                  '        ] of',
                  '        [payload]',
                  '          | length payload == length providerBinders ->',
                  '              foldM',
                  '                (\\current (name, (mode, ty)) ->',
                  '                  insertBindingMeta (locatedSpan located) name',
                  '                    (BindingMeta mode ty (shapeForBinding name (shapeForType ty)))',
                  '                    current)',
                  '                state',
                  '                (zip providerBinders payload)',
                  '        _ -> throw located TypeMismatch',
                  '          "provider decision arm binder shape is incompatible with the declared outcome"',
                  '    _ -> throw located TypeMismatch'))
          PY

      - name: Build complete Haskell substrate
        run: cabal build all --enable-tests

      - name: Strict typecheck generic provider source surface
        run: |
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            src/Phil/Surface/Check/Types.hs \
            src/Phil/Surface/Check/Engine.hs \
            src/Phil/Surface/Check.hs \
            src/Phil/Surface/Parser.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code \
            test/Phase1INT001SteveOrdinaryProviderSourceMain.hs

      - name: Execute ordinary Steve provider-source pressure corpus
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001SteveOrdinaryProviderSourceMain.hs

      - name: Replay corresponded Systems admission controls
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001SourceCorePolicyMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT001SourceSystemsMain.hs

      - name: Require witness-neutral production surface
        shell: bash
        run: |
          set -euo pipefail
          if git diff --unified=0 -- \
              src/Phil/Surface/Check/Types.hs \
              src/Phil/Surface/Check/Engine.hs \
              src/Phil/Surface/Check.hs \
              src/Phil/Surface/Parser.hs \
            | grep -E '^\+[^+].*(Steve|Upload)'; then
            echo 'generic provider-source repair must not add witness identity dispatch'
            exit 1
          fi

      - name: Transport validated production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Phil/Surface/Check/Types.hs \
            src/Phil/Surface/Check/Engine.hs \
            src/Phil/Surface/Check.hs \
            src/Phil/Surface/Parser.hs
          git diff --cached --quiet && { echo 'no production repair to transport'; exit 1; }
          git commit -m 'phase1: support generic branch-sensitive provider source'
          git push origin HEAD:phase1-int-001-steve-ordinary-provider-source
