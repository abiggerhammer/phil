name: SURF capability item bootstrap

on:
  push:
    branches:
      - phase1-surf-002-capability-items-parser-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: phase1-surf-002-capability-items-parser
          path: target
          fetch-depth: 0
      - name: Apply capability item patch
        run: git -C target apply ../capability-items.patch
      - name: Commit capability item parser slice
        run: |
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Phil/Surface/GrammarV1/Parser.hs test/Phase1GrammarV1StructuralParserMain.hs
          git commit -m 'Complete SURF-002 capability items'
          git push origin HEAD:phase1-surf-002-capability-items-parser
