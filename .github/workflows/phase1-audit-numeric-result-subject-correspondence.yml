name: Phase 1 Audit Numeric Result Subject Correspondence

on:
  pull_request:
    paths:
      - 'proof/Phil/Assurance/NumericResultSubjectCorrespondence.v'
      - 'docs/phase-1/audit-numeric-result-subject-correspondence-v1.md'
      - '.github/workflows/phase1-audit-numeric-result-subject-correspondence.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Assurance/NumericResultSubjectCorrespondence.v'
      - 'docs/phase-1/audit-numeric-result-subject-correspondence-v1.md'
      - '.github/workflows/phase1-audit-numeric-result-subject-correspondence.yml'

permissions:
  contents: read

jobs:
  numeric-result-subject-correspondence:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile numeric result-subject correspondence proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/NumericResultSubjectCorrespondence.v
      - name: Record exact proof identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p numeric-result-subject-correspondence
          cp \
            proof/Phil/Assurance/NumericResultSubjectCorrespondence.v \
            proof/Phil/Assurance/NumericResultSubjectCorrespondence.vo \
            numeric-result-subject-correspondence/
          sha256sum \
            numeric-result-subject-correspondence/NumericResultSubjectCorrespondence.v \
            numeric-result-subject-correspondence/NumericResultSubjectCorrespondence.vo \
            > numeric-result-subject-correspondence/D-NUM-RESULT-SUBJECT-01.proof.sha256
          cat numeric-result-subject-correspondence/D-NUM-RESULT-SUBJECT-01.proof.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: numeric-result-subject-correspondence-proof
          path: numeric-result-subject-correspondence
          if-no-files-found: error
