name: Temporary EXEC-024 pragma cleanup

on:
  push:
    branches: [phase1-exec-024-text-literals]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-exec-024-text-literals
      - name: Remove duplicate parser pragmas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Phil/Surface/GrammarV1/Parser.hs')
          text = path.read_text()
          duplicate = '''{-# LANGUAGE PatternSynonyms #-}\n{-# LANGUAGE ViewPatterns #-}\n{-# LANGUAGE PatternSynonyms #-}\n{-# LANGUAGE ViewPatterns #-}\n'''
          clean = '''{-# LANGUAGE PatternSynonyms #-}\n{-# LANGUAGE ViewPatterns #-}\n'''
          if duplicate in text:
              text = text.replace(duplicate, clean, 1)
              path.write_text(text)
          elif text.startswith('{-# LANGUAGE OverloadedStrings #-}\n{-# LANGUAGE PatternSynonyms #-}\n{-# LANGUAGE ViewPatterns #-}\n'):
              print('already clean')
          else:
              raise SystemExit('unexpected parser pragma header')
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Meredith L. Patterson"
          git config user.email "clonearmy@gmail.com"
          git add src/Phil/Surface/GrammarV1/Parser.hs
          git commit -m "phase1: clean text literal parser pragmas"
          git push origin HEAD:phase1-exec-024-text-literals
