name: Phase 1 Foreign Callable Implementation Refinement

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ForeignCallableQualificationImplementation.v'
      - 'proof/Phil/Core/ForeignCallableQualificationImplementationExtraction.v'
      - 'docs/phase-1/foreign-callable-implementation-refinement-v1.md'
      - '.github/workflows/phase1-foreign-callable-implementation-refinement.yml'
      - 'src/ForeignCallableQualificationKernel.hs'
      - 'src/Phil/Core/CallableQualification.hs'
      - 'src/Phil/Core/CallableQualification/Bound.hs'
      - 'test/Phase1ForeignCallableQualificationMain.hs'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/ForeignCallableQualificationImplementation.v'
      - 'proof/Phil/Core/ForeignCallableQualificationImplementationExtraction.v'
      - 'docs/phase-1/foreign-callable-implementation-refinement-v1.md'
      - '.github/workflows/phase1-foreign-callable-implementation-refinement.yml'
      - 'src/ForeignCallableQualificationKernel.hs'
      - 'src/Phil/Core/CallableQualification.hs'
      - 'src/Phil/Core/CallableQualification/Bound.hs'
      - 'test/Phase1ForeignCallableQualificationMain.hs'

permissions:
  contents: read

jobs:
  rocq-foreign-callable-implementation-refinement:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile CALL-015 implementation-refinement proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/GenericStructural.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableMode.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableLifecycle.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/CallableRefinement.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ForeignCallableQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ForeignCallableQualificationImplementation.v
      - name: Regenerate and bind proved CALL-015 qualification kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rm -f ForeignCallableQualificationKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/ForeignCallableQualificationImplementationExtraction.v
          test -s ForeignCallableQualificationKernel.hs
          grep -q '^module ForeignCallableQualificationKernel where' ForeignCallableQualificationKernel.hs
          grep -q '^decideForeignQualification ::' ForeignCallableQualificationKernel.hs
          if ! cmp -s ForeignCallableQualificationKernel.hs src/ForeignCallableQualificationKernel.hs; then
            echo 'checked-in CALL-015 kernel differs from fresh Rocq extraction' >&2
            diff -u src/ForeignCallableQualificationKernel.hs ForeignCallableQualificationKernel.hs || true
            exit 1
          fi
          sha256sum ForeignCallableQualificationKernel.hs src/ForeignCallableQualificationKernel.hs
          mkdir -p foreign-callable-implementation-refinement-proof
          cp \
            proof/Phil/Core/ForeignCallableQualificationImplementation.v \
            proof/Phil/Core/ForeignCallableQualificationImplementation.vo \
            proof/Phil/Core/ForeignCallableQualificationImplementationExtraction.v \
            ForeignCallableQualificationKernel.hs \
            foreign-callable-implementation-refinement-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-foreign-callable-implementation-refinement
          path: foreign-callable-implementation-refinement-proof
          if-no-files-found: error

  verify-production-foreign-callable:
    needs: rocq-foreign-callable-implementation-refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - uses: actions/download-artifact@v4
        with:
          name: rocq-foreign-callable-implementation-refinement
          path: foreign-callable-implementation-refinement-proof
      - name: Typecheck extracted and checked-in qualification kernel
        run: |
          set -euo pipefail
          cmp -s \
            foreign-callable-implementation-refinement-proof/ForeignCallableQualificationKernel.hs \
            src/ForeignCallableQualificationKernel.hs
          ghc -Wall -Werror -fno-code src/ForeignCallableQualificationKernel.hs
          ghc -isrc -Wall -Werror -fno-code src/Phil/Core/CallableQualification.hs
      - name: Exercise production CALL-015 path through extracted gate and CALL-012
        run: |
          set -euo pipefail
          cabal build exe:phil-certify-core-scalar --ghc-options=-Werror
          cabal exec -- runghc -isrc test/Phase1CallableRefinementMain.hs
          cabal exec -- runghc -isrc test/Phase1ForeignCallableQualificationMain.hs
