name: Independent borrow rebinding audit

on:
  push:
    branches: [audit-callable-binding-replay-20260926]
    paths:
      - .github/workflows/phase1-audit-borrow-rebinding-independent.yml

permissions:
  contents: read

jobs:
  pinned-rebinding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout independent driver
        uses: actions/checkout@v4
        with:
          path: audit-driver
          persist-credentials: false
      - name: Checkout exact production subject
        uses: actions/checkout@v4
        with:
          ref: 0d96a19950b70a3ca0897f4467f0579172c49991
          path: subject
          persist-credentials: false
      - name: Set up supported Haskell toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.16.1.0'
      - name: Preserve exact inputs and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { uname -a; ghc --version; cabal --version; ghc-pkg list; } > evidence/environment.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('subject'); out=pathlib.Path('evidence')
          def git(where,*args):
              return subprocess.check_output(['git','-C',str(where),*args])
          pin='0d96a19950b70a3ca0897f4467f0579172c49991'
          assert git(root,'rev-parse','HEAD').decode().strip()==pin
          status=git(root,'status','--porcelain','--untracked-files=all')
          assert not status
          (out/'source-before.txt').write_bytes(status)
          driver='audit/ownership-loan-review/BorrowRebinding.hs'
          assert git('audit-driver','rev-parse','HEAD:'+driver).decode().strip()=='8e657645f78f220598789cef271f4b33c7770d11'
          selected=['src/Phil/Core/Context.hs','src/Phil/Core/Checker.hs','src/Phil/Core/Value.hs',
                    'src/Phil/Surface/Check.hs','src/Phil/Surface/Check/Engine.hs',
                    'src/Phil/Surface/Check/Support.hs','src/Phil/Surface/Check/Preflight.hs',
                    'src/Phil/Surface/Check/Types.hs','src/Phil/Surface/Phase0.hs',
                    'src/Phil/Surface/Parser.hs','test/Phase1AuditBorrowScopeMain.hs']
          records=[]
          for path in selected:
              data=(root/path).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              expected=git(root,'rev-parse','HEAD:'+path).decode().strip()
              assert actual==expected
              dest=out/'source'/path; dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              records.append({'path':path,'git_blob':actual,'sha256':hashlib.sha256(data).hexdigest()})
          (out/'BorrowRebinding.hs').write_bytes((pathlib.Path('audit-driver')/driver).read_bytes())
          (out/'workflow.yml').write_bytes(pathlib.Path('audit-driver/.github/workflows/phase1-audit-borrow-rebinding-independent.yml').read_bytes())
          (out/'provenance.json').write_text(json.dumps({'production':pin,
              'driver_commit':git('audit-driver','rev-parse','HEAD').decode().strip(),
              'driver_blob':'8e657645f78f220598789cef271f4b33c7770d11','sources':records,
              'scope':'Independent source-checker regression for existing BORROW-LOCAL; no production edits or native execution.'},indent=2)+'\n')
          PY
      - name: Build pinned production library
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cabal build lib:phil-core 2>&1 | tee ../evidence/build.log
      - name: Compile independent assertions strictly
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/objects
          cabal exec -- ghc -O0 -isrc -Wall -Werror \
            -outputdir ../evidence/objects \
            ../audit-driver/audit/ownership-loan-review/BorrowRebinding.hs \
            -o ../evidence/borrow-rebinding 2>&1 | tee ../evidence/compile.log
      - name: Execute assertions and retain actual nonzero outcome
        working-directory: subject
        shell: bash
        run: |
          set -uo pipefail
          ../evidence/borrow-rebinding > ../evidence/results.stdout 2> ../evidence/results.stderr
          result=$?
          printf '%s\n' "$result" > ../evidence/exit-code.txt
          cat ../evidence/results.stdout
          cat ../evidence/results.stderr >&2
          exit 0
      - name: Verify source preservation and seal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,subprocess
          out=pathlib.Path('evidence');out.mkdir(exist_ok=True)
          status=subprocess.check_output(['git','-C','subject','status','--porcelain','--untracked-files=all'])
          (out/'source-after.txt').write_bytes(status)
          assert not status, 'production checkout changed'
          objects=out/'objects'
          if objects.exists(): shutil.rmtree(objects)
          records=[]
          for path in sorted(out.rglob('*')):
              if path.is_file() and path.name!='payload-seal.json':
                  data=path.read_bytes();records.append({'file':path.relative_to(out).as_posix(),
                    'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'payload-seal.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Archive original execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phil-independent-borrow-rebinding
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Require correctness rather than measurement success
        shell: bash
        run: test "$(cat evidence/exit-code.txt)" = 0
