name: Phase 1 P8-F1 finite recursive inversion

on:
  pull_request:
    paths:
      - 'proof/Phil/Verification/P8F1RecursiveInverseModel.v'
      - 'test/P8F1RecursiveInverseMain.hs'
      - 'docs/phase-1/p8-f1-recursive-inversion.md'
      - '.github/workflows/phase1-p8-f1-recursive-inversion.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Verification/P8F1RecursiveInverseModel.v'
      - 'test/P8F1RecursiveInverseMain.hs'
      - 'docs/phase-1/p8-f1-recursive-inversion.md'
      - '.github/workflows/phase1-p8-f1-recursive-inversion.yml'

permissions:
  contents: read

jobs:
  strict-native-diagnostic-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build native production and all tests strictly
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Compile independent native differential with strict warnings
        run: cabal exec -- ghc -isrc -itest -Wall -Werror -fno-code test/P8F1RecursiveInverseMain.hs
      - name: Exercise actual codec and independent negatives
        run: cabal exec -- runghc -isrc -Wall -Werror test/P8F1RecursiveInverseMain.hs
      - name: Preserve real source and final-stage controls
        run: |
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1INT005CertifiedReleaseEnvelopeMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1VerificationSourceArtifactClosureMain.hs
          cabal exec -- runghc -isrc -Wall -Werror test/Phase1StageClosureMain.hs

  rocq-recursive-inverse:
    runs-on: ubuntu-24.04
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile entire dependent representation proof chain with assumptions and checks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/$COMPILER/bin:$PATH"
          rocq -v
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8E1CanonicalWireModel P8E2CanonicalApplicationModel P8F1RecursiveInverseModel; do
            rocq c -Q proof/Phil Phil "proof/Phil/Verification/$name.v" | tee -a /tmp/p8-f1-assumptions.log
          done
          for name in P8UnicodeUtf8Model P8D1UnicodeStreamModel P8D2StructuralOrderModel P8E1CanonicalWireModel P8E2CanonicalApplicationModel P8F1RecursiveInverseModel; do
            rocq check -Q proof/Phil Phil "Phil.Verification.$name"
          done
          sha256sum proof/Phil/Verification/P8*.vo /tmp/p8-f1-assumptions.log
