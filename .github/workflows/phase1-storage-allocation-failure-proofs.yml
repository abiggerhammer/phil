name: Phase 1 Storage Allocation Failure Proofs

on:
  pull_request:
    paths:
      - 'proof/Phil/Core/ArchitectureIdentity.v'
      - 'proof/Phil/Core/ArchitectureInstantiation.v'
      - 'proof/Phil/Core/ProviderReplacementQualification.v'
      - 'proof/Phil/Core/ArchitectureRealization.v'
      - 'proof/Phil/Systems/FactDisposition.v'
      - 'proof/Phil/Assurance/ValidityScope.v'
      - 'proof/Phil/Core/SystemsStageClosure.v'
      - 'proof/Phil/Core/SystemsRealizationEffects.v'
      - 'proof/Phil/Core/SystemsSubjectAuthority.v'
      - 'proof/Phil/Core/StorageRealization.v'
      - 'proof/Phil/Core/StorageAllocationFailure.v'
      - 'proof/Phil/Core/StorageAllocationFailureImplementation.v'
      - 'proof/Phil/Core/StorageAllocationFailureImplementationExtraction.v'
      - 'src/StorageRealizationKernel.hs'
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/Systems/StorageRealizationCertification.hs'
      - 'app/StorageRealizationProductionBindingMain.hs'
      - 'app/StorageAllocationFailureDecisionCorrespondenceMain.hs'
      - 'test/Phase1StorageRealizationMain.hs'
      - 'docs/phase-1/storage-allocation-failure-proof-v1.md'
      - 'docs/phase-1/storage-allocation-failure-implementation-refinement-v1.md'
      - '.github/workflows/phase1-storage-allocation-failure-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'proof/Phil/Core/StorageAllocationFailure.v'
      - 'proof/Phil/Core/StorageAllocationFailureImplementation.v'
      - 'proof/Phil/Core/StorageAllocationFailureImplementationExtraction.v'
      - 'src/StorageRealizationKernel.hs'
      - 'src/Phil/Systems/Storage.hs'
      - 'src/Phil/Systems/StorageRealizationCertification.hs'
      - 'app/StorageRealizationProductionBindingMain.hs'
      - 'app/StorageAllocationFailureDecisionCorrespondenceMain.hs'
      - 'test/Phase1StorageRealizationMain.hs'
      - 'docs/phase-1/storage-allocation-failure-proof-v1.md'
      - 'docs/phase-1/storage-allocation-failure-implementation-refinement-v1.md'
      - '.github/workflows/phase1-storage-allocation-failure-proofs.yml'

permissions:
  contents: read

jobs:
  rocq-storage-allocation-failure-proof:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Compile certified storage predecessors and PHIL-MEM-FAIL-001 implementation correspondence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureIdentity.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureInstantiation.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ProviderReplacementQualification.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/ArchitectureRealization.v
          rocq c -Q proof/Phil Phil proof/Phil/Systems/FactDisposition.v
          rocq c -Q proof/Phil Phil proof/Phil/Assurance/ValidityScope.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsStageClosure.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsRealizationEffects.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/SystemsSubjectAuthority.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageRealization.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageAllocationFailure.v
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageAllocationFailureImplementation.v
          rm -f StorageAllocationFailureKernel.hs
          rocq c -Q proof/Phil Phil proof/Phil/Core/StorageAllocationFailureImplementationExtraction.v
          test -s StorageAllocationFailureKernel.hs
      - name: Record proof and exact kernel identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage-allocation-failure-proof
          cp \
            proof/Phil/Core/StorageAllocationFailure.v \
            proof/Phil/Core/StorageAllocationFailure.vo \
            proof/Phil/Core/StorageAllocationFailureImplementation.v \
            proof/Phil/Core/StorageAllocationFailureImplementation.vo \
            StorageAllocationFailureKernel.hs \
            storage-allocation-failure-proof/
          sha256sum \
            proof/Phil/Core/StorageRealization.v \
            proof/Phil/Core/StorageAllocationFailure.v \
            proof/Phil/Core/StorageAllocationFailure.vo \
            proof/Phil/Core/StorageAllocationFailureImplementation.v \
            proof/Phil/Core/StorageAllocationFailureImplementation.vo \
            StorageAllocationFailureKernel.hs \
            src/StorageRealizationKernel.hs \
            src/Phil/Systems/Storage.hs \
            src/Phil/Systems/StorageRealizationCertification.hs \
            app/StorageRealizationProductionBindingMain.hs \
            app/StorageAllocationFailureDecisionCorrespondenceMain.hs \
            test/Phase1StorageRealizationMain.hs \
            > storage-allocation-failure-proof/PHIL-MEM-FAIL-001.implementation.sha256
          {
            echo 'obligation=PHIL-MEM-FAIL-001'
            echo 'predecessor=PHIL-MEM-REALIZE-001'
            echo 'evidence=Rocq-9.2.0+extraction'
            cat storage-allocation-failure-proof/PHIL-MEM-FAIL-001.implementation.sha256
          } > storage-allocation-failure-proof/PHIL-MEM-FAIL-001.implementation-certificate.txt
          cat storage-allocation-failure-proof/PHIL-MEM-FAIL-001.implementation-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-storage-allocation-failure-proof
          path: storage-allocation-failure-proof
          if-no-files-found: error

  verify-storage-allocation-failure-correspondence:
    needs: rocq-storage-allocation-failure-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'
      - name: Build ordinary regression substrate
        run: cabal build all --enable-tests
      - uses: actions/download-artifact@v4
        with:
          name: rocq-storage-allocation-failure-proof
          path: storage-allocation-failure-proof
      - name: Check and execute extracted allocation-failure controls
        run: |
          set -euo pipefail
          cp storage-allocation-failure-proof/StorageAllocationFailureKernel.hs .
          cabal exec -- ghc -i. -Wall -Werror -Wno-unused-imports -fno-code \
            StorageAllocationFailureKernel.hs \
            app/StorageAllocationFailureDecisionCorrespondenceMain.hs
          cabal exec -- runghc -i. -Wall -Werror -Wno-unused-imports \
            app/StorageAllocationFailureDecisionCorrespondenceMain.hs
      - name: Strict typecheck implementation-refined MEM-001 predecessor and unchanged storage corpus
        run: |
          set -euo pipefail
          cabal exec -- ghc -isrc -Wall -Werror -Wno-unused-imports -fno-code src/StorageRealizationKernel.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/Storage.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code src/Phil/Systems/StorageRealizationCertification.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code app/StorageRealizationProductionBindingMain.hs
          cabal exec -- ghc -isrc -Wall -Werror -fno-code test/Phase1StorageRealizationMain.hs
      - name: Re-run implementation-refined MEM-001 predecessor controls
        run: cabal exec -- runghc -isrc -Wall -Werror app/StorageRealizationProductionBindingMain.hs
      - name: Re-run unchanged MEM-001--006 corpus including six MEM-002--003 cases
        run: cabal exec -- runghc -isrc -Wall -Werror test/Phase1StorageRealizationMain.hs
