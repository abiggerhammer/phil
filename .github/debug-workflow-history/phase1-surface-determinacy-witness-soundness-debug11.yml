name: Phase 1 Surface Determinacy Witness Soundness Debug 11

on:
  pull_request:

permissions:
  contents: read

jobs:
  rocq-witness-soundness-debug11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write

      - name: Apply concrete fuel-step diagnostic with surviving call-site rewrites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/phase1-surface-determinacy-witness-soundness-debug10.yml').read_text()
          marker = workflow.index('- name: Apply concrete fuel-step diagnostic with structural rewrites')
          start = workflow.index('          from pathlib import Path', marker)
          end = workflow.index('\n          PY', start)
          code = textwrap.dedent(workflow[start:end])

          namespace = {}
          try:
              exec(compile(code, '<existing-debug10-diagnostics>', 'exec'), namespace)
          except SystemExit as exc:
              message = str(exc)
              if not message.startswith('expected 2 structural safety lift uses, found '):
                  raise
          else:
              raise SystemExit('debug10 unexpectedly completed; diagnostic wrapper is stale')

          path = namespace['path']
          source = namespace['source']

          old_monotone = re.compile(
              r'eapply\s+choice_bodies_nonnullable_fuel_monotone\.\s*'
              r'-\s*unfold\s+expression_child_fuel\s*,\s*expression_fuel\.\s*lia\.\s*'
              r'-\s*exact\s+Hitem_safe\.',
              re.MULTILINE,
          )
          source, monotone_count = old_monotone.subn(
              'apply choice_bodies_nonnullable_child_to_expression.\n'
              '              exact Hitem_safe.',
              source,
          )
          if monotone_count != 2:
              raise SystemExit(
                  f'expected 2 surviving monotonicity call sites, found {monotone_count}')

          nullable_pattern = re.compile(
              r'pose\s+proof\s*'
              r'\(nullable_expression_fuel_succ\s*'
              r'expression_child_fuel\s+expression\s+value\s+Hchild\)\s*'
              r'as\s+Hfull\.\s*'
              r'rewrite\s+<-\s+expression_fuel_is_successor\s+in\s+Hfull\.',
              re.MULTILINE,
          )
          source, nullable_count = nullable_pattern.subn(
              'pose proof\n'
              '              (nullable_expression_fuel_child_to_expression\n'
              '                expression value Hchild)\n'
              '              as Hfull.',
              source,
              count=1,
          )
          if nullable_count != 1:
              raise SystemExit(
                  f'expected 1 nullable successor call site, found {nullable_count}')

          path.write_text(source)
          PY

      - name: Compile witness soundness with timing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationLookahead.v
          timeout 300s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
