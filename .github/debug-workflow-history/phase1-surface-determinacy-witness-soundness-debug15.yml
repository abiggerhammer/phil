name: Phase 1 Surface Determinacy Witness Soundness Debug 15

on:
  pull_request:

permissions:
  contents: read

jobs:
  rocq-witness-soundness-debug15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Derive exact Grammar-v1 inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_phase1_surface_grammar.py --write
          python3 scripts/derive_phase1_surface_determinacy_certificate.py --write

      - name: Apply opaque-case nullable witness diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase1-surface-determinacy-witness-soundness-debug14.yml').read_text()
          marker = workflow.index('- name: Apply depth-safe diagnostic without computed rule extraction')
          start = workflow.index('          from pathlib import Path', marker)
          end = workflow.index('\n          PY', start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<existing-debug14-diagnostics>', 'exec'), {})

          path = Path('proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v')
          source = path.read_text()
          block_start = source.index('Fixpoint nullable_witness_depth_sound')
          block_end = source.index('\nTheorem phase1_surface_nullable_witness_matches_computed_facts', block_start)

          replacement = r'''Definition NullableWitnessDepthProperty
            (expression : EbnfExpression) : Prop :=
            forall fuel,
              nullable_depth_safe_fuel fuel expression = true ->
              nullable_expression_fuel
                fuel phase1_surface_nullable_facts expression = Some true.

          Definition NullableSequenceWitnessDepthProperty
            (items : list EbnfExpression) : Prop :=
            forall fuel,
              nullable_depth_safe_fuel fuel (ESequence items) = true ->
              nullable_expression_fuel
                fuel phase1_surface_nullable_facts
                (ESequence items) = Some true.

          Definition NullableAlternativeWitnessDepthProperty
            (items : list EbnfExpression) : Prop :=
            forall fuel,
              nullable_depth_safe_fuel fuel (EAlternative items) = true ->
              nullable_expression_fuel
                fuel phase1_surface_nullable_facts
                (EAlternative items) = Some true.

          Lemma nullable_depth_nonterminal_case :
            forall name body,
              lookupRule name phase1_surface_rules = Some body ->
              NullableWitness phase1_surface_rules body ->
              NullableWitnessDepthProperty body ->
              NullableWitnessDepthProperty (ENonterminal name).
          Proof.
            intros name body Hlookup Hbody IH.
            unfold NullableWitnessDepthProperty in *.
            intros fuel Hsafe.
            destruct fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - assert (Hbody_safe :
                nullable_depth_safe_fuel expression_fuel body = true).
              {
                apply phase1_surface_rule_body_nullable_depth_safe with name.
                exact Hlookup.
              }
              pose proof (IH expression_fuel Hbody_safe) as Hbody_true.
              pose proof
                (phase1_surface_nullable_lookup_rule name body Hlookup)
                as Hlookup_fact.
              unfold nullable_expression in Hlookup_fact.
              rewrite Hbody_true in Hlookup_fact.
              simpl in Hlookup_fact.
              simpl.
              rewrite Hlookup_fact.
              reflexivity.
          Qed.

          Lemma nullable_depth_sequence_case :
            forall items,
              NullableSequenceWitness phase1_surface_rules items ->
              NullableSequenceWitnessDepthProperty items ->
              NullableWitnessDepthProperty (ESequence items).
          Proof.
            intros items Hitems IH.
            exact IH.
          Qed.

          Lemma nullable_depth_alternative_case :
            forall items,
              NullableAlternativeWitness phase1_surface_rules items ->
              NullableAlternativeWitnessDepthProperty items ->
              NullableWitnessDepthProperty (EAlternative items).
          Proof.
            intros items Hitems IH.
            exact IH.
          Qed.

          Lemma nullable_depth_optional_case :
            forall body,
              NullableWitnessDepthProperty (EOptional body).
          Proof.
            intros body.
            unfold NullableWitnessDepthProperty.
            intros fuel Hsafe.
            destruct fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - reflexivity.
          Qed.

          Lemma nullable_depth_repetition_case :
            forall body,
              NullableWitnessDepthProperty (ERepetition body).
          Proof.
            intros body.
            unfold NullableWitnessDepthProperty.
            intros fuel Hsafe.
            destruct fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - reflexivity.
          Qed.

          Lemma nullable_depth_sequence_nil_case :
            NullableSequenceWitnessDepthProperty [].
          Proof.
            unfold NullableSequenceWitnessDepthProperty.
            intros fuel Hsafe.
            destruct fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - reflexivity.
          Qed.

          Lemma nullable_depth_sequence_cons_case :
            forall item rest,
              NullableWitness phase1_surface_rules item ->
              NullableWitnessDepthProperty item ->
              NullableSequenceWitness phase1_surface_rules rest ->
              NullableSequenceWitnessDepthProperty rest ->
              NullableSequenceWitnessDepthProperty (item :: rest).
          Proof.
            intros item rest Hitem IHitem Hrest IHrest.
            unfold NullableWitnessDepthProperty in IHitem.
            unfold NullableSequenceWitnessDepthProperty in IHrest |- *.
            intros parent_fuel Hsafe.
            destruct parent_fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - simpl in Hsafe.
              apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
              pose proof (IHitem fuel Hitem_safe) as Hitem_true.
              assert (Hrest_expr_safe :
                nullable_depth_safe_fuel
                  (S fuel) (ESequence rest) = true).
              { simpl. exact Hrest_safe. }
              pose proof (IHrest (S fuel) Hrest_expr_safe) as Hrest_true.
              pose proof Hrest_true as Hrest_local.
              simpl in Hrest_local.
              simpl.
              rewrite Hitem_true, Hrest_local.
              reflexivity.
          Qed.

          Lemma nullable_depth_alternative_here_case :
            forall item rest,
              NullableWitness phase1_surface_rules item ->
              NullableWitnessDepthProperty item ->
              NullableAlternativeWitnessDepthProperty (item :: rest).
          Proof.
            intros item rest Hitem IHitem.
            unfold NullableWitnessDepthProperty in IHitem.
            unfold NullableAlternativeWitnessDepthProperty.
            intros parent_fuel Hsafe.
            destruct parent_fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - simpl in Hsafe.
              apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
              pose proof (IHitem fuel Hitem_safe) as Hitem_true.
              assert (Hrest_expr_safe :
                nullable_depth_safe_fuel
                  (S fuel) (EAlternative rest) = true).
              { simpl. exact Hrest_safe. }
              destruct
                (nullable_depth_safe_defined
                  (S fuel) (EAlternative rest) Hrest_expr_safe)
                as [rest_value Hrest_defined].
              pose proof Hrest_defined as Hrest_local.
              simpl in Hrest_local.
              simpl.
              rewrite Hitem_true, Hrest_local.
              reflexivity.
          Qed.

          Lemma nullable_depth_alternative_later_case :
            forall item rest,
              NullableAlternativeWitness phase1_surface_rules rest ->
              NullableAlternativeWitnessDepthProperty rest ->
              NullableAlternativeWitnessDepthProperty (item :: rest).
          Proof.
            intros item rest Hrest IHrest.
            unfold NullableAlternativeWitnessDepthProperty in IHrest |- *.
            intros parent_fuel Hsafe.
            destruct parent_fuel as [| fuel].
            - simpl in Hsafe. discriminate.
            - simpl in Hsafe.
              apply andb_true_iff in Hsafe as [Hitem_safe Hrest_safe].
              destruct
                (nullable_depth_safe_defined fuel item Hitem_safe)
                as [item_value Hitem_defined].
              assert (Hrest_expr_safe :
                nullable_depth_safe_fuel
                  (S fuel) (EAlternative rest) = true).
              { simpl. exact Hrest_safe. }
              pose proof (IHrest (S fuel) Hrest_expr_safe) as Hrest_true.
              pose proof Hrest_true as Hrest_local.
              simpl in Hrest_local.
              simpl.
              rewrite Hitem_defined, Hrest_local.
              destruct item_value; reflexivity.
          Qed.

          Theorem nullable_witness_depth_sound_all :
            (forall expression,
              NullableWitness phase1_surface_rules expression ->
              NullableWitnessDepthProperty expression) /\
            (forall items,
              NullableSequenceWitness phase1_surface_rules items ->
              NullableSequenceWitnessDepthProperty items) /\
            (forall items,
              NullableAlternativeWitness phase1_surface_rules items ->
              NullableAlternativeWitnessDepthProperty items).
          Proof.
            apply NullableWitness_mutind.
            - intros name body Hlookup Hbody IH.
              exact
                (nullable_depth_nonterminal_case
                  name body Hlookup Hbody IH).
            - intros items Hitems IH.
              exact (nullable_depth_sequence_case items Hitems IH).
            - intros items Hitems IH.
              exact (nullable_depth_alternative_case items Hitems IH).
            - intros body.
              exact (nullable_depth_optional_case body).
            - intros body.
              exact (nullable_depth_repetition_case body).
            - exact nullable_depth_sequence_nil_case.
            - intros item rest Hitem IHitem Hrest IHrest.
              exact
                (nullable_depth_sequence_cons_case
                  item rest Hitem IHitem Hrest IHrest).
            - intros item rest Hitem IHitem.
              exact
                (nullable_depth_alternative_here_case
                  item rest Hitem IHitem).
            - intros item rest Hrest IHrest.
              exact
                (nullable_depth_alternative_later_case
                  item rest Hrest IHrest).
          Qed.

          Corollary nullable_witness_depth_sound :
            forall expression
              (witness : NullableWitness phase1_surface_rules expression)
              fuel,
              nullable_depth_safe_fuel fuel expression = true ->
              nullable_expression_fuel
                fuel phase1_surface_nullable_facts expression = Some true.
          Proof.
            intros expression witness fuel Hsafe.
            exact
              ((proj1 nullable_witness_depth_sound_all)
                expression witness fuel Hsafe).
          Qed.
          '''

          source = source[:block_start] + replacement + source[block_end:]
          path.write_text(source)
          print(f'generated witness proof characters: {len(source)}')
          PY

      - name: Compile witness soundness with forced timeout
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/rocq/.opam/${COMPILER}/bin:$PATH"
          rocq c -Q proof/Phil Phil proof/Phil/Surface/Grammar.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivation.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyCertificate.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyNullableFirst.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyFollowOverlap.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacySimpleResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyStructuralResolvers.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDeterminacyPredictiveOracle.v
          rocq c -Q proof/Phil Phil proof/Phil/Surface/GrammarDerivationLookahead.v
          timeout -k 5s 180s rocq c -time -Q proof/Phil Phil \
            proof/Phil/Surface/GrammarDeterminacyWitnessSoundness.v
